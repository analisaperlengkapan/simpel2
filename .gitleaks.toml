# gitleaks config — SIMPEL.
# Schema: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

# Pakai default ruleset built-in.
# Reference: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
title = "SIMPEL gitleaks config"
[extend]
useDefault = true

# ─── Allowlist global ──────────────────────────────────────────────
# Pattern yang sering false-positive di repo ini.
[allowlist]
description = "Global allowlist untuk fixtures, examples, dan placeholder"

paths = [
  # Documentation & ADR
  '''(.+/)?docs/.+\.md''',
  '''(.+/)?CHANGELOG\.md''',
  '''(.+/)?README\.md''',
  '''(.+/)?AGENTS\.md''',
  # Test fixtures
  '''(.+/)?tests?/.*\.(rs|go|php|json|yaml|yml)''',
  '''(.+/)?fixtures?/.*''',
  # Examples & templates
  '''.+\.example''',
  '''.+\.template''',
  '''(.+/)?\.env\.example''',
  '''(.+/)?\.env\..+\.template''',
  # Generated / lock files
  '''Cargo\.lock''',
  '''package-lock\.json''',
  '''pnpm-lock\.yaml''',
  '''yarn\.lock''',
  '''composer\.lock''',
  # Helm chart values templates (placeholder, akan diisi runtime)
  '''infra/helm/.*/values-secrets\.example\.yaml''',
  # Spec/desain `.kiro/` — kelas yang sama dengan docs/*.md di atas.
  '''(.+/)?\.kiro/.+\.md''',
  # Catatan implementasi SCREAMING_CASE (mis. MFA_IMPLEMENTATION_COMPLETE.md):
  # write-up desain berisi contoh payload, bukan konfigurasi yang dimuat.
  '''(.+/)?[A-Z][A-Z0-9_]+\.md''',
  # Contoh yang bisa dijalankan (`examples/*.rs`) — nilainya ilustratif.
  '''(.+/)?examples?/.+\.rs''',
  # Skrip uji end-to-end (mis. layanan/secreton/test_e2e_v3.sh) — payload uji.
  '''(.+/)?test_.+\.sh''',
  # Artefak build; tak pernah di-commit, tapi scan working-tree (`--no-git`)
  # ikut menyusurinya dan rmeta rlib memuat test-vector PEM dari crate hulu.
  '''(.+/)?target/.+''',
]

regexes = [
  # Helm template placeholder (cuma syntax, bukan secret)
  '''\{\{[^}]*\}\}''',
  # Common test/dummy values
  '''(test|dummy|fake|placeholder|example|changeme)[_-]?(password|secret|token|key)''',
  # Base64 padding char di config public
  '''^[A-Za-z0-9+/]{1,15}={0,2}$''',
  # PKI placeholder literal — `pki.rs` mengembalikan string harfiah
  # "[RSA-2048 placeholder key data]" (bukan kunci). Lihat juga catatan
  # duplikat PKI stub di audit secreton (#103).
  '''placeholder key data''',
  # JWT harfiah bertanda `.test` di skrip uji secreton (test_e2e_v3.sh).
  '''^eyJ[A-Za-z0-9_-]+\.test$''',
  # Demo key di contoh audit authenc (`examples/audit_example.rs`).
  '''^sk_live_abc123$''',
  # Contoh key-id KANONIK dari dokumentasi AWS KMS sendiri, dikutip di rustdoc
  # `auto-unseal/{aws_kms,config}.rs`. Menulis ulang justru memperburuk dok.
  '''1234abcd-12ab-34cd-56ef-1234567890ab''',
  # JWT contoh yang SENGAJA dipotong di rustdoc & fixture unit test — diakhiri
  # "...". Perhatikan: header-nya TIDAK diikuti titik pemisah segmen
  # ("eyJhbGciOi...JXVCJ9..."), jadi pola harus mengizinkan nol segmen.
  '''^eyJ[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]*)*\.\.\.$''',
  # Sampel harfiah di rustdoc `storage/secure/mod.rs` (KeyEntry) — string
  # urutan alfabet, plus varian base64-nya.
  '''^0123456789ABCDEFGHIJKLMNOPQRSTUVW$''',
  '''^ABCDEFGHIJKLMNOPQRSTUV$''',
  '''^MDEyMzQ1Njc4OUFCQ0RFRkdISUpLTE1OT1BRUlNUVVZX$''',
  '''^QUJDREVGR0hJSktMTU5PUFFSU1RVVg==$''',
  # UUID contoh kanonik (dipakai luas di dokumentasi/RFC) sebagai captcha_token
  # di unit test authenc `handlers/auth.rs`.
  '''3f2504e0-4f89-41d3-9a0c-0305e82c3301''',
  # Nama algoritma, bukan kunci — unit test secreton `secret_engine.rs`.
  '''chacha20-poly1305''',
  # `authenc.toml` -> `secrets_to_load` memuat NAMA secret yang diambil dari
  # Secreton saat boot, bukan nilainya (nilai di-interpolasi dari env,
  # mis. `jwt_secret = "${JWT_SECRET}"`).
  '''ed25519_private_key''',
]

# ─── Allowlist commit historis ─────────────────────────────────────
# Ditriase 2026-08-01 (gitleaks direproduksi lokal: 119 temuan, 112 di antaranya
# hanya ada di HISTORI — file-nya sudah tak ada di HEAD).
#
# Kenapa allowlist per-COMMIT dan bukan per-path/rewrite history:
#   * per-commit = presisi. Path `infra/**` & `.github/**` MASIH hidup, jadi
#     mem-blacklist path akan menutupi kebocoran BARU di direktori yang sama.
#     Meng-allowlist commit tertentu hanya membebaskan masa lalu yang sudah
#     diperiksa, dan tetap merah bila ada secret baru masuk.
#   * rewrite history (git-filter-repo) ditolak: mengubah ke-2044 SHA,
#     mematikan semua clone/fork + referensi SHA di PR/issue/memori —
#     biaya sangat besar untuk temuan yang terbukti dev-only.
#
# Bukti kenapa temuan ini AMAN (diverifikasi, bukan asumsi):
#   * `nginx/certs/privkey.pem` → cert **mkcert DEVELOPMENT**
#     (issuer "mkcert development CA", O="mkcert development certificate").
#     CA-nya lokal per-mesin developer; tanpa CA itu ter-install, kunci ini
#     tak bisa dipakai MITM apa pun.
#   * `infra/k8s/**`, `k8s/**`, `layanan/secreton/deploy/**` → manifest era
#     PRA-Helm. Namespace staging DI-WIPE 2026-06-17 lalu dibangun ulang dengan
#     secret BARU (lihat memori project_helm_namespace_footgun_safety &
#     project_staging_stale_pre_f5b); production BELUM PERNAH di-deploy.
#     Jadi tak ada satu pun kredensial di sini yang masih berlaku.
#   * `simpel_web-main/**`, `simpel_laravel/**` → app legacy, direktorinya
#     sudah tak ada (digantikan `monolith/simpelv1`).
#   * `.github/workflows/integration-tests.yml` → workflow lama, sudah dihapus.
#
# ⚠️ Kunci Google Maps di `simpel_web-main/...blade.php` TIDAK cukup di-allowlist
# di sini: file-nya PINDAH ke `monolith/simpelv1/...` sehingga kuncinya MASIH
# HIDUP. Itu ditangani terpisah (dipindah ke `config/services.php` + env).
# Pelajaran metode: memisahkan live-vs-histori dengan mencocokkan PATH akan
# meleset untuk rahasia yang berpindah path — pakai `--no-git` lalu iris dengan
# `git ls-files`.
