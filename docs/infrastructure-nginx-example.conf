# Infrastructure Nginx Configuration Example
# Showing how sub-microfrontends should be routed

http {
    # Main microfrontend upstreams
    upstream badiklat {
        server badiklat:3000;
    }
    
    upstream datun {
        server datun:3000;
    }
    
    upstream portal {
        server portal:3000;
    }
    
    # Sub-microfrontends upstreams (pembinaan services)
    upstream pembinaan-keuangan {
        server pembinaan-keuangan:3000;
    }
    
    upstream pembinaan-perencanaan {
        server pembinaan-perencanaan:3000;
    }
    
    upstream pembinaan-perlengkapan {
        server pembinaan-perlengkapan:3000;
    }

    server {
        listen 80;
        server_name _;

        # Main microfrontend routes
        location /badiklat {
            proxy_pass http://badiklat/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /datun {
            proxy_pass http://datun/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /portal {
            proxy_pass http://portal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sub-microfrontend routes (nested under pembinaan)
        location /pembinaan/keuangan {
            proxy_pass http://pembinaan-keuangan/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /pembinaan/perencanaan {
            proxy_pass http://pembinaan-perencanaan/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /pembinaan/perlengkapan {
            proxy_pass http://pembinaan-perlengkapan/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Main pembinaan route (if needed for landing page)
        location /pembinaan {
            # Could redirect to a default sub-service or serve a landing page
            return 301 /pembinaan/keuangan;
        }

        # Default route
        location / {
            return 301 /portal;
        }

        # Health check
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
