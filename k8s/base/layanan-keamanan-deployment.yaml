"apiVersion": apps/v1
"kind": Deployment
"metadata":
  "name": layanan-keamanan
  "namespace": simpelv2
"spec":
  "replicas": 1
  "selector":
    "matchLabels":
      "app": layanan-keamanan
  "template":
    "metadata":
      "labels":
        "app": layanan-keamanan
    "spec":
      "restartPolicy": Always
      "containers":
      - "name": layanan-keamanan
        "image": simpelv2/layanan-keamanan:dev
        "imagePullPolicy": IfNotPresent
        "ports":
        - "containerPort": 3000
        "command":
        - ./main
        "volumeMounts": []
        "envFrom":
        - "secretRef":
            "name": layanan-keamanan-secret
      "volumes": []
