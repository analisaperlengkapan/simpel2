---
# PostgreSQL High Availability Cluster
# Using Zalando Postgres Operator with Longhorn storage
#
# This creates a 3-node PostgreSQL cluster with:
# - 1 Primary + 2 Replicas
# - Automatic failover via Patroni
# - Streaming replication
# - Connection pooling via PgBouncer
# - Longhorn persistent storage

apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: simpelv2-postgres-ha
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: postgres-ha
    app.kubernetes.io/part-of: simpelv2
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: postgres-operator
spec:
  # Cluster identification
  teamId: "simpelv2"
  numberOfInstances: 3  # 1 primary + 2 replicas for HA

  # PostgreSQL version and docker image
  postgresql:
    version: "15"
    parameters:
      # Performance tuning
      max_connections: "200"
      shared_buffers: "1GB"
      effective_cache_size: "3GB"
      maintenance_work_mem: "256MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"  # For SSD storage
      effective_io_concurrency: "200"
      work_mem: "5242kB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"

      # Replication settings
      max_wal_senders: "10"
      max_replication_slots: "10"
      hot_standby: "on"
      wal_level: "replica"

      # Logging
      log_min_duration_statement: "1000"  # Log queries > 1s
      log_checkpoints: "on"
      log_connections: "on"
      log_disconnections: "on"
      log_lock_waits: "on"
      log_statement: "ddl"
      log_timezone: "UTC"

  # Volume configuration using Longhorn
  volume:
    size: 50Gi
    storageClass: longhorn
    iops: 3000  # SSD IOPS

  # Resource allocation
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  # Databases to be created automatically
  databases:
    simpelv2: simpelv2_owner
    authenc: authenc_owner
    secreton: secreton_owner

  # Database users
  users:
    simpelv2_owner:
      - superuser
      - createdb
    authenc_owner:
      - createdb
    secreton_owner:
      - createdb

  # Connection pooler (PgBouncer)
  enableConnectionPooler: true
  connectionPooler:
    numberOfInstances: 2  # 2 pooler instances for HA
    mode: "transaction"   # transaction, session, or statement
    schema: "pooler"
    user: "pooler"
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: 500m
        memory: 500Mi
    maxDBConnections: 100
    defaultPoolSize: 25

  # Patroni configuration for HA
  patroni:
    initdb:
      encoding: "UTF8"
      locale: "en_US.UTF-8"
      data-checksums: "true"

    pg_hba:
      # Local connections
      - local all all trust
      # Remote connections (password required)
      - host all all 0.0.0.0/0 md5
      - host all all ::0/0 md5
      # Replication connections
      - host replication standby 0.0.0.0/0 md5
      - host replication standby ::0/0 md5

    # Failover configuration
    ttl: 30                      # Time-to-live for leader lock
    loop_wait: 10                # Patroni main loop interval
    retry_timeout: 10            # Timeout for DCS operations
    maximum_lag_on_failover: 33554432  # 32 MB max lag for failover

    # Synchronous replication (optional - for zero data loss)
    synchronous_mode: false      # Set to true for sync replication
    synchronous_mode_strict: false

  # Load balancers
  enableMasterLoadBalancer: true   # Service for primary (read-write)
  enableReplicaLoadBalancer: true  # Service for replicas (read-only)

  # Pod disruption budget (prevent all pods being down)
  podDisruptionBudget:
    minAvailable: 1

  # Pod anti-affinity (spread pods across nodes)
  podAntiAffinity: "preferred"  # preferred or required

  # Node affinity (optional - schedule on specific nodes)
  # nodeAffinity:
  #   requiredDuringSchedulingIgnoredDuringExecution:
  #     nodeSelectorTerms:
  #     - matchExpressions:
  #       - key: node-role.kubernetes.io/database
  #         operator: In
  #         values:
  #         - "true"

  # Tolerations (optional - if nodes have taints)
  # tolerations:
  # - key: "dedicated"
  #   operator: "Equal"
  #   value: "database"
  #   effect: "NoSchedule"

  # Sidecars (optional - for monitoring, backup, etc.)
  sidecars:
    - name: exporter
      image: prometheuscommunity/postgres-exporter:latest
      ports:
        - name: exporter
          containerPort: 9187
          protocol: TCP
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      env:
        - name: DATA_SOURCE_URI
          value: "localhost:5432/postgres?sslmode=disable"
        - name: DATA_SOURCE_USER
          valueFrom:
            secretKeyRef:
              name: postgres.simpelv2-postgres-ha.credentials.postgresql.acid.zalan.do
              key: username
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: postgres.simpelv2-postgres-ha.credentials.postgresql.acid.zalan.do
              key: password

  # Backup configuration (optional - requires S3/MinIO)
  # enableLogicalBackup: true
  # logicalBackupSchedule: "30 00 * * *"  # Daily at 00:30 UTC
  # env:
  #   - name: AWS_ACCESS_KEY_ID
  #     valueFrom:
  #       secretKeyRef:
  #         name: postgres-backup-s3
  #         key: AWS_ACCESS_KEY_ID
  #   - name: AWS_SECRET_ACCESS_KEY
  #     valueFrom:
  #       secretKeyRef:
  #         name: postgres-backup-s3
  #         key: AWS_SECRET_ACCESS_KEY
  #   - name: AWS_ENDPOINT
  #     value: "https://s3.amazonaws.com"
  #   - name: AWS_S3_FORCE_PATH_STYLE
  #     value: "true"
  #   - name: LOGICAL_BACKUP_S3_BUCKET
  #     value: "postgres-backups"
  #   - name: LOGICAL_BACKUP_S3_REGION
  #     value: "us-east-1"

  # Clone from existing cluster (for migration)
  # clone:
  #   cluster: "old-postgres"
  #   timestamp: "2026-01-30T10:00:00Z"

  # Standby cluster (for disaster recovery)
  # standby:
  #   s3_wal_path: "s3://postgres-wal/simpelv2"

---
# ServiceMonitor for Prometheus metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-ha-metrics
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: postgres-ha
    app.kubernetes.io/part-of: simpelv2
spec:
  selector:
    matchLabels:
      application: spilo
      cluster-name: simpelv2-postgres-ha
  endpoints:
    - port: exporter
      interval: 30s
      path: /metrics
