# Path-based PR labels untuk actions/labeler.
# Hanya 2 dimensi otomatis-by-path: comp:<domain> + area:<lintas>.
# (size: ditangani pr-size-labeler; lang:/complexity: sengaja dihapus.)

# ─── Komponen (1 label per domain) ──────────────────────
"comp:perlengkapan":
  - changed-files:
      - any-glob-to-any-file:
          - layanan/perlengkapan/**
          - antarmuka/perlengkapan/**
          - lib/perlengkapan/**

"comp:authenc":
  - changed-files:
      - any-glob-to-any-file:
          - layanan/authenc/**

"comp:integrasi":
  - changed-files:
      - any-glob-to-any-file:
          - layanan/integrasi/**

"comp:secreton":
  - changed-files:
      - any-glob-to-any-file:
          - layanan/secreton/**

"comp:portal":
  - changed-files:
      - any-glob-to-any-file:
          - antarmuka/portal/**

"comp:monolith":
  - changed-files:
      - any-glob-to-any-file:
          - monolith/**

"comp:shared":
  - changed-files:
      - any-glob-to-any-file:
          - lib/ui/**
          - lib/core/**
          - lib/backend/**
          - lib/crypto/**

"comp:infra":
  - changed-files:
      - any-glob-to-any-file:
          - infra/**

# ─── Area lintas-komponen (ortogonal) ───────────────────
"area:ci-cd":
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/actions/**

"area:database":
  - changed-files:
      - any-glob-to-any-file:
          - "**/migrations/**"
          - "**/*.sql"

"area:security":
  - changed-files:
      - any-glob-to-any-file:
          - layanan/authenc/**
          - layanan/secreton/**
          - lib/crypto/**
          - .gitleaks.toml
          - deny.toml
          - .github/workflows/security.yml

"area:deps":
  - changed-files:
      - any-glob-to-any-file:
          - Cargo.lock
          - "**/package-lock.json"
          - "**/composer.lock"

# Hanya berlaku bila SELURUH file yang berubah adalah markdown (docs murni).
"area:docs":
  - changed-files:
      - all-globs-to-all-files:
          - "**/*.md"
