name: CI - WASM Microfrontends

on:
  push:
    branches: [main, develop]
    paths:
      - "antarmuka/**"
      - "lib/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main, develop]
    paths:
      - "antarmuka/**"
      - "lib/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.4"

jobs:
  check-and-build:
    name: Build WASM
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        module: [
          "portal",
          "perlengkapan"
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Protoc)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust (WASM)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm-${{ matrix.module }}

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: 'latest'

      - name: Build with Trunk (release)
        working-directory: antarmuka/${{ matrix.module }}
        run: trunk build --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.module }}
          path: antarmuka/${{ matrix.module }}/dist/
          retention-days: 7

  lint-wasm:
    name: Lint WASM Components
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Protoc)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        working-directory: antarmuka
        run: cargo fmt --all --check

      - name: Run clippy
        working-directory: antarmuka
        run: cargo clippy --all-targets -- -D warnings
