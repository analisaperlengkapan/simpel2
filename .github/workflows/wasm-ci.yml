name: CI - WASM Microfrontends

on:
  push:
    branches: [main, develop]
    paths:
      - "antarmuka/**"
      - "lib/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/wasm-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "antarmuka/**"
      - "lib/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.4"

jobs:
  lint-wasm:
    name: Lint WASM Components
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: wasm-lint

      - name: Check formatting (frontend)
        run: |
          cargo fmt -p antarmuka-portal --check
          cargo fmt -p antarmuka-perlengkapan --check

      - name: Run clippy (frontend)
        run: |
          cargo clippy -p antarmuka-portal --target wasm32-unknown-unknown -- -D warnings
          cargo clippy -p antarmuka-perlengkapan --target wasm32-unknown-unknown -- -D warnings

  build-wasm:
    name: Build WASM - ${{ matrix.module }}
    runs-on: self-hosted
    needs: lint-wasm
    strategy:
      fail-fast: false
      matrix:
        module: [portal, perlengkapan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Rust (WASM)
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: wasm-${{ matrix.module }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trunk
        shell: bash
        run: |
          if ! command -v trunk &> /dev/null; then
            mkdir -p $HOME/.local/bin
            curl -LsSf "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
              | tar -xzf- -C $HOME/.local/bin/
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi

      - name: Build with Trunk (release)
        working-directory: antarmuka/${{ matrix.module }}
        run: trunk build --release

      - name: Validate bundle size
        working-directory: antarmuka/${{ matrix.module }}
        shell: bash
        run: |
          MAX_SIZE_MB=50
          for wasm_file in $(find dist -name "*.wasm" -type f 2>/dev/null); do
            WASM_SIZE=$(stat -c%s "$wasm_file")
            WASM_SIZE_MB=$(echo "scale=2; $WASM_SIZE / 1024 / 1024" | bc)
            echo "\xf0\x9f\x93\xa6 Bundle: $(basename $wasm_file) - ${WASM_SIZE_MB}MB"
            if (( $(echo "$WASM_SIZE_MB > $MAX_SIZE_MB" | bc -l) )); then
              echo "::error::WASM bundle too large: ${WASM_SIZE_MB}MB (max: ${MAX_SIZE_MB}MB)"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.module }}
          path: antarmuka/${{ matrix.module }}/dist/
          retention-days: 7
