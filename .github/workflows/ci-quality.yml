name: CI - Quality & Metrics

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: self-hosted
    container: rust:1.93-bookworm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Tools
        shell: bash
        run: |
          # Install cargo-llvm-cov binary
          if ! command -v cargo-llvm-cov &> /dev/null; then
            echo "Installing cargo-llvm-cov..."
            curl -LsSf https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz | tar xzf - -C $HOME/.cargo/bin
          fi

          if ! command -v tokei &> /dev/null; then
            echo "Installing tokei..."
            curl -LsSf https://github.com/XAMPPRocky/tokei/releases/download/v12.1.2/tokei-x86_64-unknown-linux-musl.tar.gz | tar xzf - -C $HOME/.cargo/bin
          fi

      - name: Documentation Build
        run: cargo doc --workspace --no-deps --all-features --document-private-items

      - name: Code Metrics
        run: tokei .

      - name: Code Coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
        env:
          DATABASE_URL: postgres://simpelv2_test:coverage_test_2024@localhost:56432/simpelv2_coverage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: quality-reports
          path: |
            target/doc/
            lcov.info
