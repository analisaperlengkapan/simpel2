name: CI - Quality & Metrics

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Protoc)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install tokei
        uses: taiki-e/install-action@v2
        with:
          tool: tokei

      - name: Documentation Build
        run: cargo doc --workspace --no-deps --all-features --exclude authenc --document-private-items

      - name: Authenc Documentation
        run: cargo doc -p authenc --no-deps --no-default-features --features "axum,auth,oidc,db,metrics,flate2,totp-rs,rdkafka,test" --document-private-items

      - name: Code Metrics
        run: tokei .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doc-reports
          path: |
            target/doc/
