name: CI - Quality & Metrics

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sunday at midnight UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  documentation:
    name: Documentation Build
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: docs

      - name: Build workspace documentation
        run: cargo doc --workspace --no-deps --document-private-items
        continue-on-error: true

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: target/doc/
          retention-days: 7

  code-metrics:
    name: Code Metrics
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: metrics

      - name: Install tools
        shell: bash
        run: |
          if ! command -v tokei &> /dev/null; then
            curl -LsSf https://github.com/XAMPPRocky/tokei/releases/download/v12.1.2/tokei-x86_64-unknown-linux-musl.tar.gz \
              | tar xzf - -C $HOME/.cargo/bin
          fi

      - name: Code metrics
        run: tokei .

      - name: Generate summary
        run: |
          echo "## Code Metrics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tokei . >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
