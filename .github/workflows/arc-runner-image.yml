# arc-runner-image.yml — Bangun & dorong image runner ARC dari CI.
#
# Sebelum ini image `simpel2-arc-runner` dibangun DENGAN TANGAN di host dev lalu
# di-push manual. Itu masalah nyata, bukan ketidakrapian:
#
#   - Membutuhkan seorang manusia memegang kredensial `write:packages` dan
#     menjalankan `docker login` tiap kali versi runner perlu naik.
#   - Naiknya versi runner adalah tindakan MENDESAK (runner yang di-deprecate
#     mengunci seluruh CI — lihat runner-image/Dockerfile), jadi menaruh manusia
#     di jalur kritis persis pada saat CI mati adalah urutan yang terbalik.
#   - Tak ada catatan siapa membangun apa dari commit mana; image yang berjalan
#     di seluruh CI justru satu-satunya artefak tanpa jejak.
#
# ── Kenapa `ubuntu-latest`, bukan `arc-simpel` ────────────────────────────────
# Ini image yang DIPAKAI runner ARC. Membangunnya di atas runner ARC berarti:
# saat image rusak/kedaluwarsa dan runner mati, satu-satunya cara memperbaikinya
# ikut mati. Sama persis dengan alasan ci-heartbeat.yml tinggal di GitHub-hosted.
#
# ── Tag: satu sumber kebenaran ────────────────────────────────────────────────
# Tag TIDAK ditulis di sini. Ia diturunkan dari values-runner-set.yaml — berkas
# yang benar-benar dipakai Helm untuk menarik image. Dengan begitu yang dibangun
# CI dan yang ditarik cluster tak bisa menyimpang: kalau menyimpang, tak ada tag
# untuk di-push.

name: ARC Runner Image

on:
  push:
    branches: [main]
    paths:
      - 'infra/helm/arc/runner-image/**'
      - 'infra/helm/arc/values-runner-set.yaml'
      - '.github/workflows/arc-runner-image.yml'
  pull_request:
    paths:
      - 'infra/helm/arc/runner-image/**'
      - 'infra/helm/arc/values-runner-set.yaml'
      - '.github/workflows/arc-runner-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arc-runner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARC runner image
    # JANGAN pindahkan ke arc-simpel. Lihat komentar kepala berkas.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Butuh base ref untuk membedakan "Dockerfile berubah" dari "hanya
          # komentar workflow berubah" di step immutability di bawah.
          fetch-depth: 0

      - name: Turunkan tag image dari values Helm
        id: ref
        run: |
          set -euo pipefail
          values=infra/helm/arc/values-runner-set.yaml

          # Semua kemunculan (runner container + spec template) harus setuju.
          # Dua salinan tag yang ditulis tangan adalah pola kegagalan berulang
          # di repo ini: satu di-bump, satu tertinggal, dan yang tertinggal itu
          # yang dipakai. Diperiksa mekanis, bukan diandalkan pada ketelitian.
          mapfile -t refs < <(grep -oE 'ghcr\.io/[^[:space:]]+/simpel2-arc-runner:[^[:space:]"]+' "$values" | sort -u)

          if [ "${#refs[@]}" -eq 0 ]; then
            echo "::error::Tidak menemukan referensi image simpel2-arc-runner di ${values}."
            exit 1
          fi
          if [ "${#refs[@]}" -gt 1 ]; then
            echo "::error::Tag image tidak konsisten di ${values} — Helm akan menarik campuran versi:"
            printf '  %s\n' "${refs[@]}"
            exit 1
          fi

          echo "ref=${refs[0]}" >> "$GITHUB_OUTPUT"
          echo "Image: ${refs[0]}"

      - name: Login ke GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag belum terpakai (immutability)
        id: exists
        run: |
          set -euo pipefail
          ref='${{ steps.ref.outputs.ref }}'

          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${ref} SUDAH ada di registry."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${ref} belum ada — akan dibangun."
          fi

      # Menimpa tag yang sudah ada melanggar aturan semver-immutable repo ini
      # dan, lebih buruk, membuat node yang sudah men-cache image lama berjalan
      # dengan isi berbeda dari node yang menariknya belakangan — persis kelas
      # bug yang paling sulit dilacak. Jadi PR yang mengubah Dockerfile WAJIB
      # menaikkan tag; ditegakkan di sini, bukan diingat saat review.
      #
      # Pembandingnya adalah tag di BASE BRANCH, bukan keberadaan tag di
      # registry. Keduanya beda pertanyaan: "sudah ada di registry" juga benar
      # untuk PR yang SUDAH menaikkan tag dan image-nya kebetulan sudah didorong
      # (mis. saat pemulihan darurat) — memerahkan itu adalah alarm palsu. Yang
      # benar-benar dilarang adalah mengubah isi image tanpa menggerakkan tag.
      - name: Perubahan Dockerfile wajib menaikkan tag
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          values=infra/helm/arc/values-runner-set.yaml

          if git diff --quiet "$base" HEAD -- infra/helm/arc/runner-image/; then
            echo "runner-image/ tak berubah — tag tak perlu bergerak."
            exit 0
          fi

          base_ref=$(git show "${base}:${values}" \
            | grep -oE 'ghcr\.io/[^[:space:]]+/simpel2-arc-runner:[^[:space:]"]+' \
            | sort -u | head -1)
          head_ref='${{ steps.ref.outputs.ref }}'
          echo "Base: ${base_ref:-<tidak ada>}"
          echo "PR  : ${head_ref}"

          if [ "$base_ref" = "$head_ref" ]; then
            echo "::error::runner-image/ berubah tetapi tag masih ${head_ref} — sama dengan base."
            echo "Naikkan tag di ${values} (semver immutable — jangan timpa tag lama)."
            exit 1
          fi

          echo "Tag dinaikkan bersama perubahan image."

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      # PR membangun tanpa mendorong: cukup untuk membuktikan Dockerfile masih
      # bisa dibangun (base image yang di-deprecate/dihapus ketahuan di sini,
      # bukan saat cluster gagal menarik).
      - name: Build (PR — tanpa push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: infra/helm/arc/runner-image
          push: false
          platforms: linux/amd64
          tags: ${{ steps.ref.outputs.ref }}
          cache-from: type=gha,scope=arc-runner-image
          cache-to: type=gha,mode=max,scope=arc-runner-image

      # Di main: idempoten. Tag yang sudah ada dilewati (bukan digagalkan) —
      # push yang hanya menyentuh komentar workflow tak boleh memerahkan main,
      # dan melewatinya tetap menjaga immutability karena tak ada yang ditimpa.
      - name: Push (main)
        if: github.event_name != 'pull_request' && steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: infra/helm/arc/runner-image
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ref.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Runner ARC simpel2 (actions-runner + toolchain build Rust)
            org.opencontainers.image.licenses=Proprietary
          cache-from: type=gha,scope=arc-runner-image
          cache-to: type=gha,mode=max,scope=arc-runner-image

      # Klaim "sudah di registry" harus DIPERIKSA, bukan disimpulkan dari fakta
      # bahwa langkah sebelumnya tidak gagal.
      #
      # WHY (2026-08-18): run di main untuk v0.1.3 GAGAL dengan
      # `denied: permission_denied: write_package`, dan run main SEBELUMNYA
      # hijau HANYA karena tag-nya sudah ada (didorong tangan saat pemulihan
      # darurat) sehingga langkah push di-skip. Jadi jalur push workflow ini
      # tak pernah sekali pun benar-benar berhasil, dan tak ada satu pun sinyal
      # merah yang mengatakannya — hijau berarti "tak mencoba", bukan "berhasil".
      # Sejak sekarang hijau berarti tag yang akan ditarik cluster BENAR-BENAR
      # ada, apa pun jalannya ke sana.
      - name: Verifikasi tag benar-benar ada di registry
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          ref='${{ steps.ref.outputs.ref }}'
          pushed='${{ steps.exists.outputs.exists }}'

          if ! docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "::error::${ref} TIDAK ada di registry setelah job ini."
            cat <<'HINT'
            Kalau push barusan ditolak dengan
              denied: permission_denied: write_package
            sebabnya BUKAN kode di repo ini, melainkan tautan paket-ke-repo.

            Paket ghcr "simpel2-arc-runner" lahir dari push tangan, jadi ia tidak tertaut
            ke repository mana pun dan GITHUB_TOKEN tidak punya hak tulis atasnya. Periksa:

              gh api /user/packages/container/simpel2-arc-runner --jq .repository

            Kalau null: buka Package settings -> Manage Actions access -> Add repository
            analisaperlengkapan/simpel2 dengan role WRITE. Hanya lewat UI; tidak ada REST
            API untuk tautan ini.

            Label org.opencontainers.image.source TIDAK cukup: ia hanya menautkan paket
            saat paket PERTAMA KALI dibuat. Diuji 2026-08-18 - push dengan label itu
            berhasil lewat PAT, .repository tetap null.
          HINT
            exit 1
          fi

          if [ "$pushed" = "false" ]; then
            echo "Image ${ref} didorong oleh run ini dan terverifikasi ada."
          else
            echo "Image ${ref} sudah ada sebelum run ini (push dilewati) — terverifikasi ada."
          fi
          echo
          echo "Cluster BELUM memakainya — image di-pull saat runner scale set di-upgrade:"
          echo "  helm upgrade arc-simpel oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \\"
          echo "    -n arc-runners -f infra/helm/arc/values-runner-set.yaml"
          echo
          echo "JANGAN upgrade saat ada job CI berjalan — runner ephemeral yang sedang bekerja akan dibuang."
