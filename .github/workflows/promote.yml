# promote.yml — a FINAL tag (vX.Y.Z, no -rc) means "release the release candidate that passed
# staging to production". Nothing is rebuilt: the final tag points at the commit of that rc, its images
# are the rc's images re-tagged with the identical digest, and the deploy is the same pipeline staging
# used (infra/scripts/deploy/pipeline.py), now against production.
#
#   guard             the tag sits on the commit of an rc whose staging deployment is the NEWEST one and
#                     succeeded (GitHub's deployment history; a newer rc on staging, a failed or missing
#                     staging deploy, or a stray tag refuses here, before anything is touched)
#   promote-images    re-tag each image from the rc's tag, verify the digest is identical, sign it
#   deploy-production runs in the `production` GitHub Environment: the job waits for the owner's
#                     approval, then upgrades (never installs: the first production install is the manual
#                     bootstrap in infra/helm/RUNBOOK.md), verifies, and rolls back on failure
#   publish-release   the GitHub Release, only after production verified

name: Promote Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: promote-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: simpelv2

jobs:
  guard:
    name: The tag is the release candidate that passed staging
    runs-on: arc-simpel
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    outputs:
      source_tag: ${{ steps.guard.outputs.source_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag against the staging deployment history
        id: guard
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # tee, not a bare `| tail`: the reason for a refusal must stay in the log.
          python3 -I infra/scripts/deploy/pipeline.py promote-guard --tag "$TAG" --repo "$REPO" | tee guard.out
          echo "source_tag=$(tail -n1 guard.out)" >> "$GITHUB_OUTPUT"

  promote-images:
    name: Re-tag (${{ matrix.image }})
    runs-on: arc-simpel
    timeout-minutes: 120
    needs: guard
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - antarmuka-portal
          - antarmuka-perlengkapan
          - layanan-authenc
          - layanan-integrasi
          - layanan-perlengkapan
          - layanan-secreton
    steps:
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify source image exists
        shell: bash
        env:
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ needs.guard.outputs.source_tag }}
        run: docker manifest inspect "$SOURCE_IMAGE"

      - name: Re-tag image (no rebuild)
        shell: bash
        env:
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ needs.guard.outputs.source_tag }}
          TARGET_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.ref_name }}
        run: |
          docker buildx imagetools create --tag "$TARGET_IMAGE" "$SOURCE_IMAGE"

      - name: Verify digest identik
        shell: bash
        env:
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ needs.guard.outputs.source_tag }}
          TARGET_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.ref_name }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          SOURCE_DIGEST=$(docker manifest inspect "$SOURCE_IMAGE" \
            | jq -r '.config.digest // .manifests[0].digest')
          TARGET_DIGEST=$(docker manifest inspect "$TARGET_IMAGE" \
            | jq -r '.config.digest // .manifests[0].digest')
          if [ "$SOURCE_DIGEST" != "$TARGET_DIGEST" ]; then
            echo "::error::Digest mismatch! source=$SOURCE_DIGEST target=$TARGET_DIGEST"
            exit 1
          fi
          echo "OK $IMAGE_NAME: digest identik ($SOURCE_DIGEST)"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign target tag (cosign keyless)
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.ref_name }}
        run: cosign sign --yes "$IMAGE"

  deploy-production:
    name: Deploy to production (after approval), verify, roll back on failure
    needs: [guard, promote-images]
    runs-on: arc-simpel
    timeout-minutes: 120
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.BASE_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Cluster access
        uses: ./.github/actions/cluster-access
        with:
          server: ${{ vars.KUBE_SERVER }}
          ca: ${{ vars.KUBE_CA }}
          token: ${{ secrets.KUBE_TOKEN }}
          namespace: simpelv2-production

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify every image is signed by this repository
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./infra/scripts/deploy/verify-images.sh infra/helm/simpel/values-production.yaml "${{ github.ref_name }}" promote

      # Production gets the rollouts, the pod and image checks, the smoke over HTTP and the log scan. It does
      # not get the authenticated e2e suite: that suite reseeds fixtures and logs in as fixture users, which
      # production must never hold. A read-only synthetic account would allow an authenticated check; that
      # is a decision about a real account in production, not something this job invents.
      - name: Deploy, verify, scan the logs
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          set -euo pipefail
          python3 -I infra/scripts/deploy/pipeline.py run --env production --tag "$TAG" --base-url "$BASE_URL"

  publish-release:
    name: Publish GitHub Release
    needs: [deploy-production]
    runs-on: arc-simpel
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SIMPEL ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
