name: Labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-label-by-path:
    name: PR Label by Path
    if: github.event_name == 'pull_request_target'
    runs-on: arc-simpel
    steps:
      - uses: actions/labeler@v6
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  pr-label-by-size:
    name: PR Label by Size
    if: github.event_name == 'pull_request_target'
    runs-on: arc-simpel
    steps:
      - uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size:xs'
          xs_max_size: '10'
          s_label: 'size:s'
          s_max_size: '100'
          m_label: 'size:m'
          m_max_size: '500'
          l_label: 'size:l'
          l_max_size: '1000'
          xl_label: 'size:xl'
          fail_if_xl: 'false'
          message_if_xl: ''
          files_to_ignore: 'package-lock.json Cargo.lock composer.lock pnpm-lock.yaml yarn.lock'

  pr-title-check:
    name: PR Title (Conventional Commits)
    if: github.event_name == 'pull_request_target'
    runs-on: arc-simpel
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            build
            perf
            style
            revert
            security
            deps
          # Scope = domain comp: (lihat .github/labels.yml) + beberapa scope
          # lintas-komponen. Selaras 1:1 dgn taksonomi label, jadi tidak ada
          # nama ganda (layanan-/antarmuka-/lib-) untuk domain yang sama.
          scopes: |
            perlengkapan
            authenc
            integrasi
            secreton
            portal
            monolith
            shared
            infra
            ci
            deps
            e2e
            api
            ui
            docs
            release
          requireScope: false
          subjectPattern: ^[a-z0-9].+
          subjectPatternError: |
            Subject judul PR harus diawali huruf kecil/digit. Contoh:
              feat(layanan-authenc): tambah dukungan WebAuthn
              fix(simpelv1): atasi NPE di laporan BMN

  issue-label-by-content:
    name: Issue Label by Content
    if: github.event_name == 'issues'
    runs-on: arc-simpel
    steps:
      - uses: github/issue-labeler@v3.4
        with:
          configuration-path: .github/issue-labeler.yml
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          enable-versioned-regex: 0
          include-title: 1
          include-body: 1
          sync-labels: 1

  dependabot-auto-merge:
    name: Auto-merge Dependabot
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    runs-on: arc-simpel
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve & enable auto-merge for safe updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
           steps.meta.outputs.dependency-group != 'crypto')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          gh pr review --approve "$PR_URL" || true
          gh pr merge --auto --squash "$PR_URL"
