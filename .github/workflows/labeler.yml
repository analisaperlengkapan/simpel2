name: Labeler

on:
  pull_request_target:
    # `labeled`/`unlabeled` ada di sini BUKAN untuk pelabelan itu sendiri,
    # melainkan karena PR-title gate punya `ignoreLabels` (lihat job
    # `pr-title-check`): action-nya membaca label saat ia berjalan, jadi label
    # yang mendarat SESUDAH check berjalan akan meninggalkan merah yang tak
    # pernah dihitung ulang. Perubahan label memicu ulang evaluasi — itulah
    # alasan action-nya mendokumentasikan kedua tipe event ini.
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-label-by-path:
    name: PR Label by Path
    if: github.event_name == 'pull_request_target'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  pr-label-by-size:
    name: PR Label by Size
    if: github.event_name == 'pull_request_target'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size:xs'
          xs_max_size: '10'
          s_label: 'size:s'
          s_max_size: '100'
          m_label: 'size:m'
          m_max_size: '500'
          l_label: 'size:l'
          l_max_size: '1000'
          xl_label: 'size:xl'
          fail_if_xl: 'false'
          message_if_xl: ''
          files_to_ignore: 'package-lock.json Cargo.lock composer.lock pnpm-lock.yaml yarn.lock'

  pr-title-check:
    name: PR Title (Conventional Commits)
    if: github.event_name == 'pull_request_target'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            build
            perf
            style
            revert
            security
            deps
          # Scope = domain comp: (lihat .github/labels.yml) + beberapa scope
          # lintas-komponen. Selaras 1:1 dgn taksonomi label, jadi tidak ada
          # nama ganda (layanan-/antarmuka-/lib-) untuk domain yang sama.
          scopes: |
            perlengkapan
            authenc
            integrasi
            secreton
            gateway
            portal
            monolith
            shared
            infra
            ci
            deps
            e2e
            api
            ui
            docs
            release
          requireScope: false
          subjectPattern: ^[a-z0-9].+
          subjectPatternError: |
            Subject judul PR harus diawali huruf kecil/digit. Contoh:
              feat(layanan-authenc): tambah dukungan WebAuthn
              fix(simpelv1): atasi NPE di laporan BMN
          # Dependabot menulis judulnya sendiri — "<prefix>: Bump <crate> from
          # X to Y" — dan subject-nya selalu diawali huruf BESAR ("Bump").
          # Pola di atas menuntut huruf kecil/digit, jadi SETIAP PR bot
          # MUSTAHIL lulus; merahnya tak pernah bisa diperbaiki dari sisi repo
          # (judulnya di-regenerate bot tiap rebase, dan subject-nya di luar
          # kendali `commit-message.prefix` di dependabot.yml — prefix hanya
          # mengisi type/scope, bukan subject). Hasilnya ~10 PR bot merah
          # permanen pada satu job yang isinya cuma membaca judul.
          #
          # Lewatkan lewat LABEL, bukan dengan melonggarkan pola: melonggarkan
          # `^[a-z0-9]` demi bot akan mematikan aturan itu untuk manusia juga,
          # padahal konvensi subject huruf-kecil itulah tujuannya. Label
          # `dependencies` hanya dipasang Dependabot (lihat dependabot.yml).
          #
          # Aman untuk riwayat: squash-merge tetap memakai judul PR
          # ("deps(deps): Bump …") yang SUDAH sah sebagai Conventional Commit —
          # type/scope-nya dijaga terpisah oleh maintenance.yml
          # ("Dependabot prefixes match the PR-title gate").
          ignoreLabels: |
            dependencies

  issue-label-by-content:
    name: Issue Label by Content
    if: github.event_name == 'issues'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: github/issue-labeler@v3.5
        with:
          configuration-path: .github/issue-labeler.yml
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          enable-versioned-regex: 0
          include-title: 1
          include-body: 1
          sync-labels: 1

  dependabot-auto-merge:
    name: Auto-merge Dependabot
    if: github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]'
    runs-on: arc-simpel
    timeout-minutes: 30
    # Job-level perms override the workflow default (`contents: read`). Enabling
    # auto-merge (`gh pr merge --auto`) needs `contents: write`; approving needs
    # `pull-requests: write`. Without contents:write the merge mutation fails with
    # "Resource not accessible by integration (mergePullRequest)".
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve & enable auto-merge for safe updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
           steps.meta.outputs.dependency-group != 'crypto')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          GH_BIN="gh"
          if ! command -v gh &> /dev/null; then
            echo "gh CLI not found. Downloading standalone binary..."
            GH_VERSION="2.50.0"
            ARCH=$(uname -m)
            if [ "$ARCH" = "x86_64" ]; then
              ARCH="amd64"
            elif [ "$ARCH" = "aarch64" ]; then
              ARCH="arm64"
            else
              ARCH="amd64"
            fi
            URL="https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${ARCH}.tar.gz"
            mkdir -p /tmp/gh-cli
            if command -v curl &> /dev/null; then
              curl -sSL "$URL" | tar xz -C /tmp/gh-cli --strip-components=1
            elif command -v wget &> /dev/null; then
              wget -qO- "$URL" | tar xz -C /tmp/gh-cli --strip-components=1
            else
              echo "Error: neither curl nor wget found. Cannot install GitHub CLI." >&2
              exit 1
            fi
            GH_BIN="/tmp/gh-cli/bin/gh"
            chmod +x "$GH_BIN"
          fi

          "$GH_BIN" pr review --approve "$PR_URL" || true

          # `gh pr merge --auto` merges IMMEDIATELY when the PR is already
          # mergeable and green, so it races other PRs landing on main and
          # dies with "Base branch was modified" (observed on #734). That exit
          # code left auto-merge UNARMED and the PR stranded open, so retry
          # before giving up. Only a genuinely stuck arm should stay red.
          for attempt in 1 2 3 4 5; do
            if "$GH_BIN" pr merge --auto --squash "$PR_URL"; then
              echo "auto-merge armed (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt} failed; base branch likely moved, retrying"
            sleep $((attempt * 10))
          done

          echo "::error::could not arm auto-merge after 5 attempts"
          exit 1
