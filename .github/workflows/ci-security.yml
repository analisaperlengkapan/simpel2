name: CI - Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  audit-and-deny:
    name: Dependency Audit & Policy
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Tools
        shell: bash
        run: |
          if ! command -v cargo-audit &> /dev/null; then cargo install cargo-audit --locked; fi
          if ! command -v cargo-deny &> /dev/null; then
             echo "Installing cargo-deny..."
             curl -LsSf https://github.com/EmbarkStudios/cargo-deny/releases/latest/download/cargo-deny-x86_64-unknown-linux-musl.tar.gz | tar xzf - -C $HOME/.cargo/bin --strip-components=1 cargo-deny-x86_64-unknown-linux-musl/cargo-deny
          fi

      - name: Audit Workspace
        run: cargo audit --deny warnings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deny Checks
        run: |
          cargo deny check advisories
          cargo deny check licenses
          cargo deny check bans

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep scan --config=auto --config=r/rust --exclude="target/" --error

  secrets-gitleaks:
    name: Secrets Scanning
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Security Summary
    runs-on: self-hosted
    needs: [audit-and-deny, sast-semgrep, secrets-gitleaks]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🔒 Security CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.audit-and-deny.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep SAST | ${{ needs.sast-semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.secrets-gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
