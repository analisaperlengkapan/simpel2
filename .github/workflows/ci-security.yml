name: CI - Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1"  # Weekly on Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  audit-and-deny:
    name: Dependency Audit & Policy
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install audit tools
        shell: bash
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit --locked
          fi
          if ! command -v cargo-deny &> /dev/null; then
            mkdir -p /tmp/cargo-deny-install
            curl -LsSf https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.0/cargo-deny-0.19.0-x86_64-unknown-linux-musl.tar.gz \
              | tar xzf - -C /tmp/cargo-deny-install
            mv /tmp/cargo-deny-install/*/cargo-deny $HOME/.cargo/bin/
            rm -rf /tmp/cargo-deny-install
          fi

      - name: Audit dependencies
        run: cargo audit --deny warnings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check advisories, licenses, and bans
        run: |
          cargo deny check advisories
          cargo deny check licenses
          cargo deny check bans

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Semgrep
        run: |
          python3 -m pip install --quiet semgrep
          semgrep scan --config=auto --config=r/rust --exclude="target/"

  secrets-scan:
    name: Secrets Scanning
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: true

      - name: Cleanup stale Gitleaks artifacts
        shell: bash
        run: |
          # Fix for "Destination file path /tmp/gitleaks.tmp already exists" on self-hosted runners
          rm -f /tmp/gitleaks.tmp 2>/dev/null || true
          rm -rf /tmp/gitleaks-* 2>/dev/null || true

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Security Summary
    runs-on: self-hosted
    needs: [audit-and-deny, sast-semgrep, secrets-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Security CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.audit-and-deny.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep SAST | ${{ needs.sast-semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
