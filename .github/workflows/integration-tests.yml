name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 1 * * *"  # Daily at 01:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  backend-integration:
    name: Backend Integration Tests
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: simpelv2_integration
          POSTGRES_USER: simpelv2_test
          POSTGRES_PASSWORD: integration_test_2024
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        service:
          - layanan/perlengkapan/crates/api
          - layanan/integrasi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: integration-${{ matrix.service }}

      - name: Run integration tests
        working-directory: ${{ matrix.service }}
        run: cargo test --all-targets
        env:
          DATABASE_URL: postgres://simpelv2_test:integration_test_2024@localhost:5432/simpelv2_integration
          REDIS_URL: redis://localhost:6379
          RUST_LOG: debug

  workspace-integration:
    name: Cross-Module Integration Tests
    runs-on: self-hosted
    needs: backend-integration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: workspace-integration

      - name: Test workspace-wide integration
        run: cargo test --workspace --all-targets

  summary:
    name: Integration Summary
    runs-on: self-hosted
    needs: [backend-integration, workspace-integration]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Integration | ${{ needs.backend-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Workspace Integration | ${{ needs.workspace-integration.result }} |" >> $GITHUB_STEP_SUMMARY
