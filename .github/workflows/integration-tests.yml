name: Integration Tests - E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Run integration tests daily at 01:00 UTC
    - cron: "0 1 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  DATABASE_URL: postgres://simpelv2_test:integration_test_2024@localhost:5432/simpelv2_integration
  REDIS_URL: redis://localhost:6379

jobs:
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        service:
          - infra/authenc
          - layanan/badiklat
          - layanan/datun
          - layanan/intel
          - layanan/pemulihan_aset
          - layanan/pengawasan
          - layanan/pidsus
          - layanan/pidum
          - layanan/pidmil
          - layanan/pembinaan

    steps:
      - name: Fix permissions
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine chown -R $(id -u):$(id -g) . || true
          rm -rf ~/.cargo/registry/src/index.crates.io-*/tokio-postgres-0.7.16 || true

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Start PostgreSQL and Redis
        run: |
          docker run -d --name postgres-backend-${{ strategy.job-index }} \
            -e POSTGRES_DB=simpelv2_integration \
            -e POSTGRES_USER=simpelv2_test \
            -e POSTGRES_PASSWORD=integration_test_2024 \
            -p 5432:5432 \
            postgres:16-alpine || docker start postgres-backend-${{ strategy.job-index }} || true

          docker run -d --name redis-backend-${{ strategy.job-index }} \
            -p 6379:6379 \
            redis:7-alpine || docker start redis-backend-${{ strategy.job-index }} || true

          # Wait for PostgreSQL
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if docker exec postgres-backend-${{ strategy.job-index }} pg_isready -U simpelv2_test > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            sleep 2
          done

          # Wait for Redis
          echo "Waiting for Redis..."
          for i in {1..30}; do
            if docker exec redis-backend-${{ strategy.job-index }} redis-cli ping | grep -q PONG; then
              echo "Redis is ready!"
              break
            fi
            sleep 2
          done

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: integration-${{ matrix.service }}

      - name: Run migrations
        working-directory: ${{ matrix.service }}
        run: |
          if [ -d "migrations" ]; then
            # Check if using Refinery (files starting with V)
            if ls migrations/V* >/dev/null 2>&1; then
               echo "Refinery migrations detected (V-prefix). Skipping sqlx migrate."
            else
               echo "Running sqlx migrations for ${{ matrix.service }}..."
               if ! command -v sqlx &> /dev/null; then
                 cargo install sqlx-cli --no-default-features --features postgres
               fi
               sqlx database create || true
               sqlx migrate run
            fi
          else
            echo "No migrations found for ${{ matrix.service }}"
          fi
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run integration tests
        working-directory: ${{ matrix.service }}
        run: |
          # Use default test runner to include unit tests if no integration tests exist
          cargo test -- --test-threads=1 --nocapture
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          RUST_LOG: debug

      - name: Cleanup Services
        if: always()
        run: |
          docker stop postgres-backend-${{ strategy.job-index }} redis-backend-${{ strategy.job-index }} || true
          docker rm postgres-backend-${{ strategy.job-index }} redis-backend-${{ strategy.job-index }} || true

      - name: Generate test report
        if: always()
        run: |
          echo "## Integration Test Results - ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY

  grpc-integration-tests:
    name: gRPC Service Integration Tests
    runs-on: self-hosted

    steps:
      - name: Fix permissions
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine chown -R $(id -u):$(id -g) . || true
          rm -rf ~/.cargo/registry/src/index.crates.io-*/tokio-postgres-0.7.16 || true

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Start PostgreSQL and Redis
        run: |
          docker run -d --name postgres-grpc \
            -e POSTGRES_DB=simpelv2_integration \
            -e POSTGRES_USER=simpelv2_test \
            -e POSTGRES_PASSWORD=integration_test_2024 \
            -p 5432:5432 \
            postgres:16-alpine || docker start postgres-grpc || true

          docker run -d --name redis-grpc \
            -p 6379:6379 \
            redis:7-alpine || docker start redis-grpc || true

          echo "Waiting for services..."
          sleep 10

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: grpc-integration

      - name: Test authenc service
        working-directory: infra/authenc
        run: |
          cargo test -- --test-threads=1 --nocapture
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          RUST_LOG: debug

      - name: Test secreton service
        if: hashFiles('infra/secreton/Cargo.toml') != ''
        working-directory: infra/secreton
        run: |
          cargo test -- --test-threads=1 --nocapture
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          RUST_LOG: debug

      - name: Cleanup Services
        if: always()
        run: |
          if [ -f infra/authenc/authenc.pid ]; then
            kill $(cat infra/authenc/authenc.pid) || true
            rm infra/authenc/authenc.pid
          fi
          docker stop postgres-grpc redis-grpc || true
          docker rm postgres-grpc redis-grpc || true

  module-integration:
    name: Cross-Module Integration Tests
    runs-on: self-hosted
    needs: [backend-integration-tests, grpc-integration-tests]

    steps:
      - name: Fix permissions
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine chown -R $(id -u):$(id -g) . || true
          rm -rf ~/.cargo/registry/src/index.crates.io-*/tokio-postgres-0.7.16 || true

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Start PostgreSQL and Redis
        run: |
          docker run -d --name postgres-module \
            -e POSTGRES_DB=simpelv2_integration \
            -e POSTGRES_USER=simpelv2_test \
            -e POSTGRES_PASSWORD=integration_test_2024 \
            -p 5432:5432 \
            postgres:16-alpine || docker start postgres-module || true

          docker run -d --name redis-module \
            -p 6379:6379 \
            redis:7-alpine || docker start redis-module || true

          sleep 5

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: module-integration

      - name: Test workspace integration
        run: |
          echo "Testing cross-module dependencies..."
          cargo test --workspace --lib -- --test-threads=1
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          RUST_LOG: info

      - name: Test shared libraries
        working-directory: lib
        run: |
          # Test common libraries used across modules
          for lib in */; do
            if [ -f "$lib/Cargo.toml" ]; then
              echo "Testing lib/$lib..."
              cd "$lib"
              cargo test --all-features
              cd ..
            fi
          done

      - name: Cleanup Services
        if: always()
        run: |
          docker stop postgres-module redis-module || true
          docker rm postgres-module redis-module || true

  cleanup:
    name: Cleanup
    runs-on: self-hosted
    needs: [module-integration]
    if: always()

    steps:
      - name: Final Cleanup
        run: |
          docker system prune -f || true
          rm -rf test-results/ || true

  summary:
    name: Integration Test Summary
    runs-on: self-hosted
    needs: [backend-integration-tests, grpc-integration-tests, module-integration]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🧪 Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Integration | ${{ needs.backend-integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| gRPC Integration | ${{ needs.grpc-integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cross-Module Integration | ${{ needs.module-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Overall Status" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.backend-integration-tests.result }}" = "success" ] && \
             [ "${{ needs.grpc-integration-tests.result }}" = "success" ] && \
             [ "${{ needs.module-integration.result }}" = "success" ]; then
            echo "✅ **All integration tests passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some integration tests failed. Please review the logs.**" >> $GITHUB_STEP_SUMMARY
          fi
