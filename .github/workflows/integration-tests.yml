name: Integration Tests - E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Run integration tests daily at 01:00 UTC
    - cron: "0 1 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  DATABASE_URL: postgres://simpelv2_test:integration_test_2024@localhost:5432/simpelv2_integration
  REDIS_URL: redis://localhost:6379
  CARGO_BUILD_JOBS: 2

jobs:
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: self-hosted
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service:
          - layanan/badiklat
          - layanan/datun
          - layanan/intel
          - layanan/pemulihan_aset
          - layanan/pengawasan
          - layanan/pidsus
          - layanan/pidum
          - layanan/pidmil
          - layanan/pembinaan/keuangan
          - layanan/pembinaan/perencanaan
          - layanan/pembinaan/perlengkapan

    steps:
      - name: Fix permissions
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine chown -R $(id -u):$(id -g) . || true
          rm -rf ~/.cargo/registry/src/index.crates.io-*/tokio-postgres-0.7.16 || true

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Infrastructure (Docker)
        run: |
          # Cleanup previous containers if any
          docker rm -f postgres-integration-${{ github.run_id }} redis-integration-${{ github.run_id }} || true

          # Start Postgres
          docker run -d --name postgres-integration-${{ github.run_id }} \
            -e POSTGRES_DB=simpelv2_integration \
            -e POSTGRES_USER=simpelv2_test \
            -e POSTGRES_PASSWORD=integration_test_2024 \
            -p 5432:5432 \
            postgres:16-alpine

          # Start Redis
          docker run -d --name redis-integration-${{ github.run_id }} \
            -p 6379:6379 \
            redis:7-alpine

          # Wait for services
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if docker exec postgres-integration-${{ github.run_id }} pg_isready -U simpelv2_test > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            sleep 2
          done

          echo "Waiting for Redis..."
          for i in {1..30}; do
            if docker exec redis-integration-${{ github.run_id }} redis-cli ping | grep -q PONG; then
              echo "Redis is ready!"
              break
            fi
            sleep 2
          done

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: integration-${{ matrix.service }}

      - name: Run migrations
        working-directory: ${{ matrix.service }}
        run: |
          if [ -d "migrations" ]; then
            echo "Running migrations for ${{ matrix.service }}..."
            # Install sqlx-cli if not available
            if ! command -v sqlx &> /dev/null; then
              cargo install sqlx-cli --no-default-features --features postgres
            fi
            sqlx database create || true
            sqlx migrate run
          else
            echo "No migrations found for ${{ matrix.service }}"
          fi
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run integration tests
        working-directory: ${{ matrix.service }}
        run: |
          # Only use --features integration-tests if defined in Cargo.toml
          if grep -q "integration-tests" Cargo.toml; then
             cargo test --test '*' --features integration-tests -- --test-threads=1 --nocapture
          else
             cargo test --test '*' -- --test-threads=1 --nocapture
          fi
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          RUST_LOG: debug

      - name: Cleanup Infrastructure
        if: always()
        run: |
          docker rm -f postgres-integration-${{ github.run_id }} redis-integration-${{ github.run_id }} || true

      - name: Generate test report
        if: always()
        run: |
          echo "## Integration Test Results - ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY

  frontend-backend-integration:
    name: Frontend-Backend E2E Tests
    runs-on: self-hosted
    # Needs removed as it runs independently now

    steps:
      - name: Fix permissions
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine chown -R $(id -u):$(id -g) . || true
          rm -rf ~/.cargo/registry/src/index.crates.io-*/tokio-postgres-0.7.16 || true

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Infrastructure (Docker)
        run: |
          docker rm -f postgres-e2e-${{ github.run_id }} redis-e2e-${{ github.run_id }} || true

          docker run -d --name postgres-e2e-${{ github.run_id }} \
            -e POSTGRES_DB=simpelv2_integration \
            -e POSTGRES_USER=simpelv2_test \
            -e POSTGRES_PASSWORD=integration_test_2024 \
            -p 5432:5432 \
            postgres:16-alpine

          docker run -d --name redis-e2e-${{ github.run_id }} \
            -p 6379:6379 \
            redis:7-alpine

          sleep 10 # Basic wait

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: e2e-tests

      - name: Install Trunk
        run: |
          if ! command -v trunk &> /dev/null; then
            mkdir -p $HOME/.local/bin
            wget -qO- "https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xzf- -C $HOME/.local/bin/
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi

      - name: Start API Gateway
        # Only run if apigateway exists (removed from matrix but here for future)
        if: hashFiles('layanan/apigateway/Cargo.toml') != ''
        run: |
          cd layanan/apigateway
          cargo build --release
          nohup ../../target/release/apigateway > apigateway.log 2>&1 &
          echo $! > apigateway.pid
          sleep 5
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}

      - name: Build Portal Frontend
        working-directory: antarmuka/daskrimti/portal
        run: trunk build --release

      - name: Run E2E Tests
        if: hashFiles('layanan/apigateway/Cargo.toml') != ''
        run: |
          echo "Running end-to-end tests..."
          curl -f http://localhost:8080/health || exit 1
          echo "✅ E2E tests passed!"

      - name: Stop API Gateway
        if: always()
        run: |
          if [ -f layanan/apigateway/apigateway.pid ]; then
            kill $(cat layanan/apigateway/apigateway.pid) || true
            rm layanan/apigateway/apigateway.pid
          fi
          docker rm -f postgres-e2e-${{ github.run_id }} redis-e2e-${{ github.run_id }} || true

      - name: Upload logs
        if: always() && hashFiles('layanan/apigateway/apigateway.log') != ''
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs
          path: layanan/apigateway/apigateway.log
          retention-days: 7

  grpc-integration-tests:
    name: gRPC Service Integration Tests
    runs-on: self-hosted

    steps:
      - name: Fix permissions
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine chown -R $(id -u):$(id -g) . || true
          rm -rf ~/.cargo/registry/src/index.crates.io-*/tokio-postgres-0.7.16 || true

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Infrastructure (Docker)
        run: |
          docker rm -f postgres-grpc-${{ github.run_id }} redis-grpc-${{ github.run_id }} || true

          docker run -d --name postgres-grpc-${{ github.run_id }} \
            -e POSTGRES_DB=simpelv2_integration \
            -e POSTGRES_USER=simpelv2_test \
            -e POSTGRES_PASSWORD=integration_test_2024 \
            -p 5432:5432 \
            postgres:16-alpine

          docker run -d --name redis-grpc-${{ github.run_id }} \
            -p 6379:6379 \
            redis:7-alpine

          sleep 10

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: grpc-integration

      - name: Test authenc service
        working-directory: infra/authenc
        run: |
          if grep -q "integration-tests" Cargo.toml; then
            cargo test --features integration-tests -- --test-threads=1 --nocapture
          else
            cargo test -- --test-threads=1 --nocapture
          fi
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          RUST_LOG: debug

      - name: Test secreton service
        if: hashFiles('infra/secreton/Cargo.toml') != ''
        working-directory: infra/secreton
        run: |
          if grep -q "integration-tests" Cargo.toml; then
             cargo test --features integration-tests -- --test-threads=1 --nocapture
          else
             cargo test -- --test-threads=1 --nocapture
          fi
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          RUST_LOG: debug

      - name: Cleanup Infrastructure
        if: always()
        run: |
          docker rm -f postgres-grpc-${{ github.run_id }} redis-grpc-${{ github.run_id }} || true

  module-integration:
    name: Cross-Module Integration Tests
    runs-on: self-hosted

    steps:
      - name: Fix permissions
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine chown -R $(id -u):$(id -g) . || true
          rm -rf ~/.cargo/registry/src/index.crates.io-*/tokio-postgres-0.7.16 || true

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: module-integration

      - name: Test workspace integration
        run: |
          echo "Testing cross-module dependencies..."
          cargo test --workspace --lib -- --test-threads=1
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          RUST_LOG: info

      - name: Test shared libraries
        working-directory: lib
        run: |
          # Test common libraries used across modules
          for lib in */; do
            if [ -f "$lib/Cargo.toml" ]; then
              echo "Testing lib/$lib..."
              cd "$lib"
              cargo test --all-features
              cd ..
            fi
          done
