# promote-release.yml — Promote pre-release tag (v0.1.0-rc1) ke final tag (v0.1.0)
# tanpa rebuild image. Image digest identik staging ↔ production.
#
# Pattern: "build once, promote artifact" — image yang sudah lulus QA staging
# adalah image yang sama di-deploy production. Mencegah cache miss /
# non-determinism build env yang bisa terjadi kalau rebuild dari source.
#
# Trigger: workflow_dispatch (manual, oleh release manager setelah staging hijau).

name: Promote Release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Source tag (rc) yang sudah lulus staging — contoh: v0.1.0-rc1"
        required: true
        type: string
      target_tag:
        description: "Target tag final — contoh: v0.1.0"
        required: true
        type: string
      git_tag:
        description: "Buat git tag final? (y/n) — default y"
        required: false
        type: string
        default: "y"

concurrency:
  group: promote-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate input tags
    runs-on: self-hosted
    outputs:
      source_clean: ${{ steps.parse.outputs.source }}
      target_clean: ${{ steps.parse.outputs.target }}
    steps:
      - name: Parse & validate tag format
        id: parse
        run: |
          set -e
          SOURCE="${{ inputs.source_tag }}"
          TARGET="${{ inputs.target_tag }}"

          # Source: SemVer dengan pre-release suffix wajib (-rc1, -beta1, dst)
          if ! echo "$SOURCE" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.-]+$'; then
            echo "::error::source_tag harus SemVer pre-release (mis. v0.1.0-rc1). Got: $SOURCE"
            exit 1
          fi

          # Target: SemVer final tanpa pre-release suffix
          if ! echo "$TARGET" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::target_tag harus SemVer final (mis. v0.1.0). Got: $TARGET"
            exit 1
          fi

          # Source MAJOR.MINOR.PATCH harus match Target
          SOURCE_BASE=$(echo "$SOURCE" | sed 's/-.*//')
          if [ "$SOURCE_BASE" != "$TARGET" ]; then
            echo "::error::Base version mismatch: source=$SOURCE_BASE, target=$TARGET"
            exit 1
          fi

          echo "source=${SOURCE#v}" >> $GITHUB_OUTPUT
          echo "target=${TARGET#v}" >> $GITHUB_OUTPUT
          echo "✓ Validated: $SOURCE → $TARGET"

  promote-images:
    name: Re-tag - ${{ matrix.image }}
    runs-on: self-hosted
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - portal
          - perlengkapan
          - authenc
          - layanan-integrasi
          - layanan-perlengkapan
          - secreton
          - simpelv1
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify source image exists
        run: |
          docker manifest inspect \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ inputs.source_tag }}

      - name: Re-tag image (no rebuild — copy manifest)
        # `buildx imagetools create` add new tag pointing ke same digest.
        # Image binary tidak berubah; hanya OCI label & tag baru ditambah.
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ inputs.target_tag }} \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ inputs.source_tag }}

      - name: Verify target tag now exists & has same digest
        run: |
          SOURCE_DIGEST=$(docker manifest inspect \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ inputs.source_tag }} \
            | jq -r '.config.digest // .manifests[0].digest')
          TARGET_DIGEST=$(docker manifest inspect \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:${{ inputs.target_tag }} \
            | jq -r '.config.digest // .manifests[0].digest')

          if [ "$SOURCE_DIGEST" != "$TARGET_DIGEST" ]; then
            echo "::error::Digest mismatch! source=$SOURCE_DIGEST target=$TARGET_DIGEST"
            exit 1
          fi
          echo "✓ ${{ matrix.image }}: digest identik ($SOURCE_DIGEST)"

  create-git-tag:
    name: Create git tag (final)
    runs-on: self-hosted
    needs: [validate, promote-images]
    if: ${{ inputs.git_tag == 'y' || inputs.git_tag == 'yes' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find commit dari source tag
        id: src
        run: |
          # Source tag (mis. v0.1.0-rc1) sudah ada di repo dari trigger release.yml.
          # Final tag (v0.1.0) di-create di commit yang SAMA agar git history konsisten.
          COMMIT=$(git rev-list -n 1 "${{ inputs.source_tag }}")
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "Source tag ${{ inputs.source_tag }} → commit $COMMIT"

      - name: Create & push final tag
        run: |
          git tag -a "${{ inputs.target_tag }}" "${{ steps.src.outputs.commit }}" \
            -m "Release ${{ inputs.target_tag }}

          Promoted from ${{ inputs.source_tag }} setelah lulus QA staging.
          Image digest identik dengan ${{ inputs.source_tag }} di ghcr.io.

          See ${{ env.REGISTRY }}/${{ github.repository }} for image tags."
          git push origin "${{ inputs.target_tag }}"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.target_tag }}
          name: SIMPEL ${{ inputs.target_tag }}
          body: |
            ## SIMPEL Release ${{ inputs.target_tag }}

            Promoted from `${{ inputs.source_tag }}` setelah lulus QA staging.
            Image digest identik dengan `${{ inputs.source_tag }}` di ghcr.io.

            ### Docker Images
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/portal:${{ inputs.target_tag }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/authenc:${{ inputs.target_tag }}
            # ... dan 5 image lain
            ```

            ### Deploy ke production
            Lihat [`infra/helm/RUNBOOK.md`](https://github.com/${{ github.repository }}/blob/main/infra/helm/RUNBOOK.md) section "Fresh Deploy ke Production".
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          artifactErrorsFailBuild: false

      - name: Summary
        run: |
          echo "✓ Promoted ${{ inputs.source_tag }} → ${{ inputs.target_tag }}"
          echo "  Git tag created at commit ${{ steps.src.outputs.commit }}"
          echo "  GitHub Release published"
          echo ""
          echo "Next step: helm upgrade simpel ... --set global.imageTag=${{ inputs.target_tag }}"
