# secret-scan.yml — Scan repo & PR diff untuk secret leak.
#
# Trigger: PR ke main + push ke main + scheduled (catch leaks added before merge).
# Tools: gitleaks (regex-based, fast). TruffleHog opsional (verify entropy).

name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # untuk gitleaks comment di PR

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history untuk scan commit history (catch secret yang ter-commit lalu di-revert).
          fetch-depth: 0

      - name: Run gitleaks
        # gitleaks-action butuh GITLEAKS_LICENSE jika commercial scope (>50 user org).
        # Untuk repo internal/proprietary biasanya pakai standalone binary.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opsional, jika ada lisensi:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Pakai .gitleaks.toml di root untuk allowlist (mis. test fixtures).
          GITLEAKS_CONFIG: .gitleaks.toml
        # Continue meskipun fail — laporan tetap di-upload. Set ke 'false' untuk
        # block merge saat ada finding.
        continue-on-error: false

  audit-env-files:
    name: Audit .env Files in Tree
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify no .env in working tree (selain template/example)
        run: |
          set -e
          STRAY=$(find . -type f \( -name '.env' -o -name '.env.staging' -o -name '.env.production' \) \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './target/*' \
            2>/dev/null || true)
          if [ -n "$STRAY" ]; then
            echo "::error::Stray .env files found in tree (should be gitignored):"
            echo "$STRAY"
            exit 1
          fi
          echo "✓ No stray .env files."

      - name: Audit hardcoded secret patterns (heuristic)
        run: |
          # Cari pola password/secret/token/api_key/app_key dengan nilai > 16 char.
          # Skip lock files, markdown, examples, templates, tests fixtures, generated.
          set +e
          MATCHES=$(git grep -niIE \
            "(password|secret|token|api[_-]?key|app[_-]?key)\s*[:=]\s*[\"']?[A-Za-z0-9+/_=-]{16,}" \
            -- ':!*.lock' \
               ':!*.md' \
               ':!*.example' \
               ':!*.template' \
               ':!docs/' \
               ':!tests/' \
               ':!**/fixtures/' \
               ':!**/test*.rs' \
               ':!**/test*.go' \
               ':!**/test*.php' \
               ':!**/*.snap' \
               ':!CHANGELOG.md')
          if [ -n "$MATCHES" ]; then
            echo "::warning::Possible hardcoded secret found:"
            echo "$MATCHES"
            # Soft-fail dulu — banyak false positive (mis. enum variant). Tighten later.
            # exit 1
          else
            echo "✓ No hardcoded secret patterns."
          fi
