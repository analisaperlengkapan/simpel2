# autofix-pr.yml — Auto-fix di pull_request ke main.
#
# Trigger: setiap pull request (push dari fork tidak bisa write — autofix-ci/action
# tetap upload patch sebagai artifact yang bisa di-apply manual).

name: Autofix PR

on:
  pull_request:
    branches: [main]

permissions:
  # Butuh write contents untuk push commit ke branch PR.
  # Catatan: untuk PR dari fork, GitHub auto-downgrade permissions read-only;
  # job akan tetap run fmt/fix tapi push step di-skip (artifact upload sebagai fallback).
  contents: write
  pull-requests: write

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DEBIAN_FRONTEND: noninteractive

jobs:
  autofix:
    name: Auto-fix Workspace (cargo fmt + cargo fix)
    runs-on: self-hosted
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          # Checkout PR head ref agar push langsung ke branch yang benar.
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          # Token dengan write contents permission untuk push commit auto-fix.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          # WASM target diperlukan agar cargo fix tidak gagal di crate lib-ui / antarmuka.
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: autofix-pr

      - name: Apply fmt + fix + clippy --fix (single shell session)
        # Gabung dalam satu step agar PATH stabil — di self-hosted runner kadang
        # cargo binary "hilang" antar step (issue Swatinem/rust-cache vs $GITHUB_PATH).
        # Pakai `$HOME/.cargo/bin/cargo` sebagai fallback kalau `cargo` tidak di PATH.
        run: |
          set +e
          # Resolve cargo path (PATH atau fallback ke $HOME/.cargo/bin).
          CARGO_BIN=$(command -v cargo || echo "$HOME/.cargo/bin/cargo")
          if ! [ -x "$CARGO_BIN" ]; then
            echo "::error::cargo binary tidak ditemukan (PATH=$PATH)."
            exit 1
          fi
          echo "Using cargo: $CARGO_BIN"

          # 1. Format
          "$CARGO_BIN" fmt --all || true

          # 2. cargo fix (compiler suggestions)
          "$CARGO_BIN" fix \
            --workspace \
            --all-targets \
            --all-features \
            --allow-dirty \
            --allow-staged \
            || true

          # 3. clippy --fix (lint suggestions)
          "$CARGO_BIN" clippy \
            --workspace \
            --all-targets \
            --all-features \
            --fix \
            --allow-dirty \
            --allow-staged \
            -- -W clippy::all \
            || true

          # 4. Re-format (cargo fix bisa menggeser formatting)
          "$CARGO_BIN" fmt --all || true
          true

      - name: Normalize Cargo versioning
        run: python3 ./infra/scripts/check-cargo-versioning.py fix

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Tidak ada perubahan dari fmt/fix/clippy. Branch sudah bersih."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Perubahan terdeteksi di:"
            git diff --stat
          fi

      - name: Commit & push fixes ke branch PR
        # Hanya jalan kalau ada perubahan & PR bukan dari fork (fork punya read-only token).
        if: steps.changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(autofix): cargo fmt + cargo fix + clippy --fix

          Auto-applied by autofix-pr.yml workflow di PR #${{ github.event.pull_request.number }}."
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload diff sebagai artifact (PR dari fork fallback)
        if: steps.changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          git diff > /tmp/autofix.patch
          echo "PR dari fork — push tidak bisa. Patch di-upload sebagai artifact;"
          echo "kontributor bisa download & apply via 'git apply autofix.patch'."

      - name: Upload patch artifact
        if: steps.changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v4
        with:
          name: autofix-patch
          path: /tmp/autofix.patch
          retention-days: 7
