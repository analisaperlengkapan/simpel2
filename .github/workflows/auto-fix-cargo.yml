      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(autofix/secreton): apply cargo fix and clippy fixes'
          title: '[Auto-fix] Cargo clippy & fix - Secreton Workspace'
          body: |
            ## Automatic Cargo Fixes - Secreton Workspace
            
            This PR contains automatic fixes applied to the Secreton workspace by:
            - `cargo fix --workspace --all --allow-dirty --allow-staged`
            - `cargo clippy --fix --allow-dirty --allow-staged --workspace`
            - `cargo fmt --all`
            
            These fixes were automatically detected and applied to improve code quality and address compiler/clippy warnings in the Secreton vault service.
            
            ### Changes
            - Applied automatic fixes for compiler warnings
