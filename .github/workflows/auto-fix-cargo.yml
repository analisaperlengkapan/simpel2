name: Auto-Fix - Cargo Clippy, Fix & Format

on:
  schedule:
    # Run every Monday at 05:00 UTC (after Dependabot runs)
    - cron: '0 5 * * 1'
  workflow_dispatch: # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  auto-fix-root:
    name: Auto-fix Root Workspace
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-git-

      - name: Cache target directory
        uses: actions/cache@v4.3.0
        with:
          path: target
          key: ${{ runner.os }}-target-autofix-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-target-autofix-

      - name: Run cargo fix
        run: |
          cargo fix --workspace --all --allow-dirty --allow-staged || true
          cargo clippy --fix --allow-dirty --allow-staged --workspace || true
          cargo fmt --all

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(autofix): apply cargo fix and clippy fixes for root workspace'
          title: '[Auto-fix] Cargo clippy & fix - Root Workspace'
          body: |
            ## Automatic Cargo Fixes - Root Workspace
            
            This PR contains automatic fixes applied by:
            - `cargo fix --workspace --all --allow-dirty --allow-staged`
            - `cargo clippy --fix --allow-dirty --allow-staged --workspace`
            - `cargo fmt --all`
            
            These fixes were automatically detected and applied to improve code quality and address compiler/clippy warnings.
            
            ### Changes
            - Applied automatic fixes for compiler warnings
            - Applied clippy suggestions and fixes
            - Applied code formatting
            
            ### Review Notes
            - Please review the changes carefully before merging
            - All fixes are automatic and should be safe, but verify functionality
            - Run CI tests to ensure no breaking changes
            
            ---
            *This is an automated PR created by the auto-fix-cargo workflow*
          branch: auto-fix/cargo-root-${{ github.run_number }}
          base: develop
          labels: |
            automated
            rust
            code-quality
            auto-fix
          delete-branch: true

