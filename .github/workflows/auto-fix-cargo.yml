      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all --workspace

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'style(fmt): apply cargo fmt to root workspace'
          title: '[Auto-format] Cargo fmt - Root Workspace'
          body: |
            ## Automatic Code Formatting - Root Workspace
            
            This PR contains automatic code formatting applied by:
            - `cargo fmt --all --workspace`
            
            These formatting changes ensure consistent code style across the entire root workspace according to Rust formatting standards.
            
            ### Changes
            - Applied automatic code formatting
            - Standardized code style
            
            ### Review Notes
            - These are purely formatting changes with no functional impact
            - All changes follow Rust's official formatting guidelines
            - Safe to merge after CI validation
            
            ---
            *This is an automated PR created by the auto-fix-cargo workflow*
          branch: auto-fmt/root-${{ github.run_number }}
          base: develop
          labels: |
            automated
            rust
            formatting
            code-style
