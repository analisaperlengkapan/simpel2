name: CI - Frontend Microfrontends

on:
  push:
    branches: [main, develop]
    paths:
      - 'antarmuka/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'antarmuka/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-wasm:
    name: Check WASM - ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - portal
          - badiklat
          - datun
          - intel
          - pembinaan/perlengkapan
          - pemulihan_aset
          - pengawasan
          - pidmil
          - pidsus
          - pidum
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "antarmuka/${{ matrix.module }}"
          shared-key: "wasm-check-${{ matrix.module }}"
      
      - name: Check WASM compilation
        run: cargo check --target wasm32-unknown-unknown --manifest-path antarmuka/${{ matrix.module }}/Cargo.toml

  test-wasm:
    name: Test WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "antarmuka"
          shared-key: "wasm-test"
      
      - name: Run WASM tests
        run: |
          cd antarmuka
          cargo test --all

  build-wasm:
    name: Build WASM - ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: [check-wasm]
    strategy:
      fail-fast: false
      matrix:
        module:
          - portal
          - badiklat
          - datun
          - intel
          - pembinaan/perlengkapan
          - pemulihan_aset
          - pengawasan
          - pidmil
          - pidsus
          - pidum
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "antarmuka/${{ matrix.module }}"
          shared-key: "wasm-build-${{ matrix.module }}"
      
      - name: Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.4/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
          sudo mv trunk /usr/local/bin/
      
      - name: Build with Trunk
        run: |
          cd antarmuka/${{ matrix.module }}
          trunk build --release
      
      - name: Check bundle size
        run: |
          WASM_SIZE=$(find antarmuka/${{ matrix.module }}/dist -name "*.wasm" -exec wc -c {} + | awk '{print $1}')
          WASM_SIZE_MB=$(echo "scale=2; $WASM_SIZE / 1024 / 1024" | bc)
          echo "WASM bundle size: ${WASM_SIZE_MB}MB"
          if (( $(echo "$WASM_SIZE_MB > 2.0" | bc -l) )); then
            echo "::error::WASM bundle exceeds 2MB limit: ${WASM_SIZE_MB}MB"
            exit 1
          fi
      
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.module }}
          path: antarmuka/${{ matrix.module }}/dist/
          retention-days: 7
          if-no-files-found: error

  build-shared:
    name: Build Shared Components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "antarmuka/shared"
          shared-key: "wasm-shared"
      
      - name: Check shared components
        run: |
          cd antarmuka/shared
          cargo check --target wasm32-unknown-unknown
          cargo test
