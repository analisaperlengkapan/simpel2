name: CI/CD Health Check

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  workflow-health:
    name: Check Workflow Health
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate workflow YAML
        run: |
          echo "## CI/CD Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          INVALID=0
          for workflow in .github/workflows/*.yml; do
            if python3 -c "import yaml; yaml.safe_load(open('$workflow'))" 2>/dev/null; then
              echo "- $(basename $workflow)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- $(basename $workflow) - YAML syntax error" >> $GITHUB_STEP_SUMMARY
              INVALID=$((INVALID + 1))
            fi
          done

          if [ $INVALID -eq 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All workflows are valid." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Found $INVALID invalid workflow(s)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  dependency-health:
    name: Check Dependencies
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit dependencies
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit --locked
          fi
          echo "## Dependency Health" >> $GITHUB_STEP_SUMMARY
          cargo audit 2>&1 | head -50 >> $GITHUB_STEP_SUMMARY || true

  infrastructure-health:
    name: Check Infrastructure
    runs-on: self-hosted
    steps:
      - name: Check Docker & Disk
        run: |
          echo "## Infrastructure Health" >> $GITHUB_STEP_SUMMARY

          if command -v docker &> /dev/null; then
            echo "- Docker: $(docker --version)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Docker: NOT AVAILABLE" >> $GITHUB_STEP_SUMMARY
          fi

          FREE_SPACE=$(df -BG / | tail -1 | awk '{print $4}' | sed 's/G//')
          echo "- Free disk space: ${FREE_SPACE}GB" >> $GITHUB_STEP_SUMMARY
          if [ "$FREE_SPACE" -lt 20 ]; then
            echo "::warning::Low disk space: ${FREE_SPACE}GB"
          fi
