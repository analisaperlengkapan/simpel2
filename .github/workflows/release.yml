name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versi yang akan dirilis (mis. 1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.4"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: simpelv2

jobs:
  validate:
    name: Validate & Generate Changelog
    runs-on: arc-simpel
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous-tag: ${{ steps.previous.outputs.tag }}
      changelog: ${{ steps.cliff.outputs.content }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ (alpha|beta|rc|pre) ]]; then
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find previous tag
        id: previous
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT_TAG="v$VERSION"
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | grep -v "^${CURRENT_TAG}$" | head -n 1 || echo "")
          echo "tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog (git-cliff)
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_RELEASE.md
        continue-on-error: true

      - name: Fallback if git-cliff failed
        if: steps.cliff.outcome == 'failure'
        shell: bash
        env:
          PREV_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          {
            echo "### Changes since $PREV_TAG"
            echo ""
            git log "$PREV_TAG..HEAD" --pretty=format:'- %s (`%h`)' || echo "- Initial release"
            echo ""
          } > CHANGELOG_RELEASE.md
          # Pakai random delimiter agar isi changelog (yang bisa berisi literal "EOF")
          # tidak konflik dengan delimiter heredoc GITHUB_OUTPUT.
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "content<<${DELIM}"
            cat CHANGELOG_RELEASE.md
            echo ""
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG_RELEASE.md
          retention-days: 30

  build-backend:
    name: Build Backend Binaries
    needs: validate
    runs-on: arc-simpel
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-gnu
          cache-key: release-backend-${{ needs.validate.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo build --release (workspace)
        run: cargo build --workspace --release --target x86_64-unknown-linux-gnu --exclude lib-ui --exclude portal-microfrontend --exclude perlengkapan-microfrontend
      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          dir=target/x86_64-unknown-linux-gnu/release
          if [ -d "$dir" ]; then
            find "$dir" -maxdepth 1 -type f -executable \
              ! -name "*.d" ! -name "*.so" ! -name "*.dylib" ! -name "build-script-*" \
              -exec cp {} release-artifacts/ \;
          fi
          cd release-artifacts
          if compgen -G "*" >/dev/null; then
            tar czf "../simpelv2-backend-${{ needs.validate.outputs.version }}.tar.gz" *
          fi
          cd ..
          if [ -f "simpelv2-backend-${{ needs.validate.outputs.version }}.tar.gz" ]; then
            sha256sum "simpelv2-backend-${{ needs.validate.outputs.version }}.tar.gz" > "simpelv2-backend-${{ needs.validate.outputs.version }}.tar.gz.sha256"
          fi
      - name: Upload backend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-artifacts
          path: |
            simpelv2-backend-${{ needs.validate.outputs.version }}.tar.gz
            simpelv2-backend-${{ needs.validate.outputs.version }}.tar.gz.sha256
          retention-days: 30

  build-frontend:
    name: Build Microfrontends
    needs: validate
    runs-on: arc-simpel
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: release-frontend-${{ needs.validate.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Trunk
        shell: bash
        run: |
          if ! command -v trunk &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -LsSf "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
              | tar -xzf- -C "$HOME/.local/bin/"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Install wasm-bindgen-cli
        shell: bash
        run: |
          # Trunk butuh wasm-bindgen-cli untuk post-process .wasm.
          # Versi WAJIB sama persis dengan yang dipakai cargo build (di-bake ke
          # .wasm). Cargo.toml hanya menyatakan constraint (`= "0.2.118"`) —
          # resolver bisa pilih versi patch lebih baru di Cargo.lock. CLI yang
          # mismatch akan gagal post-process dengan error samar:
          #   "error spawning cargo build artifacts task: No such file or directory"
          # Ambil exact version dari Cargo.lock.
          WBG_VERSION=$(awk '/^name = "wasm-bindgen"$/{getline; print}' Cargo.lock | grep -oP '"\K[0-9.]+(?=")' | head -1)
          if [ -z "$WBG_VERSION" ]; then
            echo "::error::Failed to extract wasm-bindgen version from Cargo.lock"
            exit 1
          fi
          echo "Cargo.lock resolved wasm-bindgen = $WBG_VERSION"
          if ! command -v wasm-bindgen &>/dev/null || ! wasm-bindgen --version 2>/dev/null | grep -q "^wasm-bindgen $WBG_VERSION$"; then
            cargo install wasm-bindgen-cli --version "$WBG_VERSION" --locked
          fi
          wasm-bindgen --version
      - name: Build microfrontends
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-frontend
          for module in portal perlengkapan; do
            (cd "antarmuka/$module" && trunk build --release)
            cp -r "antarmuka/$module/dist" "release-frontend/$module"
          done
      - name: Package frontend artifacts
        shell: bash
        run: |
          (cd release-frontend && tar czf "../simpelv2-frontend-${{ needs.validate.outputs.version }}.tar.gz" *)
          sha256sum "simpelv2-frontend-${{ needs.validate.outputs.version }}.tar.gz" \
            > "simpelv2-frontend-${{ needs.validate.outputs.version }}.tar.gz.sha256"
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-artifacts
          path: |
            simpelv2-frontend-${{ needs.validate.outputs.version }}.tar.gz
            simpelv2-frontend-${{ needs.validate.outputs.version }}.tar.gz.sha256
          retention-days: 30

  build-docker:
    name: Build & Sign Image (${{ matrix.image.name }})
    needs: validate
    runs-on: arc-simpel
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: antarmuka-portal,          dockerfile: antarmuka/portal/Dockerfile,        tier: "Microfrontend (Leptos WASM)" }
          - { name: antarmuka-perlengkapan,    dockerfile: antarmuka/perlengkapan/Dockerfile,  tier: "Microfrontend (Leptos WASM)" }
          - { name: layanan-authenc,           dockerfile: layanan/authenc/Dockerfile,         tier: "Backend (Rust/Axum)" }
          - { name: layanan-integrasi,         dockerfile: layanan/integrasi/Dockerfile,       tier: "Backend (Rust/Axum)" }
          - { name: layanan-perlengkapan,      dockerfile: layanan/perlengkapan/Dockerfile,    tier: "Backend (Rust/Axum)" }
          - { name: layanan-secreton,          dockerfile: layanan/secreton/Dockerfile,        tier: "Backend (Rust/Axum, separate workspace)" }
          - { name: simpelv1,                  dockerfile: monolith/simpelv1/Dockerfile,       tier: "Monolith (PHP/Laravel)" }
    outputs:
      digest-portal: ${{ steps.export.outputs.digest-portal }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Unique buildx instance per matrix job (7 paralel docker build → 7
          # buildkit container terpisah). `cleanup: true` (default) — instance
          # otomatis di-cleanup setelah post-job hook. Sebelumnya `cleanup: false`
          # untuk hindari race condition di Docker daemon, tapi side-effect:
          # buildkit container + volume akumulasi di self-hosted runner host.
          # Pernah crash node disk-pressure setelah 247 orphan buildkit
          # containers ber-volume 1+ TB. Default cleanup lebih aman.
          # NOTE: `name:` input ditiadakan — v3 tidak punya parameter `name`
          # (actionlint flag), action auto-generate unique builder name dari
          # job + matrix context.
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image.name }}
          tags: |
            type=raw,value=v${{ needs.validate.outputs.version }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Proprietary
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.description=SIMPEL Kejaksaan RI - ${{ matrix.image.tier }}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (cosign keyless)
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image.name }}
          # Self-hosted runner: cosign tidak selalu baca ~/.docker/config.json
          # (credential-helper / path mismatch). Pass kredensial registry
          # secara eksplisit supaya cosign bisa fetch manifest sebelum sign.
          # Sebelumnya gagal: `signing ...: ... GET .../token?scope=...:pull ...:
          # UNAUTHORIZED: authentication required`.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign --yes \
            --registry-username "$GITHUB_ACTOR" \
            --registry-password "$GITHUB_TOKEN" \
            "$IMAGE@$DIGEST"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image.name }}.cdx.json
          upload-artifact: false

      # Attestation API butuh repo public ATAU org plan dengan attestations
      # enabled. analisaperlengkapan/simpel2 = private, jadi step ini di-skip
      # untuk hindari fake-failure (`build-push-action` provenance: true sudah
      # menyisipkan SLSA provenance ke image manifest; attest-build-provenance
      # tambahan adalah signed attestation di GitHub yang opsional).
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Trivy scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-${{ matrix.image.name }}.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: 'true'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-image-${{ matrix.image.name }}
        continue-on-error: true

      - name: Export digest & SBOM
        id: export
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "${{ matrix.image.name }} ${DIGEST}" > "image-${{ matrix.image.name }}.digest"
          echo "digest-${{ matrix.image.name }}=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM + digest
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.image.name }}
          path: |
            sbom-${{ matrix.image.name }}.cdx.json
            image-${{ matrix.image.name }}.digest
          retention-days: 90

  # Self-hosted runner housekeeping. setup-buildx-action `cleanup: true` (in
  # build-docker above) only removes the per-job buildkit *container*, not
  # base images pulled by the build, dangling layers from previous tags, or
  # cache volumes left by cancelled jobs. Without this step the runner host
  # accumulated multi-TB across releases (see comment at lines 252-257).
  #
  # The shape here is deliberately conservative:
  #   - `prune --keep-storage 20gb` is a no-op until the host actually
  #     needs space back, so recent cache survives across consecutive
  #     releases (cargo-chef layers, base distroless images).
  #   - `image prune --until 168h` only drops dangling images older than a
  #     week — anything still tagged or recently used is kept.
  #   - `if: always()` ensures the cleanup runs even when build-docker
  #     fails, which is precisely when stale buildkit volumes pile up.
  cleanup-runner:
    name: Runner cache trim
    needs: [build-docker]
    if: always()
    runs-on: arc-simpel
    steps:
      - name: Trim BuildKit cache & dangling Docker images
        shell: bash
        run: |
          set +e
          echo "=== Disk before cleanup ==="
          df -h /var/lib/docker || df -h /

          # Trim BuildKit cache (any builder on this host) down to 20 GB
          # ceiling. Older layers go first; recent cache that materially
          # affects build times is preserved.
          docker buildx prune --force --keep-storage 20gb

          # Remove dangling (untagged) images older than 7 days. Doesn't
          # touch tagged images or images currently used by containers.
          docker image prune --force --filter "until=168h"

          # Stop and remove leaked Buildx builders + buildkit containers older than 4 hours (14400s).
          # Keeps active sibling matrix jobs' builders intact while reclaiming stale ones.
          if command -v docker &>/dev/null; then
            echo "=== Checking for leaked Buildx builders (>4h) ==="
            NOW=$(date +%s)
            docker ps -a --filter "name=buildx_buildkit" \
              --format '{{.Names}}|{{.CreatedAt}}' | while IFS='|' read -r cname created; do
              ts=$(date -d "${created% UTC}" +%s 2>/dev/null) || continue
              [ -z "$ts" ] && continue
              if [ $((NOW - ts)) -gt 14400 ]; then
                builder="${cname#buildx_buildkit_}"; builder="${builder%0}"
                echo "Reaping leaked builder=$builder (container=$cname)"
                docker buildx rm -f "$builder" 2>/dev/null || docker rm -f -v "$cname" 2>/dev/null
              fi
            done
            # Drop dangling builder registry entries whose container is gone.
            for b in $(docker buildx ls --format '{{.Name}}' 2>/dev/null | grep '^buildx-'); do
              docker inspect "buildx_buildkit_${b}0" >/dev/null 2>&1 || docker buildx rm -f "$b" 2>/dev/null
            done
          fi

          # Catch buildkit volumes whose container was reaped without the
          # post-job hook completing (cancelled job, runner crash). The
          # `--filter dangling=true` keeps us from yanking a volume that a
          # parallel matrix job is still using.
          docker volume prune --force --filter "label=builder=buildx"

          echo "=== Disk after cleanup ==="
          df -h /var/lib/docker || df -h /

  publish:
    name: Publish GitHub Release
    needs: [validate, build-backend, build-frontend, build-docker]
    runs-on: arc-simpel
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-input

      - name: Compose release body
        id: body
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PREV_TAG: ${{ needs.validate.outputs.previous-tag }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          OUT=release-body.md
          {
            echo "# SIMPEL v${VERSION}"
            echo
            echo "> Rilis ini mencakup pembaruan untuk microfrontend, microservice backend Rust, dan monolith Laravel."
            echo
            echo "## Apa yang Berubah"
            echo
            if [ -f release-input/changelog/CHANGELOG_RELEASE.md ]; then
              cat release-input/changelog/CHANGELOG_RELEASE.md
            else
              echo "_Changelog generation gagal — silakan cek commit history._"
            fi
            echo
            echo "## Komponen"
            echo
            echo "| Komponen | Tier | Image |"
            echo "|---|---|---|"
            echo "| antarmuka-portal | Microfrontend (Leptos WASM) | \`${REGISTRY}/${OWNER}/${IMAGE_PREFIX}-antarmuka-portal:v${VERSION}\` |"
            echo "| antarmuka-perlengkapan | Microfrontend (Leptos WASM) | \`${REGISTRY}/${OWNER}/${IMAGE_PREFIX}-antarmuka-perlengkapan:v${VERSION}\` |"
            echo "| layanan-authenc | Backend (Rust/Axum) | \`${REGISTRY}/${OWNER}/${IMAGE_PREFIX}-layanan-authenc:v${VERSION}\` |"
            echo "| layanan-integrasi | Backend (Rust/Axum) | \`${REGISTRY}/${OWNER}/${IMAGE_PREFIX}-layanan-integrasi:v${VERSION}\` |"
            echo "| layanan-perlengkapan | Backend (Rust/Axum) | \`${REGISTRY}/${OWNER}/${IMAGE_PREFIX}-layanan-perlengkapan:v${VERSION}\` |"
            echo "| layanan-secreton | Backend (Rust/Axum, workspace terpisah) | \`${REGISTRY}/${OWNER}/${IMAGE_PREFIX}-layanan-secreton:v${VERSION}\` |"
            echo "| simpelv1 | Monolith (PHP/Laravel) | \`${REGISTRY}/${OWNER}/${IMAGE_PREFIX}-simpelv1:v${VERSION}\` |"
            echo
            echo "## Image Digests"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            for f in release-input/sbom-*/image-*.digest; do
              [ -f "$f" ] || continue
              read -r name digest < "$f"
              echo "| \`${IMAGE_PREFIX}-${name}\` | \`${digest}\` |"
            done
            echo
            echo "## Verifikasi Image (cosign keyless)"
            echo
            echo '```bash'
            echo "cosign verify ${REGISTRY}/${OWNER}/${IMAGE_PREFIX}-layanan-authenc:v${VERSION} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${REPO}/.github/workflows/release.yml@.*' \\"
            echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'"
            echo '```'
            echo
            echo "## Verifikasi Build Provenance"
            echo
            echo '```bash'
            echo "gh attestation verify oci://${REGISTRY}/${OWNER}/${IMAGE_PREFIX}-layanan-authenc:v${VERSION} --owner ${OWNER}"
            echo '```'
            echo
            echo "## Artifacts (binaries + SBOM)"
            echo
            echo "Tarball binary: \`simpelv2-backend-${VERSION}.tar.gz\` (semua binary backend, target x86_64-linux-gnu)"
            echo
            echo "Tarball frontend: \`simpelv2-frontend-${VERSION}.tar.gz\` (portal + perlengkapan WASM/HTML/CSS)"
            echo
            echo "SBOM CycloneDX per image dilampirkan sebagai \`sbom-<image>.cdx.json\`."
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "## Full Changelog"
              echo
              echo "**Compare:** https://github.com/${REPO}/compare/${PREV_TAG}...v${VERSION}"
            fi
          } > "$OUT"
          {
            echo "body<<RELEASE_EOF"
            cat "$OUT"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-input -type f \( \
            -name 'simpelv2-backend-*.tar.gz*' -o \
            -name 'simpelv2-frontend-*.tar.gz*' -o \
            -name 'sbom-*.cdx.json' -o \
            -name 'CHANGELOG_RELEASE.md' \
          \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: SIMPEL v${{ needs.validate.outputs.version }}
          body: ${{ steps.body.outputs.body }}
          prerelease: ${{ needs.validate.outputs.is-prerelease == 'true' }}
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
