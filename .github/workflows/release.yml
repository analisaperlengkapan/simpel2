name: Release & Deployment

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: "0.21.4"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG=$(awk '/## \['"${{ steps.version.outputs.version }}"'\]/,/## \[/' CHANGELOG.md | head -n -1 || echo "See CHANGELOG.md for details")
          else
            CHANGELOG="Release ${{ steps.version.outputs.version }}"
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: SIMPEL ${{ steps.version.outputs.version }}
          body: |
            ## SIMPEL Release ${{ steps.version.outputs.version }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Docker Images
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/simpelv2:${{ steps.version.outputs.version }}
            ```

            **Full Changelog**: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          artifactErrorsFailBuild: false

  build-backend:
    name: Build Backend - ${{ matrix.target }}
    runs-on: self-hosted
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hanya x86_64-gnu — Docker images target linux/amd64 only.
          # JANGAN tambahkan musl atau aarch64 di sini (rustup conflict di
          # self-hosted runner; cross-compile butuh setup tambahan).
          - target: x86_64-unknown-linux-gnu
            cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: |
          if ! command -v cross &> /dev/null; then
            cargo install cross --locked
          fi

      - name: Build workspace (native)
        if: "!matrix.cross"
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Build workspace (cross)
        if: matrix.cross
        run: cross build --workspace --release --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p release-artifacts
          if [ -d "target/${{ matrix.target }}/release" ]; then
            find target/${{ matrix.target }}/release -maxdepth 1 -type f -executable \
              ! -name "*.d" ! -name "*.so" ! -name "*.dylib" \
              -exec cp {} release-artifacts/ \;
          fi
          cd release-artifacts
          tar czf ../simpelv2-backend-${{ matrix.target }}.tar.gz * 2>/dev/null || echo "No binaries to package"
          cd ..
          sha256sum simpelv2-backend-${{ matrix.target }}.tar.gz > simpelv2-backend-${{ matrix.target }}.tar.gz.sha256 2>/dev/null || true

      - name: Upload release assets
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.create-release.outputs.version }}
          artifacts: "simpelv2-backend-${{ matrix.target }}.tar.gz,simpelv2-backend-${{ matrix.target }}.tar.gz.sha256"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifactErrorsFailBuild: false

  build-frontend:
    name: Build Frontend
    runs-on: self-hosted
    needs: create-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: frontend-release

      - name: Install Trunk
        run: |
          if ! command -v trunk &> /dev/null; then
            mkdir -p $HOME/.local/bin
            curl -LsSf "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
              | tar -xzf- -C $HOME/.local/bin/
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi

      - name: Build microfrontends
        run: |
          set -e
          mkdir -p release-frontend
          for module in portal perlengkapan; do
            echo "Building $module..."
            cd antarmuka/$module
            trunk build --release
            cp -r dist ../../release-frontend/$module
            cd ../..
          done

      - name: Package frontend artifacts
        run: |
          cd release-frontend
          tar czf ../simpelv2-frontend-${{ needs.create-release.outputs.version }}.tar.gz *
          cd ..
          sha256sum simpelv2-frontend-${{ needs.create-release.outputs.version }}.tar.gz \
            > simpelv2-frontend-${{ needs.create-release.outputs.version }}.tar.gz.sha256

      - name: Upload frontend artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ needs.create-release.outputs.version }}
          artifacts: "simpelv2-frontend-${{ needs.create-release.outputs.version }}.tar.gz,simpelv2-frontend-${{ needs.create-release.outputs.version }}.tar.gz.sha256"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifactErrorsFailBuild: false

  build-docker:
    name: Build & Push - ${{ matrix.image.name }}
    runs-on: self-hosted
    needs: [create-release, build-backend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # 7 paralel docker build aman dengan driver: docker (shared buildkit di
      # Docker daemon, bukan spawn container per job). Lihat step setup-buildx
      # di bawah. Self-hosted runner host punya 64GB RAM + 48 core.
      matrix:
        image:
          # 7 images yang di-deploy ke production (sesuai plan):
          # - 2 frontend (portal, perlengkapan): Leptos WASM + nginx
          # - 4 backend Rust (authenc, layanan-integrasi, layanan-perlengkapan, secreton)
          # - 1 monolith Laravel (simpelv1)
          - { name: portal,                context: ., dockerfile: antarmuka/portal/Dockerfile }
          - { name: perlengkapan,          context: ., dockerfile: antarmuka/perlengkapan/Dockerfile }
          - { name: authenc,               context: ., dockerfile: layanan/authenc/Dockerfile }
          - { name: layanan-integrasi,     context: ., dockerfile: layanan/integrasi/Dockerfile }
          - { name: layanan-perlengkapan,  context: ., dockerfile: layanan/perlengkapan/Dockerfile }
          - { name: secreton,              context: ., dockerfile: layanan/secreton/Dockerfile }
          - { name: simpelv1,              context: ., dockerfile: monolith/simpelv1/Dockerfile }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Unique buildx instance per matrix job → 7 buildkit container
          # terpisah (tidak share state). `cleanup: false` agar post-job tidak
          # docker rm yang bisa race dengan jobs lain di Docker daemon yang sama
          # (root cause graceful_stop di rc4). Buildkit container akan ke-clean
          # naturally saat runner reboot atau via `docker buildx prune` manual.
          name: buildx-${{ matrix.image.name }}-${{ github.run_id }}
          cleanup: false
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Image: ghcr.io/<owner>/simpelv2-<image-name>
          # ghcr.io path untuk personal account hanya support 1 segment di bawah
          # owner (tidak nested). Pakai prefix simpelv2- untuk avoid name collision.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/simpelv2-${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.create-release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.create-release.outputs.version }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.create-release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Proprietary
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.description=SIMPEL Kejaksaan RI - ${{ matrix.image.name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          provenance: true
          sbom: true

      - name: Verify pushed image
        run: |
          # Pakai buildx imagetools inspect (share auth dengan login step di atas).
          # docker manifest inspect butuh `docker login` lagi yang tidak persisted.
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/simpelv2-${{ matrix.image.name }}:v${{ needs.create-release.outputs.version }}
