# maintenance.yml — Health check + dependency audit + governance
# (rename + perluasan dari health-check.yml)

name: Maintenance

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/labels.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-syntax:
    name: Workflow Syntax (actionlint)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: raven-actions/actionlint@v2
        continue-on-error: true
        with:
          fail-on-error: false
      - name: YAML safe-load fallback
        shell: bash
        run: |
          INVALID=0
          for workflow in .github/workflows/*.yml; do
            if python3 -c "import yaml; yaml.safe_load(open('$workflow'))" 2>/dev/null; then
              echo "OK $(basename "$workflow")"
            else
              echo "::error::Invalid YAML: $workflow"
              INVALID=$((INVALID + 1))
            fi
          done
          exit "$INVALID"

  dependency-health:
    name: Dependency Health
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: maintenance-deps
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo audit
        shell: bash
        continue-on-error: true
        run: |
          if ! command -v cargo-audit &>/dev/null; then
            cargo install cargo-audit --locked
          fi
          {
            echo "## Cargo Audit"
            echo '```'
            cargo audit 2>&1 | head -120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: cargo outdated
        shell: bash
        continue-on-error: true
        run: |
          if ! command -v cargo-outdated &>/dev/null; then
            cargo install cargo-outdated --locked
          fi
          {
            echo "## Cargo Outdated"
            echo '```'
            cargo outdated --workspace --depth 1 2>&1 | head -120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  codeowners-validate:
    name: Validate CODEOWNERS
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Validate CODEOWNERS paths
        shell: bash
        run: |
          set -euo pipefail
          [ -f .github/CODEOWNERS ] || { echo "No CODEOWNERS file"; exit 0; }
          missing=0
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            path_pattern="${line%% *}"
            [ -z "$path_pattern" ] && continue
            check="${path_pattern#/}"
            check="${check%/}"
            if [[ "$check" == *"*"* ]]; then
              continue
            fi
            if [ ! -e "$check" ] && [ ! -e "${check%/*}" ]; then
              echo "::warning::CODEOWNERS path tidak ditemukan: $path_pattern"
              missing=$((missing+1))
            fi
          done < .github/CODEOWNERS
          echo "CODEOWNERS check selesai (warnings: $missing)"

  label-sync:
    name: Sync Labels
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'labels.yml'))
    steps:
      - uses: actions/checkout@v6
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false

  stale:
    name: Stale Issues & PRs
    runs-on: self-hosted
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: |
            Issue ini ditandai stale karena tidak ada aktivitas selama 60 hari. Silakan komen jika masih relevan, atau akan ditutup dalam 14 hari.
          stale-pr-message: |
            PR ini ditandai stale karena tidak ada aktivitas selama 60 hari. Silakan rebase/komen jika masih dikerjakan.
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'priority:high,security,pinned'
          exempt-pr-labels: 'priority:high,security,pinned,dependencies'
          operations-per-run: 50

  infrastructure-health:
    name: Runner Health
    runs-on: self-hosted
    steps:
      - name: Check Docker & Disk (pre-clean)
        id: pre
        shell: bash
        run: |
          {
            echo "## Runner Infrastructure"
            echo
            if command -v docker &>/dev/null; then
              echo "- Docker: $(docker --version)"
            else
              echo "- Docker: NOT AVAILABLE"
            fi
            FREE_SPACE=$(df -BG / | tail -1 | awk '{print $4}' | sed 's/G//')
            echo "- Free disk space (pre-clean): ${FREE_SPACE}GB"
            echo "free_pre=${FREE_SPACE}" >> "$GITHUB_OUTPUT"
            if [ "$FREE_SPACE" -lt 20 ]; then
              echo "::warning::Low disk space before cleanup: ${FREE_SPACE}GB"
            fi
            echo "- Free RAM: $(free -h | awk '/^Mem:/ {print $7}')"
            echo "- Load avg: $(uptime | awk -F'load average:' '{print $2}')"
          } >> "$GITHUB_STEP_SUMMARY"

      # Host-wide cleanup. This is the *primary* janitor; per-workflow
      # cleanup steps (release.yml::cleanup-runner, ci.yml::cleanup-runner,
      # autofix.yml::cleanup-runner) handle the per-run spike but rely on
      # this daily pass to keep aggregate growth bounded. Runs on the
      # 06:00 UTC cron — natural job distribution covers every self-hosted
      # runner over a few days.
      - name: Trim BuildKit + Docker + Rust target caches
        shell: bash
        run: |
          set +e
          echo "::group::BuildKit cache (--keep-storage 20gb)"
          docker buildx prune --force --keep-storage 20gb
          echo "::endgroup::"

          echo "::group::Dangling Docker images (>168h)"
          docker image prune --force --filter "until=168h"
          echo "::endgroup::"

          echo "::group::Orphan buildx volumes"
          docker volume prune --force --filter "label=builder=buildx"
          echo "::endgroup::"

          # Stopped buildkit containers older than 24h — survivors of
          # cancelled jobs where the post-hook didn't fire. The
          # `cleanup: true` default on setup-buildx-action handles the
          # happy path; this catches the rest.
          echo "::group::Stopped buildx containers (>24h)"
          docker ps -a --filter "name=buildx_buildkit" --filter "status=exited" \
            --format "{{.ID}} {{.CreatedAt}}" | \
            awk '{
              cmd="date -d \""$2" "$3" "$4"\" +%s 2>/dev/null"
              if ((cmd | getline ts) > 0 && (systime() - ts) > 86400) print $1
              close(cmd)
            }' | xargs -r docker rm -v
          echo "::endgroup::"

          # `target/` from CI runs that exited without the matching cleanup
          # step. The default GitHub Actions work dir is `_work/<repo>/<repo>`;
          # walk those and reap target/ + dist/ older than 24h. This is the
          # workaround for the leak between ci.yml jobs on idle runners.
          echo "::group::Stale CI workdir target/ + dist/ (>24h)"
          WORK_DIR="${RUNNER_WORKSPACE%/*}"  # one above the current run's dir
          if [ -d "$WORK_DIR" ]; then
            find "$WORK_DIR" -maxdepth 4 -type d \( -name target -o -name dist \) \
              -mtime +1 -print -exec rm -rf {} + 2>/dev/null || true
          else
            echo "RUNNER_WORKSPACE parent not resolvable; skipping target/dist sweep"
          fi
          echo "::endgroup::"

          # The steps above prune cache/images/volumes but NOT the leaked
          # per-run buildx *builder* entries (`buildx-<image>-<runid>`) nor
          # their buildkit containers when those are still in `running` state
          # (the `status=exited` filter above misses them). Historically
          # docker-build used `cleanup: false`, so one builder leaked per run
          # (818 builders / 154 buildkit containers / 155 volumes had piled up).
          # `cleanup: true` on the action fixes new runs; this reaps the backlog
          # + any straggler. 24h age threshold protects in-flight builds.
          echo "::group::Leaked buildx builders + buildkit containers (>24h)"
          NOW=$(date +%s)
          docker ps -a --filter "name=buildx_buildkit" \
            --format '{{.Names}}|{{.CreatedAt}}' | while IFS='|' read -r cname created; do
            ts=$(date -d "$created" +%s 2>/dev/null) || continue
            [ -z "$ts" ] && continue
            if [ $((NOW - ts)) -gt 86400 ]; then
              builder="${cname#buildx_buildkit_}"; builder="${builder%0}"
              echo "reaping builder=$builder (container=$cname)"
              docker buildx rm -f "$builder" 2>/dev/null || docker rm -f -v "$cname" 2>/dev/null
            fi
          done
          # Drop dangling builder registry entries whose container is gone.
          for b in $(docker buildx ls --format '{{.Name}}' 2>/dev/null | grep '^buildx-'); do
            docker inspect "buildx_buildkit_${b}0" >/dev/null 2>&1 || docker buildx rm -f "$b" 2>/dev/null
          done
          docker volume prune --force >/dev/null 2>&1
          echo "::endgroup::"

      - name: Post-clean disk report
        shell: bash
        env:
          FREE_PRE: ${{ steps.pre.outputs.free_pre }}
        run: |
          FREE_POST=$(df -BG / | tail -1 | awk '{print $4}' | sed 's/G//')
          {
            echo
            echo "## Cleanup Result"
            echo "- Free disk before: ${FREE_PRE}GB"
            echo "- Free disk after:  ${FREE_POST}GB"
            DELTA=$((FREE_POST - FREE_PRE))
            if [ "$DELTA" -gt 0 ]; then
              echo "- Reclaimed: +${DELTA}GB"
            else
              echo "- Reclaimed: 0GB (caches already lean)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FREE_POST" -lt 20 ]; then
            echo "::warning::Low disk space even after cleanup: ${FREE_POST}GB — investigate non-Docker bloat (logs, journal, /tmp)"
          fi
