# maintenance.yml — Health check + dependency audit + governance
# (rename + perluasan dari health-check.yml)

name: Maintenance

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/labels.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-syntax:
    name: Workflow Syntax (actionlint)
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # actionlint parses the YAML *and* validates workflow semantics + the
      # embedded shell (via shellcheck), so it strictly supersedes the
      # hand-rolled `yaml.safe_load` fallback this job used to carry.
      #
      # That fallback ran `python3 -c "import yaml; ..."` per workflow. python3
      # exists on the ARC runner (ci-summary uses it), but the runner image
      # `infra/helm/arc/runner-image/Dockerfile` installs no **PyYAML** — so the
      # import raised, every file was reported "Invalid YAML", and the job
      # exited with the file count. That is why this job failed all 40
      # scheduled runs since at least 2026-06-22 while the real linter sat
      # behind `fail-on-error: false` and gated nothing: the only step that
      # could fail was the one measuring its own missing dependency.
      # (Verified: all 8 workflows pass `yaml.safe_load` locally.)
      #
      # Findings are now the gate; the undeclared dependency is gone.
      #
      # Run actionlint from its OFFICIAL IMAGE rather than via
      # `raven-actions/actionlint@v2`. Making the linter the real gate exposed
      # that the action cannot run on our ARC runner at all: it resolves and
      # downloads its binary through the GitHub API from inside
      # `actions/github-script`, that request fails here, and the step dies with
      # **exit 127 (command not found)**.
      #
      # So the action has been broken on this runner the whole time — the old
      # `fail-on-error: false` + `continue-on-error: true` simply swallowed the
      # 127. Between that and the PyYAML fallback described above, this job has
      # never actually linted a single workflow.
      #
      # `docker run` is the pattern already used in this repo for pinned
      # third-party tooling (see composer-audit in security.yml and trivy), and
      # the ARC runner has a dind sidecar. The image tag is PINNED, not
      # `:latest` — a floating tag is exactly what caused the FE nightly-rustc
      # ICE and the Blade plugin breakage (#119).
      - name: actionlint (pinned image)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12 -color

      # Dependabot titles its PRs "<commit-message.prefix>: bump ...", so an
      # invalid prefix makes EVERY bot PR of that ecosystem fail the
      # Conventional-Commits gate in labeler.yml. That drifted unnoticed for
      # months: `monolith(deps)`, `ui(deps)` and `docker` each put a SCOPE (or a
      # bare word) where the TYPE belongs. Nothing caught it because the title
      # check is not one of the required status checks, so the red never blocked
      # a merge — #677, #700 and #707 all landed with a failing title job.
      #
      # A hand-kept list would rot exactly the same way, so derive both sides
      # mechanically: every prefix in dependabot.yml must decompose into a type
      # and optional scope that the gate actually accepts.
      #
      # yq runs from a PINNED image for the same reason actionlint does above —
      # the ARC runner image ships neither yq nor PyYAML.
      - name: Dependabot prefixes match the PR-title gate
        shell: bash
        run: |
          set -euo pipefail

          run_yq() {
            docker run --rm -v "$PWD:/repo:ro" -w /repo mikefarah/yq:4.44.3 "$@"
          }

          has() {
            printf '%s\n' "${@:2}" | grep -qxF -- "$1"
          }

          mapfile -t prefixes < <(run_yq '.updates[].commit-message.prefix' .github/dependabot.yml)
          mapfile -t types < <(run_yq '.jobs.pr-title-check.steps[0].with.types' .github/workflows/labeler.yml)
          mapfile -t scopes < <(run_yq '.jobs.pr-title-check.steps[0].with.scopes' .github/workflows/labeler.yml)

          failed=0
          for prefix in "${prefixes[@]}"; do
            ctype=${prefix%%(*}
            cscope=""
            case "$prefix" in
              *"("*)
                cscope=${prefix#*(}
                cscope=${cscope%)}
                ;;
            esac

            if ! has "$ctype" "${types[@]}"; then
              echo "::error file=.github/dependabot.yml::commit-message prefix '${prefix}' uses type '${ctype}', which the PR-title gate does not accept"
              failed=1
            fi
            if [ -n "$cscope" ] && ! has "$cscope" "${scopes[@]}"; then
              echo "::error file=.github/dependabot.yml::commit-message prefix '${prefix}' uses scope '${cscope}', which the PR-title gate does not accept"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "all ${#prefixes[@]} Dependabot prefixes satisfy the PR-title gate"

      # The ARC runner reaper deletes an EphemeralRunner that still holds a job
      # assignment after REAP_AFTER_MINUTES. That is only safe while the
      # threshold sits ABOVE the longest run GitHub itself would still allow —
      # otherwise the reaper kills a job that is legitimately still running.
      # The two numbers live in different files and would drift silently, so
      # derive both from the files instead of trusting a comment. Same yq image
      # as the check above: the runner image ships neither yq nor PyYAML.
      - name: Assert runner-reaper threshold covers every job timeout
        shell: bash
        run: |
          set -euo pipefail

          run_yq() {
            docker run --rm -v "$PWD:/repo:ro" -w /repo mikefarah/yq:4.44.3 "$@"
          }

          margin=30
          reaper=$(run_yq '
            select(.kind == "CronJob")
            | .spec.jobTemplate.spec.template.spec.containers[0].env[]
            | select(.name == "REAP_AFTER_MINUTES") | .value
          ' infra/helm/arc/reaper.yaml)

          if [ -z "$reaper" ]; then
            echo "::error file=infra/helm/arc/reaper.yaml::REAP_AFTER_MINUTES not found"
            exit 1
          fi

          # Every job must declare a timeout; an undeclared one silently
          # inherits GitHub's 360-minute default and would outlive the reaper.
          #
          # Name the offenders rather than counting them: a bare number sends
          # the next person hunting through eight files by hand. `filename` is
          # a yq operator, so the file/job pair comes straight out of the query.
          #
          # No `bc` here, and that is the point — the ARC runner image does not
          # ship it, and the first cut of this step died with exit 127 for
          # exactly that reason. It is the same undeclared-dependency trap that
          # made this very job a false-red for 40 scheduled runs (PyYAML, see
          # the actionlint comment above). Shell built-ins only.
          missing=$(run_yq -r '
            .jobs
            | to_entries[]
            | select(.value | has("timeout-minutes") | not)
            | filename + " -> " + .key
          ' .github/workflows/*.yml)
          if [ -n "$missing" ]; then
            while read -r job; do
              echo "::error::${job} has no timeout-minutes; it inherits GitHub's 360m default and would outlive the reaper"
            done <<< "$missing"
            exit 1
          fi

          longest=$(run_yq -r '.jobs[].timeout-minutes' .github/workflows/*.yml | sort -n | tail -1)
          required=$((longest + margin))

          if [ "$reaper" -lt "$required" ]; then
            echo "::error file=infra/helm/arc/reaper.yaml::REAP_AFTER_MINUTES=${reaper} is below the longest job timeout (${longest}m) plus ${margin}m margin = ${required}m. Raise the reaper threshold or lower the job timeout."
            exit 1
          fi

          echo "reaper ${reaper}m >= longest job timeout ${longest}m + ${margin}m margin"

  dependency-health:
    name: Dependency Health
    runs-on: arc-simpel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: maintenance-deps
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo audit
        shell: bash
        # continue-on-error tetap ada (job ini murni pelaporan), tapi pembungkus
        # retry menyembuhkan akar masalahnya: `cargo audit` lebih dulu mengambil
        # DB advisory RustSec, jadi kegagalan jaringan mengosongkan laporan ini
        # tanpa ada yang menyadarinya.
        continue-on-error: true
        run: |
          if ! command -v cargo-audit &>/dev/null; then
            curl -LsSf --retry 4 --retry-delay 2 --retry-all-errors \
              --connect-timeout 15 --max-time 180 \
              "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.1/cargo-audit-x86_64-unknown-linux-gnu-v0.22.1.tgz" \
              | tar -xzf- --strip-components=1 -C "$CARGO_HOME/bin/" \
                cargo-audit-x86_64-unknown-linux-gnu-v0.22.1/cargo-audit 2>/dev/null \
              || cargo install cargo-audit --locked
          fi
          # Pembungkus menulis markdown-nya SENDIRI (heading + <details> + fence
          # + verdict). Jangan membungkusnya dengan fence lain di sini: fence
          # bersarang merusak render summary, dan verdict-nya justru menghilang
          # di dalam blok kode.
          echo "## Cargo Audit" >> "$GITHUB_STEP_SUMMARY"
          python3 ./infra/scripts/retry-dependency-check.py \
            --name "cargo audit (maintenance)" --attempts 3 --timeout 420 \
            --allow-failure -- cargo audit || true
      - name: cargo outdated
        shell: bash
        continue-on-error: true
        run: |
          if ! command -v cargo-outdated &>/dev/null; then
            # `cargo install` mengunduh + mengompilasi dari crates.io: jalur
            # jaringan + kompilasi. Sama seperti tetangganya, ia di-retry.
            ok=0
            for attempt in 1 2 3; do
              if cargo install cargo-outdated --locked; then ok=1; break; fi
              echo "::warning::cargo install cargo-outdated gagal (percobaan ${attempt}/3)"
              [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::warning::cargo-outdated tidak terpasang (jaringan/crates.io) — laporan dilewati, bukan temuan dependency"
              exit 0
            fi
          fi
          {
            echo "## Cargo Outdated"
            echo '```'
            cargo outdated --workspace --depth 1 2>&1 | head -120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  codeowners-validate:
    name: Validate CODEOWNERS
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate CODEOWNERS paths
        shell: bash
        run: |
          set -euo pipefail
          [ -f .github/CODEOWNERS ] || { echo "No CODEOWNERS file"; exit 0; }
          missing=0
          while IFS= read -r line; do
            line="${line%%#*}"
            line="$(echo "$line" | xargs)"
            [ -z "$line" ] && continue
            path_pattern="${line%% *}"
            [ -z "$path_pattern" ] && continue
            check="${path_pattern#/}"
            check="${check%/}"
            if [[ "$check" == *"*"* ]]; then
              continue
            fi
            if [ ! -e "$check" ] && [ ! -e "${check%/*}" ]; then
              echo "::warning::CODEOWNERS path tidak ditemukan: $path_pattern"
              missing=$((missing+1))
            fi
          done < .github/CODEOWNERS
          echo "CODEOWNERS check selesai (warnings: $missing)"

  label-sync:
    name: Sync Labels
    runs-on: arc-simpel
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'labels.yml'))
    steps:
      - uses: actions/checkout@v7
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false

  stale:
    name: Stale Issues & PRs
    runs-on: arc-simpel
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: |
            Issue ini ditandai stale karena tidak ada aktivitas selama 60 hari. Silakan komen jika masih relevan, atau akan ditutup dalam 14 hari.
          stale-pr-message: |
            PR ini ditandai stale karena tidak ada aktivitas selama 60 hari. Silakan rebase/komen jika masih dikerjakan.
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'priority:high,security,pinned'
          exempt-pr-labels: 'priority:high,security,pinned,dependencies'
          operations-per-run: 50
