name: Auto-Fix - Cargo & Format

on:
  schedule:
    - cron: "0 3 * * 1"  # Weekly on Monday at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: auto-fix
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  auto-fix:
    name: Auto-fix Workspace
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: autofix

      - name: Apply fixes
        run: |
          cargo fix --workspace --all-targets --allow-dirty --allow-staged || true
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged || true
          cargo fmt --all

      - name: Validate fixes
        run: cargo check --workspace --all-targets

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(autofix): apply cargo fix, clippy, and fmt"
          branch: autofix/cargo-fixes-${{ github.run_number }}
          base: main
          delete-branch: true
          title: "[Auto-fix] Weekly cargo fix, clippy & format"
          body: |
            ## Automatic Code Fixes

            Fixes applied by the weekly auto-fix workflow:
            - `cargo fix --workspace`
            - `cargo clippy --fix --workspace`
            - `cargo fmt --all`

            **Auto-generated by**: `.github/workflows/auto-fix.yml`
          labels: |
            automated
            maintenance
