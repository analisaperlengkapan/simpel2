name: Enforce Cargo Versioning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-versioning:
    name: Check workspace versioning
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Validate Cargo versioning
        shell: bash
        run: python3 ./infra/scripts/check-cargo-versioning.py check

      - name: Summarize result
        if: always()
        shell: bash
        run: |
          echo "## Cargo Versioning" >> "$GITHUB_STEP_SUMMARY"
          echo "Root workspace package version remains the single source of truth." >> "$GITHUB_STEP_SUMMARY"
          echo "Member manifests must use version.workspace = true and must not declare their own [workspace]." >> "$GITHUB_STEP_SUMMARY"
