name: CI - Backend Services

on:
  push:
    branches: [main, develop]
    paths:
      - "layanan/**"
      - "infra/authenc/**"
      - "infra/secreton/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "layanan/**"
      - "infra/authenc/**"
      - "infra/secreton/**"
      - "Cargo.toml"
      - "Cargo.lock"

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  RUST_VERSION: "1.90.0"

jobs:
  check:
    name: Cargo Check
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
            ${{ runner.os }}-cargo-

      - name: Run cargo check (workspace)
        run: cargo check --workspace --all-targets --verbose

      - name: Check authenc (separate workspace)
        working-directory: infra/authenc
        run: cargo check --all-targets --verbose

      - name: Check secreton (separate workspace)
        working-directory: infra/secreton
        run: cargo check --all-targets --verbose

  test:
    name: Test Suite
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Start Postgres (if Docker available)
        id: start-pg
        run: |
          if command -v docker &> /dev/null; then
            echo "Starting Postgres container..."
            docker run -d --name postgres-test -e POSTGRES_USER=simpelv2_test -e POSTGRES_PASSWORD=test_password_secure_2024 -e POSTGRES_DB=simpelv2_test -p 55432:5432 postgres:15-alpine

            # Wait for Postgres
            echo "Waiting for Postgres..."
            timeout 30s bash -c 'until docker exec postgres-test pg_isready -U simpelv2_test; do sleep 1; done'

            echo "DATABASE_URL=postgres://simpelv2_test:test_password_secure_2024@localhost:55432/simpelv2_test" >> $GITHUB_ENV
            echo "docker_available=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Docker not found. Skipping database tests."
            echo "docker_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Run workspace tests
        if: steps.start-pg.outputs.docker_available == 'true'
        run: cargo test --workspace --all-targets --verbose
        env:
          DATABASE_URL: postgres://simpelv2_test:test_password_secure_2024@localhost:55432/simpelv2_test

      - name: Test authenc (separate workspace)
        working-directory: infra/authenc
        if: steps.start-pg.outputs.docker_available == 'true'
        run: cargo test --all-targets --verbose
        continue-on-error: true

      - name: Test secreton (separate workspace)
        working-directory: infra/secreton
        if: steps.start-pg.outputs.docker_available == 'true'
        run: cargo test --all-targets --verbose
        continue-on-error: true

      - name: Cleanup Postgres
        if: always() && steps.start-pg.outputs.docker_available == 'true'
        run: docker rm -f postgres-test || true

  clippy:
    name: Clippy Linting
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-

      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy authenc
        working-directory: infra/authenc
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy secreton
        working-directory: infra/secreton
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Code Formatting
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting (workspace)
        run: cargo fmt --all --check

      - name: Check formatting (authenc)
        working-directory: infra/authenc
        run: cargo fmt --all --check

      - name: Check formatting (secreton)
        working-directory: infra/secreton
        run: cargo fmt --all --check

  build-release:
    name: Build Release Binaries
    runs-on: self-hosted
    needs: [check, clippy, fmt]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Protocol Buffers compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build workspace in release mode
        run: cargo build --workspace --release --verbose

      - name: Build authenc
        working-directory: infra/authenc
        run: cargo build --release --verbose

      - name: Build secreton
        working-directory: infra/secreton
        run: cargo build --release --verbose

      - name: List built binaries
        run: |
          echo "=== Workspace Binaries ==="
          find target/release -maxdepth 1 -type f -executable
          echo "=== Authenc Binaries ==="
          find infra/authenc/target/release -maxdepth 1 -type f -executable 2>/dev/null || echo "None"
          echo "=== Secreton Binaries ==="
          find infra/secreton/target/release -maxdepth 1 -type f -executable 2>/dev/null || echo "None"
