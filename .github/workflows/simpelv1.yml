name: Build & Push SIMPEL v1

on:
  push:
    branches:
      - main
      - staging
      - "feat/**"
    paths:
      - "monolith/simpelv1/**"
      - "docker-compose.yml"
      - "docker-compose.build.yml"
      - ".github/workflows/simpelv1.yml"
  pull_request:
    branches:
      - main
      - staging
    paths:
      - "monolith/simpelv1/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/simpelv1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build SIMPEL v1 Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./monolith/simpelv1/Dockerfile
          # On `push` events the image is pushed to the registry; on
          # `pull_request` events we instead `load` it into the local
          # Docker daemon so the SBOM and security-scan steps below can
          # reference it without it existing in the registry.
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: cyclonedx-json
          output-file: sbom-${{ env.IMAGE_TAG }}.json
          artifact-name: sbom-simpelv1

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-simpelv1
          path: sbom-*.json

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    # Only run on push events. On `pull_request` the image is built with
    # `load:` rather than `push:`, so it only exists on the build job's
    # runner — a separate runner for the scan job can't pull it from the
    # registry. PR scans are picked up by the post-merge run on `main`.
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

  test:
    name: Test SIMPEL v1
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dbsimpelv1_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pgsql, pdo_pgsql
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: ./monolith/simpelv1
        run: composer install --no-ansi --no-interaction --no-progress

      - name: Set up environment
        working-directory: ./monolith/simpelv1
        run: |
          # Laravel's LoadEnvironmentVariables bootstrapper only loads
          # `.env` by default, or `.env.{APP_ENV}` when APP_ENV is set
          # (phpunit.xml sets APP_ENV=testing, so `.env.testing` is also
          # honoured). It does NOT load `.env.test`, which would silently
          # leave APP_KEY unset and make EncryptCookies throw on every
          # web request. Write to `.env` so the values are actually used.
          cp .env.example .env
          php artisan key:generate --force
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=dbsimpelv1_test"
            echo "DB_USERNAME=postgres"
            echo "DB_PASSWORD=postgres"
          } >> .env

      - name: Run Laravel tests
        working-directory: ./monolith/simpelv1
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: dbsimpelv1_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          php artisan migrate --force
          php artisan test --coverage --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./monolith/simpelv1/coverage.xml
          flags: simpelv1
          name: simpelv1-coverage

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [build, security-scan, test]
    if: always()
    
    steps:
      - name: Check job status
        run: |
          if [[ "${{ needs.build.result }}" == "failure" || "${{ needs.security-scan.result }}" == "failure" || "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ Pipeline failed"
            exit 1
          else
            echo "✅ SIMPEL v1 pipeline completed successfully"
          fi

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: "SIMPEL v1 - ${{ github.ref }}"
          body: |
            SIMPEL v1 (Legacy PHP) Release
            
            **Build Info:**
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref }}
            - Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          draft: false
          prerelease: false
