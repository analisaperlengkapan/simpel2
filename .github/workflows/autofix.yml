# autofix.yml — Auto-fix di pull_request ke main.
#
# Design: setiap fixer berjalan di JOB TERPISAH yang paralel. Kegagalan
# satu job tidak mempengaruhi yang lain (tiap job punya conclusion
# sendiri di workflow UI). Job yang sukses tetap commit + push
# perubahannya ke branch PR. Multiple paralel push di-handle dengan
# retry-on-rejection-via-rebase loop di tiap job — kalau push ditolak
# karena ada job lain push duluan, fetch + rebase + push lagi.
#
# Fixers:
#   - rust       : cargo fmt + cargo fix + clippy --fix + Cargo versioning
#   - toml       : taplo fmt
#   - markdown   : markdownlint-cli2 --fix
#   - php        : Laravel Pint (PSR-12 + Laravel preset)
#   - whitespace : trim trailing whitespace untuk yaml/json/sh/sql
#
# Untuk PR dari fork (read-only token), push tidak bisa — patch
# di-upload sebagai artifact di job `patch-for-fork`.
#
# PENTING — status CI di PR:
#   Push autofix HARUS pakai secret `AUTOFIX_PAT` (fine-grained PAT,
#   scope: Contents write + Pull requests write + Workflows write).
#   Sebab: commit yang di-push pakai GITHUB_TOKEN bawaan TIDAK memicu
#   ulang workflow lain (ci.yml/security.yml) → check PR jadi basi dan
#   harus dicek manual di tab Actions. Dengan PAT, push memicu ulang CI
#   sehingga status check di PR ter-refresh otomatis.
#   Bila secret belum dibuat, workflow tetap jalan (fallback ke
#   GITHUB_TOKEN) — hanya saja CI tidak ter-trigger ulang.
#   Job `guard` mencegah loop: skip fixer bila HEAD sudah commit autofix.

name: Autofix PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DEBIAN_FRONTEND: noninteractive

jobs:
  # ─────────────────────────────────────────────────────────
  # Anti-loop guard: skip semua fixer kalau HEAD commit PR sudah
  # merupakan commit autofix. Push autofix (pakai AUTOFIX_PAT)
  # MEMICU ulang workflow (itu tujuannya, agar CI re-run), tapi
  # autofix sendiri tak perlu jalan lagi di atas commit-nya sendiri.
  # ─────────────────────────────────────────────────────────
  guard:
    name: Anti-loop guard
    runs-on: arc-simpel
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      is_autofix: ${{ steps.check.outputs.is_autofix }}
    steps:
      - name: Checkout PR head (shallow)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 1
          token: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}
      - name: Detect autofix HEAD commit
        id: check
        shell: bash
        run: |
          msg="$(git log -1 --pretty=%s)"
          author="$(git log -1 --pretty=%ae)"
          if [[ "$msg" == "chore(autofix):"* ]] || [[ "$author" == *"github-actions[bot]"* ]]; then
            echo "is_autofix=true" >> "$GITHUB_OUTPUT"
            echo "HEAD commit adalah autofix (\"$msg\") — fixer di-skip untuk cegah loop."
          else
            echo "is_autofix=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────
  # Rust: cargo fmt + cargo fix + clippy --fix + Cargo versioning
  # ─────────────────────────────────────────────────────────
  rust:
    name: Autofix (Rust)
    needs: guard
    runs-on: arc-simpel
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.guard.outputs.is_autofix != 'true'
    concurrency:
      group: autofix-rust-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: autofix-rust

      - name: Apply cargo fmt + fix + clippy --fix
        shell: bash
        run: |
          # Best-effort autofixer (bukan gate; gate ada di lint-rust di ci.yml).
          # Tiap step boleh gagal (lint yang tidak bisa auto-fix); commit yang
          # berhasil tetap di-push.
          fmt_exit=0; fix_exit=0; clippy_exit=0
          cargo fmt --all || fmt_exit=$?
          if [ $fmt_exit -ne 0 ]; then echo "::warning::cargo fmt exit code: $fmt_exit"; fi
          cargo fix --workspace --all-targets --all-features \
            --allow-dirty --allow-staged || fix_exit=$?
          if [ $fix_exit -ne 0 ]; then echo "::warning::cargo fix exit code: $fix_exit"; fi
          cargo clippy --workspace --all-targets --all-features \
            --fix --allow-dirty --allow-staged -- -W clippy::all || clippy_exit=$?
          if [ $clippy_exit -ne 0 ]; then echo "::warning::cargo clippy --fix exit code: $clippy_exit"; fi
          # Final fmt pass untuk reformat hasil fix/clippy.
          final_fmt_exit=0
          cargo fmt --all || final_fmt_exit=$?
          if [ $final_fmt_exit -ne 0 ]; then echo "::warning::final cargo fmt exit code: $final_fmt_exit"; fi
      - name: Normalize Cargo versioning
        shell: bash
        run: python3 ./infra/scripts/check-cargo-versioning.py fix || echo "::warning::Cargo versioning normalize gagal"

      - name: Commit & push (retry on rebase conflict)
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTOFIX_LABEL: "cargo fmt + cargo fix + clippy --fix + Cargo versioning"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "✓ No changes — nothing to commit for '$AUTOFIX_LABEL'"
            exit 0
          fi
          echo "── git diff --stat ──"; git diff --stat; echo "──────────────────────"
          git add -A
          git commit -m "chore(autofix): $AUTOFIX_LABEL

          Auto-applied by autofix.yml di PR #${PR_NUMBER}."
          # Retry: paralel autofix lain mungkin sudah push duluan ke
          # branch PR sama. Push ditolak → fetch + rebase + retry.
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin "HEAD:${PR_HEAD_REF}"; then
              echo "✓ Push sukses pada attempt ${attempt}"; exit 0
            fi
            echo "⟳ Push ditolak (attempt ${attempt}/8); fetch + rebase + retry"
            git fetch origin "${PR_HEAD_REF}"
            if ! git rebase "origin/${PR_HEAD_REF}"; then
              echo "::error::Rebase conflict — autofix job lain mengubah file yang sama dengan '$AUTOFIX_LABEL'."
              git rebase --abort
              exit 1
            fi
            sleep_s=$(( attempt < 5 ? (2 ** attempt) : 30 ))
            sleep "$sleep_s"
          done
          echo "::error::Push gagal setelah 8 attempts untuk '$AUTOFIX_LABEL'"
          exit 1

  # ─────────────────────────────────────────────────────────
  # TOML: taplo fmt
  # ─────────────────────────────────────────────────────────
  toml:
    name: Autofix (TOML)
    needs: guard
    runs-on: arc-simpel
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.guard.outputs.is_autofix != 'true'
    concurrency:
      group: autofix-toml-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}

      - name: Install taplo
        shell: bash
        run: |
          if ! command -v taplo &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL "https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz" \
              | gunzip - > "$HOME/.local/bin/taplo"
            chmod +x "$HOME/.local/bin/taplo"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: taplo fmt
        shell: bash
        run: |
          taplo_exit=0
          taplo fmt || taplo_exit=$?
          if [ $taplo_exit -ne 0 ]; then echo "::warning::taplo fmt exit code: $taplo_exit"; fi
      - name: Commit & push (retry on rebase conflict)
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTOFIX_LABEL: "taplo fmt (TOML)"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "✓ No changes — nothing to commit for '$AUTOFIX_LABEL'"
            exit 0
          fi
          git diff --stat
          git add -A
          git commit -m "chore(autofix): $AUTOFIX_LABEL

          Auto-applied by autofix.yml di PR #${PR_NUMBER}."
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin "HEAD:${PR_HEAD_REF}"; then
              echo "✓ Push sukses pada attempt ${attempt}"; exit 0
            fi
            echo "⟳ Push ditolak (attempt ${attempt}/8); fetch + rebase + retry"
            git fetch origin "${PR_HEAD_REF}"
            if ! git rebase "origin/${PR_HEAD_REF}"; then
              echo "::error::Rebase conflict pada '$AUTOFIX_LABEL'"; git rebase --abort; exit 1
            fi
            sleep_s=$(( attempt < 5 ? (2 ** attempt) : 30 ))
            sleep "$sleep_s"
          done
          echo "::error::Push gagal setelah 8 attempts untuk '$AUTOFIX_LABEL'"
          exit 1

  # ─────────────────────────────────────────────────────────
  # Markdown: markdownlint-cli2 --fix
  # ─────────────────────────────────────────────────────────
  markdown:
    name: Autofix (Markdown)
    needs: guard
    runs-on: arc-simpel
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.guard.outputs.is_autofix != 'true'
    concurrency:
      group: autofix-markdown-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}

      - name: markdownlint-cli2 --fix (via docker)
        shell: bash
        run: |
          md_exit=0
          docker run --rm \
            -v "$PWD":/workdir \
            davidanson/markdownlint-cli2:v0.18.0 \
            --fix --config /workdir/infra/lint/.markdownlint.jsonc \
            '**/*.md' \
            '!**/node_modules/**' \
            '!**/vendor/**' \
            '!**/target/**' \
            '!**/dist/**' \
            '!monolith/simpelv1/storage/**' \
            '!monolith/simpelv1/public/assets/libs/**' \
            '!**/CHANGELOG.md' \
            || md_exit=$?
          if [ $md_exit -ne 0 ]; then echo "::warning::markdownlint --fix exit code (sisa lint issue yang tidak auto-fixable): $md_exit"; fi
      - name: Commit & push (retry on rebase conflict)
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTOFIX_LABEL: "markdownlint --fix (Markdown)"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "✓ No changes — nothing to commit for '$AUTOFIX_LABEL'"
            exit 0
          fi
          git diff --stat
          git add -A
          git commit -m "chore(autofix): $AUTOFIX_LABEL

          Auto-applied by autofix.yml di PR #${PR_NUMBER}."
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin "HEAD:${PR_HEAD_REF}"; then
              echo "✓ Push sukses pada attempt ${attempt}"; exit 0
            fi
            echo "⟳ Push ditolak (attempt ${attempt}/8); fetch + rebase + retry"
            git fetch origin "${PR_HEAD_REF}"
            if ! git rebase "origin/${PR_HEAD_REF}"; then
              echo "::error::Rebase conflict pada '$AUTOFIX_LABEL'"; git rebase --abort; exit 1
            fi
            sleep_s=$(( attempt < 5 ? (2 ** attempt) : 30 ))
            sleep "$sleep_s"
          done
          echo "::error::Push gagal setelah 8 attempts untuk '$AUTOFIX_LABEL'"
          exit 1

  # ─────────────────────────────────────────────────────────
  # PHP: Laravel Pint
  # ─────────────────────────────────────────────────────────
  php:
    name: Autofix (PHP Pint)
    needs: guard
    runs-on: arc-simpel
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.guard.outputs.is_autofix != 'true'
    concurrency:
      group: autofix-php-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}

      - name: composer install + Pint
        shell: bash
        run: |
          if [ ! -d monolith/simpelv1 ]; then
            echo "::warning::monolith/simpelv1 tidak ada — skip pint"
            exit 0
          fi
          cd monolith/simpelv1
          if [ ! -f vendor/bin/pint ]; then
            docker run --rm \
              -v "$PWD":/app -w /app -u "$(id -u):$(id -g)" \
              -e COMPOSER_HOME=/tmp/composer \
              --entrypoint composer \
              serversideup/php:8.2-cli \
              install --prefer-dist --no-progress --no-interaction \
              --ignore-platform-req=ext-gd \
              || { echo "::warning::composer install gagal; skip pint"; exit 0; }
          fi
          pint_exit=0
          docker run --rm \
            -v "$PWD":/app -w /app -u "$(id -u):$(id -g)" \
            --entrypoint vendor/bin/pint \
            serversideup/php:8.2-cli \
            || pint_exit=$?
          if [ $pint_exit -ne 0 ]; then echo "::warning::pint exit code: $pint_exit"; fi
      - name: Commit & push (retry on rebase conflict)
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTOFIX_LABEL: "Laravel Pint (PHP)"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "✓ No changes — nothing to commit for '$AUTOFIX_LABEL'"
            exit 0
          fi
          git diff --stat
          git add -A
          git commit -m "chore(autofix): $AUTOFIX_LABEL

          Auto-applied by autofix.yml di PR #${PR_NUMBER}."
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin "HEAD:${PR_HEAD_REF}"; then
              echo "✓ Push sukses pada attempt ${attempt}"; exit 0
            fi
            echo "⟳ Push ditolak (attempt ${attempt}/8); fetch + rebase + retry"
            git fetch origin "${PR_HEAD_REF}"
            if ! git rebase "origin/${PR_HEAD_REF}"; then
              echo "::error::Rebase conflict pada '$AUTOFIX_LABEL'"; git rebase --abort; exit 1
            fi
            sleep_s=$(( attempt < 5 ? (2 ** attempt) : 30 ))
            sleep "$sleep_s"
          done
          echo "::error::Push gagal setelah 8 attempts untuk '$AUTOFIX_LABEL'"
          exit 1

  # ─────────────────────────────────────────────────────────
  # Whitespace: trim trailing untuk yaml/json/sh/sql
  # (file types yang BELUM dihandle tool spesifik di atas)
  # ─────────────────────────────────────────────────────────
  whitespace:
    name: Autofix (Trailing whitespace)
    needs: guard
    runs-on: arc-simpel
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.guard.outputs.is_autofix != 'true'
    concurrency:
      group: autofix-whitespace-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}

      - name: Strip trailing whitespace
        shell: bash
        run: |
          # Tipe file yang BELUM di-handle tool spesifik (taplo, pint,
          # rustfmt, markdownlint sudah handle trailing-whitespace untuk
          # masing-masing). Lewatkan Helm templates (`{{- }}` syntax
          # bisa rusak kalau ada trailing yang berarti).
          find . \
            \( -name '*.yml' -o -name '*.yaml' \
               -o -name '*.json' -o -name '*.sh' \
               -o -name '*.sql' \) \
            -not -path './node_modules/*' \
            -not -path './*/node_modules/*' \
            -not -path './target/*' \
            -not -path './vendor/*' \
            -not -path './*/vendor/*' \
            -not -path './infra/helm/*/templates/*' \
            -not -path './monolith/simpelv1/public/assets/libs/*' \
            -not -path './monolith/simpelv1/vendor/*' \
            -not -path './monolith/simpelv1/storage/*' \
            -not -path './.git/*' \
            -print0 \
          | xargs -0 -r sed -i 's/[[:space:]]\+$//'
          echo "Trailing whitespace stripped where applicable."

      - name: Commit & push (retry on rebase conflict)
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTOFIX_LABEL: "trim trailing whitespace (yaml/json/sh/sql)"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "✓ No changes — nothing to commit for '$AUTOFIX_LABEL'"
            exit 0
          fi
          git diff --stat
          git add -A
          git commit -m "chore(autofix): $AUTOFIX_LABEL

          Auto-applied by autofix.yml di PR #${PR_NUMBER}."
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin "HEAD:${PR_HEAD_REF}"; then
              echo "✓ Push sukses pada attempt ${attempt}"; exit 0
            fi
            echo "⟳ Push ditolak (attempt ${attempt}/8); fetch + rebase + retry"
            git fetch origin "${PR_HEAD_REF}"
            if ! git rebase "origin/${PR_HEAD_REF}"; then
              echo "::error::Rebase conflict pada '$AUTOFIX_LABEL'"; git rebase --abort; exit 1
            fi
            sleep_s=$(( attempt < 5 ? (2 ** attempt) : 30 ))
            sleep "$sleep_s"
          done
          echo "::error::Push gagal setelah 8 attempts untuk '$AUTOFIX_LABEL'"
          exit 1

  # ─────────────────────────────────────────────────────────
  # PR dari fork — token read-only, push tidak bisa.
  # Jalankan semua fixer berurutan, upload diff sebagai artifact.
  # ─────────────────────────────────────────────────────────
  patch-for-fork:
    name: Autofix patch (PR dari fork)
    runs-on: arc-simpel
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_PAT || secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: autofix-fork

      - name: Run all autofixers (best-effort, capture diff)
        shell: bash
        run: |
          set +e
          # Rust
          cargo fmt --all
          cargo fix --workspace --all-targets --allow-dirty --allow-staged
          cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged -- -W clippy::all
          cargo fmt --all
          python3 ./infra/scripts/check-cargo-versioning.py fix
          # TOML
          if ! command -v taplo &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL "https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz" \
              | gunzip - > "$HOME/.local/bin/taplo"
            chmod +x "$HOME/.local/bin/taplo"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          taplo fmt
          # Markdown
          docker run --rm \
            -v "$PWD":/workdir \
            davidanson/markdownlint-cli2:v0.18.0 \
            --fix --config /workdir/infra/lint/.markdownlint.jsonc \
            '**/*.md' \
            '!**/node_modules/**' '!**/vendor/**' '!**/target/**' '!**/dist/**' \
            '!monolith/simpelv1/storage/**' '!monolith/simpelv1/public/assets/libs/**' \
            '!**/CHANGELOG.md'
          # PHP Pint
          if [ -d monolith/simpelv1 ]; then
            (cd monolith/simpelv1 && \
              docker run --rm \
                -v "$PWD":/app -w /app -u "$(id -u):$(id -g)" \
                -e COMPOSER_HOME=/tmp/composer \
                --entrypoint composer \
                serversideup/php:8.2-cli \
                install --prefer-dist --no-progress --no-interaction --ignore-platform-req=ext-gd && \
              docker run --rm \
                -v "$PWD":/app -w /app -u "$(id -u):$(id -g)" \
                --entrypoint vendor/bin/pint \
                serversideup/php:8.2-cli)
          fi

      - name: Generate patch
        shell: bash
        run: |
          git diff > /tmp/autofix.patch
          if [ -s /tmp/autofix.patch ]; then
            echo "PR dari fork — push tidak bisa. Patch uploaded sebagai artifact."
            echo "Kontributor: git apply autofix.patch"
          else
            echo "Tidak ada perubahan dari autofixers."
          fi

      - name: Upload patch artifact
        uses: actions/upload-artifact@v7
        with:
          name: autofix-patch
          path: /tmp/autofix.patch
          retention-days: 7
          if-no-files-found: ignore

  # Per-run cleanup mirroring ci.yml::cleanup-runner. The `rust` job runs
  # cargo fmt + fix + clippy --fix end to end, building target/ from scratch
  # and leaving multi-GB behind on the runner. Six docker pulls (markdown,
  # toml, php, etc.) add image layers. This sweep keeps the leak bounded
  # without losing recent-job cache. The daily
  # `maintenance.yml::runner-health` is still the cross-runner backstop.
  cleanup-runner:
    name: Per-run cleanup (autofix target / docker images)
    if: always()
    needs:
      - rust
      - toml
      - markdown
      - php
      - whitespace
      - patch-for-fork
    runs-on: arc-simpel
    steps:
      - name: Trim autofix artifacts from this runner
        shell: bash
        run: |
          set +e
          echo "=== Disk before cleanup ==="
          df -h "$RUNNER_WORKSPACE" || df -h /

          WORK_DIR="${RUNNER_WORKSPACE%/*}"
          if [ -d "$WORK_DIR" ]; then
            # Reap target/ older than 6h on this runner. Recent caches stay
            # to avoid cold rebuilds on quick follow-up pushes.
            find "$WORK_DIR" -maxdepth 4 -type d -name target \
              -mmin +360 -print -exec rm -rf {} + 2>/dev/null || true
          fi

          # Dangling images from `docker run` autofix steps (markdownlint,
          # taplo, shellcheck, etc.). Tagged ones used recently stay.
          if command -v docker &>/dev/null; then
            docker image prune --force --filter "until=24h"
          fi

          echo "=== Disk after cleanup ==="
          df -h "$RUNNER_WORKSPACE" || df -h /
