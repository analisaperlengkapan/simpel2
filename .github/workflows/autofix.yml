# autofix.yml — Auto-fix di pull_request ke main (rename dari autofix-pr.yml).
# Apply yang bisa di-autofix:
#   - cargo fmt + cargo fix + clippy --fix
#   - Cargo versioning normalize (lockstep dengan workspace.package.version)
#   - taplo fmt (TOML)
#   - markdownlint-cli2 --fix (Markdown)
#   - trim trailing whitespace di YAML/sh/md/json/toml
# Untuk PR dari fork yang punya read-only token, patch di-upload sebagai artifact.

name: Autofix PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DEBIAN_FRONTEND: noninteractive

jobs:
  autofix:
    name: Auto-fix Workspace (Rust + TOML + Markdown + whitespace)
    runs-on: self-hosted
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: autofix-pr

      - name: Validate toolchain health
        shell: bash
        run: |
          set -euo pipefail
          CARGO_BIN=$(command -v cargo || echo "$HOME/.cargo/bin/cargo")
          if ! [ -x "$CARGO_BIN" ]; then
            echo "::error::cargo binary tidak ditemukan (PATH=$PATH)."
            exit 1
          fi
          echo "Using cargo: $CARGO_BIN"

          # Canary build — pastikan toolchain dan rustc berfungsi.
          # Jika ini gagal, berarti runner/toolchain bermasalah, bukan kode.
          echo "::group::Toolchain canary check"
          if ! "$CARGO_BIN" check -p lib-core 2>&1; then
            echo "::endgroup::"
            echo "::error::Toolchain canary gagal — runner kemungkinan memiliki toolchain rusak atau cache korup. Bersihkan target/ di runner."
            exit 1
          fi
          echo "::endgroup::"

      - name: Apply fmt + fix + clippy --fix
        shell: bash
        run: |
          # By design ini job adalah best-effort autofixer, BUKAN gate.
          # fmt/fix/clippy boleh gagal (lint yang tidak bisa di-autofix).
          # Gate enforcement ada di `lint-rust` job di ci.yml; di sini
          # hanya commit perubahan yang berhasil di-autofix dan tampilkan
          # warning jika ada yang tidak bisa di-fix supaya visible di
          # PR sidebar (bukan tersembunyi seperti pakai `|| true` polos).
          fmt_exit=0; fix_exit=0; clippy_exit=0

          cargo fmt --all || fmt_exit=$?
          [ $fmt_exit -ne 0 ] && echo "::warning::cargo fmt exit code: $fmt_exit"

          cargo fix \
            --workspace --all-targets --all-features \
            --allow-dirty --allow-staged || fix_exit=$?
          [ $fix_exit -ne 0 ] && echo "::warning::cargo fix exit code: $fix_exit"

          cargo clippy \
            --workspace --all-targets --all-features \
            --fix --allow-dirty --allow-staged \
            -- -W clippy::all || clippy_exit=$?
          [ $clippy_exit -ne 0 ] && echo "::warning::cargo clippy --fix exit code: $clippy_exit"

          # Final fmt pass untuk memformat hasil fix/clippy. Emit warning
          # daripada `|| true` polos supaya status di log eksplisit.
          final_fmt_exit=0
          cargo fmt --all || final_fmt_exit=$?
          [ $final_fmt_exit -ne 0 ] && echo "::warning::final cargo fmt exit code: $final_fmt_exit"

      - name: Normalize Cargo versioning
        run: python3 ./infra/scripts/check-cargo-versioning.py fix

      - name: Apply taplo fmt (TOML)
        shell: bash
        run: |
          # taplo auto-format semua .toml di workspace. Idempotent;
          # tidak fail kalau tidak ada perubahan.
          if ! command -v taplo &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL "https://github.com/tamasfe/taplo/releases/latest/download/taplo-full-linux-x86_64.gz" \
              | gunzip - > "$HOME/.local/bin/taplo"
            chmod +x "$HOME/.local/bin/taplo"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          taplo_exit=0
          taplo fmt || taplo_exit=$?
          [ $taplo_exit -ne 0 ] && echo "::warning::taplo fmt exit code: $taplo_exit"

      - name: Apply markdownlint --fix (Markdown)
        shell: bash
        run: |
          # markdownlint-cli2 --fix mengoreksi blanks-around-headings,
          # heading whitespace, list indent, dst. Stylistic-only;
          # konten teknis tidak diubah.
          md_exit=0
          docker run --rm \
            -v "$PWD":/workdir \
            davidanson/markdownlint-cli2:v0.13.0 \
            --fix --config /workdir/infra/lint/.markdownlint.jsonc '**/*.md' \
            || md_exit=$?
          [ $md_exit -ne 0 ] && echo "::warning::markdownlint --fix exit code (sisa lint issue yang tidak auto-fixable): $md_exit"

      - name: Strip trailing whitespace (YAML / shell / misc)
        shell: bash
        run: |
          # YAML, shell, dan script lainnya — buang trailing whitespace.
          # Lewatkan Helm templates (`{{- }}` Go syntax bisa rusak kalau
          # ada spasi yang berarti), node_modules, vendor, dan vendored
          # JS libs di simpelv1.
          find . \
            \( -name '*.yml' -o -name '*.yaml' \
               -o -name '*.sh' -o -name '*.md' \
               -o -name '*.toml' -o -name '*.json' \) \
            -not -path './node_modules/*' \
            -not -path './*/node_modules/*' \
            -not -path './target/*' \
            -not -path './vendor/*' \
            -not -path './*/vendor/*' \
            -not -path './infra/helm/*/templates/*' \
            -not -path './monolith/simpelv1/public/assets/libs/*' \
            -not -path './monolith/simpelv1/vendor/*' \
            -not -path './monolith/simpelv1/storage/*' \
            -not -path './.git/*' \
            -print0 \
          | xargs -0 -r sed -i 's/[[:space:]]\+$//'
          echo "Trailing whitespace stripped where applicable."

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Tidak ada perubahan dari fmt/fix/clippy."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Commit & push fixes ke branch PR
        if: steps.changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(autofix): cargo fmt + cargo fix + clippy --fix + taplo + markdownlint + trim trailing whitespace

          Auto-applied by autofix.yml di PR #${PR_NUMBER}."
          git push origin "HEAD:${PR_HEAD_REF}"

      - name: Generate patch artifact (PR dari fork)
        if: steps.changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          git diff > /tmp/autofix.patch
          echo "PR dari fork — push tidak bisa. Patch di-upload sebagai artifact;"
          echo "kontributor bisa download & apply via 'git apply autofix.patch'."

      - name: Upload patch artifact
        if: steps.changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v4
        with:
          name: autofix-patch
          path: /tmp/autofix.patch
          retention-days: 7
