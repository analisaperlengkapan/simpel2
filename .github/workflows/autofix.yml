# autofix.yml — Auto-fix di pull_request ke main (rename dari autofix-pr.yml).
# Apply cargo fmt + cargo fix + clippy --fix + Cargo versioning normalize.
# Untuk PR dari fork yang punya read-only token, patch di-upload sebagai artifact.

name: Autofix PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DEBIAN_FRONTEND: noninteractive

jobs:
  autofix:
    name: Auto-fix Workspace (cargo fmt + cargo fix)
    runs-on: self-hosted
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-key: autofix-pr

      - name: Apply fmt + fix + clippy --fix (single shell session)
        shell: bash
        run: |
          set +e
          CARGO_BIN=$(command -v cargo || echo "$HOME/.cargo/bin/cargo")
          if ! [ -x "$CARGO_BIN" ]; then
            echo "::error::cargo binary tidak ditemukan (PATH=$PATH)."
            exit 1
          fi
          echo "Using cargo: $CARGO_BIN"

          "$CARGO_BIN" fmt --all || true

          "$CARGO_BIN" fix \
            --workspace --all-targets --all-features \
            --allow-dirty --allow-staged || true

          "$CARGO_BIN" clippy \
            --workspace --all-targets --all-features \
            --fix --allow-dirty --allow-staged \
            -- -W clippy::all || true

          "$CARGO_BIN" fmt --all || true
          true

      - name: Normalize Cargo versioning
        run: python3 ./infra/scripts/check-cargo-versioning.py fix

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Tidak ada perubahan dari fmt/fix/clippy."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Commit & push fixes ke branch PR
        if: steps.changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(autofix): cargo fmt + cargo fix + clippy --fix

          Auto-applied by autofix.yml di PR #${PR_NUMBER}."
          git push origin "HEAD:${PR_HEAD_REF}"

      - name: Generate patch artifact (PR dari fork)
        if: steps.changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          git diff > /tmp/autofix.patch
          echo "PR dari fork — push tidak bisa. Patch di-upload sebagai artifact;"
          echo "kontributor bisa download & apply via 'git apply autofix.patch'."

      - name: Upload patch artifact
        if: steps.changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v4
        with:
          name: autofix-patch
          path: /tmp/autofix.patch
          retention-days: 7
