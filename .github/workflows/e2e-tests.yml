name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  RUST_VERSION: '1.93'
  NODE_VERSION: '20'

jobs:
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: simpel
          POSTGRES_PASSWORD: simpel_test
          POSTGRES_DB: simpel_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://simpel:simpel_test@localhost:5432/simpel_test
        run: |
          cargo install sqlx-cli --no-default-features --features postgres
          cd layanan/perlengkapan/crates/api
          sqlx migrate run

      - name: Build backend services
        run: |
          cargo build --release --workspace

      - name: Start backend services
        env:
          DATABASE_URL: postgresql://simpel:simpel_test@localhost:5432/simpel_test
          REDIS_URL: redis://localhost:6379
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        run: |
          # Start services in background
          ./target/release/layanan-perlengkapan-api &
          echo $! > api.pid

          # Wait for services to be ready
          timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'

      - name: Build frontend
        working-directory: antarmuka/perlengkapan
        run: |
          trunk build --release

      - name: Seed test data
        env:
          DATABASE_URL: postgresql://simpel:simpel_test@localhost:5432/simpel_test
        run: |
          cargo run --bin seed-test-data

      - name: Run E2E tests
        working-directory: tests/e2e
        env:
          BASE_URL: http://localhost:8080
          HEADLESS: true
        run: |
          npx playwright test --reporter=html,junit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-videos
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: tests/e2e/results/junit.xml

      - name: Stop backend services
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) || true
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f api.pid

  notify:
    name: Notify on failure
    needs: e2e-tests
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          echo "E2E tests failed on main branch"
          # Add notification logic here (Slack, email, etc.)
