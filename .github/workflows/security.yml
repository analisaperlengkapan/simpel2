name: Security

on:
  push:
    branches: [main]
  # DELIBERATELY unfiltered by base branch. `branches: [main]` here meant a
  # stacked PR (base = another PR's branch) ran NO CI at all, while the branch
  # ruleset — which targets `main` — reported its required checks as satisfied.
  # The PR then read `mergeStateStatus: CLEAN` with zero jobs having run.
  # Enforced by infra/scripts/check-pr-workflows-run-on-every-pr.py.
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Blocking checks ─────────────────────────────────
  # Kegagalan di sini akan membuat Security Summary gagal.

  gitleaks:
    name: Gitleaks (Secret Scan)
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      # This job is the one that checks out FULL history (fetch-depth: 0), and
      # that fetch is where it fails: `curl 92 HTTP/2 stream N was not closed
      # cleanly: CANCEL (err 8)` -> `fatal: early EOF` -> `fetch-pack: invalid
      # index-pack output`, then the transfer stalls until timeout-minutes kills
      # the job (observed 2026-09-25, twice in a row, ~19 min into a 30 min job).
      #
      # The summary is right to fail-closed here — a cancelled secret scan must
      # never read as green — so the repair belongs in the transport, not in the
      # classification. HTTP/1.1 is the documented mitigation for the HTTP/2
      # stream CANCEL class; the buffer setting covers the large pack this repo
      # produces. Set BEFORE checkout so the action's own git inherits it.
      - name: Harden git transport (HTTP/2 stream CANCEL on full-history fetch)
        shell: bash
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300
      # `actions/checkout` cannot be retried (no `retry` on `uses` steps), so a
      # single transport blip is fatal. Let it fail softly, then repair with a
      # bounded retry loop — and re-assert afterwards that history really is
      # present, so a half-fetched tree can never reach the scanner.
      - uses: actions/checkout@v7
        id: checkout
        continue-on-error: true
        with:
          fetch-depth: 0
      - name: Repair incomplete checkout (bounded retry)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          set -uo pipefail
          git rev-parse --git-dir >/dev/null 2>&1 || git init -q .
          git remote get-url origin >/dev/null 2>&1 || \
            git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            echo "::group::repair attempt ${attempt}/5"
            git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*' && rc=0 || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "fetch repaired on attempt ${attempt}"
              # Fetching refs alone leaves no working tree; the scanner reads
              # files literally, so check the reviewed commit out by SHA. Without
              # this the scan would run against a partial tree and could report
              # "no findings" for code it never read.
              git checkout -f --detach "${GITHUB_SHA}"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::full-history fetch failed after 5 attempts (transport, not a finding)"
          exit 1
      - name: Assert full history and working tree are present
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --git-dir >/dev/null
          # A shallow tree would silently narrow the scan; gitleaks must see
          # every commit, so an incomplete fetch is a hard failure, not a pass.
          test -f .git/shallow && { echo "::error::history is shallow"; exit 1; } || true
          commits=$(git rev-list --count HEAD)
          echo "history: ${commits} commits reachable from HEAD"
          test "$commits" -gt 1 || { echo "::error::no usable history"; exit 1; }
          # Guard the other failure mode: refs present but no checked-out files.
          # `.gitleaks.toml` is the config the next step is handed, so its
          # absence proves the tree is not usable.
          test -s .gitleaks.toml || { echo "::error::working tree is not checked out"; exit 1; }
      - name: Cleanup stale temp files (self-hosted fix)
        shell: bash
        run: rm -f /tmp/gitleaks.tmp /tmp/gitleaks-report.*
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Default action uploads the SARIF report as a GitHub Actions
          # artifact. The org account's artifact storage quota was hit
          # ("Failed to CreateArtifact: Artifact storage quota has been
          # hit"), masking the actual scan result with an upload failure.
          # The job summary still shows findings; artifact upload is
          # redundant and disabled.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # ── Advisory checks ─────────────────────────────────
  # Temuan adalah informational; step TIDAK pakai continue-on-error
  # supaya job conclusion menunjukkan status sebenarnya ke summary.

  cargo-audit:
    name: cargo-audit
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: audit
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-audit
        shell: bash
        run: |
          if ! command -v cargo-audit &>/dev/null; then
            AUDIT_VERSION="0.22.1"
            URL="https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-gnu-v${AUDIT_VERSION}.tgz"
            # Tarball contains a top-level
            # `cargo-audit-x86_64-unknown-linux-gnu-vX.Y.Z/` directory;
            # `--strip-components=1` flattens it so the binary lands at
            # `$CARGO_HOME/bin/cargo-audit` (in PATH) rather than buried
            # in a subdirectory. CARGO_HOME is set by setup-rust action
            # to a job-isolated path under runner.temp.
            mkdir -p "$CARGO_HOME/bin"
            # --retry: unduhan rilis GitHub sekali-tembak tanpa retry adalah
            # pola yang sudah berkali-kali membuang build di repo ini (lihat
            # #711 actionlint, plugin Blade bertag mengambang, dan catatan
            # tailwindcss di Dockerfile FE). --max-time membatasi hang.
            if curl -LsSf --retry 4 --retry-delay 2 --retry-all-errors \
                 --connect-timeout 15 --max-time 180 \
                 "$URL" | tar -xzf- --strip-components=1 -C "$CARGO_HOME/bin/" cargo-audit-x86_64-unknown-linux-gnu-v${AUDIT_VERSION}/cargo-audit 2>/dev/null; then
              echo "Installed cargo-audit ${AUDIT_VERSION} from pre-built binary"
              cargo-audit --version
            else
              echo "::warning::Pre-built binary unavailable, compiling from source"
              cargo install cargo-audit --locked
            fi
          fi
      # Beberapa entri ignore di .cargo/audit.toml dibenarkan HANYA karena
      # crate-nya tak pernah dikompilasi: ia dependency opsional yang tak
      # diaktifkan feature mana pun, dan cuma tercatat di Cargo.lock (lockfile
      # bersifat feature-agnostic). Alasan seperti itu bisa basi diam-diam
      # begitu ada yang mengaktifkan feature-nya, jadi tegakkan secara mekanis
      # alih-alih mengandalkan komentar. Yang diperiksa adalah ADA/TIDAKNYA baris
      # `rkyv v…` di pohon PENUH, bukan `-i`: `-i` keluar non-nol justru pada
      # kasus normal "crate tak ada", sehingga kegagalan jaringan tak bisa
      # dibedakan dari hasil yang sah. Lihat komentar di dalam langkah.
      - name: Assert lockfile-only audit ignores still hold
        shell: bash
        run: |
          set -euo pipefail
          repo=$(pwd)
          tmp=$(mktemp -d)
          # Dua cacat ditutup di sini, keduanya kelas yang sama dengan probe
          # ignore basi di atas:
          #
          # 1. Versi lama menjalankan `cargo tree -i "$crate" 2>/dev/null | grep`
          #    tanpa timeout. `cargo tree` bisa menggantung menembus batas job,
          #    dan `2>/dev/null` membuat SETIAP kegagalannya — jaringan, panic,
          #    toolchain hilang — tercetak persis seperti "crate-nya memang tak
          #    ada": `ok: rkyv tetap di luar build graph`. Probe yang tak bisa
          #    membedakan "sudah diperiksa dan bersih" dari "tidak bisa
          #    diperiksa" adalah probe yang lulus tanpa memeriksa apa pun.
          # 2. `-i` keluar non-nol justru pada kasus NORMAL (crate memang tak
          #    ada), jadi kegagalannya tak bisa dibedakan dari jaringan.
          #    Pohon PENUH keluar 0, sehingga ketiadaan crate menjadi bermakna.
          python3 "$repo/infra/scripts/retry-dependency-check.py" \
            --name "cargo tree (probe lockfile-only)" \
            --attempts 3 --timeout 300 \
            --capture "$tmp/tree.txt" \
            -- cargo tree --workspace --all-features --target all
          if [ ! -s "$tmp/tree.txt" ]; then
            echo "::notice::cargo tree tak pernah menjawab (jaringan) — probe \
          lockfile-only dilewati, bukan dianggap lulus."
            exit 0
          fi
          fail=0
          # crate -> advisory yang di-ignore atas dasar "tak pernah dikompilasi"
          for pair in "rkyv:RUSTSEC-2026-0235"; do
            crate="${pair%%:*}"
            advisory="${pair##*:}"
            # Baris pohon menjorok, jadi batas kiri tidak boleh `^` telanjang:
            # `(^|[^a-zA-Z0-9_-])` mencegah `foo-rkyv` ikut cocok.
            if grep -qE "(^|[^a-zA-Z0-9_-])${crate} v" "$tmp/tree.txt"; then
              echo "::error file=.cargo/audit.toml::${crate} kini MASUK build graph — ${advisory} tak lagi lockfile-only. Cabut ignore-nya dan tangani advisory sungguhan."
              fail=1
            else
              echo "ok: ${crate} tetap di luar build graph (${advisory} lockfile-only)"
            fi
          done
          exit "$fail"

      # cargo-audit tak punya padanan `-D advisory-not-detected`, jadi
      # kebasian daftar ignore-nya dijaga di sini. `cargo audit --json`
      # dijalankan dari direktori SEMENTARA yang tak memuat .cargo/audit.toml,
      # supaya yang terukur adalah advisory yang benar-benar menyala, bukan
      # yang tersisa setelah disaring daftar yang sedang kita uji.
      - name: Tak ada ignore basi di .cargo/audit.toml
        shell: bash
        run: |
          set -euo pipefail
          repo=$(pwd)
          tmp=$(mktemp -d)
          cp Cargo.lock "$tmp/"
          # `cargo audit` lebih dulu mengambil DB advisory RustSec dari GitHub,
          # jadi probe ini pun terkena kelas kegagalan yang sama dengan langkah
          # `cargo audit` di bawah: satu koneksi putus menghasilkan stdout
          # kosong, dan versi sebelumnya menyerahkan kosong itu ke penjaga di
          # hilir — yang lalu melaporkan "gagal mem-parse laporan JSON", merah
          # yang tak ada hubungannya dengan ignore basi. (Terjadi sungguhan pada
          # run 2026-09-24: probe menggantung ~7 menit lalu menyerahkan 0 byte.)
          #
          # Pembungkus menutupnya: laporan diperoleh → berkas ditulis; tak pernah
          # menjawab → hijau DAN berkas sengaja tak ditulis, sehingga cabang di
          # bawah melewatinya dengan alasan jujur alih-alih mem-parse kosong.
          #
          # `cd "$tmp"` TETAP wajib dan sengaja: dari direktori yang tak memuat
          # `.cargo/audit.toml`, daftar ignore tak ikut terpakai sehingga yang
          # terukur adalah advisory yang benar-benar menyala. Menjalankannya dari
          # akar repo akan menyaring justru advisory yang sedang kita uji, dan
          # SEMUA entri lalu terbaca basi. Karena itu skrip pembungkus dipanggil
          # lewat path absolut.
          cd "$tmp"
          python3 "$repo/infra/scripts/retry-dependency-check.py" \
            --name "cargo audit --json (probe ignore basi)" \
            --attempts 3 --timeout 300 \
            --capture "$tmp/report.json" \
            -- cargo audit --json -f Cargo.lock
          if [ ! -s "$tmp/report.json" ]; then
            echo "::notice::probe cargo-audit tak pernah menjawab (jaringan) — \
          pemeriksaan ignore basi dilewati, bukan dianggap lulus."
            exit 0
          fi
          python3 "$repo/infra/scripts/check-audit-ignores-live.py" \
            "$repo/.cargo/audit.toml" < "$tmp/report.json"

      - name: cargo audit
        shell: bash
        # Dijalankan lewat pembungkus retry: `cargo audit` lebih dulu mengambil
        # DB advisory RustSec dari GitHub (dan menyegarkannya), jadi satu
        # koneksi putus muncul sebagai job merah yang tak ada hubungannya
        # dengan dependency proyek. Pembungkus mengulang kegagalan transport
        # dan menghitungnya hijau HANYA bila alat tak pernah menjawab; temuan
        # sungguhan tetap merah. Lihat
        # infra/scripts/retry-dependency-check.py untuk kebijakan + batasnya.
        run: |
          python3 ./infra/scripts/retry-dependency-check.py \
            --name "cargo audit" --attempts 4 --timeout 420 \
            -- cargo audit

  # PHP dependency audit for the legacy simpelv1 monolith (composer.lock).
  # Defense-in-depth alongside trivy-fs (which already parses composer.lock):
  # `composer audit` queries the PHP-native Packagist advisory DB, which can
  # carry advisories/timing that the Trivy DB does not. Advisory but VISIBLE —
  # no continue-on-error, so the job conclusion reflects the real result and
  # shows ⚠️ FINDINGS in the Security Summary without blocking the merge (the
  # summary still gates only on gitleaks). Path-gated to the simpelv1 composer
  # manifests so unrelated PRs skip the container pull.
  composer-audit:
    name: composer-audit (simpelv1)
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Detect composer changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            composer:
              - 'monolith/simpelv1/composer.json'
              - 'monolith/simpelv1/composer.lock'
              - '.github/workflows/security.yml'
      - name: composer audit (--locked, no install)
        if: steps.filter.outputs.composer == 'true'
        shell: bash
        # `docker run` di sini menarik image PHP DAN `composer audit`
        # menyegarkan DB advisory Packagist — dua unduhan jaringan sebelum
        # pemeriksaan apa pun berjalan. Pembungkus retry memisahkan keduanya
        # dari temuan sungguhan: transport yang gagal → hijau (dengan catatan
        # eksplisit di summary), temuan → merah.
        run: |
          set -euo pipefail
          # serversideup/php:8.2-cli bundles composer; --locked audits the
          # lockfile directly (no `composer install`/vendor needed).
          # COMPOSER_HOME points at a writable tmp dir for the advisory-DB cache.
          #
          # `docker` dijalankan sebagai argv klasik (bukan `$PWD` shell-nya)
          # supaya pembungkus dapat mengatur timeout per percobaan.
          IMAGE="serversideup/php:8.2-cli"
          for i in 1 2 3; do
            docker pull -q "$IMAGE" && break
            echo "::warning::docker pull $IMAGE gagal (percobaan $i/3) — ulangi dalam $((i*10))s"
            sleep $((i * 10))
          done
          python3 ./infra/scripts/retry-dependency-check.py \
            --name "composer audit (simpelv1)" --attempts 3 --timeout 300 \
            -- docker run --rm \
                 -v "${{ github.workspace }}/monolith/simpelv1:/app" \
                 -w /app \
                 -e COMPOSER_HOME=/tmp/composer \
                 "$IMAGE" \
                 composer audit --locked --no-interaction

  cargo-deny:
    name: cargo-deny
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # WAJIB: cargo-deny memanggil `cargo metadata` untuk membangun build
      # graph. Sebelumnya action `@v2` menyediakannya dari DALAM container-nya
      # sendiri (image `rust:1.85-alpine`); begitu binarinya dijalankan langsung
      # di runner, cargo harus ada di runner. Tanpa langkah ini cargo-deny gagal
      # dengan "failed to run cargo: No such file or directory" — dan itulah
      # persis kegagalan yang ditemukan saat menguji pembungkus ini lawan biner
      # sungguhan, lalu dikunci sebagai kasus self-test.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: deny
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # cargo-deny dipasang langsung dari rilis ber-versi + ber-checksum, lalu
      # dijalankan lewat pembungkus retry.
      #
      # KENAPA BUKAN `EmbarkStudios/cargo-deny-action@v2`: action itu berjalan
      # sebagai CONTAINER (`FROM rust:1.85.0-alpine`). Retry/tuning apa pun yang
      # ditulis di sisi runner tak bisa memengaruhi `$HOME` di dalam container
      # — jadi "pre-seed advisory DB" di runner adalah langkah yang TERLIHAT
      # seperti pengaman tapi tak pernah menyentuh apa yang dibaca alatnya,
      # persis kelas cacat yang repo ini kejar di tempat lain (middleware yang
      # tak pernah di-mount, kredensial yang hanya dipakai saat cache-miss).
      # Menjalankan binarinya langsung membuat pembungkus retry benar-benar
      # mengatur hal yang ia klaim atur — termasuk clone DB advisory, yang di
      # dalam action terjadi sekali-tembak tanpa retry.
      #
      # VERSI 0.20.2 SENGAJA DIPIN, dan harus sama dengan yang dipin action
      # `@v2` (Dockerfile-nya: `ENV deny_version="0.20.2"`). Seluruh daftar
      # ignore/skip/allow di deny.toml dibuktikan lawan versi ITU, termasuk
      # `-D advisory-not-detected`. Menaikkannya bukan sekadar bump: ia
      # menurunkan ulang setiap supresi di bawah versi baru. Naikkan keduanya
      # bersamaan, dalam commit yang benar-benar menguji hasilnya.
      - name: Install cargo-deny (pinned + checksum + retry)
        shell: bash
        run: |
          set -euo pipefail
          DENY_VERSION="0.20.2"
          DENY_SHA256="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          BIN_DIR="${RUNNER_TEMP:-/tmp}/cargo-deny-bin"
          mkdir -p "$BIN_DIR"

          if [ -x "$BIN_DIR/cargo-deny" ] && \
             "$BIN_DIR/cargo-deny" --version 2>/dev/null | grep -q "$DENY_VERSION"; then
            echo "cargo-deny ${DENY_VERSION} already present"
          else
            ARCHIVE="$BIN_DIR/cargo-deny.tar.gz"
            URL="https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            ok=0
            for attempt in 1 2 3 4; do
              # --retry menangani blip; loop menangani blip yang lebih panjang
              # daripada yang ditoleransi curl. Checksum memastikan unduhan
              # yang terpotong tidak pernah sampai ke PATH.
              if curl -LsSf --retry 3 --retry-delay 2 --retry-all-errors \
                   --connect-timeout 15 --max-time 240 -o "$ARCHIVE" "$URL"; then
                got=$(sha256sum "$ARCHIVE" | awk '{print $1}')
                if [ "$got" = "$DENY_SHA256" ]; then ok=1; break; fi
                echo "::error::sha256 cargo-deny tidak cocok: dapat ${got}, mau ${DENY_SHA256}"
                rm -f "$ARCHIVE"
                # Checksum yang salah BUKAN kegagalan jaringan: jangan retry,
                # itu sinyal rilis/asset berubah.
                exit 1
              fi
              echo "::warning::unduhan cargo-deny gagal (percobaan ${attempt}/4)"
              [ "$attempt" -lt 4 ] && sleep $((attempt * 5))
            done
            [ "$ok" -eq 1 ] || {
              echo "::error::tidak bisa mengunduh cargo-deny ${DENY_VERSION} setelah 4 percobaan"
              exit 1
            }
            tar -xzf "$ARCHIVE" -C "$BIN_DIR" --strip-components=1 \
              "cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
            rm -f "$ARCHIVE"
            chmod +x "$BIN_DIR/cargo-deny"
          fi
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          "$BIN_DIR/cargo-deny" --version

      # Inti job. Argumennya = persis yang dihasilkan action `@v2` sebelumnya:
      #   --log-level warn --manifest-path ./Cargo.toml --workspace
      #   check advisories bans licenses sources <command-arguments>
      # (`-D` WAJIB setelah subperintah — menaruhnya lebih awal menghasilkan
      # "unexpected argument '-D' found".)
      - name: Run cargo-deny
        shell: bash
        run: |
          python3 ./infra/scripts/retry-dependency-check.py \
            --name "cargo-deny" --attempts 4 --timeout 600 \
            -- cargo-deny --log-level warn --manifest-path ./Cargo.toml \
               --workspace check advisories bans licenses sources \
               -D advisory-not-detected \
               -D unmatched-skip \
               -D license-not-encountered

  semgrep:
    name: Semgrep SAST
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/rust
            p/security-audit
            p/owasp-top-ten
            p/secrets
            p/dockerfile
            p/php
        env:
          SEMGREP_RULES: p/rust p/security-audit p/owasp-top-ten p/secrets p/dockerfile p/php

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          # Scope + secret allow-rules live in infra/lint/trivy.yaml (skips build
          # artifacts target/, vendored vendor/node_modules, dist/, and helm —
          # which kube-linter owns — and allow-lists the secreton GCP-scaffold
          # synthetic-key false positives). Keeps findings to OUR actionable code.
          trivy-config: "infra/lint/trivy.yaml"
          trivyignores: "infra/lint/.trivyignore.yaml"
          # Render findings as a TABLE to the job log (NOT sarif). Code scanning
          # is not enabled on this repo, so an uploaded SARIF can't be viewed —
          # the table makes findings visible inline, so a red job is actionable
          # (you can see WHAT failed) instead of an opaque exit code.
          format: "table"
          severity: "HIGH,CRITICAL"
          # Advisory but VISIBLE: fail the job on fixable HIGH/CRITICAL so it
          # shows red (a green check gets overlooked). Non-blocking for merges —
          # the Security Summary only gates on gitleaks.
          exit-code: "1"
          ignore-unfixed: "true"
          scanners: "vuln,secret,misconfig"

  # Verifikasi formal Verus — SCAFFOLD untuk masa depan.
  # Verus hanya bisa memverifikasi kode yang ditulis dalam subset Verus, yaitu
  # berkas yang opt-in lewat makro `verus! { ... }`. Selama belum ada modul
  # sensitif yang menambahkannya, job ini = no-op HIJAU (lewati instal + verify).
  # Begitu sebuah berkas memperoleh blok `verus!`, job otomatis aktif & verifikasi
  # berkas tsb. Jadi: tinggal tambahkan `verus!` di kode sensitif, CI mengurus
  # sisanya — tanpa bedah workflow lagi.
  verus-verify:
    name: Verus Formal Verification
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Deteksi berkas ber-anotasi Verus
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          files="$(grep -rl --include='*.rs' 'verus!' . | grep -v '/target/' || true)"
          if [ -z "$files" ]; then
            echo "Belum ada berkas ber-anotasi Verus (makro verus!). Lewati verifikasi formal."
            echo "have_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "Berkas Verus terdeteksi:"
            echo "$files"
            echo "have_files=true" >> "$GITHUB_OUTPUT"
            { echo "files<<__EOF__"; echo "$files"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"
          fi
      # Verus is NOT self-contained: each release pins an exact rustc and shells
      # out to `rustup run <toolchain>`. Release 0.2026.05.31.5dd6d83 needs
      # 1.95.0 — install it via setup-rust (per-job isolated RUSTUP_HOME) so the
      # bundled verus driver finds its toolchain. Bump in lockstep with VERUS_TAG.
      - uses: ./.github/actions/setup-rust
        if: steps.detect.outputs.have_files == 'true'
        with:
          toolchain: "1.95.0"
          cache-key: verus
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Verus
        if: steps.detect.outputs.have_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Rilis Verus = .zip ber-tag tanggal (mis. release/0.YYYY.MM.DD.hash),
          # berisi binary verus + z3 + vstd di satu direktori. Pin untuk reproducible;
          # naikkan saat perlu fitur/perbaikan Verus baru.
          VERUS_TAG="release/0.2026.05.31.5dd6d83"
          VERUS_VER="0.2026.05.31.5dd6d83"
          ASSET="verus-${VERUS_VER}-x86-linux.zip"
          URL="https://github.com/verus-lang/verus/releases/download/${VERUS_TAG}/${ASSET}"
          dest="$HOME/.verus"
          mkdir -p "$dest"
          # Unduhan sekali-tembak dari rilis GitHub — sama rapuhnya dengan
          # unduhan tool lain di repo ini, dan kegagalannya di sini akan
          # terbaca sebagai "verifikasi formal gagal", bukan "unduhan gagal".
          ok=0
          for attempt in 1 2 3 4; do
            if curl -LsSf --retry 3 --retry-delay 2 --retry-all-errors \
                 --connect-timeout 15 --max-time 300 -o /tmp/verus.zip "$URL"; then
              ok=1; break
            fi
            echo "::warning::unduhan Verus gagal (percobaan ${attempt}/4)"
            [ "$attempt" -lt 4 ] && sleep $((attempt * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::tidak bisa mengunduh ${ASSET} setelah 4 percobaan (jaringan, bukan hasil verifikasi)"
            exit 1
          fi
          unzip -q -o /tmp/verus.zip -d "$dest"
          verus_bin="$(find "$dest" -type f -name verus | head -1)"
          if [ -z "$verus_bin" ]; then
            echo "::error::Binary verus tidak ditemukan di arsip rilis."
            exit 1
          fi
          dirname "$verus_bin" >> "$GITHUB_PATH"
      - name: Run Verus verification
        if: steps.detect.outputs.have_files == 'true'
        shell: bash
        run: |
          set -uo pipefail
          STATUS=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "== Verifikasi formal: $file =="
            # `lib.rs` butuh --crate-type=lib. Catatan: invokasi per-berkas hanya
            # cocok untuk modul Verus yang relatif mandiri; crate dgn dependensi
            # eksternal sebaiknya pakai integrasi cargo-verus saat diadopsi.
            if [[ "$file" == *lib.rs ]]; then
              verus --crate-type=lib "$file" || { echo "::error file=$file::Verus gagal"; STATUS=1; }
            else
              verus "$file" || { echo "::error file=$file::Verus gagal"; STATUS=1; }
            fi
          done <<< '${{ steps.detect.outputs.files }}'
          exit $STATUS

  # Helm/K8s manifest lint — ADVISORY but VISIBLE (F5-A). Lint the *rendered*
  # chart so the checks see real YAML (probes, resource limits, runAsNonRoot,
  # latest-tag, …), not raw templates. Findings make the job show RED (a green
  # check gets overlooked) but do NOT block merges — the Security Summary only
  # gates on gitleaks. Flip to a true blocking gate in F5/F6 once the 8 known
  # findings are cleared (per plan F5-A.6 / F6-X, task #46).
  # Path-gated to infra/helm changes so unrelated PRs skip the heavy steps.
  helm-lint:
    name: Helm Lint & kube-linter
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Detect helm changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            helm:
              - 'infra/helm/**'
              - '.github/workflows/security.yml'
      - name: Setup Helm
        if: steps.filter.outputs.helm == 'true'
        uses: azure/setup-helm@v5
        with:
          version: v3.20.2
      # Daftar chart DITURUNKAN dari pohon, tidak ditulis tangan. Sebelumnya job
      # ini menyebut `infra/helm/simpel` dua kali dan tak menyentuh chart lain,
      # jadi `metallb` (dan chart apa pun yang lahir kemudian) tak pernah
      # di-lint — pola berulang "gerbangnya benar, cakupannya daftar statis yang
      # tak ikut tumbuh".
      - name: helm lint (blocking — semua chart di infra/helm/)
        if: steps.filter.outputs.helm == 'true'
        run: |
          set -euo pipefail
          mapfile -t charts < <(find infra/helm -mindepth 2 -maxdepth 2 -name Chart.yaml -printf '%h\n' | sort)
          if [ "${#charts[@]}" -eq 0 ]; then
            echo "::error::Tidak ada chart ditemukan di infra/helm/ — guard ini pasti salah jalan."
            exit 1
          fi
          for c in "${charts[@]}"; do
            if [ "$c" = "infra/helm/simpel" ]; then
              helm lint "$c" -f "$c/values-staging.yaml"
              helm lint "$c" -f "$c/values-production.yaml"
            else
              helm lint "$c"
            fi
          done
      # Kelas penyimpanan hanya boleh ditulis di `global.storageClass`. Kalau
      # sebuah komponen menulis ulang `storageClassName`, knob global-nya mati
      # suri (`default <global> <literal>` selalu memilih literal) dan mengganti
      # kelas klaster jadi butuh mengedit N tempat — melewatkan satu berarti satu
      # volume diam-diam tertinggal di kelas lama, yang baru ketahuan saat data
      # sudah di sana.
      - name: storageClassName hanya di global.storageClass
        if: steps.filter.outputs.helm == 'true'
        run: |
          set -euo pipefail
          if grep -rn 'storageClassName:' infra/helm/simpel/values*.yaml | grep -v '^\s*#'; then
            echo "::error::values*.yaml chart simpel tidak boleh menyebut storageClassName — pakai global.storageClass."
            exit 1
          fi
          echo "OK: tak ada storageClassName literal di values chart simpel."
      - name: Render manifests (staging + production + chart cluster-scoped)
        if: steps.filter.outputs.helm == 'true'
        run: |
          set -euo pipefail
          mkdir -p rendered
          helm template simpel infra/helm/simpel \
            -f infra/helm/simpel/values-staging.yaml > rendered/staging.yaml
          helm template simpel infra/helm/simpel \
            -f infra/helm/simpel/values-production.yaml > rendered/production.yaml
          for c in $(find infra/helm -mindepth 2 -maxdepth 2 -name Chart.yaml -printf '%h\n' | sort); do
            [ "$c" = "infra/helm/simpel" ] && continue
            helm template "$(basename "$c")" "$c" > "rendered/$(basename "$c").yaml"
          done
      # Pemisah `---` yang hilang menelan satu objek utuh TANPA error di mana
      # pun: `helm template` sukses, `helm lint` hijau, kube-linter hijau —
      # hasilnya tetap YAML yang sah, hanya saja satu dokumen lebih sedikit.
      # Yang terjadi di cluster: `helm upgrade` MENGHAPUS objek yang hilang itu.
      # Terukur 2026-08-25: Service `postgres-primary` raib dari render karena
      # sebuah komentar template ditutup dengan trailing dash, sementara
      # DestinationRule `postgres-primary-mtls` masih menunjuk host tersebut.
      #
      # Guard-nya menurunkan jawaban dari hasil render (jumlah `kind:` vs
      # jumlah dokumen ter-parse), bukan mencocokkan pola di template.
      #
      # yq HANYA mengubah YAML->JSON; logikanya di skrip stdlib. PyYAML TIDAK
      # dipakai: image runner ARC tak menyediakannya, dan itu sudah menjatuhkan
      # job ini sebelumnya (percobaan pertama guard ini, dan fallback actionlint
      # sebelum itu).
      - name: Tak ada dokumen yang ditelan pemisah `---`
        if: steps.filter.outputs.helm == 'true'
        run: |
          set -euo pipefail
          for f in rendered/*.yaml; do
            # `$f` DIBACA dua kali dan tak pernah ditulis: yq membacanya lewat
            # stdin, lalu check-chart-document-separators.py membuka path yang
            # sama dengan `open(path)` mode baca. Linter tak bisa melihat ke
            # dalam skrip python itu, jadi ia menduga argumen berkas mungkin
            # ditulisi. Pengecualian ini SATU aturan, bukan sapuan.
            # shellcheck disable=SC2094
            docker run --rm -i mikefarah/yq:4.44.3 -o=json eval-all '[.]' \
              < "$f" \
              | python3 ./infra/scripts/check-chart-document-separators.py "$f"
          done
      # Volume yang tak pernah berisi data tak boleh ikut File System Backup.
      # Kalau ikut, ia menghasilkan `PartiallyFailed` yang TIDAK berarti
      # kehilangan data — dan sinyal merah semacam itu akan diabaikan orang,
      # yang jauh lebih mahal daripada volume-volume itu sendiri. Terukur pada
      # latihan restore 2026-08-18: 19 dari 74 volume adalah scratch, semuanya
      # gagal, seluruh volume data justru berhasil.
      #
      # yq HANYA mengubah YAML→JSON; logikanya di skrip stdlib. Versi pertama
      # guard ini menaruh logikanya di ekspresi yq dan ia LOLOS pada input yang
      # sengaja dirusak — `as $var` di-cross-product antar dokumen, jadi ia
      # membandingkan pasangan yang salah. Ketahuan karena diuji dengan kenari,
      # bukan karena dibaca ulang.
      # Sebuah NetworkPolicy yang menyebut port yang tak dilayani siapa pun,
      # dan sebuah Service yang tak punya policy Ingress sama sekali, sama-sama
      # merender YAML yang sah — `helm lint`, `helm template`, dan kube-linter
      # semuanya hijau. Integrasi putus lewat KEDUANYA sekaligus: egress
      # diizinkan ke port 50053 (tak ada yang mendengarkan; service-nya
      # 50051/8080) dan tak pernah ada policy Ingress untuknya. Karena policy
      # egress memakai `podSelector: {}`, satu digit itu memutus integrasi untuk
      # SELURUH namespace selama 3 hari tanpa satu pun sinyal merah.
      #
      # Cakupannya diturunkan dari render — port dari objek Service, pasangan
      # yang dibutuhkan dari URL yang benar-benar dikonfigurasi — jadi service
      # baru ikut tercakup pada hari ia ditambahkan, bukan saat seseorang ingat
      # memperbarui daftar.
      - name: NetworkPolicy cocok dengan port Service dan URL terkonfigurasi
        if: steps.filter.outputs.helm == 'true'
        run: |
          set -euo pipefail
          for f in staging production; do
            docker run --rm -i mikefarah/yq:4.44.3 -o=json eval-all '[.]' \
              < "rendered/${f}.yaml" \
              | python3 ./infra/scripts/check-netpol-service-ports.py "$f"
          done
      - name: Setiap emptyDir dikecualikan dari backup Velero
        if: steps.filter.outputs.helm == 'true'
        run: |
          set -euo pipefail
          for f in staging production; do
            docker run --rm -i mikefarah/yq:4.44.3 -o=json eval-all '[.]' \
              < "rendered/${f}.yaml" \
              | python3 ./infra/scripts/check-velero-volume-excludes.py "$f"
          done
      # `imagePullPolicy: Never` + tag yang bisa bergerak = pod yang TAK BISA
      # dipulihkan: kubelet tak pernah menarik, dan tak ada catatan isi mana
      # yang seharusnya jalan. Begitu image-nya hilang dari disk node, pod itu
      # tak akan pernah terjadwal lagi dan tak ada yang tahu apa yang harus
      # dibangun ulang. Namespace `simpelv2-production` berjalan persis begitu
      # hari ini (`localhost:32000/...:prod` + `Never`) — 8 dari 10 workload
      # nol replica, root domain 503 sejak ~30 hari.
      #
      # kube-linter TIDAK menangkap keduanya (diuji dengan kenari 2026-08-18:
      # Deployment ber-`Never` + `:prod` lolos bersih dari check set default),
      # jadi guard ini bukan duplikat melainkan penutup lubang.
      #
      # Dijalankan SEKALI atas seluruh render supaya chart `backup` (MinIO)
      # ikut terjaga dan "nol container" tetap berarti render-nya yang rusak —
      # bukan sekadar chart yang kebetulan tak punya workload.
      - name: Tak ada image mutable / pullPolicy Never
        if: steps.filter.outputs.helm == 'true'
        run: |
          set -euo pipefail
          cat rendered/*.yaml \
            | docker run --rm -i mikefarah/yq:4.44.3 -o=json eval-all '[.]' \
            | python3 ./infra/scripts/check-image-mutability.py "semua chart"
      - name: kube-linter (blocking — fails on any finding)
        if: steps.filter.outputs.helm == 'true'
        uses: stackrox/kube-linter-action@v1.0.7
        with:
          directory: rendered
          config: infra/lint/.kube-linter.yaml

  # ── Summary ─────────────────────────────────────────
  security-summary:
    name: Security Summary
    if: always()
    needs:
      - cargo-audit
      - composer-audit
      - cargo-deny
      - gitleaks
      - helm-lint
      - semgrep
      - trivy-fs
      - verus-verify
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - name: Aggregate results
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          {
            echo "## Security Summary"
            echo ""
            echo "| Check | Result | Category |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # Blocking = harus sukses. Advisory = boleh gagal (informational).
          #   gitleaks   — tak boleh ada secret bocor.
          #   helm-lint  — chart staging+production WAJIB lulus helm lint +
          #                kube-linter (rendered manifest); temuan = chart
          #                regression (probe/limit/securityContext hilang, tag
          #                latest, dll). Path-gated → skip bila tak ada
          #                perubahan infra/helm/** (job tetap success).
          BLOCKING="gitleaks helm-lint"
          block_fail=0
          block_failed_jobs=""
          advisory_fail=0

          PARSED=$(echo "$NEEDS_JSON" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for k, v in data.items():
              print(k + "|" + v.get("result", "unknown"))
          ')
          while IFS='|' read -r job result; do
            [ -z "$job" ] && continue
            # Tentukan kategori
            if echo " $BLOCKING " | grep -q " $job "; then
              category="🔒 Blocking"
            else
              category="📋 Advisory"
            fi

            case "$result" in
              success) icon="✅ OK" ;;
              skipped) icon="⏭️ SKIP" ;;
              failure)
                if echo " $BLOCKING " | grep -q " $job "; then
                  icon="❌ FAIL"; block_fail=1; block_failed_jobs="$block_failed_jobs $job"
                else
                  icon="⚠️ FINDINGS"; advisory_fail=1
                fi
                ;;
              cancelled)
                # Cancelled biasanya = run di-supersede oleh push baru
                # (concurrency). Hanya fail-closed bila job BLOCKING (gitleaks)
                # yang batal — tak bisa pastikan tak ada secret bocor. Job
                # advisory yang batal = netral (bukan red palsu).
                if echo " $BLOCKING " | grep -q " $job "; then
                  icon="🚫 CANCEL"; block_fail=1; block_failed_jobs="$block_failed_jobs $job"
                else
                  icon="🚫 CANCEL"
                fi
                ;;
              *) icon="$result" ;;
            esac
            echo "| $job | $icon | $category |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$PARSED"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ $advisory_fail -ne 0 ]]; then
            echo "> **Note:** Advisory checks memiliki temuan. Periksa log masing-masing job untuk detail." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ $block_fail -ne 0 ]]; then
            echo "::error::Blocking security check gagal:${block_failed_jobs}. (gitleaks = secret scan; helm-lint = helm lint + kube-linter pada rendered chart)"
            exit 1
          fi

          if [[ $advisory_fail -ne 0 ]]; then
            echo "::warning::Advisory security checks memiliki temuan — periksa cargo-audit, cargo-deny, semgrep, atau verus-verify."
          fi
          echo "Blocking checks passed."
