name: CI

on:
  push:
    branches: [main]
  # DELIBERATELY unfiltered by base branch. `branches: [main]` here meant a
  # stacked PR (base = another PR's branch) ran NO CI at all, while the branch
  # ruleset — which targets `main` — reported its required checks as satisfied.
  # The PR then read `mergeStateStatus: CLEAN` with zero jobs having run.
  # Enforced by infra/scripts/check-pr-workflows-run-on-every-pr.py.
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the Playwright e2e smoke stack (on-demand validation, independent of vars.E2E_PERLENGKAPAN_ENABLED)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Limit parallelism per cargo invocation; 9 paralel self-hosted
  # runners on simple02 each spawning many rustc procs concurrently
  # exhausted memory/FDs, causing intermittent "could not parse/
  # generate dep info at: target/.../X.d: No such file" errors.
  CARGO_BUILD_JOBS: "4"
  # In-cluster microk8s registry, addressed by NODE IP on purpose: ARC runner
  # pods run with dnsPolicy None + public resolvers, so cluster DNS names do not
  # resolve. Used only to hand e2e images from `e2e-build-images` to the six e2e
  # jobs (#111) — never a source of release artifacts.
  E2E_REGISTRY: "172.15.10.252:32000"
  # Publish every compose service on an EPHEMERAL host port in CI (#111).
  #
  # docker-compose.yml publishes fixed host ports for local development, and ARC
  # runners share ONE Docker daemon per node — so any two e2e stacks that both
  # bring up a given service raced for the same port and the loser died at
  # bring-up with "failed to bind host port 0.0.0.0:50052/tcp: address already
  # in use". That is not cross-run only: it bit "Cross-app SSO" and "Secreton
  # bootstrap" in the SAME run, since both bring up layanan-integrasi.
  #
  # Nothing in CI consumes a host port — every e2e job addresses services by
  # compose SERVICE NAME on the shared network (BASE_URL=http://portal:8080,
  # AUTHENC_URL=http://authenc:8088, ...). So the published ports are pure
  # liability here. "0" makes Docker pick a free port per stack; local dev is
  # untouched because the compose defaults still resolve to the old values.
  POSTGRES_HOST_PORT: "0"
  REDIS_HOST_PORT: "0"
  AUTHENC_GRPC_HOST_PORT: "0"
  SECRETON_GRPC_HOST_PORT: "0"
  INTEGRASI_GRPC_HOST_PORT: "0"
  PERLENGKAPAN_API_HOST_PORT: "0"
  GATEWAY_HOST_PORT: "0"
  SIMPELV1_HOST_PORT: "0"
  PORTAL_HOST_PORT: "0"
  PERLENGKAPAN_HOST_PORT: "0"
  AUTHENC_REST_HOST_PORT: "0"

jobs:
  # ─────────────────────────────────────────────────────
  # Phase 0 — Detect changes (jadi input untuk semua job lain)
  # ─────────────────────────────────────────────────────
  detect:
    name: Detect Changes
    runs-on: arc-simpel
    timeout-minutes: 30
    outputs:
      rust-backend: ${{ steps.changes.outputs.rust-backend }}
      rust-frontend: ${{ steps.changes.outputs.rust-frontend }}
      rust-any: ${{ steps.changes.outputs.rust-any }}
      secreton: ${{ steps.changes.outputs.secreton }}
      cargo-manifests: ${{ steps.changes.outputs.cargo-manifests }}
      monolith-php: ${{ steps.changes.outputs.monolith-php }}
      monolith-blade: ${{ steps.changes.outputs.monolith-blade }}
      monolith-assets: ${{ steps.changes.outputs.monolith-assets }}
      monolith-any: ${{ steps.changes.outputs.monolith-any }}
      typescript: ${{ steps.changes.outputs.typescript }}
      docker: ${{ steps.changes.outputs.docker }}
      yaml: ${{ steps.changes.outputs.yaml }}
      markdown: ${{ steps.changes.outputs.markdown }}
      shell: ${{ steps.changes.outputs.shell }}
      toml: ${{ steps.changes.outputs.toml }}
      sql: ${{ steps.changes.outputs.sql }}
      workflows: ${{ steps.changes.outputs.workflows }}
      helm: ${{ steps.changes.outputs.helm }}
      e2e: ${{ steps.changes.outputs.e2e }}
      image-portal: ${{ steps.changes.outputs.image-portal }}
      image-perlengkapan-ui: ${{ steps.changes.outputs.image-perlengkapan-ui }}
      image-authenc: ${{ steps.changes.outputs.image-authenc }}
      image-perlengkapan-api: ${{ steps.changes.outputs.image-perlengkapan-api }}
      image-integrasi: ${{ steps.changes.outputs.image-integrasi }}
      image-secreton: ${{ steps.changes.outputs.image-secreton }}
      image-monolith: ${{ steps.changes.outputs.image-monolith }}
      docker-matrix: ${{ steps.docker-matrix.outputs.matrix }}
      docker-has-images: ${{ steps.docker-matrix.outputs.has-images }}
    steps:
      - uses: actions/checkout@v7
      - id: changes
        uses: ./.github/actions/detect-changes
      - id: docker-matrix
        shell: bash
        env:
          IS_MAIN: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' }}
          PORTAL: ${{ steps.changes.outputs.image-portal }}
          PERLENGKAPAN_UI: ${{ steps.changes.outputs.image-perlengkapan-ui }}
          AUTHENC: ${{ steps.changes.outputs.image-authenc }}
          PERLENGKAPAN_API: ${{ steps.changes.outputs.image-perlengkapan-api }}
          INTEGRASI: ${{ steps.changes.outputs.image-integrasi }}
          SECRETON: ${{ steps.changes.outputs.image-secreton }}
          MONOLITH: ${{ steps.changes.outputs.image-monolith }}
          APP_2026: ${{ steps.changes.outputs.image-app-2026 }}
          GATEWAY: ${{ steps.changes.outputs.image-gateway }}
        run: |
          set -euo pipefail
          declare -A IMAGES=(
            [antarmuka-portal]="antarmuka/portal/Dockerfile|.|$PORTAL"
            [antarmuka-perlengkapan]="antarmuka/perlengkapan/Dockerfile|.|$PERLENGKAPAN_UI"
            [layanan-authenc]="layanan/authenc/Dockerfile|.|$AUTHENC"
            [layanan-perlengkapan]="layanan/perlengkapan/Dockerfile|.|$PERLENGKAPAN_API"
            [layanan-integrasi]="layanan/integrasi/Dockerfile|.|$INTEGRASI"
            # Context MUST be repo root: simpelv1's Dockerfile does
            # `COPY monolith/simpelv1/nginx.conf …` and secreton's does
            # `COPY layanan/secreton/secreton.toml …`, both relative to
            # the workspace root. Earlier these used sub-dir contexts and
            # buildx failed with `…/nginx.conf: not found` /
            # `…/secreton.toml: not found`. Keep this in sync with the
            # release.yml matrix, which already uses `.` for every image.
            [layanan-secreton]="layanan/secreton/Dockerfile|.|$SECRETON"
            [simpelv1]="monolith/simpelv1/Dockerfile|.|$MONOLITH"
            [app-2026]="monolith/APP-2026/Dockerfile|.|$APP_2026"
            [layanan-gateway]="layanan/gateway/Dockerfile|.|$GATEWAY"
          )
          entries=()
          for name in "${!IMAGES[@]}"; do
            IFS='|' read -r dockerfile context cond <<<"${IMAGES[$name]}"
            if [[ "$IS_MAIN" == "true" || "$cond" == "true" ]]; then
              entries+=("{\"image\":\"$name\",\"dockerfile\":\"$dockerfile\",\"context\":\"$context\"}")
            fi
          done
          if [[ ${#entries[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has-images=false" >> "$GITHUB_OUTPUT"
          else
            json=$(IFS=,; echo "${entries[*]}")
            echo "matrix={\"include\":[$json]}" >> "$GITHUB_OUTPUT"
            echo "has-images=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────
  # Phase 1 — Enforcement (cepat, selalu jalan)
  # ─────────────────────────────────────────────────────
  enforce-structure:
    name: Enforce Structure
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate repo structure
        shell: bash
        run: |
          set -euo pipefail
          errors=0

          # ── 1. Required paths must exist ──
          required_paths=(
            "Cargo.toml" "Cargo.lock" "deny.toml" ".gitleaks.toml" "cliff.toml"
            "antarmuka/portal" "antarmuka/perlengkapan"
            "layanan/authenc" "layanan/perlengkapan" "layanan/integrasi" "layanan/secreton"
            "lib/ui" "lib/core" "lib/backend" "lib/crypto" "lib/perlengkapan"
            "monolith/simpelv1" "infra/scripts" "infra/lint"
          )
          # NOTE: tests/e2e tidak required. Playwright e2e ada di
          # antarmuka/{portal,perlengkapan}/tests/e2e/ dan di-run oleh job
          # `playwright-e2e` di workflow ini sebagai matrix per-microfrontend.
          # Enforce Structure tidak perlu mensyaratkan eksistensi-nya karena
          # microfrontend baru bisa saja belum punya e2e suite.
          for p in "${required_paths[@]}"; do
            if [[ ! -e "$p" ]]; then
              echo "::error::Required path missing: $p"
              errors=$((errors+1))
            fi
          done

          # ── 2. Root directories whitelist (dot-dirs exempt) ──
          allowed_dirs="antarmuka docs infra layanan lib monolith tests"
          while IFS= read -r d; do
            d="${d%/}"
            [[ "$d" == .* ]] && continue
            if ! echo " $allowed_dirs " | grep -q " $d "; then
              echo "::error::Unauthorized directory at root: $d/ (allowed: $allowed_dirs)"
              errors=$((errors+1))
            fi
          done < <(find . -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | sort)

          # ── 3. Root files whitelist (dot-files exempt, docker-compose.*.yml pattern) ──
          allowed_files="README.md CONTRIBUTING.md AGENTS.md CLAUDE.md Cargo.toml Cargo.lock deny.toml cliff.toml SIMPelv2.code-workspace"
          while IFS= read -r f; do
            [[ "$f" == .* ]] && continue
            # Allow any docker-compose.*.yml variant
            if [[ "$f" =~ ^docker-compose(\..+)?\.yml$ ]]; then continue; fi
            if ! echo " $allowed_files " | grep -q " $f "; then
              echo "::error::Unauthorized file at root: $f"
              errors=$((errors+1))
            fi
          done < <(find . -maxdepth 1 -mindepth 1 -type f -printf '%f\n' | sort)

          # ── 4. AGENTS.md max 3 tiers deep ──
          # Tier 1: AGENTS.md (root)
          # Tier 2: layanan/AGENTS.md, lib/AGENTS.md, etc.
          # Tier 3: layanan/secreton/AGENTS.md, lib/core/AGENTS.md, etc.
          # Tier 4+: FORBIDDEN
          while IFS= read -r f; do
            depth=$(echo "$f" | tr '/' '\n' | wc -l)
            if [[ $depth -gt 3 ]]; then
              echo "::error::AGENTS.md too deep (max 3 tiers): $f"
              errors=$((errors+1))
            fi
          done < <(find . -name 'AGENTS.md' -not -path './.git/*' | sed 's|^\./||')

          # ── 5. Every layanan must have a top-level Cargo.toml + Dockerfile ──
          # Per refactor plan A.1: every service runs as a single Cargo
          # package at `layanan/<svc>/Cargo.toml`. The previous fallback for
          # virtual-workspace layouts (`crates/` only, no top-level
          # `Cargo.toml`) is gone — perlengkapan was the last service using
          # it and now has a unified top-level manifest.
          for svc in layanan/*/; do
            svc_name=$(basename "$svc")
            if [[ ! -f "${svc}Cargo.toml" ]]; then
              echo "::error::Service layanan/${svc_name} missing Cargo.toml at top level"
              errors=$((errors+1))
            fi
            if [[ ! -f "${svc}Dockerfile" ]]; then
              echo "::error::Service layanan/${svc_name} missing Dockerfile"
              errors=$((errors+1))
            fi
          done

          [[ $errors -eq 0 ]] && echo "Structure validation passed (5 checks)." || exit 1

  # Cheap stdlib-only guards over repo invariants that no compiler checks. They
  # share a job because each takes seconds and none needs a toolchain; the `if`
  # is the union of what they read, so adding a guard here means widening it.
  # `shell` di sini BUKAN soal skrip .sh: filter itu juga mencakup
  # `infra/scripts/**`, tempat KEENAM penjaga job ini tinggal. Tanpa itu,
  # mengedit salah satu check-*.py tidak menjalankan ulang penjaga yang baru
  # saja diubah — gate-nya benar tapi tak pernah menguji dirinya sendiri.
  enforce-versioning:
    name: Enforce Repo Invariants
    needs: detect
    if: needs.detect.outputs.cargo-manifests == 'true' || needs.detect.outputs.workflows == 'true' || needs.detect.outputs.rust-any == 'true' || needs.detect.outputs.helm == 'true' || needs.detect.outputs.sql == 'true' || needs.detect.outputs.shell == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate Cargo versioning
        shell: bash
        run: python3 ./infra/scripts/check-cargo-versioning.py check
      # A crate added to Cargo.toml but not to the clippy/test matrices in this
      # file is silently ungated — that is how secreton-auto-unseal and
      # secreton-k8s-operator went 7.4k lines without ever being linted or
      # tested (#125). The guard derives the crate list from the workspace
      # manifest and the covered set from this workflow, so neither side can be
      # forgotten. Stdlib-only on purpose: the ARC runner image ships no PyYAML.
      - name: Every workspace crate is covered by a CI cargo job
        shell: bash
        run: python3 ./infra/scripts/check-crate-ci-coverage.py
      # ```ignore is the hole in the doctest gate #115 built: rustdoc never
      # compiles those fences, so they keep documenting types that were renamed
      # or deleted. Demonstrated, not assumed — reintroducing
      # `utils::cache::LruCache` (renamed to SecretLruCache) leaves
      # `cargo test --doc` reporting "ok, 0 failed" and only moves the example
      # from passed to ignored. Opting out of EXECUTION stays allowed; naming an
      # API that does not exist does not. (#126)
      - name: No ```ignore doc example names a nonexistent API
        shell: bash
        run: python3 ./infra/scripts/check-doc-examples.py
      # `CI Summary` and `Security Summary` are the only two required checks,
      # and both aggregate via a hand-written `needs:`. A job missing from one
      # can be red while the gate is green — which is what let
      # `E2E simpelv1 ↔ gateway` fail on main @202aea6f under a SUCCESS summary.
      # Derive the scope instead of trusting the lists to be kept up to date.
      - name: Every job is reported by its required-check summary
        shell: bash
        run: python3 ./infra/scripts/check-ci-summary-scope.py
      # `#[serde(flatten)]` strips the type hint serde_urlencoded needs, so a
      # numeric field inside a flattened query type answers 400 to any request
      # that names it — while still answering 200 when the client sends no
      # query at all and the defaults apply. Invisible to cargo check and to
      # any test that builds the struct instead of parsing a query string; six
      # pakaian-dinas endpoints were live-broken this way until 2026-08-24.
      - name: Numbers in flattened query types survive a query string
        shell: bash
        run: python3 ./infra/scripts/check-query-flatten-numbers.py
      # The frontend keeps its own copy of every wire type, and nothing compared
      # the copies to the backend structs they mirror. They have drifted three
      # times, always silently — the failure is a serde error inside a resource,
      # not an HTTP status, so the page renders its error arm while the backend
      # answers 200. `Ukuran` and `PegawaiPakaianDinas` (#117), then
      # `PengajuanPakaianDinas` (#818), which took out the campaign list and the
      # report page's period dropdown together.
      - name: Frontend DTOs name only fields the backend sends
        shell: bash
        run: python3 ./infra/scripts/check-fe-be-dto-drift.py
      # `view!` tokenises `>` as the end of the opening tag — inside an
      # attribute value too. So `prop:disabled=move || page.get() >= total`
      # ends the tag at the `>`, and every attribute after it becomes a text
      # node: the `on:click` is never attached, `prop:disabled` gets an i32
      # (truthy on every page but 0), and the Rust source renders on the page.
      # 26 attribute values across both frontends and `lib/ui` — every
      # paginated list plus `DarkPagination` — so no list could reach page two.
      # cargo check sees valid markup, no test clicks page two, and the one
      # true signal (rustc calling the callback unused) had been silenced twice
      # over: a hand-written `#[allow(unused_variables)]` on two components,
      # and `_`-prefix renames on a prop and two handlers. Found by reading a
      # screenshot, 2026-08-29. Fix is a brace group: `=move || { a >= b }`.
      - name: Comparisons in view! attributes are braced
        shell: bash
        run: python3 ./infra/scripts/check-view-attr-comparisons.py
      # Label status pernah disalin ke frontend sebagai `match` atas nama
      # state. Salinannya jadi EMPAT, masing-masing dengan celah berbeda:
      # kedua state V035 (`SUBMITTED_APPROVER_SATKER`, `REVISI_OPERATOR`) dan
      # kedua state cabang wilayah V029 (`KONSEP_SK_WILAYAH_GENERATED`,
      # `SK_SIGNED_WILAYAH`) jatuh ke lengan `_ =>` dan tampil sebagai
      # "Lainnya" — jadi izin yang sedang menunggu Approver Satker, dan seluruh
      # cabang kewenangan wilayah, tak punya nama di layar. Tabel monitoring
      # bahkan mencetak `ACTIVE` mentah. Tak satu pun berstatus HTTP, gagal
      # cargo check, atau memerahkan tes. Kosakatanya kini hanya di enum
      # backend; guard ini menurunkan daftarnya dari `to_state_name()`.
      - name: Frontend keeps no copy of the status vocabulary
        shell: bash
        run: python3 ./infra/scripts/check-fe-status-vocabulary.py
      # `antarmuka/perlengkapan` dirender di atas navy (#0f172a). Layar yang
      # ditulis dengan default terang Tailwind bukan sekadar tidak seragam:
      # `/admin/roles` menaruh empat kartu putih pekat di halaman navy dan
      # judulnya `text-gray-900` di atas navy itu — nyaris hitam, tak terbaca;
      # nama template di `/admin/templates` tanpa kelas warna sama sekali
      # sehingga mewarisi warna terang milik body ke atas panel putih dan
      # lenyap; dan `<select>` di kedua formulir buat tidak punya latar maupun
      # warna teks, jadi kontrol yang sudah ada nilainya terlihat kosong.
      # Tak satu pun menggagalkan build. Tint alfa (`bg-white/10`) tetap sah —
      # yang dilarang hanya warna terang pekat.
      - name: Perlengkapan carries no light-palette class
        shell: bash
        run: python3 ./infra/scripts/check-dark-theme-palette.py
      # `pull_request: branches: [main]` membaca seperti "gerbangi PR" tapi
      # berperilaku "gerbangi PR yang kebetulan menyasar main". PR bertumpuk
      # (base = branch PR lain) tak cocok pemicu mana pun, jadi NOL job jalan —
      # dan karena ruleset juga menyasar main, tak ada pula check yang
      # DIWAJIBKAN. GitHub lalu melaporkan `mergeStateStatus: CLEAN`, nilai
      # yang sama dengan PR hijau sepenuhnya. Tiga PR dalam satu tumpukan duduk
      # di "CLEAN" tanpa satu pun verifikasi.
      - name: PR workflows are not filtered by base branch
        shell: bash
        run: |
          python3 ./infra/scripts/check-pr-workflows-run-on-every-pr.py
          python3 ./infra/scripts/check-pr-workflows-run-on-every-pr.py --self-test
      # Image runner ARC memakai Python polos, jadi `import yaml` LULUS di mesin
      # pengembang dan GAGAL di runner — skrip keluar non-nol karena alasan yang
      # tak ada hubungannya dengan yang diperiksanya, dan temuan yang jadi
      # alasan keberadaannya tak pernah dibuat. Sudah 3× di job ini: fallback
      # PyYAML actionlint (40+ hari merah palsu), `bc`/`yq` exit 127, lalu
      # penjaga di atas gagal di run CI PERTAMANYA karena hal yang sama.
      - name: CI guard scripts import only the standard library
        shell: bash
        run: |
          python3 ./infra/scripts/check-guard-imports-are-stdlib.py
          python3 ./infra/scripts/check-guard-imports-are-stdlib.py --self-test
      # The chart pulls `simpelv2-<image.name>`; release.yml publishes
      # `simpelv2-<matrix name>`. Nothing compared the two, and they drifted:
      # the chart wanted `simpelv2-gateway` while the release builds
      # `simpelv2-layanan-gateway`. CI never deploys and the release never reads
      # the chart, so it would only have surfaced at `helm upgrade` — as a
      # sidecar ImagePullBackOff taking the whole simpelv1 pod down.
      - name: Chart image names match what release.yml builds
        shell: bash
        run: python3 ./infra/scripts/check-chart-release-images.py
      # Placeholder telanjang di aritmatika tanggal tidak punya tipe, dan
      # Postgres gagal DUA cara berbeda: `CURRENT_DATE + $1` ditolak saat
      # PREPARE ("operator is not unique: date + unknown"), sementara
      # `CURRENT_DATE - $1` justru LOLOS prepare — Postgres menebak $1 = date —
      # lalu meledak saat bind. Bentuk minus itu sebabnya "SQL-nya parse" bukan
      # bukti apa-apa. Dua-duanya hidup di main sampai 2026-08-24: notifikasi
      # izin pemakaian BMN kedaluwarsa (route ter-mount + scheduler) dan
      # statistik API per-modul integrasi.
      - name: Tak ada placeholder tanpa cast di aritmatika tanggal SQL
        shell: bash
        run: python3 ./infra/scripts/check-sql-date-params.py
      # Hook Job yang menyentuh DB harus `post-install,pre-upgrade`. Ketiganya
      # sempat `post-upgrade`, dengan alasan tertulis "safe under the
      # expand/contract migration discipline" — yang membalik arah jaminannya.
      # Expand/contract membuat kode LAMA tahan skema BARU (itu yang membuat
      # `helm rollback` aman tanpa restore DB); ia tak menjanjikan apa pun soal
      # kode BARU bertemu skema LAMA, dan `post-upgrade` menghasilkan persis
      # itu. rc28 membuatnya konkret: seluruh scoping RBAC membaca
      # `integrasi.v_satker_wilayah`, yang baru dibuat migrasi integrasi 005.
      # `infra/AGENTS.md:474` sudah menulis "(pre-upgrade)"; chart-nya yang tak
      # ikut — dokumentasi benar bukan penegakan.
      - name: Hook migrasi jalan sebelum rollout, bukan sesudah
        shell: bash
        run: python3 ./infra/scripts/check-migrate-hook-lifecycle.py

      # Gerbang yang memblokir PR tak boleh me-lint lebih sedikit daripada
      # gerbang nightly yang tak memblokir apa pun. Lihat skripnya untuk
      # insiden yang memaksa cek ini ada.
      - name: actionlint yang sama di gerbang yang memblokir dan yang tidak
        shell: bash
        run: python3 ./infra/scripts/check-actionlint-parity.py

  # ─────────────────────────────────────────────────────
  # Phase 2 — Lint per bahasa (agresif: skip kalau bahasa tidak berubah)
  # ─────────────────────────────────────────────────────
  fmt-rust:
    name: Lint Rust (Format)
    needs: detect
    if: needs.detect.outputs.rust-any == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache-key: ci-fmt
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy-rust:
    name: Lint Rust Clippy (${{ matrix.name }})
    needs: detect
    if: needs.detect.outputs.rust-any == 'true'
    runs-on: arc-simpel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # `scope` controls the lint surface per crate. Backend crates lint the
        # full graph (`--all-targets --all-features`). The wasm CSR frontends
        # lint only the shipped target (`--lib --bins`, default = csr feature):
        # `--all-targets` would compile their test/dev targets for wasm32 (which
        # pull native tokio → `mio`, doesn't build on wasm), and `--all-features`
        # would turn on server-side features (ssr/hydrate) that are never shipped.
        include:
          - name: lib-core
            packages: "-p lib-core"
            scope: "--all-targets --all-features"
          - name: lib-backend
            packages: "-p lib-backend"
            scope: "--all-targets --all-features"
          - name: lib-crypto
            packages: "-p lib-crypto"
            scope: "--all-targets --all-features"
          - name: lib-perlengkapan
            packages: "-p lib-perlengkapan"
            scope: "--all-targets --all-features"
          - name: lib-ui
            packages: "-p lib-ui"
            scope: "--all-targets --all-features"
          - name: antarmuka-portal
            packages: "-p portal-microfrontend"
            targets: "wasm32-unknown-unknown"
            extra_args: "--target wasm32-unknown-unknown"
            scope: "--lib --bins"
          - name: antarmuka-perlengkapan
            packages: "-p perlengkapan-microfrontend"
            targets: "wasm32-unknown-unknown"
            extra_args: "--target wasm32-unknown-unknown"
            scope: "--lib --bins"
          - name: layanan-authenc
            packages: "-p authenc-types -p authenc-core -p authenc-crypto -p authenc-storage -p authenc-api -p authenc-iam-api -p authenc-grpc -p authenc-mfa -p authenc-federation -p authenc-webauthn"
            scope: "--all-targets --all-features"
          - name: layanan-perlengkapan
            packages: "-p layanan-perlengkapan"
            scope: "--all-targets --all-features"
          - name: layanan-integrasi
            packages: "-p layanan-integrasi"
            scope: "--all-targets --all-features"
          # secreton-auto-unseal and secreton-k8s-operator were absent from this
          # list AND from the test matrix, so 7.4k lines were never linted or
          # tested on any PR — a break only surfaced at release time, when
          # release.yml's `cargo build --workspace` finally compiled them.
          # `check-crate-ci-coverage.py` (Enforce Repo Invariants job) now fails
          # if a workspace member is missing from either matrix. (#125)
          - name: layanan-secreton
            packages: "-p secreton -p secreton-types -p secreton-core -p secreton-crypto -p secreton-storage -p secreton-api -p secreton-grpc -p secreton-agent -p secreton-cli -p secreton-backup -p secreton-health -p secreton-hsm -p secreton-replication -p secreton-auto-unseal -p secreton-k8s-operator"
            scope: "--all-targets --all-features"
          - name: layanan-gateway
            packages: "-p layanan-gateway"
            scope: "--all-targets --all-features"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          targets: ${{ matrix.targets || '' }}
          cache-key: ci-clippy-${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wipe stale target/ (self-hosted runner persistence)
        shell: bash
        run: rm -rf target
      # Clippy split per-crate so the 20-runner ARC budget runs them in parallel
      # and failures pinpoint the offending crate. Toolchain is pinned (setup-rust
      # → 1.97.1) so the lint set is reproducible.
      # HARD GATE (#29): `-- -D warnings` + `continue-on-error: false`. The whole
      # workspace was brought to zero warnings per crate (gates p4–p7 + portal
      # cleanup) before flipping this on. FE crates fixed by hand cfg-aware (the
      # autofix bot excludes them — see autofix.yml / antarmuka/AGENTS.md).
      - name: cargo clippy (${{ matrix.name }})
        run: cargo clippy ${{ matrix.packages }} ${{ matrix.extra_args || '' }} ${{ matrix.scope }} -- -D warnings

  lint-php:
    name: Lint PHP (Pint + Larastan)
    needs: detect
    if: needs.detect.outputs.monolith-php == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # vendor/ sengaja mendarat di dalam workspace (UID/GID match) supaya
      # step pint + phpstan di bawah bisa memakainya tanpa install ulang.
      - name: composer install (PHP 8.2 docker)
        uses: ./.github/actions/composer-install
      - name: Laravel Pint (style check)
        working-directory: monolith/simpelv1
        run: |
          docker run --rm \
            -v "$PWD":/app \
            -w /app \
            -u "$(id -u):$(id -g)" \
            --entrypoint vendor/bin/pint \
            serversideup/php:8.2-cli --test
      - name: Larastan / PHPStan
        working-directory: monolith/simpelv1
        run: |
          if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ]; then
            docker run --rm \
              -v "$PWD":/app \
              -w /app \
              -u "$(id -u):$(id -g)" \
              --entrypoint vendor/bin/phpstan \
              serversideup/php:8.2-cli analyse --no-progress --memory-limit=2G
          else
            echo "::warning::No phpstan config found, skipping static analysis"
          fi

  lint-blade:
    name: Lint Blade Templates
    needs: detect
    if: needs.detect.outputs.monolith-blade == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          working-directory: monolith/simpelv1
      # Scope: Blade files CHANGED by this PR, not the whole tree.
      #
      # Two reasons, both measured rather than assumed:
      #  1. The plugin used to CRASH ("Unknown node type: undefined") on 288 of
      #     the ~290 committed templates, so this check has never once passed.
      #     Root cause was the floating range `^1.8.13` resolving to 1.16.2,
      #     which dropped Prettier 2 support; it is now pinned exactly. (#119)
      #  2. With the pin the crash is gone, but 248 legacy templates are simply
      #     not formatted. Reformatting them is NOT whitespace-only: the plugin
      #     reprints PHP from an AST, adding trailing commas in array literals
      #     and re-parenthesising expressions (`round($a/$b*100,1)` ->
      #     `round(($a/$b)*100,1)`). Every case inspected was
      #     precedence-preserving, but these templates render the live simpelv1
      #     UI and have no rendering test, so a 248-file AST rewrite is not
      #     something to land unverified.
      #
      # Checking only changed files makes the gate real for new/edited
      # templates immediately, while the legacy backlog gets reformatted
      # deliberately, in reviewable batches. Full-tree enforcement returns once
      # that backlog is cleared.
      - name: Prettier check (Blade, changed files only)
        working-directory: monolith/simpelv1
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE="${BASE_SHA:-}"
          if [ -z "$BASE" ]; then
            BASE=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
          fi
          if [ -z "$BASE" ]; then
            echo "No merge base available; checking HEAD commit only."
            BASE="HEAD^"
          fi
          # `--diff-filter=d` drops deletions: prettier cannot check a file that
          # no longer exists, and a rename shows up as its new path anyway.
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=d "$BASE"...HEAD -- 'resources/views/**/*.blade.php' \
              | sed 's|^monolith/simpelv1/||'
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Blade templates changed in this PR."
            exit 0
          fi
          printf 'Checking %d changed Blade template(s):\n' "${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"
          # NOTE: prettier prints "All matched files use Prettier code style!"
          # as its LAST line even when it errors and exits non-zero, so never
          # judge this step by tail output — only by the exit status.
          npx prettier --check "${FILES[@]}"

  lint-dockerfile:
    name: Lint Dockerfile
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          recursive: true
          config: infra/lint/hadolint.yaml
          failure-threshold: warning

  lint-yaml:
    name: Lint YAML & Actions
    needs: detect
    if: needs.detect.outputs.yaml == 'true' || needs.detect.outputs.workflows == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Self-hosted runner tidak punya pipx / yamllint / actionlint pre-
      # installed, dan Python 3 di Ubuntu 24.04 sengaja tidak ship `pip`
      # (PEP 668 + externally-managed). Action `raven-actions/actionlint`
      # gagal di `Unable to locate executable file: pipx`; action
      # `ibiqlik/action-yamllint` gagal di `yamllint: command not found`.
      # Keduanya kini dijalankan lewat image ter-pin.
      #
      # Image, BUKAN biner standalone — dan itu bukan soal selera:
      #
      # Job ini dulu mengunduh `actionlint_1.7.7_linux_amd64.tar.gz`, yang
      # TIDAK membundel shellcheck. Maintenance memakai image
      # `rhysd/actionlint:1.7.12`, yang membundelnya. Jadi gerbang yang BISA
      # memblokir PR menjalankan linter yang lebih lemah daripada gerbang yang
      # TIDAK bisa — dua versi ter-pin dari alat yang sama, dengan kemampuan
      # berbeda, dan tak ada yang membandingkannya.
      #
      # Akibatnya terukur: #824 mendarat hijau sambil memasukkan dua temuan
      # SC2094 ke security.yml, lalu Maintenance merah LIMA run berturut-turut
      # (2026-08-25 s/d 2026-08-26) tanpa satu pun PR terhalang — Maintenance
      # hanya jalan di `schedule` dan bukan required check. Pola yang sama
      # persis dengan insiden 40-hari yang dipulihkan P-A.
      #
      # Sekarang keduanya menjalankan image dan versi yang sama.
      - name: actionlint (image ter-pin, membundel shellcheck)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12 -color
      - name: yamllint (via docker)
        shell: bash
        run: |
          # cytopia/yamllint bundles yamllint + python + busybox.
          # Pin major tag; alpine variant is minimal. Pakai absolute path
          # ke config (`-c /data/...`) — entrypoint container tidak set
          # workdir, jadi relative path gagal `FileNotFoundError`.
          docker run --rm \
            -v "$PWD":/data \
            cytopia/yamllint:alpine-1 \
            -c /data/infra/lint/yamllint.yml /data

  lint-markdown:
    name: Lint Markdown
    needs: detect
    # Also run when the workflow/globs change so glob/exclude edits self-validate
    # (mirrors lint-sql). markdownlint lints the whole tree, not just the diff.
    if: needs.detect.outputs.markdown == 'true' || needs.detect.outputs.workflows == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          # markdownlint-cli2 hanya kenal nama file `.markdownlint.jsonc`,
          # `.markdownlint-cli2.jsonc`, `.markdownlint.json`, dst. Nama
          # `markdownlint.jsonc` (tanpa leading dot) ditolak dengan
          # "File name should be (or end with) one of the supported types".
          config: infra/lint/.markdownlint.jsonc
          # Negation globs lebih reliable daripada `ignores` di config
          # untuk markdownlint-cli2 v0.18 (action v18). Skip vendored libs,
          # node_modules, dan storage Laravel.
          globs: |
            **/*.md
            !**/node_modules/**
            !**/vendor/**
            !**/target/**
            !**/dist/**
            !monolith/simpelv1/storage/**
            # Laravel public web-root = vendored 3rd-party JS-lib READMEs
            # (gmaps, prismjs, moment, …), not authored docs — exclude like
            # node_modules/vendor. Without this, any PR that touches a .md
            # trips ~1800 lint errors in these shipped libraries.
            !monolith/simpelv1/public/**
            !monolith/simpelv1/public/assets/libs/**
            # .kiro/ = Kiro IDE spec artifacts (requirements/design/tasks), not
            # authored prose, and in the do-not-hand-edit set (CLAUDE.md). Exclude
            # from the style gate rather than reformat them.
            !.kiro/**
            !**/CHANGELOG.md
      - name: Lychee link check
        # ADVISORY, sengaja. `--accept` di bawah memuat 404 dan 410, jadi
        # pemeriksa ini TIDAK BISA menemukan tautan mati — dibuktikan dgn kenari:
        # halaman 404/410 LULUS, dan satu-satunya yang memerahkannya adalah
        # kegagalan transport (DNS/connect/timeout). Sebagai gate wajib itu berarti
        # merah ditentukan cuaca jaringan pada 595 URL pihak ketiga, di setiap PR
        # yang menyentuh .md ATAU workflow. #811 kena persis begitu: 0 error,
        # 1 timeout ke `microk8s.io` (URL yang sehat) — merge terblokir.
        # Mempersempit `--accept` agar benar-benar mendeteksi memang mungkin
        # (terukur: 12 temuan; 4 di antaranya URL repo privat kita sendiri, yang
        # selalu 404 bagi anonim), tapi 7 tautan mati sisanya ada di berkas docs/
        # yang tak boleh disunting manual → pekerjaan terpisah.
        # markdownlint di atas = gate sesungguhnya: deterministik & in-repo.
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          # Hanya check HTTP/HTTPS links. file:// link check terlalu
          # noise untuk in-repo docs. Exclude domain internal/staging
          # yang tidak reachable. `--accept` whitelist status codes
          # 200..=499 + selected 5xx (gov endpoints return 403 ke
          # unauth access; 410 untuk vendored docs link yang sudah
          # mati tapi tidak actionable kita). `--exclude-path` skip
          # vendored 3rd-party docs (moment, prismjs, dst di monolith
          # simpelv1) yang punya banyak link mati di-luar control kita.
          args: |
            --no-progress
            --max-concurrency 8
            --scheme http
            --scheme https
            --accept 200..=299,301,302,304,307,308,400,401,403,404,405,410,429,500,502,503
            --exclude 'github\.com/.*/(issues|pull)/'
            --exclude '\.kejaksaan\.go\.id'
            --exclude '\.kemenkeu\.go\.id'
            --exclude '^https?://captcha-[a-z]+:'
            --exclude '^https?://monitoring\.internal'
            --exclude '^https?://wiki\.'
            --exclude 'engineproject\.io'
            --exclude 'hpneo\.github\.com'
            --exclude 'localhost'
            --exclude '127\.0\.0\.1'
            --exclude-path 'monolith/simpelv1/public/assets/libs'
            --exclude-path 'monolith/simpelv1/vendor'
            --exclude-path 'monolith/simpelv1/node_modules'
            --exclude-path 'node_modules'
            --exclude-path 'target'
            --exclude-path 'dist'
            --exclude-path '.kiro'
            './**/*.md'
          fail: true

  lint-shell:
    name: Lint Shell Scripts
    needs: detect
    if: needs.detect.outputs.shell == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          ignore_paths: monolith/simpelv1/vendor monolith/simpelv1/node_modules

  lint-toml:
    name: Lint TOML
    needs: detect
    if: needs.detect.outputs.toml == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install taplo
        shell: bash
        run: |
          set -euo pipefail
          if command -v taplo &>/dev/null; then exit 0; fi
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz" \
            | gunzip - > "$HOME/.local/bin/taplo"
          chmod +x "$HOME/.local/bin/taplo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: taplo fmt --check
        shell: bash
        run: taplo fmt --check

  lint-sql:
    name: Lint SQL Migrations
    needs: detect
    # Run on .sql changes, and on changes to the guard itself / detect-changes so
    # the check is exercised when the tooling is touched.
    if: needs.detect.outputs.sql == 'true' || needs.detect.outputs.workflows == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: SQL migration anti-pattern guard
        shell: bash
        # BLOCKING (#63 — matured advisory→blocking, mirroring kube-linter
        # #32→#46). The two prior known findings are cleared: the perlengkapan
        # baseline search_path reset (#553) and the secreton `ALTER DATABASE
        # CURRENT` duplicates (removed in #63 — dead files never wired to a
        # runner, not shipped in the image, superseded by programmatic schema
        # creation). A failure now fails the job and the required CI Summary.
        # Waive a single line with `-- guard:allow` (plus a reason) if needed.
        run: ./infra/lint/check-sql-migrations.sh

  migration-replay:
    name: Migrasi integrasi bisa dijalankan ulang
    needs: detect
    # Digerbang oleh .sql (migrasinya), shell (skrip penjaganya, di
    # infra/scripts/**), rust-backend (migrate.rs, tempat daftar MIGRATIONS
    # diturunkan), dan workflows (supaya penjaga ini teruji saat tooling-nya
    # disentuh).
    if: >-
      needs.detect.outputs.sql == 'true' ||
      needs.detect.outputs.shell == 'true' ||
      needs.detect.outputs.rust-backend == 'true' ||
      needs.detect.outputs.workflows == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Terapkan migrasi integrasi dua kali ke database yang sama
        shell: bash
        # Setiap stack e2e memigrasi database KOSONG, dan lintasan pertama
        # justru lintasan yang selalu berhasil. Staging dan produksi tak pernah
        # kosong. Perbedaan itu menyembunyikan kegagalan yang memblokir upgrade
        # rc28: 003 men-DROP view yang matview 004 dibangun di atasnya, jadi
        # integrasi-migrate — yang menerapkan SEMUA migrasi di SETIAP invokasi —
        # hanya bisa berhasil sekali seumur database.
        run: ./infra/scripts/check-migration-replay.sh

  lint-orphan-tests:
    name: Lint Orphaned Tests
    needs: detect
    # Rust changes can add a tests/ subdirectory; workflow changes exercise the
    # guard itself.
    if: needs.detect.outputs.rust-any == 'true' || needs.detect.outputs.workflows == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Orphaned-test guard
        shell: bash
        # BLOCKING from the start, unlike lint-sql/kube-linter which matured
        # advisory->blocking: the tree is already clean (#104 removed 8,911
        # unreachable lines), so any hit is a genuine regression, not a backlog.
        run: ./infra/lint/check-orphan-tests.sh

  route-coverage:
    name: E2E Route Coverage
    needs: detect
    # Runs on FE route changes (routes.rs), any e2e spec/fixture/gate change, or
    # workflow edits. Cheap static parse (Node, no build/browser/stack) — it is a
    # required gate in ci-summary. A NEW navigable route with no spec visiting it
    # FAILS the build even while the per-FE gate is still "advisory" (advisory
    # only relaxes the requirement that EXISTING debt be zero). See
    # tests/e2e/route-coverage.mjs + tests/e2e/route-coverage.config.json.
    if: >-
      needs.detect.outputs.rust-frontend == 'true' ||
      needs.detect.outputs.e2e == 'true' ||
      needs.detect.outputs.workflows == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Ensure Node is on PATH (arc-simpel runners don't ship it globally). The
      # gate is dependency-free, so no npm ci (install: false).
      - uses: ./.github/actions/setup-node
        with:
          install: 'false'
      - name: Route-coverage gate (every typed route must be visited by an e2e)
        shell: bash
        run: node tests/e2e/route-coverage.mjs

  # ─────────────────────────────────────────────────────
  # Phase 3 — Build artefak (agresif)
  # ─────────────────────────────────────────────────────
  build-antarmuka-portal:
    name: Build Portal Microfrontend
    # Builds don't require lint to pass — run them in parallel with lint-rust
    # (whose clippy step is slow and now non-blocking) instead of after it.
    needs: detect
    if: needs.detect.outputs.rust-frontend == 'true'
    runs-on: arc-simpel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: trunk-portal
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Trunk
        shell: bash
        run: |
          if ! command -v trunk &>/dev/null; then
            cargo install trunk --locked
          fi
      - name: trunk build --release
        working-directory: antarmuka/portal
        run: trunk build --release
      # NOTE(#102 CI audit): the dist artifact upload was deleted — no job ever
      # downloaded it (e2e stacks build the FE inside Docker), and the upload
      # was the only step that could fail the whole FE build on the account's
      # Actions artifact-storage quota (billed as a month-to-date average, so
      # a past overrun blocks uploads for days after the artifacts are gone).

  build-antarmuka-perlengkapan:
    name: Build Perlengkapan Microfrontend
    # Builds don't require lint to pass — run them in parallel with lint-rust
    # (whose clippy step is slow and now non-blocking) instead of after it.
    needs: detect
    if: needs.detect.outputs.rust-frontend == 'true'
    runs-on: arc-simpel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: trunk-perlengkapan
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Trunk
        shell: bash
        run: |
          if ! command -v trunk &>/dev/null; then
            cargo install trunk --locked
          fi
      - name: trunk build --release
        working-directory: antarmuka/perlengkapan
        run: trunk build --release
      # NOTE(#102 CI audit): the dist artifact upload was deleted — no job ever
      # downloaded it (e2e stacks build the FE inside Docker), and the upload
      # was the only step that could fail the whole FE build on the account's
      # Actions artifact-storage quota (billed as a month-to-date average, so
      # a past overrun blocks uploads for days after the artifacts are gone).

  build-backend:
    name: Build Backend (${{ matrix.name }})
    # Builds don't require lint to pass — run them in parallel with lint-rust
    # (whose clippy step is slow and now non-blocking) instead of after it.
    needs: detect
    if: needs.detect.outputs.rust-backend == 'true'
    runs-on: arc-simpel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: layanan-authenc
            # The `authenc` package (layanan/authenc) is legacy/out-of-workspace;
            # the deployable binary `authenc` lives in the `authenc-api` crate.
            package: authenc-api
          - name: layanan-perlengkapan
            package: layanan-perlengkapan
          - name: layanan-integrasi
            package: layanan-integrasi
          - name: layanan-secreton
            # The top-level `secreton` package is target-less (no lib/bin — only
            # tests/examples/benches), so `cargo build -p secreton` compiled
            # NOTHING (false green, ~5min download-only). The deployable binary
            # is `secreton-api::api_server` — mirror layanan/secreton/Dockerfile.
            package: secreton-api
            extra_args: "--bin api_server --features raft-consensus"
          - name: layanan-gateway
            package: layanan-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-build-${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wipe stale target/ (self-hosted runner persistence)
        shell: bash
        # _work dir persists between jobs on self-hosted runner.
        # rust-cache@v2 with cache-targets:false doesn't touch target/,
        # but previous job's stale target/ stays. Wipe explicitly to
        # avoid 'could not parse/generate dep info' from stale .d files.
        run: rm -rf target
      - name: cargo build --release -p ${{ matrix.package }}
        run: cargo build --release -p ${{ matrix.package }} ${{ matrix.extra_args }}

  build-monolith-assets:
    name: Build Monolith Assets (Vite)
    needs: detect
    if: needs.detect.outputs.monolith-assets == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node
        with:
          working-directory: monolith/simpelv1
      - name: Vite build
        working-directory: monolith/simpelv1
        run: npm run build

  build-docker:
    name: Build Docker (${{ matrix.image }})
    needs: detect
    if: needs.detect.outputs.docker-has-images == 'true'
    runs-on: arc-simpel
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.docker-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-build
        with:
          image: ${{ matrix.image }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: |
            ${{ matrix.image }}:ci-${{ github.sha }}
            ${{ matrix.image }}:ci-${{ github.run_number }}
          push: "false"
          load: "true"
          scan: "false"

  # ─────────────────────────────────────────────────────
  # Phase 4 — Test (KONSERVATIF — selalu jalan)
  # ─────────────────────────────────────────────────────
  test-lib-core:
    name: Test Rust (lib-core)
    needs: detect
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-test-lib-core
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wipe stale target/ (self-hosted runner persistence)
        shell: bash
        # _work dir persists between jobs on self-hosted runner.
        # rust-cache@v2 with cache-targets:false doesn't touch target/,
        # but previous job's stale target/ stays. Wipe explicitly to
        # avoid 'could not parse/generate dep info' from stale .d files.
        run: rm -rf target
      - name: cargo test
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p lib-core --all-targets --no-fail-fast
      # `--all-targets` expands to --lib --bins --tests --benches --examples —
      # it does NOT include doctests, and cargo rejects `--doc` alongside any
      # other target selector, so this must be its own step. Until it existed no
      # CI job in the repo had ever compiled a doctest, and five crates shipped
      # examples that could not compile (stale crate paths from the crate split,
      # an async fn documented as sync, an HSM API documented but never built).
      # The step reuses the target/ dir the one above just warmed, so the
      # marginal cost is the doctest compile alone. (#115)
      - name: cargo test --doc
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p lib-core --doc --no-fail-fast

  test-lib-backend:
    name: Test Rust (lib-backend)
    needs: detect
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-test-lib-backend
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wipe stale target/ (self-hosted runner persistence)
        shell: bash
        # _work dir persists between jobs on self-hosted runner.
        # rust-cache@v2 with cache-targets:false doesn't touch target/,
        # but previous job's stale target/ stays. Wipe explicitly to
        # avoid 'could not parse/generate dep info' from stale .d files.
        run: rm -rf target
      - name: cargo test
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p lib-backend --all-targets --no-fail-fast
      # See the note on test-lib-core: --all-targets excludes doctests. (#115)
      - name: cargo test --doc
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p lib-backend --doc --no-fail-fast

  test-lib-crypto:
    name: Test Rust (lib-crypto)
    needs: detect
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-test-lib-crypto
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wipe stale target/ (self-hosted runner persistence)
        shell: bash
        # _work dir persists between jobs on self-hosted runner.
        # rust-cache@v2 with cache-targets:false doesn't touch target/,
        # but previous job's stale target/ stays. Wipe explicitly to
        # avoid 'could not parse/generate dep info' from stale .d files.
        run: rm -rf target
      - name: cargo test
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p lib-crypto --all-targets --no-fail-fast
      # See the note on test-lib-core: --all-targets excludes doctests. (#115)
      - name: cargo test --doc
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p lib-crypto --doc --no-fail-fast

  test-lib-perlengkapan:
    name: Test Rust (lib-perlengkapan)
    needs: detect
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-test-lib-perlengkapan
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wipe stale target/ (self-hosted runner persistence)
        shell: bash
        # _work dir persists between jobs on self-hosted runner.
        # rust-cache@v2 with cache-targets:false doesn't touch target/,
        # but previous job's stale target/ stays. Wipe explicitly to
        # avoid 'could not parse/generate dep info' from stale .d files.
        run: rm -rf target
      - name: cargo test
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p lib-perlengkapan --all-targets --no-fail-fast
      # See the note on test-lib-core: --all-targets excludes doctests. (#115)
      - name: cargo test --doc
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p lib-perlengkapan --doc --no-fail-fast

  test-lib-ui:
    name: Test Rust (lib-ui)
    needs: detect
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          # NOTE: Tidak ada `targets: wasm32-unknown-unknown` di sini.
          # lib-ui adalah library Leptos yang dipakai oleh microfrontend
          # WASM, tapi cargo test menjalankan unit tests di host
          # (x86_64-linux). Menginstall wasm32 target sebelumnya
          # menyebabkan cargo memilih wasm32 sebagai default target dan
          # mio gagal kompilasi karena `sys::*` modules hilang di
          # wasm32-unknown-unknown.
          # WASM-specific tests (via wasm-bindgen-test) bukan scope job
          # ini; mereka jalan di playwright e2e dan di trunk build saat
          # microfrontend di-package.
          cache-key: ci-test-lib-ui
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # cargo test --target wasm32-unknown-unknown --no-run dipakai untuk
      # validate kompilasi tests di target WASM. Sayangnya tokio dengan
      # feature `rt` (transitively dipakai lib-ui) pakai mio yang tidak
      # punya sys module untuk wasm32-unknown-unknown — link gagal di
      # `unresolved import crate::sys::IoSourceState`. Trunk build di
      # release.yml validates wasm32 compile untuk antarmuka via real
      # build pipeline; CI duplikat di sini redundant.
      - name: Wipe stale target/ (self-hosted runner persistence)
        shell: bash
        # _work dir persists between jobs on self-hosted runner.
        # rust-cache@v2 with cache-targets:false doesn't touch target/,
        # but previous job's stale target/ stays. Wipe explicitly to
        # avoid 'could not parse/generate dep info' from stale .d files.
        run: rm -rf target
      - name: cargo build (host) — sanity check syntax
        env:
          RUST_BACKTRACE: 1
        run: cargo build -p lib-ui --features ssr
      # Doctests DO run here: they compile for the host, which this job already
      # does. Worth having — lib-ui's `code_splitting` module shipped a
      # `#[component]` example missing `use leptos::prelude::*;`, uncatchable by
      # any other gate. See the note on test-lib-core. (#115)
      - name: cargo test --doc
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p lib-ui --doc --no-fail-fast

  test-antarmuka-portal:
    name: Test Rust (antarmuka-portal)
    needs: detect
    runs-on: arc-simpel
    # Measured 21m end-to-end with the host doctest pass (6.5m wasm check +
    # 12.7m doctest compile); 45 leaves room for a cold cache and node
    # contention without letting a wedged job sit for an hour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: ci-test-portal
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Same reason — wasm32 test compile fails on tokio mio. Trunk
      # build di release.yml + ci.yml build-antarmuka-portal job
      # cover the wasm32 compile path.
      - name: Wipe stale target/ (self-hosted runner persistence)
        shell: bash
        # _work dir persists between jobs on self-hosted runner.
        # rust-cache@v2 with cache-targets:false doesn't touch target/,
        # but previous job's stale target/ stays. Wipe explicitly to
        # avoid 'could not parse/generate dep info' from stale .d files.
        run: rm -rf target
      - name: cargo check (wasm32, no-test)
        env:
          RUST_BACKTRACE: 1
        run: cargo check -p portal-microfrontend --target wasm32-unknown-unknown
      # Doctests run on the HOST target (rustdoc cannot execute wasm32), so this
      # step adds a host compile of the crate on top of the wasm check above —
      # hence the raised timeout. It earns it: this crate's `logged_out` example
      # still imported `portal_microfrontend::pages::logged_out`, a path the
      # F0-B feature-first move deleted, so the documented import was simply
      # wrong and nothing could tell us. See the note on test-lib-core. (#115)
      #
      # Its sibling test-antarmuka-perlengkapan has NO such step, on purpose —
      # that crate has no runnable doc example, so the same host compile would
      # buy nothing. check-crate-ci-coverage.py derives which crates need this
      # from their sources, so the asymmetry cannot drift into a gap.
      - name: cargo test --doc (host)
        env:
          RUST_BACKTRACE: 1
        run: cargo test -p portal-microfrontend --doc --no-fail-fast

  test-antarmuka-perlengkapan:
    name: Test Rust (antarmuka-perlengkapan)
    needs: detect
    runs-on: arc-simpel
    # Back to 30 now that the host doctest pass is gone: this job is the wasm32
    # check only, as it was before #115.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key: ci-test-perlengkapan
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wipe stale target/ (self-hosted runner persistence)
        shell: bash
        # _work dir persists between jobs on self-hosted runner.
        # rust-cache@v2 with cache-targets:false doesn't touch target/,
        # but previous job's stale target/ stays. Wipe explicitly to
        # avoid 'could not parse/generate dep info' from stale .d files.
        run: rm -rf target
      - name: cargo check (wasm32, no-test)
        env:
          RUST_BACKTRACE: 1
        run: cargo check -p perlengkapan-microfrontend --target wasm32-unknown-unknown
      # No `cargo test --doc` step here, unlike test-antarmuka-portal: this
      # crate has no runnable doc example (its single fence is ```rust,ignore),
      # so the pass would compile a whole second, HOST-target dependency tree to
      # run zero tests. It did exactly that once and starved its 6Gi ARC runner
      # ("the self-hosted runner lost communication with the server"). Adding
      # the first real example here turns check-crate-ci-coverage.py red, which
      # is where the requirement to re-add this step comes from. (#115)

  test-services:
    name: Test Rust (${{ matrix.tier }})
    needs: detect
    runs-on: arc-simpel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # No max-parallel cap: the 4 tiers are independent and ARC (maxRunners=20)
      # is the natural ceiling. Capping at 2 needlessly serialized the heaviest
      # phase of CI.
      matrix:
        include:
          # `-p authenc` di-skip — package `authenc` legacy di
          # `layanan/authenc/Cargo.toml` di-commented dari workspace
          # members (lihat root Cargo.toml). Yang ada hanya sub-crates.
          - tier: layanan-authenc
            packages: "-p authenc-types -p authenc-core -p authenc-crypto -p authenc-storage -p authenc-api -p authenc-iam-api -p authenc-grpc -p authenc-mfa -p authenc-federation -p authenc-webauthn"
            test_args: ""
          - tier: layanan-perlengkapan
            packages: "-p layanan-perlengkapan"
            # The `integration::` DB suite is a HARD gate: the "Start Postgres"
            # step below stands up a dind Postgres and fails the job if it can't
            # be reached, then exports TEST_ARGS="" so the suite runs. This
            # matrix value is only a fallback for the (now-unreachable) case
            # where the step is skipped; kept empty so nothing is silently
            # filtered out.
            test_args: ""
          - tier: layanan-integrasi
            packages: "-p layanan-integrasi"
            test_args: ""
          # secreton-auto-unseal / secreton-k8s-operator added here and to the
          # clippy matrix — they were in neither, so 7.4k lines (including a
          # ~700-line integration suite) had never been executed by any gate.
          # See #125 and the guard in the Enforce Repo Invariants job.
          - tier: layanan-secreton
            packages: "-p secreton -p secreton-types -p secreton-core -p secreton-crypto -p secreton-storage -p secreton-api -p secreton-grpc -p secreton-agent -p secreton-cli -p secreton-backup -p secreton-health -p secreton-hsm -p secreton-replication -p secreton-auto-unseal -p secreton-k8s-operator"
            # Heaviest tier (13 crates, PG property tests). Test binaries
            # default --test-threads to ncpus (dozens on the ARC host class),
            # which resource-kills the runner with no assertion output — the
            # job dies identically on main and PRs (e.g. run 28557595484).
            # Cap intra-binary test parallelism as mitigation.
            # target_args: secreton has criterion benches (harness = false);
            # under --all-targets `cargo test` executes those bench binaries
            # too, and they reject the forwarded `--test-threads` (run
            # 28566784769). Restrict to lib/bins/tests so benches build in CI
            # via clippy --all-targets but only run under `cargo bench`.
            target_args: "--lib --bins --tests"
            test_args: "-- --test-threads=4"
          - tier: layanan-gateway
            packages: "-p layanan-gateway"
            test_args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-test-${{ matrix.tier }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wipe stale target/ (self-hosted runner persistence)
        shell: bash
        # _work dir persists between jobs on self-hosted runner.
        # rust-cache@v2 with cache-targets:false doesn't touch target/,
        # but previous job's stale target/ stays. Wipe explicitly to
        # avoid 'could not parse/generate dep info' from stale .d files.
        run: rm -rf target
      # The perlengkapan `integration::` suite (workflow lifecycle, RBAC-403,
      # SLA) needs a real Postgres: the harness CREATEs an ephemeral
      # `test_db_<uuid>` per test, applies migrations, and drives HTTP. We start
      # one via the dind sidecar. Reachability of the dind-published port over
      # localhost from the runner was PROVEN on run 27657785427 (job 81795773123:
      # "Postgres reachable on localhost:5433 — integration suite ENABLED",
      # 14 integration:: tests passed). So this is now a HARD prerequisite: if
      # Postgres can't be started or reached we `exit 1` and FAIL the job rather
      # than silently skipping the suite (a gate that can disable itself is not a
      # gate). The harness hardcodes the password `simpel`, so the service must
      # use it.
      - name: Start Postgres (perlengkapan integration suite)
        if: matrix.tier == 'layanan-perlengkapan'
        shell: bash
        run: |
          docker rm -f ci-test-pg >/dev/null 2>&1 || true
          docker run -d --name ci-test-pg -p 5433:5432 \
            -e POSTGRES_USER=simpel -e POSTGRES_PASSWORD=simpel -e POSTGRES_DB=postgres \
            postgres:15-alpine >/dev/null
          # Readiness: container-internal (does NOT depend on host networking).
          ready=
          for _ in $(seq 1 30); do
            if docker exec ci-test-pg pg_isready -U simpel -d postgres >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::Postgres did not become ready — integration suite cannot run"
            docker logs ci-test-pg 2>&1 | tail -50 || true
            exit 1
          fi
          # Can THIS runner reach the dind-published port? (proven yes; fail hard if not)
          if timeout 5 bash -c 'exec 3<>/dev/tcp/localhost/5433' 2>/dev/null; then
            echo "DATABASE_URL=postgres://simpel:simpel@localhost:5433/postgres" >> "$GITHUB_ENV"
            echo "TEST_ARGS=" >> "$GITHUB_ENV"
            echo "Postgres reachable on localhost:5433 — integration suite ENABLED"
          else
            echo "::error::dind Postgres unreachable from runner over localhost:5433 — integration suite cannot run"
            exit 1
          fi
      - name: Reduce compile memory (heaviest tier)
        if: matrix.tier == 'layanan-secreton'
        shell: bash
        # This tier compiles 13 crates + their test harnesses (heavy crypto
        # deps: pqcrypto / aws-sdk). target/ is wiped each job, so every run
        # does a full debug compile+link, and the parallel rustc/link burst
        # peaks the ARC runner pod's memory → it gets OOM-evicted, surfacing
        # as "runner lost communication" (repeatedly on run 28690432031 and,
        # per the note above, identically on main). --test-threads already caps
        # RUNTIME parallelism; the peak is at COMPILE time. Halve compile
        # parallelism and drop test-profile debuginfo to line-tables (keeps
        # backtrace line numbers, drops the biggest link-memory consumer) so
        # the peak fits. Set via GITHUB_ENV so the other four tiers are
        # untouched (no cache churn).
        run: |
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
      - name: cargo test (${{ matrix.tier }})
        env:
          RUST_BACKTRACE: 1
        # `--all-targets` skips doctests — those run in the separate step below
        # (cargo rejects `--doc` next to any other target selector). The stale
        # note that used to sit here said authenc-federation/authenc-storage
        # "punya beberapa doctest outdated yang perlu di-rewrite"; they have now
        # been rewritten, along with three other crates', and the gate is on.
        # TEST_ARGS is set (possibly empty) by the Postgres step for the
        # perlengkapan tier; for every other tier it is unset, so we fall back
        # to the matrix value. Use ${VAR-default} (no colon) so a deliberate
        # empty value (integration enabled) is preserved, not overridden.
        run: |
          ARGS="${TEST_ARGS-${{ matrix.test_args }}}"
          TARGETS="${{ matrix.target_args || '--all-targets' }}"
          echo "test args: [$TARGETS] [$ARGS]"
          # shellcheck disable=SC2086  # word splitting is the POINT here:
          # $TARGETS and $ARGS each hold several whitespace-separated cargo
          # flags that must reach cargo as separate argv entries. Quoting them
          # would pass one glued argument and break every matrix tier.
          cargo test ${{ matrix.packages }} $TARGETS --no-fail-fast $ARGS
      # Doctests, which the step above cannot include. Own step, same warmed
      # target/ dir, so the marginal cost is the doctest compile alone.
      #
      # This is the gate that first ran on 2026-08-09 and found 20 broken
      # examples across five crates: stale `authenc::` / `secreton_core::` crate
      # paths left by the crate splits, `HealthCheckRegistry::register`
      # documented as sync after it became async, and an entire HSM module doc
      # written against an API (`connect`, `generate_key`, `get_audit_logs`)
      # that was never built. Every one of them is an example a developer would
      # copy and find broken. (#115)
      #
      # No matrix.target_args here: the secreton `--lib --bins --tests` narrowing
      # exists only to keep criterion benches from running, and benches are not
      # doctests.
      - name: cargo test --doc (${{ matrix.tier }})
        env:
          RUST_BACKTRACE: 1
        run: |
          # shellcheck disable=SC2086  # see the note above: matrix.packages is
          # several `-p x` flags that must reach cargo as separate argv entries.
          cargo test ${{ matrix.packages }} --doc --no-fail-fast

  # Test Monolith (PHPUnit) — ENABLED (F5-A #31). Scope = simpelv1 ↔ Rust-service
  # INTEGRATION contract tests only (authenc/secreton via Http::fake): they
  # exercise simpelv1's real internal functions (clients + EnforceTokenRevocation
  # middleware) WITHOUT a live stack or DB (array cache/session). All legacy/AI
  # tests were removed (user decision). DB-touching tests (e.g. integrasi pegawai/
  # BMN, #41) need the schema — convert dbsimpelv1.sql.gz dump → Laravel
  # migrations/schema (F5-A.3) before adding those; not required for this suite.
  test-monolith:
    name: Test Monolith (PHPUnit)
    needs: detect
    if: needs.detect.outputs.monolith-any == 'true'
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: composer install (PHP 8.2 docker)
        uses: ./.github/actions/composer-install
      - name: Prepare test environment
        working-directory: monolith/simpelv1
        run: |
          [ -f .env ] || cp .env.example .env
          docker run --rm \
            -v "$PWD":/app \
            -w /app \
            -u "$(id -u):$(id -g)" \
            --entrypoint php \
            serversideup/php:8.2-cli artisan key:generate --force
      - name: Prepare sqlite test DB (file-based)
        run: |
          # phpunit.xml sets DB_CONNECTION=sqlite (file). The integration suite
          # uses Http::fake + array cache/session and does not hit the DB, but the
          # file must exist so Laravel boots cleanly if anything resolves the
          # connection. No migrations run (none exist yet — schema conversion is
          # F5-A.3, needed only for DB-touching tests like #41).
          rm -f /tmp/simpelv1-test.sqlite
          touch /tmp/simpelv1-test.sqlite
          chmod 666 /tmp/simpelv1-test.sqlite
      - name: PHPUnit (Integration suite)
        working-directory: monolith/simpelv1
        run: |
          docker run --rm \
            -v "$PWD":/app \
            -v /tmp/simpelv1-test.sqlite:/tmp/simpelv1-test.sqlite \
            -w /app \
            -u "$(id -u):$(id -g)" \
            --entrypoint vendor/bin/phpunit \
            serversideup/php:8.2-cli --testsuite Integration --no-coverage

  # ── E2E Playwright: portal & perlengkapan as SEPARATE, PARALLEL jobs ──
  # Both are listed in ci-summary.needs, so once enabled they are hard-required
  # exactly like cargo test.
  #
  # STATUS: gated OFF until the e2e stack exists (F5). Today the suites cannot
  # pass — playwright.config.ts has `webServer` commented out, there is no
  # docker-compose stack, and baseURL points at a non-existent localhost:8080.
  # The gate is the explicit `vars.E2E_PERLENGKAPAN_ENABLED` repo variable (unset = skip),
  # NOT hidden in build-result logic, so the skip is intentional and visible.
  #
  # F5 TODO (tracked in the plan + memory): (1) wire a real stack — serve the
  # trunk-built dist via Playwright `webServer` (or a docker-compose) + run
  # authenc/perlengkapan + postgres, point baseURL at it; (2) set repo variable
  # E2E_PERLENGKAPAN_ENABLED=true. After that these become blocking via ci-summary.
  # ── BUILD ONCE, PULL SIX TIMES (#111) ────────────────────────────────────
  # Every e2e job used to run its own `docker compose build`, so one PR issued
  # up to six independent multi-stage Rust/WASM builds of the SAME images, and
  # two open PRs made twelve. Combined with a dind sidecar that had no resource
  # limits at all, that drove simple02 to loadavg 311 and produced ~90-minute
  # red jobs that never executed a single assertion.
  #
  # Images are pushed to the in-cluster microk8s registry, addressed BY NODE IP
  # (172.15.10.252:32000): runner pods use dnsPolicy None with public resolvers,
  # so *.svc.cluster.local does not resolve. dind carries the matching
  # --insecure-registry flag (infra/helm/arc/values-runner-set.yaml).
  #
  # The `e2e/` repository prefix is deliberate and load-bearing: the authenc
  # image here is built with CAPTCHA_DEBUG=1 (docker-compose.e2e.yml), so it
  # must never be confusable with the `simpelv2/` images that get promoted to
  # staging and production. Same reason these are tagged by commit SHA and
  # never `latest`.
  #
  # NOT cached across PRs on purpose: buildx gha cache already handles layer
  # reuse. What this removes is duplicated CPU inside a single run.
  e2e-build-images:
    name: Build e2e images (once, shared)
    needs: [detect]
    if: |
      !cancelled() &&
      (
        github.event.inputs.run_e2e == 'true' ||
        (
          (vars.E2E_PORTAL_ENABLED == 'true' ||
           vars.E2E_PERLENGKAPAN_ENABLED == 'true' ||
           vars.E2E_INTEGRATION_ENABLED == 'true') &&
          (needs.detect.outputs.rust-frontend == 'true' ||
           needs.detect.outputs.rust-backend == 'true' ||
           needs.detect.outputs.e2e == 'true')
        )
      )
    runs-on: arc-simpel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build every e2e image once
        env:
          POSTGRES_PASSWORD: e2e_test_pw
          SIMPELV1_APP_KEY: "base64:dGVzdGtleTMyYnl0ZXNzc3Nzc3Nzc3Nzc3Nzc3Nz"
        run: |
          # Union of what the six e2e jobs consume. Both compose files, so the
          # authenc image gets the CAPTCHA_DEBUG=1 build arg the e2e suites need.
          if ! timeout 5400 docker compose -f docker-compose.yml -f docker-compose.e2e.yml build \
              authenc secreton gateway layanan-integrasi layanan-perlengkapan \
              perlengkapan portal; then
            echo "::error::shared e2e image build failed or timed out after 5400s"
            exit 1
          fi
      - name: Push to in-cluster registry
        run: |
          set -euo pipefail
          for img in simpel2-authenc simpel2-secreton simpel2-gateway \
                     simpel2-integrasi simpel2-layanan-perlengkapan \
                     simpel2-perlengkapan simpel2-portal; do
            docker tag "${img}:local" "${E2E_REGISTRY}/e2e/${img}:${GITHUB_SHA}"
            docker push "${E2E_REGISTRY}/e2e/${img}:${GITHUB_SHA}"
          done

  e2e-portal:
    name: E2E Playwright (portal)
    # Portal smoke = portal FE + authenc only (login via real authenc, proxy
    # /api/** → authenc). It does NOT touch simpelv1, so it must NOT wait on
    # build-monolith-assets (Vite). These build-* needs are fail-fast gates (the
    # e2e job builds its own stack via compose); monolith adds no signal here.
    # A full cross-app SSO e2e incl. simpelv1 belongs to the comprehensive
    # staging suite (F5-C) — add monolith back there deliberately.
    needs: [e2e-build-images, detect, build-antarmuka-portal, build-backend]
    # F5-C: real stack bring-up (portal FE + authenc with captcha-debug) via
    # compose, mirroring e2e-perlengkapan. The portal specs proxy /api/** to
    # authenc via Playwright page.route(), so the portal nginx proxy is NOT on
    # the path — only the portal FE + authenc REST need to be reachable.
    # Gated by E2E_PORTAL_ENABLED (flip to make blocking); the on-demand
    # `run_e2e` dispatch always runs regardless of the change filter.
    if: |
      !cancelled() &&
      (
        github.event.inputs.run_e2e == 'true' ||
        (vars.E2E_PORTAL_ENABLED == 'true' &&
         (needs.detect.outputs.rust-frontend == 'true' ||
          needs.detect.outputs.rust-backend == 'true' ||
          needs.detect.outputs.e2e == 'true'))
      ) &&
      needs.build-antarmuka-portal.result != 'failure' &&
      needs.build-backend.result != 'failure' &&
      needs.e2e-build-images.result == 'success'
    runs-on: arc-simpel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # The ARC runner image ships the docker CLI but not the compose v2 plugin.
      # SIMPELV1_APP_KEY is required by compose interpolation (the simpelv1
      # service declares ${SIMPELV1_APP_KEY:?...}) even though we do NOT bring
      # simpelv1 up here — set a throwaway value so `docker compose` can load.
      - name: Pull shared e2e images (authenc + portal + integrasi)
        env:
          POSTGRES_PASSWORD: e2e_test_pw
          SIMPELV1_APP_KEY: "base64:dGVzdGtleTMyYnl0ZXNzc3Nzc3Nzc3Nzc3Nzc3Nz"
        run: |
          # layanan-integrasi must be built too: the `up` below starts
          # integrasi-migrate, which runs `image: simpel2-integrasi:local`
          # (shared with the layanan-integrasi service). Without it the
          # bring-up dies with "simpel2-integrasi:local: not found" — proven
          # on the first real run of this job (CI run 28557595484).
          # Images come from the shared `e2e-build-images` job (#111); this job
          # used to rebuild them itself, which is why one PR issued up to six
          # identical multi-stage builds.
          set -euo pipefail
          for img in simpel2-authenc simpel2-portal simpel2-integrasi; do
            docker pull "${E2E_REGISTRY}/e2e/${img}:${GITHUB_SHA}"
            docker tag "${E2E_REGISTRY}/e2e/${img}:${GITHUB_SHA}" "${img}:local"
          done
      - name: Bring up e2e stack (bounded)
        env:
          POSTGRES_PASSWORD: e2e_test_pw
          SIMPELV1_APP_KEY: "base64:dGVzdGtleTMyYnl0ZXNzc3Nzc3Nzc3Nzc3Nzc3Nz"
        run: |
          if ! timeout 600 docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d \
              postgres redis integrasi-migrate authenc-migrate authenc portal; then
            echo "::error::portal e2e stack bring-up failed or timed out after 600s (a migrate container likely never reached 'completed' — see ps/logs below)"
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a || true
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=300 || true
            exit 1
          fi
      - name: Wait for stack (authenc + portal FE, on compose network)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" curlimages/curl:8.11.1 sh -c '
            for i in $(seq 1 60); do
              if curl -sf http://authenc:8088/health >/dev/null \
                 && curl -sf http://portal:8080/health >/dev/null; then
                echo "stack ready after $i tries"; exit 0; fi
              sleep 5
            done
            echo "stack did not become ready"; exit 1'
      # The full-login-flow specs need a dashboard-capable user: the baseline
      # NIP seed user is require_password_change=true BY DESIGN (portal guard
      # suite → lands on /portal/password, never /dashboard) and the baseline
      # `admin` user carries a placeholder hash no password verifies against.
      # The multi-satker fixture provides real login-able users.
      - name: Seed e2e multi-satker fixtures
        env:
          POSTGRES_PASSWORD: e2e_test_pw
          SIMPELV1_APP_KEY: "base64:dGVzdGtleTMyYnl0ZXNzc3Nzc3Nzc3Nzc3Nzc3Nz"
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml run -T --rm e2e-seed \
            -v ON_ERROR_STOP=1 -h postgres -U postgres -d dbsimpelv2 -f - \
            < tests/fixtures/e2e/seed-multisatker.sql
      # Build the portal e2e image (context shipped to dind) and run it on the
      # compose network. The specs reach portal:8080 (FE) and authenc:8088 (REST
      # + captcha-debug) by service name; page.route() proxies /api/** to authenc.
      # Runs the image's default CMD = portal-chromium (real-auth login flow)
      # + portal-core (F-E2E E-6 core workflows incl. sessions self-service,
      # admin users/roles/audit, RBAC negatives, logout/cross-tab).
      - name: Run Playwright (portal-chromium + portal-core)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker build -t simpel-e2e-portal \
            -f antarmuka/portal/tests/e2e/Dockerfile.e2e \
            antarmuka/portal/tests/e2e
          docker run --rm --network "$NET" \
            -e BASE_URL=http://portal:8080 \
            -e PORTAL_URL=http://portal:8080 \
            -e AUTHENC_URL=http://authenc:8088 \
            simpel-e2e-portal
      # `--tail=200` was useless for diagnosis: the backend logs at DEBUG with
      # every h2 frame and every SQL statement, so 200 lines covered 1.2 seconds
      # of a run that had been going for five minutes. Two passes instead — an
      # UNBOUNDED warn/error digest (small, and the line that names the cause is
      # always in it), then a wider raw tail for the surrounding context.
      - name: e2e stack logs (on failure)
        if: failure()
        env:
          POSTGRES_PASSWORD: e2e_test_pw
          SIMPELV1_APP_KEY: "base64:dGVzdGtleTMyYnl0ZXNzc3Nzc3Nzc3Nzc3Nzc3Nz"
        run: |
          echo "::group::warn/error digest (all services, unbounded)"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            logs --no-color 2>/dev/null \
            | grep -Ei '"level":"(WARN|ERROR)"|\bERROR\b|\bFATAL\b|panicked' \
            | tail -400 || true
          echo "::endgroup::"
          echo "::group::non-2xx/3xx in any nginx access log"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            logs --no-color 2>/dev/null \
            | grep -Eo '"(GET|POST|PUT|PATCH|DELETE) [^"]*" [0-9]{3}' \
            | grep -Ev ' (2[0-9]{2}|3[0-9]{2})$' | sort | uniq -c || true
          echo "::endgroup::"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            logs --no-color --tail=800 || true
      - name: Tear down e2e stack
        if: always()
        env:
          POSTGRES_PASSWORD: e2e_test_pw
          SIMPELV1_APP_KEY: "base64:dGVzdGtleTMyYnl0ZXNzc3Nzc3Nzc3Nzc3Nzc3Nz"
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v || true
      - name: Upload Playwright report
        if: always()
        # Diagnostic only — must not fail the job when the account artifact
        # quota rejects uploads (see the dist-upload note in the FE builds).
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-portal
          path: |
            antarmuka/portal/tests/e2e/playwright-report
            antarmuka/portal/tests/e2e/results
          retention-days: 7

  e2e-perlengkapan:
    name: E2E Playwright (perlengkapan)
    # Compose stack = authenc + perlengkapan + integrasi + secreton + postgres +
    # redis (NO simpelv1) → no dependency on build-monolith-assets (Vite). The
    # build-* needs are fail-fast gates only (the job builds its own stack).
    needs: [e2e-build-images, detect, build-antarmuka-perlengkapan, build-backend]
    # Self-contained (compose builds the stack) — see e2e-portal note above.
    # Blocking gate via E2E_PERLENGKAPAN_ENABLED, but only when perlengkapan FE or any Rust
    # backend actually changed (skips → SKIP, non-blocking, on docs/infra-only
    # PRs so the ~50min stack build doesn't run for nothing). The on-demand
    # `run_e2e` dispatch path always runs regardless of the change filter.
    if: |
      !cancelled() &&
      (
        github.event.inputs.run_e2e == 'true' ||
        (vars.E2E_PERLENGKAPAN_ENABLED == 'true' &&
         (needs.detect.outputs.rust-frontend == 'true' ||
          needs.detect.outputs.rust-backend == 'true' ||
          needs.detect.outputs.e2e == 'true'))
      ) &&
      needs.build-antarmuka-perlengkapan.result != 'failure' &&
      needs.build-backend.result != 'failure' &&
      needs.e2e-build-images.result == 'success'
    runs-on: arc-simpel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # F5-A: bring up the real e2e stack (base compose + e2e overlay). The SMOKE
      # suite runs from the official Playwright container (browsers + system deps
      # baked in) — ARC blocks `playwright install --with-deps` (no-new-privileges
      # prevents sudo apt). The Playwright container joins the compose network and
      # reaches services by NAME (perlengkapan:8080, authenc:8088), avoiding dind
      # host-port/localhost issues. Throwaway secrets — ephemeral test DB.
      # Build is separated from `up` so the startup phase can be time-bounded.
      # `docker compose up -d` blocks indefinitely on a dependency's
      # `condition: service_completed_successfully` (the migrate containers) —
      # there is no built-in timeout. A HANG (e.g. a migrate that never exits)
      # therefore never triggers the `if: failure()` log step below, so a stuck
      # bring-up silently burned a full 6h runner slot with ZERO diagnostics.
      # Building first, then wrapping only the (fast) start + migrate phase in
      # `timeout`, converts a hang into a prompt, self-diagnosing failure
      # (`ps -a` + `logs` dumped inline so the culprit container is visible).
      # The image build itself can HANG (observed: `apt-get` in a runtime stage
      # stalling on a flaky Debian-mirror fetch from inside the dind sidecar —
      # apt has no connection timeout, so it blocks forever). Without a bound
      # here a stuck build burns the whole runner slot (~6h) with no diagnostics,
      # since the `if: failure()` log step never fires on a hang. Bound it: a
      # legit cold build of all 5 images is ~50min, so 90min (5400s) catches a
      # true hang while leaving generous headroom under host contention. (The
      # apt fetches are also hardened with retries+timeouts in the Dockerfiles.)
      - name: Pull shared e2e images
        env:
          POSTGRES_PASSWORD: e2e_test_pw
          SIMPELV1_APP_KEY: "base64:dGVzdGtleTMyYnl0ZXNzc3Nzc3Nzc3Nzc3Nzc3Nz"
        run: |
          # Images come from the shared `e2e-build-images` job (#111); this job
          # used to rebuild them itself, which is why one PR issued up to six
          # identical multi-stage builds.
          set -euo pipefail
          for img in simpel2-authenc simpel2-secreton simpel2-integrasi simpel2-layanan-perlengkapan simpel2-perlengkapan; do
            docker pull "${E2E_REGISTRY}/e2e/${img}:${GITHUB_SHA}"
            docker tag "${E2E_REGISTRY}/e2e/${img}:${GITHUB_SHA}" "${img}:local"
          done
      - name: Bring up e2e stack (bounded)
        env:
          POSTGRES_PASSWORD: e2e_test_pw
          SIMPELV1_APP_KEY: "base64:dGVzdGtleTMyYnl0ZXNzc3Nzc3Nzc3Nzc3Nzc3Nz"
        run: |
          if ! timeout 600 docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d \
              postgres redis authenc secreton layanan-integrasi layanan-perlengkapan perlengkapan; then
            echo "::error::e2e stack bring-up failed or timed out after 600s (a migrate container likely never reached 'completed' — see ps/logs below)"
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a || true
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=300 || true
            exit 1
          fi
      # `layanan-perlengkapan` (the BACKEND) is in this gate, not just the FE.
      # It is the only service in the stack whose migrations do NOT run in a
      # one-shot `*-migrate` container: it self-migrates (refinery) at boot, so
      # the bring-up step's "wait for migrate containers to complete" covers
      # authenc and integrasi but structurally cannot cover perlengkapan. With
      # only authenc + the FE nginx probed, "stack ready" could — and did —
      # fire while the `perlengkapan` schema did not yet exist, and the seed
      # step immediately after failed with
      #   relation "perlengkapan.pengajuan_kebutuhan_bmn" does not exist.
      # Observed race (run 32906148313): gate passed at :39.567 while the
      # backend was still in its Integrasi connect-retry loop — that loop runs
      # BEFORE the DB connection and migrations, so an OPTIONAL dependency was
      # delaying mandatory schema work; integrasi's gRPC only bound at :41.228,
      # 0.3s after the seed had already failed at :40.965.
      # `/health` is served from the router that is built and bound only after
      # `migrations::run` (layanan/perlengkapan/src/main.rs), so a 200 here is a
      # DERIVED proof that the schema exists — not a hand-maintained list of
      # things someone remembered to wait for.
      - name: Wait for stack (authenc + perlengkapan FE + perlengkapan API, on compose network)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" curlimages/curl:8.11.1 sh -c '
            for i in $(seq 1 60); do
              if curl -sf http://authenc:8088/health >/dev/null \
                 && curl -sf http://perlengkapan:8080/perlengkapan/ >/dev/null \
                 && curl -sf http://layanan-perlengkapan:3020/health >/dev/null; then
                echo "stack ready after $i tries"; exit 0; fi
              sleep 5
            done
            echo "stack did not become ready"; exit 1'
      # Seed multi-satker fixtures (#33/F5-C) so the suite can assert tiered
      # RBAC data-scoping, then the perlengkapan workflow preconditions (F-E2E
      # E-1/E-2/E-3) — the latter needs the `perlengkapan` schema, so it is only
      # applied here (this stack runs layanan-perlengkapan's migrations) and not
      # in the perlengkapan-less e2e jobs. Order matters: the workflow rows
      # reference users/satkers from the multi-satker fixture. Piped via STDIN
      # (not a bind mount) — CI runs under dind. ON_ERROR_STOP=1 fails this step
      # if the fixture SQL errors.
      - name: Seed e2e multi-satker + perlengkapan workflow fixtures
        env:
          POSTGRES_PASSWORD: e2e_test_pw
          SIMPELV1_APP_KEY: "base64:dGVzdGtleTMyYnl0ZXNzc3Nzc3Nzc3Nzc3Nzc3Nz"
        run: |
          for f in tests/fixtures/e2e/seed-multisatker.sql \
                   tests/fixtures/e2e/seed-perlengkapan-workflow.sql; do
            echo ">>> applying $f"
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml run -T --rm e2e-seed \
              -v ON_ERROR_STOP=1 -h postgres -U postgres -d dbsimpelv2 -f - \
              < "$f" || { echo "::error::seed $f failed"; exit 1; }
          done
      # Build the smoke image (context shipped to dind — a bind-mount would
      # resolve against the dind daemon, not the runner checkout, so the tests
      # wouldn't be present), then run it on the compose network.
      - name: Run Playwright SMOKE (perlengkapan-smoke)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker build -t simpel-e2e-smoke \
            -f antarmuka/perlengkapan/tests/e2e/Dockerfile.e2e \
            antarmuka/perlengkapan/tests/e2e
          docker run --rm --network "$NET" \
            -e BASE_URL=http://perlengkapan:8080 \
            -e PERLENGKAPAN_URL=http://perlengkapan:8080 \
            -e AUTHENC_URL=http://authenc:8088 \
            simpel-e2e-smoke
      # F5-C per-role RoleGate regression (#482): the four single-role seed users
      # are denied /admin/*, the all-role user is allowed. Browser-driven, reuses
      # the smoke image; the `setup` project (dependency) writes the per-role
      # storageState from real authenc logins.
      - name: Run Playwright RoleGate regression (perlengkapan-guards-rbac)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" \
            -e BASE_URL=http://perlengkapan:8080 \
            -e PERLENGKAPAN_URL=http://perlengkapan:8080 \
            -e AUTHENC_URL=http://authenc:8088 \
            simpel-e2e-smoke \
            npx playwright test --project=perlengkapan-guards-rbac
      # F5-C RBAC data-scoping: server-side enforcement on the perlengkapan
      # BACKEND (#66/#565/#566). Pure-API — reuses the smoke image, overriding
      # the project. Talks to authenc (login) + layanan-perlengkapan (bank-aset)
      # by compose service name; the multi-satker fixture seeded above supplies
      # the deterministic per-role row counts it asserts.
      - name: Run Playwright RBAC scoping (perlengkapan-rbac)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" \
            -e AUTHENC_URL=http://authenc:8088 \
            -e PERLENGKAPAN_API_URL=http://layanan-perlengkapan:3020 \
            simpel-e2e-smoke \
            npx playwright test --project=perlengkapan-rbac
      # F5-C UI-layer data-scoping (Layer-3): the FE bank-aset list renders only
      # in-scope rows. Browser-driven against the FE (perlengkapan:8080), whose
      # nginx now proxies origin-relative /api to the compose backend (the
      # FE→BE upstream fix in this PR). Reuses per-role storageState from `setup`.
      #
      # PERLENGKAPAN_API_URL is required even though this project drives a
      # BROWSER: the spec no longer hard-codes seed markers (which only held on a
      # small, fresh CI database and passed vacuously against a real snapshot).
      # It now DERIVES what to expect — the row total and the exact in-scope
      # satker set — from the backend for the same token, then asserts the page
      # renders that. Without this variable the helper falls back to
      # http://localhost:3020, which inside the runner container is nothing.
      - name: Run Playwright UI scoping (perlengkapan-ui-rbac)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" \
            -e BASE_URL=http://perlengkapan:8080 \
            -e PERLENGKAPAN_URL=http://perlengkapan:8080 \
            -e AUTHENC_URL=http://authenc:8088 \
            -e PERLENGKAPAN_API_URL=http://layanan-perlengkapan:3020 \
            simpel-e2e-smoke \
            npx playwright test --project=perlengkapan-ui-rbac
      # F5-C route-coverage: every feature-module route mounts the authenticated
      # app shell per role (replaces the deleted legacy MOCK ui-*.spec.ts).
      - name: Run Playwright route-coverage (perlengkapan-nav)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" \
            -e BASE_URL=http://perlengkapan:8080 \
            -e PERLENGKAPAN_URL=http://perlengkapan:8080 \
            -e AUTHENC_URL=http://authenc:8088 \
            simpel-e2e-smoke \
            npx playwright test --project=perlengkapan-nav
      # F-E2E E-1: full Kebutuhan BMN workflow (operator submit → wilayah forward
      # → pusat approve + cross-satker isolation). Needs the backend too
      # (PERLENGKAPAN_API_URL) — it asserts status_kode transitions against the
      # API, not just the UI. Preconditions in seed-multisatker.sql.
      - name: Run Playwright Kebutuhan BMN workflow (perlengkapan-kebutuhan)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" \
            -e BASE_URL=http://perlengkapan:8080 \
            -e PERLENGKAPAN_URL=http://perlengkapan:8080 \
            -e AUTHENC_URL=http://authenc:8088 \
            -e PERLENGKAPAN_API_URL=http://layanan-perlengkapan:3020 \
            simpel-e2e-smoke \
            npx playwright test --project=perlengkapan-kebutuhan
      # F-E2E E-2: Pakaian Dinas workflow (validator forwards a satker via the
      # action panel + master/campaign/report reachability + role-gating).
      - name: Run Playwright Pakaian Dinas workflow (perlengkapan-pakaian)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" \
            -e BASE_URL=http://perlengkapan:8080 \
            -e PERLENGKAPAN_URL=http://perlengkapan:8080 \
            -e AUTHENC_URL=http://authenc:8088 \
            -e PERLENGKAPAN_API_URL=http://layanan-perlengkapan:3020 \
            simpel-e2e-smoke \
            npx playwright test --project=perlengkapan-pakaian
      # F-E2E E-3: Pengelolaan BMN — Penghapusan full workflow (submit → forward
      # → verify → Generate Konsep SK + PDF) + Pemakaian scoping/revoke-policy.
      - name: Run Playwright Pengelolaan BMN workflow (perlengkapan-pengelolaan)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" \
            -e BASE_URL=http://perlengkapan:8080 \
            -e PERLENGKAPAN_URL=http://perlengkapan:8080 \
            -e AUTHENC_URL=http://authenc:8088 \
            -e PERLENGKAPAN_API_URL=http://layanan-perlengkapan:3020 \
            simpel-e2e-smoke \
            npx playwright test --project=perlengkapan-pengelolaan
      # F-E2E E-4: Bank Aset (filters/search/sort/detail/sebaran/QR) + Dashboard
      # & global search + Analitik (roadmap create→list, kodefikasi) + Notifikasi
      # (per-user inbox read lifecycle + cross-user isolation).
      - name: Run Playwright Bank Aset + Analitik workflow (perlengkapan-bankaset)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" \
            -e BASE_URL=http://perlengkapan:8080 \
            -e PERLENGKAPAN_URL=http://perlengkapan:8080 \
            -e AUTHENC_URL=http://authenc:8088 \
            -e PERLENGKAPAN_API_URL=http://layanan-perlengkapan:3020 \
            simpel-e2e-smoke \
            npx playwright test --project=perlengkapan-bankaset
      # F-E2E E-5 — Bantuan (helpdesk ticket lifecycle incl. staff flow),
      # admin workflow config/monitoring/delegation, kebutuhan buat + laporan
      # exports, pakaian ukuran, negative/RBAC edges. Click-driven navigation.
      - name: Run Playwright Admin + Bantuan workflow (perlengkapan-admin-bantuan)
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" \
            -e BASE_URL=http://perlengkapan:8080 \
            -e PERLENGKAPAN_URL=http://perlengkapan:8080 \
            -e AUTHENC_URL=http://authenc:8088 \
            -e PERLENGKAPAN_API_URL=http://layanan-perlengkapan:3020 \
            simpel-e2e-smoke \
            npx playwright test --project=perlengkapan-admin-bantuan
      # `--tail=200` was useless for diagnosis: the backend logs at DEBUG with
      # every h2 frame and every SQL statement, so 200 lines covered 1.2 seconds
      # of a run that had been going for five minutes. Two passes instead — an
      # UNBOUNDED warn/error digest (small, and the line that names the cause is
      # always in it), then a wider raw tail for the surrounding context.
      - name: e2e stack logs (on failure)
        if: failure()
        env:
          POSTGRES_PASSWORD: e2e_test_pw
          SIMPELV1_APP_KEY: "base64:dGVzdGtleTMyYnl0ZXNzc3Nzc3Nzc3Nzc3Nzc3Nz"
        run: |
          echo "::group::warn/error digest (all services, unbounded)"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            logs --no-color 2>/dev/null \
            | grep -Ei '"level":"(WARN|ERROR)"|\bERROR\b|\bFATAL\b|panicked' \
            | tail -400 || true
          echo "::endgroup::"
          echo "::group::non-2xx/3xx in any nginx access log"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            logs --no-color 2>/dev/null \
            | grep -Eo '"(GET|POST|PUT|PATCH|DELETE) [^"]*" [0-9]{3}' \
            | grep -Ev ' (2[0-9]{2}|3[0-9]{2})$' | sort | uniq -c || true
