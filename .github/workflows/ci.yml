            antarmuka/portal/tests/e2e/playwright-report
            antarmuka/portal/tests/e2e/results
          retention-days: 7

  # ── Secreton bootstrap ↔ Gateway (F-GW PR-B) ──
  # Proves the secreton secret path simpelv1 depends on actually works end to
  # end: the one-shot `secreton-bootstrap` runs REAL Shamir init+unseal against
  # secreton's REST API, seeds a secret THROUGH THE GATEWAY (gateway → secreton
  # gRPC StoreSecret), then reads it back through the gateway and asserts the
  # value matches. The bootstrap's exit code IS the assertion (real state, not
  # mock). Shared prereq for the simpelv1 live suite (PR-C). Gated by
  # E2E_INTEGRATION_ENABLED; the run_e2e dispatch always runs. NOT in
  # ci-summary.needs (opt-in integration job, mirrors e2e-integrasi-authenc).
  e2e-secreton-gateway:
    name: E2E Secreton bootstrap ↔ Gateway (init/unseal/seed)
    needs: [e2e-build-images, detect, build-backend]
    if: |
      !cancelled() &&
      (
        github.event.inputs.run_e2e == 'true' ||
        (vars.E2E_INTEGRATION_ENABLED == 'true' &&
         (needs.detect.outputs.rust-backend == 'true' ||
          needs.detect.outputs.e2e == 'true'))
      ) &&
      needs.build-backend.result != 'failure' &&
      needs.e2e-build-images.result == 'success'
    runs-on: arc-simpel
    timeout-minutes: 120
    env:
      POSTGRES_PASSWORD: e2e_test_pw
      SIMPELV1_APP_KEY: "base64:dGVzdGtleTMyYnl0ZXNzc3Nzc3Nzc3Nzc3Nzc3Nz"
    steps:
      - uses: actions/checkout@v7
      - name: Build images (secreton + gateway + authenc + layanan-integrasi)
        run: |
          # gateway depends_on authenc + layanan-integrasi (service_started), so
          # they must exist even though the bootstrap only exercises the secreton
          # channel (gateway gRPC channels are lazy — connect_lazy).
          # Images come from the shared `e2e-build-images` job (#111); this job
          # used to rebuild them itself, which is why one PR issued up to six
          # identical multi-stage builds.
          set -euo pipefail
          for img in simpel2-secreton simpel2-gateway simpel2-authenc simpel2-integrasi; do
            docker pull "${E2E_REGISTRY}/e2e/${img}:${GITHUB_SHA}"
            docker tag "${E2E_REGISTRY}/e2e/${img}:${GITHUB_SHA}" "${img}:local"
          done
      - name: Bring up core stack (bounded)
        run: |
          if ! timeout 600 docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d \
              postgres secreton integrasi-migrate authenc-migrate authenc layanan-integrasi gateway; then
            echo "::error::secreton-gateway stack bring-up failed or timed out after 600s"
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a || true
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=300 || true
            exit 1
          fi
      - name: Wait for secreton REST + gateway
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" busybox:1.36 sh -c '
            for i in $(seq 1 60); do
              if nc -z secreton 8200 && nc -z gateway 8090; then
                echo "secreton REST + gateway ready after $i tries"; exit 0; fi
              sleep 5
            done
            echo "secreton/gateway did not become ready"; exit 1'
      - name: Run secreton bootstrap + dynamic-DB provisioning (exit code = assertion)
        run: |
          # The one-shot init+unseal+seed-via-gateway+verify-readback, PLUS (with
          # SECRETON_DB_PROVISION=1) the dynamic database secrets-engine flow:
          # configure the admin connection, create the leased role, issue one
          # short-lived credential via the gateway, and prove it authenticates
          # against Postgres. A non-zero exit means either the secret round-trip
          # OR the dynamic-lease path broke. The gateway carries
          # GATEWAY_ENABLE_DB_ADMIN=1 from docker-compose.e2e.yml.
          if ! docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
              run --rm --no-deps -e SECRETON_DB_PROVISION=1 secreton-bootstrap; then
            echo "::error::secreton bootstrap failed — secret round-trip or dynamic-DB lease broke"
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200 secreton gateway || true
            exit 1
          fi
      - name: Stack logs (on failure)
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            logs --no-color --tail=200 || true
      - name: Tear down stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v || true

  # ── simpelv1 ↔ gateway LIVE integration (F-GW PR-C) ──
  # Runs simpelv1's real *GrpcClient classes (NOT Http::fake) against a live
  # gateway → authenc + secreton + layanan-integrasi. Proves the REST→gRPC path
  # simpelv1 depends on actually works: secreton secret round-trip (seeded by the
  # bootstrap), authenc fail-closed token rejection, and integrasi SIMAN asset +
  # MySIMKARI employee reads (seeded) + MonSAKTI-dormant 501. Gated by
  # E2E_INTEGRATION_ENABLED / run_e2e. NOT in ci-summary.needs (opt-in).
  e2e-simpelv1-integration:
    name: E2E simpelv1 ↔ gateway (authenc + secreton + integrasi, live)
    needs: [e2e-build-images, detect, build-backend]
    if: |
      !cancelled() &&
      (
        github.event.inputs.run_e2e == 'true' ||
        (vars.E2E_INTEGRATION_ENABLED == 'true' &&
         (needs.detect.outputs.rust-backend == 'true' ||
          needs.detect.outputs.monolith-php == 'true' ||
          needs.detect.outputs.e2e == 'true'))
      ) &&
      needs.build-backend.result != 'failure' &&
      needs.e2e-build-images.result == 'success'
    runs-on: arc-simpel
    timeout-minutes: 120
    env:
      POSTGRES_PASSWORD: e2e_test_pw
      SIMPELV1_APP_KEY: "base64:dGVzdGtleTMyYnl0ZXNzc3Nzc3Nzc3Nzc3Nzc3Nz"
    steps:
      - uses: actions/checkout@v7
      - name: Build images (authenc + secreton + layanan-integrasi + gateway)
        run: |
          # Images come from the shared `e2e-build-images` job (#111); this job
          # used to rebuild them itself, which is why one PR issued up to six
          # identical multi-stage builds.
          set -euo pipefail
          for img in simpel2-authenc simpel2-secreton simpel2-integrasi simpel2-gateway; do
            docker pull "${E2E_REGISTRY}/e2e/${img}:${GITHUB_SHA}"
            docker tag "${E2E_REGISTRY}/e2e/${img}:${GITHUB_SHA}" "${img}:local"
          done
      - name: Bring up core stack (bounded)
        run: |
          if ! timeout 600 docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d \
              postgres secreton integrasi-migrate authenc-migrate authenc layanan-integrasi gateway; then
            echo "::error::simpelv1-integration stack bring-up failed or timed out after 600s"
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a || true
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=300 || true
            exit 1
          fi
      - name: Wait for gateway + backends
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" busybox:1.36 sh -c '
            for i in $(seq 1 60); do
              if nc -z gateway 8090 && nc -z authenc 8088 && nc -z layanan-integrasi 50052 && nc -z secreton 8200; then
                echo "gateway + backends ready after $i tries"; exit 0; fi
              sleep 5
            done
            echo "stack did not become ready"; exit 1'
      - name: Bootstrap secreton (init/unseal + seed secret via gateway)
        run: |
          if ! docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
              run --rm --no-deps secreton-bootstrap; then
            echo "::error::secreton bootstrap failed — simpelv1↔secreton test cannot pass"
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200 secreton gateway || true
            exit 1
          fi
      - name: Seed integrasi + authenc fixtures (dbsimpelv2)
        run: |
          for f in tests/fixtures/e2e/seed-multisatker.sql tests/fixtures/e2e/seed-simpelv1-live.sql; do
            echo ">>> applying $f"
            if ! docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
                run --rm -T e2e-seed \
                -v ON_ERROR_STOP=1 -h postgres -U postgres -d dbsimpelv2 -f - < "$f"; then
              echo "::error::seed $f failed"; exit 1
            fi
          done
      - name: composer install (simpelv1)
        uses: ./.github/actions/composer-install
      - name: Prepare sqlite test DB
        run: |
          rm -f /tmp/simpelv1-test.sqlite
          touch /tmp/simpelv1-test.sqlite
          chmod 666 /tmp/simpelv1-test.sqlite
      - name: PHPUnit IntegrationLive (real gateway)
        working-directory: monolith/simpelv1
        run: |
          NET="$(docker network ls --format '{{.Name}}' | grep -m1 simpel-network)"
          echo "stack network: ${NET:?simpel-network not found}"
          docker run --rm --network "$NET" \
            -v "$PWD":/app \
            -v /tmp/simpelv1-test.sqlite:/tmp/simpelv1-test.sqlite \
            -w /app -u "$(id -u):$(id -g)" \
            -e AUTHENC_GATEWAY_URL=http://gateway:8090 \
            -e SECRETON_GATEWAY_URL=http://gateway:8090 \
            -e INTEGRASI_GATEWAY_URL=http://gateway:8090 \
            --entrypoint vendor/bin/phpunit serversideup/php:8.2-cli \
            --testsuite IntegrationLive --no-coverage
      - name: Stack logs (on failure)
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            logs --no-color --tail=200 || true
      - name: Tear down stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v || true

  # ─────────────────────────────────────────────────────
  # Phase 5 — Summary (single required check)
  # ─────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    if: always()
    needs:
      - detect
      - enforce-structure
      - enforce-versioning
      - fmt-rust
      - clippy-rust
      - lint-php
      - lint-blade
      - lint-dockerfile
      - lint-yaml
      - lint-markdown
      - lint-shell
      - lint-toml
      - lint-sql
      - migration-replay
      - lint-orphan-tests
      - route-coverage
      - build-antarmuka-portal
      - build-antarmuka-perlengkapan
      - build-backend
      - build-monolith-assets
      - build-docker
      - test-lib-core
      - test-lib-backend
      - test-lib-crypto
      - test-lib-perlengkapan
      - test-lib-ui
      - test-antarmuka-portal
      - test-antarmuka-perlengkapan
      - test-services
      - test-monolith
      - e2e-portal
      - e2e-perlengkapan
      # Keempat job e2e lintas-service di bawah PERNAH tak ada di daftar ini,
      # dan `E2E simpelv1 ↔ gateway` sempat merah di main @202aea6f sementara
      # `CI Summary` melapor success — gate-nya hijau, jobnya merah.
      # `e2e-build-images` ikut masuk karena kegagalannya men-SKIP semua e2e di
      # bawahnya, dan skip dihitung lulus oleh agregator.
      # Dijaga mekanis oleh infra/scripts/check-ci-summary-scope.py.
      - e2e-build-images
      - e2e-integrasi-authenc
      - e2e-portal-cross-app
      - e2e-secreton-gateway
      - e2e-simpelv1-integration
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - name: Aggregate results
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          PARSED=$(echo "$NEEDS_JSON" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for k, v in data.items():
              print(k + "|" + v.get("result", "unknown"))
          ')
          while IFS='|' read -r job result; do
            [ -z "$job" ] && continue
            case "$result" in
              success) icon="OK" ;;
              skipped) icon="SKIP" ;;
              failure) icon="FAIL"; fail=1 ;;
              cancelled) icon="CANCEL"; fail=1 ;;
              *) icon="$result" ;;
            esac
            echo "| $job | $icon |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$PARSED"
          if [[ $fail -ne 0 ]]; then
            echo "::error::One or more required CI jobs failed"
            exit 1
          fi
          echo "All required jobs passed."

  # Per-CI-run cleanup. Per-job target/ wipe-at-start (see comments around
  # line 537) covers correctness, but the matching post-job cleanup is
  # missing — when a runner sits idle between PRs the leaked target/ and
  # trunk dist/ from the previous run persist until the next wipe-at-start.
  # This job runs once at end of CI with `if: always()` so it fires even
  # on cancelled or failed runs (precisely when the leak is worst).
  #
  # Limitation: it only cleans the runner *this* job lands on; with
  # multiple self-hosted runners, cleanup distribution is statistical.
  # `maintenance.yml::runner-health` (daily cron) is the catch-all backstop
  # that covers every runner over time.
  cleanup-runner:
    name: Per-run cleanup (target / dist / dangling images)
    if: always()
    needs:
      - build-antarmuka-portal
      - build-antarmuka-perlengkapan
      - build-backend
      - build-monolith-assets
      - build-docker
      - test-lib-core
      - test-lib-backend
      - test-lib-crypto
      - test-lib-perlengkapan
      - test-lib-ui
      - test-antarmuka-portal
      - test-antarmuka-perlengkapan
      - test-services
      - test-monolith
      - e2e-portal
      - e2e-perlengkapan
    runs-on: arc-simpel
    timeout-minutes: 30
    steps:
      - name: Trim CI artifacts from this runner
        shell: bash
        run: |
          set +e
          echo "=== Disk before cleanup ==="
          df -h "$RUNNER_WORKSPACE" || df -h /

          # Only touch caches from runs older than 6h on this runner — keeps
          # ad-hoc cache hits intact for back-to-back PR pushes while still
          # reaping the previous-day leak.
          WORK_DIR="${RUNNER_WORKSPACE%/*}"
          if [ -d "$WORK_DIR" ]; then
            find "$WORK_DIR" -maxdepth 4 -type d \( -name target -o -name dist \) \
              -mmin +360 -print -exec rm -rf {} + 2>/dev/null || true
          fi

          # Stop and remove leaked Buildx builders + buildkit containers older than 4 hours (14400s).
          # Keeps active sibling matrix jobs' builders intact while reclaiming stale ones.
          if command -v docker &>/dev/null; then
            echo "=== Checking for leaked Buildx builders (>4h) ==="
            NOW=$(date +%s)
            docker ps -a --filter "name=buildx_buildkit" \
              --format '{{.Names}}|{{.CreatedAt}}' | while IFS='|' read -r cname created; do
              ts=$(date -d "${created% UTC}" +%s 2>/dev/null) || continue
              [ -z "$ts" ] && continue
              if [ $((NOW - ts)) -gt 14400 ]; then
                builder="${cname#buildx_buildkit_}"; builder="${builder%0}"
                echo "Reaping leaked builder=$builder (container=$cname)"
                docker buildx rm -f "$builder" 2>/dev/null || docker rm -f -v "$cname" 2>/dev/null
              fi
            done
            # Drop dangling builder registry entries whose container is gone.
            for b in $(docker buildx ls --format '{{.Name}}' 2>/dev/null | grep '^buildx-'); do
              docker inspect "buildx_buildkit_${b}0" >/dev/null 2>&1 || docker buildx rm -f "$b" 2>/dev/null
            done
            docker volume prune --force --filter "label=builder=buildx" >/dev/null 2>&1
          fi

          # Dangling Docker images from `docker run` pulls during this CI.
          # Tagged images (cargo-chef, base distroless) stay.
          if command -v docker &>/dev/null; then
            docker image prune --force --filter "until=24h"
          fi

          echo "=== Disk after cleanup ==="
          df -h "$RUNNER_WORKSPACE" || df -h /
