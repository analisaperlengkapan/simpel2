name: Sync - GitLab to GitHub

on:
  repository_dispatch:
    types: [gitlab-sync]
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync'
        type: boolean
        default: false

concurrency:
  group: sync-gitlab-to-github
  cancel-in-progress: false

env:
  SYNC_AUTHOR_EMAIL: "gitlab-sync-bot@kejaksaan.go.id"
  SYNC_AUTHOR_NAME: "GitLab Sync Bot"

jobs:
  check-and-sync:
    name: Check & Sync from GitLab
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "${{ env.SYNC_AUTHOR_EMAIL }}"
          git config user.name "${{ env.SYNC_AUTHOR_NAME }}"

      - name: Fetch and compare GitLab
        env:
          GITLAB_MIRROR_URL: ${{ secrets.GITLAB_MIRROR_URL }}
        run: |
          git remote add gitlab "$GITLAB_MIRROR_URL" 2>/dev/null || \
            git remote set-url gitlab "$GITLAB_MIRROR_URL"
          git fetch gitlab main --tags 2>/dev/null || {
            echo "::warning::Failed to fetch GitLab"
            exit 0
          }

          GITHUB_SHA=$(git rev-parse HEAD)
          GITLAB_SHA=$(git rev-parse gitlab/main 2>/dev/null || echo "UNKNOWN")

          if [ "$GITHUB_SHA" = "$GITLAB_SHA" ] || [ "$GITLAB_SHA" = "UNKNOWN" ]; then
            echo "Repositories are in sync (or GitLab unreachable)"
            exit 0
          fi

          # Check if GitLab is ahead
          BEHIND=$(git rev-list --count HEAD..gitlab/main 2>/dev/null || echo "0")
          if [ "$BEHIND" -gt 0 ]; then
            LATEST_MSG=$(git log gitlab/main -1 --format="%s")
            if [[ "$LATEST_MSG" == *"[github-sync]"* ]]; then
              echo "Latest GitLab commit is from GitHub sync - skipping"
              exit 0
            fi
            echo "GitLab is $BEHIND commits ahead - creating sync PR"
            BRANCH_NAME="sync/gitlab-to-github-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH_NAME" gitlab/main
            git push origin "$BRANCH_NAME"
            echo "Sync branch pushed: $BRANCH_NAME"
          fi
