name: Sync - GitHub to GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync'
        type: boolean
        default: false

concurrency:
  group: sync-github-to-gitlab
  cancel-in-progress: false

env:
  SYNC_COMMIT_MARKER: "[github-sync]"
  SYNC_AUTHOR_EMAIL: "github-sync-bot@kejaksaan.go.id"
  SYNC_AUTHOR_NAME: "GitHub Sync Bot"

jobs:
  detect-source:
    name: Detect Commit Source
    runs-on: self-hosted
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - name: Check if sync commit
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.email }}"
          SHOULD_SKIP="false"
          if [[ "$COMMIT_MSG" == *"[gitlab-sync]"* ]] || \
             [[ "$COMMIT_MSG" == *"[skip sync]"* ]] || \
             [[ "$COMMIT_AUTHOR" == *"gitlab-sync-bot"* ]]; then
            SHOULD_SKIP="true"
          fi
          echo "should_skip=$SHOULD_SKIP" >> $GITHUB_OUTPUT

  sync:
    name: Push to GitLab
    runs-on: self-hosted
    needs: detect-source
    if: needs.detect-source.outputs.should_skip != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "${{ env.SYNC_AUTHOR_EMAIL }}"
          git config user.name "${{ env.SYNC_AUTHOR_NAME }}"

      - name: Push to GitLab
        env:
          GITLAB_MIRROR_URL: ${{ secrets.GITLAB_MIRROR_URL }}
        run: |
          git remote add gitlab "$GITLAB_MIRROR_URL" 2>/dev/null || \
            git remote set-url gitlab "$GITLAB_MIRROR_URL"
          git push gitlab main --force-with-lease --tags 2>&1 || \
            echo "::warning::Failed to push to GitLab"
