# Master daftar label repo simpel2 — disinkron oleh maintenance.yml::label-sync
# (EndBug/label-sync, delete-other-labels: false → label lama tidak ikut dihapus).
#
# Taksonomi sengaja dibuat ORTOGONAL & minimal: tiap dimensi memberi sinyal
# triage yang berbeda, tanpa duplikasi.
#
#   comp:<domain>  — KOMPONEN produk (1 label/domain). Menggabungkan bekas
#                    microservice:/microfrontend:/lib: yang dulu memunculkan
#                    3 label utk satu domain (mis. perlengkapan).
#   area:<lintas>  — concern LINTAS-komponen (ortogonal terhadap comp).
#   size:<x>       — ukuran diff (otomatis).
#   type:<x>       — jenis perubahan (issue/manual).
#   priority:<x>   — prioritas (manual triage).
#
# Sengaja DIHAPUS dari pemakaian otomatis: lang:* (derivable dari comp, noise)
# dan complexity:* (tumpang-tindih dgn size:*).

# ─── Komponen (comp:) ───────────────────────
- name: "comp:perlengkapan"
  color: "0052CC"
  description: "Domain Perlengkapan/BMN (layanan + antarmuka + lib)"
- name: "comp:authenc"
  color: "0052CC"
  description: "Domain auth/IAM (authenc)"
- name: "comp:integrasi"
  color: "0052CC"
  description: "Domain integrasi MySIMKARI/SIMAN"
- name: "comp:secreton"
  color: "0052CC"
  description: "Domain secrets vault (secreton)"
- name: "comp:portal"
  color: "0052CC"
  description: "Portal SSO (antarmuka/portal)"
- name: "comp:monolith"
  color: "0052CC"
  description: "Monolith SIMPEL v1 (Laravel/PHP)"
- name: "comp:shared"
  color: "0052CC"
  description: "Shared libs lintas-domain (lib/ui, core, backend, crypto)"
- name: "comp:infra"
  color: "0052CC"
  description: "Infrastruktur deploy (k8s, helm, nginx, scripts, monitoring)"

# ─── Area lintas-komponen (area:) ───────────
- name: "area:ci-cd"
  color: "FBCA04"
  description: "GitHub Actions / pipeline / build"
- name: "area:database"
  color: "FBCA04"
  description: "Migrasi / SQL / skema database"
- name: "area:security"
  color: "B60205"
  description: "Perubahan sensitif keamanan"
- name: "area:deps"
  color: "FBCA04"
  description: "Update dependency / lockfile"
- name: "area:docs"
  color: "FBCA04"
  description: "Dokumentasi saja"

# ─── Ukuran diff (size:) — otomatis ─────────
- name: "size:xs"
  color: "00DD00"
  description: "<10 baris"
- name: "size:s"
  color: "44DD00"
  description: "10–99 baris"
- name: "size:m"
  color: "BBDD00"
  description: "100–499 baris"
- name: "size:l"
  color: "DDBB00"
  description: "500–999 baris"
- name: "size:xl"
  color: "DD4400"
  description: "≥1000 baris"

# ─── Jenis (type:) ──────────────────────────
- name: "type:bug"
  color: "D73A4A"
  description: "Bug / perbaikan"
- name: "type:enhancement"
  color: "A2EEEF"
  description: "Fitur / peningkatan"
- name: "type:question"
  color: "D876E3"
  description: "Pertanyaan / bantuan"

# ─── Prioritas (priority:) ──────────────────
- name: "priority:high"
  color: "B60205"
  description: "Prioritas tinggi"
- name: "priority:medium"
  color: "FBCA04"
  description: "Prioritas sedang"
- name: "priority:low"
  color: "0E8A16"
  description: "Prioritas rendah"

# ─── Otomatis ───────────────────────────────
- name: "automated"
  color: "EDEDED"
  description: "PR otomatis (Dependabot, autofix, dll.)"
