# Copilot Setup Steps for SIMPelv2
# Pre-installs dependencies before Copilot coding agent starts working

name: Copilot Setup

steps:
  - name: Setup Rust toolchain
    run: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.92
      source $HOME/.cargo/env
      rustup target add wasm32-unknown-unknown
      cargo install trunk

  - name: Install system dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

  - name: Setup cargo cache
    run: |
      mkdir -p ~/.cargo/registry
      mkdir -p ~/.cargo/git

  - name: Verify workspace
    run: |
      cargo check --workspace --message-format=short 2>&1 | head -50
