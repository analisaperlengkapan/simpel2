# Konfigurasi github/issue-labeler — regex konten → label.
# Selaras dgn taksonomi comp:/area:/type: di labels.yml.

# ─── Komponen ───────────────────────────────
"comp:authenc":
  - '(?i)\b(auth|login|sso|mfa|webauthn|otp|2fa|jwt|oauth|saml|authenc)\b'

"comp:secreton":
  - '(?i)\b(secret|vault|hsm|sealed|kms|encryption[- ]at[- ]rest|secreton)\b'

"comp:perlengkapan":
  - '(?i)\b(perlengkapan|bmn|aset|inventaris|barang milik negara|pakaian dinas|pemakaian|penghapusan|kebutuhan)\b'

"comp:integrasi":
  - '(?i)\b(integrasi|integration|mysimkari|siman|sync|federation|external)\b'

"comp:portal":
  - '(?i)\b(portal|landing|gateway|sso login)\b'

"comp:monolith":
  - '(?i)\b(simpelv1|monolith|laravel|blade|legacy)\b'

# ─── Area lintas-komponen ───────────────────
"area:security":
  - '(?i)\b(cve[- ]?\d+|vulnerability|exploit|cwe|security|attack|injection|xss|csrf)\b'

"area:database":
  - '(?i)\b(postgres|database|migration|migrasi|sqlx|deadpool|sql query)\b'

"area:ci-cd":
  - '(?i)\b(github action|workflow|ci/cd|pipeline|dependabot|runner)\b'

"area:docs":
  - '(?i)\b(documentation|docs|readme|tutorial|guide|dokumentasi)\b'

# ─── Jenis ──────────────────────────────────
"type:bug":
  - '(?i)\b(bug|error|crash|panic|gagal|broken|regression|tidak berfungsi)\b'

"type:enhancement":
  - '(?i)\b(feature|enhancement|request|fitur|peningkatan|usulan)\b'
