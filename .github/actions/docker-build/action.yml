name: 'Docker Build'
description: 'Buildx-based Docker build with GHA cache, optional push, optional Trivy scan'

inputs:
  image:
    description: 'Image name (e.g. simpel-authenc)'
    required: true
  context:
    description: 'Build context'
    required: false
    default: '.'
  dockerfile:
    description: 'Path ke Dockerfile relatif terhadap context'
    required: true
  tags:
    description: 'Multiline list tag (one per line)'
    required: true
  push:
    description: 'Push image ke registry'
    required: false
    default: 'false'
  registry:
    description: 'Registry untuk push (mis. ghcr.io)'
    required: false
    default: 'ghcr.io'
  registry-username:
    description: 'Username registry'
    required: false
    default: ''
  registry-password:
    description: 'Token/password registry'
    required: false
    default: ''
  platforms:
    description: 'Target platforms'
    required: false
    default: 'linux/amd64'
  scan:
    description: 'Jalankan Trivy scan setelah build'
    required: false
    default: 'false'
  scan-severity:
    description: 'Trivy severity threshold'
    required: false
    default: 'HIGH,CRITICAL'
  build-args:
    description: 'Multiline build args (KEY=value per line)'
    required: false
    default: ''
  load:
    description: 'Load image ke daemon (untuk scan/test lokal)'
    required: false
    default: 'true'

outputs:
  digest:
    description: 'Digest image yang dibuild'
    value: ${{ steps.build.outputs.digest }}
  imageid:
    description: 'Image ID lokal'
    value: ${{ steps.build.outputs.imageid }}

runs:
  using: "composite"
  steps:
    - name: Setup Buildx
      uses: docker/setup-buildx-action@v3
      with:
        name: buildx-${{ inputs.image }}-${{ github.run_id }}
        # cleanup: true → setup-buildx-action's post step runs `docker buildx rm`
        # at job end, removing this builder + its buildkit container + state
        # volume. Previously `false`, so every CI run leaked one docker-container
        # builder (818 builders / 154 buildkit containers / 155 volumes had
        # accumulated on the self-hosted host). Each job only removes the builder
        # it created — no cross-job risk.
        cleanup: true
        driver: docker-container
        driver-opts: |
          image=moby/buildkit:latest
          network=host

    - name: Login to registry
      if: inputs.push == 'true' && inputs.registry-username != '' && inputs.registry-password != ''
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        tags: ${{ inputs.tags }}
        push: ${{ inputs.push }}
        load: ${{ inputs.push == 'false' && inputs.load == 'true' }}
        platforms: ${{ inputs.platforms }}
        build-args: ${{ inputs.build-args }}
        # `ignore-error=true` on the EXPORT: the gha cache backend is billed
        # against the same Actions storage quota as artifacts, and when that
        # quota is exhausted the export fails and buildx aborts the whole build
        # with `failed to solve: not_found` — even though the image compiled
        # cleanly. Observed on PR #685 (job 89870932217): 30+ minutes of
        # successful compilation thrown away, immediately followed by
        # "Artifact storage quota has been hit".
        #
        # A cache write is an optimisation. It must never be able to fail a
        # build whose content is correct, especially when the trigger is an
        # account-wide quota this repo cannot control (this repo holds only
        # ~0.2 GB of artifacts). The import side already tolerates a miss.
        cache-from: type=gha,scope=${{ inputs.image }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image }},ignore-error=true
        provenance: ${{ inputs.push }}
        sbom: ${{ inputs.push }}

    - name: Run Trivy scan
      if: inputs.scan == 'true'
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        image-ref: ${{ steps.build.outputs.imageid || format('{0}:scan-temp', inputs.image) }}
        format: 'sarif'
        output: 'trivy-${{ inputs.image }}.sarif'
        severity: ${{ inputs.scan-severity }}
        exit-code: '0'
        ignore-unfixed: 'true'

    - name: Upload Trivy SARIF
      if: inputs.scan == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-${{ inputs.image }}.sarif
        category: trivy-${{ inputs.image }}
      continue-on-error: true
