name: 'Setup Rust Environment'
description: 'Installs system dependencies, Rust toolchain, Protoc, and configures caching for SIMPEL CI/CD'

inputs:
  toolchain:
    # Pinned (F-CI) for reproducible CI — bump deliberately, not implicitly.
    # Pinned here (composite action) rather than a root rust-toolchain.toml so
    # third-party containerized actions (e.g. cargo-deny) don't try to install
    # this toolchain in their own images (which timed out on ARC).
    description: 'Rust toolchain version'
    required: false
    default: '1.97.1'
  targets:
    description: 'Comma-separated list of targets to install'
    required: false
    default: ''
  components:
    description: 'Comma-separated list of components to install'
    required: false
    default: ''
  cache-key:
    description: 'Additional cache key suffix'
    required: false
    default: 'default'
  github-token:
    description: 'GitHub token for API requests'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Fix workspace permissions
      shell: bash
      run: |
        # Fix root-owned files from previous Docker builds on self-hosted runners
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine \
          chown -R $(id -u):$(id -g) . 2>/dev/null || true
        # Clean up stale build artifacts
        rm -rf ${{ github.workspace }}/protoc ${{ github.workspace }}/.build_config 2>/dev/null || true

    - name: Install system dependencies
      shell: bash
      run: |
        sudo -n apt-get update -qq 2>/dev/null || true
        sudo -n apt-get install -y -qq \
          unzip build-essential pkg-config libssl-dev \
          clang gcc perl libzstd-dev zlib1g-dev libtss2-dev \
          cmake ninja-build binutils \
          2>/dev/null || true
        # Prefer clang (newer cc crate compatibility), fallback ke gcc kalau clang
        # tidak tersedia di runner (mis. self-hosted runner tanpa sudo password).
        if command -v clang >/dev/null 2>&1; then
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        elif command -v gcc >/dev/null 2>&1; then
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        else
          echo "::warning::Neither clang nor gcc found; cargo build mungkin fail untuk crate yang butuh C compiler."
        fi
        # pqcrypto-falcon dan beberapa crate C butuh `ar` (binutils).
        if ! command -v ar >/dev/null 2>&1; then
          echo "::warning::Binary 'ar' (binutils) tidak tersedia di runner. Cargo build crate native (pqcrypto-falcon, ring, dst) akan gagal. Self-hosted runner harus pre-install: \`sudo apt install binutils build-essential\` once."
        fi

    - name: Isolate CARGO_HOME and RUSTUP_HOME per-job
      shell: bash
      run: |
        # ROOT CAUSE FIX for the "rotted rustup" / "could not execute process
        # 'rustc -vV'" / "could not parse/generate dep info" cascade of failures.
        #
        # Self-hosted runners on this host all execute as the same Unix user
        # and therefore share $HOME — which means they share $HOME/.cargo and
        # $HOME/.rustup. When N parallel matrix jobs each call `rustup install`
        # (transitively, via dtolnay/rust-toolchain), they race-modify the
        # rustup binary that the symlinks in $HOME/.cargo/bin/ point at.
        # Mid-flight, those symlinks become dangling and `cargo --version`
        # starts erroring out, including in the user's interactive shell on
        # the same host (because $HOME is the same).
        #
        # The previous mitigation ("Heal rustup if shared $HOME rotted")
        # patched the symptom reactively. This step removes the cause: each
        # job gets its own CARGO_HOME and RUSTUP_HOME under runner.temp,
        # which is exclusive to the job and wiped at job start/end.
        #
        # Cost: the rust toolchain is installed fresh per job (~20-40s).
        # Mitigated by the Swatinem/rust-cache step below, which caches
        # CARGO_HOME (including the toolchain bin) keyed on Cargo.lock +
        # toolchain version.
        #
        # IMPORTANT: on self-hosted runners runner.temp is NOT reliably wiped
        # between jobs. A toolchain left here by a previous (broken-era) job —
        # e.g. one hand-extracted WITHOUT a rustup manifest — survives and makes
        # the next job's dtolnay step do "using existing install" → then fail
        # with `error: Missing manifest in toolchain 'stable-...'`. Wipe the
        # per-job rust home first so every job starts from a clean slate and
        # dtolnay always performs a complete (manifest-bearing) install.
        JOB_RUST_HOME="${{ runner.temp }}/rust"
        rm -rf "$JOB_RUST_HOME"
        mkdir -p "$JOB_RUST_HOME/cargo/bin" "$JOB_RUST_HOME/rustup"
        echo "CARGO_HOME=$JOB_RUST_HOME/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$JOB_RUST_HOME/rustup" >> "$GITHUB_ENV"
        echo "$JOB_RUST_HOME/cargo/bin" >> "$GITHUB_PATH"
        echo "::notice::Isolated Rust toolchain to $JOB_RUST_HOME (per-job, no shared \$HOME race)"

    - name: Ensure rustup binary is available (self-hosted resilience)
      shell: bash
      run: |
        # dtolnay/rust-toolchain (next step) shells out to `rustup` and does
        # NOT install it. On these self-hosted runners the shared-$HOME rustup
        # proxy has repeatedly gone missing (proxy replaced by direct symlinks
        # to a toolchain → `rustup` vanishes → EVERY Rust job fails at setup,
        # across all crates). Bootstrap rustup into the per-job CARGO_HOME when
        # it isn't on PATH, so CI never again depends on host rustup state.
        if command -v rustup >/dev/null 2>&1; then
          echo "rustup present: $(command -v rustup) ($(rustup --version 2>/dev/null | head -1))"
        else
          echo "::warning::rustup not found on PATH — bootstrapping into ${CARGO_HOME:-$HOME/.cargo}"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --default-toolchain none --profile minimal
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
        fi

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Install Protocol Buffers compiler
      shell: bash
      run: |
        if command -v protoc &> /dev/null; then
          INSTALLED=$(protoc --version | grep -oP '\d+\.\d+' || echo "0.0")
          if [[ "$INSTALLED" == "25.1" ]]; then
            echo "protoc 25.1 already installed, skipping"
            exit 0
          fi
        fi

        PROTOC_VERSION="25.1"
        PROTOC_ZIP="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
        curl -LsSf -o "$PROTOC_ZIP" \
          "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"

        rm -rf protoc
        python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1],'r').extractall('protoc')" "$PROTOC_ZIP"

        mkdir -p ${{ runner.temp }}/.local/bin ${{ runner.temp }}/.local/include
        cp -f protoc/bin/protoc ${{ runner.temp }}/.local/bin/
        cp -r protoc/include/* ${{ runner.temp }}/.local/include/ 2>/dev/null || true
        rm -rf protoc "$PROTOC_ZIP"

        chmod +x ${{ runner.temp }}/.local/bin/protoc
        echo "${{ runner.temp }}/.local/bin" >> $GITHUB_PATH
        echo "PROTOC_INCLUDE=${{ runner.temp }}/.local/include" >> $GITHUB_ENV

        ${{ runner.temp }}/.local/bin/protoc --version

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        workspaces: ". -> target"
        # cache-targets: false — JANGAN restore target/ dir antar runs.
        # target/ rebuild full per-job (~5-10 min) lebih reliable daripada
        # flaky stale .d files. CARGO_HOME yang sekarang per-job (di
        # runner.temp) tetap di-cache by Swatinem — toolchain + registry
        # restore tetap fast pada cache hit.
        cache-targets: false
