name: 'Setup Rust Environment'
description: 'Installs system dependencies, Rust toolchain, Protoc, and configures caching for SIMPEL CI/CD'

inputs:
  toolchain:
    description: 'Rust toolchain version'
    required: false
    default: 'stable'
  targets:
    description: 'Comma-separated list of targets to install'
    required: false
    default: ''
  components:
    description: 'Comma-separated list of components to install'
    required: false
    default: ''
  cache-key:
    description: 'Additional cache key suffix'
    required: false
    default: 'default'
  github-token:
    description: 'GitHub token for API requests'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Fix workspace permissions
      shell: bash
      run: |
        # Fix root-owned files from previous Docker builds on self-hosted runners
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine \
          chown -R $(id -u):$(id -g) . 2>/dev/null || true
        # Clean up stale build artifacts
        rm -rf ${{ github.workspace }}/protoc ${{ github.workspace }}/.build_config 2>/dev/null || true

    - name: Install system dependencies
      shell: bash
      run: |
        sudo -n apt-get update -qq 2>/dev/null || true
        sudo -n apt-get install -y -qq \
          unzip build-essential pkg-config libssl-dev \
          clang gcc perl libzstd-dev zlib1g-dev libtss2-dev \
          cmake ninja-build binutils \
          2>/dev/null || true
        # Prefer clang (newer cc crate compatibility), fallback ke gcc kalau clang
        # tidak tersedia di runner (mis. self-hosted runner tanpa sudo password).
        if command -v clang >/dev/null 2>&1; then
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        elif command -v gcc >/dev/null 2>&1; then
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        else
          echo "::warning::Neither clang nor gcc found; cargo build mungkin fail untuk crate yang butuh C compiler."
        fi
        # pqcrypto-falcon dan beberapa crate C butuh `ar` (binutils).
        # Warning saja kalau tidak ada — biar test/lint job lain yang
        # tidak butuh ar tetap bisa jalan, dan kita lihat clear di log
        # mana yang fail karena tooling absent.
        if ! command -v ar >/dev/null 2>&1; then
          echo "::warning::Binary 'ar' (binutils) tidak tersedia di runner. Cargo build crate native (pqcrypto-falcon, ring, dst) akan gagal. Self-hosted runner harus pre-install: \`sudo apt install binutils build-essential\` once."
        fi

    - name: Heal rustup if shared $HOME rotted
      shell: bash
      run: |
        # Multiple paralel jobs di host yang sama share ~/.cargo dan
        # ~/.rustup. Race condition / partial install dari job lain
        # bisa bikin `cargo`/`rustc` symlink di ~/.cargo/bin/ menunjuk
        # ke `rustup` yang sudah ke-hapus, dan cargo gagal dengan
        # `could not execute process 'rustc -vV' (never executed)`.
        # Detect kondisi ini dan reinstall rustup binary (idempotent;
        # menjaga toolchain yang sudah ada di ~/.rustup intact).
        if [ -L "$HOME/.cargo/bin/cargo" ] && [ ! -e "$HOME/.cargo/bin/cargo" ]; then
          echo "::warning::~/.cargo/bin/cargo symlink rotted (rustup binary missing); reinstalling rustup"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- --default-toolchain none -y --no-modify-path
        fi
        if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
          echo "::warning::cargo not executable; reinstalling rustup"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- --default-toolchain none -y --no-modify-path
        fi
        # Ensure PATH includes cargo bin for subsequent steps
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Install Protocol Buffers compiler
      shell: bash
      run: |
        if command -v protoc &> /dev/null; then
          INSTALLED=$(protoc --version | grep -oP '\d+\.\d+' || echo "0.0")
          if [[ "$INSTALLED" == "25.1" ]]; then
            echo "protoc 25.1 already installed, skipping"
            exit 0
          fi
        fi

        PROTOC_VERSION="25.1"
        PROTOC_ZIP="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
        curl -LsSf -o "$PROTOC_ZIP" \
          "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${PROTOC_ZIP}"

        rm -rf protoc
        python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1],'r').extractall('protoc')" "$PROTOC_ZIP"

        mkdir -p ${{ runner.temp }}/.local/bin ${{ runner.temp }}/.local/include
        cp -f protoc/bin/protoc ${{ runner.temp }}/.local/bin/
        cp -r protoc/include/* ${{ runner.temp }}/.local/include/ 2>/dev/null || true
        rm -rf protoc "$PROTOC_ZIP"

        chmod +x ${{ runner.temp }}/.local/bin/protoc
        echo "${{ runner.temp }}/.local/bin" >> $GITHUB_PATH
        echo "PROTOC_INCLUDE=${{ runner.temp }}/.local/include" >> $GITHUB_ENV

        ${{ runner.temp }}/.local/bin/protoc --version

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        workspaces: ". -> target"
