name: 'Setup Rust Environment'
description: 'Installs system dependencies, Rust toolchain, Protoc, and configures caching'

inputs:
  toolchain:
    description: 'Rust toolchain version'
    required: false
    default: '1.90.0'
  targets:
    description: 'Comma-separated list of targets to install'
    required: false
    default: ''
  components:
    description: 'Comma-separated list of components to install'
    required: false
    default: ''
  cache-key:
    description: 'Additional cache key'
    required: false
    default: 'default'
  github-token:
    description: 'GitHub token for API requests'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        if ! command -v unzip &> /dev/null || ! command -v pkg-config &> /dev/null || ! command -v cc &> /dev/null || ! command -v perl &> /dev/null; then
          echo "Missing dependencies. Attempting to install..."
          sudo -n apt-get update || true
          sudo -n apt-get install -y unzip build-essential pkg-config libssl-dev gcc perl || echo "Warning: Could not install dependencies with sudo"
        fi

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - name: Install Protocol Buffers compiler
      shell: bash
      run: |
        PROTOC_VERSION="25.1"
        PROTOC_ZIP="protoc-$PROTOC_VERSION-linux-x86_64.zip"
        curl -LO "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/$PROTOC_ZIP"

        # Extract using python3 (avoiding unzip dependency)
        python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1],'r').extractall('protoc')" "$PROTOC_ZIP"

        # Install to local bin
        mkdir -p $HOME/.local/bin
        mv protoc/bin/protoc $HOME/.local/bin/
        # Move include files if needed, but for rust normally protoc binary is enough or build script handles it?
        # Typically prost-build needs 'protoc' in PATH.
        chmod +x $HOME/.local/bin/protoc
        echo "$HOME/.local/bin" >> $GITHUB_PATH

        # Verify
        $HOME/.local/bin/protoc --version

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        # Shared cache for all members in the workspace
        workspaces: ". -> target"
