name: 'Setup Node Environment'
description: 'Installs Node.js, configures npm cache, and optionally runs npm ci for SIMPEL CI/CD'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '20'
  working-directory:
    description: 'Path containing package.json + package-lock.json'
    required: false
    default: '.'
  install:
    description: 'Run npm ci after setup'
    required: false
    default: 'true'
  cache-key-suffix:
    description: 'Additional cache key suffix to invalidate per-job'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Fix workspace permissions
      shell: bash
      run: |
        docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace alpine \
          chown -R $(id -u):$(id -g) . 2>/dev/null || true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          echo "::warning::No package-lock.json in ${{ inputs.working-directory }}, falling back to npm install"
          npm install --no-audit --no-fund
        fi
