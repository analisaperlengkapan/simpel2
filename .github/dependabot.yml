# SIMPEL Dependabot Configuration
# Automated dependency management for Rust monorepo
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # ─────────────────────────────────────────────────────
  # ROOT WORKSPACE — Cargo dependencies
  # Covers: layanan/*, antarmuka/*, lib/*
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    rebase-strategy: "auto"

    groups:
      # Async runtime & web framework
      tokio-axum:
        patterns:
          - "tokio*"
          - "tower*"
          - "axum*"
          - "hyper*"
          - "tonic*"
        update-types:
          - "minor"
          - "patch"

      # Leptos frontend framework
      leptos:
        patterns:
          - "leptos*"
          - "web-sys"
          - "wasm-bindgen*"
          - "js-sys"
          - "gloo*"
        update-types:
          - "minor"
          - "patch"

      # Database & storage
      database:
        patterns:
          - "tokio-postgres"
          - "deadpool*"
          - "refinery*"
          - "sea-query*"
          - "redis*"
        update-types:
          - "minor"
          - "patch"

      # Cryptography — patch only for stability
      crypto:
        patterns:
          - "blake3"
          - "sha2"
          - "sha3"
          - "ed25519*"
          - "x25519*"
          - "ring"
          - "rustls*"
          - "chacha20*"
          - "poly1305*"
          - "aes-gcm*"
          - "argon2*"
        update-types:
          - "patch"

      # Observability
      observability:
        patterns:
          - "tracing*"
          - "opentelemetry*"
          - "prometheus*"
          - "metrics*"
        update-types:
          - "minor"
          - "patch"

      # Serialization
      serde:
        patterns:
          - "serde*"
          - "bincode*"
          - "toml*"
          - "quick-xml"
          - "ciborium*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Major versions require manual review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    cooldown:
      default-days: 3
      semver-patch-days: 1

  # ─────────────────────────────────────────────────────
  # GITHUB ACTIONS — CI/CD workflow dependencies
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    commit-message:
      prefix: "ci"

    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "github/*"
          - "docker/*"
        update-types:
          - "minor"
          - "patch"

  # ─────────────────────────────────────────────────────
  # DOCKER — Container base images
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"

    groups:
      base-images:
        patterns:
          - "rust"
          - "debian"
          - "alpine"
          - "postgres"
          - "redis"
        update-types:
          - "minor"
          - "patch"

# ─────────────────────────────────────────────────────
# NOTES:
# - Security updates are raised immediately regardless of schedule
# - Crypto dependencies limited to patch updates for stability
# - Major version updates require manual review (ignored by default)
# - All Rust crates are managed via the root workspace Cargo.toml
# ─────────────────────────────────────────────────────
