# SIMPEL Dependabot Configuration
# Automated dependency management for Rust monorepo
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # ─────────────────────────────────────────────────────
  # ROOT WORKSPACE — Cargo dependencies
  # Covers: layanan/*, antarmuka/*, lib/*
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    rebase-strategy: "auto"

    groups:
      # Async runtime & web framework
      tokio-axum:
        patterns:
          - "tokio*"
          - "tower*"
          - "axum*"
          - "hyper*"
          - "tonic*"
        update-types:
          - "minor"
          - "patch"

      # Leptos frontend framework
      leptos:
        patterns:
          - "leptos*"
          - "web-sys"
          - "wasm-bindgen*"
          - "js-sys"
          - "gloo*"
        update-types:
          - "minor"
          - "patch"

      # Database & storage
      database:
        patterns:
          - "tokio-postgres"
          - "deadpool*"
          - "refinery*"
          - "sea-query*"
          - "redis*"
        update-types:
          - "minor"
          - "patch"

      # Cryptography — patch only for stability
      crypto:
        patterns:
          - "blake3"
          - "sha2"
          - "sha3"
          - "ed25519*"
          - "x25519*"
          - "ring"
          - "rustls*"
          - "chacha20*"
          - "poly1305*"
          - "aes-gcm*"
          - "argon2*"
        update-types:
          - "patch"

      # Observability
      observability:
        patterns:
          - "tracing*"
          - "opentelemetry*"
          - "prometheus*"
          - "metrics*"
        update-types:
          - "minor"
          - "patch"

      # Serialization
      serde:
        patterns:
          - "serde*"
          - "bincode*"
          - "toml*"
          - "quick-xml"
          - "ciborium*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Major versions require manual review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    cooldown:
      default-days: 3
      semver-patch-days: 1

  # ─────────────────────────────────────────────────────
  # GITHUB ACTIONS — CI/CD workflow dependencies
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    commit-message:
      prefix: "ci"

    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "github/*"
          - "docker/*"
        update-types:
          - "minor"
          - "patch"

  # ─────────────────────────────────────────────────────
  # DOCKER — Container base images
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    # scan all Dockerfiles in the repo, not just the root
    directories:
      - "/"
      - "/antarmuka/*"
      - "/layanan/*"
      - "/infra/*"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"

    groups:
      base-images:
        patterns:
          - "rust"
          - "debian"
          - "alpine"
          - "postgres"
          - "redis"
          - "php"
          - "nginx"
          - "node"
        update-types:
          - "minor"
          - "patch"


  # ─────────────────────────────────────────────────────
  # NPM — Monolith Laravel assets (Vite)
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/monolith/simpelv1"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "02:30"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "lang:javascript"
      - "monolith:assets"
    commit-message:
      prefix: "monolith(deps)"
    groups:
      vite-build:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "laravel-vite-plugin"
        update-types:
          - "minor"
          - "patch"
      prettier:
        patterns:
          - "prettier*"
          - "@shufo/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─────────────────────────────────────────────────────
  # NPM — UI library (Tailwind, dst.)
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/lib/ui"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "03:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "lang:javascript"
      - "lib:ui"
    commit-message:
      prefix: "ui(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─────────────────────────────────────────────────────
  # COMPOSER — Monolith Laravel
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "composer"
    directory: "/monolith/simpelv1"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "lang:php"
      - "monolith"
    commit-message:
      prefix: "monolith(deps)"
    groups:
      laravel:
        patterns:
          - "laravel/*"
          - "illuminate/*"
        update-types:
          - "minor"
          - "patch"
      auth:
        patterns:
          - "tymon/*"
          - "pragmarx/*"
        update-types:
          - "patch"
      documents:
        patterns:
          - "phpoffice/*"
          - "maatwebsite/*"
          - "carlos-meneses/*"
          - "bacon/*"
          - "endroid/*"
          - "simplesoftwareio/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

# ─────────────────────────────────────────────────────
# NOTES:
# - Security updates are raised immediately regardless of schedule
# - Crypto dependencies limited to patch updates for stability
# - Major version updates require manual review (ignored by default)
# - Schedule disebar per hari: Sen=cargo, Sel=actions, Rab=docker, Kam=npm, Jum=composer
# - Auto-merge minor/patch (kecuali crypto) ditangani oleh labeler.yml::dependabot-auto-merge
# ─────────────────────────────────────────────────────
