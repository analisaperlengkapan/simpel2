# SIMPEL Dependabot Configuration
# Automated dependency management for Rust monorepo
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # ─────────────────────────────────────────────────────
  # ROOT WORKSPACE — Cargo dependencies
  # Covers: layanan/*, antarmuka/*, lib/*
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "rust"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    rebase-strategy: "auto"

    groups:
      # Async runtime & web framework
      tokio-axum:
        patterns:
          - "tokio*"
          - "tower*"
          - "axum*"
          - "hyper*"
          - "tonic*"
        update-types:
          - "minor"
          - "patch"

      # Leptos frontend framework
      leptos:
        patterns:
          - "leptos*"
          - "web-sys"
          - "wasm-bindgen*"
          - "js-sys"
          - "gloo*"
        update-types:
          - "minor"
          - "patch"

      # Database & storage
      database:
        patterns:
          - "tokio-postgres"
          - "deadpool*"
          - "refinery*"
          - "sea-query*"
          - "redis*"
        update-types:
          - "minor"
          - "patch"

      # Cryptography — patch only for stability
      crypto:
        patterns:
          - "blake3"
          - "sha2"
          - "sha3"
          - "ed25519*"
          - "x25519*"
          - "ring"
          - "rustls*"
          - "chacha20*"
          - "poly1305*"
          - "aes-gcm*"
          - "argon2*"
        update-types:
          - "patch"

      # Observability
      observability:
        patterns:
          - "tracing*"
          - "opentelemetry*"
          - "prometheus*"
          - "metrics*"
        update-types:
          - "minor"
          - "patch"

      # Serialization
      serde:
        patterns:
          - "serde*"
          - "bincode*"
          - "toml*"
          - "quick-xml"
          - "ciborium*"
        update-types:
          - "minor"
          - "patch"

      # Everything else, in ONE pull request. Before this group, each crate that
      # matched none of the groups above (zstd, mime, flate2, prost, rpassword,
      # printpdf, ...) got a PR of its own, and every PR runs the full CI: eight
      # bot PRs in three days kept the runners saturated for everyone else.
      # `exclude-patterns` keeps the crypto crates out: the `crypto` group above
      # takes only patch bumps, and their minor bumps must stay individual PRs
      # that a person looks at, not ride along in a batch that auto-merges.
      rust-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "blake3"
          - "sha2"
          - "sha3"
          - "ed25519*"
          - "x25519*"
          - "ring"
          - "rustls*"
          - "chacha20*"
          - "poly1305*"
          - "aes-gcm*"
          - "argon2*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Major versions require manual review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    cooldown:
      default-days: 3
      semver-patch-days: 1

  # ─────────────────────────────────────────────────────
  # GITHUB ACTIONS — CI/CD workflow dependencies
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "02:30"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    commit-message:
      prefix: "ci"

    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "github/*"
          - "docker/*"
        update-types:
          - "minor"
          - "patch"

  # ─────────────────────────────────────────────────────
  # DOCKER — Container base images
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    # scan all Dockerfiles in the repo, not just the root
    directories:
      - "/"
      - "/antarmuka/*"
      - "/layanan/*"
      - "/infra/*"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      # Conventional-Commits: type harus dari daftar di labeler.yml
      # (`deps`), area jadi scope (`infra`). "docker" bukan type yang sah.
      prefix: "deps(infra)"

    groups:
      base-images:
        patterns:
          - "rust"
          - "debian"
          - "alpine"
          - "postgres"
          - "redis"
          - "nginx"
          - "node"
        update-types:
          - "minor"
          - "patch"


  # ─────────────────────────────────────────────────────
  # NPM — UI library (Tailwind, dst.)
  # ─────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/lib/ui"
    schedule:
      interval: "monthly"
      time: "03:30"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "lang:javascript"
      - "lib:ui"
    commit-message:
      prefix: "deps(ui)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

# ─────────────────────────────────────────────────────
# NOTES:
# - Security updates are raised immediately regardless of schedule
# - Crypto dependencies limited to patch updates for stability
# - Major version updates require manual review (ignored by default)
# - Cadence is MONTHLY and grouped (was weekly, one PR per ungrouped crate): every
#   PR runs the full CI on a runner pool shared with people's own PRs, so the
#   number of bot PRs is a direct cost on everyone's time-to-merge. Security
#   updates are not affected by the schedule. The four ecosystems are staggered
#   by 30 minutes on the 1st.
# - Auto-merge minor/patch (kecuali crypto) ditangani oleh labeler.yml::dependabot-auto-merge
# ─────────────────────────────────────────────────────
