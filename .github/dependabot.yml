# SIMPEL Dependabot Configuration
# Automated dependency management for Rust monorepo with microfrontend + microservices architecture
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ============================================================
  # MAIN WORKSPACE - Root Cargo.toml (layanan/, antarmuka/, lib/)
  # ============================================================
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
      - "automated"
    commit-message:
      prefix: "deps"
      include: "scope"
    rebase-strategy: "auto"

    groups:
      # Async runtime & web framework stack
      tokio-axum-stack:
        patterns:
          - "tokio*"
          - "tower*"
          - "axum*"
          - "hyper*"
          - "h2"
          - "tonic*"
        update-types:
          - "minor"
          - "patch"

      # Leptos frontend framework
      leptos-stack:
        patterns:
          - "leptos*"
          - "web-sys"
          - "wasm-bindgen*"
          - "js-sys"
          - "gloo*"
        update-types:
          - "minor"
          - "patch"

      # Database & storage
      database-stack:
        patterns:
          - "tokio-postgres"
          - "deadpool*"
          - "refinery*"
          - "sea-query*"
          - "redis*"
        update-types:
          - "minor"
          - "patch"

      # Cryptography (security-critical, patch only)
      crypto-stack:
        patterns:
          - "blake3"
          - "sha2"
          - "sha3"
          - "ed25519*"
          - "x25519*"
          - "ring"
          - "rustls*"
          - "chacha20*"
          - "poly1305*"
          - "aes-gcm*"
        update-types:
          - "patch"

      # Observability & tracing
      observability-stack:
        patterns:
          - "tracing*"
          - "opentelemetry*"
          - "prometheus*"
          - "metrics*"
        update-types:
          - "minor"
          - "patch"

      # Serialization
      serde-stack:
        patterns:
          - "serde*"
          - "bincode*"
          - "toml*"
          - "quick-xml"
          - "ciborium*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Major versions require manual review for breaking changes
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    # Cooldown to reduce noise from rapid releases
    cooldown:
      default-days: 3
      semver-patch-days: 1

  # ============================================================
  # SECRETON WORKSPACE - Secrets Management (infra/secreton/)
  # Separate Cargo workspace - security-critical component
  # ============================================================
  - package-ecosystem: "cargo"
    directory: "/infra/secreton"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "secreton"
      - "security"
      - "infra"
    commit-message:
      prefix: "deps(secreton)"

    groups:
      # Vault cryptography (patch only for security)
      vault-crypto:
        patterns:
          - "*chacha*"
          - "*poly1305*"
          - "aes-gcm*"
          - "curve25519*"
          - "x25519*"
          - "argon2*"
          - "scrypt*"
        update-types:
          - "patch"

      # Raft & storage
      storage-stack:
        patterns:
          - "raft*"
          - "sled*"
          - "rocksdb*"
        update-types:
          - "patch"

    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # AUTHENC WORKSPACE - Identity Provider (infra/authenc/)
  # Separate Cargo workspace - authentication & authorization
  # ============================================================
  - package-ecosystem: "cargo"
    directory: "/infra/authenc"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "authenc"
      - "security"
      - "infra"
    commit-message:
      prefix: "deps(authenc)"

    groups:
      # Authentication cryptography
      auth-crypto:
        patterns:
          - "ed25519*"
          - "x25519*"
          - "argon2*"
          - "jsonwebtoken"
          - "bcrypt"
          - "totp*"
          - "p256"
          - "p384"
          - "p521"
          - "ecdsa*"
        update-types:
          - "patch"

      # OAuth & OIDC
      oauth-stack:
        patterns:
          - "oauth2*"
          - "openidconnect*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # GITHUB ACTIONS - CI/CD workflows
  # ============================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    commit-message:
      prefix: "ci"

    groups:
      # Core GitHub Actions
      github-actions:
        patterns:
          - "actions/*"
          - "github/*"
        update-types:
          - "minor"
          - "patch"

  # ============================================================
  # DOCKER - Container images
  # ============================================================
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/antarmuka/*"
      - "/layanan/*"
      - "/infra/*"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "02:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "container"
    commit-message:
      prefix: "docker"

    groups:
      base-images:
        patterns:
          - "rust"
          - "debian"
          - "alpine"
          - "postgres"
          - "redis"
        update-types:
          - "minor"
          - "patch"
# ============================================================
# NOTES:
# - Security updates are handled immediately regardless of schedule
# - Dependabot will create PRs for vulnerabilities as soon as discovered
# - Use `cargo deny` for additional license and ban checks
# - Crypto dependencies limited to patch updates for stability
# ============================================================
