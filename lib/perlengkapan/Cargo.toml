[package]
name = "lib-perlengkapan"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Shared library for Perlengkapan domain - models, types, and validation for both backend and frontend"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json", "chrono/serde", "uuid/serde"]
frontend = []
wasm = ["dep:wasm-bindgen", "uuid/js"]

[dependencies]
# Core types
uuid = { workspace = true }
chrono = { workspace = true }

# Serialization (optional, enabled by default)
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Validation
validator = { workspace = true }
thiserror = { workspace = true }

# WASM support
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
