[package]
name = "lib-common"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true }
dashmap = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }

# Optional dependencies - backend only (not for WASM)
tokio = { version = "1.47.1", features = ["sync", "macros", "rt", "time"], optional = true }
ipnetwork = { version = "0.20", default-features = false, optional = true }
redis = { workspace = true, optional = true }
garde = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
pin-project = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

# Crypto dependencies
curve25519-dalek = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
bcrypt = { workspace = true, optional = true }

# Encryption dependencies
aes-gcm = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
pbkdf2 = { workspace = true, optional = true }

# gRPC dependencies
tonic = { workspace = true, optional = true }

# AWS S3 dependencies
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }

[features]
default = []
integration-tests = []
# Backend features - requires tokio runtime (not for WASM)
backend = ["dep:tokio", "dep:ipnetwork"]
redis-cache = ["backend", "dep:redis"]
validation = ["dep:garde"]
axum = ["backend", "dep:axum", "dep:tower", "dep:tower-http", "dep:http", "dep:http-body", "dep:http-body-util", "dep:pin-project", "dep:futures-util", "dep:bytes"]
telemetry = ["backend", "dep:tracing-subscriber"]
db = ["backend", "dep:tokio-postgres", "dep:deadpool-postgres"]
jwt = ["backend", "dep:jsonwebtoken"]
crypto = ["dep:curve25519-dalek", "dep:sha2", "dep:subtle", "dep:rand", "dep:argon2", "dep:bcrypt"]
vss = ["crypto"]
encryption = ["crypto", "dep:aes-gcm", "dep:chacha20poly1305", "dep:hkdf", "dep:pbkdf2"]
grpc = ["backend", "dep:tonic"]
storage = ["backend", "crypto", "dep:aws-config", "dep:aws-sdk-s3"]
# Full backend feature set
full-backend = ["backend", "jwt", "axum", "db", "telemetry", "validation", "redis-cache", "grpc", "storage"]
