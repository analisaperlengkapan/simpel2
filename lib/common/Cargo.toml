[package]
name = "lib-common"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
ipnetwork = { version = "0.20", default-features = false }
url = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
redis = { workspace = true, optional = true }
garde = { workspace = true, optional = true }
tracing = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4", "serde"] }
axum = { workspace = true, optional = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
dashmap = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
pin-project = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

# Crypto dependencies
curve25519-dalek = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }

# Encryption dependencies
aes-gcm = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
pbkdf2 = { workspace = true, optional = true }

# gRPC dependencies
tonic = { workspace = true, optional = true }

[features]
default = []
redis-cache = ["dep:redis"]
validation = ["dep:garde"]
axum = ["dep:axum", "dep:tower", "dep:tower-http", "dep:http", "dep:http-body", "dep:http-body-util", "dep:pin-project", "dep:futures-util"]
telemetry = ["dep:tracing-subscriber"]
db = ["dep:tokio-postgres", "dep:deadpool-postgres"]
crypto = ["dep:curve25519-dalek", "dep:sha2", "dep:subtle", "dep:rand", "dep:argon2"]
vss = ["crypto"]
encryption = ["crypto", "dep:aes-gcm", "dep:chacha20poly1305", "dep:hkdf", "dep:pbkdf2"]
grpc = ["dep:tonic"]

