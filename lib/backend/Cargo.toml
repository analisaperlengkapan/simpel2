[package]
name = "lib-backend"
publish = false
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Backend infrastructure utilities for SIMPEL services (DB, cache, middleware, gRPC)"

[dependencies]
lib-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
dashmap = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
hex = { workspace = true }
async-trait = { workspace = true }

# Backend runtime
tokio = { workspace = true }
ipnetwork = { workspace = true }

# Optional backend dependencies
dotenvy = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "json",
], optional = true }
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
pin-project = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

# gRPC dependencies
tonic = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }

# AWS S3 dependencies
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = []
redis-cache = ["dep:redis"]
env-config = ["dep:dotenvy"]
axum = [
  "dep:axum",
  "dep:tower",
  "dep:tower-http",
  "dep:http",
  "dep:http-body",
  "dep:http-body-util",
  "dep:pin-project",
  "dep:futures-util",
  "dep:bytes",
]
telemetry = ["dep:tracing-subscriber"]
db = ["dep:tokio-postgres", "dep:deadpool-postgres"]
jwt = ["dep:jsonwebtoken"]
grpc = ["dep:tonic", "dep:rustls", "dep:rustls-pemfile"]
storage = ["dep:aws-config", "dep:aws-sdk-s3", "dep:sha2"]
# Full backend feature set
full-backend = [
  "jwt",
  "axum",
  "db",
  "telemetry",
  "redis-cache",
  "grpc",
  "storage",
  "env-config",
]

[dev-dependencies]
# grpc::client handshake test (tests/grpc_client_mtls.rs): certificates are minted
# at runtime — a checked-in cert expires one day and turns a security test into a
# flake that someone deletes.
rcgen = { workspace = true }
# `ring` ON TOP of the default aws_lc_rs: the same two-provider graph the shipped binaries
# have (lettre enables it). With it, rustls cannot choose a provider on its own, so any TLS
# config built without grpc::ensure_crypto_provider() panics here as it did in staging.
rustls = { workspace = true, features = ["ring"] }
tempfile = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
tonic-prost = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "net",
  "time",
] }
