[package]
name = "lib-crypto"
version = "0.1.0"
edition = "2024"
authors = ["SIMPelv2 Team"]
license = "Apache-2.0"
description = "Cryptographic primitives and quantum-safe algorithms for SIMPelv2 using Ed25519 for signatures"
keywords = ["cryptography", "quantum-safe", "post-quantum"]

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true

# Cryptographic dependencies - RustCrypto suite
ring.workspace = true
aes.workspace = true
aes-gcm.workspace = true
chacha20poly1305.workspace = true
cbc.workspace = true
argon2.workspace = true
sha2.workspace = true
sha3.workspace = true
blake3.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
hkdf.workspace = true
scrypt.workspace = true
hex.workspace = true
base64.workspace = true
rand = { version = "0.8.5", features = [
  "std",
  "std_rng",
] } # Fixed to 0.8.5 for ed25519_dalek compatibility (rand_core 0.6)
regex.workspace = true

# Base64 encoding (constant-time)
base64ct.workspace = true

# Lazy static initialization
once_cell.workspace = true

# Elliptic curve cryptography
p256.workspace = true
p384.workspace = true
p521.workspace = true
k256.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
curve25519-dalek.workspace = true
ecdsa.workspace = true

# Web framework (for mTLS middleware)
axum.workspace = true

# Cryptographic traits and utilities
digest.workspace = true
signature.workspace = true
elliptic-curve.workspace = true
generic-array.workspace = true
subtle.workspace = true
zeroize.workspace = true

# Post-Quantum Cryptography
pqcrypto-mldsa.workspace = true
pqcrypto-mlkem.workspace = true
pqcrypto-falcon.workspace = true
pqcrypto-traits.workspace = true

# Shamir Secret Sharing
num-bigint.workspace = true
num-traits.workspace = true

# Async utilities
async-trait.workspace = true

# Compression
flate2.workspace = true

# Format-Preserving Encryption
fpe.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
