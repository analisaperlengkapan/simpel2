[package]
name = "lib-crypto"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Cryptographic primitives for SIMPEL (Shamir, password hashing, AES-GCM, KDF)"

[dependencies]
lib-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }
rand = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }

# Crypto dependencies
curve25519-dalek = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
argon2 = { workspace = true }
bcrypt = { workspace = true }

# Encryption dependencies (optional)
aes-gcm = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
pbkdf2 = { workspace = true, optional = true }

[features]
default = []
encryption = ["dep:aes-gcm", "dep:chacha20poly1305", "dep:hkdf", "dep:pbkdf2"]
# Verifiable Secret Sharing (Feldman commitments) — referenced di shamir.rs.
# Saat ini placeholder; aktifkan saat impl siap & deps tambahan dimasukkan.
vss = []
