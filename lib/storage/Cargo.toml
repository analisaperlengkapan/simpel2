[package]
name = "lib-storage"
version = "0.1.0"
edition = "2024"
authors = ["SIMPelv2 Team"]
license = "Apache-2.0"
description = "Secure storage backend for SIMPelv2 platform"
keywords = ["storage", "database", "vault", "security"]

[dependencies]
# Internal crates
lib-types = { path = "../types" }

# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true

# Database backends (optional - not recommended for HA)
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }

# HTTP client for Consul and cloud backends
reqwest = { workspace = true, optional = true }
base64.workspace = true

# Cryptography
lib-crypto = { path = "../crypto" }
zeroize.workspace = true

# Metrics (optional, used when the `metrics` feature is enabled)
metrics = { workspace = true, optional = true }

# OpenRaft consensus (modern alternative to raft)
openraft = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
slog = { workspace = true, optional = true }
slog-term = { workspace = true, optional = true }
slog-async = { workspace = true, optional = true }
bincode.workspace = true

[features]
# Default: File-based storage (no external dependencies)
default = ["file"]

# Backend features (HashiCorp Vault-compatible)
file = []
consul = ["reqwest"]
raft-consensus = ["openraft", "tonic", "prost", "slog", "slog-term", "slog-async"]
s3 = ["reqwest"]
postgres = [
    "tokio-postgres",
    "deadpool-postgres",
    "tokio-postgres-rustls",
    "rustls",
    "rustls-native-certs",
]

# Convenience features
all-backends = ["file", "consul", "raft-consensus", "s3", "postgres"]
ha-backends = ["consul", "raft-consensus"]
cloud-backends = ["s3"]

# Optional/test features
metrics = ["dep:metrics"]

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
