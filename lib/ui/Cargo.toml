[package]
name = "lib-ui"
version.workspace = true
edition.workspace = true
rust-version = "1.90"
authors = ["Tim Pengembang SIMPEL <dev@kejaksaan.go.id>"]
description = "Clean, focused, production-ready component library untuk Kejaksaan RI"
license = "MIT"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ssr = []
hydrate = []

[dependencies]
# Core Leptos
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }

# Leptos ecosystem (Phase 1 foundation)
leptos-use = { workspace = true }
codee = { workspace = true }
phosphor-leptos = { workspace = true }
floating-ui-leptos = { workspace = true }
leptos-struct-table = { workspace = true, features = ["chrono", "uuid"] }
leptos-chartistry = { workspace = true }
leptos-node-ref = "0.2"
# leptos_animate 0.1.x requires `--cfg=web_sys_unstable_apis` to compile,
# which is invasive at the workspace level. Defer until 0.2+ stabilizes
# the API or until we're willing to set the unstable flag.

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"

# Date/Time
chrono = { workspace = true, features = ["serde", "wasm-bindgen"] }

# Validation
regex = { workspace = true }

# Web APIs
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }

# Utilities
gloo = { workspace = true, features = ["timers", "net", "storage"] }
gloo-timers = { workspace = true }
gloo-storage = { workspace = true }
send_wrapper = "0.6"
urlencoding = "2.1"
uuid = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
getrandom = { workspace = true }
# Enable wasm_js for getrandom 0.4 pulled transitively by updated deps (e.g. uuid 1.23+)
getrandom_04 = { workspace = true }
lib-core = { workspace = true, features = ["validation"] }
lib-crypto = { workspace = true }

[build-dependencies]
# Build-time optimizations
cfg_aliases = "0.2"

# Dev dependencies untuk testing dan development
[dev-dependencies]
wasm-bindgen-test = { workspace = true }
console_error_panic_hook = { workspace = true }
tokio-test = { workspace = true }
tokio = { version = "1.47.1", features = ["sync", "macros", "rt"] }
