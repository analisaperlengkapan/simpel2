[package]
name = "lib-ui"
version.workspace = true
edition.workspace = true
rust-version = "1.90"
authors = ["Tim Pengembang SIMPEL <dev@kejaksaan.go.id>"]
description = "Clean, focused, production-ready component library untuk Kejaksaan RI"
license = "MIT"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ssr = []
hydrate = []

[dependencies]
# Core Leptos
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"

# Date/Time
chrono = { workspace = true, features = ["serde", "wasm-bindgen"] }

# Validation
regex = { workspace = true }

# Web APIs
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }

# Utilities
gloo = { workspace = true, features = ["timers", "net", "storage"] }
gloo-timers = { workspace = true }
gloo-storage = { workspace = true }
send_wrapper = "0.6"
urlencoding = "2.1"
uuid = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
getrandom = { workspace = true }
# Enable wasm_js for getrandom 0.4 pulled transitively by updated deps (e.g. uuid 1.23+)
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
lib-common = { path = "../common", default-features = false, features = ["validation", "crypto"] }

[build-dependencies]
# Build-time optimizations
cfg_aliases = "0.2"

# Dev dependencies untuk testing dan development
[dev-dependencies]
wasm-bindgen-test = { workspace = true }
console_error_panic_hook = { workspace = true }
tokio-test = { workspace = true }
tokio = { version = "1.47.1", features = ["sync", "macros", "rt"] }
