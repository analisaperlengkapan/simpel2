[build]
target = "index.html"
dist = "dist"
release = true
wasm-opt = false  # Disable wasm-opt to avoid optimization errors

# Advanced wasm-bindgen configuration
[build.wasm-bindgen]
target = "web"
typescript = false         # Disable TS generation for smaller bundles
debug = false             # No debug in production

[build.rust]
optimization-level = "z"   # Maximum size optimization
debug = false
lto = true

[serve]
port = 8090
addresses = ["0.0.0.0"]
open = false

[watch]
watch = ["src", "styles"]
ignore = ["target", "dist", "Cargo.lock", ".git"]
debounce = 100

[watch]
watch = ["src", "styles"]
ignore = ["target", "dist", "Cargo.lock", ".git"]
debounce = 100
