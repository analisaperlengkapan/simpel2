[package]
name = "keuangan-microfrontend"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
shared-microfrontend = { path = "../../shared", features = ["default", "optimized-components"] }
serde = { workspace = true }
serde_json = "1.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "HtmlInputElement",
    "Window",
    "History",
    "Storage",
    "Document",
    "Element",
    "HtmlElement",
    "Location"
] }
js-sys = "0.3"
gloo-utils = "0.2"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.8", features = ["js"] }
url = "2.5"
gloo = { version = "0.10", features = ["futures"] }

[lib]
crate-type = ["cdylib", "rlib"]
name = "keuangan_microfrontend"

[[bin]]
name = "keuangan-microfrontend"
path = "src/main.rs"
