[build]
target = "index.html"
dist = "dist"

# Optimization configuration for WASM
# Enable bulk-memory and nontrapping-float-to-int to support optimized instructions
[[build.wasm_opt]]
args = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-extension",
    "--strip-debug",
]

[[build.wasm-bindgen]]
target = "web"

[build.rust]
optimization-level = "s"
lto = true

[serve]
port = 8085
open = false

[watch]
watch = ["src", "styles"]
ignore = ["target", "dist"]
