[package]
name = "perencanaan-microfrontend"
version.workspace = true
edition.workspace = true
authors = ["SIMPelv2 Team <simpelv2@kejaksaan.go.id>"]
description = "SIMPelv2 Perencanaan - Strategic Planning & Asset Procurement System"
license = "MIT"
repository = "https://gitlab.com/analisiskebutuhan/simpelv2_web"
keywords = ["leptos", "wasm", "kejaksaan", "planning", "procurement"]
categories = ["wasm", "web-programming"]

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos = { workspace = true, features = ["csr", "hydrate"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
shared-microfrontend = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }
gloo = { workspace = true, features = ["futures", "timers", "events"] }
gloo-timers = { workspace = true, features = ["futures"] }
gloo-utils = { workspace = true }
gloo-net = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }
uuid = { workspace = true, features = ["v4", "js", "fast-rng", "serde"] }
url = { workspace = true }
chrono = { workspace = true, features = ["serde", "wasmbind"] }

[features]
default = ["csr"]
csr = ["leptos/csr"]
hydrate = ["leptos/hydrate"]
