[build]
target = "index.html"
dist = "dist"
release = true

# Optimization configuration for WASM
# Enable bulk-memory and nontrapping-float-to-int to support optimized instructions
[[build.wasm_opt]]
args = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-extension",
    "--strip-debug",
]

# Simplified wasm-bindgen configuration for development
[[build.wasm-bindgen]]
target = "web"
typescript = false
debug = false

[build.rust]
optimization-level = "s"   # Smaller optimization for development
debug = false
lto = false

[serve]
port = 8093
addresses = ["0.0.0.0"]
open = false
no_autoreload = true

[build.public-assets]
sources = ["styles/*.css", "../../shared/styles/*.css"]
output-dir = "assets"
