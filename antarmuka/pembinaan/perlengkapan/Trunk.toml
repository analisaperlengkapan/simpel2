[build]
target = "index.html"
dist = "dist"
release = false

# Disable wasm-opt for now to avoid validation errors
# Will re-enable after basic functionality is confirmed
# [[build.wasm_opt]]
# args = [
#     "-Oz",
#     "--enable-bulk-memory",
#     "--strip-debug",
#     "--dce",
#     "--vacuum",
# ]

# Simplified wasm-bindgen configuration for development
[[build.wasm-bindgen]]
target = "web"
typescript = false
debug = false

[build.rust]
optimization-level = "s"   # Smaller optimization for development
debug = false
lto = false

[serve]
# Align with expected access at http://127.0.0.1:8080/
port = 8080
addresses = ["0.0.0.0"]
open = false

[watch]
watch = ["src"]
debounce = 100
