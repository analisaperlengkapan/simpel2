<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perlengkapan - SIMPelv2</title>
    <!-- Tailwind CSS -->
    <!-- SIMPelv2 Design System -->
    <link rel="stylesheet" href="/assets/main.css">
    <!-- Legacy Support -->
    <link rel="stylesheet" href="/assets/legacy.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Trunk WASM configuration -->
    <link data-trunk rel="rust" data-bin="perlengkapan-microfrontend" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory" />
</head>

<body>
    <div id="app">
        <!-- Fallback content while WASM loads -->
        <div
            class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 via-blue-800 to-blue-700">
            <div class="bg-white p-12 rounded-2xl shadow-2xl w-96 text-center">
                <div class="mb-8">
                    <div
                        class="w-24 h-24 bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
                        <i class="fas fa-balance-scale text-4xl text-white"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">SIMPEL</h1>
                    <p class="text-lg text-gray-700 font-medium mb-1">KEJAKSAAN RI</p>
                    <p class="text-gray-600">Sistem Informasi Manajemen Perlengkapan</p>
                </div>
                <div class="text-center">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-4"></div>
                    <p class="text-sm text-gray-500">Memuat aplikasi...</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
