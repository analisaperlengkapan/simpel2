<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perlengkapan - SIMPelv2</title>

    <!-- Tailwind CSS CDN (for quick setup) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Custom CSS for animations and utilities -->
    <link data-trunk rel="css" href="styles/custom.css">

    <!-- Trunk WASM configuration - lib only, no binary -->
    <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- SEO & Meta Tags -->
    <meta name="description" content="Sistem Informasi Manajemen Perlengkapan Kejaksaan Republik Indonesia - Platform terintegrasi untuk pengelolaan aset dan BMN">
    <meta name="keywords" content="SIMPEL, Kejaksaan, Perlengkapan, BMN, Aset, Pengadaan">
    <meta name="author" content="Kejaksaan RI">
    <meta name="robots" content="noindex, nofollow">

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
</head>

<body>
    <div id="app">
        <!-- Fallback content while WASM loads -->
        <div
            class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 via-blue-800 to-blue-700">
            <div class="bg-white p-12 rounded-2xl shadow-2xl w-96 text-center">
                <div class="mb-8">
                    <div
                        class="w-24 h-24 bg-gradient-to-br from-yellow-400 to-yellow-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
                        <i class="fas fa-balance-scale text-4xl text-white"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">SIMPEL</h1>
                    <p class="text-lg text-gray-700 font-medium mb-1">KEJAKSAAN RI</p>
                    <p class="text-gray-600">Sistem Informasi Manajemen Perlengkapan</p>
                </div>
                <div class="text-center">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-4"></div>
                    <p class="text-sm text-gray-500">Memuat aplikasi...</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
