stages:
- build
- test
- deploy
variables:
  SERVICE_NAME: perlengkapan
  SERVICE_TYPE: frontend
  BASE_DIR: /var/www/simpelv2
default:
  image: node:18-alpine
  before_script:
  - apk add --no-cache git make
  - npm install -g npm@latest
build:perlengkapan:
  stage: build
  script:
  - "echo \"\U0001F528 Building perlengkapan...\""
  - docker build -t perlengkapan:$CI_COMMIT_SHA .
  - docker tag perlengkapan:$CI_COMMIT_SHA perlengkapan:latest
  artifacts:
    paths:
    - dist/perlengkapan/
    expire_in: 1 week
test:perlengkapan:
  stage: test
  script:
  - "echo \"\U0001F9EA Testing perlengkapan...\""
  - make test-perlengkapan
  allow_failure: true
deploy:perlengkapan:
  stage: deploy
  script:
  - "echo \"\U0001F680 Deploying perlengkapan...\""
  - make deploy-perlengkapan
  environment:
    name: perlengkapan-dev
    url: https://perlengkapan.dev.simpelv2.local
  when: manual
