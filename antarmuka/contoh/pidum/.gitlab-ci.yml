stages:
- build
- test
- deploy
variables:
  SERVICE_NAME: pidum
  SERVICE_TYPE: frontend
  BASE_DIR: /var/www/simpelv2
default:
  image: node:18-alpine
  before_script:
  - apk add --no-cache git make
  - npm install -g npm@latest
build:pidum:
  stage: build
  script:
  - "echo \"\U0001F528 Building pidum...\""
  - docker build -t pidum:$CI_COMMIT_SHA .
  - docker tag pidum:$CI_COMMIT_SHA pidum:latest
  artifacts:
    paths:
    - dist/pidum/
    expire_in: 1 week
test:pidum:
  stage: test
  script:
  - "echo \"\U0001F9EA Testing pidum...\""
  - make test-pidum
  allow_failure: true
deploy:pidum:
  stage: deploy
  script:
  - "echo \"\U0001F680 Deploying pidum...\""
  - make deploy-pidum
  environment:
    name: pidum-dev
    url: https://pidum.dev.simpelv2.local
  when: manual
