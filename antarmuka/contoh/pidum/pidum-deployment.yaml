apiVersion: v1
kind: ConfigMap
metadata:
  name: pidum-config
  namespace: simpelv2
data:
  index.html: |
    
  pidum-microfrontend.js: |
    bGV0IHdhc207Cgpjb25zdCBoZWFwID0gbmV3IEFycmF5KDEyOCkuZm
    
---
apiVersion: v1
kind: Service
metadata:
  name: pidum
  namespace: simpelv2
spec:
  ports:
  - name: port-0
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: pidum
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pidum-deployment
  namespace: simpelv2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pidum
  template:
    metadata:
      labels:
        app: pidum
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: config-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: config-volume
        configMap:
          name: pidum-config

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pidum-ingress
  namespace: simpelv2
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: localhost
    http:
      paths:
      - path: /pidum/
        pathType: Prefix
        backend:
          service:
            name: pidum
            port:
              number: 3000
