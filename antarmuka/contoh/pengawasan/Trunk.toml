[build]
target = "index.html"
dist = "dist"
release = true

# Enable wasm-opt with required features
[[build.wasm_opt]]
args = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--strip-debug",
]

# Advanced wasm-bindgen configuration
[build.wasm-bindgen]
target = "web"
typescript = false         # Disable TS generation for smaller bundles
debug = false             # No debug in production

[build.rust]
optimization-level = "z"   # Maximum size optimization
debug = false
lto = true

[serve]
port = 8087
addresses = ["0.0.0.0"]
open = false

[watch]
watch = ["src", "styles"]

[tools]
ignore = ["target", "dist", "Cargo.lock", ".git"]
debounce = 100

