stages:
- build
- test
- deploy
variables:
  SERVICE_NAME: pengawasan
  SERVICE_TYPE: frontend
  BASE_DIR: /var/www/simpelv2
default:
  image: node:18-alpine
  before_script:
  - apk add --no-cache git make
  - npm install -g npm@latest
build:pengawasan:
  stage: build
  script:
  - "echo \"\U0001F528 Building pengawasan...\""
  - docker build -t pengawasan:$CI_COMMIT_SHA .
  - docker tag pengawasan:$CI_COMMIT_SHA pengawasan:latest
  artifacts:
    paths:
    - dist/pengawasan/
    expire_in: 1 week
test:pengawasan:
  stage: test
  script:
  - "echo \"\U0001F9EA Testing pengawasan...\""
  - make test-pengawasan
  allow_failure: true
deploy:pengawasan:
  stage: deploy
  script:
  - "echo \"\U0001F680 Deploying pengawasan...\""
  - make deploy-pengawasan
  environment:
    name: pengawasan-dev
    url: https://pengawasan.dev.simpelv2.local
  when: manual
