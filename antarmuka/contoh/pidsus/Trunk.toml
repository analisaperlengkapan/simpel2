[build]
target = "index.html"
dist = "dist"
release = false

# Advanced wasm-bindgen configuration
[[build.wasm-bindgen]]
target = "web"
typescript = false         # Disable TS generation for smaller bundles
debug = true              # Enable debug for development
wasm-opt = false          # Disable wasm-opt to avoid feature issues

[serve]
port = 8087
addresses = ["0.0.0.0"]
open = false

[watch]
watch = ["src", "styles"]
ignore = ["target", "dist", "Cargo.lock", ".git"]
debounce = 100
