stages:
- build
- test
- deploy
variables:
  SERVICE_NAME: keuangan
  SERVICE_TYPE: frontend
  BASE_DIR: /var/www/simpelv2
default:
  image: node:18-alpine
  before_script:
  - apk add --no-cache git make
  - npm install -g npm@latest
build:keuangan:
  stage: build
  script:
  - "echo \"\U0001F528 Building keuangan...\""
  - docker build -t keuangan:$CI_COMMIT_SHA .
  - docker tag keuangan:$CI_COMMIT_SHA keuangan:latest
  artifacts:
    paths:
    - dist/keuangan/
    expire_in: 1 week
test:keuangan:
  stage: test
  script:
  - "echo \"\U0001F9EA Testing keuangan...\""
  - make test-keuangan
  allow_failure: true
deploy:keuangan:
  stage: deploy
  script:
  - "echo \"\U0001F680 Deploying keuangan...\""
  - make deploy-keuangan
  environment:
    name: keuangan-dev
    url: https://keuangan.dev.simpelv2.local
  when: manual
