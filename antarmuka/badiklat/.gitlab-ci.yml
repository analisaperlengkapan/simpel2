stages:
- build
- test
- deploy
variables:
  SERVICE_NAME: badiklat
  SERVICE_TYPE: frontend
  BASE_DIR: /var/www/simpelv2
default:
  image: node:18-alpine
  before_script:
  - apk add --no-cache git make
  - npm install -g npm@latest
build:badiklat:
  stage: build
  script:
  - "echo \"\U0001F528 Building badiklat...\""
  - docker build -t badiklat:$CI_COMMIT_SHA .
  - docker tag badiklat:$CI_COMMIT_SHA badiklat:latest
  artifacts:
    paths:
    - dist/badiklat/
    expire_in: 1 week
test:badiklat:
  stage: test
  script:
  - "echo \"\U0001F9EA Testing badiklat...\""
  - make test-badiklat
  allow_failure: true
deploy:badiklat:
  stage: deploy
  script:
  - "echo \"\U0001F680 Deploying badiklat...\""
  - make deploy-badiklat
  environment:
    name: badiklat-dev
    url: https://badiklat.dev.simpelv2.local
  when: manual
