stages:
- build
- test
- deploy
variables:
  SERVICE_NAME: portal
  SERVICE_TYPE: frontend
  BASE_DIR: /var/www/simpelv2
default:
  image: node:18-alpine
  before_script:
  - apk add --no-cache git make
  - npm install -g npm@latest
build:portal:
  stage: build
  script:
  - "echo \"\U0001F528 Building portal...\""
  - docker build -t portal:$CI_COMMIT_SHA .
  - docker tag portal:$CI_COMMIT_SHA portal:latest
  artifacts:
    paths:
    - dist/portal/
    expire_in: 1 week
test:portal:
  stage: test
  script:
  - "echo \"\U0001F9EA Testing portal...\""
  - make test-portal
  allow_failure: true
deploy:portal:
  stage: deploy
  script:
  - "echo \"\U0001F680 Deploying portal...\""
  - make deploy-portal
  environment:
    name: portal-dev
    url: https://portal.dev.simpelv2.local
  when: manual
