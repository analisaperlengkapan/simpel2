[package]
name = "pengawasan-microfrontend"
version.workspace = true
edition.workspace = true
authors = ["SIMPelv2 Team <simpelv2@kejaksaan.go.id>"]
description = "SIMPelv2 Pengawasan - Supervision & Oversight Management System"
license = "MIT"
repository = "https://gitlab.com/analisiskebutuhan/simpelv2_web"
keywords = ["leptos", "wasm", "kejaksaan", "supervision", "oversight"]
categories = ["wasm", "web-programming"]

[lib]
crate-type = ["cdylib"]
name = "pengawasan_microfrontend"

[dependencies]
leptos = { workspace = true, features = ["csr", "hydrate"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
lib-ui = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }
gloo = { workspace = true, features = ["futures", "timers", "events"] }
gloo-net = { workspace = true }
gloo-timers = { workspace = true, features = ["futures"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }
uuid = { workspace = true, features = ["v4", "js", "fast-rng"] }
url = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }

[features]
default = ["csr"]
csr = ["leptos/csr"]
hydrate = ["leptos/hydrate"]
