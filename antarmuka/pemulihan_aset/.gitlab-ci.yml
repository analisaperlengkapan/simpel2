stages:
- build
- test
- deploy
variables:
  SERVICE_NAME: pemulihan_aset
  SERVICE_TYPE: frontend
  BASE_DIR: /var/www/simpelv2
default:
  image: node:18-alpine
  before_script:
  - apk add --no-cache git make
  - npm install -g npm@latest
build:pemulihan_aset:
  stage: build
  script:
  - "echo \"\U0001F528 Building pemulihan_aset...\""
  - docker build -t pemulihan_aset:$CI_COMMIT_SHA .
  - docker tag pemulihan_aset:$CI_COMMIT_SHA pemulihan_aset:latest
  artifacts:
    paths:
    - dist/pemulihan_aset/
    expire_in: 1 week
test:pemulihan_aset:
  stage: test
  script:
  - "echo \"\U0001F9EA Testing pemulihan_aset...\""
  - make test-pemulihan_aset
  allow_failure: true
deploy:pemulihan_aset:
  stage: deploy
  script:
  - "echo \"\U0001F680 Deploying pemulihan_aset...\""
  - make deploy-pemulihan_aset
  environment:
    name: pemulihan_aset-dev
    url: https://pemulihan_aset.dev.simpelv2.local
  when: manual
