[package]
name = "pemulihan-aset-microfrontend"
version.workspace = true
edition.workspace = true
authors = ["SIMPelv2 Team <simpelv2@kejaksaan.go.id>"]
description = "SIMPelv2 Pemulihan Aset - Asset Recovery & Management System"
license = "MIT"
repository = "https://gitlab.com/analisiskebutuhan/simpelv2_web"
keywords = ["leptos", "wasm", "kejaksaan", "asset-recovery", "forfeiture"]
categories = ["wasm", "web-programming"]

[lib]
crate-type = ["cdylib"]
name = "pemulihan_aset_microfrontend"

# Modern Dependencies - Optimized for Performance & Security
[dependencies]
# Core Leptos Framework 0.8.x - Modern reactive primitives
leptos = { workspace = true, features = ["csr", "hydrate"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }

# Shared Components Library - Government compliant UI
lib-ui = { workspace = true }

# Web Assembly bindings - Performance optimized
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }
gloo = { workspace = true, features = ["futures", "timers", "events"] }
gloo-timers = { workspace = true, features = ["futures"] }

# Serialization - Compact binary format
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Utilities & Error Handling - Production ready
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }
uuid = { workspace = true, features = ["v4", "js", "fast-rng"] }
url = { workspace = true }

[features]
default = ["csr"]
csr = ["leptos/csr"]
hydrate = ["leptos/hydrate"]

# WASM Build Optimization Profile
# Development profile with fast rebuild
