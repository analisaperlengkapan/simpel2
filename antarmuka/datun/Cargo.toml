[package]
name = "datun-microfrontend"
version = "0.3.0"
edition = "2021"
authors = ["SIMPelv2 Team"]
description = "SIMPelv2 - Datun Criminal Prosecution Microfrontend"
license = "MIT"

[lib]
crate-type = ["cdylib"]

# Modern Dependencies - Optimized for Performance
[dependencies]
# Core Leptos Framework - Latest stable
leptos = { workspace = true, features = ["ssr", "csr", "hydrate"] }
leptos_meta = { workspace = true }

# Shared Components Library - Government compliant UI
shared-microfrontend = { workspace = true }

# Web Assembly bindings - WASM only
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true }
js-sys = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Utilities & Error Handling - WASM compatible
console_error_panic_hook = { version = "0.1", optional = true }
log = "0.4"
uuid = { version = "1.6", features = ["v4", "js"] }

# Server dependencies - only for SSR builds
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["full"] }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "fs"] }
thiserror = { workspace = true }
futures = { workspace = true }
time = { workspace = true }

[features]
default = []
dev = ["console_error_panic_hook"]
ssr = ["leptos/ssr"]
csr = ["leptos/csr"] 
hydrate = ["leptos/hydrate"]
