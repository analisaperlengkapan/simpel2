[build]
target = "index.html"
dist = "dist"
release = true

# Optimization configuration for WASM
# Enable bulk-memory and nontrapping-float-to-int to support optimized instructions
[[build.wasm_opt]]
args = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-extension",
    "--strip-debug",
]
