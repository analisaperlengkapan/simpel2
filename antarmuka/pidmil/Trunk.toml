[build]
target = "index.html"
dist = "dist"
release = false

# Advanced wasm-bindgen configuration
[build.wasm-bindgen]
target = "web"
typescript = false         # Disable TS generation for smaller bundles
debug = false             # No debug in production

# Disable wasm-opt to avoid validation errors
[build.wasm-opt]
enable = false

[build.rust]
optimization-level = "z"   # Maximum size optimization
debug = false
lto = true
target = "wasm32-unknown-unknown"
rustflags = ["--cfg", "web_sys_unstable_apis"]

[serve]
port = 8086
addresses = ["0.0.0.0"]
open = false

[watch]
watch = ["src", "styles"]

[tools]
wasm-opt = false

[[hooks]]
stage = "post_build"
command = "echo"
command_arguments = ["Build completed without wasm-opt"]
ignore = ["target", "dist", "Cargo.lock", ".git"]
debounce = 100
