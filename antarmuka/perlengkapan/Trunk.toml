[build]
target = "index.html"
dist = "dist"
release = false
public_url = "/perlengkapan/simpel/v2/"

# Pin the tailwindcss binary trunk fetches for `rel="tailwind-css"`. Left
# implicit, the version is whatever the installed trunk defaults to, which a
# trunk bump silently changes — and the Dockerfile pre-seeds this exact version
# into trunk's tool cache (`~/.cache/trunk/tailwindcss-<version>/tailwindcss`)
# so the build does not depend on a GitHub release download succeeding. The two
# must agree, so state it here rather than inheriting a default.
[tools]
tailwindcss = "3.3.5"

[build.wasm-bindgen]
target = "web"
typescript = false
debug = false
demangle = false
keep-debug = false
no-modules-global = "wasm_bindgen"
reference-types = true
weak-refs = true

[build.rust]
optimization-level = "z"
debug = false
lto = true
codegen-units = 1

[serve]
port = 8093
addresses = ["0.0.0.0"]
open = false
no_autoreload = true
