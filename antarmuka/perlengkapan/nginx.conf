events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    merge_slashes on;

    # Docker/k8s DNS resolver so upstream names can be re-resolved at
    # request time rather than nginx-startup time (prevents nginx from
    # failing fast when the authenc/layanan-perlengkapan pods are still
    # starting).
    resolver 127.0.0.11 ipv6=off valid=30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json application/wasm;

    # Upstream hostnames (can be overridden at build time via --build-arg
    # or in docker-compose environment).
    map $host $perlengkapan_api_upstream { default "layanan-perlengkapan:8093"; }
    map $host $authenc_api_upstream     { default "authenc:8091"; }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss: https:; frame-ancestors 'none'; base-uri 'self';" always;

        # Reverse proxy: perlengkapan backend (axum, port 8093)
        location /api/v1/perlengkapan/ {
            set $upstream $perlengkapan_api_upstream;
            proxy_pass http://$upstream/api/v1/perlengkapan/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Reverse proxy: authenc (port 8091)
        location /api/v1/auth/ {
            set $upstream $authenc_api_upstream;
            proxy_pass http://$upstream/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # SPA routing under canonical /perlengkapan/simpel/v2/ prefix.
        # try_files cek file fisik dulu, fallback ke index.html canonical
        # untuk semua client-side route Leptos (dashboard, login, etc.).
        location /perlengkapan/simpel/v2/ {
            try_files $uri $uri/ /perlengkapan/simpel/v2/index.html;
        }

        # Parent path redirect HTML. Saat user akses /perlengkapan/ atau
        # /perlengkapan/simpel/, nginx serve index.html static yang meta-refresh
        # ke /perlengkapan/simpel/v2/. File di-generate di Dockerfile.
        location = /perlengkapan/ {
            try_files /perlengkapan/index.html =404;
        }
        location = /perlengkapan/simpel/ {
            try_files /perlengkapan/simpel/index.html =404;
        }

        # No-cache untuk semua index.html (canonical + redirect pages)
        # supaya update path config langsung terlihat user tanpa cache-bust.
        location ~ ^/perlengkapan(/simpel(/v2)?)?/index\.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires 0;
        }

        # Static assets caching
        location ~* \.(wasm|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
