[package]
name = "pidum-microfrontend"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
shared-microfrontend = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlInputElement", "Window", "History"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[lib]
crate-type = ["cdylib", "rlib"]
