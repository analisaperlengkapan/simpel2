# Run as non-root (nginx-unprivileged image, uid 101): the pid must live in a
# writable path (default /run/nginx.pid is root-only).
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    merge_slashes on;

    # Docker/k8s DNS resolver so upstream names can be re-resolved at
    # request time rather than nginx-startup time (prevents nginx from
    # failing fast when the authenc/layanan-perlengkapan pods are still
    # starting).
    resolver 127.0.0.11 ipv6=off valid=30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json application/wasm;

    # Upstream host:port, substituted at container start by `entrypoint.sh`
    # from PERLENGKAPAN_API_UPSTREAM / AUTHENC_API_UPSTREAM.
    #
    # They are placeholders rather than literals because the ports differ by
    # environment: Kubernetes Services listen on 8093/8091, while docker-compose
    # binds the same backends on 3020/8088. Hard-coding the K8s ports — which is
    # what this file used to do, under a comment claiming they "can be overridden
    # ... in docker-compose environment" — meant no override existed at all, so
    # every in-browser call through the portal's own nginx answered 502 and the
    # login page's captcha widget never rendered. Under Helm the chart mounts its
    # own rendered nginx.conf over this file and there is nothing to substitute.
    map $host $perlengkapan_api_upstream { default "__PERLENGKAPAN_API_UPSTREAM__"; }
    map $host $authenc_api_upstream     { default "__AUTHENC_API_UPSTREAM__"; }

    # Single definition of the document CSP, referenced by every `location` that
    # serves a document. Kept in a variable because nginx `add_header`
    # inheritance is all-or-nothing per location: a location that declares ANY
    # add_header of its own (e.g. `Cache-Control` on index.html) silently drops
    # EVERY header inherited from the server block — CSP and HSTS included.
    # Without restating them, all SPA routes served through `= /index.html`
    # went out with no CSP, no HSTS and no X-Frame-Options at all.
    map $host $portal_csp {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss: https:; frame-ancestors 'none'; base-uri 'self'";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # `script-src` MUST include 'unsafe-inline': Trunk emits the WASM boot
        # as an INLINE `<script type="module">` that calls `init(...)`. Without
        # it the browser blocks that script, the WASM never mounts, and the
        # fixed full-screen `#loading-screen` (index.html) never hides — the
        # whole app is an eternal splash. This is not a cosmetic difference:
        # the Helm-rendered config (`portal-nginx-config`, values.yaml
        # `portal.csp`) has always carried 'unsafe-inline'; this in-image copy
        # had drifted, and it is the copy compose/CI serves.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss: https:; frame-ancestors 'none'; base-uri 'self';" always;

        # Reverse proxy: perlengkapan backend (axum, port 8093)
        location /api/v1/perlengkapan/ {
            set $upstream $perlengkapan_api_upstream;
            # No URI after $upstream: with a VARIABLE upstream, a URI here
            # would be forwarded literally, dropping the request path + query.
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Reverse proxy: authenc (port 8091). The portal WASM calls all three
        # prefixes origin-relative: /api/v1/auth/* (login/me/sessions),
        # /api/v1/iam/* (admin pages), /api/captcha/* (login captcha) — each
        # needs a location or nginx falls through to the SPA index.html.
        location /api/v1/auth/ {
            set $upstream $authenc_api_upstream;
            # No URI after $upstream: with a VARIABLE upstream, a URI here
            # would be forwarded literally, dropping the request path + query.
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /api/v1/iam/ {
            set $upstream $authenc_api_upstream;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /api/captcha/ {
            set $upstream $authenc_api_upstream;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # SPA Routing - serves index.html for unknown paths
        location / {
            try_files $uri $uri/ /index.html;
        }

        # No-cache for index.html so browser always gets latest WASM version.
        # Security headers are restated: any `add_header` here cancels the
        # server-level ones (see `$portal_csp` note above).
        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy $portal_csp always;
            expires 0;
        }

        # No-cache for config.json so deployment config changes are picked up
        location = /config.json {
            try_files $uri =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy $portal_csp always;
            expires 0;
        }

        # Static assets caching. Security headers restated for the same reason.
        location ~* \.(wasm|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy $portal_csp always;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
