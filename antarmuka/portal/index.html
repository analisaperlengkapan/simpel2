<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPELv2 Portal</title>
    <meta name="description" content="Portal Utama SIMPelv2 - Kejaksaan Agung Republik Indonesia">
    <meta name="theme-color" content="#1e40af">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <!-- SIMPelv2 Design System -->
    <link rel="stylesheet" href="../shared/styles/main.css">
    
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Trunk WASM configuration -->
    <link data-trunk rel="rust" data-bin="portal-microfrontend" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory" />
    
    <!-- Portal-specific styling -->
    <style>
        /* Portal loading animation */
        .portal-loading {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        
        /* Portal fallback styling */
        .portal-fallback {
            background: linear-gradient(135deg, var(--color-primary-50), var(--color-primary-100));
        }
        
        /* Portal branding override */
        .portal-brand {
            background: linear-gradient(135deg, var(--color-primary-600), var(--color-primary-800));
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="main">
        <!-- Portal application akan di-render di sini oleh Leptos -->
        <div class="portal-loading min-h-screen flex items-center justify-center portal-fallback">
            <div class="max-w-md w-full p-8 text-center">
                <div class="mx-auto h-16 w-16 flex items-center justify-center rounded-full portal-brand shadow-lg">
                    <i class="fas fa-home text-2xl"></i>
                </div>
                <h2 class="mt-6 text-3xl font-bold text-gray-900">Portal KEJAKSAAN</h2>
                <p class="mt-2 text-sm text-gray-600">Kejaksaan Agung Republik Indonesia</p>
                <p class="mt-1 text-xs text-gray-500">"Demi Keadilan Berdasarkan Ketuhanan Yang Maha Esa"</p>
                <div class="mt-6">
                    <div class="inline-flex items-center px-4 py-2 portal-brand text-white rounded-md shadow">
                        <i class="fas fa-spinner fa-spin mr-2"></i>
                        Memuat aplikasi...
                    </div>
                </div>
                <div class="mt-4 text-xs text-gray-400">
                    SIMPelv2 Portal v2.1.0
                </div>
            </div>
        </div>
    </div>
    <!-- Script Leptos/Trunk akan di-inject otomatis oleh Trunk build -->
</body>
</html>
