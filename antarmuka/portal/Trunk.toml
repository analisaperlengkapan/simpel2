[build]
target = "index.html"
dist = "dist"
release = true
wasm-opt = false  # Disable wasm-opt to avoid optimization errors

# Advanced wasm-bindgen configuration
[build.wasm-bindgen]
target = "web"
typescript = false         # Disable TS generation for smaller bundles
debug = false             # No debug in production

[build.rust]
optimization-level = "z"   # Maximum size optimization
debug = false
lto = true

[serve]
port = 8080
addresses = ["0.0.0.0"]
open = false

[watch]
watch = ["src", "styles"]

[tools]
wasm-opt = false
ignore = ["target", "dist", "Cargo.lock", ".git"]
debounce = 100
debug = false
lto = true

[serve]
addresses = ["127.0.0.1", "0.0.0.0"]
port = 8080
open = true

[watch]
ignore = [
    "./target/**",
    "./dist/**",
    "./.git/**"
]

[build.public-assets]
sources = ["styles/*.css"]
output-dir = "assets"

[build.public-files]
copy-to = "assets/"
sources = ["assets/*"]
