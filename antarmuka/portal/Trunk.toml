[build]
target = "index.html"
dist = "dist"
release = true

# WASM optimization - enable all required features
[[build.wasm_opt]]
args = [
  "-O2",           # Moderate optimization
  "--enable-all",  # Enable all features
  "--strip-debug", # Remove debug information
]

# Advanced wasm-bindgen configuration
[build.wasm-bindgen]
target = "web"
typescript = false                 # Disable TS generation for smaller bundles
debug = false                      # No debug in production
demangle = false                   # No name demangling for size
keep-debug = false                 # Remove debug info
no-modules-global = "wasm_bindgen"

# Tree shaking and optimization

[build.rust]
optimization-level = "3" # High optimization (not maximum size)
debug = false
lto = true

# Server configuration - NO AUTO RELOAD
[serve]
port = 8080
open = false

[build.public-assets]
sources = ["styles/*.css", "../shared/styles/*.css"]
output-dir = "assets"

[build.public-files]
copy-to = "assets/"
sources = ["assets/*"]
