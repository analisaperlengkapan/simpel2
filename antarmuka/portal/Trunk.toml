[build]
target = "index.html"
dist = "dist"
release = true
wasm_opt = false
public_url = "/portal/"

# Pin the tailwindcss binary trunk fetches for `rel="tailwind-css"`. Left
# implicit, the version is whatever the installed trunk defaults to, which a
# trunk bump silently changes — and the Dockerfile pre-seeds this exact version
# into trunk's tool cache (`~/.cache/trunk/tailwindcss-<version>/tailwindcss`)
# so the build does not depend on a GitHub release download succeeding. The two
# must agree, so state it here rather than inheriting a default.
[tools]
tailwindcss = "3.3.5"

# Advanced wasm-bindgen configuration
[build.wasm-bindgen]
target = "web"
typescript = false                 # Disable TS generation for smaller bundles
debug = false                      # No debug in production
demangle = false                   # No name demangling for size
keep-debug = false                 # Remove debug info
no-modules-global = "wasm_bindgen"
reference-types = true             # Enable reference types for smaller code
weak-refs = true                   # Enable weak references

# Tree shaking and optimization
[build.rust]
optimization-level = "z" # Maximum size optimization for code splitting
debug = false
lto = true
codegen-units = 1        # Single codegen unit for better optimization

# Server configuration - NO AUTO RELOAD
[serve]
port = 8080
open = false

[build.public-assets]
sources = ["styles/*.css", "../shared/styles/*.css"]
output-dir = "assets"

[build.public-files]
copy-to = "assets/"
sources = ["assets/*"]
