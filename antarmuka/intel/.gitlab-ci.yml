stages:
- build
- test
- deploy
variables:
  SERVICE_NAME: intel
  SERVICE_TYPE: frontend
  BASE_DIR: /var/www/simpelv2
default:
  image: node:18-alpine
  before_script:
  - apk add --no-cache git make
  - npm install -g npm@latest
build:intel:
  stage: build
  script:
  - "echo \"\U0001F528 Building intel...\""
  - docker build -t intel:$CI_COMMIT_SHA .
  - docker tag intel:$CI_COMMIT_SHA intel:latest
  artifacts:
    paths:
    - dist/intel/
    expire_in: 1 week
test:intel:
  stage: test
  script:
  - "echo \"\U0001F9EA Testing intel...\""
  - make test-intel
  allow_failure: true
deploy:intel:
  stage: deploy
  script:
  - "echo \"\U0001F680 Deploying intel...\""
  - make deploy-intel
  environment:
    name: intel-dev
    url: https://intel.dev.simpelv2.local
  when: manual
