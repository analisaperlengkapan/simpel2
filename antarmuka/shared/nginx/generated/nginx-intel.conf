# SIMPelv2 Microfrontend Nginx Template
# Optimized for WASM/Leptos applications
# Generated: August 19, 2025

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers - Production Ready
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # CSP optimized for Leptos/WASM
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' http://gerbang:8080 ws://gerbang:8080 http://localhost:8080 ws://localhost:8080;";

    # Enable gzip compression - Optimized for WASM
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/atom+xml
        application/wasm;

    # WASM files - Critical for Leptos apps
    location ~* \.wasm$ {
        add_header Content-Type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Enable range requests for large WASM files
        add_header Accept-Ranges bytes;
    }

    # JavaScript files - Leptos generated
    location ~* \.js$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        # Prevent MIME type sniffing for security
        add_header X-Content-Type-Options nosniff;
    }

    # CSS and static assets
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA routing - Essential for Leptos Router
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
    }

    # Health check endpoint - for container orchestration
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"intel","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # API proxy (if needed for development)
    location /api/ {
        proxy_pass http://gerbang:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support for hot reload (development)
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Disable access to sensitive files
    location ~ /\.(ht|git|env) {
        deny all;
        return 404;
    }

    # Logging optimized for debugging
    access_log /var/log/nginx/intel_access.log;
    error_log /var/log/nginx/intel_error.log;
}
