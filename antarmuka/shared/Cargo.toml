[package]
name = "shared-microfrontend"
version = "0.3.0"
edition = "2021"
authors = ["Tim Pengembang SIMPelv2", "Kejaksaan Agung RI"]
description = "Optimized shared components library untuk sistem Kejaksaan Agung Republik Indonesia"
license = "Proprietary"
repository = "https://github.com/kejaksaan-ri/simpelv2"
keywords = ["kejaksaan", "microfrontend", "leptos", "wasm"]
categories = ["web-programming", "gui"]

[lib]
name = "shared_microfrontend"
crate-type = ["cdylib", "rlib"]

[features]
default = ["serde", "chrono"]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr"]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
# Leptos Framework - Core framework untuk frontend
leptos = { workspace = true, features = ["csr"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true, optional = true }

# WASM & Web APIs - Essential browser integration only
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "console", "Window", "Document", "Element", "HtmlElement",
    "Navigator", "Storage", "Location", "History", "Event", "EventTarget"
] }
js-sys = { workspace = true }

# Serialization & HTTP - Optimized feature usage
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
gloo-net = { version = "0.6", features = ["http"] }

# Utilities & Data Processing - Minimal necessary dependencies
futures = { workspace = true }
regex = { workspace = true, default-features = false, features = ["std"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"], optional = true }
uuid = { workspace = true, features = ["v4", "fast-rng"] }
once_cell = "1.19"

# Logging - Only in debug builds
log = "0.4"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Use workspace .cargo config instead of individual rustflags
