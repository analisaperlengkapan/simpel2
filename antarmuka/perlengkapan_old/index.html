<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/perlengkapan/" />
    <title>Perlengkapan - SIMPEL</title>

    <!-- Handle local dev root redirect to router base path -->
    <script>
        if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
            window.location.replace('/perlengkapan/');
        }
    </script>

    <!-- Tailwind CSS (compiled via Trunk with shared config) -->
    <link data-trunk rel="tailwind-css" href="styles/tailwind.css" />

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Custom CSS is now imported via styles/tailwind.css -->

    <!-- Static Assets -->
    <link data-trunk rel="copy-dir" href="assets/" />

    <!-- Trunk WASM configuration - lib only, no binary -->
    <link data-trunk rel="rust" data-wasm-opt="1"
        data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- SEO & Meta Tags -->
    <meta name="description"
        content="Sistem Informasi Manajemen Perlengkapan Kejaksaan Republik Indonesia - Platform terintegrasi untuk pengelolaan aset dan BMN">
    <meta name="keywords" content="SIMPEL, Kejaksaan, Perlengkapan, BMN, Aset, Pengadaan">
    <meta name="author" content="Kejaksaan RI">
    <meta name="robots" content="noindex, nofollow">

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
</head>

<body class="bg-slate-50 dark:bg-navy-900">
    <!-- Loading Screen -->
    <div id="loading-screen" class="min-h-screen flex items-center justify-center"
        style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);">
        <div class="max-w-md w-full p-8 text-center">
            <div class="mx-auto h-32 w-32 flex items-center justify-center mb-6 animate-pulse">
                <img src="/perlengkapan/assets/kejaksaan-logo.png" alt="Logo Kejaksaan RI"
                    class="w-full h-full object-contain drop-shadow-2xl" />
            </div>
            <h2 class="mt-4 text-2xl font-bold text-white tracking-tight">SIMPEL Perlengkapan</h2>
            <p class="mt-2 text-sm text-slate-300">Kejaksaan Agung Republik Indonesia</p>
            <p class="mt-1 text-xs text-slate-400 italic">"Demi Keadilan Berdasarkan Ketuhanan Yang Maha Esa"</p>
            <div class="mt-8">
                <div id="loading-status"
                    class="inline-flex items-center px-4 py-2 bg-white/10 text-white rounded-lg text-sm">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    <span>Memuat antarmuka...</span>
                </div>
            </div>
        </div>
    </div>

    <div id="app"></div>

    <script>
        // Sembunyikan loading screen ketika WASM (Leptos) siap dan div app sudah terisi
        const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                if (mutation.addedNodes.length > 0) {
                    const loadingScreen = document.getElementById('loading-screen');
                    if (loadingScreen) {
                        loadingScreen.style.opacity = '0';
                        loadingScreen.style.transition = 'opacity 0.5s ease';
                        setTimeout(() => loadingScreen.remove(), 500);
                        observer.disconnect();
                    }
                }
            });
        });

        const appNode = document.getElementById('app');
        if (appNode) {
            observer.observe(appNode, { childList: true });

            // Fallback timeout
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.remove();
                }
            }, 5000);
        }
    </script>
</body>

</html>
