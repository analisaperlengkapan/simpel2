# ========================================
# PIPELINE SUCCESS NOTIFICATION
# ========================================

# =====================================================
# SIMPEL v1 (Legacy PHP) Build Pipeline
# =====================================================

build:simpelv1:
  stage: build
  image: docker:24
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "🐳 Building SIMPEL v1 (PHP Laravel) Docker image..."
    - |
      docker build \
        -f monolith/simpelv1/Dockerfile \
        -t "$CI_REGISTRY_IMAGE/simpelv1:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE/simpelv1:latest" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        .
    - echo "📤 Pushing SIMPEL v1 image to registry..."
    - docker push "$CI_REGISTRY_IMAGE/simpelv1:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/simpelv1:latest"
    - echo "✅ SIMPEL v1 image built and pushed successfully"
  only:
    - main
    - staging
    - /^feat\/.*$/
  except:
    - tags
  cache: {}
  timeout: 30 minutes

# =====================================================
# SIMPEL v1 Security Scan
# =====================================================

security:simpelv1:
  stage: security-scan
  image: docker:24
  services:
    - name: docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "🔍 Running Trivy security scan on SIMPEL v1 image..."
    - docker pull "$CI_REGISTRY_IMAGE/simpelv1:$CI_COMMIT_SHORT_SHA"

    # Run Trivy via the official image, mounting the docker socket so
    # it can inspect the just-pulled image from the host docker daemon.
    # Generate a JSON report for archival and a human-readable failure
    # gate on HIGH/CRITICAL findings.
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$(pwd):/workspace" -w /workspace \
        aquasec/trivy:latest image \
        --format json \
        --output trivy-simpelv1-report.json \
        "$CI_REGISTRY_IMAGE/simpelv1:$CI_COMMIT_SHORT_SHA" || true
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        aquasec/trivy:latest image \
        --severity HIGH,CRITICAL \
        --exit-code 1 \
        "$CI_REGISTRY_IMAGE/simpelv1:$CI_COMMIT_SHORT_SHA" \
        || echo "⚠️ HIGH/CRITICAL vulnerabilities found in simpelv1 image (see trivy-simpelv1-report.json)"
    - echo "✅ Trivy scan completed"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-simpelv1-report.json
    reports:
      container_scanning: trivy-simpelv1-report.json
  dependencies:
    - build:simpelv1
  only:
    - main
    - staging
    - /^feat\/.*$/
  allow_failure: true

notify:success:
  stage: .post
  image: alpine:latest
  script:
