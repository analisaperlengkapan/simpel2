[advisories]
ignore = [
  "RUSTSEC-2023-0071", # rsa (Marvin Attack) - No fixed version available
  "RUSTSEC-2023-0089", # atomic-polyfill (unmaintained)
  "RUSTSEC-2025-0057", # fxhash (unmaintained)
  "RUSTSEC-2024-0436", # paste (unmaintained)
  "RUSTSEC-2024-0370", # proc-macro-error (unmaintained)
  "RUSTSEC-2025-0134", # rustls-pemfile (unmaintained)
  "RUSTSEC-2025-0141", # bincode (unmaintained)
  "RUSTSEC-2024-0421", # idna (low severity, waiting for upstream)
  # rustls-webpki 0.101.7 advisories — transitive via aws-smithy-http-client
  # 1.1.12 → rustls 0.21.12 (AWS SDK belum upgrade ke rustls 0.22+).
  # Kode path vulnerable hanya aktif saat validasi TLS cert dari server
  # yang kita hubungi. Kita hanya konek ke AWS endpoint (S3/IAM/KMS)
  # yang pakai CA standar tanpa exotic name constraints atau malformed
  # CRL — kondisi exploit tidak reachable. Re-evaluate saat AWS SDK
  # upgrade. Tracking: https://github.com/awslabs/aws-sdk-rust
  # (rustls 0.22 migration). Mirror dengan deny.toml ignore.
  "RUSTSEC-2026-0098", # rustls-webpki - URI name constraints
  "RUSTSEC-2026-0099", # rustls-webpki - wildcard name constraints
  "RUSTSEC-2026-0104", # rustls-webpki - panic in CRL parsing
  # lopdf stack overflow on PDF PARSE (Document::load_mem, deeply-nested
  # objects). Transitive via printpdf 0.9.1 → lopdf 0.39 (no printpdf release
  # uses lopdf >=0.42 yet). Not reachable: perlengkapan only GENERATES PDFs,
  # never parses untrusted ones. Un-ignore when printpdf bumps lopdf >=0.42.
  # Mirror dengan deny.toml ignore.
  "RUSTSEC-2026-0187", # lopdf (stack overflow on PDF parse) - not reachable (generate-only)
  # quick-xml <0.41 DoS pada PARSE XML untrusted. Dependency langsung kita
  # (authenc SAML — memang parse XML untrusted) sudah di-upgrade ke 0.41.
  # Sisa satu copy 0.36 dipin docx-rs 0.4.20 (rilis terakhir, tak ada jalur
  # upgrade) yang HANYA dipakai GENERATE .docx (SK exporter) — path parse
  # vulnerable tidak reachable. Un-ignore saat docx-rs pindah quick-xml >=0.41.
  # Mirror dengan deny.toml ignore.
  "RUSTSEC-2026-0194", # quick-xml <0.41 quadratic attr check - residual docx-rs, generate-only
  "RUSTSEC-2026-0195", # quick-xml <0.41 namespace alloc DoS - residual docx-rs, generate-only
  # rkyv 0.7.46 OOB read — TIDAK PERNAH DIKOMPILASI, hanya ada di Cargo.lock.
  # `rkyv` adalah dependency OPSIONAL rust_decimal (feature `rkyv`) dan feature
  # itu tak diaktifkan siapa pun di workspace ini. Rantainya:
  #   rust_decimal 1.41 <- byte-unit 5.2 (feature "byte") <- openraft 0.9
  #   <- secreton-storage (feature `raft-consensus`)
  # openraft memakai byte-unit, byte-unit memakai rust_decimal — tapi tak satu
  # pun mengaktifkan `rust_decimal/rkyv`. Cargo.lock bersifat feature-agnostic
  # sehingga tetap mencatat dependency opsional yang tak aktif; cargo-audit
  # membaca Cargo.lock apa adanya, jadi ia melaporkan crate yang tak pernah
  # masuk binary. Bandingkan cargo-deny (graph-based via `cargo metadata`):
  # ia TIDAK melaporkan advisory ini — makanya entri ini SENGAJA TIDAK
  # di-mirror ke deny.toml (beda dengan entri lain di atas). Bukti:
  #   cargo tree --workspace --all-features --target all -i rkyv  -> kosong
  # Dijaga mekanis oleh step "Assert lockfile-only audit ignores" di
  # .github/workflows/security.yml: begitu rkyv benar-benar masuk build graph,
  # CI merah dan ignore ini WAJIB dicabut.
  # Tak ada jalur upgrade: rust_decimal 1.42.1 (terbaru) masih `rkyv ^0.7.46`.
  "RUSTSEC-2026-0235", # rkyv 0.7 OOB read - optional dep yang tak pernah diaktifkan (lockfile-only)
]
