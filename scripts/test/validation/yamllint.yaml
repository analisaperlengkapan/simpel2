extends: default

# Custom rules for Kubernetes YAML files
rules:
  # Line length - optimized for readability while accommodating long strings
  line-length:
    max: 120
    level: warning  # Warning instead of error for better workflow

  # Basic formatting rules
  trailing-spaces: enable
  document-start: disable  # Disabled for single-document Kubernetes files

  # Indentation - Kubernetes standard
  indentation:
    spaces: 2
    indent-sequences: consistent

  # Prevent duplicate keys
  key-duplicates: enable

  # Control empty lines
  empty-lines:
    max: 1
    max-end: 1

  # Enable comment indentation checking
  comments-indentation: enable

  # Disable key ordering (Kubernetes doesn't require specific key order)
  key-ordering: disable

  # Allow truthy values (Kubernetes uses 'yes', 'no')
  truthy:
    check-keys: false

  # Bracket spacing
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # Hyphens in comments
  hyphens:
    max-spaces-after: 1

  # Commas in sequences
  commas:
    max-spaces-before: 0
    min-spaces-after: 1

  # Colons in mappings
  colons:
    max-spaces-before: 0
    max-spaces-after: 1

# Ignore patterns for files that don't need linting
ignore: |
  # Secret files (contain sensitive data)
  k8s/secrets/*
  k8s/overlays/*/*-secret.yaml

  # Auto-generated monitoring configs
  k8s/overlays/*/grafana.yaml
  k8s/overlays/*/prometheus.yaml

  # TLS certificates (very long base64 data)
  k8s/overlays/*/ingress-tls.yaml

  # Encrypted sealed secrets
  k8s/**/*-sealed.yaml

  # Vault configuration files
  k8s/base/vault/*

  # Generated Kubernetes manifests
  k8s/overlays/*/kustomization.yaml

  # Backup files
  *.backup
  *.bak
  *.orig

  # Temporary files
  *.tmp
  *.temp
