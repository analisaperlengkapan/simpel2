[package]
name = "simpel-cli"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "simpel"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
colored = "2.0"
