# GitLab CI/CD configuration for E2E tests

stages:
  - build
  - test
  - report

variables:
  RUST_VERSION: "1.93"
  POSTGRES_DB: simpel_test
  POSTGRES_USER: simpel
  POSTGRES_PASSWORD: simpel_test
  DATABASE_URL: "postgresql://simpel:simpel_test@postgres:5432/simpel_test"
  REDIS_URL: "redis://redis:6379"

.rust_template:
  image: rust:${RUST_VERSION}
  before_script:
    - rustc --version
    - cargo --version
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - target/
      - .cargo/

build:backend:
  extends: .rust_template
  stage: build
  script:
    - cargo build --release --workspace
  artifacts:
    paths:
      - target/release/layanan-perlengkapan-api
    expire_in: 1 hour

build:frontend:
  image: node:20
  stage: build
  before_script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source $HOME/.cargo/env
    - cargo install trunk
  script:
    - cd antarmuka/perlengkapan
    - trunk build --release
  artifacts:
    paths:
      - antarmuka/perlengkapan/dist/
    expire_in: 1 hour
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - antarmuka/perlengkapan/node_modules/

e2e:tests:
  image: mcr.microsoft.com/playwright:v1.40.0-focal
  stage: test
  services:
    - name: postgres:15
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: minio/minio:latest
      alias: minio
      command: ["server", "/data"]
  dependencies:
    - build:backend
    - build:frontend
  before_script:
    # Install Node.js
    - apt-get update && apt-get install -y curl
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs

    # Install Playwright
    - cd tests/e2e
    - npm ci
    - npx playwright install chromium
    - cd ../..

    # Run migrations
    - apt-get install -y postgresql-client
    - cargo install sqlx-cli --no-default-features --features postgres
    - cd layanan/perlengkapan/crates/api
    - sqlx migrate run
    - cd ../../../..
  script:
    # Start backend services
    - ./target/release/layanan-perlengkapan-api &
    - API_PID=$!

    # Wait for services to be ready
    - timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'

    # Seed test data
    - cargo run --bin seed-test-data

    # Run E2E tests
    - cd tests/e2e
    - npx playwright test --reporter=html,junit

    # Stop services
    - kill $API_PID || true
  artifacts:
    when: always
    paths:
      - tests/e2e/playwright-report/
      - tests/e2e/test-results/
      - tests/e2e/results/junit.xml
    reports:
      junit: tests/e2e/results/junit.xml
    expire_in: 30 days
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

report:publish:
  stage: report
  image: alpine:latest
  dependencies:
    - e2e:tests
  script:
    - echo "E2E test results published"
  artifacts:
    reports:
      junit: tests/e2e/results/junit.xml
  only:
    - main
    - develop

notify:failure:
  stage: report
  image: alpine:latest
  script:
    - echo "E2E tests failed on ${CI_COMMIT_REF_NAME}"
    # Add notification logic here
  when: on_failure
  only:
    - main
