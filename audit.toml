# Audit configuration for RUSTSEC advisories
# This file is used by cargo-audit to ignore specific advisories

[advisories]
ignore = [
    # RSA Marvin Attack: Timing vulnerability in PKCS#1 v1.5 decryption
    # No fix available in rsa crate yet. We don't use RSA for new code (using Ed25519),
    # but some transitive dependencies might.
    "RUSTSEC-2023-0071",
]
