# Development Override Configuration
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # Development database configuration
  db-simpelv2:
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=rahasia
      - POSTGRES_USER=simpel
      - POSTGRES_DB=simpelv2
    ports:
      - "5432:5432"  # Expose port for development
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - simpelv2
      - internal

  # Development nginx configuration
  nginx:
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./antarmuka/dist:/usr/share/nginx/html:ro
      - ./logs/nginx:/var/log/nginx  # Log volume for development

  # Development gateway configuration
  gerbang:
    ports:
      - "8080:8080"  # Expose port for development
      - "9901:9901"  # Expose admin port for development
    volumes:
      - ./logs/gerbang:/var/log  # Log volume for development

  # Development security service configuration
  layanan-keamanan:
    ports:
      - "3001:3000"  # Expose port for development
    volumes:
      - ./logs/layanan-keamanan:/var/log  # Log volume for development

  # Development integration service configuration
  layanan-integrasi:
    ports:
      - "3002:3000"  # Expose port for development
    volumes:
      - ./logs/layanan-integrasi:/var/log  # Log volume for development

# Development volumes
volumes:
  logs:
    driver: local 