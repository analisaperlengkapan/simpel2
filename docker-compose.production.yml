# SIMPelv2 Production Docker Compose
# Generated: August 19, 2025

version: '3.8'

services:
  # Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: simpelv2-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infra/nginx/ssl:/etc/nginx/ssl
      - /var/log/nginx:/var/log/nginx
    depends_on:
      - portal
      - badiklat
      - datun
      - intel
    networks:
      - simpelv2-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: simpelv2-postgres
    environment:
      POSTGRES_DB: simpelv2
      POSTGRES_USER: simpelv2_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - simpelv2-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpelv2_user -d simpelv2"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: simpelv2-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - simpelv2-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Portal Microfrontend
  portal:
    build:
      context: ./antarmuka/portal
      dockerfile: Dockerfile
    container_name: simpelv2-portal
    ports:
      - "8089:8089"
    environment:
      - RUST_LOG=info
      - PORTAL_PORT=8089
    networks:
      - simpelv2-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Badiklat Microfrontend
  badiklat:
    build:
      context: ./antarmuka/badiklat
      dockerfile: Dockerfile
    container_name: simpelv2-badiklat
    ports:
      - "8081:8081"
    environment:
      - RUST_LOG=info
      - BADIKLAT_PORT=8081
    networks:
      - simpelv2-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Datun Microfrontend
  datun:
    build:
      context: ./antarmuka/datun
      dockerfile: Dockerfile
    container_name: simpelv2-datun
    ports:
      - "8082:8082"
    environment:
      - RUST_LOG=info
      - DATUN_PORT=8082
    networks:
      - simpelv2-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Intel Microfrontend
  intel:
    build:
      context: ./antarmuka/intel
      dockerfile: Dockerfile
    container_name: simpelv2-intel
    ports:
      - "8083:8083"
    environment:
      - RUST_LOG=info
      - INTEL_PORT=8083
    networks:
      - simpelv2-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring & Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: simpelv2-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - simpelv2-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: simpelv2-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    networks:
      - simpelv2-network
    restart: unless-stopped

  # Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: simpelv2-loki
    ports:
      - "3100:3100"
    volumes:
      - ./infra/monitoring/loki.yml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - simpelv2-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: simpelv2-promtail
    volumes:
      - ./infra/monitoring/promtail.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - simpelv2-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  simpelv2-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
