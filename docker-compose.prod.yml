services:
  db:
    image: postgres:15
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - simpel-net

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db
    networks:
      - simpel-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    command: npm run build
    volumes:
      - ./frontend/dist:/app/dist
    networks:
      - simpel-net

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - simpel-net

volumes:
  pgdata:

networks:
  simpel-net:
