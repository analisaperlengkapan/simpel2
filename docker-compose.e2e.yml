# =====================================================================
# E2E test stack overlay (F5-A) — Playwright real-auth e2e
# =====================================================================
# The base docker-compose.yml exposes authenc only over gRPC (:50051). The
# browser-driven real-auth e2e suites need authenc's REST API reachable AND a
# way to solve the login captcha headlessly. This overlay adds exactly that,
# nothing else — so it composes on top of the base stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
#
# What it changes (authenc only):
#   1. Build authenc WITH the `captcha-debug` feature (compile-time gated:
#      authenc-api/captcha-debug; layanan/authenc/Dockerfile `ARG CAPTCHA_DEBUG`).
#      Enables GET /api/captcha/debug/{challenge_id} so Playwright can fetch the
#      captcha answer and complete a *real* login (see the helper in
#      antarmuka/*/tests/e2e — mirrors portal-auth-e2e.spec.ts).
#   2. Publish authenc REST (:8088) on host :18088 — the AUTHENC_URL default the
#      e2e specs proxy `/api/**` to. gRPC :50051 from the base is kept (compose
#      concatenates `ports`), so no need to repeat it here.
#
# Test users: migrations 044/047 seed NIP 199203142014031001 (password = the
# NIP, Argon2id) with operator_satker / validator_wilayah / validator_pusat /
# admin roles — applied automatically on authenc startup.
#
# Frontend config (api_url/authenc_url) stays origin-relative as in the base;
# the Playwright suites proxy `/api/**` to the host-published backends
# (authenc :18088, perlengkapan :3020), so no FE env changes are needed here.
services:
  authenc:
    build:
      args:
        # 1 => `cargo build --features authenc-api/captcha-debug` (see Dockerfile)
        CAPTCHA_DEBUG: "1"
    environment:
      # Disable authenc's per-IP request limiter (default 60 req/min) for the e2e
      # stack ONLY. The comprehensive Playwright suite drives every workflow —
      # login + `expect.poll` status loops + multi-role transitions — from a
      # SINGLE runner IP, legitimately exceeding 60 req/min; the limiter then 429s
      # non-deterministically (e.g. pengelolaan "approver_satker approves" flaked
      # with `login failed (429)`). Production/staging leave this unset and keep
      # the secure default. Nothing in the suite asserts 429 behaviour. Honoured
      # by layanan/authenc/crates/api/src/main.rs (AUTHENC_RATE_LIMIT_ENABLED).
      AUTHENC_RATE_LIMIT_ENABLED: "false"
    ports:
      # Host port parameterised for the same reason as docker-compose.yml (#111):
      # concurrent e2e stacks on one shared Docker daemon collided on fixed
      # ports. CI sets AUTHENC_REST_HOST_PORT=0 (ephemeral); the default keeps
      # :18088 for local runs, which is what the header above documents.
      - "${AUTHENC_REST_HOST_PORT:-18088}:8088" # REST API for e2e real-auth + captcha-debug

  # Enable the gateway's privileged database secrets-engine provisioning routes
  # (/v1/database/config/*, /v1/database/roles/*) so the secreton bootstrap can
  # configure Secreton's DB engine + create the leased role. OFF in the base
  # compose and in production (Helm) — the routes accept an admin DSN + raw SQL,
  # so they must not exist on the production simpelv1 localhost sidecar.
  gateway:
    environment:
      GATEWAY_ENABLE_DB_ADMIN: "1"

  # Single-origin reverse proxy for the cross-app SSO e2e (F-GW PR-E). Mirrors
  # the prod Istio VirtualService (one host: /portal, /perlengkapan, /api/*) so
  # the portal→perlengkapan JWT handoff (same-origin localStorage["auth_token"])
  # is exercised in CI — the compose stack otherwise exposes the two FEs as
  # separate origins where localStorage isn't shared. Not brought up in the base
  # e2e flows; only the e2e-portal-cross-app job starts it. `profiles` keeps it
  # out of a bare `up`.
  cross-app-ingress:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: cross-app-ingress
    profiles: ["cross-app"]
    volumes:
      - ./infra/nginx/e2e-cross-app-ingress.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      authenc:
        condition: service_started
      portal:
        condition: service_started
      perlengkapan:
        condition: service_started
      layanan-perlengkapan:
        condition: service_started
    networks:
      - simpel-network

  # One-shot multi-satker fixture loader (#33 / F5-C). Runs psql against the
  # already-migrated dbsimpelv2 to seed integrasi (satkers/assets/mapping) +
  # authenc (per-role users) so the Playwright suite can assert tiered RBAC
  # data-scoping. `profiles: [seed]` keeps it OUT of `up`; invoke explicitly:
  #   docker compose -f docker-compose.yml -f docker-compose.e2e.yml run -T --rm \
  #     e2e-seed -v ON_ERROR_STOP=1 -h postgres -U postgres -d dbsimpelv2 -f - \
  #     < tests/fixtures/e2e/seed-multisatker.sql
  # The SQL is piped via STDIN (not a bind mount) because CI runs under dind,
  # where host bind-mounts resolve against the dind daemon, not the checkout.
  e2e-seed:
    image: postgres:15-alpine
    profiles: ["seed"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?e2e-seed needs POSTGRES_PASSWORD}
    entrypoint: ["psql"]
    command: ["-h", "postgres", "-U", "postgres", "-d", "dbsimpelv2", "-c", "SELECT 1"]
    networks:
      - simpel-network
