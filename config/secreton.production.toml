# Production configuration for Secreton Vault service

[server]
host = "0.0.0.0"
port = 8200
workers = 4
tls_enabled = true
tls_cert = "/opt/simpelv2/certs/secreton.crt"
tls_key = "/opt/simpelv2/certs/secreton.key"

[grpc]
enabled = true
host = "0.0.0.0"
port = 9200
tls_enabled = true
tls_cert = "/opt/simpelv2/certs/secreton-grpc.crt"
tls_key = "/opt/simpelv2/certs/secreton-grpc.key"
tls_ca_cert = "/opt/simpelv2/certs/ca.crt"
require_client_auth = true

[storage]
# Phase 3: PostgreSQL storage
type = "postgresql"                            # Options: memory, postgresql, file
connection_string = "${SECRETON_DATABASE_URL}"
max_connections = 50
connection_timeout = 10

# Phase 1-2: In-memory storage (for development/POC)
# type = "memory"
# max_secrets = 100000

[audit]
enabled = true
max_events = 1000000
retention_days = 365
export_to_database = true
export_to_syslog = true
log_file = "/var/log/secreton/audit.log"

[auth]
# JWT validation from Authenc
jwt_validation = true
jwt_issuer = "simpelv2-authenc"
jwt_audience = "secreton"
jwt_public_key_url = "http://localhost:8088/realms/simpel/protocol/openid-connect/certs"

# Admin token (for bootstrap)
admin_token = "${SECRETON_ADMIN_TOKEN}"

# Bearer token authentication
require_auth = true
token_header = "Authorization"

[kv_engine]
enabled = true
max_versions = 10
cas_required = false
delete_version_after_seconds = 2592000 # 30 days

[transit_engine]
enabled = true
exportable_keys = false
allow_plaintext_backup = false
auto_rotate_period_days = 90

[rate_limiting]
enabled = true
requests_per_second = 100
burst_size = 20
by_ip = true
by_token = true

[security]
# Encryption at rest
enable_encryption_at_rest = true
encryption_key = "${VAULT_ENCRYPTION_KEY}"

# Shamir secret sharing for master key
shamir_threshold = 3
shamir_shares = 5

# Auto-unseal (requires external KMS)
auto_unseal = false
kms_type = "aws"             # Options: aws, azure, gcp, vault
kms_key_id = "${KMS_KEY_ID}"

[backup]
enabled = true
schedule = "0 2 * * *"                         # Daily at 2 AM
destination = "/opt/simpelv2/backups/secreton"
retention_days = 30
compress = true

[monitoring]
enable_metrics = true
metrics_port = 9092
metrics_path = "/metrics"
enable_health_check = true
health_check_path = "/v1/sys/health"
log_level = "info"

[api]
# API versioning
version = "v1"
base_path = "/v1"

# Request limits
max_request_size = "1MB"
request_timeout = 30

# CORS (for admin UI)
enable_cors = false
cors_origins = ["http://localhost:8080"]

[hsm]
# Hardware Security Module integration
enabled = false
provider = "pkcs11" # Options: pkcs11, aws-kms, azure-keyvault, gcp-kms

# PKCS#11 configuration (for hardware HSM)
pkcs11_library_path = "/usr/lib/softhsm/libsofthsm2.so"
slot_id = 0
token_label = "secreton-hsm"
pin = "${HSM_PIN}"
key_label_prefix = "secreton-"

# Connection and operation timeouts
connection_timeout = 30 # seconds
operation_timeout = 60  # seconds

# Health monitoring
health_check_enabled = true
health_check_interval = 60  # seconds

# Retry configuration
max_retries = 3
retry_delay_ms = 1000

[plugins]
# Plugin system for custom engines
enabled = false
plugin_dir = "/opt/simpelv2/plugins"

[telemetry]
# OpenTelemetry integration
enabled = true
endpoint = "http://localhost:4317"
service_name = "secreton-vault"
trace_sample_rate = 0.1
