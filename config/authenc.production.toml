# Production configuration for Authenc IAM service

[server]
host = "0.0.0.0"
port = 8088
workers = 4

[jwt]
secret = "${AUTHENC_JWT_SECRET}"  # From environment variable
expiration = 3600  # 1 hour
issuer = "simpelv2-authenc"
audience = "portal,secreton,api"
algorithm = "HS256"

[database]
url = "${DATABASE_URL}"
max_connections = 100
min_connections = 10
connection_timeout = 30
idle_timeout = 600

[redis]
url = "${REDIS_URL}"
pool_size = 20
connection_timeout = 5

[security]
enable_rate_limiting = true
requests_per_minute = 100
burst_size = 20
enable_cors = true
cors_origins = ["http://localhost:8080", "https://simpelv2.kejaksaan.go.id"]
enable_csrf = true
session_timeout = 28800  # 8 hours

[oauth2]
enable_password_grant = true
enable_authorization_code = true
enable_refresh_token = true
enable_device_flow = false
access_token_lifetime = 3600
refresh_token_lifetime = 2592000  # 30 days
authorization_code_lifetime = 600  # 10 minutes

[realms]
default_realm = "simpel"

[[realms.configs]]
name = "simpel"
enabled = true
display_name = "SIMPelv2 Kejaksaan"
login_theme = "kejaksaan"
account_theme = "kejaksaan"

# Password policies
[realms.configs.password_policy]
minimum_length = 12
require_uppercase = true
require_lowercase = true
require_digits = true
require_special_chars = true
history_count = 5
max_age_days = 90

# Session settings
[realms.configs.sessions]
sso_session_idle_timeout = 1800  # 30 minutes
sso_session_max_lifespan = 36000  # 10 hours
offline_session_idle_timeout = 2592000  # 30 days

[secreton]
enabled = true
endpoint = "http://localhost:8200"
token = "${SECRETON_TOKEN}"
timeout = 5
retry_attempts = 3

[audit]
enabled = true
log_to_file = true
log_to_syslog = true
log_file = "/var/log/authenc/audit.log"
max_file_size = "100MB"
max_files = 10
include_request_body = false
include_response_body = false

[monitoring]
enable_metrics = true
metrics_port = 9091
enable_tracing = true
tracing_endpoint = "http://localhost:4317"
log_level = "info"

[features]
enable_mfa = true
enable_webauthn = true
enable_social_login = true
enable_federation = true
enable_user_registration = true
enable_email_verification = true
enable_forgot_password = true

[smtp]
host = "smtp.kejaksaan.go.id"
port = 587
username = "${SMTP_USERNAME}"
password = "${SMTP_PASSWORD}"
from_address = "noreply@kejaksaan.go.id"
from_name = "SIMPelv2"
use_tls = true

[templates]
base_url = "https://simpelv2.kejaksaan.go.id"
template_dir = "/opt/simpelv2/templates"
