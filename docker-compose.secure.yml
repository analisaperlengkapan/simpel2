services:
  db-simpelv2:
    image: postgres:15-alpine
    container_name: dbsimpelv2
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - simpelnet
    restart: always

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./antarmuka/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - gerbang
      - antarmuka
    networks:
      - simpelnet
    restart: unless-stopped

  gerbang:
    build:
      context: ./gerbang
    container_name: gerbang
    env_file:
      - ./gerbang/.env
    expose:
      - "8080"
    depends_on:
      - layanan-keamanan
      - layanan-audit
      - layanan-integrasi
    networks:
      - simpelnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  antarmuka:
    build:
      context: ./antarmuka
    container_name: antarmuka
    expose:
      - "80"
    networks:
      - simpelnet
    restart: unless-stopped

  layanan-keamanan:
    build:
      context: ./layanan-keamanan
    container_name: layanan-keamanan
    env_file:
      - ./layanan-keamanan/.env
    expose:
      - "3000"
    depends_on:
      - db-simpelv2
    networks:
      - simpelnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  layanan-audit:
    build:
      context: ./layanan-audit
    container_name: layanan-audit
    env_file:
      - ./layanan-audit/.env
    expose:
      - "3000"
    depends_on:
      - db-simpelv2
    networks:
      - simpelnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  layanan-integrasi:
    build:
      context: ./layanan-integrasi
    container_name: layanan-integrasi
    env_file:
      - ./layanan-integrasi/.env
    volumes:
      - ./layanan-integrasi/config/:/app/config
    networks:
      - simpelnet
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:

networks:
  simpelnet:
    driver: bridge
