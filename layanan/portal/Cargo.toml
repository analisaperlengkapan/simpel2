[package]
name = "layanan-portal"
version = "0.1.0"
edition = "2024"
description = "Unified Portal Backend for Daskrimti - Dashboard, Configuration, and Reports"

[[bin]]
name = "portal"
path = "src/main.rs"

[dependencies]
# Web Framework
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }

# Caching
redis = { workspace = true }

# gRPC Client - using explicit 0.14 versions to match tonic-prost
tonic = { workspace = true }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
dotenvy = { workspace = true }

# Shared Library
lib-common = { path = "../../lib/common", features = ["backend", "jwt", "grpc", "encryption", "crypto", "validation"] }

[dev-dependencies]
axum-test = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14"

[features]
default = []
