[package]
name = "layanan-pidsus"
version.workspace = true
edition.workspace = true
authors = ["SIMPelv2 Team"]
description = "pidsus service for SIMPelv2"

[features]
integration-tests = []

[dependencies]
axum = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
tokio-postgres = { version = "0.7.14", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
postgres-types = { version = "0.2.10", features = ["derive", "with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
garde = { version = "0.22", features = ["derive", "email"] }
dotenvy = "0.15"
thiserror = "2.0.17"
lib-common = { workspace = true, features = ["db", "telemetry"] }
