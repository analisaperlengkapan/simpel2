[package]
name = "secreton-core"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Core types and utilities for Secreton vault system"
keywords = ["core", "types", "utilities", "security"]

[dependencies]
# Core dependencies
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true

# Async runtime
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true

# HTTP client (for external API calls like Authenc)
reqwest.workspace = true

# WASM runtime
wasmtime = { version = "36.0.10", optional = true }

# Database
deadpool-postgres.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true

# Cache
redis.workspace = true

# Cryptography
argon2.workspace = true
rand.workspace = true
ring.workspace = true
x509-parser.workspace = true
aes-gcm.workspace = true
sha2.workspace = true
zeroize.workspace = true
hmac.workspace = true
flate2.workspace = true

# TOTP/OTP support
totp-lite.workspace = true
data-encoding.workspace = true

# SSH key generation and certificate signing
ssh-key.workspace = true
ssh-encoding.workspace = true

# AWS SDK for secrets engine
aws-config.workspace = true
aws-sdk-iam.workspace = true
aws-sdk-sts.workspace = true
aws-types.workspace = true
aws-credential-types.workspace = true

# PKI dependencies
rcgen.workspace = true
pem.workspace = true

# Utilities
config.workspace = true
lru.workspace = true
base64.workspace = true
hex.workspace = true
urlencoding.workspace = true
bincode.workspace = true
toml.workspace = true
glob.workspace = true
parking_lot.workspace = true
log.workspace = true
getrandom.workspace = true
regex.workspace = true
ipnetwork.workspace = true
url.workspace = true
sysinfo = "0.33.1"
jsonwebtoken.workspace = true

# Internal crates
secreton-hsm.workspace = true
totp-rs.workspace = true
secreton-types.workspace = true
secreton-crypto.workspace = true
secreton-storage.workspace = true

# Common library
lib-core = { workspace = true, features = ["validation"] }
lib-backend = { workspace = true, features = [
  "redis-cache",
  "telemetry",
  "db",
] }

[dev-dependencies]
tempfile.workspace = true
wiremock = { workspace = true }
proptest.workspace = true

[features]
default = []
test-utils = []
enable-inline-tests = []
consul = ["secreton-storage/consul"]
redis = []

# Forward storage backend features
postgres = ["secreton-storage/postgres"]
raft-consensus = ["secreton-storage/raft-consensus"]

# gRPC utilities (for correlation context integration)
grpc = []

# WASM policy engine support (future feature)
# Note: Requires wasmtime dependency when enabled
wasm = ["dep:wasmtime"]

workflow-tests = []
integration-tests = []
