[package]
name = "secreton-grpc"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
raft-consensus = ["secreton-storage/raft-consensus"]
enable-inline-tests = []
metrics = ["dep:metrics"]

[dependencies]
# Internal dependencies
secreton-core.workspace = true
secreton-storage.workspace = true
secreton-crypto.workspace = true


# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# gRPC
tonic = { workspace = true }
prost = { workspace = true }
tonic-prost = { workspace = true }

# Client authentication (tower layer on the server builder + cert parsing)
tower = { workspace = true }
http = { workspace = true }
x509-parser = { workspace = true }
hex = { workspace = true }

# TLS
rustls = { workspace = true }
tokio-rustls = { workspace = true }

# Utilities
uuid = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }

# Metrics (optional, for production monitoring)
metrics = { workspace = true, optional = true }

# Compression (for snapshots)
flate2 = { workspace = true, optional = true }
sha2 = { workspace = true }

# Database (for mock pool in gRPC service)
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }
chrono = { workspace = true }
rustc_version = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The mTLS enforcement test issues its own CA + server/client certs at runtime,
# so the assertions run against a real handshake instead of fixture files that
# would quietly expire.
rcgen = { workspace = true }
