[package]
name = "secreton-auto-unseal"
version.workspace = true
edition = "2024"
rust-version = "1.90"
license.workspace = true

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# UUID for correlation IDs
uuid = { workspace = true, features = ["v4", "serde"] }

# Timestamps for audit logging
chrono = { workspace = true }

# Internal dependencies
secreton-core = { path = "../core" }
secreton-grpc = { path = "../grpc", optional = true }

# Optional cloud provider dependencies
aws-config = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
google-cloudkms1 = { workspace = true, optional = true }
azure_security_keyvault = { workspace = true, optional = true }
azure_identity = { workspace = true, optional = true }
azure_core = { workspace = true, optional = true }

# gRPC for Transit provider
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

# Base64 encoding for Transit
base64 = { workspace = true, optional = true }

[features]
default = ["transit"]
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms"]
gcp-kms = ["dep:google-cloudkms1"]
azure-kv = [
  "dep:azure_security_keyvault",
  "dep:azure_identity",
  "dep:azure_core",
]
transit = ["dep:tonic", "dep:prost", "dep:base64", "dep:secreton-grpc"]
all-providers = ["aws-kms", "gcp-kms", "azure-kv", "transit"]

[dev-dependencies]
tokio-test = { workspace = true }
proptest.workspace = true
toml = { workspace = true }
