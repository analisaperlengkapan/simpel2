[package]
name = "secreton-auto-unseal"
publish = false
version.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }

# UUID for correlation IDs
uuid = { workspace = true, features = ["v4", "serde"] }

# Timestamps for audit logging
chrono = { workspace = true }

# Internal dependencies
secreton-core = { path = "../core" }
secreton-grpc = { path = "../grpc", optional = true }

# Optional cloud provider dependencies
aws-config = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
google-cloudkms1 = { workspace = true, optional = true }

# gRPC for Transit provider
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

# Base64 encoding for Transit
base64 = { workspace = true, optional = true }

[features]
default = ["transit"]
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms"]
gcp-kms = ["dep:google-cloudkms1"]
# `azure_kv.rs` is an explicit stub that imports NO azure crate — every method
# returns ProviderError pending an SDK port. The three azure deps this feature
# used to pull were therefore entirely unreferenced, while dragging in
# azure_core 0.21 -> http-types 2.12 -> rand 0.7.3 (GHSA-cq8v-f236-94qc).
# azure_security_keyvault has no release past 0.21.0, so the port must move to
# the successor crates anyway; re-add deps then, at the versions it needs.
azure-kv = []
transit = ["dep:tonic", "dep:prost", "dep:base64", "dep:secreton-grpc"]
all-providers = ["aws-kms", "gcp-kms", "azure-kv", "transit"]

[dev-dependencies]
tokio-test = { workspace = true }
proptest.workspace = true
toml = { workspace = true }
