[package]
name = "secreton-replication"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
# Internal dependencies
secreton-core = { path = "../core" }
secreton-storage = { path = "../storage" }
secreton-types = { path = "../types" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Time
chrono = "0.4"

# gRPC (for replication communication)
tonic = { version = "0.14" }
prost = "0.14"

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Compression
flate2 = "1.0"
zstd = "0.13"

# Hashing
sha2 = "0.10"

# Serialization (for snapshots)
bincode = "1.3"

# Metrics
prometheus = "0.13"
lazy_static = "1.4"

[dev-dependencies]
tokio-test = "0.4"
proptest.workspace = true
