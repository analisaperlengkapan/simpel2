[package]
name = "secreton-replication"
publish = false
version.workspace = true
edition = "2024"
rust-version.workspace = true

[dependencies]
# Internal dependencies
secreton-core = { path = "../core" }
secreton-storage = { path = "../storage" }
secreton-types = { path = "../types" }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Time
chrono = { workspace = true }

# gRPC (for replication communication)
tonic = { workspace = true }
prost = { workspace = true }

# UUID
uuid = { workspace = true, features = ["v4", "serde"] }

# Compression
flate2 = { workspace = true }
zstd = "0.14"  # >= 0.14.3 for RUSTSEC-2026-0391; zstd-safe 8.2 for 0398/0403

# Hashing
sha2 = { workspace = true }

# Serialization (for snapshots)
bincode = { workspace = true }

# Metrics
prometheus = { workspace = true }
lazy_static = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
proptest.workspace = true
