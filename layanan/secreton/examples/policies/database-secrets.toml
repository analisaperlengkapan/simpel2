# Database Secrets Policy
#
# This policy grants scoped access to database credentials stored in the vault.
# It demonstrates path-specific access control with MFA requirements for
# sensitive production database credentials.
#
# Use case: Applications needing database access, database administrators,
# automated deployment pipelines

# Policy metadata
name = "database-secrets"
description = "Scoped access to database credentials with MFA for production"
namespace = "default"

# Rule 1: Read access to development database credentials
# No MFA required for development environments
[[rules]]
effect = "allow"
path = "secret/data/database/dev/*"
capabilities = ["read", "list"]

# Rule 2: Read access to staging database credentials
# No MFA required for staging environments
[[rules]]
effect = "allow"
path = "secret/data/database/staging/*"
capabilities = ["read", "list"]

# Rule 3: Read access to production database credentials with MFA
# Production access requires multi-factor authentication for security
[[rules]]
effect = "allow"
path = "secret/data/database/prod/*"
capabilities = ["read", "list"]
mfa = true

# Rule 4: Read access to production credentials with IP restrictions
# Additional security layer: only allow access from specific networks
[[rules]]
effect = "allow"
path = "secret/data/database/prod/*"
capabilities = ["read"]
mfa = true

[rules.condition]
# Only allow access from internal networks
allowed_ips = ["10.0.0.0/8", "192.168.1.0/24"]

# Rule 5: Deny access to admin database credentials
# Even with this policy, admin credentials are explicitly denied
[[rules]]
effect = "deny"
path = "secret/data/database/*/admin"
capabilities = ["*"]

# Rule 6: Deny access to root database credentials
# Root credentials should only be accessible to vault administrators
[[rules]]
effect = "deny"
path = "secret/data/database/*/root"
capabilities = ["*"]

# Rule 7: Allow listing database metadata
# Enables discovery of available database credential paths
[[rules]]
effect = "allow"
path = "secret/metadata/database/*"
capabilities = ["list"]

# Rule 8: Deny write operations to database secrets
# This policy is read-only; credential rotation should be handled separately
[[rules]]
effect = "deny"
path = "secret/data/database/*"
capabilities = ["create", "update", "delete"]
