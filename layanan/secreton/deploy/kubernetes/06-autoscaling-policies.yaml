# HorizontalPodAutoscaler for Secreton
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secreton-hpa
  namespace: secreton
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: secreton
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

---
# PodDisruptionBudget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: secreton-pdb
  namespace: secreton
spec:
  minAvailable: 2  # At least 2 pods must be available
  selector:
    matchLabels:
      app: secreton

---
# NetworkPolicy for network segmentation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secreton-network-policy
  namespace: secreton
spec:
  podSelector:
    matchLabels:
      app: secreton
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8200
    - protocol: TCP
      port: 8201
  - from:
    - podSelector:
        matchLabels:
          app: secreton
    ports:
    - protocol: TCP
      port: 8300  # Cluster communication
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8200  # Metrics
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: secreton
    ports:
    - protocol: TCP
      port: 8300  # Cluster communication
  - to:  # DNS
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
