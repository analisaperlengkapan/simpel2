# Secreton Staging Secrets — EXAMPLE FILE
# ⚠️  This file contains CHANGEME placeholders only.
#     To deploy with real credentials:
#       1. Copy this file:  cp 01-secrets.yaml 01-secrets.local.yaml
#       2. Fill in real values in 01-secrets.local.yaml (gitignored)
#       3. Apply:  kubectl apply -f 01-secrets.local.yaml -n simpelv2-staging
#     DO NOT commit real credentials to this file.
#
# For production, use Secreton SecretSync CRDs (see layanan/secreton/crates/k8s-operator/).
#
# ⚠️  WARNING: This file creates a "postgres-credentials" Secret with keys specific to
#     the secreton standalone deploy (postgres-password, secreton-storage-url, authenc-url).
#     The main kustomize path (infra/k8s/overlays/staging/staging-secrets.yaml) creates the
#     SAME Secret name with DIFFERENT keys. Applying both will clobber keys from the first.
#     See infra/k8s/AGENTS.md "Updating Secrets" for details.
#
# ⚠️  NOTE on gRPC port: The [grpc] address below binds to port 8201.
#     The kustomize deploy path (infra/k8s/base/infrastructure/secreton.yaml) exposes
#     gRPC on port 9000 instead. These are two different deployment configurations.
#     The kustomize path is used for the main cluster; this standalone path is for
#     independent secreton deployments only.

# Secret for Secreton configuration
apiVersion: v1
kind: Secret
metadata:
  name: secreton-config
  namespace: simpelv2-staging
type: Opaque
stringData:
  secreton.toml: |
    log_level = "info"
    log_format = "json"

    [storage]
    backend = "postgres"

    [database]
    host = "postgres-primary"
    port = 5432
    database = "secreton"
    username = "secreton"
    password = "CHANGEME"
    max_connections = 50

    [http]
    address = "0.0.0.0:8200"
    tls_enabled = false

    [grpc]
    enabled = true
    address = "0.0.0.0:8201"

    [seal]
    type = "shamir"
    shares = 5
    threshold = 3

    [telemetry]
    prometheus_enabled = true
    metrics_path = "/metrics"

---
# Secret for PostgreSQL credentials (standalone secreton deploy path)
# NOTE: The authenc-url below points to the "simpelv2" database (not "authenc").
# This is intentional for the standalone secreton deploy where authenc shares the
# main simpelv2 database. The kustomize path (staging-secrets.example.yaml) uses
# a dedicated /authenc database instead.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: simpelv2-staging
type: Opaque
stringData:
  postgres-password: CHANGEME
  secreton-storage-url: "postgresql://secreton:CHANGEME@postgres-primary:5432/secreton?sslmode=disable"
  authenc-url: "postgres://simpelv2:CHANGEME@postgres:5432/simpelv2"
