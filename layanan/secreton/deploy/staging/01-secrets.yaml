# Secret for Secreton configuration
apiVersion: v1
kind: Secret
metadata:
  name: secreton-config
  namespace: simpelv2-staging
type: Opaque
stringData:
  secreton.toml: |
    log_level = "info"
    log_format = "json"

    [storage]
    backend = "postgres"

    [database]
    host = "postgres-primary"
    port = 5432
    database = "secreton"
    username = "secreton"
    password = "CHANGEME_IN_PRODUCTION"
    max_connections = 50

    [http]
    address = "0.0.0.0:8200"
    tls_enabled = false

    [grpc]
    enabled = true
    address = "0.0.0.0:8201"

    [seal]
    type = "shamir"
    shares = 5
    threshold = 3

    [telemetry]
    prometheus_enabled = true
    metrics_path = "/metrics"

---
# Secret for PostgreSQL credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: simpelv2-staging
type: Opaque
stringData:
  postgres-password: simpelv2_staging_password
  secreton-storage-url: "postgresql://secreton:CHANGEME_IN_PRODUCTION@postgres-primary:5432/secreton?sslmode=disable"
  authenc-url: "postgres://simpelv2:simpelv2_staging_password@postgres:5432/simpelv2"
