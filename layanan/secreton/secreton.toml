# Secreton Enterprise Vault - Bootstrap Configuration
# This file contains minimal infrastructure config for startup
# NO APPLICATION SECRETS should be in this file

log_level = "info"
log_format = "json"

# ================================
# Storage Configuration
# ================================
[storage]
backend = "postgres"
max_connections = 50
# Connection URL from environment: SECRETON_STORAGE_URL

# ================================
# HTTP Listener
# ================================
[http]
address = "0.0.0.0:8200"
tls_enabled = false

# ================================
# gRPC Listener
# ================================
[grpc]
enabled = true
address = "0.0.0.0:9000"

# ================================
# Seal Configuration (Shamir)
# ================================
[seal]
type = "shamir"
shares = 5
threshold = 3

# ================================
# Telemetry
# ================================
[telemetry]
# service_name = "secreton"
# otlp_endpoint = "http://localhost:4317"
