[package]
name = "simpelv2-portal"
version.workspace = true
edition.workspace = true
authors = ["SIMPelv2 Team"]
description = "SIMPelv2 - Layanan Portal Backend"
license = "MIT"

[dependencies]
# Core Axum Framework
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Shared Libraries
lib-middleware = { path = "../../lib/middleware" }
lib-utils = { path = "../../lib/utils" }

# Database & Persistence
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }
postgres-types = { workspace = true }
redis = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Validation & Errors
garde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
prometheus = { workspace = true }
sentry = { workspace = true }

# Utilities
uuid = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
dotenvy = { workspace = true }

# HTTP Client untuk komunikasi dengan microservices lain
reqwest = { workspace = true }

# Chart & Analytics specific - Disabled due to fontconfig dependency
# plotters = "0.3"
ndarray = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
reqwest = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["analytics", "real-time"]
analytics = []
real-time = []
charts = []

[[bin]]
name = "simpelv2-portal"
path = "src/main.rs"

