syntax = "proto3";

package common.v1;

// Common types shared across all services

// Pagination
message Pagination {
  int32 page = 1;
  int32 per_page = 2;
  int32 total = 3;
  int32 total_pages = 4;
}

// Error details
message ErrorDetail {
  string code = 1;
  string message = 2;
  map<string, string> metadata = 3;
}

// Timestamp range
message TimeRange {
  int64 start = 1;
  int64 end = 2;
}

// Metadata
message Metadata {
  map<string, string> labels = 1;
  map<string, string> annotations = 2;
  int64 created_at = 3;
  int64 updated_at = 4;
  string created_by = 5;
  string updated_by = 6;
}

// Request context
message RequestContext {
  string request_id = 1;
  string user_id = 2;
  string session_id = 3;
  string ip_address = 4;
  string user_agent = 5;
  map<string, string> headers = 6;
}

// Response status
message Status {
  StatusCode code = 1;
  string message = 2;
  repeated ErrorDetail details = 3;
}

enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;
  OK = 1;
  INVALID_ARGUMENT = 2;
  NOT_FOUND = 3;
  ALREADY_EXISTS = 4;
  PERMISSION_DENIED = 5;
  UNAUTHENTICATED = 6;
  RESOURCE_EXHAUSTED = 7;
  FAILED_PRECONDITION = 8;
  ABORTED = 9;
  OUT_OF_RANGE = 10;
  UNIMPLEMENTED = 11;
  INTERNAL = 12;
  UNAVAILABLE = 13;
  DATA_LOSS = 14;
  DEADLINE_EXCEEDED = 15;
}

// Audit trail
message AuditTrail {
  string event_id = 1;
  string event_type = 2;
  string actor_id = 3;
  string resource_type = 4;
  string resource_id = 5;
  string action = 6;
  bool success = 7;
  int64 timestamp = 8;
  string ip_address = 9;
  map<string, string> metadata = 10;
}

// Health check common
message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  HealthInfo info = 1;
}

message HealthInfo {
  string service_name = 1;
  string version = 2;
  HealthStatus status = 3;
  int64 uptime_seconds = 4;
  map<string, DependencyHealth> dependencies = 5;
}

message DependencyHealth {
  string name = 1;
  HealthStatus status = 2;
  optional string error = 3;
  int64 response_time_ms = 4;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTHY = 1;
  DEGRADED = 2;
  UNHEALTHY = 3;
}

// Metrics common
message MetricsSnapshot {
  int64 timestamp = 1;
  map<string, double> gauges = 2;
  map<string, int64> counters = 3;
  map<string, Histogram> histograms = 4;
}

message Histogram {
  int64 count = 1;
  double sum = 2;
  double min = 3;
  double max = 4;
  double mean = 5;
  map<string, double> percentiles = 6;
}
