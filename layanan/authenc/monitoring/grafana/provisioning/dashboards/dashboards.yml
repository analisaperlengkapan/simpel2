# Grafana Dashboard Provisioning Configuration
apiVersion: 1

providers:
  - name: "Authenc Dashboards"
    orgId: 1
    folder: "Authenc"
    folderUid: "authenc"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
