once_cell = "1.19"

# Additional dependencies
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1.18", features = ["full"] }
bytes = "1.11.0"

# AI and ML Dependencies
qdrant-client = "1.11"
tiktoken-rs = "0.7.0"
tonic = { version = "0.14.2", features = ["tls-webpki-roots", "transport", "channel"] }

# CLI tools
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.0"
shellexpand = "3.1"
which = "8.0"
k8s-openapi = { version = "0.26", features = ["latest"] }
kube = { version = "2.0", features = [
    "runtime",
    "derive",
    "rustls-tls",
], default-features = false }

# =============================================================================
# Secreton Integrated Dependencies
# =============================================================================
chacha20poly1305 = "0.10.1"
pbkdf2 = "0.12"
sha3 = "0.10.8"
digest = "0.10"
signature = "2.2"
elliptic-curve = "0.13"
k256 = "0.13"

generic-array = "1.3"
aes = "0.8.4"
scrypt = "0.11"
cbc = "0.1"
rcgen = "0.13"
pem = "3.0"
der-parser = "9.0"
aide = { version = "0.15.1", features = ["axum", "macros"] }
secrecy = { version = "0.10.3", features = ["serde"] }
warp = "0.4.2"
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
openidconnect = "3.5"
data-encoding = "2.6"
fpe = "0.6.1"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "std"] }
ssh-encoding = "0.2"
aws-config = "1.5"
aws-sdk-s3 = "1.45"
aws-sdk-iam = "1.45"
aws-sdk-sts = "1.45"
aws-sdk-kms = "1.45"
aws-types = "1.3"
aws-credential-types = "1.2"
google-cloudkms1 = "5.0"
azure_security_keyvault = "0.20"
num-bigint = "0.4"
num-traits = "0.2"
clap_complete = "4.4"
dialoguer = "0.11"
dirs = "6.0.0"
comfy-table = "7.1"
rpassword = "7.3"
tokio-postgres-rustls = "0.13.0"
tokio-rustls = "0.26"
ipnetwork = "0.20"
lru = "0.16.3"
glob = "0.3"
parking_lot = "0.12.5"
openraft = { version = "0.9.21", features = ["serde"] }
slog = "2.8.2"
slog-term = "2.9.2"
slog-async = "2.8"
rand_core = { version = "0.6", features = ["getrandom"] }

# Testing & Build Dependencies
criterion = { version = "0.7.0", features = ["html_reports"] }
proptest = { version = "1.8.0", default-features = false, features = ["std"] }

pretty_assertions = "1.4.1"
rustc_version = "0.4"

# NOTE: Secreton and Authenc inter-crate dependencies should NOT be here
# They are separate workspaces with their own dependency management
# If main workspace crates need to communicate with them, use gRPC
