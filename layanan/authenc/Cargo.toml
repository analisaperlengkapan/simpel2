# Authenc is part of the main simpelv2 workspace
# Workspace dependencies are managed in root Cargo.toml

[package]
name = "authenc"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["SIMPEL Team <security@kejaksaan.go.id>"]
license = "Apache-2.0"
description = "Enterprise-grade Identity and Access Management (IAM) service for SIMPEL"
repository = "https://github.com/analisaperlengkapan/simpel2"
homepage = "https://simpel.kejaksaan.go.id"
documentation = "https://docs.simpel.kejaksaan.go.id/authenc"
keywords = ["iam", "authentication", "authorization", "security", "rust"]
categories = ["authentication", "cryptography", "web-programming"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "authenc"
path = "src/main.rs"

[[bin]]
name = "generate-signing-keys"
path = "src/bin/generate-signing-keys.rs"

[features]
# Framework features
default = [
    "axum",
    "auth",
    "oidc",
    "db",
    "metrics",
    "flate2",
    "totp-rs",
    "rdkafka",
    "dep:reqwest",
    "test",
    "grpc",
]
axum = ["dep:axum", "dep:tower", "dep:tower-http"]
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:prost-types"]

# Authentication features
auth = ["dep:jsonwebtoken", "dep:argon2"]
oidc = [
    "dep:url",
] # Using Ed25519 for OIDC JWT signing (RSA removed due to RUSTSEC-2023-0071)

# Database features
db = ["dep:tokio-postgres", "dep:deadpool-postgres"]

# Monitoring features
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus"]

# Development features (enables all features)
dev = [
    "axum",
    "auth",
    "oidc",
    "db",
    "metrics",
    "dep:reqwest",
    "rdkafka",
    "totp-rs",
    "flate2",
    "admin_console",
    "quantum",
]

# RBAC feature
rbac = []
flate2 = [] # Now part of main dependencies
test = ["dep:reqwest"]
integration-tests = []
admin_console = []

# Quantum-resistant cryptography features
quantum = ["dep:pqcrypto-mldsa", "dep:pqcrypto-mlkem", "dep:pqcrypto-falcon"]
# tpm = ["dep:tss-esapi"]

[dependencies]
# Core async runtime
anyhow = "1.0.100"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "full"] }
futures = "0.3.31"
futures-util = "0.3.31"
tokio-util = { version = "0.7.13", features = ["full"] }
async-trait = "0.1.85"
pin-project = "1.1.8"

# CLI tools
clap = { version = "4.5", features = ["derive"] }

# HTTP and web frameworks
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.2"
temp-env = "0.3.6"

# Web Frameworks and HTTP
axum = { version = "0.8.6", optional = true, features = [
    "http1",
    "http2",
    "json",
    "macros",
] }
tower = { version = "0.5.2", optional = true, features = [
    "util",
    "timeout",
    "load-shed",
    "limit",
] }
tower-http = { version = "0.6.6", optional = true, features = [
    "cors",
    "trace",
    "compression-br",
    "fs",
    "add-extension",
] }
hyper = { version = "1.7.0", features = ["full"] }
reqwest = { version = "0.12.24", optional = true, features = [
    "json",
    "blocking",
] }

# Authentication and Security
jsonwebtoken = { version = "10.1.0", optional = true, default-features = false, features = [
    "aws_lc_rs",
] }
argon2 = { version = "0.5", optional = true, features = ["std", "rand"] }
bcrypt = "0.17.1"
# RSA REMOVED: Vulnerable to timing attacks (RUSTSEC-2023-0071) - replaced with Ed25519

# Database
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
# Inherit all workspace features for postgres-types including derive and type serializers
postgres-types = { workspace = true }
refinery = { workspace = true, features = ["tokio-postgres"] }
redis = { workspace = true }
lru = "0.16.3"

# Serialization & Data
uuid = { workspace = true, features = ["v4", "serde", "js"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8"
thiserror = "2.0.17"
once_cell = "1.20.2"

# Validation
garde = { version = "0.22.0", features = ["full"] }

# Additional utilities (moved from above)

# Compression (fix for missing flate2)
flate2 = { version = "1.1.5", features = ["zlib"] }

# Logging and Tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
    "fmt",
    "json",
] }
tracing-opentelemetry = "0.32.0"
opentelemetry = "0.31.0"
opentelemetry-otlp = "0.31.0"
log = "0.4.27"
env_logger = "0.11.7"

# gRPC and Protocol Buffers
tonic = { version = "0.14", features = ["transport", "tls-webpki-roots"], optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }

# Cryptography
rand = "0.8"
rand_chacha = "0.3"
getrandom = "0.3"                                                      # v0.3 has breaking API changes
aes-gcm = "0.10"
base64 = "0.22"
base64ct = "1.8"                                                       # Constant-time base64 for security-critical operations
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
p384 = { version = "0.13", features = ["ecdsa", "jwk"] }
p521 = { version = "0.13", features = ["ecdsa", "jwk"] }
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
ed448-goldilocks = "0.9.0"
x509-parser = "0.18.0"
sha2 = "0.10"
hex = "0.4"

# Time & Concurrency
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"  # For tokio-postgres timestamp serialization
dashmap = { version = "6.1.0", features = ["raw-api"] }
num_cpus = "1.16"
serde_qs = "0.15.0"
url = { version = "2.5.4", optional = true }
urlencoding = "2.1"

# Messaging
rdkafka = { version = "0.38", features = ["tokio", "ssl-vendored"], optional = true }

# Object Storage (S3/MinIO)
aws-sdk-s3 = "1.90.0"
aws-config = "1.5.15"
aws-credential-types = "1.2.1"

# TOTP (Time-based One-Time Password)
totp-rs = { version = "5.7", default-features = false, optional = true }
base32 = "0.5"                                                           # v0.5 has breaking API changes (RFC4648 renamed)
hmac = "0.12"
sha1 = "0.10"
qrcode = "0.14"

# WebAuthn/FIDO2 Authentication
webauthn-rs = { version = "0.5", features = [
    "danger-allow-state-serialisation",
] }
webauthn-rs-proto = "0.5"

# LDAP
ldap3 = "0.12.1"

# SAML XML Processing
quick-xml = { version = "0.38.3", features = ["serialize"] }

# Kubernetes Operator
kube = { version = "2.0.1", features = ["runtime", "derive"] }
k8s-openapi.workspace = true
schemars = "1.0"                                               # Updated for kube 2.0.1 compatibility
tokio-stream = "0.1"

# TLS & Security (Pure Rust)
rustls = { version = "0.23.34" }
rustls-pemfile = "2.2"
rustls-native-certs = "0.8.2"
webpki-roots = "1.0"
ring = "0.17"
regex = "1.12.2"

# OpenSSL (Only for PKCS12 and advanced X.509 operations)
openssl = "0.10.74"

# Post-Quantum Cryptography
pqcrypto-mldsa = { version = "0.1.2", optional = true }
pqcrypto-mlkem = { version = "0.1.1", optional = true }
pqcrypto-falcon = { version = "0.4.1", optional = true }
pqcrypto-traits = "0.3.5"

# TPM / Hardware Security
# tss-esapi = { version = "7.5.0", optional = true }

# Shamir Secret Sharing dependencies
curve25519-dalek = "4.1"
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
bincode = "1.3"                                              # v2.0 has completely different API
hkdf = "0.12"

# Metrics
metrics = { version = "0.24.2", optional = true }
metrics-exporter-prometheus = { version = "0.17.2", default-features = false, features = [
    "http-listener",
], optional = true }
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
axum-test = "18.2.1"

# Common library
lib-common = { path = "../../lib/common", features = ["validation", "redis-cache", "telemetry", "db", "axum", "crypto", "encryption"] }

# Internal crates
authenc-types = { path = "crates/types" }
authenc-crypto = { path = "crates/crypto" }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
serial_test = "3.2"
lazy_static = "1.5"
criterion = { version = "0.7.0", features = ["html_reports", "async_tokio"] }
proptest = "1.5"
# sqlx removed - using tokio-postgres + deadpool-postgres for better compile speed and flexibility

[build-dependencies]
tonic-prost-build = "0.14"

[[bench]]
name = "performance"
harness = false

# Performance optimizations
# Performance optimization profiles
[profile.dev]
# Faster compile times for development
opt-level = 1                # Light optimization for better dev experience
debug = true                 # Keep debug info for development
incremental = true           # Enable incremental compilation
codegen-units = 256          # Parallel compilation for faster builds
lto = false                  # Disable LTO in dev for faster incremental builds
split-debuginfo = "unpacked" # Faster debug builds on Linux/macOS

[profile.release]
# Maximum optimization for production
opt-level = 3           # Maximum optimization level
lto = "fat"             # Full LTO for maximum optimization
codegen-units = 1       # Single codegen unit for best optimization
panic = "abort"         # Smaller binary, faster panics
strip = true            # Strip symbols for smaller binary
overflow-checks = false # Disable overflow checks for performance
debug = false           # No debug info in release
incremental = false     # Disable incremental for clean release builds

# Optimize dependencies in dev mode for faster runtime
[profile.dev.package."*"]
opt-level = 2 # Optimize dependencies while keeping fast compile times

# Optimize specific heavy dependencies
[profile.dev.package.tokio]
opt-level = 3 # Tokio benefits from optimization

[profile.dev.package.axum]
opt-level = 3 # Axum benefits from optimization

[workspace]

members = [
    "crates/api",
    "crates/core",
    "crates/crypto",
    "crates/federation",
    "crates/grpc",
    "crates/iam-api",
    "crates/mfa",
    "crates/storage",
    "crates/types",
    "crates/webauthn"
]


[workspace.package]

version = "0.1.0"
edition = "2024"
authors = ["SIMPEL Team"]
license = "Apache-2.0"
rust-version = "1.90"


[workspace.dependencies]

# Axum Backend Dependencies - Latest Stable
axum = { version = "0.8.7", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.12.2", features = ["typed-header"] }
tokio = { version = "1.47.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "limit",
    "auth",
    "fs",
    "compression-gzip",
    "timeout",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
uuid = { version = "1.19.0", features = ["v4", "serde", "js"] }
time = { version = "0.3.44", features = ["serde", "macros"] }
chrono = { version = "0.4.42", features = ["serde"] }
tokio-cron-scheduler = "0.13.0"
anyhow = "1.0.100"
thiserror = "2.0.17"
dotenvy = "0.15.7" # Maintained fork of dotenv

# PostgreSQL Database Dependencies (Optimized for security & performance)
tokio-postgres = { version = "0.7.16", features = [
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-time-0_3",
] }
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
postgres-types = { version = "0.2.12", features = [
    "derive",
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-time-0_3",
] }
refinery = { version = "0.9.0", features = ["tokio-postgres"] }
sea-query = { version = "0.32.7", features = [
    "postgres-array",
    "with-chrono",
    "with-uuid",
] }

# Security & Authentication (Updated for latest security)
# Ed25519 preferred over RSA for better security and performance
argon2 = "0.5.3"
jsonwebtoken = { version = "10.1.0", default-features = false, features = [
    "aws_lc_rs",
    "use_pem",
] } # Updated to v10 with aws_lc_rs backend
oauth2 = "5.0.0"
rand = { version = "0.8.5", features = [
    "std",
    "std_rng",
] } # Downgraded to 0.8.5 for crypto ecosystem compatibility (rand_core 0.6)
ed25519-dalek = { version = "2.2.0", features = [
    "rand_core",
    "serde",
] } # Primary signing algorithm (preferred over RSA)
x25519-dalek = { version = "2.0.1", features = [
    "serde",
    "static_secrets",
] } # Key exchange

# WebAuthn/Passkeys (MANDATORY - PRIMARY authentication method)
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"

# Note: No external vault dependencies (using internal Secreton system)
# vaultrs removed - we use our own Secreton implementation

# Proc Macro Dependencies (secure alternatives)
syn = { version = "2.0.111", features = [
    "full",
    "parsing",
    "printing",
    "proc-macro",
] }
quote = "1.0"
proc-macro2 = "1.0.103"
# Note: Removed paste/pastey - using inline macros instead (paste is unmaintained)

# Frontend Shared Dependencies
lib-ui = { path = "../../lib/ui" }
lib-common = { path = "../../lib/common" }
lib-perlengkapan = { path = "../../lib/perlengkapan" }
regex = "1.11"
urlencoding = "2.1"

# Database & Caching (Updated)
redis = { version = "0.32.7", features = [
    "tokio-comp",
    "connection-manager",
    "aio",
] }
mongodb = "3.3.0"

# Message Queue & Event Streaming
amqprs = { version = "2.0", features = ["tls"] }
tokio-stream = "0.1"

# Configuration & Templates (Updated)
config = { version = "0.15.19", default-features = false, features = [
    "toml",
    "json",
    "yaml",
    "ini",
    "ron",
    "convert-case",
    "async",
] } # Drop json5 feature to avoid unmaintained dependency
tera = "1.20.1"

# HTTP Client - Unified version
reqwest = { version = "0.12", features = [
    "json",
    "multipart",
    "stream",
    "rustls-tls",
], default-features = false }
# NOTE: ureq removed - using async-only reqwest per PR #211 optimization

# Validation & Serialization - Updated for security (removes idna vulnerability)
garde = { version = "0.22", features = [
    "derive",
    "serde",
] } # Modern validator replacement (no idna dependency)
validator = { version = "0.19", features = ["derive"] } # Legacy validator (kept for datun compatibility)
nutype = { version = "0.6.2", features = [
    "serde",
    "validate",
] } # Additional validation without idna

# Monitoring & Observability (Updated to latest)
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["tonic", "tls"] }
prometheus = "0.14"
sentry = { version = "0.46.0", features = ["tracing"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18.0"
tracing-opentelemetry = "0.32.0"

# Email and Notifications
