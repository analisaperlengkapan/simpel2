syntax = "proto3";

package raft.v1;

import "common.proto";

// Raft RPC Service for peer-to-peer communication
service RaftService {
  // AppendEntries RPC - log replication and heartbeats
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

  // Vote RPC - leader election
  rpc Vote(VoteRequest) returns (VoteResponse);

  // InstallSnapshot RPC - snapshot transfer
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// Log identifier
message LogId {
  uint64 term = 1;
  uint64 index = 2;
  uint64 leader_id = 3;
}

// Vote information
message Vote {
  uint64 term = 1;
  uint64 node_id = 2;
  bool committed = 3;
}

// Log entry
message LogEntry {
  LogId log_id = 1;
  bytes payload = 2;
}

// AppendEntries RPC Request
message AppendEntriesRequest {
  Vote vote = 1;
  LogId prev_log_id = 2;
  repeated LogEntry entries = 3;
  LogId leader_commit = 4;
}

// AppendEntries RPC Response
message AppendEntriesResponse {
  Vote vote = 1;
  bool success = 2;
  optional LogId conflict_log_id = 3;
}

// Vote RPC Request
message VoteRequest {
  Vote vote = 1;
  LogId last_log_id = 2;
}

// Vote RPC Response
message VoteResponse {
  Vote vote = 1;
  bool vote_granted = 2;
  optional LogId last_log_id = 3;
}

// InstallSnapshot RPC Request
message InstallSnapshotRequest {
  Vote vote = 1;
  SnapshotMeta meta = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool done = 5;
}

// Snapshot metadata
message SnapshotMeta {
  optional LogId last_log_id = 1;
  Membership last_membership = 2;
  string snapshot_id = 3;
}

// Membership configuration
message Membership {
  repeated uint64 voter_ids = 1;
  repeated uint64 learner_ids = 2;
}

// InstallSnapshot RPC Response
message InstallSnapshotResponse {
  Vote vote = 1;
}
