syntax = "proto3";

package authenc.v1;

import "common.proto";

// Authenc IAM Service - Identity and Access Management
service AuthencService {
  // Authentication
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);

  // User Management
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // Multi-Factor Authentication
  rpc EnableMFA(EnableMFARequest) returns (EnableMFAResponse);
  rpc VerifyMFA(VerifyMFARequest) returns (VerifyMFAResponse);
  rpc DisableMFA(DisableMFARequest) returns (DisableMFAResponse);

  // Authorization & RBAC
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);

  // OAuth2 / OIDC
  rpc GetOAuthToken(OAuthTokenRequest) returns (OAuthTokenResponse);
  rpc IntrospectToken(IntrospectTokenRequest) returns (IntrospectTokenResponse);
  rpc GetUserInfo(UserInfoRequest) returns (UserInfoResponse);

  // Federation
  rpc InitiateFederatedAuth(FederatedAuthRequest) returns (FederatedAuthResponse);
  rpc CompleteFederatedAuth(CompleteFederatedAuthRequest) returns (CompleteFederatedAuthResponse);

  // Audit & Compliance
  rpc GetAuditLogs(AuditLogsRequest) returns (AuditLogsResponse);
  rpc GetComplianceReport(ComplianceReportRequest) returns (ComplianceReportResponse);

  // Health & Metrics
  rpc HealthCheck(common.v1.HealthCheckRequest) returns (common.v1.HealthCheckResponse);

  // CAPTCHA Service
  rpc GenerateCaptchaChallenge(CaptchaChallengeRequest) returns (CaptchaChallengeResponse);
  rpc VerifyCaptchaChallenge(CaptchaVerificationRequest) returns (CaptchaVerificationResponse);
}

// Authentication Messages
message AuthenticateRequest {
  string username = 1;
  string password = 2;
  optional string mfa_code = 3;
  optional string device_id = 4;
  map<string, string> metadata = 5;
  optional string captcha_token = 6;
}

message AuthenticateResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
  UserInfo user = 5;
  repeated string scopes = 6;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message ValidateTokenRequest {
  string token = 1;
  repeated string required_scopes = 2;
}

message ValidateTokenResponse {
  bool valid = 1;
  optional string user_id = 2;
  repeated string scopes = 3;
  optional int64 expires_at = 4;
  optional string error = 5;
  // Richer first-class claims so callers no longer have to parse
  // prefixed entries from `scopes` (`username:...`, `satker:...`, etc.).
  optional string username = 6;
  optional string name = 7;
  optional string nip = 8;
  optional string jabatan = 9;
  optional string satker_code = 10;
  repeated string realm_roles = 11;
}

message RevokeTokenRequest {
  string token = 1;
  TokenType token_type = 2;
}

message RevokeTokenResponse {
  bool success = 1;
}

// User Management Messages
message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  optional string full_name = 4;
  repeated string roles = 5;
  map<string, string> metadata = 6;
}

message CreateUserResponse {
  string user_id = 1;
  string username = 2;
  int64 created_at = 3;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  UserInfo user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  optional string email = 2;
  optional string full_name = 3;
  optional bool is_active = 4;
  map<string, string> metadata = 5;
}

message UpdateUserResponse {
  UserInfo user = 1;
  int64 updated_at = 2;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message ListUsersRequest {
  optional int32 limit = 1;
  optional int32 offset = 2;
  optional string filter = 3;
}

message ListUsersResponse {
  repeated UserInfo users = 1;
  int32 total = 2;
}

message UserInfo {
  string user_id = 1;
  string username = 2;
  string email = 3;
  optional string full_name = 4;
  repeated string roles = 5;
  bool is_active = 6;
  bool mfa_enabled = 7;
  int64 created_at = 8;
  int64 last_login = 9;
}

// MFA Messages
message EnableMFARequest {
  string user_id = 1;
  MFAMethod method = 2;
}

message EnableMFAResponse {
  string secret = 1;
  string qr_code_url = 2;
  repeated string backup_codes = 3;
}

message VerifyMFARequest {
  string user_id = 1;
  string code = 2;
  MFAMethod method = 3;
}

message VerifyMFAResponse {
  bool valid = 1;
}

message DisableMFARequest {
  string user_id = 1;
  string password = 2;
}

message DisableMFAResponse {
  bool success = 1;
}

// Authorization Messages
message CheckPermissionRequest {
  string user_id = 1;
  string resource = 2;
  string action = 3;
  map<string, string> context = 4;
}

message CheckPermissionResponse {
  bool allowed = 1;
  optional string reason = 2;
}

message AssignRoleRequest {
  string user_id = 1;
  string role = 2;
  optional string scope = 3;
}

message AssignRoleResponse {
  bool success = 1;
}

message RevokeRoleRequest {
  string user_id = 1;
  string role = 2;
}

message RevokeRoleResponse {
  bool success = 1;
}

message ListRolesRequest {
  optional string user_id = 1;
}

message ListRolesResponse {
  repeated RoleInfo roles = 1;
}

message RoleInfo {
  string role_id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
}

// OAuth2 / OIDC Messages
message OAuthTokenRequest {
  string grant_type = 1;
  optional string code = 2;
  optional string refresh_token = 3;
  optional string client_id = 4;
  optional string client_secret = 5;
  optional string redirect_uri = 6;
  repeated string scopes = 7;
}

message OAuthTokenResponse {
  string access_token = 1;
  string token_type = 2;
  int64 expires_in = 3;
  optional string refresh_token = 4;
  optional string id_token = 5;
  repeated string scopes = 6;
}

message IntrospectTokenRequest {
  string token = 1;
}

message IntrospectTokenResponse {
  bool active = 1;
  optional string user_id = 2;
  optional string client_id = 3;
  repeated string scopes = 4;
  optional int64 exp = 5;
  optional int64 iat = 6;
}

message UserInfoRequest {
  string access_token = 1;
}

message UserInfoResponse {
  string sub = 1;
  string email = 2;
  bool email_verified = 3;
  optional string name = 4;
  optional string picture = 5;
  map<string, string> additional_claims = 6;
}

// Federation Messages
message FederatedAuthRequest {
  string provider = 1;
  optional string redirect_uri = 2;
  repeated string scopes = 3;
}

message FederatedAuthResponse {
  string auth_url = 1;
  string state = 2;
}

message CompleteFederatedAuthRequest {
  string provider = 1;
  string code = 2;
  string state = 3;
}

message CompleteFederatedAuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  UserInfo user = 3;
}

// Audit Messages
message AuditLogsRequest {
  optional string user_id = 1;
  optional string action = 2;
  optional int64 start_time = 3;
  optional int64 end_time = 4;
  optional int32 limit = 5;
  optional int32 offset = 6;
}

message AuditLogsResponse {
  repeated AuditLog logs = 1;
  int32 total = 2;
}

message AuditLog {
  string id = 1;
  string user_id = 2;
  string action = 3;
  string resource = 4;
  bool success = 5;
  string ip_address = 6;
  string user_agent = 7;
  int64 timestamp = 8;
  map<string, string> metadata = 9;
}

message ComplianceReportRequest {
  int64 start_time = 1;
  int64 end_time = 2;
  repeated string report_types = 3;
}

message ComplianceReportResponse {
  map<string, ComplianceMetrics> metrics = 1;
  int64 generated_at = 2;
}

message ComplianceMetrics {
  int64 total_authentications = 1;
  int64 failed_authentications = 2;
  int64 mfa_enabled_users = 3;
  int64 active_sessions = 4;
  map<string, int64> additional_metrics = 5;
}

// Enums
enum TokenType {
  TOKEN_TYPE_UNSPECIFIED = 0;
  ACCESS_TOKEN = 1;
  REFRESH_TOKEN = 2;
  ID_TOKEN = 3;
}

enum MFAMethod {
  MFA_METHOD_UNSPECIFIED = 0;
  TOTP = 1;
  SMS = 2;
  EMAIL = 3;
  WEBAUTHN = 4;
  HARDWARE_KEY = 5;
}

// CAPTCHA Messages
message CaptchaChallengeRequest {
  string session_id = 1;
  ChallengeType challenge_type = 2;
  uint32 difficulty = 3;
  map<string, string> metadata = 4;
}

message CaptchaChallengeResponse {
  string challenge_id = 1;
  ChallengeType challenge_type = 2;
  string challenge_data = 3;
  uint32 difficulty = 4;
  int64 expires_at = 5;
  map<string, string> metadata = 6;
}

message CaptchaVerificationRequest {
  string challenge_id = 1;
  string answer = 2;
  bytes behavioral_data = 3;
  string session_id = 4;
}

message CaptchaVerificationResponse {
  bool success = 1;
  string message = 2;
  string verification_token = 3;
  uint32 next_difficulty = 4;
  bool retry_allowed = 5;
  optional uint32 lockout_duration = 6;
}

enum ChallengeType {
  CHALLENGE_TYPE_UNSPECIFIED = 0;
  VISUAL = 1;
  AUDIO = 2;
  BEHAVIORAL = 3;
  LOGICAL = 4;
  HYBRID = 5;
}
