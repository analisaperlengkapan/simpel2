[package]
name = "authenc-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
# Workspace dependencies
authenc-types = { path = "../types" }

# External dependencies (from workspace)
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

# Cryptography dependencies
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
aes-gcm = { workspace = true }
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
base64ct = { workspace = true }
once_cell = { workspace = true }

# Advanced cryptography dependencies
axum = { workspace = true }  # For mTLS middleware
openssl = { version = "0.10.74" }  # For xmldsig
quick-xml = { workspace = true }  # For xmldsig
anyhow = { workspace = true }  # For error handling in advanced modules
sha2 = { workspace = true }  # For hashing in mtls and other modules
hex = { workspace = true }  # For hex encoding in mtls
x509-parser = { workspace = true }  # For xmldsig certificate parsing
reqwest = { workspace = true }  # For xmldsig OCSP/CRL fetching

# Shared library dependencies
lib-common = { path = "../../../../lib/common", features = ["crypto"] }

[dev-dependencies]
tokio-test = { workspace = true }
proptest = { workspace = true }
