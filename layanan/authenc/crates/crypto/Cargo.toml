[package]
name = "authenc-crypto"
version.workspace = true
edition = "2024"
rust-version = "1.90"
license.workspace = true

[dependencies]
# Workspace dependencies
authenc-types = { path = "../types" }

# External dependencies (from workspace)
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

# Cryptography dependencies
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
chacha20poly1305 = { workspace = true }
aes-gcm = { workspace = true }
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
p521 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
base64ct = { workspace = true }
once_cell = { workspace = true }
subtle = { workspace = true }
hkdf = { workspace = true }

# Advanced cryptography dependencies
axum = { workspace = true }        # For mTLS middleware
openssl = { version = "0.10.80" }  # For xmldsig
quick-xml = { workspace = true }   # For xmldsig
anyhow = { workspace = true }      # For error handling in advanced modules
sha2 = { workspace = true }        # For hashing in mtls and other modules
hex = { workspace = true }         # For hex encoding in mtls
x509-parser = { workspace = true } # For xmldsig certificate parsing
reqwest = { workspace = true }     # For xmldsig OCSP/CRL fetching

# Shared library dependencies
lib-crypto = { workspace = true }

# Post-Quantum Cryptography dependencies (optional, enabled via 'quantum' feature)
pqcrypto-mldsa = { workspace = true, optional = true }
pqcrypto-mlkem = { workspace = true, optional = true }
pqcrypto-falcon = { workspace = true, optional = true }
pqcrypto-traits = { workspace = true, optional = true }

[features]
default = []
quantum = [
  "dep:pqcrypto-mldsa",
  "dep:pqcrypto-mlkem",
  "dep:pqcrypto-falcon",
  "dep:pqcrypto-traits",
]
secreton = []

# Declare expected cfg values to silence unexpected-cfg warnings in xmldsig.rs
# The OcspClient methods are gated on these features; they are not currently
# wired to real feature flags but the cfg attributes must be declared.
[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = [
  'cfg(feature, values("quantum", "secreton", "test", "dev", "default"))',
]

[dev-dependencies]
tokio-test = { workspace = true }
proptest = { workspace = true }
