[package]
name = "authenc-core"
version.workspace = true
edition = "2024"
rust-version = "1.90"
license.workspace = true

[dependencies]
# Workspace dependencies
authenc-types = { path = "../types" }
authenc-crypto = { path = "../crypto" }
authenc-storage = { path = "../storage" }

# External dependencies (from workspace)
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }

# Additional dependencies needed by core services
anyhow = { workspace = true }
deadpool-postgres = { workspace = true }
lib-core = { workspace = true }
regex = { workspace = true }
axum = { workspace = true }
config = { workspace = true }
futures = { workspace = true }
bincode = "1.3"

# Crypto dependencies (versions match parent authenc/Cargo.toml)
base32 = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true, features = ["json"], optional = true }
dashmap = { workspace = true }
hmac = { workspace = true }
sha1 = "0.10"
subtle = { workspace = true }
bcrypt = { workspace = true }
jsonwebtoken = { workspace = true, default-features = false, features = [
  "aws_lc_rs",
] }

# Optional dependencies (feature-gated)
redis = { workspace = true, optional = true }
rdkafka = { workspace = true, features = ["ssl-vendored"], optional = true }
lru = { workspace = true, optional = true }
webauthn-rs = { workspace = true, features = [
  "danger-allow-state-serialisation",
], optional = true }
webauthn-rs-proto = { workspace = true, optional = true }
ldap3 = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
openssl = { version = "0.10.80", optional = true }
quick-xml = { workspace = true, features = ["serialize"], optional = true }

[features]
default = []
redis-cache = ["redis"]
kafka = ["rdkafka"]
webauthn = ["webauthn-rs", "webauthn-rs-proto"]
ldap = ["ldap3"]
aws = ["aws-sdk-s3", "aws-config", "aws-credential-types"]
fips = ["openssl"]
saml = ["quick-xml", "openssl"]
oidc-federation = ["reqwest"]
cache = ["lru"]
elasticsearch = ["reqwest"]

[dev-dependencies]
serial_test.workspace = true
temp-env.workspace = true
tokio-test = { workspace = true }
