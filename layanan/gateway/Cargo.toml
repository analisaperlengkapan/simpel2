[package]
name = "layanan-gateway"
version.workspace = true
edition.workspace = true
authors = ["SIMPEL Team"]
description = "REST→gRPC sidecar gateway for simpelv1 (authenc + secreton + integrasi)"
publish = false

[[bin]]
name = "gateway"
path = "src/main.rs"

[lib]
name = "layanan_gateway"
path = "src/lib.rs"

[dependencies]
# Web framework (REST surface consumed by simpelv1 PHP clients over localhost)
axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors"] }

# gRPC upstream clients (authenc / secreton / integrasi)
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }

# Serialization + observability
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
anyhow = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
