# Perlengkapan Workspace
#
# This is the workspace manifest for all perlengkapan-related crates.
# Each service is organized under crates/ following the layanan/secreton pattern.

[workspace]
resolver = "2"

members = [
    "crates/api",
    "crates/integrasi",
    "crates/dokumen",
    "crates/notifikasi",
    "crates/bantuan",
]

# Inherit common settings from root workspace
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["SIMPEL Team"]
license = "MIT"

[workspace.dependencies]
# Error handling
anyhow = "1.0.100"
thiserror = "2.0.17"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34-deprecated"

# Async runtime
tokio = { version = "1.47.1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7.17"
tokio-cron-scheduler = "0.13.0"

# Web framework
axum = { version = "0.8.7", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.12.2", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["tonic", "tls"] }
prometheus = "0.14"
sentry = { version = "0.46.0", features = ["tracing"] }
sentry-tracing = "0.46.0"

# UUID and time
uuid = { version = "1.19.0", features = ["v4", "serde", "js"] }
chrono = { version = "0.4.42", features = ["serde"] }
time = { version = "0.3.44", features = ["serde", "macros"] }

# Database
tokio-postgres = { version = "0.7.16", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1", "with-time-0_3"] }
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
postgres-types = { version = "0.2.12", features = ["derive", "with-uuid-1", "with-chrono-0_4", "with-serde_json-1", "with-time-0_3"] }
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager", "aio"] }
sea-query = { version = "0.32.7", features = ["postgres-array", "with-chrono", "with-uuid"] }
dashmap = { version = "6.1", features = ["raw-api"] }

# Authentication & JWT
jsonwebtoken = { version = "10.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }

# Security & Cryptography
argon2 = "0.5.3"
aes-gcm = { version = "0.10", features = ["aes"] }
rand = { version = "0.8.5", features = ["std", "std_rng"] }
sha2 = "0.10.9"

# Validation
validator = { version = "0.19", features = ["derive"] }
garde = { version = "0.22", features = ["derive", "serde"] }

# Environment variables
dotenvy = "0.15.7"

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"], default-features = false }

# Decimal calculations
bigdecimal = { version = "0.4.9", features = ["serde"] }

# gRPC
tonic = { version = "0.14.2", features = ["tls-webpki-roots", "transport", "channel"] }
tonic-prost = "0.14"
prost = "0.14"
http = "1.3.1"
http-body = "1.0"
http-body-util = "0.1"

# Utilities
async-trait = "0.1.89"
futures = "0.3.31"
base64 = "0.22"
hex = "0.4"
regex = "1.11"
urlencoding = "2.1"
walkdir = "2"
mime = "0.3"
captcha = "1.0"

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }

# Templates
handlebars = "6.3.2"

# PDF & Excel
printpdf = "0.7.0"
rust_xlsxwriter = "0.92.2"

# Antivirus scanning
clamav-client = "2.1.0"

# Shared libraries
lib-common = { path = "../../lib/common" }
lib-perlengkapan = { path = "../../lib/perlengkapan" }

# Build dependencies
tonic-prost-build = "0.14"

# Dev/Test dependencies
mockall = "0.14.0"
axum-test = "18.1"
tokio-test = "0.4.4"
assert-json-diff = "2"
serial_test = "3"
tempfile = "3"
