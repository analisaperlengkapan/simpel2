tokio-rustls = "0.26"
ipnetwork = "0.20"
lru = "0.16.3"
glob = "0.3"
parking_lot = "0.12.5"
openraft = { version = "0.9.21", features = ["serde"] }
slog = "2.8.2"
slog-term = "2.9.2"
slog-async = "2.8"
