# Perlengkapan Workspace
#
# This is the workspace manifest for all perlengkapan-related crates.
# Each service is organized under crates/ following the layanan/secreton pattern.

[workspace]
resolver = "2"

members = [
    "crates/api",
        "crates/dokumen",
    "crates/notifikasi",
    "crates/bantuan",
]

# Inherit common settings from root workspace
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["SIMPEL Team"]
license = "MIT"

[workspace.dependencies]

# Axum Backend Dependencies - Latest Stable
axum = { version = "0.8.7", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.12.2", features = ["typed-header"] }
tokio = { version = "1.47.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "limit",
    "auth",
    "fs",
    "compression-gzip",
    "timeout",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
uuid = { version = "1.19.0", features = ["v4", "serde", "js"] }
time = { version = "0.3.44", features = ["serde", "macros"] }
chrono = { version = "0.4.42", features = ["serde"] }
tokio-cron-scheduler = "0.13.0"
anyhow = "1.0.100"
thiserror = "2.0.17"
dotenvy = "0.15.7" # Maintained fork of dotenv

# PostgreSQL Database Dependencies (Optimized for security & performance)
tokio-postgres = { version = "0.7.16", features = [
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-time-0_3",
] }
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
postgres-types = { version = "0.2.12", features = [
    "derive",
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-time-0_3",
] }
refinery = { version = "0.9.0", features = ["tokio-postgres"] }
sea-query = { version = "0.32.7", features = [
    "postgres-array",
    "with-chrono",
    "with-uuid",
] }

# Security & Authentication (Updated for latest security)
# Ed25519 preferred over RSA for better security and performance
argon2 = "0.5.3"
jsonwebtoken = { version = "10.1.0", default-features = false, features = [
    "aws_lc_rs",
    "use_pem",
] } # Updated to v10 with aws_lc_rs backend
oauth2 = "5.0.0"
rand = { version = "0.8.5", features = [
    "std",
    "std_rng",
] } # Downgraded to 0.8.5 for crypto ecosystem compatibility (rand_core 0.6)
ed25519-dalek = { version = "2.2.0", features = [
    "rand_core",
    "serde",
] } # Primary signing algorithm (preferred over RSA)
x25519-dalek = { version = "2.0.1", features = [
    "serde",
    "static_secrets",
] } # Key exchange

# WebAuthn/Passkeys (MANDATORY - PRIMARY authentication method)
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"

# Note: No external vault dependencies (using internal Secreton system)
# vaultrs removed - we use our own Secreton implementation

# Proc Macro Dependencies (secure alternatives)
syn = { version = "2.0.111", features = [
    "full",
    "parsing",
    "printing",
    "proc-macro",
] }
quote = "1.0"
proc-macro2 = "1.0.103"
# Note: Removed paste/pastey - using inline macros instead (paste is unmaintained)

# Frontend Shared Dependencies
lib-ui = { path = "lib/ui" }
lib-common = { path = "../../lib/common" }
lib-perlengkapan = { path = "../../lib/perlengkapan" }
regex = "1.11"
urlencoding = "2.1"

# Database & Caching (Updated)
redis = { version = "0.32.7", features = [
    "tokio-comp",
    "connection-manager",
    "aio",
] }
mongodb = "3.3.0"

# Message Queue & Event Streaming
amqprs = { version = "2.0", features = ["tls"] }
tokio-stream = "0.1"

# Configuration & Templates (Updated)
config = { version = "0.15.19", default-features = false, features = [
    "toml",
    "json",
    "yaml",
    "ini",
    "ron",
    "convert-case",
    "async",
] } # Drop json5 feature to avoid unmaintained dependency
tera = "1.20.1"

# HTTP Client - Unified version
reqwest = { version = "0.12", features = [
    "json",
    "multipart",
    "stream",
    "rustls-tls",
], default-features = false }
# NOTE: ureq removed - using async-only reqwest per PR #211 optimization

# Validation & Serialization - Updated for security (removes idna vulnerability)
garde = { version = "0.22", features = [
    "derive",
    "serde",
] } # Modern validator replacement (no idna dependency)
validator = { version = "0.19", features = ["derive"] } # Legacy validator (kept for datun compatibility)
nutype = { version = "0.6.2", features = [
    "serde",
    "validate",
] } # Additional validation without idna

# Monitoring & Observability (Updated to latest)
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["tonic", "tls"] }
prometheus = "0.14"
sentry = { version = "0.46.0", features = ["tracing"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18.0"
tracing-opentelemetry = "0.32.0"

# Email and Notifications
lettre = { version = "0.11", default-features = false, features = [
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
    "hostname",
] }

http = "1.3.1"
http-body = "1.0"
http-body-util = "0.1"
temp-env = "0.3.6"
bcrypt = "0.17.1"

# Secreton Internal Dependencies (for sub-crates)
secreton-core = { path = "layanan/secreton/crates/core" }
secreton-api = { path = "layanan/secreton/crates/api" }
secreton-storage = { path = "layanan/secreton/crates/storage" }
secreton-crypto = { path = "layanan/secreton/crates/crypto" }
secreton-types = { path = "../../layanan/secreton/crates/types" }
secreton-grpc = { path = "layanan/secreton/crates/grpc" }
secreton-hsm = { path = "layanan/secreton/crates/hsm" }
secreton-auto-unseal = { path = "layanan/secreton/crates/auto-unseal" }

# Authenc Internal Dependencies (for sub-crates)
authenc-types = { path = "layanan/authenc/crates/types" }
authenc-core = { path = "layanan/authenc/crates/core" }
authenc-crypto = { path = "layanan/authenc/crates/crypto" }
authenc-storage = { path = "layanan/authenc/crates/storage" }
authenc-api = { path = "layanan/authenc/crates/api" }
authenc-iam-api = { path = "layanan/authenc/crates/iam-api" }
authenc-grpc = { path = "layanan/authenc/crates/grpc" }
authenc-mfa = { path = "layanan/authenc/crates/mfa" }
authenc-federation = { path = "layanan/authenc/crates/federation" }
authenc-webauthn = { path = "layanan/authenc/crates/webauthn" }
lazy_static = "1.4"
futures-util = { version = "0.3", features = ["std"] }
pin-project = "1.0"
env_logger = "0.11"
rand_chacha = "0.9"
getrandom = { version = "0.3.3", features = ["wasm_js"] }
base64ct = "1.8"
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
p384 = { version = "0.13", features = ["ecdsa", "jwk"] }
p521 = { version = "0.13", features = ["ecdsa", "jwk"] }
ecdsa = { version = "0.16", features = ["signing", "verifying"] }
ed448-goldilocks = "0.9.0"
x509-parser = "0.18.0"
dashmap = { version = "6.1", features = ["raw-api"] }
serde_qs = "0.15.0"
ldap3 = "0.12.1"
quick-xml = { version = "0.38.3", features = ["serialize"] }
rustls = { version = "0.23" }
rustls-webpki = "0.103.7"
rustls-pemfile = "2.2"
rustls-native-certs = "0.8"
webpki-roots = "1.0.2"
flate2 = { version = "1.1.5", features = ["zlib"] }
tss-esapi = "7.4"
pqcrypto-mldsa = "0.1.2"
pqcrypto-mlkem = "0.1.1"
pqcrypto-falcon = "0.4.1"
pqcrypto-traits = "0.3.5"
curve25519-dalek = "4.1"
subtle = "2.6"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
bincode = "2.0.1"
hkdf = "0.12"
fluent-bundle = "0.16"
unic-langid = "0.9"
axum-test = "18.1"
rdkafka = { version = "0.38", features = ["tokio"] }
totp-rs = { version = "5.7", default-features = false }
totp-lite = "2.0"
blake3 = "1.8.2"
sha2 = "0.10.9"
schemars = "1.0.4"

# Template Engine and Utilities (Updated)
base64 = "0.22"
hex = "0.4"

# Cryptography
aes-gcm = { version = "0.10", features = ["aes"] }
hmac = "0.12"

# QR Code generation (Updated)
qrcode = { version = "0.14.1", features = ["svg"] }

# Base32 encoding (Updated)
base32 = "0.5.1"

# Decimal calculations for financial data
bigdecimal = { version = "0.4.9", features = ["serde"] }

# Antivirus scanning
clamav-client = "2.1.0"

# Template engines
handlebars = "6.3.2"

# PDF generation
printpdf = "0.7.0"
headless_chrome = "1.0.15"

# Additional utilities
rust-embed = "8.8.0"
captcha = "1.0"
ndarray = "0.17"
ring = "0.17"
notify = "8.2"
serde_yaml = "0.9.34-deprecated"
toml = "0.9.7"
calamine = "0.32"                # Excel reading
rust_xlsxwriter = "0.92.2"       # Excel writing

# Utility libraries
tokio-util = "0.7.17"
walkdir = "2"
mime = "0.3"
sentry-tracing = "0.46.0"
 tempfile = "3"

# Dev dependencies (for testing)
tokio-test = "0.4.4"
mockall = "0.14.0"
serial_test = "3"
assert-json-diff = "2"

# Leptos Frontend Dependencies - Latest Available Stable
leptos = { version = "0.8.14" }
leptos_meta = { version = "0.8.5" }
leptos_router = { version = "0.8.10" }
leptos_dom = { version = "0.8.7" }
leptos_macro = { version = "0.8.12" }
server_fn = { version = "0.8.8" }

# WASM specific - Latest Stable Versions (Updated)
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
wasm-bindgen-test = "0.3.56"
js-sys = "0.3.83"
gloo-net = { version = "0.6", features = ["http"] }
gloo-utils = { version = "0.2", features = ["serde"] }
web-sys = { version = "0.3.83", features = [
    "HtmlInputElement",
    "Window",
    "Document",
    "Node",
    "NodeList",
    "HtmlDocument",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "Navigator",
    "Location",
    "History",
    "Storage",
    "console",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "MouseEvent",
    "KeyboardEvent",
    "Event",
    "EventTarget",
    "Performance",
    "Screen",
    "AudioContext",
    "OscillatorType",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
    "WebGlRenderingContext",
    "CanvasRenderingContext2d",
    "DomRect",
    "Clipboard",
    "MediaQueryList",
    "Crypto",
    "SecurityPolicyViolationEvent",
] }
gloo-console = "0.3"
gloo-storage = "0.3"
gloo = { version = "0.11", features = [
    "futures",
    "timers",
    "events",
    "file",
    "utils",
] }
gloo-timers = { version = "0.3", features = ["futures"] }

# WASM utilities
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4.28"

# Utilities
futures = "0.3.31"
async-trait = "0.1.89"
url = "2.5.4"
smallvec = { version = "1.13", features = ["serde"] }
once_cell = "1.19"

# Additional dependencies
axum-server = { version = "0.7.2", features = ["tls-rustls"] }
hyper = { version = "1.8.1", features = ["full"] }
hyper-util = { version = "0.1.18", features = ["full"] }
bytes = "1.11.0"

# AI and ML Dependencies
qdrant-client = "1.11"
tiktoken-rs = "0.7.0"
tonic = { version = "0.14.2", features = ["tls-webpki-roots", "transport", "channel"] }

# CLI tools
clap = { version = "4.5.53", features = ["derive"] }
colored = "3.0"
shellexpand = "3.1"
which = "8.0"
k8s-openapi = { version = "0.26", features = ["latest"] }
kube = { version = "2.0", features = [
    "runtime",
    "derive",
    "rustls-tls",
], default-features = false }

# =============================================================================
# Secreton Integrated Dependencies
# =============================================================================
chacha20poly1305 = "0.10.1"
pbkdf2 = "0.12"
sha3 = "0.10.8"
digest = "0.10"
