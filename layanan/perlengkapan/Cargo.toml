# Testing & Build Dependencies
criterion = { version = "0.7.0", features = ["html_reports"] }
proptest = { version = "1.8.0", default-features = false, features = ["std"] }

pretty_assertions = "1.4.1"
rustc_version = "0.4"

# NOTE: Secreton and Authenc inter-crate dependencies should NOT be here
# They are separate workspaces with their own dependency management
# If main workspace crates need to communicate with them, use gRPC
