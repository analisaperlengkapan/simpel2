# Perlengkapan Workspace
#
# This is a nested workspace manifest for all perlengkapan-related crates.
# Each service is organized under crates/ following the layanan/secreton pattern.
#
# NOTE: Sub-crates are also listed as members of the root workspace.
# The [workspace.package] here provides values for sub-crate inheritance
# (edition.workspace = true, version.workspace = true).

[workspace]
resolver = "2"

members = [
    "crates/api",
    "crates/dokumen",
    "crates/notifikasi",
    "crates/bantuan",
]

# Inherit common settings from root workspace
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["SIMPEL Team"]
license = "Apache-2.0"

[workspace.dependencies]
# All dependencies are inherited from the root workspace at /Cargo.toml
# Sub-crates should use `{ workspace = true }` for common dependencies
# Do NOT duplicate dependency versions here — the root Cargo.toml is the
# single source of truth per AGENTS.md.
