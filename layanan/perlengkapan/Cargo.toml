# Perlengkapan
#
# The actual sub-crates (crates/api, crates/dokumen, etc.) are listed as
# members of the **root** workspace at /Cargo.toml and inherit all
# dependencies from there.
#
# Do NOT add [workspace] here — it would shadow the root workspace and
# break `{ workspace = true }` dependency resolution for the sub-crates.

[package]
name = "layanan-perlengkapan"
version.workspace = true
edition.workspace = true
publish = false
authors.workspace = true
license.workspace = true
# The build.rs at this level has incorrect paths (it was a leftover from
# when this was a virtual workspace manifest and was never executed).
# Proto compilation is handled by crates/api/build.rs instead.
build = false
