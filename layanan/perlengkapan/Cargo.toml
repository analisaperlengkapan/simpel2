cbc = "0.1"
rcgen = "0.13"
pem = "3.0"
der-parser = "9.0"
aide = { version = "0.15.1", features = ["axum", "macros"] }
secrecy = { version = "0.10.3", features = ["serde"] }
warp = "0.4.2"
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
openidconnect = "3.5"
data-encoding = "2.6"
fpe = "0.6.1"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "std"] }
ssh-encoding = "0.2"
aws-config = "1.5"
aws-sdk-s3 = "1.45"
aws-sdk-iam = "1.45"
aws-sdk-sts = "1.45"
aws-sdk-kms = "1.45"
aws-types = "1.3"
aws-credential-types = "1.2"
google-cloudkms1 = "5.0"
azure_security_keyvault = "0.20"
num-bigint = "0.4"
num-traits = "0.2"
