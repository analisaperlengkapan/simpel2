syntax = "proto3";

package dokumen;

// Document Generation Service
service DocumentService {
    // Generate document from template
    rpc GenerateDocument(GenerateDocumentRequest) returns (GenerateDocumentResponse);

    // Get generated document
    rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);

    // List generated documents
    rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);

    // Template management
    rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
    rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
    rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
    rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
    rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);

    // Template preview
    rpc PreviewTemplate(PreviewTemplateRequest) returns (PreviewTemplateResponse);
}

// Generate Document
message GenerateDocumentRequest {
    string template_id = 1;
    string data_json = 2; // JSON string of template data
    optional string output_format = 3; // pdf, excel, word
    optional string metadata_json = 4; // JSON string of metadata
}

message GenerateDocumentResponse {
    string document_id = 1;
    string document_number = 2;
    string filename = 3;
    string download_url = 4;
    string checksum = 5;
}

// Get Document
message GetDocumentRequest {
    string document_id = 1;
}

message GetDocumentResponse {
    string document_id = 1;
    string document_number = 2;
    string filename = 3;
    string storage_path = 4;
    string format = 5;
    int64 size = 6;
    string checksum = 7;
    string generated_by = 8;
    string generated_at = 9;
    string status = 10;
    bytes content = 11; // Document binary content
}

// List Documents
message ListDocumentsRequest {
    optional string template_id = 1;
    optional string status = 2;
    optional int64 page = 3;
    optional int64 per_page = 4;
}

message ListDocumentsResponse {
    repeated DocumentInfo documents = 1;
    int64 total = 2;
    int64 page = 3;
    int64 per_page = 4;
}

message DocumentInfo {
    string document_id = 1;
    string document_number = 2;
    string filename = 3;
    string format = 4;
    int64 size = 5;
    string generated_by = 6;
    string generated_at = 7;
    string status = 8;
}

// Create Template
message CreateTemplateRequest {
    string name = 1;
    optional string description = 2;
    string template_type = 3;
    string content = 4;
    string format = 5;
    string output_format = 6;
    string variables_json = 7; // JSON string
    optional string sample_data_json = 8; // JSON string
    optional string letterhead_config_json = 9; // JSON string
}

message CreateTemplateResponse {
    string template_id = 1;
    string name = 2;
    int32 version = 3;
}

// Get Template
message GetTemplateRequest {
    string template_id = 1;
}

message GetTemplateResponse {
    string template_id = 1;
    string name = 2;
    optional string description = 3;
    string template_type = 4;
    string content = 5;
    string format = 6;
    string output_format = 7;
    int32 version = 8;
    bool is_active = 9;
    string variables_json = 10;
    optional string sample_data_json = 11;
    optional string letterhead_config_json = 12;
    string created_at = 13;
    string updated_at = 14;
}

// Update Template
message UpdateTemplateRequest {
    string template_id = 1;
    optional string name = 2;
    optional string description = 3;
    optional string content = 4;
    optional string format = 5;
    optional string output_format = 6;
    optional string variables_json = 7;
    optional string sample_data_json = 8;
    optional string letterhead_config_json = 9;
    optional string change_notes = 10;
}

message UpdateTemplateResponse {
    string template_id = 1;
    int32 new_version = 2;
}

// Delete Template
message DeleteTemplateRequest {
    string template_id = 1;
}

message DeleteTemplateResponse {
    bool success = 1;
}

// List Templates
message ListTemplatesRequest {
    optional string template_type = 1;
    optional bool is_active = 2;
    optional int64 page = 3;
    optional int64 per_page = 4;
}

message ListTemplatesResponse {
    repeated TemplateInfo templates = 1;
    int64 total = 2;
    int64 page = 3;
    int64 per_page = 4;
}

message TemplateInfo {
    string template_id = 1;
    string name = 2;
    optional string description = 3;
    string template_type = 4;
    string output_format = 5;
    int32 version = 6;
    bool is_active = 7;
    string created_at = 8;
}

// Preview Template
message PreviewTemplateRequest {
    string template_id = 1;
    string data_json = 2; // JSON string of sample data
}

message PreviewTemplateResponse {
    string html = 1;
    repeated string variables_used = 2;
}
