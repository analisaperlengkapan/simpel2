syntax = "proto3";

package notifikasi.v1;

// Notification service for sending notifications via multiple channels
service NotificationService {
  // Send a notification to a user
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);

  // Get notifications for a user
  rpc GetNotifications(GetNotificationsRequest) returns (GetNotificationsResponse);

  // Get unread notification count
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);

  // Mark notification as read
  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse);

  // Get user notification preferences
  rpc GetPreferences(GetPreferencesRequest) returns (GetPreferencesResponse);

  // Update user notification preferences
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
}

// Send notification request
message SendNotificationRequest {
  string user_id = 1;
  string notification_type = 2;
  string notification_data = 3; // JSON-encoded notification data
  string priority = 4; // low, normal, high, urgent
  repeated string channels = 5; // in_app, email, sms, push
}

// Send notification response
message SendNotificationResponse {
  bool success = 1;
  string message = 2;
  string notification_id = 3;
}

// Get notifications request
message GetNotificationsRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  bool unread_only = 4;
}

// Get notifications response
message GetNotificationsResponse {
  repeated Notification notifications = 1;
  int32 total_count = 2;
}

// Notification message
message Notification {
  string id = 1;
  string user_id = 2;
  string notification_type = 3;
  string title = 4;
  string message = 5;
  string priority = 6;
  string category = 7;
  string action_url = 8;
  string metadata = 9; // JSON-encoded metadata
  bool read = 10;
  string read_at = 11;
  string created_at = 12;
  string expires_at = 13;
}

// Get unread count request
message GetUnreadCountRequest {
  string user_id = 1;
}

// Get unread count response
message GetUnreadCountResponse {
  int64 unread_count = 1;
}

// Mark as read request
message MarkAsReadRequest {
  string notification_id = 1;
  string user_id = 2;
}

// Mark as read response
message MarkAsReadResponse {
  bool success = 1;
  string message = 2;
}

// Get preferences request
message GetPreferencesRequest {
  string user_id = 1;
}

// Get preferences response
message GetPreferencesResponse {
  NotificationPreferences preferences = 1;
}

// Notification preferences
message NotificationPreferences {
  string id = 1;
  string user_id = 2;
  bool in_app_enabled = 3;
  bool email_enabled = 4;
  bool sms_enabled = 5;
  bool push_enabled = 6;
  bool batch_non_urgent = 7;
  string daily_digest_time = 8;
  string created_at = 9;
  string updated_at = 10;
}

// Update preferences request
message UpdatePreferencesRequest {
  string user_id = 1;
  optional bool in_app_enabled = 2;
  optional bool email_enabled = 3;
  optional bool sms_enabled = 4;
  optional bool push_enabled = 5;
  optional bool batch_non_urgent = 6;
  optional string daily_digest_time = 7;
}

// Update preferences response
message UpdatePreferencesResponse {
  bool success = 1;
  string message = 2;
  NotificationPreferences preferences = 3;
}
