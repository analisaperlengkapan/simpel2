[package]
name = "layanan-perlengkapan-bantuan"
version.workspace = true
edition.workspace = true
authors = ["SIMPEL Team"]
description = "SIMPEL - Layanan Bantuan (Help Service)"
license = "MIT"

[dependencies]
# Core Axum Framework
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Database & Persistence
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }
postgres-types = { workspace = true }
redis = { workspace = true }
dashmap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }

# Validation & Errors
garde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
prometheus = { workspace = true }
sentry = { workspace = true }

# Rate limiting - dashmap already included above in Data Structures

# Utilities
uuid = { workspace = true }
time = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
dotenvy = { workspace = true }

# HTTP Client
reqwest = { workspace = true }

# Specific Features
tokio-util = { workspace = true }
walkdir = { workspace = true }
mime = { workspace = true }
tokio-stream = { workspace = true }
base64 = { workspace = true }
captcha = { workspace = true }
moka = { version = "0.12", features = ["future"] }
lib-common = { workspace = true, features = ["telemetry", "db"] }
lib-perlengkapan = { path = "../../../../lib/perlengkapan", features = ["backend"] }

[dev-dependencies]
tokio-test = { workspace = true }
reqwest = { workspace = true }
assert-json-diff = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
mockall = { workspace = true }

[features]
integration-tests = []
default = ["ai", "webhook"]
ai = []
webhook = []

[[bin]]
name = "layanan-perlengkapan-bantuan"
path = "src/main.rs"

