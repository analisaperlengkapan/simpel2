[package]
name = "layanan-perlengkapan"
version.workspace = true
edition.workspace = true
authors = ["SIMPelv2 Team"]
description = "Layanan Perlengkapan untuk manajemen BMN Kejaksaan RI"

[[bin]]
name = "layanan-perlengkapan"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "fs"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }

# UUID and time
uuid = { workspace = true }
chrono = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Authentication & JWT
jsonwebtoken = { workspace = true }

# Validation
validator = { workspace = true }

# Environment variables
dotenvy = { workspace = true }

# HTTP client
reqwest = { workspace = true }
bigdecimal = { workspace = true }
lib-common = { workspace = true, features = ["backend", "jwt", "telemetry", "db"] }
layanan-integrasi = { path = "../../daskrimti/integrasi" }

async-trait = "0.1"

[dev-dependencies]
mockall = "0.13"
