[package]
name = "layanan-perlengkapan"
version.workspace = true
edition.workspace = true
authors = ["SIMPelv2 Team"]
description = "Layanan Perlengkapan untuk manajemen BMN Kejaksaan RI"

[[bin]]
name = "layanan-perlengkapan"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "fs"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database - PostgreSQL only (no MySQL to avoid RSA vulnerability RUSTSEC-2023-0071)
# sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono"], default-features = false }  # DISABLED: sqlx dependency structure includes mysql
# Using tokio-postgres directly for cleaner dependency tree

# UUID and time
uuid = { workspace = true }
chrono = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Authentication & JWT
jsonwebtoken = { workspace = true }

# Validation (FIXED: replaced validator with garde - no idna vulnerability)
garde = { workspace = true }

# Decimal support
bigdecimal = { workspace = true }

# Async trait support
async-trait = { workspace = true }

# Environment variables (FIXED: using maintained dotenvy)
dotenvy = { workspace = true }

# HTTP client
reqwest = { workspace = true }
lib-common = { workspace = true, features = ["telemetry", "db"] }
