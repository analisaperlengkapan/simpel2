[package]
name = "layanan-ai"
version = "0.1.0"
edition = "2021"
authors = ["SIMPelv2 Team"]
description = "AI service for SIMPelv2 - LLM, RAG, OCR, ML models"

[dependencies]
# Web Framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = { version = "1.0", features = ["full"] }
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# AI & ML  
# rust-bert = "0.21" # Disabled for now
# tokenizers = "0.15" # Disabled for now
# tch = "0.13" # Disabled for now
rust-embed = "8.0"

# OCR & Image Processing - Disabled due to system dependencies
# image = "0.24"
# opencv = "0.88" # Disabled for now due to clang dependency

# Vector Database (for RAG)
qdrant-client = "1.7"

# NLP & Text Processing
regex = "1.10"

# Configuration
config = "0.14"
dotenv = "0.15"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.21"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async
futures = "0.3"
async-trait = "0.1"

# HTTP Client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# Crypto (for model integrity)
sha2 = "0.10"
hmac = "0.12"

[dev-dependencies]
tokio-test = "0.4" 