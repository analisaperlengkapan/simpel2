[package]
name = "notifikasi"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
opentelemetry = { workspace = true }
opentelemetry-otlp = { version = "0.14", features = ["tonic", "tls"] }
prometheus = "0.13"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
uuid = { version = "1", features = ["v4", "serde"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
redis = { version = "0.24", features = ["tokio-comp"] }
validator = { version = "0.16", features = ["derive"] }
thiserror = "1"
sentry = { version = "0.31", features = ["tracing"] }
sentry-tracing = "0.31"
async-trait = "0.1"
tokio-util = "0.7"
walkdir = "2"
mime = "0.3"
time = "0.3"
anyhow = "1"
futures = "0.3"
tokio-stream = "0.1"
base64 = "0.21"
mockall = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
assert-json-diff = "2"
serial_test = "2"
tempfile = "3"

[features]
default = []
whatsapp = []
push = [] 