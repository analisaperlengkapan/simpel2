[package]
name = "simpelv2-laporan"
version = "0.1.0"
edition = "2021"
authors = ["SIMPelv2 Team"]
description = "SIMPelv2 - Layanan Pelaporan & Export"
license = "MIT"

[dependencies]
# Core Axum Framework
axum = { workspace = true }
axum-extra = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Database & Persistence
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }
postgres-types = { workspace = true }
redis = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Validation & Errors
garde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
prometheus = { workspace = true }
sentry = { workspace = true }

# Utilities
uuid = { workspace = true }
time = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
dotenvy = { workspace = true }

# HTTP Client
reqwest = { workspace = true }

# Report generation
# printpdf = "0.6"  # PDF generation - Disabled due to fontconfig dependency
calamine = "0.22"  # Excel reading
rust_xlsxwriter = "0.60"  # Excel writing
csv = "1.3"  # CSV handling

# Template engine untuk report formatting
tera = "1.19"
handlebars = "5.1"

# Data visualization - Disabled due to fontconfig dependency
# plotters = "0.3"

[dev-dependencies]
tokio-test = { workspace = true }
reqwest = { workspace = true }
serial_test = "3"
tempfile = "3"

[features]
default = ["pdf", "excel", "csv", "charts"]
pdf = []
excel = []
csv = []
charts = []
templates = []
scheduled = []

[[bin]]
name = "simpelv2-laporan"
path = "src/main.rs"
