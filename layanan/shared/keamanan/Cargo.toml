[package]
name = "layanan-keamanan"
version = "0.1.0"
edition = "2021"
authors = ["SIMPelv2 Team"]
description = "Security service for SIMPelv2 - JWT, RBAC, MFA, Vault integration"

[dependencies]
# Web Framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { version = "1.0", features = ["full"] }
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }
postgres-types = { workspace = true }
uuid = { workspace = true }

# JWT & Authentication
jsonwebtoken = { workspace = true }
argon2 = "0.5"
rand = "0.8"

# Vault Integration
vaultrs = "0.4"
reqwest = { workspace = true, features = ["json", "rustls-tls"] }

# MFA & Security
totp-lite = "2.0"
base32 = "0.4"
qrcode = "0.13"

# Configuration
config = "0.14"
dotenvy = { workspace = true }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { workspace = true }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Crypto
sha2 = "0.10"
hmac = "0.12"

# Validation
garde = { workspace = true }


prometheus = { workspace = true }
metrics = "0.21"
metrics-exporter-prometheus = "0.17"
sentry = { workspace = true }
sentry-tracing = "0.31"

lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1-rustls-tls"] }

[dev-dependencies]
tokio-test = "0.4"
