[package]
name = "layanan-integrasi"
version.workspace = true
edition.workspace = true
authors = ["SIMPEL Team"]
description = "SIMPEL - Layanan Integrasi untuk External APIs (MonSAKTI, MySIMKARI, dll)"
license = "MIT"
repository = "https://github.com/kejaksaan/simpelv2"
keywords = ["simpelv2", "integrasi", "api", "monsakti", "mysimkari"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
integration-tests = []
default = []
grpc = ["dep:tonic", "dep:prost", "dep:tonic-prost"]

[dependencies]
reqwest = { workspace = true, features = [
  "json",
  "native-tls",
  "cookies",
], default-features = false }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
sha2 = { workspace = true }
tokio-cron-scheduler = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
lib-common = { workspace = true, features = ["telemetry", "db"] }
lib-perlengkapan = { workspace = true, features = ["backend"] }
prometheus = { workspace = true }

# gRPC dependencies (optional, for server mode)
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }

# HTTP server dependencies (for monitoring dashboard)
axum = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }

[dev-dependencies]
wiremock = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }

[[bin]]
name = "scheduler"
path = "src/bin/scheduler.rs"

[[bin]]
name = "layanan-integrasi-grpc"
path = "src/bin/grpc_server.rs"
required-features = ["grpc"]

[[bin]]
name = "layanan-integrasi-server"
path = "src/bin/server.rs"
required-features = ["grpc"]

[[example]]
name = "fetch_to_database"
path = "examples/fetch_to_database.rs"

[[example]]
name = "siman_example"
path = "examples/siman_example.rs"

[[example]]
name = "siman_database_sync"
path = "examples/siman_database_sync.rs"
