# cargo-deny configuration

[advisories]
ignore = [
    "RUSTSEC-2023-0071", # rsa (Marvin Attack) - No fixed version available
    "RUSTSEC-2023-0089", # atomic-polyfill (unmaintained)
    "RUSTSEC-2025-0057", # fxhash (unmaintained)
    "RUSTSEC-2024-0436", # paste (unmaintained)
    "RUSTSEC-2024-0370", # proc-macro-error (unmaintained)
    "RUSTSEC-2025-0134", # rustls-pemfile (unmaintained)
    "RUSTSEC-2025-0141", # bincode (unmaintained)
    "RUSTSEC-2024-0421", # idna (low severity, waiting for upstream)
]

[licenses]
unlicensed = "deny"
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "0BSD",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
