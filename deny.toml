# cargo-deny configuration for SIMPEL
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Add specific advisories to ignore here if needed
    # Example: "RUSTSEC-2020-0001",
    "RUSTSEC-2024-0437", # protobuf (via prometheus)
    "RUSTSEC-2025-0066", # google-apis-common
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2023-0071", # rsa
    "RUSTSEC-2025-0134", # rustls-pemfile
    "RUSTSEC-2025-0141", # bincode
]

[licenses]
version = 2
# Allow only permissive licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "0BSD",
]
# Confidence threshold for license detection
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# Deny multiple versions of the same crate
multiple-versions = "warn"
# Deny wildcard dependencies
wildcards = "deny"
# Specific crates to deny
deny = [
    # Deny old crypto crates with known vulnerabilities
    { name = "openssl", wrappers = ["openssl-sys"] },
]

# Allow specific duplicate versions that are hard to unify
skip = [
    # Allow multiple versions of these crates temporarily
    { name = "bitflags", version = "=1.3.2" },
    { name = "syn", version = "=1.0.109" },
]

# Skip tree for specific crates
skip-tree = [
    # Skip checking dependencies of these crates
    # { name = "windows-sys", version = "=0.48.0" },
]

[sources]
# Deny crates from unknown registries
unknown-registry = "deny"
# Deny crates from unknown git repositories
unknown-git = "deny"
# Allow crates from crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow git sources (for development)
allow-git = []
