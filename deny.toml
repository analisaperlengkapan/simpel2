# cargo-deny configuration

[advisories]
# Ignore RUSTSEC advisories for unmaintained crates that are transitive dependencies
# or have no fix available yet.
ignore = [
    "RUSTSEC-2023-0071", # rsa (Marvin Attack) - Used by ssh-key, no fix available
    "RUSTSEC-2023-0089", # atomic-polyfill - Used by wasmtime -> postcard
    "RUSTSEC-2025-0141", # bincode - Unmaintained but widely used
    "RUSTSEC-2025-0057", # fxhash - Used by wasmtime
    "RUSTSEC-2024-0436", # paste - Used by leptos (macro support)
    "RUSTSEC-2025-0134", # rustls-pemfile - Used by tonic/axum-server
]

[licenses]
unlicensed = "deny"
copyleft = "deny"
allow-osi-fsf-free = "both"
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
