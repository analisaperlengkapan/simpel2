# Configuration for cargo-deny

[licenses]
# List of explicitly allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

confidence-threshold = 0.8

exceptions = [
    { allow = ["OpenSSL"], name = "ring", version = "*" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    "RUSTSEC-2023-0071", # rsa (Marvin Attack) - No fixed version available
    "RUSTSEC-2023-0089", # atomic-polyfill (unmaintained)
    "RUSTSEC-2025-0057", # fxhash (unmaintained)
    "RUSTSEC-2024-0436", # paste (unmaintained)
    "RUSTSEC-2024-0370", # proc-macro-error (unmaintained)
    "RUSTSEC-2025-0134", # rustls-pemfile (unmaintained)
    "RUSTSEC-2025-0141", # bincode (unmaintained)
    "RUSTSEC-2024-0421", # idna (low severity, waiting for upstream)
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
