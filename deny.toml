# cargo-deny configuration for SIMPEL
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  "RUSTSEC-2023-0071", # rsa (Marvin Attack) - No fixed version available
  "RUSTSEC-2024-0384", # instant (unmaintained) - transitive dep of azure_security_keyvault
  "RUSTSEC-2024-0436", # paste (unmaintained)
  "RUSTSEC-2025-0134", # rustls-pemfile (unmaintained)
  "RUSTSEC-2025-0141", # bincode (unmaintained)
  "RUSTSEC-2025-0057", # fxhash (unmaintained) - transitive dep
  "RUSTSEC-2023-0019", # kuchiki (unmaintained) - transitive (HTML parsing)
  "RUSTSEC-2024-0370", # proc-macro-error (unmaintained) - transitive macro dep
  "RUSTSEC-2026-0173", # proc-macro-error2 (unmaintained fork of the above) - transitive macro dep, maintenance-status only
  # rustls-webpki 0.101.7 advisories — transitive via aws-smithy-http-client
  # 1.1.12 (latest) → rustls 0.21.12. AWS SDK has not yet upgraded to
  # rustls 0.22+. Vulnerable code path only triggers when validating TLS
  # certs from servers we connect to; we only connect to AWS endpoints
  # (S3, IAM, KMS) which use standard CAs without exotic name constraints
  # or malformed CRLs, so the exploit conditions are not reachable from
  # our usage. Re-evaluate when AWS SDK upgrades. Track:
  # https://github.com/awslabs/aws-sdk-rust/issues (rustls 0.22 migration).
  "RUSTSEC-2026-0098", # rustls-webpki - URI name constraints
  "RUSTSEC-2026-0099", # rustls-webpki - wildcard name constraints
  "RUSTSEC-2026-0104", # rustls-webpki - panic in CRL parsing
  # pqcrypto-* unmaintained: upstream PQClean project archived (no security
  # vulnerability, maintenance-status only). These wrap the NIST PQC reference
  # impls (ML-KEM/ML-DSA/Falcon) used by secreton-crypto + authenc `quantum`.
  # No drop-in maintained successor yet; the algorithms/params are frozen NIST
  # standards so the archived code is stable. Track a maintained successor
  # (e.g. RustCrypto ml-kem/ml-dsa) and migrate when mature.
  "RUSTSEC-2026-0161", # pqcrypto-mlkem (unmaintained)
  "RUSTSEC-2026-0162", # pqcrypto-traits (unmaintained)
  "RUSTSEC-2026-0163", # pqcrypto-internals (unmaintained)
  "RUSTSEC-2026-0165", # pqcrypto-falcon (unmaintained)
  "RUSTSEC-2026-0166", # pqcrypto-mldsa (unmaintained)
]

[licenses]
version = 2
# Allow only permissive licenses.
# Crates with licenses NOT in this list will be denied.
# (The deprecated `deny`, `copyleft`, `allow-osi-fsf-free`, and
# `unlicensed` keys have been removed per cargo-deny PR #611.)
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
  "0BSD",
  "CC0-1.0",
]
# Confidence threshold for license detection
confidence-threshold = 0.8

# SIMPEL is a closed-source/proprietary project: our own workspace crates carry
# no `license` field and are all `publish = false`. Skip the license check for
# those private crates so cargo-deny doesn't flag them as `unlicensed`
# (third-party dependency licenses are still enforced by the `allow` list above).
[licenses.private]
ignore = true

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Deny multiple versions of the same crate
multiple-versions = "warn"
# Path dependencies (without explicit versions) are used extensively for
# internal crates in this monorepo.  cargo-deny treats these as "wildcard"
# dependencies, so we must allow them.
wildcards = "allow"
# Specific crates to deny
deny = [
  # Deny the high-level openssl crate EXCEPT when pulled in transitively
  # by crates that have no alternative (native-tls, webauthn, etc.).
  # The wrappers list below permits these transitive usages.
  { name = "openssl", wrappers = [
    "authenc-crypto",
    "native-tls",
    "webauthn-attestation-ca",
    "webauthn-rs-core",
  ] },
]

# Allow specific duplicate versions that are hard to unify
skip = [
  # Allow multiple versions of these crates temporarily
  { name = "bitflags", version = "=1.3.2" },
  # webauthn-rs-core v0.5.4 depends on x509-parser 0.16, while
  # authenc-crypto uses x509-parser 0.18.  Cannot unify until
  # webauthn-rs releases a version built against x509-parser 0.18+.
  { name = "x509-parser", version = "=0.16.0" },
]

# Skip tree for specific crates
skip-tree = [
  # Skip checking dependencies of these crates
  # { name = "windows-sys", version = "=0.48.0" },
]

[sources]
# Deny crates from unknown registries
unknown-registry = "deny"
# Deny crates from unknown git repositories
unknown-git = "deny"
# Allow crates from crates.io
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow git sources (for development)
allow-git = []
