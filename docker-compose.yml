version: "3.9"

services:
  # =====================================================
  # Database
  # =====================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-create per-service databases (dbsimpelv1, dbsimpelv2,
      # dbsecretion, dbintegration) on first startup. Without this, every
      # dependent service crashes with "database does not exist" because
      # the postgres image only creates the default `postgres` database.
      - ./infra/scripts/init-postgres-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simpel-network

  # =====================================================
  # Cache & Message Queue
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simpel-network

  # =====================================================
  # Core gRPC Services
  # =====================================================
  # One-shot schema migration (out-of-band, never on app startup). Runs the
  # authenc-migrate binary baked into the same image, then exits. authenc waits
  # for it to complete so replicas never race on migrations. Mirrors the Helm
  # pre-upgrade hook Job used in k8s.
  #
  # MUST run AFTER integrasi-migrate (not concurrently): both migrate the SAME
  # database (dbsimpelv2) and both issue `CREATE EXTENSION IF NOT EXISTS
  # "uuid-ossp"/"pg_trgm" WITH SCHEMA public`. `CREATE EXTENSION IF NOT EXISTS`
  # is NOT atomic against a concurrent creator — run in parallel, one transaction
  # blocks on the other's pg_extension insert and then either dies with
  # `duplicate key … pg_extension_name_index` (batch_execute → exit 1) or hangs.
  # Serializing them (integrasi → authenc) removes the race entirely. This
  # mirrors the Helm hook ordering (integrasi-migrate hook-weight -6 runs before
  # authenc-migrate -5); compose has no hook weights, so we express the same
  # order via depends_on. Bring-up order: integrasi → authenc → perlengkapan.
  authenc-migrate:
    image: simpel2-authenc:local
    container_name: authenc-migrate
    command: ["./authenc-migrate"]
    restart: "no"
    environment:
      RUST_LOG: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsimpelv2
    depends_on:
      postgres:
        condition: service_healthy
      integrasi-migrate:
        condition: service_completed_successfully
    networks:
      - simpel-network

  authenc:
    build:
      context: .
      dockerfile: layanan/authenc/Dockerfile
    # Shared with authenc-migrate so the image (incl. the migrate binary) is
    # built once; authenc-migrate references this same tag.
    image: simpel2-authenc:local
    container_name: authenc
    ports:
      - "50051:50051"
    environment:
      RUST_LOG: debug
      GRPC_PORT: "50051"
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: dbsimpelv2
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsimpelv2
    depends_on:
      postgres:
        condition: service_healthy
      authenc-migrate:
        condition: service_completed_successfully
    networks:
      - simpel-network

  secreton:
    build:
      context: .
      dockerfile: layanan/secreton/Dockerfile
    container_name: secreton
    ports:
      - "50053:50053"
    environment:
      RUST_LOG: debug
      GRPC_PORT: "50053"
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: dbsecretion
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsecretion
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - simpel-network

  # One-shot schema migration for the `integrasi.*` schema. integrasi has no
  # startup migration path — its tables were historically created ad-hoc at sync
  # time, so consumers that read `integrasi.*` cross-schema before any sync ran
  # (perlengkapan bank_aset + its dashboard views) found no tables. This runs the
  # integrasi-migrate binary, then exits. It targets dbsimpelv2 (NOT a separate
  # database) because perlengkapan reads `integrasi.siman_aset` cross-schema and
  # cross-schema only resolves within one database. Mirrors the Helm pre-upgrade
  # hook Job. Bring-up order: integrasi-migrate → authenc-migrate → perlengkapan.
  integrasi-migrate:
    image: simpel2-integrasi:local
    container_name: integrasi-migrate
    command: ["./integrasi-migrate"]
    restart: "no"
    environment:
      RUST_LOG: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsimpelv2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - simpel-network

  layanan-integrasi:
    build:
      context: .
      dockerfile: layanan/integrasi/Dockerfile
    # Shared with integrasi-migrate so the image (incl. the migrate binary) is
    # built once; integrasi-migrate references this same tag.
    image: simpel2-integrasi:local
    container_name: layanan-integrasi
    ports:
      - "50052:50052"
    environment:
      RUST_LOG: debug
      GRPC_PORT: "50052"
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Shares dbsimpelv2 so its sync writes land where consumers read
      # `integrasi.*` cross-schema (same DB as authenc + perlengkapan).
      DB_NAME: dbsimpelv2
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsimpelv2
      AUTHENC_GRPC_URL: authenc:50051
      SECRETON_GRPC_URL: secreton:50053
    depends_on:
      postgres:
        condition: service_healthy
      integrasi-migrate:
        condition: service_completed_successfully
      authenc:
        condition: service_started
      secreton:
        condition: service_started
    networks:
      - simpel-network

  # =====================================================
  # Backend Services (Layanan)
  # =====================================================
  layanan-perlengkapan:
    build:
      context: .
      dockerfile: layanan/perlengkapan/Dockerfile
    container_name: layanan-perlengkapan
    ports:
      - "3020:3020"
    environment:
      RUST_LOG: debug
      SERVER_PORT: "3020"
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: dbsimpelv2
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsimpelv2
      AUTHENC_GRPC_URL: authenc:50051
      SECRETON_GRPC_URL: secreton:50053
      INTEGRASI_GRPC_URL: layanan-integrasi:50052
    depends_on:
      postgres:
        condition: service_healthy
      # perlengkapan self-migrates (refinery) on boot: its views read
      # `integrasi.mysimkari_satker` and V010 FKs `authenc.users`, so both
      # schemas must exist first.
      integrasi-migrate:
        condition: service_completed_successfully
      authenc-migrate:
        condition: service_completed_successfully
      authenc:
        condition: service_started
    networks:
      - simpel-network

  # =====================================================
  # REST→gRPC gateway sidecar for simpelv1
  # =====================================================
  # The PHP gateway clients (Authenc/Secrethon/Integrasi GrpcClient) speak REST
  # over localhost to this sidecar, which holds long-lived gRPC channels to the
  # core services and reshapes responses to the contract simpelv1 expects (see
  # layanan/gateway/AGENTS.md). In compose it's a normal service; in K8s it's a
  # localhost sidecar in the simpelv1 pod.
  gateway:
    build:
      context: .
      dockerfile: layanan/gateway/Dockerfile
    image: simpel2-gateway:local
    container_name: gateway
    ports:
      - "8090:8090"
    environment:
      RUST_LOG: debug
      GATEWAY_PORT: "8090"
      AUTHENC_GRPC_URL: http://authenc:50051
      SECRETON_GRPC_URL: http://secreton:50053
      INTEGRASI_GRPC_URL: http://layanan-integrasi:50052
    depends_on:
      authenc:
        condition: service_started
      secreton:
        condition: service_started
      layanan-integrasi:
        condition: service_started
    networks:
      - simpel-network

  # =====================================================
  # Legacy Application (SIMPEL v1)
  # =====================================================
  simpelv1:
    build:
      context: .
      dockerfile: monolith/simpelv1/Dockerfile
    container_name: simpelv1
    ports:
      - "8000:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: dbsimpelv1
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Laravel requires APP_KEY for cookie/session encryption. Without it
      # every web request fails with "No application encryption key has
      # been specified" because EncryptCookies is in the `web` middleware
      # group. Generate via `php artisan key:generate --show` and place
      # the resulting `base64:...` string in .env.
      APP_KEY: ${SIMPELV1_APP_KEY:?SIMPELV1_APP_KEY must be set in .env (use `php artisan key:generate --show`)}
      PORTAL_URL: http://localhost:3000/portal
      # The PHP gateway clients read *_GATEWAY_URL (see
      # `monolith/simpelv1/app/Services/Grpc/*GrpcClient.php`) and speak REST to
      # the `gateway` sidecar, which holds the gRPC channels upstream. All three
      # point at the single gateway port (8090); in K8s these become 127.0.0.1.
      AUTHENC_GATEWAY_URL: http://gateway:8090
      INTEGRASI_GATEWAY_URL: http://gateway:8090
      SECRETON_GATEWAY_URL: http://gateway:8090
      SESSION_DRIVER: file
      CACHE_DRIVER: file
    depends_on:
      postgres:
        condition: service_healthy
      authenc:
        condition: service_started
      gateway:
        condition: service_started
    networks:
      - simpel-network

  # =====================================================
  # Frontend Services (Antarmuka)
  # =====================================================
  portal:
    build:
      context: .
      dockerfile: antarmuka/portal/Dockerfile
    container_name: portal
    ports:
      - "3000:8080"
    environment:
      # The portal is an nginx container serving a WASM bundle. At
      # container start `antarmuka/portal/entrypoint.sh` writes
      # `config.json` from `PORTAL_URL` / `AUTHENC_URL`, which the WASM
      # app reads via `antarmuka/portal/src/utils/config.rs` to know
      # where to send auth requests (`features/auth.rs`).
      #
      # Since `config.json` is unconditionally generated, omitting these
      # vars does NOT fall back to origin-relative URLs — instead the
      # entrypoint bakes in the staging defaults (`http://10.1.7.121/...`)
      # which are unreachable from a developer's browser, silently
      # breaking the local auth flow. Set them explicitly to host-reachable
      # values for docker-compose. Both URLs must be reachable from the
      # browser running on the host, not from inside the container.
      PORTAL_URL: http://localhost:3000/portal
      # No authenc HTTP gateway is exposed in this compose file (authenc
      # speaks gRPC on :50051). Point at an origin-relative path so the
      # WASM client at least surfaces a clear 404 against the portal's
      # own nginx instead of silently hitting a staging IP. Replace with
      # a real gateway URL once a sidecar/proxy is added to compose.
      AUTHENC_URL: /api/v1/auth
    depends_on:
      authenc:
        condition: service_started
    networks:
      - simpel-network

  perlengkapan:
    build:
      context: .
      dockerfile: antarmuka/perlengkapan/Dockerfile
    container_name: perlengkapan
    ports:
      - "3001:8080"
    environment:
      # The perlengkapan microfrontend is an nginx container serving a
      # WASM bundle. At container start `antarmuka/perlengkapan/entrypoint.sh`
      # writes `config.json` from `API_URL` / `AUTHENC_URL`. Since the
      # entrypoint unconditionally generates `config.json`, omitting these
      # vars bakes in the staging defaults (`http://10.1.7.121/...`) which
      # are unreachable from a developer's browser, silently breaking the
      # local API/auth flow. Both URLs must be reachable from the browser
      # running on the host, not from inside the container.
      #
      # The previous `SIMPEL_KEAMANAN_URL=http://keamanan:8090` env var
      # was dead config — the entrypoint never reads it, and no `keamanan`
      # service exists in this compose file.
      API_URL: http://localhost:3020
      # No authenc HTTP gateway is exposed in this compose file (authenc
      # speaks gRPC on :50051). Point at an origin-relative path so the
      # WASM client surfaces a clear 404 against perlengkapan's own nginx
      # instead of silently hitting a staging IP. Replace with a real
      # gateway URL once a sidecar/proxy is added to compose.
      AUTHENC_URL: /api/v1/auth
      # nginx upstream host:port overrides (entrypoint substitutes these into
      # nginx.conf; defaults are the K8s Service ports). In compose the backend
      # listens on :3020, so without this override the in-browser FE->BE data
      # path (origin-relative /api/v1/perlengkapan/* proxied by this nginx) dials
      # the K8s port :8093 that nothing binds here → 502. authenc REST is only
      # published by the e2e overlay (:8088); in the base stack the /api/v1/auth
      # proxy still has no REST target (unchanged), so login uses the e2e overlay.
      PERLENGKAPAN_API_UPSTREAM: layanan-perlengkapan:3020
      AUTHENC_API_UPSTREAM: authenc:8088
    networks:
      - simpel-network

volumes:
  postgres_data:

networks:
  simpel-network:
    driver: bridge
