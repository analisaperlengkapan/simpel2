  pidum:
    build:
      context: /var/www/simpelv2/antarmuka/pidum
      dockerfile: Dockerfile
    ports:
    - 3008:3000
    networks:
    - simpelv2
    - internal
    labels:
      simpelv2.role: frontend
      simpelv2.name: pidum
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000
      interval: 30s
      timeout: 10s
      retries: 3
  portal:
    build:
      context: /var/www/simpelv2/antarmuka/portal
      dockerfile: Dockerfile
    ports:
    - 3009:80
    networks:
    - simpelv2
    - internal
    labels:
      simpelv2.role: frontend
      simpelv2.name: portal
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:80
      interval: 30s
      timeout: 10s
      retries: 3
  gerbang:
    build:
      context: ./infra/gerbang
      dockerfile: Dockerfile
    ports:
    - 8080:8080
    - 9901:9901
    networks:
    - simpelv2
    - internal
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      simpelv2.role: backend
      simpelv2.name: gerbang
    volumes:
    - ./logs/gerbang:/var/log
  src:
    build:
      context: /var/www/simpelv2/layanan/keamanan/src
      dockerfile: Dockerfile
    ports:
    - 7001:7000
    networks:
    - simpelv2
    - internal
    labels:
      simpelv2.role: backend
      simpelv2.name: src
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:7000
      interval: 30s
      timeout: 10s
      retries: 3
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
    - pgdata:/var/lib/postgresql/data
    networks:
    - simpelv2
    - internal
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${DB_USER}
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      simpelv2.role: db
      simpelv2.name: db
  nginx:
    image: nginx:stable-alpine
    volumes:
    - ./nginx/conf.d:/etc/nginx/conf.d:ro
    - ./nginx/certs:/etc/nginx/certs:ro
    - ./antarmuka/dist:/usr/share/nginx/html:ro
    - ./logs/nginx:/var/log/nginx
    ports:
    - 80:80
    - 443:443
    networks:
    - simpelv2
    - internal
    labels:
      simpelv2.role: infrastructure
      simpelv2.name: nginx
  db-simpelv2:
    image: postgres:15-alpine
    environment:
    - POSTGRES_PASSWORD=rahasia
    - POSTGRES_USER=simpel
    - POSTGRES_DB=simpelv2
    ports:
    - 5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    networks:
    - simpelv2
    - internal

networks:
  simpelv2: {}
  internal:
    internal: true
volumes:
  pgdata: {}
  logs:
    driver: local
