      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000
      interval: 30s
      timeout: 10s
      retries: 3
  pidmil:
    build:
      context: /var/www/simpelv2/antarmuka/pidmil
      dockerfile: Dockerfile
    ports:
    - 3006:3000
    networks:
    - simpelv2
    - internal
    labels:
      simpelv2.role: frontend
      simpelv2.name: pidmil
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000
      interval: 30s
      timeout: 10s
      retries: 3
  pidsus:
    build:
      context: /var/www/simpelv2/antarmuka/pidsus
      dockerfile: Dockerfile
    ports:
    - 3007:3000
    networks:
    - simpelv2
    - internal
    labels:
      simpelv2.role: frontend
      simpelv2.name: pidsus
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000
      interval: 30s
