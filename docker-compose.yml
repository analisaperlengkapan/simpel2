version: "3.9"

services:
  # =====================================================
  # Database
  # =====================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-create per-service databases (dbsimpelv2, dbsecretion,
      # dbintegration) on first startup. Without this, every
      # dependent service crashes with "database does not exist" because
      # the postgres image only creates the default `postgres` database.
      - ./infra/scripts/init-postgres-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simpel-network

  # =====================================================
  # Cache & Message Queue
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simpel-network

  # =====================================================
  # Core gRPC Services
  # =====================================================
  # One-shot schema migration (out-of-band, never on app startup). Runs the
  # authenc-migrate binary baked into the same image, then exits. authenc waits
  # for it to complete so replicas never race on migrations. Mirrors the Helm
  # pre-upgrade hook Job used in k8s.
  #
  # MUST run AFTER integrasi-migrate (not concurrently): both migrate the SAME
  # database (dbsimpelv2) and both issue `CREATE EXTENSION IF NOT EXISTS
  # "uuid-ossp"/"pg_trgm" WITH SCHEMA public`. `CREATE EXTENSION IF NOT EXISTS`
  # is NOT atomic against a concurrent creator — run in parallel, one transaction
  # blocks on the other's pg_extension insert and then either dies with
  # `duplicate key … pg_extension_name_index` (batch_execute → exit 1) or hangs.
  # Serializing them (integrasi → authenc) removes the race entirely. This
  # mirrors the Helm hook ordering (integrasi-migrate hook-weight -6 runs before
  # authenc-migrate -5); compose has no hook weights, so we express the same
  # order via depends_on. Bring-up order: integrasi → authenc → perlengkapan.
  authenc-migrate:
    image: simpel2-authenc:local
    container_name: authenc-migrate
    command: ["./authenc-migrate"]
    restart: "no"
    environment:
      RUST_LOG: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsimpelv2
    depends_on:
      postgres:
        condition: service_healthy
      integrasi-migrate:
        condition: service_completed_successfully
    networks:
      - simpel-network

  authenc:
    build:
      context: .
      dockerfile: layanan/authenc/Dockerfile
    # Shared with authenc-migrate so the image (incl. the migrate binary) is
    # built once; authenc-migrate references this same tag.
    image: simpel2-authenc:local
    container_name: authenc
    ports:
      - "${AUTHENC_GRPC_HOST_PORT:-50051}:50051"
    environment:
      RUST_LOG: debug
      GRPC_PORT: "50051"
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: dbsimpelv2
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsimpelv2
      # The cluster gives authenc this (values.yaml, `authenc.env`); compose
      # never did, so `state.integrasi_client` was None in every test run and
      # the whole fetch-at-read path — `satuan_kerja`, and now the employee
      # photo — was exercised nowhere. `/auth/me` still answers 200 without it,
      # just with a raw satker code and no photo, which is why nothing noticed.
      # http:// scheme required: tonic parses this as a URI.
      INTEGRASI_GRPC_URL: http://layanan-integrasi:50052
    depends_on:
      postgres:
        condition: service_healthy
      authenc-migrate:
        condition: service_completed_successfully
    networks:
      - simpel-network

  secreton:
    build:
      context: .
      dockerfile: layanan/secreton/Dockerfile
    # Explicit tag (was: compose default `<project>-<service>`). CI builds these
    # ONCE and pushes to the in-cluster registry, so the name must be stable and
    # independent of the compose project name. See ci.yml job `e2e-build-images`.
    image: simpel2-secreton:local
    container_name: secreton
    ports:
      - "${SECRETON_GRPC_HOST_PORT:-50053}:50053"
    environment:
      RUST_LOG: debug
      GRPC_PORT: "50053"
      # The gRPC listener refuses to start without mTLS material. The e2e stack
      # has no PKI, and its clients connect without client credentials, so the
      # boundary is opened deliberately here.
      # Enforcement itself is covered by `secreton-grpc`'s mtls_enforcement
      # tests, which mint a CA and drive a real handshake.
      GRPC_ALLOW_INSECURE: "true"
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: dbsecretion
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsecretion
    # /health is the top-level, seal-INDEPENDENT liveness route (whitelisted in
    # middleware.rs `is_whitelisted`) — it stays 200 while the engine is sealed,
    # so `service_healthy` does NOT deadlock the secreton-bootstrap one-shot,
    # which must run WHILE sealed to init+unseal. Do NOT switch this to
    # /v1/health (that path is behind seal_check_middleware → 503 while sealed).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8200/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - simpel-network

  # One-shot schema migration for the `integrasi.*` schema. integrasi has no
  # startup migration path — its tables were historically created ad-hoc at sync
  # time, so consumers that read `integrasi.*` cross-schema before any sync ran
  # (perlengkapan bank_aset + its dashboard views) found no tables. This runs the
  # integrasi-migrate binary, then exits. It targets dbsimpelv2 (NOT a separate
  # database) because perlengkapan reads `integrasi.siman_aset` cross-schema and
  # cross-schema only resolves within one database. Mirrors the Helm pre-upgrade
  # hook Job. Bring-up order: integrasi-migrate → authenc-migrate → perlengkapan.
  integrasi-migrate:
    image: simpel2-integrasi:local
    container_name: integrasi-migrate
    command: ["./integrasi-migrate"]
    restart: "no"
    environment:
      RUST_LOG: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsimpelv2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - simpel-network

  layanan-integrasi:
    build:
      context: .
      dockerfile: layanan/integrasi/Dockerfile
    # Shared with integrasi-migrate so the image (incl. the migrate binary) is
    # built once; integrasi-migrate references this same tag.
    image: simpel2-integrasi:local
    container_name: layanan-integrasi
    ports:
      - "${INTEGRASI_GRPC_HOST_PORT:-50052}:50052"
    environment:
      RUST_LOG: debug
      GRPC_PORT: "50052"
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Shares dbsimpelv2 so its sync writes land where consumers read
      # `integrasi.*` cross-schema (same DB as authenc + perlengkapan).
      DB_NAME: dbsimpelv2
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsimpelv2
      # NOTE: layanan-integrasi is a leaf data-source server — it calls NEITHER
      # authenc NOR secreton (the real direction is authenc→integrasi: authenc's
      # federation resolves satker via integrasi gRPC). Its config binds only
      # GRPC_*/DB_*/monsakti|mysimkari|siman URLs, so the old AUTHENC_GRPC_URL /
      # SECRETON_GRPC_URL here were vestigial (0 code refs) and are removed.
    depends_on:
      postgres:
        condition: service_healthy
      integrasi-migrate:
        condition: service_completed_successfully
      authenc:
        condition: service_started
      secreton:
        condition: service_started
    networks:
      - simpel-network

  # =====================================================
  # Backend Services (Layanan)
  # =====================================================
  layanan-perlengkapan:
    build:
      context: .
      dockerfile: layanan/perlengkapan/Dockerfile
    image: simpel2-layanan-perlengkapan:local
    container_name: layanan-perlengkapan
    ports:
      - "${PERLENGKAPAN_API_HOST_PORT:-3020}:3020"
    environment:
      RUST_LOG: debug
      SERVER_PORT: "3020"
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: dbsimpelv2
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsimpelv2
      # http:// scheme is required — tonic parses these as URIs (scheme-less
      # values fail to connect).
      AUTHENC_GRPC_URL: http://authenc:50051
      SECRETON_GRPC_URL: http://secreton:50053
      INTEGRASI_GRPC_URL: http://layanan-integrasi:50052
    depends_on:
      postgres:
        condition: service_healthy
      # perlengkapan self-migrates (refinery) on boot: its views read
      # `integrasi.mysimkari_satker` and V010 FKs `authenc.users`, so both
      # schemas must exist first.
      integrasi-migrate:
        condition: service_completed_successfully
      authenc-migrate:
        condition: service_completed_successfully
      authenc:
        condition: service_started
      # The IntegrasiClient connects EAGERLY at boot with only a short retry
      # window; start the integrasi gRPC server first so the MySIMKARI/SIMAN
      # read paths (analisis rekap, pakaian-dinas) are wired rather than
      # silently disabled on a boot race.
      layanan-integrasi:
        condition: service_started
    networks:
      - simpel-network

  # =====================================================
  # Secreton CI bootstrap (one-shot)
  # =====================================================
  # Runs the REAL Shamir init+unseal against secreton's REST API, writes a
  # secret and reads it back with the root token init returns, and (with
  # SECRETON_DB_PROVISION=1) leases a dynamic DB credential. Exits 0 on success.
  # CI-only — the unseal keys are throwaway (fresh DB every run); production
  # keys are captured offline (see secreton-ops).
  secreton-bootstrap:
    # Alpine with grpcurl: step 6 of the bootstrap leases a DB credential over
    # gRPC, the path layanan-perlengkapan uses.
    image: fullstorydev/grpcurl:v1.9.1-alpine
    # The image runs as user `grpcurl`; root is needed to `apk add` bash/curl/jq
    # and psql into this CI-only one-shot.
    user: "0:0"
    container_name: secreton-bootstrap
    restart: "no"
    environment:
      SECRETON_ADDR: http://secreton:8200
      SECRETON_SEED_PATH: ci-bootstrap/probe
      SECRETON_SEED_VALUE: ci-bootstrap-secret
      # Dynamic DB secrets-engine provisioning inputs. Inert unless the job runs
      # this one-shot with `-e SECRETON_DB_PROVISION=1` — then step 6 of the
      # bootstrap configures the admin connection + creates the leased role.
      SECRETON_DB_ROLE: perlengkapan-dyn
      SECRETON_DB_CONN: perlengkapan
      SECRETON_DB_ADMIN_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/dbsimpelv2
    volumes:
      - ./infra/scripts/secreton-ci-bootstrap.sh:/bootstrap.sh:ro
      - ./layanan/secreton/proto:/proto:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache bash curl jq >/dev/null 2>&1 && exec bash /bootstrap.sh"]
    depends_on:
      secreton:
        condition: service_healthy
    networks:
      - simpel-network

  # =====================================================
  # Frontend Services (Antarmuka)
  # =====================================================
  portal:
    build:
      context: .
      dockerfile: antarmuka/portal/Dockerfile
    image: simpel2-portal:local
    container_name: portal
    ports:
      - "${PORTAL_HOST_PORT:-3000}:8080"
    environment:
      # The portal is an nginx container serving a WASM bundle. At
      # container start `antarmuka/portal/entrypoint.sh` writes
      # `config.json` from `PORTAL_URL` / `AUTHENC_URL`, which the WASM
      # app reads via `antarmuka/portal/src/utils/config.rs` to know
      # where to send auth requests (`features/auth.rs`).
      #
      # Since `config.json` is unconditionally generated, omitting these
      # vars does NOT fall back to origin-relative URLs — instead the
      # entrypoint bakes in the staging defaults (`http://10.1.7.121/...`)
      # which are unreachable from a developer's browser, silently
      # breaking the local auth flow. Set them explicitly to host-reachable
      # values for docker-compose. Both URLs must be reachable from the
      # browser running on the host, not from inside the container.
      PORTAL_URL: http://localhost:3000/portal
      # Origin-relative, so the WASM client's auth calls hit this nginx, which
      # proxies them to authenc via the upstreams below. (authenc's REST API is
      # published by the e2e overlay on :8088; the base stack has no REST
      # target, so login only works under the overlay.)
      AUTHENC_URL: /api/v1/auth
      # nginx upstream host:port overrides (entrypoint substitutes these into
      # nginx.conf; defaults are the K8s Service ports). In compose the backends
      # listen on :3020 / :8088, so without these the in-browser FE→BE data path
      # (origin-relative /api/* proxied by this nginx) dials the K8s ports that
      # nothing binds here → 502 on every call, including the login page's
      # captcha widget.
      PERLENGKAPAN_API_UPSTREAM: layanan-perlengkapan:3020
      AUTHENC_API_UPSTREAM: authenc:8088
    depends_on:
      authenc:
        condition: service_started
    networks:
      - simpel-network

  perlengkapan:
    build:
      context: .
      dockerfile: antarmuka/perlengkapan/Dockerfile
    image: simpel2-perlengkapan:local
    container_name: perlengkapan
    ports:
      - "${PERLENGKAPAN_HOST_PORT:-3001}:8080"
    environment:
      # The perlengkapan microfrontend is an nginx container serving a
      # WASM bundle. At container start `antarmuka/perlengkapan/entrypoint.sh`
      # writes `config.json` from `API_URL` / `AUTHENC_URL`. Since the
      # entrypoint unconditionally generates `config.json`, omitting these
      # vars bakes in the staging defaults (`http://10.1.7.121/...`) which
      # are unreachable from a developer's browser, silently breaking the
      # local API/auth flow. Both URLs must be reachable from the browser
      # running on the host, not from inside the container.
      #
      # The previous `SIMPEL_KEAMANAN_URL=http://keamanan:8090` env var
      # was dead config — the entrypoint never reads it, and no `keamanan`
      # service exists in this compose file.
      API_URL: http://localhost:3020
      # No authenc HTTP gateway is exposed in this compose file (authenc
      # speaks gRPC on :50051). Point at an origin-relative path so the
      # WASM client surfaces a clear 404 against perlengkapan's own nginx
      # instead of silently hitting a staging IP. Replace with a real
      # gateway URL once a sidecar/proxy is added to compose.
      AUTHENC_URL: /api/v1/auth
      # nginx upstream host:port overrides (entrypoint substitutes these into
      # nginx.conf; defaults are the K8s Service ports). In compose the backend
      # listens on :3020, so without this override the in-browser FE->BE data
      # path (origin-relative /api/v1/perlengkapan/* proxied by this nginx) dials
      # the K8s port :8093 that nothing binds here → 502. authenc REST is only
      # published by the e2e overlay (:8088); in the base stack the /api/v1/auth
      # proxy still has no REST target (unchanged), so login uses the e2e overlay.
      PERLENGKAPAN_API_UPSTREAM: layanan-perlengkapan:3020
      AUTHENC_API_UPSTREAM: authenc:8088
    networks:
      - simpel-network

volumes:
  postgres_data:

networks:
  simpel-network:
    driver: bridge
