services:
  badiklat:
    build:
      context: /var/www/simpelv2/antarmuka/badiklat
      dockerfile: Dockerfile
    ports:
    - 3000:3000
    networks:
    - simpelv2
    - internal
    labels:
      simpelv2.role: frontend
      simpelv2.name: badiklat
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:3000
      interval: 30s
      timeout: 10s
      retries: 3
  datun:
    build:
      context: /var/www/simpelv2/antarmuka/datun
      dockerfile: Dockerfile
    ports:
    - 3001:3000
    networks:
    - simpelv2
    - internal
    labels:
      simpelv2.role: frontend
      simpelv2.name: datun
    healthcheck:
