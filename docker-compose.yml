  # PIDUM Microfrontend
  pidum:
    build:
      context: ./antarmuka/pidum
      dockerfile: Dockerfile
    networks:
      - simpelv2
      - internal
    labels:
      simpelv2.role: frontend
      simpelv2.name: pidum
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ================================
  # BACKEND SERVICES
  # ================================

  # API Gateway
  gerbang:
    build:
      context: ./infra/gerbang
      dockerfile: Dockerfile
    networks:
      - simpelv2
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      simpelv2.role: backend
      simpelv2.name: gerbang
    restart: unless-stopped

  # Security Service
  layanan-keamanan:
    build:
      context: ./layanan/keamanan
      dockerfile: Dockerfile
    networks:
      - simpelv2
      - internal
    labels:
      simpelv2.role: backend
      simpelv2.name: keamanan
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - postgres
    restart: unless-stopped

  # Integration Service
  layanan-integrasi:
    build:
      context: ./layanan/integrasi
      dockerfile: Dockerfile
    networks:
      - simpelv2
      - internal
    labels:
      simpelv2.role: backend
      simpelv2.name: integrasi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - postgres
    restart: unless-stopped

  # ================================
  # DATABASE SERVICES
  # ================================

  # Primary PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: simpelv2
      POSTGRES_USER: simpelv2_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - simpelv2
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpelv2_user -d simpelv2"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      simpelv2.role: database
      simpelv2.name: postgres

  # Redis Cache
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - simpelv2
      - internal
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      simpelv2.role: cache
      simpelv2.name: redis

  # ================================
  # INFRASTRUCTURE SERVICES
  # ================================

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - ./antarmuka/dist:/usr/share/nginx/html:ro
    depends_on:
      - portal
      - gerbang
    networks:
      - simpelv2
    labels:
      simpelv2.role: infrastructure
      simpelv2.name: nginx
    restart: unless-stopped

# ================================
# NETWORKS
# ================================
networks:
  simpelv2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  internal:
    driver: bridge
    internal: true

# ================================
# VOLUMES
# ================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
