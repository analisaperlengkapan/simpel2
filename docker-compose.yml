# SIMPelv2 Base Docker Compose Configuration
# Base services for all environments
# Usage: 
#   Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  # ================================
  # MICROFRONTEND SERVICES (11 total)
  # ================================
  
  # Portal - Main Entry Point
  portal:
    build:
      context: ./antarmuka/portal
      dockerfile: Dockerfile
    networks:
      - simpelv2
      - internal
    labels:
      simpelv2.role: frontend
      simpelv2.name: portal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Badiklat Microfrontend
  badiklat:
    build:
      context: ./antarmuka/badiklat
      dockerfile: Dockerfile
    networks:
      - simpelv2
      - internal
