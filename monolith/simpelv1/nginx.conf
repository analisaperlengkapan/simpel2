events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    merge_slashes on;

    # Docker/k8s DNS resolver
    resolver 127.0.0.11 ipv6=off valid=30s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json;

    # Upstream for PHP-FPM (if needed for separate service)
    upstream php_fpm {
        server 127.0.0.1:9000;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /app/public;
        index index.php;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss: https:; frame-ancestors 'none'; base-uri 'self';" always;

        # Deny access to .env and other dotfiles. MUST come before the
        # `\.php$` regex below — nginx evaluates regex locations in the
        # order they appear in the config and the first match wins, so a
        # request like `/.env.php` or `/.hidden/exploit.php` would
        # otherwise match the PHP location first and be proxied to
        # PHP-FPM, bypassing this deny rule. The redundant `/\.env`
        # block has been removed because `/\.` already covers it.
        location ~ /\. {
            deny all;
        }

        # Laravel routing - pass requests to PHP.
        #
        # `try_files $uri =404` is required defense-in-depth against
        # path-info injection: with `cgi.fix_pathinfo=1` (PHP's default
        # before 5.3.9 and still common in production), a request like
        # `/uploads/image.jpg/evil.php` would otherwise be passed to
        # PHP-FPM, which strips `/evil.php` and executes
        # `/uploads/image.jpg` as PHP. Verifying the literal `$uri`
        # exists on disk before forwarding closes that vector.
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass php_fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        # OAuth callback — the Portal currently redirects with the JWT
        # in a `?token=...` query string, which would otherwise be
        # persisted in nginx's access log in plain text (and remain
        # there until log rotation). Disable access logging for this
        # exact path so the token is never written to disk, and null
        # out the `Referer` header forwarded to PHP-FPM so downstream
        # log sinks don't see it either. We pass directly to PHP-FPM
        # with SCRIPT_FILENAME pinned to index.php — Laravel's router
        # still sees the original REQUEST_URI and dispatches to
        # `AuthController::oauthCallback` correctly. Using `try_files`
        # / `rewrite` here would leak the URI back through the main
        # access log via the re-dispatched internal request.
        #
        # The long-term fix is to switch the Portal to a short-lived
        # authorization-code flow or POST-body token delivery (the
        # POST variant is already supported by
        # `AuthController::oauthCallback`), but until that ships this
        # is the strongest log-hygiene we can apply locally.
        location = /auth/oauth-callback {
            access_log off;
            fastcgi_pass php_fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_REFERER "";
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        # SPA routing - serve index.php for all non-file/directory requests
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Static assets caching.
        # Note: nginx's `add_header` directive does NOT inherit from the
        # outer scope when *any* `add_header` is defined in this block, so
        # we must repeat every security header here. Otherwise static
        # assets (JS/CSS/fonts/images) would be served without
        # X-Content-Type-Options, CSP, HSTS, etc.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss: https:; frame-ancestors 'none'; base-uri 'self';" always;
        }

        # Nginx-only liveness probe — returns 200 as long as nginx is
        # serving traffic, even if PHP-FPM is down. Used for the
        # `livenessProbe` in K8s manifests.
        #
        # `default_type` must be set *before* `return`, because `return`
        # immediately produces the response and terminates processing —
        # any `add_header` placed after it is dead code and would not
        # affect the served Content-Type.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # `/health` is served by the Laravel app via try_files → index.php
        # so the readiness probe verifies the full nginx + PHP-FPM +
        # Laravel stack is responsive, not just nginx.
    }
}
