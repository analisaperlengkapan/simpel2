events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  text/html;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers — defined ONCE at server scope. nginx only inherits
        # add_header into a location that defines no add_header of its own, so
        # the nested locations below deliberately avoid add_header (using
        # `expires` / `default_type`) to keep these inherited without
        # re-declaring them (which Semgrep flags as header-redefinition).
        # CSP allowlists exactly what index.html loads: Google Fonts CSS/files
        # + its own inline <style>/<script>.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Long-lived caching for static assets. `expires` sets Cache-Control
        # without an add_header, so the server-scope security headers above
        # are still inherited here.
        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}
