# Docker Compose for Building SIMPelv2 Images
# Build all services with: docker compose -f docker-compose.build.yml build
# Push to registry: docker compose -f docker-compose.build.yml push

version: "3.9"

services:
  # =====================================================
  # Infrastructure Services
  # =====================================================

  secreton:
    build:
      context: .
      dockerfile: layanan/secreton/Dockerfile
    image: localhost:32000/simpelv2/secreton:latest

  authenc:
    build:
      context: .
      dockerfile: layanan/authenc/Dockerfile
    image: localhost:32000/simpelv2/authenc:latest

  # =====================================================
  # Backend Services (Layanan)
  # =====================================================

  layanan-portal:
    build:
      context: .
      dockerfile: layanan/daskrimti/portal/Dockerfile
    image: localhost:32000/simpelv2/layanan-portal:latest

  layanan-integrasi:
    build:
      context: .
      dockerfile: layanan/daskrimti/integrasi/Dockerfile
      target: cli
    image: localhost:32000/simpelv2/layanan-integrasi:latest

  layanan-integrasi-grpc:
    build:
      context: .
      dockerfile: layanan/daskrimti/integrasi/Dockerfile
      target: grpc
    image: localhost:32000/simpelv2/layanan-integrasi-grpc:latest

  layanan-perlengkapan:
    build:
      context: .
      dockerfile: layanan/pembinaan/perlengkapan/Dockerfile
    image: localhost:32000/simpelv2/layanan-perlengkapan:latest

  # =====================================================
  # Frontend Microfrontends (Antarmuka)
  # =====================================================

  portal:
    build:
      context: .
      dockerfile: antarmuka/daskrimti/portal/Dockerfile
    image: localhost:32000/simpelv2/portal:latest

  perlengkapan:
    build:
      context: .
      dockerfile: antarmuka/pembinaan/perlengkapan/Dockerfile
    image: localhost:32000/simpelv2/perlengkapan:latest

# Build Commands:
# ---------------
# Build all:     docker compose -f docker-compose.build.yml build
# Build one:     docker compose -f docker-compose.build.yml build authenc
# Push all:      docker compose -f docker-compose.build.yml push
# Push one:      docker compose -f docker-compose.build.yml push authenc
#
# Build order (if dependencies matter):
# 1. docker compose -f docker-compose.build.yml build secreton authenc
# 2. docker compose -f docker-compose.build.yml build layanan-portal layanan-perlengkapan
# 3. docker compose -f docker-compose.build.yml build portal perlengkapan
