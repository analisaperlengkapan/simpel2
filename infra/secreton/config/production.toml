# Production configuration for Secreton Secret Management Service
# This file follows HashiCorp Vault best practices
# ========================================================================
# CRITICAL SECURITY REQUIREMENTS:
# 1. All secrets MUST be provided via environment variables
# 2. Never commit actual credentials to version control
# 3. Use Consul or Raft for HA (NOT PostgreSQL)
# 4. Enable TLS for all connections
# 5. Configure proper backup and disaster recovery
# ========================================================================

[server]
host = "0.0.0.0"  # Bind to all interfaces (use firewall for access control)
port = 8200
workers = 4
timeout_seconds = 30

# ========================================================================
# STORAGE BACKEND CONFIGURATION (Choose ONE)
# ========================================================================
# Recommended for production: Consul (HA) or Raft (built-in HA)
# NOT recommended: PostgreSQL (legacy support only)
# ========================================================================

[storage]
# Option 1: File Backend (Default - Single Node)
# Best for: Development, single-node deployments, edge/IoT
# HA Support: No
backend = "file"
path = "/var/lib/secreton/data"
sync_writes = true
permissions = "0600"

# Option 2: Consul Backend (RECOMMENDED FOR HA)
# Best for: Production HA clusters, service discovery
# HA Support: Yes (automatic leader election)
# Uncomment to use:
# backend = "consul"
# address = "127.0.0.1:8500"
# path = "secreton/"
# scheme = "https"
# token = "${CONSUL_TOKEN}"  # Set via environment variable
# tls_skip_verify = false

# Option 3: Raft Integrated Storage (RECOMMENDED FOR HA)
# Best for: Production HA without external dependencies
# HA Support: Yes (built-in consensus)
# Uncomment to use:
# backend = "raft"
# node_id = 1
# peers = ["2:node2.example.com:7001", "3:node3.example.com:7001"]
# election_timeout_ms = 1000
# heartbeat_interval_ms = 300

# Option 4: S3 Backend (RECOMMENDED FOR CLOUD)
# Best for: Cloud-native deployments, unlimited scale
# HA Support: Coordination via external mechanism (e.g., DynamoDB)
# Uncomment to use:
# backend = "s3"
# bucket = "my-secreton-vault"
# region = "us-east-1"
# access_key = "${AWS_ACCESS_KEY_ID}"
# secret_key = "${AWS_SECRET_ACCESS_KEY}"
# prefix = "secreton/"
# sse_kms_key_id = "${AWS_KMS_KEY_ARN}"

# Option 5: PostgreSQL Backend (LEGACY - NOT RECOMMENDED)
# Only use for legacy migration - plan to move to Consul/Raft
# HA Support: Requires complex DB clustering setup
# Uncomment to use:
# backend = "postgres"
# host = "postgres"
# port = 5432
# database = "secreton"
# username = "${DB_USER}"
# password = "${DB_PASSWORD}"
# max_connections = 50
# connection_timeout = 30
# ssl_mode = "require"

[auth]
# JWT configuration - all secrets from environment variables
# SECRETON_JWT_SECRET must be set (minimum 32 characters)
require_auth = true
jwt_expiration_hours = 24
issuer = "secreton-vault-kejaksaan"
audience = "secreton-api"
# Admin roles for critical operations (seal, initialization, etc.)
admin_roles = ["admin", "vault-admin"]

[seal]
# Shamir Secret Sharing configuration
# Adjust based on organizational security requirements
# Recommended: 5 shares, 3 threshold for high availability
secret_shares = 5
secret_threshold = 3
seal_type = "shamir"

[tls]
# TLS is REQUIRED for production
enabled = true
cert_path = "/etc/secreton/tls/cert.pem"
key_path = "/etc/secreton/tls/key.pem"
ca_path = "/etc/secreton/tls/ca.pem"
# Minimum TLS version
min_version = "1.3"

[audit]
# Comprehensive audit logging for government compliance
enabled = true
log_path = "/var/log/secreton/audit.log"
# Rotate logs daily, keep 90 days for compliance
rotation = "daily"
retention_days = 90
# Log all operations including reads
log_reads = true

[rate_limiting]
# Prevent brute force and DOS attacks
enabled = true
# Global rate limits
max_requests_per_minute = 100
# Unseal-specific rate limits (more restrictive)
unseal_max_attempts = 10
unseal_window_seconds = 60

[metrics]
# Prometheus metrics endpoint
enabled = true
port = 9090
path = "/metrics"

[hsm]
# Hardware Security Module (optional but recommended for production)
enabled = false
provider = "pkcs11"
# Path to HSM library (e.g., /usr/lib/softhsm/libsofthsm2.so)
library_path = "${HSM_LIBRARY_PATH}"
slot_id = 0
# HSM PIN must be provided via HSM_PIN environment variable
pin = "${HSM_PIN}"

[backup]
# Backup configuration for disaster recovery
enabled = true
schedule = "0 2 * * *"  # Daily at 2 AM
retention_days = 30
# Backup location (should be encrypted storage)
path = "/var/backups/secreton"

[logging]
level = "info"
format = "json"  # Structured logging for production
output = "stdout"  # Let container orchestrator handle log collection
