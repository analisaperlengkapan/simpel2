[database]

host = "localhost"

port = 5432# HTTP Server configuration# HTTP Server configuration

database = "secreton"

username = "secreton"[http][http]

password = "secreton"

max_connections = 20bind_address = "127.0.0.1:8200"bind_address = "127.0.0.1:8200"

connection_timeout = 30

timeout = "30s"timeout = "30s"

max_body_size = 16777216  # 16 MBmax_body_size = 16777216  # 16 MB

keep_alive = "75s"keep_alive = "75s"

compression = truecompression = true



# gRPC Server configuration# gRPC Server configuration

[grpc][grpc]

enabled = trueenabled = true

bind_address = "127.0.0.1:8201"bind_address = "127.0.0.1:8201"

timeout = "30s"timeout = "30s"

max_message_size = 4194304  # 4 MBmax_message_size = 4194304  # 4 MB

reflection = falsereflection = false

health_check = truehealth_check = true



# Authentication configuration# Database configuration

[auth][database]

[auth.jwt]host = "localhost"

# DO NOT set JWT secret here - use JWT_SECRET environment variableport = 5432

secret = "change-this-secret-in-production"database = "secreton"

expiration = "3600s"  # 1 hourusername = "secreton"

refresh_expiration = "604800s"  # 7 dayspassword = "secreton"  # Override with DATABASE_URL env var in production

algorithm = "HS256"max_connections = 20

issuer = "Secreton"connection_timeout = 30

audience = "secreton-api"

# Authentication configuration

[auth.session][auth]

timeout = "3600s"[auth.jwt]

store = "Memory"# DO NOT set JWT secret here - use JWT_SECRET environment variable

secret = "change-this-secret-in-production"

[auth.session.cookie]expiration = "3600s"  # 1 hour

name = "secreton-session"refresh_expiration = "604800s"  # 7 days

path = "/"algorithm = "HS256"

secure = false  # Set to true in production with TLSissuer = "Secreton"

http_only = trueaudience = "secreton-api"

same_site = "Strict"

[auth.session]

[auth.mfa]timeout = "3600s"

enabled = truestore = "Memory"



[auth.mfa.totp][auth.session.cookie]

issuer = "Secreton Vault"name = "secreton-session"

secret_length = 32path = "/"

time_step = 30secure = false  # Set to true in production with TLS

code_length = 6http_only = true

skew_tolerance = 1same_site = "Strict"



# Rate limiting configuration# Multi-Factor Authentication (MFA) configuration for government employees

[rate_limit][mfa]

enabled = true# Enable MFA enforcement for all users

enabled = true

[rate_limit.global]# Default MFA method for new users

requests = 1000default_method = "TOTP"

window = "60s"# Supported MFA methods

burst = 100supported_methods = ["TOTP", "SMS", "Email"]



# Database configuration# TOTP (Time-based One-Time Password) configuration

[database][mfa.totp]

host = "localhost"# TOTP issuer name displayed in authenticator apps

port = 5432issuer = "SIMPelv2 Kejaksaan RI"

database = "secreton"# Time window in seconds (standard is 30)

username = "secreton"time_window = 30

password = "secreton"  # Override with DATABASE_URL env var in production# Number of digits in TOTP code (6 or 8)

max_connections = 20digits = 6

connection_timeout = 30# Hash algorithm (SHA1, SHA256, SHA512)

algorithm = "SHA1"

# Monitoring configuration# Clock skew tolerance (number of time windows to accept)

[monitoring]skew_tolerance = 1

metrics = true# QR code image size in pixels

metrics_path = "/metrics"qr_code_size = 256

health_path = "/health"

tracing = true# MFA enforcement policies for government employees

[mfa.policies]

# CORS configuration# Require MFA for all government employees

[cors]enforce_for_all = true

enabled = true# Grace period for MFA setup (in days)

allowed_origins = ["*"]setup_grace_period = 7

allowed_methods = ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]# Maximum failed MFA attempts before account lockout

allowed_headers = ["Content-Type", "Authorization", "X-Requested-With"]max_failed_attempts = 5

exposed_headers = []# Account lockout duration in minutes

max_age = "3600s"lockout_duration = 30

allow_credentials = true# Require MFA re-verification after this many hours

reauth_interval = 8

# Logging configuration

[logging]# Role-based MFA requirements

level = "info"[mfa.policies.roles]

format = "pretty"# Administrative roles require immediate MFA setup

json = falseadmin_immediate_setup = ["AdminPusat", "AdminEselonI", "AdminWilayah", "AdminSatker"]

# High-privilege roles require stricter MFA policies

# HSM configuration (optional)high_privilege_roles = ["AdminPusat", "AdminEselonI"]

[hsm]# Standard employee roles

enabled = falsestandard_roles = ["PegawaiNegeri", "PegawaiKontrak"]


# Organizational unit (Satker) specific MFA policies
[mfa.policies.satker]
# High-security satkers require immediate MFA setup
high_security_satkers = ["KEJAKSAAN_AGUNG", "KEJATI_DKI", "KEJARI_JAKARTA_PUSAT"]
# Standard satkers have normal grace period
standard_satkers = ["KEJATI_*", "KEJARI_*"]

# Recovery codes configuration
[mfa.recovery_codes]
# Number of recovery codes to generate
count = 10
# Length of each recovery code
length = 12
# Format: "numeric", "alphanumeric", "hex"
format = "alphanumeric"
# Allow recovery code reuse (not recommended for security)
allow_reuse = false

# Rate limiting for MFA operations
[mfa.rate_limiting]
# Maximum MFA verification attempts per minute
max_attempts_per_minute = 10
# Maximum MFA setup attempts per hour
max_setup_attempts_per_hour = 3
# Rate limit window in seconds
window_seconds = 60
# Enable progressive delays for failed attempts
progressive_delays = true

# Audit logging for MFA operations
[mfa.audit]
# Enable comprehensive MFA audit logging
enabled = true
# Log successful MFA verifications
log_success = true
# Log failed MFA attempts
log_failures = true
# Log MFA setup and configuration changes
log_setup_changes = true
# Log recovery code usage
log_recovery_usage = true
# Retention period for MFA audit logs (in days)
retention_days = 365

# Integration with external systems
[mfa.integration]
# SMS provider for SMS-based MFA (if enabled)
sms_provider = "twilio"
# Email provider for email-based MFA (if enabled)
email_provider = "smtp"
# Push notification provider (for future mobile app integration)
push_provider = "firebase"

# Security settings for MFA secrets
[mfa.security]
# Encryption algorithm for MFA secrets
secret_encryption = "AES-256-GCM"
# Key derivation function for MFA secret encryption
kdf = "PBKDF2"
# Number of KDF iterations
kdf_iterations = 100000
# Salt length for KDF
salt_length = 32
# Enable hardware security module (HSM) for key storage
use_hsm = false
# HSM configuration (if enabled)
hsm_slot = 0
hsm_pin = "change-this-hsm-pin"

# Backup and disaster recovery for MFA data
[mfa.backup]
# Enable automatic backup of MFA configurations
enabled = true
# Backup interval in hours
interval_hours = 24
# Backup retention period in days
retention_days = 90
# Backup encryption key (should be different from main encryption key)
backup_encryption_key = "change-this-backup-key"
# Backup storage location
backup_path = "./backups/mfa"

# Monitoring and alerting for MFA operations
[mfa.monitoring]
# Enable MFA metrics collection
metrics_enabled = true
# Alert on suspicious MFA patterns
alert_on_anomalies = true
# Threshold for failed MFA attempts to trigger alert
failed_attempts_threshold = 20
# Time window for failed attempts monitoring (in minutes)
monitoring_window_minutes = 15
# Alert destinations
alert_email = "security@kejaksaan.go.id"
alert_webhook = "https://monitoring.kejaksaan.go.id/alerts/mfa"
