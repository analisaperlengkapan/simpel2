# Secret for Secreton configuration
apiVersion: v1
kind: Secret
metadata:
  name: secreton-config
  namespace: secreton
type: Opaque
stringData:
  secreton.toml: |
    # Secreton Bootstrap Configuration
    # Infrastructure only - NO SECRETS

    [storage]
    backend = "raft"

    [storage.raft]
    path = "/var/lib/secreton/raft"
    node_id = "node1"

    [listener.http]
    address = "0.0.0.0:8200"
    tls_enabled = false

    [listener.grpc]
    enabled = true
    address = "0.0.0.0:8201"

    [seal]
    type = "shamir"

    [seal.shamir]
    shares = 5
    threshold = 3

    [telemetry]
    prometheus_enabled = true
    metrics_path = "/metrics"

    log_level = "info"
    log_format = "json"

    [server]
    address = "0.0.0.0:8200"
    tls_address = "0.0.0.0:8201"

    [server.tls]
    enabled = true
    cert_file = "/app/certs/tls.crt"
    key_file = "/app/certs/tls.key"

    [storage]
    backend = "postgres"

    [storage.postgres]
    connection_url = "postgresql://secreton:PASSWORD_PLACEHOLDER@postgres:5432/secreton"
    max_connections = 50
    min_connections = 10

    [seal]
    type = "shamir"
    shares = 5
    threshold = 3

    [telemetry]
    prometheus_enabled = true
    metrics_path = "/metrics"

    [logging]
    level = "info"
    format = "json"

---
# Secret for PostgreSQL credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: secreton
type: Opaque
stringData:
  postgres-password: CHANGEME_IN_PRODUCTION
  secreton-db-password: CHANGEME_IN_PRODUCTION
