# ConfigMap for Secreton configuration helpers
apiVersion: v1
kind: ConfigMap
metadata:
  name: secreton-scripts
  namespace: secreton
data:
  init.sh: |
    #!/bin/sh
    set -e
    echo "Initializing Secreton..."

    # Wait for PostgreSQL
    until pg_isready -h postgres -U secreton; do
      echo "Waiting for PostgreSQL..."
      sleep 2
    done

    echo "PostgreSQL is ready"

    # Start Secreton server
    exec /app/secreton server --config /app/config/secreton.toml

---
# ConfigMap for Prometheus configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: secreton
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'secreton'
        static_configs:
          - targets: ['secreton-service:8200']
        metrics_path: '/metrics'
        scheme: http
