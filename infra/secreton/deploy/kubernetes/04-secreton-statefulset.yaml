# Secreton StatefulSet for HA deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secreton
  namespace: secreton
  labels:
    app: secreton
spec:
  serviceName: secreton
  replicas: 3 # 3-node cluster for HA
  selector:
    matchLabels:
      app: secreton
  template:
    metadata:
      labels:
        app: secreton
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: secreton
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: secreton
          image: secreton:latest # Replace with your registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8200
              name: http
            - containerPort: 8201
              name: https
            - containerPort: 8300
              name: cluster
          env:
            - name: RUST_LOG
              value: "info"
            - name: SECRETON_CONFIG
              value: "/app/secreton.toml"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: config
              mountPath: /app/secreton.toml
              subPath: secreton.toml
              readOnly: true
            - name: data
              mountPath: /var/lib/secreton
            - name: tls
              mountPath: /app/certs
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          secret:
            secretName: secreton-config
        - name: tls
          secret:
            secretName: secreton-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        storageClassName: fast # Use SSD storage class

---
# Secreton Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: secreton-service
  namespace: secreton
  labels:
    app: secreton
spec:
  type: ClusterIP
  selector:
    app: secreton
  ports:
    - port: 8200
      targetPort: 8200
      name: http
    - port: 8201
      targetPort: 8201
      name: https

---
# Secreton Headless Service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: secreton
  namespace: secreton
spec:
  clusterIP: None
  selector:
    app: secreton
  ports:
    - port: 8300
      targetPort: 8300
      name: cluster
