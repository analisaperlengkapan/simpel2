[package]
name = "secreton-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "RESTful and gRPC API server for Secreton vault system"
keywords = ["api", "rest", "grpc", "http", "server"]

[build-dependencies]
tonic-build.workspace = true
chrono.workspace = true
rustc_version.workspace = true

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
futures.workspace = true

# HTTP server
axum.workspace = true
hyper.workspace = true
tower.workspace = true
tower-http.workspace = true
axum-server.workspace = true

# TLS (still needed for HTTPS)
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true

rustls-native-certs.workspace = true

# Utility crates
base64.workspace = true
hex.workspace = true
flate2.workspace = true
sha2.workspace = true
hmac.workspace = true
sha3.workspace = true

# Metrics
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

# Database
deadpool-postgres.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true

# Authentication
jsonwebtoken.workspace = true
x509-parser.workspace = true

# Configuration
toml.workspace = true
url.workspace = true

# HTTP client (for OIDC JWKS fetching)
reqwest.workspace = true

# Utilities
once_cell.workspace = true

# Internal crates
secreton-core.workspace = true
secreton-storage.workspace = true
secreton-crypto.workspace = true
secreton-hsm.workspace = true
secreton-grpc.workspace = true

[features]
default = []
# High-availability mode with Raft consensus (experimental)
# Note: Raft implementation is currently under development
raft-consensus = ["secreton-storage/raft-consensus"]
# Enable inline test modules (currently have compilation issues)
enable-inline-tests = []

[dev-dependencies]
axum-test.workspace = true
criterion.workspace = true
tempfile.workspace = true
proptest.workspace = true
