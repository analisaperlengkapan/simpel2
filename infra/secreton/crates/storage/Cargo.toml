[package]
name = "secreton-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Secure storage backend for Secreton vault system"
keywords = ["storage", "database", "vault", "security"]

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true

# Database backends (optional)
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }

# Cryptography
secreton-crypto.workspace = true
zeroize.workspace = true

# OpenRaft consensus (modern alternative to raft)
openraft = { workspace = true, optional = true }
slog = { workspace = true, optional = true }
slog-term = { workspace = true, optional = true }
slog-async = { workspace = true, optional = true }
bincode.workspace = true

[features]
default = ["postgres"]
postgres = ["tokio-postgres", "deadpool-postgres"]
raft-consensus = ["openraft", "slog", "slog-term", "slog-async"]

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
