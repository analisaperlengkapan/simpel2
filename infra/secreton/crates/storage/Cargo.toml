[package]
name = "secreton-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Secure storage backend for Secreton vault system"
keywords = ["storage", "database", "vault", "security"]

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true

# Database backends (optional - not recommended for HA)
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }

# HTTP client for Consul and cloud backends
reqwest = { workspace = true, optional = true }
base64.workspace = true

# Cryptography
secreton-crypto.workspace = true
zeroize.workspace = true

# OpenRaft consensus (modern alternative to raft)
openraft = { workspace = true, optional = true }
slog = { workspace = true, optional = true }
slog-term = { workspace = true, optional = true }
slog-async = { workspace = true, optional = true }
bincode.workspace = true

[features]
# Default: File-based storage (no external dependencies)
default = ["file"]

# Backend features (HashiCorp Vault-compatible)
file = []
consul = ["reqwest"]
raft-consensus = ["openraft", "slog", "slog-term", "slog-async"]
s3 = ["reqwest"]
postgres = ["tokio-postgres", "deadpool-postgres"]

# Convenience features
all-backends = ["file", "consul", "raft-consensus", "s3", "postgres"]
ha-backends = ["consul", "raft-consensus"]
cloud-backends = ["s3"]

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
