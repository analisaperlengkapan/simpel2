[package]
name = "secreton-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core types and utilities for Secreton vault system"
keywords = ["core", "types", "utilities", "security"]

[dependencies]
# Core dependencies
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true

# Async runtime
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true

# HTTP client (for external API calls like Authenc)
reqwest.workspace = true

# DEPRECATED: Web framework dependencies moved to optional features
# These are only needed for deprecated legacy code and will be removed in v2.0.0
axum = { workspace = true, optional = true }
warp = { workspace = true, optional = true }

# Database
deadpool-postgres.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true

# Cryptography
argon2.workspace = true
rand.workspace = true
ring.workspace = true
x509-parser.workspace = true
aes-gcm.workspace = true
sha2.workspace = true
zeroize.workspace = true
hmac.workspace = true
flate2.workspace = true

# TOTP/OTP support
totp-lite.workspace = true
data-encoding.workspace = true

# SSH key generation and certificate signing
ssh-key.workspace = true
ssh-encoding.workspace = true

# AWS SDK for secrets engine
aws-config.workspace = true
aws-sdk-iam.workspace = true
aws-sdk-sts.workspace = true
aws-types.workspace = true
aws-credential-types.workspace = true

# PKI dependencies
rcgen.workspace = true
pem.workspace = true
der-parser.workspace = true

# Utilities
config.workspace = true
lru.workspace = true
base64.workspace = true
hex.workspace = true
urlencoding.workspace = true
bincode.workspace = true
toml.workspace = true
glob.workspace = true
parking_lot.workspace = true
log.workspace = true
getrandom.workspace = true
regex.workspace = true
ipnetwork.workspace = true
url.workspace = true
sysinfo = "0.33.1"
jsonwebtoken.workspace = true

# Internal crates
secreton-hsm.workspace = true
totp-rs.workspace = true
secreton-types.workspace = true
secreton-crypto.workspace = true
secreton-storage.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6"

[features]
default = []
test-utils = []

# DEPRECATED: Legacy web framework support
# These features enable deprecated code that depends on web frameworks.
# Will be removed in v2.0.0. Do not use in new code.
legacy-warp-api = ["dep:warp"]
legacy-axum-middleware = ["dep:axum"]
