[package]
name = "secreton-grpc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
raft-consensus = ["lib-storage/raft-consensus"]
enable-inline-tests = []
metrics = ["dep:metrics"]

[dependencies]
# Internal dependencies
secreton-core = { path = "../core" }
lib-storage = { path = "../../../../lib/storage" }
lib-crypto = { path = "../../../../lib/crypto" }


# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# gRPC
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }

# TLS
rustls = { workspace = true }
tokio-rustls = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }

# Metrics (optional, for production monitoring)
metrics = { workspace = true, optional = true }

# Compression (for snapshots)
flate2 = { workspace = true, optional = true }
sha2 = { workspace = true }

# Database (for mock pool in gRPC service)
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
chrono = { workspace = true }
rustc_version = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
