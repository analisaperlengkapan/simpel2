# Secreton is now part of the main simpelv2 workspace
# Sub-crates are defined in the root Cargo.toml

[package]
name = "secreton"
version = "0.1.0"
edition = "2024"
authors = ["Cipherce Security Team <security@cipherce.io>"]
license = "Apache-2.0"
repository = "https://github.com/cipherce/secreton-vault"
homepage = "https://cipherce.io/secreton"
description = "Advanced Security Vault System with Quantum-Safe Cryptography by Cipherce"
keywords = ["security", "vault", "cryptography", "zero-trust", "quantum-safe"]
categories = ["cryptography", "authentication", "security-tools"]
rust-version = "1.90"

[dependencies]
# Core crate dependencies (local)
secreton-core = { path = "crates/core" }
secreton-crypto = { path = "crates/crypto" }
secreton-storage = { path = "crates/storage" }
secreton-api = { path = "crates/api" }

# Core dependencies (from workspace)
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
zeroize.workspace = true

# Async runtime
async-trait.workspace = true
futures.workspace = true

# Cryptography
aes-gcm.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true
sha2.workspace = true
sha3.workspace = true
blake3.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
hkdf.workspace = true

# Encoding
hex.workspace = true
base64.workspace = true
rand.workspace = true
rand_core.workspace = true

# RustCrypto elliptic curves
p256.workspace = true
k256.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true

# Cryptographic traits
digest.workspace = true
signature.workspace = true

# Network and HTTP
axum.workspace = true
hyper.workspace = true
tower.workspace = true
tower-http.workspace = true

# Database - PostgreSQL
tokio-postgres.workspace = true
deadpool-postgres.workspace = true

# TLS
rustls.workspace = true

# Configuration
toml.workspace = true
clap.workspace = true

# Testing
criterion.workspace = true
tempfile.workspace = true
pretty_assertions.workspace = true

[dev-dependencies]
proptest.workspace = true

# Shamir Secret Sharing (for tests)
num-bigint.workspace = true
num-traits.workspace = true
flate2.workspace = true

# Benchmarks
[[bench]]
name = "transit_bench"
harness = false

[[bench]]
name = "storage_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0
debug = true
incremental = true

# Security-focused profile for maximum performance
[profile.security]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true

# Note: Switched from raft to openraft to avoid protobuf 2.x vulnerability
# openraft is a modern, actively maintained Raft implementation without legacy dependencies
