# Note: This file is now part of the main workspace at /srv/proyek/simpelv2_web/Cargo.toml
# All dependencies should be inherited from the root workspace

[workspace]
members = [
    "crates/core",
    "crates/crypto",
    "crates/storage",
    "crates/api",
    "crates/agent",
    "crates/cli",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["Cipherce Security Team <security@cipherce.io>"]
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.48.0", features = ["full"] }
async-trait = "0.1.89"
futures = "0.3.31"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
log = "0.4"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

# Cryptography - Modern algorithms
sha2 = "0.10.9"
blake3 = "1.5"
hmac = "0.12"
argon2 = "0.5"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["serde", "static_secrets"] }
curve25519-dalek = "4.1"
p256 = "0.13"
p384 = "0.13"
k256 = "0.13"
aes-gcm = "0.10.3"
chacha20poly1305 = "0.10.1"
ring = "0.17.14"
rand = "0.8.5"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

# Encoding
base64 = "0.22"
hex = "0.4"

# Compression
flate2 = "1.1.5"

# HTTP and networking
axum = { version = "0.8.6", features = ["macros", "json", "tracing"] }
hyper = { version = "1.7.0", features = ["full"] }
tower = { version = "0.5.2", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6.6", features = [
    "trace",
    "cors",
    "compression-full",
    "timeout",
] }

# Database - PostgreSQL
tokio-postgres = { version = "0.7.15", features = [
    "with-uuid-1",
    "with-chrono-0_4",
    "with-serde_json-1",
] }
deadpool-postgres = "0.14.1"

# TLS
rustls = "0.23.34"
rustls-pemfile = "2.0"
tokio-rustls = "0.26"

# Storage (optional)
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }

# Distributed consensus - OpenRaft (modern alternative to raft)
openraft = { version = "0.9.21", features = ["serde"] }
slog = "2.8.2"
slog-term = "2.9.2"
slog-async = "2.8"

# Configuration
toml = "0.9.8"
config = "0.15.18"
clap = { version = "4.5.50", features = ["derive"] }

# Additional crypto
pbkdf2 = "0.12"
hkdf = "0.12"
sha3 = "0.10.8"

# Crypto traits
digest = "0.10"
signature = "2.2"
elliptic-curve = "0.13"
generic-array = "1.3.5"
subtle = "2.6"

# Additional crypto
aes = "0.8.4"
scrypt = "0.11"
bincode = "2.0.1"
cbc = "0.1"

# Utilities
parking_lot = "0.12.5"
regex = "1.12.2"
lru = "0.16.2"
glob = "0.3"
urlencoding = "2.1"

# API documentation
aide = { version = "0.15.1", features = ["axum", "macros"] }

# Security
secrecy = { version = "0.10.3", features = ["serde"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Web frameworks (for compatibility)
warp = "0.4.2"
axum-server = { version = "0.7", features = ["tls-rustls"] }

# gRPC
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
tonic-build = "0.12"
prost = "0.13"

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Authentication
jsonwebtoken = "9.2"
x509-parser = "0.18.0"

# Post-Quantum Cryptography
pqcrypto-mldsa = "0.1.2"
pqcrypto-mlkem = "0.1.1"
pqcrypto-falcon = "0.4.1"
pqcrypto-traits = "0.3"

# Shamir Secret Sharing
num-bigint = "0.4"
num-traits = "0.2"

# CLI utilities
clap_complete = "4.4"
dirs = "6.0.0"
comfy-table = "7.1"
url = "2.4"
rpassword = "7.3"
serde_yaml = "0.9"

# Testing
criterion = { version = "0.7.0", features = ["html_reports"] }
proptest = { version = "1.8.0", default-features = false, features = ["std"] }
tempfile = "3.23.0"
pretty_assertions = "1.4.1"

# Build dependencies
rustc_version = "0.4"

# Inter-crate dependencies
secreton-core = { path = "crates/core" }
secreton-crypto = { path = "crates/crypto" }
secreton-storage = { path = "crates/storage" }
secreton-api = { path = "crates/api" }

[package]
name = "secreton"
version = "1.0.0"
edition = "2024"
authors = ["Cipherce Security Team <security@cipherce.io>"]
license = "Apache-2.0"
repository = "https://github.com/cipherce/secreton-vault"
homepage = "https://cipherce.io/secreton"
description = "Advanced Security Vault System with Quantum-Safe Cryptography by Cipherce"
keywords = ["security", "vault", "cryptography", "zero-trust", "quantum-safe"]
categories = ["cryptography", "authentication", "security-tools"]
rust-version = "1.90"

[dependencies]
# Core crate dependencies (local)
secreton-core = { path = "crates/core" }
secreton-crypto = { path = "crates/crypto" }
secreton-storage = { path = "crates/storage" }
secreton-api = { path = "crates/api" }

# Core dependencies (from workspace)
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
zeroize.workspace = true

# Async runtime
async-trait.workspace = true
futures.workspace = true

# Cryptography
aes-gcm.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true
sha2.workspace = true
sha3.workspace = true
blake3.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
hkdf.workspace = true

# Encoding
hex.workspace = true
base64.workspace = true
rand.workspace = true
rand_core.workspace = true

# RustCrypto elliptic curves
p256.workspace = true
k256.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true

# Cryptographic traits
digest.workspace = true
signature.workspace = true

# Network and HTTP
axum.workspace = true
hyper.workspace = true
tower.workspace = true
tower-http.workspace = true

# Database - PostgreSQL
tokio-postgres.workspace = true
deadpool-postgres.workspace = true

# TLS
rustls.workspace = true

# Configuration
toml.workspace = true
clap.workspace = true

# Testing
criterion.workspace = true
tempfile.workspace = true
pretty_assertions.workspace = true

[[bench]]
name = "performance"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0
debug = true
incremental = true

# Security-focused profile for maximum performance
[profile.security]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true

# Note: Switched from raft to openraft to avoid protobuf 2.x vulnerability
# openraft is a modern, actively maintained Raft implementation without legacy dependencies
