syntax = "proto3";

package secreton.api;

import "common.proto";

// Secreton gRPC API Service
service SecretonAPI {
  // Health check
  rpc Health(HealthRequest) returns (HealthResponse);

  // Transit engine operations
  rpc Encrypt(EncryptRequest) returns (EncryptResponse);
  rpc Decrypt(DecryptRequest) returns (DecryptResponse);

  // KV secrets operations
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
}

// Health check messages
message HealthRequest {
  secreton.common.Metadata metadata = 1;
}

message HealthResponse {
  secreton.common.Metadata metadata = 1;
  string status = 2;
  bool sealed = 3;
}

// Transit engine messages
message EncryptRequest {
  string key_name = 1;
  bytes plaintext = 2;
  secreton.common.Metadata metadata = 3;
}

message EncryptResponse {
  string ciphertext = 1;
  secreton.common.Metadata metadata = 2;
}

message DecryptRequest {
  string key_name = 1;
  string ciphertext = 2;
  secreton.common.Metadata metadata = 3;
}

message DecryptResponse {
  bytes plaintext = 1;
  secreton.common.Metadata metadata = 2;
}

// KV secrets messages
message GetSecretRequest {
  string path = 1;
  secreton.common.Metadata metadata = 2;
}

message GetSecretResponse {
  map<string, string> data = 1;
  secreton.common.Metadata metadata = 2;
}

message PutSecretRequest {
  string path = 1;
  map<string, string> data = 2;
  secreton.common.Metadata metadata = 3;
}

message PutSecretResponse {
  secreton.common.Metadata metadata = 1;
}

message DeleteSecretRequest {
  string path = 1;
  secreton.common.Metadata metadata = 2;
}

message DeleteSecretResponse {
  secreton.common.Metadata metadata = 1;
}

message ListSecretsRequest {
  string path = 1;
  secreton.common.Metadata metadata = 2;
}

message ListSecretsResponse {
  repeated string keys = 1;
  secreton.common.Metadata metadata = 2;
}
