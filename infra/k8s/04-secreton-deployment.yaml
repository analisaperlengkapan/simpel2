---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secreton
  namespace: simpelv2-infra
  labels:
    app: secreton
    component: infrastructure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secreton
  template:
    metadata:
      labels:
        app: secreton
        component: infrastructure
    spec:
      containers:
        - name: secreton
          image: localhost:32000/simpelv2/secreton:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8200
              name: http
              protocol: TCP
            - containerPort: 9000
              name: grpc
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: HTTP_PORT
              value: "8200"
            - name: GRPC_PORT
              value: "9000"
            - name: METRICS_PORT
              value: "9090"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
            - name: RUST_LOG
              value: "info,secreton=debug"
            - name: RAFT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: secreton-data
              mountPath: /app/data
      volumes:
        - name: secreton-data
          persistentVolumeClaim:
            claimName: secreton-raft-pvc
