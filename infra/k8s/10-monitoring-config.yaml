# SIMPelv2 Monitoring Configuration
# ConfigMaps for Prometheus, Grafana, Loki, Promtail, AlertManager

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'simpelv2-microk8s'
        environment: 'production'

    rule_files:
      - "simpelv2_rules.yml"

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager-service:9093

    scrape_configs:
      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https

      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
        - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics

      # Kubernetes pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name

      # SIMPelv2 Infrastructure Services
      - job_name: 'simpelv2-postgres'
        static_configs:
        - targets: ['postgres-service.simpelv2-infra.svc.cluster.local:5432']
        metrics_path: /metrics
        scrape_interval: 30s

      - job_name: 'simpelv2-redis'
        static_configs:
        - targets: ['redis-service.simpelv2-infra.svc.cluster.local:6379']
        metrics_path: /metrics
        scrape_interval: 30s

      - job_name: 'simpelv2-nginx'
        static_configs:
        - targets: ['nginx-service.simpelv2-infra.svc.cluster.local:80']
        metrics_path: /metrics
        scrape_interval: 30s

      - job_name: 'simpelv2-authenc'
        static_configs:
        - targets: ['authenc-service.simpelv2-infra.svc.cluster.local:8088']
        metrics_path: /metrics
        scrape_interval: 30s

      - job_name: 'simpelv2-secreton'
        static_configs:
        - targets: ['secreton-service.simpelv2-infra.svc.cluster.local:8200']
        metrics_path: /v1/sys/metrics
        scrape_interval: 30s

      # SIMPelv2 Backend Services
      - job_name: 'simpelv2-gerbang'
        static_configs:
        - targets: ['gerbang-service.simpelv2-backend.svc.cluster.local:8080']
        metrics_path: /metrics
        scrape_interval: 30s

      - job_name: 'simpelv2-backend-services'
        static_configs:
        - targets:
          - 'layanan-ai-service.simpelv2-backend.svc.cluster.local:3000'
          - 'layanan-bantuan-service.simpelv2-backend.svc.cluster.local:3000'
          - 'layanan-dasbor-service.simpelv2-backend.svc.cluster.local:3000'
          - 'layanan-dokumen-service.simpelv2-backend.svc.cluster.local:3000'
          - 'layanan-integrasi-service.simpelv2-backend.svc.cluster.local:3000'
          - 'layanan-konfigurasi-service.simpelv2-backend.svc.cluster.local:3000'
          - 'layanan-laporan-service.simpelv2-backend.svc.cluster.local:3000'
          - 'layanan-notifikasi-service.simpelv2-backend.svc.cluster.local:3000'
        metrics_path: /metrics
        scrape_interval: 30s

      # SIMPelv2 Frontend Services
      - job_name: 'simpelv2-frontend-services'
        static_configs:
        - targets:
          - 'portal-service.simpelv2-frontend.svc.cluster.local:8080'
          - 'badiklat-service.simpelv2-frontend.svc.cluster.local:8080'
          - 'datun-service.simpelv2-frontend.svc.cluster.local:8080'
          - 'intel-service.simpelv2-frontend.svc.cluster.local:8080'
          - 'keuangan-service.simpelv2-frontend.svc.cluster.local:8080'
          - 'pemulihan-aset-service.simpelv2-frontend.svc.cluster.local:8080'
          - 'pengawasan-service.simpelv2-frontend.svc.cluster.local:8080'
          - 'perencanaan-service.simpelv2-frontend.svc.cluster.local:8080'
          - 'perlengkapan-service.simpelv2-frontend.svc.cluster.local:8080'
          - 'pidmil-service.simpelv2-frontend.svc.cluster.local:8080'
          - 'pidsus-service.simpelv2-frontend.svc.cluster.local:8080'
          - 'pidum-service.simpelv2-frontend.svc.cluster.local:8080'
        metrics_path: /metrics
        scrape_interval: 30s

  simpelv2_rules.yml: |
    groups:
    - name: simpelv2.rules
      rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for more than 5 minutes on {{ $labels.instance }}"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} is down"

      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 10% for {{ $labels.job }}"

      # Database connection issues
      - alert: DatabaseConnectionIssues
        expr: postgres_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection issues"
          description: "PostgreSQL database is not responding"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: config
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-service:9090
      isDefault: true
      editable: true
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-service:3100
      editable: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: config
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: config
data:
  local-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    ruler:
      alertmanager_url: http://alertmanager-service:9093

    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: config
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki-service:3100/loki/api/v1/push

    scrape_configs:
      - job_name: containers
        static_configs:
          - targets:
              - localhost
            labels:
              job: containerlogs
              __path__: /var/log/containers/*log

        pipeline_stages:
          - json:
              expressions:
                output: log
                stream: stream
                attrs:
          - json:
              expressions:
                tag: attrs.tag
              source: attrs
          - regex:
              expression: (?P<container_name>(?:[^_]+_){2})(?P<pod_name>[^_]+)_(?P<namespace>[^_]+)
              source: tag
          - timestamp:
              format: RFC3339Nano
              source: time
          - labels:
              stream:
              container_name:
              pod_name:
              namespace:
          - output:
              source: output

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_controller_name
            regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
            action: replace
            target_label: __tmp_controller_name
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              - __meta_kubernetes_pod_label_app
              - __tmp_controller_name
              - __meta_kubernetes_pod_name
            regex: ^;*([^;]+)(;.*)?$
            action: replace
            target_label: app
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
              - __meta_kubernetes_pod_label_component
            regex: ^;*([^;]+)(;.*)?$
            action: replace
            target_label: component
          - action: replace
            source_labels:
            - __meta_kubernetes_pod_node_name
            target_label: node_name
          - action: replace
            source_labels:
            - __meta_kubernetes_namespace
            target_label: namespace
          - action: replace
            replacement: $1
            separator: /
            source_labels:
            - namespace
            - app
            target_label: job
          - action: replace
            source_labels:
            - __meta_kubernetes_pod_name
            target_label: pod
          - action: replace
            source_labels:
            - __meta_kubernetes_pod_container_name
            target_label: container
          - action: replace
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
            - __meta_kubernetes_pod_uid
            - __meta_kubernetes_pod_container_name
            target_label: __path__

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: config
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'smtp.kejaksaan.go.id:587'
      smtp_from: 'simpelv2-alerts@kejaksaan.go.id'
      smtp_auth_username: 'simpelv2-alerts@kejaksaan.go.id'
      smtp_auth_password: 'smtp_password'

    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'web.hook'
      routes:
      - match:
          severity: critical
        receiver: 'critical-alerts'
      - match:
          severity: warning
        receiver: 'warning-alerts'

    receivers:
    - name: 'web.hook'
      webhook_configs:
      - url: 'http://layanan-notifikasi-service.simpelv2-backend.svc.cluster.local:3000/webhook/alerts'

    - name: 'critical-alerts'
      email_configs:
      - to: 'admin@kejaksaan.go.id'
        subject: '[CRITICAL] SIMPelv2 Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}
      webhook_configs:
      - url: 'http://layanan-notifikasi-service.simpelv2-backend.svc.cluster.local:3000/webhook/alerts'

    - name: 'warning-alerts'
      email_configs:
      - to: 'ops@kejaksaan.go.id'
        subject: '[WARNING] SIMPelv2 Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'dev', 'instance']
