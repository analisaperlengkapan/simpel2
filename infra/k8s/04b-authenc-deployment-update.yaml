---
# Authenc Deployment Update - CAPTCHA Timeout Fix
# This patch updates the authenc deployment with new image containing timeout fix
#
# Apply with:
#   kubectl apply -f 04b-authenc-deployment-update.yaml
#
# Or use kubectl set image:
#   kubectl set image deployment/authenc authenc=localhost:32000/authenc:v1.0.1-timeout-fix -n simpelv2

apiVersion: apps/v1
kind: Deployment
metadata:
  name: authenc
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: authenc
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: simpelv2
    app.kubernetes.io/version: v1.0.1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero downtime deployment
  selector:
    matchLabels:
      app.kubernetes.io/name: authenc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authenc
        app.kubernetes.io/component: iam
        app.kubernetes.io/version: v1.0.1
      annotations:
        # Force pod restart on config change
        kubectl.kubernetes.io/restartedAt: "2026-01-30T12:00:00Z"
        # Prometheus scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: authenc
          image: localhost:32000/authenc:v1.0.1-timeout-fix  # NEW IMAGE WITH TIMEOUT FIX
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
            - name: grpc
              containerPort: 9088
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            # Database configuration
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "authenc"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: AUTHENC_DB_PASSWORD

            # Redis configuration
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: REDIS_PASSWORD
                  optional: true

            # Security configuration
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authenc-secrets
                  key: JWT_SECRET
                  optional: true

            # Secreton integration
            - name: SECRETON_API_URL
              value: "http://secreton:8200"
            - name: SECRETON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: secreton-secrets
                  key: SECRETON_TOKEN
                  optional: true

            # Observability
            - name: LOG_LEVEL
              value: "info"
            - name: RUST_LOG
              value: "authenc=info,tower_http=info"

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"

          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          # Optional: Mount ConfigMap for runtime config override
          # volumeMounts:
          #   - name: authenc-config
          #     mountPath: /app/authenc.toml
          #     subPath: authenc.toml
          #     readOnly: true

      # Optional: Mount ConfigMap
      # volumes:
      #   - name: authenc-config
      #     configMap:
      #       name: authenc-config

      restartPolicy: Always
      terminationGracePeriodSeconds: 30

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

---
# Service remains unchanged but included for reference
apiVersion: v1
kind: Service
metadata:
  name: authenc
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: authenc
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: simpelv2
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8088
      targetPort: 8088
      protocol: TCP
    - name: grpc
      port: 9088
      targetPort: 9088
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: authenc
