---
# layanan-daskrimti-portal Backend Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layanan-daskrimti-portal
  namespace: simpelv2-backend
  labels:
    app: layanan-daskrimti-portal
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: layanan-daskrimti-portal
  template:
    metadata:
      labels:
        app: layanan-daskrimti-portal
        component: backend
    spec:
      containers:
        - name: portal-backend
          image: localhost:32000/simpelv2/layanan-daskrimti-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3010
              name: http
              protocol: TCP
          env:
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "3010"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: REDIS_URL
            - name: AUTHENC_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: AUTHENC_GRPC_URL
            - name: SECRETON_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SECRETON_GRPC_URL
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 5
            periodSeconds: 5

