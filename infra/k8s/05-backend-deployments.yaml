# SIMPelv2 Backend Service Deployments with gRPC Support
# All backend microservices with gRPC communication and Istio sidecar

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gerbang
  namespace: simpelv2-backend
  labels:
    app.kubernetes.io/name: gerbang
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: simpelv2
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gerbang
      version: v1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gerbang
        app.kubernetes.io/component: gateway
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
        prometheus.io/path: "/stats/prometheus"
    spec:
      containers:
        - name: gerbang
          image: registry.kejaksaan.go.id/simpelv2/gerbang:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9080
              name: grpc
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            - name: GATEWAY_ENV
              value: "production"
            - name: GRPC_PORT
              value: "9080"
            - name: HTTP_PORT
              value: "8080"
            - name: MTLS_ENABLED
              value: "true"
            - name: AUTHENC_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: AUTHENC_GRPC_URL
            - name: SECRETON_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: SECRETON_GRPC_URL
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            grpc:
              port: 9080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: docker-registry-secret

