      labels:
        app.kubernetes.io/name: layanan-ai
        app.kubernetes.io/component: service
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
    spec:
      containers:
        - name: layanan-ai
          image: registry.kejaksaan.go.id/simpelv2/layanan-ai:latest
