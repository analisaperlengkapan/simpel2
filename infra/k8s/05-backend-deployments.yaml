            grpc:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: docker-registry-secret

