# SIMPelv2 Kubernetes Services with gRPC Support
# Service discovery and load balancing for all components with gRPC endpoints

# Infrastructure Services
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: simpelv2-infra
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: postgres

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: simpelv2-infra
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: redis

---
apiVersion: v1
kind: Service
metadata:
  name: authenc-service
  namespace: simpelv2-infra
  labels:
    app.kubernetes.io/name: authenc
    app.kubernetes.io/component: iam
spec:
  type: ClusterIP
  ports:
    - port: 8088
      targetPort: 8088
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: grpc
  selector:
    app.kubernetes.io/name: authenc

---
apiVersion: v1
kind: Service
metadata:
  name: secreton-service
