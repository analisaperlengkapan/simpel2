# SIMPelv2 Kubernetes Services
# Unified namespace architecture: simpelv2-infra + simpelv2

# ==========================================
# Infrastructure Services (simpelv2-infra)
# ==========================================

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: tcp-postgres
  selector:
    app.kubernetes.io/name: postgres

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: redis

---
apiVersion: v1
kind: Service
metadata:
  name: authenc
  namespace: simpelv2
  labels:
    app: authenc
    component: infrastructure
spec:
  type: ClusterIP
  ports:
    - port: 8088
      targetPort: 8088
      protocol: TCP
      name: http
    - port: 9088
      targetPort: 9088
      protocol: TCP
      name: grpc-authenc
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: authenc

---
apiVersion: v1
kind: Service
metadata:
  name: secreton
  namespace: simpelv2
  labels:
    app: secreton
    component: infrastructure
spec:
  type: ClusterIP
  ports:
    - port: 8200
      targetPort: 8200
      protocol: TCP
      name: http
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: grpc
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: secreton

# ==========================================
# Application Services (simpelv2)
# ==========================================

---
# Backend Services
apiVersion: v1
kind: Service
metadata:
  name: layanan-daskrimti-portal
  namespace: simpelv2
  labels:
    app: layanan-daskrimti-portal
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 3010
      targetPort: 3010
      protocol: TCP
      name: http
  selector:
    app: layanan-daskrimti-portal

---
apiVersion: v1
kind: Service
metadata:
  name: layanan-pembinaan-perlengkapan
  namespace: simpelv2
  labels:
    app: layanan-pembinaan-perlengkapan
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 3020
      targetPort: 3020
      protocol: TCP
      name: http
  selector:
    app: layanan-pembinaan-perlengkapan

---
# Frontend Services
apiVersion: v1
kind: Service
metadata:
  name: portal-service
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: portal

---
apiVersion: v1
kind: Service
metadata:
  name: daskrimti-portal
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: daskrimti-portal
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: daskrimti-portal

---
apiVersion: v1
kind: Service
metadata:
  name: pembinaan-perlengkapan
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: pembinaan-perlengkapan
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: pembinaan-perlengkapan

---
# API Gateway (gerbang)
apiVersion: v1
kind: Service
metadata:
  name: gerbang-service
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: gerbang
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 9080
      targetPort: 9080
      protocol: TCP
      name: grpc
  selector:
    app.kubernetes.io/name: gerbang
