# SIMPelv2 Network Policies - FIXED (Single Namespace)
# Uses podSelector instead of namespaceSelector for intra-namespace traffic

# Default deny all ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: simpelv2
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# Allow Ingress from same namespace (tightened via podSelector)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: simpelv2
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow Backend to access Infra components
    - from:
        - podSelector:
            matchLabels:
              component: backend
      ports:
        - protocol: TCP
          port: 5432 # Postgres
        - protocol: TCP
          port: 6379 # Redis
        - protocol: TCP
          port: 9088 # Authenc gRPC
        - protocol: TCP
          port: 9000 # Secreton gRPC (Fixing 9200->9000 based on deployment)

    # Allow Frontend to access Backend
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 3010 # Portal Backend
        - protocol: TCP
          port: 3020 # Perlengkapan Backend

    # Allow Istio Ingress Gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 8080 # Service ports
        - protocol: TCP
          port: 3010
        - protocol: TCP
          port: 3020

---
# Allow Prometheus scraping
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus
  namespace: simpelv2
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring # Assuming monitoring NS is named 'monitoring' or 'simpelv2-monitoring' if it exists externally, else 'knative-monitoring' etc.
              # If it's in istio-system or similar
        - namespaceSelector:
             matchLabels:
               kubernetes.io/metadata.name: istio-system # Prometheus in Istio?
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 8088 # Authenc metrics

# Note: Keeping it simple by removing the complex broken policies.
# The previous policies were referencing non-existent namespaces.
