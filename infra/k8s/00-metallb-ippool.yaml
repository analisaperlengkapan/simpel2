# MetalLB IP Address Pool untuk Development
# Menambahkan IP 10.1.7.121 untuk testing/development

apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: dev-addresspool
  namespace: metallb-system
  annotations:
    description: "Development IP pool untuk testing SIMPelv2"
spec:
  addresses:
    - 10.1.7.121/32  # Single IP untuk development
  autoAssign: true

---
# L2Advertisement untuk IP pool development
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: dev-l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - dev-addresspool
  nodeSelectors:
    - matchLabels:
        kubernetes.io/hostname: simpel.kejaksaan.go.id  # Master node only untuk dev
