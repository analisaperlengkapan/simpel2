# SIMPelv2 Istio VirtualService - Complete Routing Configuration

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: simpelv2-main
  namespace: simpelv2-frontend
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: routing
spec:
  hosts:
    - simpel.kejaksaan.go.id
  gateways:
    - istio-system/simpelv2-gateway
  http:
    # Root path - Portal
    - match:
        - uri:
            exact: /
      route:
        - destination:
            host: portal-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # Static assets
    - match:
        - uri:
            prefix: /assets
        - uri:
            prefix: /static
        - uri:
            prefix: /pkg
      route:
        - destination:
            host: portal-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # API Gateway
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: gerbang-service.simpelv2-backend.svc.cluster.local
            port:
              number: 8080

    # Authentication
    - match:
        - uri:
            prefix: /auth
      route:
        - destination:
            host: authenc-service.simpelv2-infra.svc.cluster.local
            port:
              number: 8088

    # Microfrontends - Badiklat
    - match:
        - uri:
            prefix: /badiklat
      route:
        - destination:
            host: badiklat-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # Microfrontends - Datun
    - match:
        - uri:
            prefix: /datun
      route:
        - destination:
            host: datun-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # Microfrontends - Intel
    - match:
        - uri:
            prefix: /intel
      route:
        - destination:
            host: intel-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # Microfrontends - Pidum
    - match:
        - uri:
            prefix: /pidum
      route:
        - destination:
            host: pidum-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # Microfrontends - Pidmil
    - match:
        - uri:
            prefix: /pidmil
      route:
        - destination:
            host: pidmil-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # Microfrontends - Pidsus
    - match:
        - uri:
            prefix: /pidsus
      route:
        - destination:
            host: pidsus-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # Microfrontends - Pengawasan
    - match:
        - uri:
            prefix: /pengawasan
      route:
        - destination:
            host: pengawasan-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # Microfrontends - Pemulihan Aset
    - match:
        - uri:
            prefix: /pemulihan-aset
      route:
        - destination:
            host: pemulihan-aset-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # Pembinaan - Keuangan
    - match:
        - uri:
            prefix: /pembinaan/keuangan
      route:
        - destination:
            host: keuangan-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # Pembinaan - Perencanaan
    - match:
        - uri:
            prefix: /pembinaan/perencanaan
      route:
        - destination:
            host: perencanaan-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # Pembinaan - Perlengkapan
    - match:
        - uri:
            prefix: /pembinaan/perlengkapan
      route:
        - destination:
            host: perlengkapan-service.simpelv2-frontend.svc.cluster.local
            port:
              number: 8080

    # Monitoring - Grafana
    - match:
        - uri:
            prefix: /monitoring/grafana
      route:
        - destination:
            host: grafana-service.simpelv2-monitoring.svc.cluster.local
            port:
              number: 3000

    # Monitoring - Prometheus
    - match:
        - uri:
            prefix: /monitoring/prometheus
      route:
        - destination:
            host: prometheus-service.simpelv2-monitoring.svc.cluster.local
            port:
              number: 9090
