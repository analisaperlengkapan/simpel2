apiVersion: apps/v1
kind: Deployment
metadata:
  name: perencanaan-deployment
  namespace: simpelv2
  labels:
    app: perencanaan
    component: microfrontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: perencanaan
  template:
    metadata:
      labels:
        app: perencanaan
        component: microfrontend
    spec:
      containers:
      - name: perencanaan
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: perencanaan-static
          mountPath: /usr/share/nginx/html
        - name: shared-assets
          mountPath: /usr/share/nginx/html/shared
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: perencanaan-static
        hostPath:
          path: /srv/proyek/simpelv2_web/antarmuka/pembinaan/perencanaan/dist
          type: Directory
      - name: shared-assets
        hostPath:
          path: /srv/proyek/simpelv2_web/antarmuka/shared/styles
          type: Directory
      - name: nginx-config
        configMap:
          name: perencanaan-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: perencanaan-service
  namespace: simpelv2
  labels:
    app: perencanaan
    component: microfrontend
spec:
  selector:
    app: perencanaan
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: perencanaan-nginx-config
  namespace: simpelv2
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Enable gzip compression
        gzip on;
        gzip_types text/css application/javascript text/javascript application/json;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Handle static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
          expires 1y;
          add_header Cache-Control "public, immutable";
          try_files $uri =404;
        }

        # Handle WASM files
        location ~* \.wasm$ {
          expires 1y;
          add_header Cache-Control "public, immutable";
          add_header Content-Type "application/wasm";
          try_files $uri =404;
        }

        # Main application route
        location / {
          try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
          access_log off;
          return 200 "healthy\n";
          add_header Content-Type text/plain;
        }
      }
    }
