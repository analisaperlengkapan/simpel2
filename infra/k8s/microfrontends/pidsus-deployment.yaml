apiVersion: apps/v1
kind: Deployment
metadata:
  name: pidsus-deployment
  labels:
    app: pidsus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pidsus
  template:
    metadata:
      labels:
        app: pidsus
    spec:
      containers:
      - name: pidsus
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: pidsus-files
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        - name: pidsus-files
          mountPath: /usr/share/nginx/html/pkg/pidsus-microfrontend.js
          subPath: pidsus-microfrontend.js
        - name: pidsus-files
          mountPath: /usr/share/nginx/html/pkg/pidsus-microfrontend_bg.wasm
          subPath: pidsus-microfrontend_bg.wasm
      volumes:
      - name: pidsus-files
        configMap:
          name: pidsus-config
      - name: nginx-config
        configMap:
          name: pidsus-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pidsus-config
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Enable gzip compression
        gzip on;
        gzip_types text/css application/javascript application/wasm;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Cache static assets
        location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Handle WASM files
        location ~* \.wasm$ {
            add_header Content-Type application/wasm;
            add_header Cache-Control "public, immutable";
        }

        # Main location
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Handle /pkg/ requests for WASM files
        location /pkg/ {
            alias /usr/share/nginx/html/pkg/;
            try_files $uri =404;
        }

        location /styles-main.css {
            alias /usr/share/nginx/html/styles-main.css;
        }

        location /favicon.ico {
            alias /usr/share/nginx/html/favicon.ico;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SIMPelv2 - PIDSUS</title>
        <link rel="stylesheet" href="/styles-main.css">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <style>
            body {
                margin: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #8B0000 0%, #DC143C 100%);
                min-height: 100vh;
            }

            .loading-screen {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                color: white;
            }

            .spinner {
                width: 50px;
                height: 50px;
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                border-top: 4px solid white;
                animation: spin 1s linear infinite;
                margin-bottom: 20px;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            .loading-screen h2 {
                margin: 0;
                font-weight: 300;
                font-size: 1.5rem;
            }

            .military-badge {
                position: absolute;
                top: 20px;
                right: 20px;
                width: 60px;
                height: 60px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                backdrop-filter: blur(10px);
            }

            .military-badge::before {
                content: "⚖️";
                font-size: 30px;
            }
        </style>
    </head>
    <body>
        <div class="military-badge"></div>
        <div id="app">
            <div class="loading-screen">
                <div class="spinner"></div>
                <h2>Memuat SIMPelv2 - PIDSUS...</h2>
                <p style="margin-top: 10px; opacity: 0.8;">Penyidikan Khusus</p>
            </div>
        </div>
        <script type="module">
            import init, { run_app } from '/pkg/pidsus-microfrontend.js';
            async function main() {
                await init();
                run_app();
            }
            main();
        </script>
    </body>
    </html>
  pidsus-microfrontend.js: |
    $(cat /srv/proyek/simpelv2_web/antarmuka/pidsus/js.b64)
  pidsus-microfrontend_bg.wasm: |
    $(cat /srv/proyek/simpelv2_web/antarmuka/pidsus/wasm.b64)
---
apiVersion: v1
kind: Service
metadata:
  name: pidsus-service
spec:
  selector:
    app: pidsus
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
