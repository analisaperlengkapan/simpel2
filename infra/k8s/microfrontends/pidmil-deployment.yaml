apiVersion: apps/v1
kind: Deployment
metadata:
  name: pidmil-deployment
  labels:
    app: pidmil
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pidmil
  template:
    metadata:
      labels:
        app: pidmil
    spec:
      containers:
      - name: pidmil
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: pidmil-files
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
      volumes:
      - name: pidmil-files
        configMap:
          name: pidmil-config
      - name: nginx-config
        configMap:
          name: pidmil-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pidmil-config
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /pkg/ {
            alias /usr/share/nginx/html/pkg/;
        }

        location /styles-main.css {
            alias /usr/share/nginx/html/styles-main.css;
        }

        location /favicon.ico {
            alias /usr/share/nginx/html/favicon.ico;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SIMPelv2 - PIDMIL</title>
        <link rel="stylesheet" href="/styles-main.css">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
        <style>
            body {
                margin: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #8B0000 0%, #DC143C 100%);
                min-height: 100vh;
            }

            .loading-screen {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                color: white;
            }

            .spinner {
                width: 50px;
                height: 50px;
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                border-top: 4px solid white;
                animation: spin 1s linear infinite;
                margin-bottom: 20px;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            .loading-screen h2 {
                margin: 0;
                font-weight: 300;
                font-size: 1.5rem;
            }

            .military-badge {
                position: absolute;
                top: 20px;
                right: 20px;
                width: 60px;
                height: 60px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                backdrop-filter: blur(10px);
            }

            .military-badge::before {
                content: "🪖";
                font-size: 30px;
            }
        </style>
    </head>
    <body>
        <div class="military-badge"></div>
        <div id="app">
            <div class="loading-screen">
                <div class="spinner"></div>
                <h2>Memuat SIMPelv2 - PIDMIL...</h2>
                <p style="margin-top: 10px; opacity: 0.8;">Penyidikan Militer</p>
            </div>
        </div>
        <script type="module">
            import init, { run_app } from '/pkg/pidmil-microfrontend.js';
            async function main() {
                await init();
                run_app();
            }
            main();
        </script>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: pidmil-service
spec:
  selector:
    app: pidmil
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
