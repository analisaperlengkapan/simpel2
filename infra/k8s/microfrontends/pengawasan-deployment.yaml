apiVersion: apps/v1
kind: Deployment
metadata:
  name: pengawasan-deployment
  labels:
    app: pengawasan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pengawasan
  template:
    metadata:
      labels:
        app: pengawasan
    spec:
      containers:
      - name: pengawasan
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: pengawasan-files
          mountPath: /usr/share/nginx/html
      volumes:
      - name: pengawasan-files
        configMap:
          name: pengawasan-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pengawasan-config
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SIMPelv2 - Pengawasan</title>
        <link rel="stylesheet" href="/styles-main.css">
        <link rel="icon" type="image/x-icon" href="/favicon.ico">
    </head>
    <body>
        <div id="app">
            <div class="loading-screen">
                <div class="spinner"></div>
                <h2>Memuat SIMPelv2 - Pengawasan...</h2>
            </div>
        </div>
        <script type="module">
            import init, { run_app } from '/pkg/pengawasan_microfrontend.js';
            async function main() {
                await init();
                run_app();
            }
            main();
        </script>
    </body>
    </html>
  styles-main.css: |
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
    }

    .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: white;
    }

    .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid white;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .loading-screen h2 {
        margin: 0;
        font-weight: 300;
        font-size: 1.5rem;
    }
---
apiVersion: v1
kind: Service
metadata:
  name: pengawasan-service
spec:
  selector:
    app: pengawasan
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
