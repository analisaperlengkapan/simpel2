apiVersion: apps/v1
kind: Deployment
metadata:
  name: pemulihan-aset-deployment
  labels:
    app: pemulihan-aset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pemulihan-aset
  template:
    metadata:
      labels:
        app: pemulihan-aset
    spec:
      containers:
      - name: pemulihan-aset
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: pemulihan-aset-files
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: pemulihan-aset-files
        configMap:
          name: pemulihan-aset-config
      - name: nginx-config
        configMap:
          name: pemulihan-aset-nginx-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pemulihan-aset-config
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Pemulihan Aset - SIMPelv2</title>
        <link data-trunk rel="rust" data-wasm-opt="z" href="Cargo.toml" />
        <link rel="stylesheet" href="styles/main.css">
      </head>
      <body>
        <div id="loading">
          <div class="loading-spinner"></div>
          <p>Loading Pemulihan Aset...</p>
        </div>
      </body>
    </html>
  main.css: |
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 4px solid white;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pemulihan-aset-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.(js|wasm|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /styles/ {
            alias /usr/share/nginx/html/;
            try_files $uri =404;
        }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: pemulihan-aset-service
spec:
  selector:
    app: pemulihan-aset
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
