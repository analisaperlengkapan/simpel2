# SIMPelv2 Frontend Module Federation Configtion
# ConfigMap for microfrontend routing and module federation

apiVersion: v1
kind: ConfigMap
metadata:
  name: microfrontend-config
  namespace: simpelv2-frontend
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: frontend-config
data:
  # Module federation configuration
  module-federation.json: |
    {
      "modules": {
        "portal": {
          "path": "/",
          "name": "Portal",
          "description": "Main portal and dashboard",
          "icon": "home",
          "public": true,
          "roles": ["*"]
        },
        "badiklat": {
          "path": "/badiklat",
          "name": "Badiklat",
          "description": "Pendidikan dan Pelatihan",
          "icon": "school",
          "public": false,
          "roles": ["admin", "badiklat_user", "badiklat_admin"]
        },
        "datun": {
          "path": "/datun",
          "name": "Datun",
          "description": "Data dan Informasi Tindak Pidana Umum",
          "icon": "data_usage",
          "public": false,
          "roles": ["admin", "datun_user", "datun_admin"]
        },
        "intel": {
          "path": "/intel",
          "name": "Intel",
          "description": "Intelijen dan Keamanan",
          "icon": "security",
          "public": false,
          "roles": ["admin", "intel_user", "intel_admin"]
        },
        "pengawasan": {
          "path": "/pengawasan",
          "name": "Pengawasan",
          "description": "Pengawasan dan Monitoring",
          "icon": "visibility",
          "public": false,
          "roles": ["admin", "pengawasan_user", "pengawasan_admin"]
        },
        "pemulihan-aset": {
          "path": "/pemulihan-aset",
          "name": "Pemulihan Aset",
          "description": "Pemulihan Aset Negara",
          "icon": "account_balance",
          "public": false,
          "roles": ["admin", "pemulihan_aset_user", "pemulihan_aset_admin"]
        },
        "pidum": {
          "path": "/pidum",
          "name": "Pidum",
          "description": "Pidana Umum",
          "icon": "gavel",
          "public": false,
          "roles": ["admin", "pidum_user", "pidum_admin"]
        },
        "pidsus": {
          "path": "/pidsus",
          "name": "Pidsus",
          "description": "Pidana Khusus",
          "icon": "security",
          "public": false,
          "roles": ["admin", "pidsus_user", "pidsus_admin"]
        },
        "pidmil": {
          "path": "/pidmil",
          "name": "Pidmil",
          "description": "Pidana Militer",
          "icon": "military_tech",
          "public": false,
          "roles": ["admin", "pidmil_user", "pidmil_admin"]
        },
        "keuangan": {
          "path": "/pembinaan/keuangan",
          "name": "Keuangan",
          "description": "Pembinaan Keuangan",
          "icon": "account_balance_wallet",
          "public": false,
          "roles": ["admin", "pembinaan_user", "keuangan_admin"]
        },
        "perencanaan": {
          "path": "/pembinaan/perencanaan",
          "name": "Perencanaan",
          "description": "Pembinaan Perencanaan",
          "icon": "timeline",
          "public": false,
          "roles": ["admin", "pembinaan_user", "perencanaan_admin"]
        },
        "perlengkapan": {
          "path": "/pembinaan/perlengkapan",
          "name": "Perlengkapan",
          "description": "Pembinaan Perlengkapan",
          "icon": "inventory",
          "public": false,
          "roles": ["admin", "pembinaan_user", "perlengkapan_admin"]
        }
      },
      "navigation": {
        "main": [
          {
            "title": "Dashboard",
            "path": "/",
            "icon": "dashboard",
            "roles": ["*"]
          },
          {
            "title": "Pidana",
            "icon": "gavel",
            "children": [
              {
                "title": "Pidana Umum",
                "path": "/pidum",
                "roles": ["admin", "pidum_user", "pidum_admin"]
              },
              {
                "title": "Pidana Khusus",
                "path": "/pidsus",
                "roles": ["admin", "pidsus_user", "pidsus_admin"]
              },
              {
                "title": "Pidana Militer",
                "path": "/pidmil",
                "roles": ["admin", "pidmil_user", "pidmil_admin"]
              }
            ]
          },
          {
            "title": "Pembinaan",
            "icon": "build",
            "children": [
              {
                "title": "Keuangan",
                "path": "/pembinaan/keuangan",
                "roles": ["admin", "pembinaan_user", "keuangan_admin"]
              },
              {
                "title": "Perencanaan",
                "path": "/pembinaan/perencanaan",
                "roles": ["admin", "pembinaan_user", "perencanaan_admin"]
              },
              {
                "title": "Perlengkapan",
                "path": "/pembinaan/perlengkapan",
                "roles": ["admin", "pembinaan_user", "perlengkapan_admin"]
              }
            ]
          },
          {
            "title": "Divisi Khusus",
            "icon": "business",
            "children": [
              {
                "title": "Badiklat",
                "path": "/badiklat",
                "roles": ["admin", "badiklat_user", "badiklat_admin"]
              },
              {
                "title": "Datun",
                "path": "/datun",
                "roles": ["admin", "datun_user", "datun_admin"]
              },
              {
                "title": "Intel",
                "path": "/intel",
                "roles": ["admin", "intel_user", "intel_admin"]
              },
              {
                "title": "Pengawasan",
                "path": "/pengawasan",
                "roles": ["admin", "pengawasan_user", "pengawasan_admin"]
              },
              {
                "title": "Pemulihan Aset",
                "path": "/pemulihan-aset",
                "roles": ["admin", "pemulihan_aset_user", "pemulihan_aset_admin"]
              }
            ]
          }
        ]
      },
      "routing": {
        "basePath": "https://simpel.kejaksaan.go.id",
        "apiBasePath": "https://simpel.kejaksaan.go.id/api",
        "authBasePath": "https://simpel.kejaksaan.go.id/auth",
        "staticBasePath": "https://simpel.kejaksaan.go.id/assets"
      }
    }

  # Nginx configuration for microfrontend routing
  nginx-microfrontend.conf: |
    # Microfrontend routing configuration
    map $uri $microfrontend_service {
        default "portal-service.simpelv2-frontend.svc.cluster.local:8080";

        # Exact matches first
        "/"                                 "portal-service.simpelv2-frontend.svc.cluster.local:8080";
        "/health"                          "portal-service.simpelv2-frontend.svc.cluster.local:8080";

        # Module paths
        "~^/badiklat"                      "badiklat-service.simpelv2-frontend.svc.cluster.local:8080";
        "~^/datun"                         "datun-service.simpelv2-frontend.svc.cluster.local:8080";
        "~^/intel"                         "intel-service.simpelv2-frontend.svc.cluster.local:8080";
        "~^/pengawasan"                    "pengawasan-service.simpelv2-frontend.svc.cluster.local:8080";
        "~^/pemulihan-aset"                "pemulihan-aset-service.simpelv2-frontend.svc.cluster.local:8080";
        "~^/pidum"                         "pidum-service.simpelv2-frontend.svc.cluster.local:8080";
        "~^/pidsus"                        "pidsus-service.simpelv2-frontend.svc.cluster.local:8080";
        "~^/pidmil"                        "pidmil-service.simpelv2-frontend.svc.cluster.local:8080";
        "~^/pembinaan/keuangan"            "keuangan-service.simpelv2-frontend.svc.cluster.local:8080";
        "~^/pembinaan/perencanaan"         "perencanaan-service.simpelv2-frontend.svc.cluster.local:8080";
        "~^/pembinaan/perlengkapan"        "perlengkapan-service.simpelv2-frontend.svc.cluster.local:8080";

        # API routes
        "~^/api"                           "gerbang-service.simpelv2-backend.svc.cluster.local:8080";
        "~^/auth"                          "authenc-service.simpelv2-infra.svc.cluster.local:8088";
    }

  # Frontend build configuration
  webpack-federation.js: |
    const ModuleFederationPlugin = require('@module-federation/webpack');

    module.exports = {
      mode: 'production',
      plugins: [
        new ModuleFederationPlugin({
          name: 'shell',
          remotes: {
            badiklat: 'badiklat@https://simpel.kejaksaan.go.id/badiklat/remoteEntry.js',
            datun: 'datun@https://simpel.kejaksaan.go.id/datun/remoteEntry.js',
            intel: 'intel@https://simpel.kejaksaan.go.id/intel/remoteEntry.js',
            pengawasan: 'pengawasan@https://simpel.kejaksaan.go.id/pengawasan/remoteEntry.js',
            pemulihan_aset: 'pemulihan_aset@https://simpel.kejaksaan.go.id/pemulihan-aset/remoteEntry.js',
            pidum: 'pidum@https://simpel.kejaksaan.go.id/pidum/remoteEntry.js',
            pidsus: 'pidsus@https://simpel.kejaksaan.go.id/pidsus/remoteEntry.js',
            pidmil: 'pidmil@https://simpel.kejaksaan.go.id/pidmil/remoteEntry.js',
            keuangan: 'keuangan@https://simpel.kejaksaan.go.id/pembinaan/keuangan/remoteEntry.js',
            perencanaan: 'perencanaan@https://simpel.kejaksaan.go.id/pembinaan/perencanaan/remoteEntry.js',
            perlengkapan: 'perlengkapan@https://simpel.kejaksaan.go.id/pembinaan/perlengkapan/remoteEntry.js'
          },
          shared: {
            react: { singleton: true, eager: true },
            'react-dom': { singleton: true, eager: true },
            'react-router-dom': { singleton: true, eager: true }
          }
        })
      ]
    };

---
# Service for exposing microfrontend configuration
apiVersion: v1
kind: Service
metadata:
  name: microfrontend-config-service
  namespace: simpelv2-frontend
  labels:
    app.kubernetes.io/name: microfrontend-config
    app.kubernetes.io/component: config-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: microfrontend-config

---
# Deployment for serving microfrontend configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microfrontend-config
  namespace: simpelv2-frontend
  labels:
    app.kubernetes.io/name: microfrontend-config
    app.kubernetes.io/component: config-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: microfrontend-config
  template:
    metadata:
      labels:
        app.kubernetes.io/name: microfrontend-config
        app.kubernetes.io/component: config-service
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: config-server
          image: nginx:alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /module-federation.json
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /module-federation.json
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config-volume
          configMap:
            name: microfrontend-config
        - name: nginx-config
          configMap:
            name: nginx-default-config
            items:
              - key: default.conf
                path: default.conf

---
# Default nginx configuration for config server
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-default-config
  namespace: simpelv2-frontend
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index module-federation.json;

            # CORS headers for microfrontend loading
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";

            # Cache control
            location ~* \.(json)$ {
                expires 5m;
                add_header Cache-Control "public, no-transform";
            }
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
