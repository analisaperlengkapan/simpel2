# SIMPelv2 Deployment Script
# Automated deployment configuration for MicroK8s

apiVersion: v1
kind: ConfigMap
metadata:
  name: deployment-script
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: deployment
data:
  deploy.sh: |
    #!/bin/bash
    set -euo pipefail

    # SIMPelv2 MicroK8s Deployment Script
    # This script deploys the entire SIMPelv2 application stack

    echo "🚀 Starting SIMPelv2 deployment to MicroK8s..."

    # Configuration
    NAMESPACE_ORDER=(
        "simpelv2"
        "simpelv2-infra"
        "simpelv2-backend"
        "simpelv2-frontend"
        "simpelv2-monitoring"
    )

    DEPLOYMENT_ORDER=(
        "00-namespace.yaml"
        "01-configmap.yaml"
        "02-secrets.yaml"
        "03-persistent-volumes.yaml"
        "04-infrastructure-deployments.yaml"
        "07-services.yaml"
        "05-backend-deployments.yaml"
        "06-frontend-deployments.yaml"
        "08-monitoring-deployments.yaml"
        "09-monitoring-services.yaml"
        "10-monitoring-config.yaml"
        "11-ingress.yaml"
        "12-network-policies.yaml"
        "13-hpa.yaml"
        "14-service-monitors.yaml"
        "15-pod-disruption-budgets.yaml"
    )

    # Functions
    log() {
        echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"
    }

    check_prerequisites() {
        log "Checking prerequisites..."

        # Check if microk8s is installed and running
        if ! command -v microk8s &> /dev/null; then
            log "❌ MicroK8s is not installed. Please install MicroK8s first."
            exit 1
        fi

        # Check if microk8s is running
        if ! microk8s status --wait-ready --timeout 30 &> /dev/null; then
            log "❌ MicroK8s is not running. Please start MicroK8s first."
            exit 1
        fi

        # Check required addons
        local required_addons=("dns" "storage" "ingress" "metrics-server")
        for addon in "${required_addons[@]}"; do
            if ! microk8s status | grep -q "$addon.*enabled"; then
                log "⚠️  Enabling required addon: $addon"
                microk8s enable "$addon"
            fi
        done

        log "✅ Prerequisites check completed"
    }

    wait_for_pods() {
        local namespace=$1
        local timeout=${2:-300}

        log "Waiting for pods in namespace $namespace to be ready..."

        if ! microk8s kubectl wait --for=condition=Ready pods --all \
            --namespace="$namespace" \
            --timeout="${timeout}s" 2>/dev/null; then
            log "⚠️  Some pods in $namespace are not ready yet, continuing..."
        fi
    }

    deploy_file() {
        local file=$1
        log "Deploying $file..."

        if microk8s kubectl apply -f "$file"; then
            log "✅ Successfully deployed $file"
        else
            log "❌ Failed to deploy $file"
            return 1
        fi
    }

    check_deployment_status() {
        log "Checking deployment status..."

        # Check all namespaces
        for ns in "${NAMESPACE_ORDER[@]}"; do
            log "Status for namespace: $ns"
            microk8s kubectl get pods -n "$ns" -o wide || true
        done

        # Check services
        log "Checking services..."
        microk8s kubectl get svc --all-namespaces || true

        # Check ingress
        log "Checking ingress..."
        microk8s kubectl get ingress --all-namespaces || true
    }

    cleanup_failed_deployments() {
        log "Cleaning up failed deployments..."

        # Remove failed pods
        for ns in "${NAMESPACE_ORDER[@]}"; do
            microk8s kubectl delete pods --field-selector=status.phase=Failed -n "$ns" 2>/dev/null || true
        done
    }

    # Main deployment process
    main() {
        log "🔍 Checking prerequisites..."
        check_prerequisites

        log "📁 Changing to k8s directory..."
        cd "$(dirname "$0")"

        log "🧹 Cleaning up any failed deployments..."
        cleanup_failed_deployments

        log "🚀 Starting deployment process..."

        # Deploy files in order
        for file in "${DEPLOYMENT_ORDER[@]}"; do
            if [[ -f "$file" ]]; then
                deploy_file "$file"

                # Wait a bit between deployments for stability
                sleep 5

                # Wait for infrastructure components before proceeding
                case "$file" in
                    "04-infrastructure-deployments.yaml")
                        wait_for_pods "simpelv2-infra" 600
                        ;;
                    "05-backend-deployments.yaml")
                        wait_for_pods "simpelv2-backend" 300
  ;
           "06-frontend-deployments.yaml")
                        wait_for_pods "simpelv2-frontend" 300
                        ;;
                    "08-monitoring-deployments.yaml")
                        wait_for_pods "simpelv2-monitoring" 300
                        ;;
                esac
            else
                log "⚠️  File $file not found, skipping..."
            fi
        done

        log "⏳ Waiting for all deployments to stabilize..."
        sleep 30

        log "📊 Checking final deployment status..."
        check_deployment_status

        log "🎉 SIMPelv2 deployment completed!"
        log "📝 Access the application at: https://simpelv2.kejaksaan.go.id"
        log "📊 Monitoring dashboard: https://monitoring.simpelv2.kejaksaan.go.id"

        # Show important endpoints
        log "🔗 Important endpoints:"
        log "   Main Portal: https://simpelv2.kejaksaan.go.id"
        log "   API Gateway: https://simpelv2.kejaksaan.go.id/api"
        log "   Authentication: https://simpelv2.kejaksaan.go.id/auth"
        log "   Grafana: https://monitoring.simpelv2.kejaksaan.go.id/grafana"
        log "   Prometheus: https://monitoring.simpelv2.kejaksaan.go.id/prometheus"
    }

    # Run main function
    main "$@"

  rollback.sh: |
    #!/bin/bash
    set -euo pipefail

    # SIMPelv2 Rollback Script
    # This script rolls back the SIMPelv2 deployment

    echo "🔄 Starting SIMPelv2 rollback..."

    NAMESPACE_ORDER=(
        "simpelv2-monitoring"
        "simpelv2-frontend"
        "simpelv2-backend"
        "simpelv2-infra"
        "simpelv2"
    )

    log() {
        echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"
    }

    rollback_namespace() {
        local namespace=$1
        log "Rolling back namespace: $namespace"

        # Delete all resources in namespace
        microk8s kubectl delete all --all -n "$namespace" --timeout=60s || true

        # Delete PVCs
        microk8s kubectl delete pvc --all -n "$namespace" --timeout=60s || true

        # Delete secrets and configmaps
        microk8s kubectl delete secrets,configmaps --all -n "$namespace" --timeout=60s || true

        # Delete the namespace itself
        microk8s kubectl delete namespace "$namespace" --timeout=60s || true
    }

    main() {
        log "⚠️  This will completely remove SIMPelv2 from the cluster!"
        read -p "Are you sure you want to continue? (yes/no): " confirm

        if [[ "$confirm" != "yes" ]]; then
            log "❌ Rollback cancelled"
            exit 0
        fi

        # Rollback in reverse order
        for namespace in "${NAMESPACE_ORDER[@]}"; do
            rollback_namespace "$namespace"
        done

        # Clean up cluster-wide resources
        log "Cleaning up cluster-wide resources..."
        microk8s kubectl delete clusterrole,clusterrolebinding -l app.kubernetes.io/name=simpelv2 || true
        microk8s kubectl delete pv -l app.kubernetes.io/name=simpelv2 || true

        log "✅ SIMPelv2 rollback completed"
    }

    main "$@"

  update.sh: |
    #!/bin/bash
    set -euo pipefail

    # SIMPelv2 Update Script
    # This script updates specific components of SIMPelv2

    log() {
        echo "[$(date +'%Y-%m-%d %H:%M:%S')] $1"
    }

    update_component() {
        local component=$1
        local namespace=$2

        log "Updating component: $component in namespace: $namespace"

        # Restart deployment
        microk8s kubectl rollout restart deployment "$component" -n "$namespace"

        # Wait for rollout to complete
        microk8s kubectl rollout status deployment "$component" -n "$namespace" --timeout=300s

        log "✅ Component $component updated successfully"
    }

    update_all_frontend() {
        log "Updating all frontend components..."
        local components=("portal" "badiklat" "datun" "intel" "keuangan" "pemulihan-aset" "pengawasan" "perencanaan" "perlengkapan" "pidmil" "pidsus" "pidum")

        for component in "${components[@]}"; do
            update_component "$component" "simpelv2-frontend"
        done
    }

    update_all_backend() {
        log "Updating all backend components..."
        local components=("gerbang" "layanan-ai" "layanan-bantuan" "layanan-dasbor" "layanan-dokumen" "layanan-integrasi" "layanan-konfigurasi" "layanan-laporan" "layanan-notifikasi")

        for component in "${components[@]}"; do
            update_component "$component" "simpelv2-backend"
        done
    }

    main() {
        case "${1:-all}" in
            "frontend")
                update_all_frontend
                ;;
            "backend")
                update_all_backend
                ;;
            "monitoring")
                update_component "prometheus" "simpelv2-monitoring"
                update_component "grafana" "simpelv2-monitoring"
                update_component "loki" "simpelv2-monitoring"
                update_component "alertmanager" "simpelv2-monitoring"
                ;;
            "infra")
                update_component "nginx" "simpelv2-infra"
                update_component "authenc" "simpelv2-infra"
                update_component "secreton" "simpelv2-infra"
                ;;
            "all")
                update_all_frontend
                update_all_backend
                ;;
            *)
                log "Usage: $0 [frontend|backend|monitoring|infra|all]"
                exit 1
                ;;
        esac

        log "🎉 Update completed!"
    }

    main "$@"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: simpelv2-deployment-job
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: deployment
spec:
  template:
    spec:
      serviceAccountName: deployment-service-account
      containers:
      - name: deployer
        image: bitnami/kubectl:latest
        command: ["/bin/bash"]
        args: ["/scripts/deploy.sh"]
        volumeMounts:
        - name: deployment-scripts
          mountPath: /scripts
        - name: k8s-manifests
          mountPath: /manifests
        env:
        - name: KUBECONFIG
          value: /var/run/secrets/kubernetes.io/serviceaccount/kubeconfig
      volumes:
      - name: deployment-scripts
        configMap:
          name: deployment-script
          defaultMode: 0755
      - name: k8s-manifests
        configMap:
          name: k8s-manifests
      restartPolicy: OnFailure
      backoffLimit: 3

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-service-account
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: deployment

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-cluster-role
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: deployment
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployment-cluster-role-binding
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: deployment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployment-cluster-role
subjects:
- kind: ServiceAccount
  name: deployment-service-account
  namespace: simpelv2
