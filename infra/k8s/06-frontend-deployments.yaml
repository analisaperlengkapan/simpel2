# SIMPelv2 Portal - Minimal Deployment untuk Testing
# All apps in simpelv2 namespace (unified approach)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: simpelv2
    app.kubernetes.io/environment: development
spec:
  replicas: 1 # Minimal untuk testing (scale up setelah verified)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
        app.kubernetes.io/component: frontend
        version: v1
      annotations:
        sidecar.istio.io/inject: "true" # Istio sidecar injection
    spec:
      containers:
        - name: portal
          # Option 1: Use local MicroK8s registry
          image: localhost:32000/simpelv2/portal:latest
          # Option 2: Use external registry (uncomment jika available)
          # image: registry.kejaksaan.go.id/simpelv2/portal:latest
          imagePullPolicy: IfNotPresent # Development: avoid pull delays
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "debug" # Development: more verbose logging
            - name: NODE_ENV
              value: "development"
            - name: BACKEND_API_URL
              value: "http://layanan-daskrimti-portal.simpelv2.svc.cluster.local:3010"
            - name: PORTAL_BASE_URL
              value: "http://10.1.7.121" # Development URL
          resources:
            requests:
              memory: "128Mi" # Minimal untuk dev
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15 # Faster startup untuk dev
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 101 # nginx user
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Nginx needs write access to /var/cache/nginx
            capabilities:
              drop:
                - ALL

---
# Daskrimti Portal Microfrontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daskrimti-portal
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: daskrimti-portal
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: simpelv2
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: daskrimti-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daskrimti-portal
        app.kubernetes.io/component: frontend
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: daskrimti-portal
          securityContext:
            allowPrivilegeEscalation: false
          image: localhost:32000/simpelv2/daskrimti-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            - name: BACKEND_API_URL
              value: "http://layanan-daskrimti-portal.simpelv2.svc.cluster.local:3010"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

---
# Pembinaan Perlengkapan Microfrontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pembinaan-perlengkapan
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: pembinaan-perlengkapan
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: simpelv2
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pembinaan-perlengkapan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pembinaan-perlengkapan
        app.kubernetes.io/component: frontend
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: pembinaan-perlengkapan
          securityContext:
            allowPrivilegeEscalation: false
          image: localhost:32000/simpelv2/pembinaan-perlengkapan:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            - name: BACKEND_API_URL
              value: "http://layanan-pembinaan-perlengkapan.simpelv2.svc.cluster.local:3020"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

---
# Service untuk Portal
apiVersion: v1
kind: Service
metadata:
  name: portal-service
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP # Internal only, exposed via Istio Gateway
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: portal

---
# ServiceEntry untuk external API access (jika diperlukan)
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-apis
  namespace: simpelv2
spec:
  hosts:
    - "*.googleapis.com" # Jika ada API external
  ports:
    - number: 443
      name: https
      protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS
