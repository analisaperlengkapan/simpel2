# SIMPelv2 Frontend Microfrontend Deployments
# All frontend microfrontends (Leptos + WebAssembly)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: simpelv2-frontend
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: simpelv2
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: portal
          image: registry.kejaksaan.go.id/simpelv2/portal:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: RUST_LOG
              value: "info"
            - name: NODE_ENV
              value: "production"
            - name: GERBANG_API_URL
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: GERBANG_HTTP_URL
            - name: AUTHENC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: AUTHENC_HTTP_URL
            - name: SECRETON_API_URL
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: SECRETON_HTTP_URL
            - name: MODULE_FEDERATION_URL
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: MODULE_FEDERATION_URL
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: JWT_ISSUER
          resources:
            requests:
              memory: "256Mi"
              cpu: "125m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: docker-registry-secret

