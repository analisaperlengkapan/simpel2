# SIMPelv2 ConfigMap - OPTIMIZED & SECURITY FIXED
# REMOVED: AUTHENC_HTTP_URL and SECRETON_HTTP_URL (architecture violation)
# Frontend TIDAK BOLEH akses Authenc/Secreton langsung!

apiVersion: v1
kind: ConfigMap
metadata:
  name: simpelv2-config
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: config
data:
  # Global configuration
  RUST_LOG: "info"
  NODE_ENV: "production"

  # Database configuration (untuk backend services only)
  POSTGRES_DB: "simpelv2_prod"
  POSTGRES_HOST: "postgres-service.simpelv2-infra.svc.cluster.local"
  POSTGRES_PORT: "5432"

  # Redis configuration (untuk backend services only)
  REDIS_HOST: "redis-service.simpelv2-infra.svc.cluster.local"
  REDIS_PORT: "6379"

  # Service URLs for BACKEND (gRPC communication)
  # Service URLs for BACKEND (gRPC communication)
  AUTHENC_GRPC_URL: "https://authenc-service.simpelv2-infra.svc.cluster.local:9090"
  SECRETON_GRPC_URL: "https://secreton-service.simpelv2-infra.svc.cluster.local:9200"

  # Frontend URLs
  # GERBANG removed - using direct service access or Istio Gateway
  BACKEND_API_URL: "http://layanan-daskrimti-portal.simpelv2-backend.svc.cluster.local:3010"
  PORTAL_BASE_URL: "https://simpel.kejaksaan.go.id"
  MODULE_FEDERATION_URL: "https://simpel.kejaksaan.go.id/module-federation.json"

  # Development URLs (untuk testing via IP)
  PORTAL_DEV_URL: "http://10.1.7.121"

  # Authentication Configuration
  JWT_ISSUER: "https://simpel.kejaksaan.go.id/auth"
  JWT_AUDIENCE: "simpelv2-frontend,simpelv2-api"
  SESSION_TIMEOUT: "28800" # 8 hours

  # Service Mesh Configuration
  ISTIO_ENABLED: "true"
  MTLS_MODE: "STRICT"
  GRPC_ONLY_BACKEND: "true"

  # Monitoring
  PROMETHEUS_URL: "http://prometheus-service.simpelv2-monitoring.svc.cluster.local:9090"
  GRAFANA_URL: "http://grafana-service.simpelv2-monitoring.svc.cluster.local:3000"

  # Application settings
  APP_NAME: "SIMPelv2"
  APP_VERSION: "0.1.0"
  APP_ENVIRONMENT: "production"

---
# ConfigMap untuk backend services (gRPC clients)
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: simpelv2-backend
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: backend-config
data:
  # gRPC endpoints untuk backend-to-backend communication
  AUTHENC_GRPC_URL: "http://authenc.simpelv2-infra.svc.cluster.local:9088"
  SECRETON_GRPC_URL: "http://secreton.simpelv2-infra.svc.cluster.local:9000"
  AUTHENC_GRPC_ENDPOINT: "authenc.simpelv2-infra.svc.cluster.local:9088"
  SECRETON_GRPC_ENDPOINT: "secreton.simpelv2-infra.svc.cluster.local:9000"

  # Redis connection string
  REDIS_URL: "redis://redis-service.simpelv2-infra.svc.cluster.local:6379"

  # TLS Configuration
  GRPC_TLS_ENABLED: "false"
  GRPC_MTLS_ENABLED: "false"

  # Service discovery
  SERVICE_MESH: "istio"
  MTLS_MODE: "PERMISSIVE"
