# SIMPelv2 Kubernetes Secrets
# IMPORTANT: In production, use sealed-secrets or external-secrets operator!
# These are base64 encoded values for development.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: simpelv2-infra
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_DB: "simpelv2"
  POSTGRES_USER: "simpelv2"
  POSTGRES_PASSWORD: "simpelv2-dev-password-2024"
  AUTHENC_DB_USER: "authenc"
  AUTHENC_DB_PASSWORD: "authenc-dev-password-2024"
  SECRETON_DB_USER: "secreton"
  SECRETON_DB_PASSWORD: "secreton-dev-password-2024"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: simpelv2-infra
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  url: "postgres://simpelv2:simpelv2-dev-password-2024@postgres-service.simpelv2-infra.svc.cluster.local:5432/simpelv2"

