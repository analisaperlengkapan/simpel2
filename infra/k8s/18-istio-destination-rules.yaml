# SIMPelv2 Istio Destination Rules
# Traffic policies, load balancing, and circuit breaker configuration

# Default destination rule for mTLS
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: default-mtls
  namespace: istio-system
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: security
spec:
  host: "*.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

---
# API Gateway destination rule
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: gerbang-destination
  namespace: simpelv2-backend
  labels:
    app.kubernetes.io/name: gerbang
    app.kubernetes.io/component: traffic-policy
spec:
  host: gerbang-service.simpelv2-backend.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
        keepAlive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 10
        maxRetries: 3
        idleTimeout: 90s
        h2UpgradePolicy: UPGRADE
    circuitBreaker:
      consecutiveGatewayErrors: 5
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
    outlierDetection:
      consecutiveGatewayErrors: 5
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
  portLevelSettings:
    - port:
        number: 9080
      connectionPool:
        tcp:
          maxConnections: 50
          connectTimeout: 10s
        http:
          http2MaxRequests: 50
          maxRequestsPerConnection: 5

