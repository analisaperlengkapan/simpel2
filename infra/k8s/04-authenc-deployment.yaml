---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authenc
  namespace: simpelv2-infra
  labels:
    app: authenc
    component: infrastructure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: authenc
  template:
    metadata:
      labels:
        app: authenc
        component: infrastructure
    spec:
      containers:
        - name: authenc
          image: localhost:32000/simpelv2/authenc:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
              name: http
              protocol: TCP
            - containerPort: 9088
              name: grpc
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: HTTP_PORT
              value: "8088"
            - name: GRPC_PORT
              value: "9088"
            - name: METRICS_PORT
              value: "9090"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: REDIS_URL
            - name: SECRETON_GRPC_URL
              value: "http://secreton.simpelv2-infra.svc.cluster.local:9000"
            - name: RUST_LOG
              value: "info,authenc=debug"
            - name: RAFT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: authenc-data
              mountPath: /app/data
      volumes:
        - name: authenc-data
          persistentVolumeClaim:
            claimName: authenc-raft-pvc
