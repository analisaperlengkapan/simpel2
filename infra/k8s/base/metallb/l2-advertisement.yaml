# MetalLB L2 Advertisement for SIMPEL
# Enables Layer 2 mode for IP announcement
# Updated: 2026-02-03 - Environment-specific advertisements (staging/production)

---
# Production L2 Advertisement
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: prod-l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - prod-addresspool
  # Note: If specific interfaces needed, uncomment below
  # interfaces:
  #   - eno12399  # simple02 interface

---
# Staging L2 Advertisement
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: staging-l2-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - staging-addresspool
