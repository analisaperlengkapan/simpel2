# ServiceMonitor definitions for Prometheus scraping
# Requires prometheus-operator CRDs to be installed
# Install with: microk8s enable observability

# NOTE: These are OPTIONAL and only work if prometheus-operator is installed
# If not using prometheus-operator, comment out this file in kustomization.yaml

---
# Portal Backend ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: layanan-daskrimti-portal
  labels:
    app.kubernetes.io/name: layanan-daskrimti-portal
    app.kubernetes.io/component: backend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: layanan-daskrimti-portal
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
