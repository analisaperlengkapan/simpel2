---
# PostgreSQL initialization ConfigMap
# Creates separate databases for each service during pod startup
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: infrastructure
data:
  init-databases.sh: |
    #!/bin/bash
    set -e

    echo "=== Creating SIMPEL databases ==="
    
    # Create databases
    for db in authenc secreton perlengkapan integrasi simpelv2; do
      echo "Creating database: $db"
      psql -v ON_ERROR_STOP=0 --username "$POSTGRES_USER" <<-EOSQL
        SELECT 'CREATE DATABASE $db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$db')\gexec
    EOSQL
    done
    
    # Create users with passwords
    psql -v ON_ERROR_STOP=0 --username "$POSTGRES_USER" <<-EOSQL
      DO \$\$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenc') THEN
          CREATE USER authenc WITH PASSWORD 'CHANGEME';
        END IF;
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'secreton') THEN
          CREATE USER secreton WITH PASSWORD 'CHANGEME';
        END IF;
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'perlengkapan') THEN
          CREATE USER perlengkapan WITH PASSWORD 'CHANGEME';
        END IF;
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'integrasi') THEN
          CREATE USER integrasi WITH PASSWORD 'CHANGEME';
        END IF;
      END
      \$\$;
      
      -- Grant permissions
      GRANT ALL PRIVILEGES ON DATABASE authenc TO authenc;
      GRANT ALL PRIVILEGES ON DATABASE secreton TO secreton;
      GRANT ALL PRIVILEGES ON DATABASE perlengkapan TO perlengkapan;
      GRANT ALL PRIVILEGES ON DATABASE integrasi TO integrasi;
      GRANT ALL PRIVILEGES ON DATABASE simpelv2 TO simpelv2;
      
      -- Also grant simpelv2 user access to all databases for migrations
      GRANT ALL PRIVILEGES ON DATABASE authenc TO simpelv2;
      GRANT ALL PRIVILEGES ON DATABASE secreton TO simpelv2;
      GRANT ALL PRIVILEGES ON DATABASE perlengkapan TO simpelv2;
      GRANT ALL PRIVILEGES ON DATABASE integrasi TO simpelv2;
    EOSQL

    echo "=== Database initialization complete ==="
