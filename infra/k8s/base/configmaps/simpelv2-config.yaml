# SIMPEL Main ConfigMap
# Environment-specific values will be patched in overlays

apiVersion: v1
kind: ConfigMap
metadata:
  name: simpelv2-config
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: config
data:
  # Logging
  RUST_LOG: "info"

  # Database (host will be patched per environment)
  POSTGRES_DB: "simpelv2"
  POSTGRES_PORT: "5432"

  # Redis
  REDIS_PORT: "6379"

  # Service Mesh
  ISTIO_ENABLED: "true"
  MTLS_MODE: "STRICT"

  # Application
  APP_NAME: "SIMPEL"
  APP_VERSION: "0.1.0"

  # Session
  SESSION_TIMEOUT: "28800"
