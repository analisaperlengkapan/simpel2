# SIMPelv2 Secrets Template
# Actual values should be managed via sealed-secrets or external-secrets in production

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Placeholder - will be patched per environment
  # Using headless service 'postgres' instead of ClusterIP 'postgres-primary'
  url: "postgres://simpelv2:changeme@postgres:5432/simpelv2"
  password: "changeme"
  username: "simpelv2"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  password: "changeme"
---
apiVersion: v1
kind: Secret
metadata:
  name: simpelv2-secrets
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: application
type: Opaque
stringData:
  jwt-secret: "changeme"
  encryption-key: "changeme"
