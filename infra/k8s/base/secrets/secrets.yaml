# SIMPEL Secrets Template
# Actual values should be managed via sealed-secrets or external-secrets in production

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Placeholder - will be patched per environment
  # Using headless service 'postgres' instead of ClusterIP 'postgres-primary'
  url: "postgres://simpelv2:changeme@postgres:5432/simpelv2"
  password: "changeme"
  username: "simpelv2"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: cache
type: Opaque
stringData:
  password: "changeme"
---
apiVersion: v1
kind: Secret
metadata:
  name: simpelv2-secrets
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: application
type: Opaque
stringData:
  jwt-secret: "changeme"
  encryption-key: "changeme"
---
# Integration Secrets for layanan-integrasi
# Contains API tokens / credentials for MonSAKTI, MySIMKARI, and SIMAN
apiVersion: v1
kind: Secret
metadata:
  name: integration-secrets
  labels:
    app.kubernetes.io/name: layanan-integrasi
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # MonSAKTI API Configuration
  MONSAKTI_BASE_URL: "https://monsakti.kemenkeu.go.id/sitp-monsakti-omspan/webservice"
  MONSAKTI_TOKEN_ADM: "changeme"
  MONSAKTI_TOKEN_ANG: "changeme"
  MONSAKTI_TOKEN_AST: "changeme"
  MONSAKTI_TOKEN_BEN: "changeme"
  MONSAKTI_TOKEN_GLP: "changeme"
  MONSAKTI_TOKEN_KOM: "changeme"
  MONSAKTI_TOKEN_PEM: "changeme"
  MONSAKTI_TOKEN_PER: "changeme"
  # MySIMKARI API Configuration
  MYSIMKARI_BASE_URL: "https://mysimkari.kejaksaan.go.id/api/anbut"
  MYSIMKARI_TOKEN: "changeme"
  MYSIMKARI_TOKEN_PEGAWAI: "changeme"
  # SIMAN v2.0 OAuth2 Configuration
  SIMAN_BASE_URL: "https://apigateway.kemenkeu.go.id"
  SIMAN_TOKEN_URL: "https://sso.kemenkeu.go.id/connect/token"
  SIMAN_CLIENT_ID: "changeme"
  SIMAN_CLIENT_SECRET: "changeme"
  SIMAN_BA_KEY: "changeme"
