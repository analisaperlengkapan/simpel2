# SIMPEL Kustomize Base Configuration
# Common resources shared across all environments

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Common labels applied to all resources (using new 'labels' syntax)
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: simpelv2
      app.kubernetes.io/version: "0.1.0"
    includeSelectors: false

# Include all base resources (namespaces excluded - managed by overlays)
resources:
  - configmaps/
  - secrets/
  - infrastructure/
  - backend/
  - frontend/
  - network-policies/
  - istio/
  # Optional: Uncomment when prometheus-operator is installed
  # - monitoring/

# MetalLB is managed separately in metallb-system namespace
# Apply with: kubectl apply -k base/metallb/

# Common annotations
commonAnnotations:
  simpelv2.kejaksaan.go.id/managed: "true"
