# Secreton Secrets Management StatefulSet

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secreton
  labels:
    app.kubernetes.io/name: secreton
    app.kubernetes.io/component: secrets
spec:
  serviceName: secreton
  replicas: 1  # Patched per environment
  selector:
    matchLabels:
      app.kubernetes.io/name: secreton
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secreton
        app.kubernetes.io/component: secrets
      annotations:
        # Disable Istio sidecar - secreton needs direct database connectivity
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: secreton
          image: localhost:32000/simpelv2/secreton:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8200
              name: http
            - containerPort: 9000
              name: grpc
            - containerPort: 9090
              name: metrics
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: RUST_LOG
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: secreton-url
            # NOTE: Secreton's config loader reads the full connection string
            # from DATABASE_URL (or SECRETON_STORAGE_URL). The standalone
            # DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME env vars were
            # removed because they are not consumed by the application and
            # previously contained a `CHANGEME` placeholder that looked like
            # a live credential but had no effect at runtime.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: secreton-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Startup probe - checks if initialization is complete
          # Allows up to 5 minutes for slow startup (30 * 10s = 300s)
          startupProbe:
            httpGet:
              path: /health
              port: 8200
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30
          # Liveness probe - checks if process is alive
          # Returns 200 even if sealed (process is running)
          # Use dedicated /live endpoint so sealed/degraded state does not trigger
          # restarts.
          livenessProbe:
            httpGet:
              path: /live
              port: 8200
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          # Readiness probe - checks if service is ready to accept traffic
          # Returns 503 if sealed (not ready to serve)
          readinessProbe:
            httpGet:
              path: /ready
              port: 8200
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: secreton-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: secreton
  labels:
    app.kubernetes.io/name: secreton
spec:
  type: ClusterIP
  ports:
    - port: 8200
      targetPort: 8200
      name: http
    - port: 9000
      targetPort: 9000
      name: grpc
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app.kubernetes.io/name: secreton
