# Secreton Secrets Management StatefulSet

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secreton
  labels:
    app.kubernetes.io/name: secreton
    app.kubernetes.io/component: secrets
spec:
  serviceName: secreton
  replicas: 1  # Patched per environment
  selector:
    matchLabels:
      app.kubernetes.io/name: secreton
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secreton
        app.kubernetes.io/component: secrets
      annotations:
        # Disable Istio sidecar - secreton needs direct database connectivity
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: secreton
          image: localhost:32000/simpelv2/secreton:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8200
              name: http
            - containerPort: 9000
              name: grpc
            - containerPort: 9090
              name: metrics
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: RUST_LOG
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
            - name: DB_HOST
              value: "postgres-0.postgres.$(POD_NAMESPACE).svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DB_NAME
              value: "simpelv2"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: secreton-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: secreton-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: secreton
  labels:
    app.kubernetes.io/name: secreton
spec:
  type: ClusterIP
  ports:
    - port: 8200
      targetPort: 8200
      name: http
    - port: 9000
      targetPort: 9000
      name: grpc
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app.kubernetes.io/name: secreton
