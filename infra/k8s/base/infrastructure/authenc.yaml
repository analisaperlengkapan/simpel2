# Authenc Identity Provider Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: authenc
  labels:
    app.kubernetes.io/name: authenc
    app.kubernetes.io/component: identity
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: authenc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authenc
        app.kubernetes.io/component: identity
      annotations:
        # Disable Istio sidecar - authenc needs direct database connectivity
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: authenc
          image: localhost:32000/simpelv2/authenc:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8088
              name: http
            - containerPort: 9088
              name: grpc
            - containerPort: 9090
              name: metrics
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: RUST_LOG
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: APP_ENVIRONMENT
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: authenc-url
            - name: SECRETON_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SECRETON_GRPC_URL
                  optional: true
            - name: INTEGRASI_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: INTEGRASI_GRPC_URL
                  optional: true
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: REDIS_URL
                  optional: true
            - name: SECRETON_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SECRETON_ENDPOINT
                  optional: true
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8088"
            - name: GRPC_PORT
              value: "9088"
            - name: WEBAUTHN_RP_ID
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: WEBAUTHN_RP_ID
                  optional: true
            - name: WEBAUTHN_RP_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: WEBAUTHN_RP_ORIGIN
                  optional: true
            - name: WEBAUTHN_RP_NAME
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: WEBAUTHN_RP_NAME
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: authenc
  labels:
    app.kubernetes.io/name: authenc
spec:
  type: ClusterIP
  ports:
    - port: 8088
      targetPort: 8088
      name: http
    - port: 9088
      targetPort: 9088
      name: grpc
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app.kubernetes.io/name: authenc
