# Authenc Identity Provider Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: authenc
  labels:
    app.kubernetes.io/name: authenc
    app.kubernetes.io/component: identity
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: authenc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authenc
        app.kubernetes.io/component: identity
      annotations:
        # Disable Istio sidecar - authenc needs direct database connectivity
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: authenc
          image: localhost:32000/authenc:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8088
              name: http
            - containerPort: 9088
              name: grpc
            - containerPort: 9090
              name: metrics
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: RUST_LOG
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: authenc
  labels:
    app.kubernetes.io/name: authenc
spec:
  type: ClusterIP
  ports:
    - port: 8088
      targetPort: 8088
      name: http
    - port: 9088
      targetPort: 9088
      name: grpc
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app.kubernetes.io/name: authenc
