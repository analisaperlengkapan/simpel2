apiVersion: v1
kind: ConfigMap
metadata:
  name: simpelv1-env
  namespace: simpelv2-staging
data:
  APP_ENV: "staging"
  APP_DEBUG: "false"
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres.simpelv2-staging.svc.cluster.local"
  DB_PORT: "5432"
  DB_DATABASE: "dbsimpelv1"
  # Staging runs 2 replicas behind a Service, so file-based sessions
  # (local to each pod) would cause intermittent logouts when requests
  # are load-balanced to a different pod. Use redis-backed sessions to
  # match production behaviour. See `infra/k8s/overlays/production/simpelv1.yaml`
  # for the same rationale.
  SESSION_DRIVER: "redis"
  SESSION_CONNECTION: "default"
  CACHE_DRIVER: "redis"
  QUEUE_CONNECTION: "sync"
  REDIS_HOST: "redis.simpelv2-staging.svc.cluster.local"
  REDIS_PORT: "6379"
  PORTAL_URL: "http://portal:3000/portal"
  AUTHENC_GRPC_URL: "authenc:50051"
  INTEGRASI_GRPC_URL: "layanan-integrasi:50052"
  SECRETON_GRPC_URL: "secreton:50053"
  GRPC_SSL_MODE: "insecure"

---
# NOTE: Do not commit real credentials. Populate this Secret out-of-band
# (sealed-secrets, External Secrets Operator, kubectl create secret, etc.).
# The placeholders below are base64 of "CHANGEME" so the manifest remains
# valid for `kubectl apply`/CI dry-runs while making it obvious that the
# values must be overridden before deployment.
apiVersion: v1
kind: Secret
metadata:
  name: simpelv1-secrets
  namespace: simpelv2-staging
type: Opaque
data:
  DB_USERNAME: Q0hBTkdFTUU=
  DB_PASSWORD: Q0hBTkdFTUU=
  APP_KEY: Q0hBTkdFTUU=

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simpelv1
  namespace: simpelv2-staging
  labels:
    app: simpelv1
    version: legacy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simpelv1
  template:
    metadata:
      labels:
        app: simpelv1
        version: legacy
    spec:
      serviceAccountName: simpelv1
      
      # Init container for database migration
      initContainers:
      - name: db-migrate
        image: postgres:15-alpine
        command: ["sh", "-c"]
        args:
        - |
          set -e
          echo "Waiting for PostgreSQL..."
          until PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USERNAME -c '\q'; do
            sleep 2
          done
          
          echo "Checking if database is initialized..."
          # Connect to the target database (-d $DB_DATABASE) and check whether
          # it contains any user tables in the `public` schema. The previous
          # check looked for the `public` schema itself, but every PostgreSQL
          # database has that schema by default — so the restore branch was
          # dead code and the backup never ran. Counting tables in `public`
          # actually reflects whether the dump has been loaded.
          TABLE_COUNT=$(PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USERNAME -d $DB_DATABASE -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';" 2>/dev/null || echo "0")
          if [ "$TABLE_COUNT" -eq 0 ]; then
            echo "Database is empty, restoring from backup..."
            gunzip < /db-backup/dbsimpelv1.sql.gz | PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USERNAME -d $DB_DATABASE
            echo "Database restored successfully"
          else
            echo "Database already initialized ($TABLE_COUNT tables present)"
          fi
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: simpelv1-env
              key: DB_HOST
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: simpelv1-env
              key: DB_DATABASE
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: simpelv1-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: simpelv1-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: db-backup
          mountPath: /db-backup
          readOnly: true

      containers:
      - name: simpelv1
        image: localhost:32000/simpelv2/simpelv1:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: simpelv1-env
        - secretRef:
            name: simpelv1-secrets
        
        env:
        - name: APP_URL
          value: "https://simpel.kejaksaan.go.id/perlengkapan/simpel/v1"
        
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        
        # Liveness only checks nginx itself (`/healthz` is served directly
        # by nginx), so a transient PHP-FPM hiccup won't trigger a pod
        # restart.
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness hits Laravel's `/health` route to verify the full
        # nginx + PHP-FPM + Laravel stack is responsive before sending
        # traffic to this pod.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 33
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        
        volumeMounts:
        - name: storage
          mountPath: /app/storage
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: db-backup
        configMap:
          name: simpelv1-db-backup
      - name: storage
        emptyDir: {}
      - name: tmp
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - simpelv1
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: simpelv1
  namespace: simpelv2-staging
  labels:
    app: simpelv1
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: simpelv1

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simpelv1
  namespace: simpelv2-staging
