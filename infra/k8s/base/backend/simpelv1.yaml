apiVersion: v1
kind: ConfigMap
metadata:
  name: simpelv1-env
  namespace: simpelv2-staging
data:
  APP_ENV: "staging"
  APP_DEBUG: "false"
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres.simpelv2-staging.svc.cluster.local"
  DB_PORT: "5432"
  DB_DATABASE: "dbsimpelv1"
  SESSION_DRIVER: "file"
  CACHE_DRIVER: "file"
  QUEUE_CONNECTION: "sync"
  PORTAL_URL: "http://portal:3000/portal"
  AUTHENC_GRPC_URL: "authenc:50051"
  INTEGRASI_GRPC_URL: "layanan-integrasi:50052"
  SECRETON_GRPC_URL: "secreton:50053"
  GRPC_SSL_MODE: "insecure"

---
# NOTE: Do not commit real credentials. Populate this Secret out-of-band
# (sealed-secrets, External Secrets Operator, kubectl create secret, etc.).
# The placeholders below are base64 of "CHANGEME" so the manifest remains
# valid for `kubectl apply`/CI dry-runs while making it obvious that the
# values must be overridden before deployment.
apiVersion: v1
kind: Secret
metadata:
  name: simpelv1-secrets
  namespace: simpelv2-staging
type: Opaque
data:
  DB_USERNAME: Q0hBTkdFTUU=
  DB_PASSWORD: Q0hBTkdFTUU=
  APP_KEY: Q0hBTkdFTUU=

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simpelv1
  namespace: simpelv2-staging
  labels:
    app: simpelv1
    version: legacy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simpelv1
  template:
    metadata:
      labels:
        app: simpelv1
        version: legacy
    spec:
      serviceAccountName: simpelv1
      
      # Init container for database migration
      initContainers:
      - name: db-migrate
        image: postgres:15-alpine
        command: ["sh", "-c"]
        args:
        - |
          set -e
          echo "Waiting for PostgreSQL..."
          until PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USERNAME -c '\q'; do
            sleep 2
          done
          
          echo "Checking if database exists..."
          if ! PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USERNAME -tc "SELECT 1 FROM information_schema.schemata WHERE schema_name = 'public';" | grep -q 1; then
            echo "Database doesn't exist, restoring from backup..."
            gunzip < /db-backup/dbsimpelv1.sql.gz | PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USERNAME -d $DB_DATABASE
            echo "Database restored successfully"
          else
            echo "Database already initialized"
          fi
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: simpelv1-env
              key: DB_HOST
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: simpelv1-env
              key: DB_DATABASE
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: simpelv1-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: simpelv1-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: db-backup
          mountPath: /db-backup
          readOnly: true

      containers:
      - name: simpelv1
        image: localhost:32000/simpelv2/simpelv1:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: simpelv1-env
        - secretRef:
            name: simpelv1-secrets
        
        env:
        - name: APP_URL
          value: "https://simpel.kejaksaan.go.id/perlengkapan/simpel/v1"
        
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 33
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        
        volumeMounts:
        - name: storage
          mountPath: /app/storage
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: db-backup
        configMap:
          name: simpelv1-db-backup
      - name: storage
        emptyDir: {}
      - name: tmp
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - simpelv1
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: simpelv1
  namespace: simpelv2-staging
  labels:
    app: simpelv1
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: simpelv1

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simpelv1
  namespace: simpelv2-staging
