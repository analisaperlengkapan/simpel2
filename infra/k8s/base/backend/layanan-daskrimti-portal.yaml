# layanan-daskrimti-portal Backend Service

apiVersion: apps/v1
kind: Deployment
metadata:
  name: layanan-daskrimti-portal
  labels:
    app.kubernetes.io/name: layanan-daskrimti-portal
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: layanan-daskrimti-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: layanan-daskrimti-portal
        app.kubernetes.io/component: backend
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: portal-backend
          image: localhost:32000/simpelv2/layanan-daskrimti-portal:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 3010
              name: http
          env:
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "3010"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: REDIS_URL
                  optional: true
            - name: AUTHENC_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: AUTHENC_GRPC_URL
                  optional: true
            - name: SECRETON_GRPC_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SECRETON_GRPC_URL
                  optional: true
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: RUST_LOG
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: layanan-daskrimti-portal
  labels:
    app.kubernetes.io/name: layanan-daskrimti-portal
spec:
  type: ClusterIP
  ports:
    - port: 3010
      targetPort: 3010
      name: http
  selector:
    app.kubernetes.io/name: layanan-daskrimti-portal
