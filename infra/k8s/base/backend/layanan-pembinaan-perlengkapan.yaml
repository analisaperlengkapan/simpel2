# layanan-pembinaan-perlengkapan Backend Service

apiVersion: apps/v1
kind: Deployment
metadata:
  name: layanan-pembinaan-perlengkapan
  labels:
    app.kubernetes.io/name: layanan-pembinaan-perlengkapan
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: layanan-pembinaan-perlengkapan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: layanan-pembinaan-perlengkapan
        app.kubernetes.io/component: backend
      annotations:
        sidecar.istio.io/inject: "true"
        # Exclude database port from Istio interception
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432,6379"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: perlengkapan-backend
          image: localhost:32000/simpelv2/layanan-pembinaan-perlengkapan:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3020
              name: http
          env:
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "3020"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: simpelv2-config
                  key: RUST_LOG
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3020
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3020
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: layanan-pembinaan-perlengkapan
  labels:
    app.kubernetes.io/name: layanan-pembinaan-perlengkapan
spec:
  type: ClusterIP
  ports:
    - port: 3020
      targetPort: 3020
      name: http
  selector:
    app.kubernetes.io/name: layanan-pembinaan-perlengkapan
