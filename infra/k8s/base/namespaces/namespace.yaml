# SIMPelv2 Kubernetes Namespace Template
# Uses Kustomize namePrefix/nameSuffix for environment-specific naming

apiVersion: v1
kind: Namespace
metadata:
  name: simpelv2
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: kustomize
    istio-injection: enabled
  annotations:
    description: "SIMPelv2 Application Namespace"
---
apiVersion: v1
kind: Namespace
metadata:
  name: simpelv2-infra
  labels:
    app.kubernetes.io/name: simpelv2-infra
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: kustomize
    istio-injection: enabled
  annotations:
    description: "SIMPelv2 Infrastructure Namespace (PostgreSQL, Redis, Authenc, Secreton)"
