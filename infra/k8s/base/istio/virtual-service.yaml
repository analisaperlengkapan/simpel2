# Istio VirtualService for SIMPelv2
# IMPORTANT: Routes are ordered from most specific to least specific
# IMPORTANT: VirtualService must be in istio-system or use namespace-qualified gateway reference

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: simpelv2-routes
  namespace: istio-system
spec:
  hosts:
    - "*"
  gateways:
    - simpelv2-gateway
  http:
    # ============================================
    # Root redirect: / → /portal
    # ============================================
    - match:
        - uri:
            exact: /
      redirect:
        uri: /portal
        redirectCode: 302

    # ============================================
    # Backend API routes (most specific - /api/*)
    # ============================================
    # Authentication routes (frontend → layanan-portal → authenc gRPC)
    - match:
        - uri:
            prefix: /api/auth
      route:
        - destination:
            host: layanan-portal
            port:
              number: 3010
    - match:
        - uri:
            prefix: /api/portal
      route:
        - destination:
            host: layanan-portal
            port:
              number: 3010
    - match:
        - uri:
            prefix: /api/perlengkapan
      route:
        - destination:
            host: layanan-perlengkapan
            port:
              number: 3020

    # ============================================
    # Microfrontend routes (specific paths)
    # ============================================
    # Perlengkapan frontend at /perlengkapan (Istio strips prefix, nginx serves SPA)
    - match:
        - uri:
            prefix: /perlengkapan
      rewrite:
        uri: /
      route:
        - destination:
            host: perlengkapan
            port:
              number: 8080
    # Portal frontend at /portal (Istio strips prefix, nginx serves SPA)
    - match:
        - uri:
            prefix: /portal
      rewrite:
        uri: /
      route:
        - destination:
            host: portal
            port:
              number: 8080

    # ============================================
    # Default catch-all route (MUST BE LAST)
    # ============================================
    - redirect:
        uri: /portal
        redirectCode: 302
