# Istio VirtualService for SIMPEL (Base)
# Routes ordered from most specific to least specific
# Note: This base is overridden by overlay-specific staging-istio.yaml / production-istio.yaml
# applied separately to istio-system namespace

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: simpelv2-routes
  namespace: istio-system
spec:
  hosts:
    - "*"
  gateways:
    - simpelv2-gateway
  http:
    # ============================================
    # Root redirect: / → /portal
    # ============================================
    - match:
        - uri:
            exact: /
      redirect:
        uri: /portal
        redirectCode: 302

    # ============================================
    # CAPTCHA Routes → Authenc
    # ============================================
    - match:
        - uri:
            prefix: /api/captcha
      route:
        - destination:
            host: authenc
            port:
              number: 8088

    # ============================================
    # Backend API routes
    # ============================================
    - match:
        - uri:
            prefix: /api/v1/auth
      route:
        - destination:
            host: authenc
            port:
              number: 8088

    - match:
        - uri:
            prefix: /api/v1/iam
      route:
        - destination:
            host: authenc
            port:
              number: 8088

    - match:
        - uri:
            prefix: /api/v1/oauth2
      route:
        - destination:
            host: authenc
            port:
              number: 8088

    - match:
        - uri:
            prefix: /api/auth
      route:
        - destination:
            host: authenc
            port:
              number: 8088

    - match:
        - uri:
            prefix: /api/perlengkapan
      route:
        - destination:
            host: layanan-perlengkapan
            port:
              number: 3020

    # ============================================
    # Microfrontend routes
    # ============================================
    - match:
        - uri:
            prefix: /perlengkapan
      rewrite:
        uri: /
      route:
        - destination:
            host: perlengkapan
            port:
              number: 8080

    - match:
        - uri:
            prefix: /portal
      rewrite:
        uri: /
      route:
        - destination:
            host: portal
            port:
              number: 8080

    # ============================================
    # Default catch-all → /portal
    # ============================================
    - redirect:
        uri: /portal
        redirectCode: 302
