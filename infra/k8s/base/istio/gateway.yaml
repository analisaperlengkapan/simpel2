# Istio Gateway for SIMPelv2

apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: simpelv2-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
      # httpsRedirect removed: 301 redirects get cached by browsers causing
      # ERR_TOO_MANY_REDIRECTS on internal IP deployments. Handle at VirtualService
      # level with 302 if needed.
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "*"
      tls:
        mode: SIMPLE
        credentialName: simpelv2-tls-secret
