# SIMPelv2 PersistentVolumes - OPTIMIZED untuk Longhorn
# Migrated dari hostPath ke Longhorn distributed storage

---
# PostgreSQL - Longhorn PVC (Replicated, HA-ready)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: simpelv2-infra
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi

