---
# NOTES:
# 1. Longhorn provides automatic replication across nodes
# 2. Data survives node failures
# 3. No need for manual PV creation - dynamic provisioning
# 4. Longhorn handles snapshots and backups
# 5. Better performance than hostPath for multi-node clusters

# Longhorn Configuration Recommendations:
# - Number of Replicas: 2 (default) - sufficient untuk 2-node cluster
# - For 3+ nodes: set replicas to 3 for better HA
# - Enable automatic snapshots untuk backup
# - Monitor via Longhorn UI: kubectl port-forward -n longhorn-system svc/longhorn-frontend 8000:80
