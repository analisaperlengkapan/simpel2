# SIMPelv2 Regular Secrets (Development/Testing Only)
# WARNING: These are base64 encoded, NOT encrypted. Use SealedSecrets in production.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: simpelv2-infra
type: Opaque
stringData:
  POSTGRES_DB: simpelv2
  POSTGRES_USER: simpelv2_admin
  POSTGRES_PASSWORD: changeme_postgres_password_production
  DATABASE_URL: postgresql://simpelv2_admin:changeme_postgres_password_production@postgres-service.simpelv2-infra.svc.cluster.local:5432/simpelv2
  # Service-specific database users
  AUTHENC_DB_USER: simpelv2_authenc
  AUTHENC_DB_PASSWORD: changeme_authenc_password_production
  SECRETON_DB_USER: simpelv2_secreton
  SECRETON_DB_PASSWORD: changeme_secreton_password_production
  SERVICES_DB_USER: simpelv2_services
  SERVICES_DB_PASSWORD: changeme_services_password_production

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: simpelv2-infra
type: Opaque
stringData:
  REDIS_PASSWORD: changeme_redis_password_production
  REDIS_URL: redis://:changeme_redis_password_production@redis-service.simpelv2-infra.svc.cluster.local:6379

---
apiVersion: v1
kind: Secret
metadata:
  name: authenc-secrets
  namespace: simpelv2-infra
type: Opaque
stringData:
  JWT_SECRET: changeme_jwt_secret_at_least_32_characters_long_production
  ENCRYPTION_KEY: changeme_encryption_key_32_chars_production
  DATABASE_URL: postgresql://simpelv2_admin:changeme_postgres_password_production@postgres-service.simpelv2-infra.svc.cluster.local:5432/simpelv2_authenc

---
apiVersion: v1
kind: Secret
metadata:
  name: secreton-secrets
  namespace: simpelv2-infra
type: Opaque
stringData:
  MASTER_KEY: changeme_master_key_for_secreton_32_characters_long
  DATABASE_URL: postgresql://simpelv2_admin:changeme_postgres_password_production@postgres-service.simpelv2-infra.svc.cluster.local:5432/simpelv2_secreton


