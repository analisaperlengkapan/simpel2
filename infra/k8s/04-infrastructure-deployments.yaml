# SIMPelv2 Infrastructure Deployments
# Core infrastructure services: PostgreSQL, Redis, Nginx, Authenc, Secreton

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: simpelv2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-init
          configMap:
            name: postgres-init

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: simpelv2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: simpelv2
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/component: proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls-certs
              mountPath: /etc/nginx/ssl
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: tls-certs
          secret:
            secretName: tls-secrets

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authenc
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: authenc
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: simpelv2
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: authenc
  template:
    metadata:
      annotations:
        proxy.istio.io/config: '{ "holdApplicationUntilProxyReady": true }'
      labels:
        app.kubernetes.io/name: authenc
        app.kubernetes.io/component: iam
    spec:
      containers:
        - name: authenc
          image: localhost:32000/authenc:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
              name: http
            - containerPort: 9088
              name: grpc-authenc
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: simpelv2-secrets
                  key: AUTHENC_JWT_SECRET
            - name: AUTHENC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: AUTHENC_DB_USER
            - name: AUTHENC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: AUTHENC_DB_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-service.simpelv2.svc.cluster.local:6379"
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: simpelv2-secrets
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: simpelv2-secrets
                  key: SMTP_PASSWORD
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: AUTHENC_DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: AUTHENC_DB_PASSWORD
            - name: DB_HOST
              value: "postgres-service.simpelv2.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "simpelv2_authenc"
            - name: RUST_LOG
              value: "info"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: docker-registry-secret

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secreton
  namespace: simpelv2
  labels:
    app.kubernetes.io/name: secreton
    app.kubernetes.io/component: secreton
    app.kubernetes.io/part-of: simpelv2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: secreton
  template:
    metadata:
      annotations:
        proxy.istio.io/config: '{ "holdApplicationUntilProxyReady": true }'
      labels:
        app.kubernetes.io/name: secreton
        app.kubernetes.io/component: secreton
    spec:
      containers:
        - name: secreton
          image: localhost:32000/simpelv2/secreton:latest
          ports:
            - containerPort: 8200
              name: http
            - containerPort: 9000
              name: grpc
          env:
            - name: SECRETON_DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: SECRETON_DB_USER
            - name: SECRETON_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: SECRETON_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://secreton:secreton-dev-password-2024@postgres-service.simpelv2.svc.cluster.local:5432/simpelv2_secreton"
            - name: SECRETON_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: simpelv2-secrets
                  key: SECRETON_ADMIN_TOKEN
            - name: SECRETON_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: simpelv2-secrets
                  key: SECRETON_ENCRYPTION_KEY
            - name: RUST_LOG
              value: "info"
          volumeMounts:
            - name: secreton-storage
              mountPath: /opt/simpelv2/data
            - name: tls-certs
              mountPath: /opt/simpelv2/certs
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          # gRPC health check (requires grpc_health_probe binary)
          # startupProbe:
          #   exec:
          #     command: ["/bin/grpc_health_probe", "-addr=:9200"]
          #   initialDelaySeconds: 5
          #   periodSeconds: 10
      volumes:
        - name: secreton-storage
          persistentVolumeClaim:
            claimName: secreton-raft-pvc
        - name: tls-certs
          secret:
            secretName: tls-secrets
      imagePullSecrets:
        - name: docker-registry-secret
