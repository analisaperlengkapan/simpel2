apiVersion: v1
kind: ConfigMap
metadata:
  name: simpelv1-env
  namespace: simpelv2-production
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgres.simpelv2-production.svc.cluster.local"
  DB_PORT: "5432"
  DB_DATABASE: "dbsimpelv1"
  # Use redis-backed sessions in production: with 3+ replicas behind a
  # load balancer, file-based sessions would be local to each pod and
  # cause intermittent logouts when requests hit a different replica.
  SESSION_DRIVER: "redis"
  SESSION_CONNECTION: "default"
  CACHE_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"
  REDIS_HOST: "redis.simpelv2-production.svc.cluster.local"
  REDIS_PORT: "6379"
  CACHE_REDIS_HOST: "redis.simpelv2-production.svc.cluster.local"
  CACHE_REDIS_PORT: "6379"
  QUEUE_REDIS_HOST: "redis.simpelv2-production.svc.cluster.local"
  QUEUE_REDIS_PORT: "6379"
  PORTAL_URL: "https://simpel.kejaksaan.go.id/portal"
  # The PHP gateway clients (`AuthencGrpcClient`, `IntegrasiGrpcClient`,
  # `SecrethonGrpcClient`) read *_GATEWAY_URL — not *_GRPC_URL — and
  # speak HTTP/REST to a sidecar/gateway proxy per
  # `monolith/simpelv1/AGENTS.md`. The previous *_GRPC_URL keys were
  # dead config because no PHP code ever reads them. The sidecar is
  # colocated in the pod, so we target localhost.
  AUTHENC_GATEWAY_URL: "http://127.0.0.1:8081"
  INTEGRASI_GATEWAY_URL: "http://127.0.0.1:8082"
  SECRETON_GATEWAY_URL: "http://127.0.0.1:8083"

---
# NOTE: Do not commit real production credentials. Populate this Secret
# via sealed-secrets / External Secrets Operator / Secreton before applying.
# Placeholders below are base64 of "CHANGEME".
apiVersion: v1
kind: Secret
metadata:
  name: simpelv1-secrets
  namespace: simpelv2-production
type: Opaque
data:
  DB_USERNAME: Q0hBTkdFTUU=
  DB_PASSWORD: Q0hBTkdFTUU=
  APP_KEY: Q0hBTkdFTUU=

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simpelv1
  namespace: simpelv2-production
  labels:
    app: simpelv1
    version: legacy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: simpelv1
  template:
    metadata:
      labels:
        app: simpelv1
        version: legacy
    spec:
      serviceAccountName: simpelv1
      
      # Init container for database migration
      initContainers:
      - name: db-migrate
        image: postgres:15-alpine
        command: ["sh", "-c"]
        args:
        - |
          set -e
          echo "Waiting for PostgreSQL..."
          until PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USERNAME -c '\q'; do
            sleep 2
          done
          
          echo "Checking if database is initialized..."
          # `SELECT 1;` succeeds against any reachable database — including
          # an empty one — so it can't tell whether the dump has been
          # loaded. Mirror the staging check (counting user tables in the
          # `public` schema) so the restore branch actually runs on a
          # fresh database. See `infra/k8s/base/backend/simpelv1.yaml`.
          TABLE_COUNT=$(PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USERNAME -d $DB_DATABASE -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';" 2>/dev/null || echo "0")
          if [ "$TABLE_COUNT" -eq 0 ]; then
            echo "Database is empty, restoring from backup..."
            gunzip < /db-backup/dbsimpelv1.sql.gz | PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -U $DB_USERNAME -d $DB_DATABASE
            echo "Database restored successfully"
          else
            echo "Database already initialized ($TABLE_COUNT tables present)"
          fi
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: simpelv1-env
              key: DB_HOST
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: simpelv1-env
              key: DB_DATABASE
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: simpelv1-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: simpelv1-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: db-backup
          mountPath: /db-backup
          readOnly: true

      containers:
      - name: simpelv1
        # Pin to a versioned tag in production. Per `infra/k8s/AGENTS.md`,
        # production manifests must use immutable tags (e.g. `:v0.1.0`)
        # rather than `:latest`. Combined with `IfNotPresent`, a `:latest`
        # tag would let nodes silently keep stale cached images even after
        # a new image is pushed under the same tag, leading to drift
        # between replicas.
        image: simpelv2/simpelv1:v0.1.0
        # `Always` ensures every pod start re-pulls the image, so a tag
        # bump (e.g. via `kubectl set image ... =simpelv2/simpelv1:v0.2.0`)
        # is picked up consistently across all nodes.
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: simpelv1-env
        - secretRef:
            name: simpelv1-secrets
        
        env:
        - name: APP_URL
          value: "https://simpel.kejaksaan.go.id/perlengkapan/simpel/v1"
        
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
        
        # Liveness checks nginx only (`/healthz` is served directly by
        # nginx) so a transient PHP-FPM blip doesn't cascade into pod
        # restarts.
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness hits the Laravel `/health` route so we don't send
        # traffic until the full stack is up.
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 33
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        
        volumeMounts:
        - name: storage
          mountPath: /app/storage
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /run/nginx

      volumes:
      - name: db-backup
        secret:
          secretName: simpelv1-db-backup
      - name: storage
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      - name: run
        emptyDir: {}

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - simpelv1
            topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: simpelv1
  namespace: simpelv2-production
  labels:
    app: simpelv1
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: simpelv1

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simpelv1
  namespace: simpelv2-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simpelv1
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: simpelv1
  namespace: simpelv2-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: simpelv1

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simpelv1
  namespace: simpelv2-production
