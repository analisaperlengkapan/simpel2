# Production Environment Overlay
# Namespace: simpelv2-production
# High availability, strict security, optimized resources

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for production (applied to most resources)
namespace: simpelv2-production

# Base configuration
resources:
  - ../../base
  - namespace.yaml
  - hpa.yaml
  - pdb.yaml
  - resource-quota.yaml

# Labels for production environment (using new syntax)
labels:
  - pairs:
      app.kubernetes.io/environment: production
    includeSelectors: false

# Annotations for production
commonAnnotations:
  simpelv2.kejaksaan.go.id/environment: production

# Patches for production-specific values
patches:
  # Security Context Patch (using path reference)
  - path: security-context-patch.yaml

  # Global: All deployments use local images
  # Production is flexible — pods can be scheduled on any available node
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

  # Frontend: 3 replicas for HA
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # Backend: 3 replicas for HA
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # Authenc: 3 replicas for HA
  - target:
      kind: Deployment
      name: authenc
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # PostgreSQL: 3 replicas for HA with Patroni
  # Flexible scheduling — can run on any available node
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 100Gi

  # Secreton: 3 replicas for HA
  # Flexible scheduling — can run on any available node
  - target:
      kind: StatefulSet
      name: secreton
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # Production resources for backend
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component=backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"

  # Production resources for infrastructure
  - target:
      kind: Deployment
      name: authenc
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"

  # Enable HTTPS redirect in Istio Gateway
  - target:
      kind: Gateway
      name: simpelv2-gateway
    patch: |-
      - op: replace
        path: /spec/servers/0/tls/httpsRedirect
        value: true

  # Strict mTLS in production
  - target:
      kind: PeerAuthentication
      name: default-mtls
    patch: |-
      - op: replace
        path: /spec/mtls/mode
        value: STRICT

# ConfigMap patches for production
configMapGenerator:
  - name: simpelv2-config
    behavior: merge
    literals:
      - RUST_LOG=info
      - APP_ENVIRONMENT=production
      - POSTGRES_HOST=postgres-primary.simpelv2-production.svc.cluster.local
      - REDIS_URL=redis://redis-service.simpelv2-production.svc.cluster.local:6379
      - PORTAL_BASE_URL=https://simpel.kejaksaan.go.id
      - JWT_ISSUER=https://simpel.kejaksaan.go.id/auth
      - SESSION_TIMEOUT=28800

  - name: backend-config
    behavior: merge
    literals:
      - AUTHENC_GRPC_URL=http://authenc.simpelv2-production.svc.cluster.local:9088
      - SECRETON_GRPC_URL=http://secreton.simpelv2-production.svc.cluster.local:9000
      - MTLS_MODE=STRICT
      - GRPC_TLS_ENABLED=true

# Image tags for production (use prod version tags)
images:
  - name: localhost:32000/simpelv2/layanan-portal
    newTag: prod
  - name: localhost:32000/simpelv2/layanan-integrasi
    newTag: prod
  - name: localhost:32000/simpelv2/layanan-integrasi-grpc
    newTag: prod
  - name: localhost:32000/simpelv2/layanan-perlengkapan
    newTag: prod
  - name: localhost:32000/simpelv2/portal
    newTag: prod
  - name: localhost:32000/simpelv2/perlengkapan
    newTag: prod
  - name: localhost:32000/simpelv2/authenc
    newTag: prod
  - name: localhost:32000/simpelv2/secreton
    newTag: prod
  - name: postgres
    newTag: 16-alpine
  - name: redis
    newTag: 7-alpine

generatorOptions:
  disableNameSuffixHash: true
