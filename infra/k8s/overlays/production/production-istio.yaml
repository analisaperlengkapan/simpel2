# Production Istio Routing Configuration
# These resources are in istio-system namespace and should NOT be managed by Kustomize overlays
# Apply separately: kubectl apply -f infra/k8s/overlays/production/production-istio.yaml

---
# VirtualService for production traffic routing
# Routes traffic to simpelv2-production namespace services
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: simpelv2-prod-routes
  namespace: istio-system
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: routing
    app.kubernetes.io/environment: production
spec:
  hosts:
    - "*"
  gateways:
    - simpelv2-dev-gateway  # Using existing gateway in istio-system
  http:
    # ============================================
    # Backend API routes (most specific - /api/*)
    # ============================================
    - match:
        - uri:
            prefix: /api/portal
      route:
        - destination:
            host: layanan-portal.simpelv2-production.svc.cluster.local
            port:
              number: 3010
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s

    - match:
        - uri:
            prefix: /api/perlengkapan
      route:
        - destination:
            host: layanan-perlengkapan.simpelv2-production.svc.cluster.local
            port:
              number: 3020
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s

    # ============================================
    # Microfrontend routes (specific paths)
    # ============================================
    # Pembinaan Perlengkapan
    - match:
        - uri:
            prefix: /pembinaan/perlengkapan
      route:
        - destination:
            host: perlengkapan.simpelv2-production.svc.cluster.local
            port:
              number: 8080

    # Daskrimti Portal
    - match:
        - uri:
            prefix: /daskrimti
      route:
        - destination:
            host: portal.simpelv2-production.svc.cluster.local
            port:
              number: 8080

    # ============================================
    # Default catch-all route (MUST BE LAST)
    # Routes to main portal
    # ============================================
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: portal.simpelv2-production.svc.cluster.local
            port:
              number: 8080
