# Security Context patches for PodSecurity compliance
# Applied to all Deployments and StatefulSets in production

# Deployment patches
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authenc
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authenc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
