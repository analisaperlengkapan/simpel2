# PodDisruptionBudget for Production
# High availability with minimum availability guarantees

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
spec:
  minAvailable: 2  # At least 2 of 3 must be available
  selector:
    matchLabels:
      app: postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: authenc-pdb
spec:
  minAvailable: 2  # At least 2 of 3 must be available
  selector:
    matchLabels:
      app.kubernetes.io/name: authenc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: secreton-pdb
spec:
  minAvailable: 2  # At least 2 of 3 must be available
  selector:
    matchLabels:
      app.kubernetes.io/name: secreton
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portal-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: layanan-portal-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: layanan-portal
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
spec:
  maxUnavailable: 0  # Redis is single instance
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
