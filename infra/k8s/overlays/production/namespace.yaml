# Production Namespace

apiVersion: v1
kind: Namespace
metadata:
  name: simpelv2-production
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/environment: production
    istio-injection: enabled
    # Use privileged for Istio sidecar compatibility (NET_ADMIN needed)
    # Security is enforced by Istio mTLS, NetworkPolicies, and RBAC
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
  annotations:
    description: "SIMPelv2 Production Environment"
    simpelv2.kejaksaan.go.id/tier: production
    simpelv2.kejaksaan.go.id/sla: "99.9%"
