# Image tags for staging (use dev/latest tags available in registry)
images:
  - name: localhost:32000/simpelv2/layanan-portal
    newTag: stag
  - name: localhost:32000/simpelv2/layanan-integrasi
    newTag: stag
  - name: localhost:32000/simpelv2/layanan-perlengkapan
    newTag: stag
  - name: localhost:32000/simpelv2/portal
    newTag: stag
  - name: localhost:32000/simpelv2/perlengkapan
    newTag: stag
  - name: localhost:32000/simpelv2/authenc
    newTag: stag
  - name: localhost:32000/simpelv2/secreton
    newTag: stag
  # Standard images - use imagePullPolicy: IfNotPresent in base
  - name: postgres
    newName: postgres
    newTag: 16-alpine
  - name: redis
    newName: redis
    newTag: 7-alpine

generatorOptions:
  disableNameSuffixHash: true
