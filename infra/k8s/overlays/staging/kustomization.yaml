# Staging Environment Overlay
# Namespace: simpelv2-staging

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace suffix for staging
namespace: simpelv2-staging
namePrefix: ""
nameSuffix: ""

# Base configuration
resources:
  - ../../base
  - namespace.yaml
  - hpa.yaml
  - pdb.yaml
  - mtls.yaml
  - allow-ingress-gateway-networkpolicy.yaml
  - priority-classes.yaml
  - service-accounts.yaml
  - network-policies-internal.yaml

# Labels for staging environment (using new syntax)
labels:
  - pairs:
      app.kubernetes.io/environment: staging
    includeSelectors: false

# Annotations for staging
commonAnnotations:
  simpelv2.kejaksaan.go.id/environment: staging

# Patches for staging-specific values
patches:
  # Uniform pod hardening: securityContext, readOnlyRootFilesystem, capabilities.drop[ALL],
  # seccompProfile, serviceAccountName, priorityClassName, terminationGracePeriodSeconds,
  # and tmp emptyDir for Rust backends.
  - path: security-context-patch.yaml

  # Portal nginx ConfigMap override patch for staging CSP
  - path: frontend-config-patch.yaml
    target:
      kind: ConfigMap
      name: portal-nginx-config

  # Portal nginx patch: mount nginx.conf dan index.html dari ConfigMap
  - path: portal-nginx-patch.yaml
    target:
      kind: Deployment
      name: portal

  # Reduce replicas for staging
  - target:
      kind: Deployment
      name: ".*"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # PostgreSQL: single replica for staging
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # Secreton: single replica for staging
  - target:
      kind: StatefulSet
      name: secreton
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      # Keep immutable selector aligned with existing staging StatefulSet.
      - op: replace
        path: /spec/selector/matchLabels
        value:
          app: secreton
      - op: add
        path: /spec/template/metadata/labels/app
        value: secreton

  # Schedule all deployments to simple02 for staging
  # Use Always since images are pushed to local registry at localhost:32000
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: simple02
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # Reduce resources for staging
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  # Authenc login path is CPU-heavy (password verification + token flows).
  # Override generic staging limits to avoid cgroup throttling on /api/v1/auth/login.
  - target:
      kind: Deployment
      name: authenc
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  # Allow disruption when portal replica is reduced to 1 for staging
  - target:
      kind: PodDisruptionBudget
      name: portal-pdb
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

# ConfigMap patches for staging
configMapGenerator:
  - name: simpelv2-config
    behavior: merge
    literals:
      - RUST_LOG=debug
      - APP_ENVIRONMENT=staging
      - POSTGRES_HOST=postgres.simpelv2-staging.svc.cluster.local
      - REDIS_URL=redis://redis-service.simpelv2-staging.svc.cluster.local:6379
      - PORTAL_BASE_URL=http://10.1.7.121
      - JWT_ISSUER=http://10.1.7.121/auth
      # WebAuthn requires a valid domain name (NOT IP address).
      # To use passkey auth, access the portal via a hostname and set these accordingly.
      # Example: WEBAUTHN_RP_ID=simpel-staging.kejaksaan.go.id
      #          WEBAUTHN_RP_ORIGIN=https://simpel-staging.kejaksaan.go.id
      - WEBAUTHN_RP_ID=simpel-staging.kejaksaan.go.id
      - WEBAUTHN_RP_ORIGIN=https://simpel-staging.kejaksaan.go.id
      - WEBAUTHN_RP_NAME=SIMPEL Kejaksaan RI

  - name: backend-config
    behavior: merge
    literals:
      - AUTHENC_GRPC_URL=http://authenc.simpelv2-staging.svc.cluster.local:9088
      - SECRETON_GRPC_URL=http://secreton.simpelv2-staging.svc.cluster.local:9000
      - SECRETON_ENDPOINT=http://secreton.simpelv2-staging.svc.cluster.local:8200
      - INTEGRASI_GRPC_URL=http://layanan-integrasi.simpelv2-staging.svc.cluster.local:50051
      - MTLS_MODE=PERMISSIVE
      - MYSIMKARI_SCHEDULE="0 */15 * * * *"
      - SIMAN_SCHEDULE="0 */15 * * * *"
      - MONSAKTI_SCHEDULE="0 */15 * * * *"

# Secret patches for staging
# ⛔ DO NOT commit real secrets to this file!
# The secretGenerator below produces placeholder secrets (CHANGEME).
# ⚠️  WARNING: Every `kubectl apply -k overlays/staging` OVERWRITES cluster secrets
#     with these CHANGEME placeholders. You MUST re-apply real secrets afterward.
#
# Deployment workflow (order matters!):
#   1. kubectl apply -k overlays/staging          # deploys everything with CHANGEME
#   2. cp staging-secrets.example.yaml staging-secrets.yaml   # one-time setup (gitignored)
#   3. $EDITOR staging-secrets.yaml               # fill in real credentials
#   4. kubectl apply -f staging-secrets.yaml -n simpelv2-staging  # overwrite placeholders
#
# For production, use Secreton (see root AGENTS.md and layanan/secreton/).
secretGenerator:
  - name: postgres-credentials
    behavior: merge
    literals:
      - url=postgres://simpelv2:CHANGEME@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/simpelv2
      - authenc-url=postgres://simpelv2:CHANGEME@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/authenc
      - secreton-url=postgres://simpelv2:CHANGEME@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/secreton
      - perlengkapan-url=postgres://simpelv2:CHANGEME@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/perlengkapan
      - integrasi-url=postgres://simpelv2:CHANGEME@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/integrasi
      - password=CHANGEME
      - username=simpelv2
  - name: integration-secrets
    behavior: merge
    literals:
      - SIMAN_CLIENT_ID=CHANGEME
      - SIMAN_CLIENT_SECRET=CHANGEME
      - SIMAN_BA_KEY=CHANGEME
      - MONSAKTI_TOKEN_ADM=CHANGEME
      - MONSAKTI_TOKEN_ANG=CHANGEME
      - MONSAKTI_TOKEN_AST=CHANGEME
      - MONSAKTI_TOKEN_BEN=CHANGEME
      - MONSAKTI_TOKEN_GLP=CHANGEME
      - MONSAKTI_TOKEN_KOM=CHANGEME
      - MONSAKTI_TOKEN_PEM=CHANGEME
      - MONSAKTI_TOKEN_PER=CHANGEME
      - MYSIMKARI_TOKEN=CHANGEME
      - MYSIMKARI_TOKEN_PEGAWAI=CHANGEME

# Image tags for staging (use dev/latest tags available in registry)
images:
  - name: localhost:32000/simpelv2/layanan-integrasi
    newTag: stag
  - name: localhost:32000/simpelv2/layanan-perlengkapan
    newTag: stag
  - name: localhost:32000/simpelv2/portal
    newTag: stag
  - name: localhost:32000/simpelv2/perlengkapan
    newTag: stag
  - name: localhost:32000/simpelv2/authenc
    newTag: stag
  - name: localhost:32000/simpelv2/secreton
    newTag: stag
  # Standard images - use imagePullPolicy: IfNotPresent in base
  - name: postgres
    newName: postgres
    newTag: 16-alpine
  - name: redis
    newName: redis
    newTag: 7-alpine

generatorOptions:
  disableNameSuffixHash: true
