# Staging Environment Overlay
# Namespace: simpelv2-staging

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace suffix for staging
namespace: simpelv2-staging
namePrefix: ""
nameSuffix: ""

# Base configuration
resources:
  - ../../base
  - namespace.yaml
  - hpa.yaml
  - pdb.yaml
  - mtls.yaml
  - allow-ingress-gateway-networkpolicy.yaml

# Labels for staging environment (using new syntax)
labels:
  - pairs:
      app.kubernetes.io/environment: staging
    includeSelectors: false

# Annotations for staging
commonAnnotations:
  simpelv2.kejaksaan.go.id/environment: staging

# Patches for staging-specific values
patches:
  # Portal nginx ConfigMap override patch for staging CSP
  - path: frontend-config-patch.yaml
    target:
      kind: ConfigMap
      name: portal-nginx-config

  # Portal nginx patch: mount nginx.conf dan index.html dari ConfigMap
  - path: portal-nginx-patch.yaml
    target:
      kind: Deployment
      name: portal

  # Reduce replicas for staging
  - target:
      kind: Deployment
      name: ".*"
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # PostgreSQL: single replica for staging, schedule to simple02 node
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: simple02

  # Secreton: single replica for staging, schedule to simple02 node
  - target:
      kind: StatefulSet
      name: secreton
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: simple02

  # Schedule all deployments to simple02 for staging
  # Use Always since images are pushed to local registry at localhost:32000
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: simple02
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # Reduce resources for staging
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "250m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

# ConfigMap patches for staging
configMapGenerator:
  - name: simpelv2-config
    behavior: merge
    literals:
      - RUST_LOG=debug
      - APP_ENVIRONMENT=staging
      - POSTGRES_HOST=postgres.simpelv2-staging.svc.cluster.local
      - REDIS_URL=redis://redis-service.simpelv2-staging.svc.cluster.local:6379
      - PORTAL_BASE_URL=http://10.1.7.121
      - JWT_ISSUER=http://10.1.7.121/auth
      - WEBAUTHN_RP_ID=localhost
      - WEBAUTHN_RP_ORIGIN=http://localhost:8088

  - name: backend-config
    behavior: merge
    literals:
      - AUTHENC_GRPC_URL=http://authenc.simpelv2-staging.svc.cluster.local:9088
      - SECRETON_GRPC_URL=http://secreton.simpelv2-staging.svc.cluster.local:9000
      - SECRETON_ENDPOINT=http://secreton.simpelv2-staging.svc.cluster.local:8200
      - INTEGRASI_GRPC_URL=http://layanan-integrasi.simpelv2-staging.svc.cluster.local:50051
      - MTLS_MODE=PERMISSIVE
      - MYSIMKARI_SCHEDULE="0 */15 * * * *"
      - SIMAN_SCHEDULE="0 */15 * * * *"
      - MONSAKTI_SCHEDULE="0 */15 * * * *"

# Secret patches for staging
# Note: Sensitive literals have been removed for security.
# These values should be injected securely via CI/CD, SOPS, or Secreton.
secretGenerator:
  - name: postgres-credentials
    behavior: merge
    literals:
      - url=postgres://simpelv2:REDACTED@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/simpelv2
      - authenc-url=postgres://simpelv2:REDACTED@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/authenc
      - secreton-url=postgres://simpelv2:REDACTED@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/secreton
      - perlengkapan-url=postgres://simpelv2:REDACTED@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/perlengkapan
      - integrasi-url=postgres://simpelv2:REDACTED@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/integrasi
      - password=REDACTED
      - username=simpelv2
  - name: integration-secrets
    behavior: merge
    literals:
      - SIMAN_CLIENT_ID=simanv2.kejagung
      - SIMAN_CLIENT_SECRET=REDACTED
      - SIMAN_BA_KEY=REDACTED
      - MONSAKTI_TOKEN_ADM=REDACTED
      - MONSAKTI_TOKEN_ANG=REDACTED
      - MONSAKTI_TOKEN_AST=REDACTED
      - MONSAKTI_TOKEN_BEN=REDACTED
      - MONSAKTI_TOKEN_GLP=REDACTED
      - MONSAKTI_TOKEN_KOM=REDACTED
      - MONSAKTI_TOKEN_PEM=REDACTED
      - MONSAKTI_TOKEN_PER=REDACTED
      - MYSIMKARI_TOKEN=REDACTED
      - MYSIMKARI_TOKEN_PEGAWAI=REDACTED

# Image tags for staging (use dev/latest tags available in registry)
images:
  - name: localhost:32000/simpelv2/layanan-portal
    newTag: stag
  - name: localhost:32000/simpelv2/layanan-integrasi
    newTag: stag
  - name: localhost:32000/simpelv2/layanan-perlengkapan
    newTag: stag
  - name: localhost:32000/simpelv2/portal
    newTag: stag
  - name: localhost:32000/simpelv2/perlengkapan
    newTag: stag
  - name: localhost:32000/simpelv2/authenc
    newTag: stag
  - name: localhost:32000/simpelv2/secreton
    newTag: stag
  # Standard images - use imagePullPolicy: IfNotPresent in base
  - name: postgres
    newName: postgres
    newTag: 16-alpine
  - name: redis
    newName: redis
    newTag: 7-alpine

generatorOptions:
  disableNameSuffixHash: true
