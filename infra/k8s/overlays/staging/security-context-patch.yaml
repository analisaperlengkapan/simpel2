---
# authenc — Rust backend, needs /tmp for logs/OTP scratch
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authenc
spec:
  template:
    spec:
      serviceAccountName: authenc
      priorityClassName: simpelv2-staging-default
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authenc
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
