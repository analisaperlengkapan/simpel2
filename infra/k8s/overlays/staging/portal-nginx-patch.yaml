# Patch untuk mount custom nginx config ke portal deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: simpelv2-staging
spec:
  template:
    spec:
      containers:
        - name: portal
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: portal-nginx-config
