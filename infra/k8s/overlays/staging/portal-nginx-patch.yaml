# Patch untuk mount custom nginx config dan index.html ke portal deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: simpelv2-staging
spec:
  template:
    spec:
      containers:
        - name: portal
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            # Override index.html dari image dengan versi yang dipatch
            # Fix: loading screen menggunakan TrunkApplicationStarted event
            - name: nginx-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-config
          configMap:
            name: portal-nginx-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
