# Staging Secrets Example
# ⚠️  Copy this file to staging-secrets.yaml and fill in real values.
#     staging-secrets.yaml is gitignored and MUST NOT be committed.
#
# Usage:
#   cp staging-secrets.example.yaml staging-secrets.yaml
#   # Edit staging-secrets.yaml with real credentials
#   kubectl apply -f staging-secrets.yaml -n simpelv2-staging
#
# For production, use Secreton SecretSync CRDs instead (see layanan/secreton/).
#
# ⚠️  WARNING: The secreton standalone deploy (layanan/secreton/deploy/staging/01-secrets.yaml)
#     also creates a Secret named "postgres-credentials" with DIFFERENT keys.
#     Do NOT apply both files — the second kubectl apply will remove keys from the first.
#     See infra/k8s/AGENTS.md "Updating Secrets" for details.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: simpelv2-staging
type: Opaque
stringData:
  url: "postgres://simpelv2:REAL_PASSWORD_HERE@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/simpelv2"
  authenc-url: "postgres://simpelv2:REAL_PASSWORD_HERE@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/authenc"
  secreton-url: "postgres://simpelv2:REAL_PASSWORD_HERE@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/secreton"
  perlengkapan-url: "postgres://simpelv2:REAL_PASSWORD_HERE@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/perlengkapan"
  integrasi-url: "postgres://simpelv2:REAL_PASSWORD_HERE@postgres-0.postgres.simpelv2-staging.svc.cluster.local:5432/integrasi"
  password: "REAL_PASSWORD_HERE"
  username: "simpelv2"
---
apiVersion: v1
kind: Secret
metadata:
  name: integration-secrets
  namespace: simpelv2-staging
type: Opaque
stringData:
  SIMAN_CLIENT_ID: "REAL_CLIENT_ID_HERE"
  SIMAN_CLIENT_SECRET: "REAL_CLIENT_SECRET_HERE"
  SIMAN_BA_KEY: "REAL_BA_KEY_HERE"
  MONSAKTI_TOKEN_ADM: "REAL_TOKEN_HERE"
  MONSAKTI_TOKEN_ANG: "REAL_TOKEN_HERE"
  MONSAKTI_TOKEN_AST: "REAL_TOKEN_HERE"
  MONSAKTI_TOKEN_BEN: "REAL_TOKEN_HERE"
  MONSAKTI_TOKEN_GLP: "REAL_TOKEN_HERE"
  MONSAKTI_TOKEN_KOM: "REAL_TOKEN_HERE"
  MONSAKTI_TOKEN_PEM: "REAL_TOKEN_HERE"
  MONSAKTI_TOKEN_PER: "REAL_TOKEN_HERE"
  MYSIMKARI_TOKEN: "REAL_TOKEN_HERE"
  MYSIMKARI_TOKEN_PEGAWAI: "REAL_TOKEN_HERE"
