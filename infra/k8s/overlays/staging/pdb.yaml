# PodDisruptionBudget for Staging
# Single-replica workloads: minAvailable: 0 (anti-accidental-disruption only;
# maxUnavailable: 1 with a single replica offers zero protection and blocks
# node drain on the one healthy pod).

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: postgres
---
