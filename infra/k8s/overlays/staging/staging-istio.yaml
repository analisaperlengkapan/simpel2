# Staging Istio Routing Configuration
# Routes traffic via IP 10.1.7.121 to simpelv2-staging namespace
# Apply separately: kubectl apply -f infra/k8s/overlays/staging/staging-istio.yaml
#
# Services routed:
#   - portal (frontend) at /portal
#   - perlengkapan (frontend) at /perlengkapan
#   - authenc (identity + captcha) at /api/v1/auth/*, /api/captcha/*
#   - layanan-perlengkapan (backend) at /api/perlengkapan/*
#   - secreton (secrets) at /api/secrets/*
#
# REMOVED: layanan-portal (obsolete - portal calls authenc directly)

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: simpelv2-staging-routes
  namespace: istio-system
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: routing
    app.kubernetes.io/environment: staging
spec:
  hosts:
    - "10.1.7.121"
  gateways:
    - simpelv2-dev-gateway
  http:
    # ============================================
    # Root redirect: / → /portal
    # ============================================
    # route the root path directly to the portal backend rather than issuing
    # a client-side redirect.  this avoids situations where the client may try
    # to connect to the wrong port or encounter a slow 302 that eventually
    # produces ERR_CONNECTION_REFUSED.
    - match:
        - uri:
            exact: /
      rewrite:
        uri: /portal
      route:
        - destination:
            host: portal.simpelv2-staging.svc.cluster.local
            port:
              number: 8080

    # ============================================
    # CAPTCHA Routes → Authenc (direct)
    # ============================================
    - match:
        - uri:
            prefix: /api/captcha/
      route:
        - destination:
            host: authenc.simpelv2-staging.svc.cluster.local
            port:
              number: 8088
      timeout: 30s
      corsPolicy:
        allowOrigins:
          - exact: "http://10.1.7.121"
        allowMethods:
          - POST
          - GET
          - OPTIONS
        allowHeaders:
          - content-type
        maxAge: "86400s"

    - match:
        - uri:
            prefix: /captcha/
      rewrite:
        uri: /api/captcha/
      route:
        - destination:
            host: authenc.simpelv2-staging.svc.cluster.local
            port:
              number: 8088
      timeout: 30s

    - match:
        - uri:
            prefix: /api/auth/captcha/
      rewrite:
        uri: /api/captcha/
      route:
        - destination:
            host: authenc.simpelv2-staging.svc.cluster.local
            port:
              number: 8088
      timeout: 30s

    # ============================================
    # Perlengkapan Frontend at /perlengkapan
    # ============================================
    - match:
        - uri:
            prefix: /perlengkapan
      rewrite:
        uri: /
      route:
        - destination:
            host: perlengkapan.simpelv2-staging.svc.cluster.local
            port:
              number: 8080

    - match:
        - uri:
            prefix: /pembinaan/perlengkapan
      route:
        - destination:
            host: perlengkapan.simpelv2-staging.svc.cluster.local
            port:
              number: 8080

    # ============================================
    # Perlengkapan Backend API
    # Routes /api/perlengkapan/* → layanan-perlengkapan /api/pembinaan/perlengkapan/*
    # Also /api/pembinaan/perlengkapan/* passes through directly
    # ============================================
    - match:
        - uri:
            prefix: /api/perlengkapan/
      rewrite:
        uri: /api/pembinaan/perlengkapan/
      route:
        - destination:
            host: layanan-perlengkapan.simpelv2-staging.svc.cluster.local
            port:
              number: 3020
      timeout: 30s

    - match:
        - uri:
            prefix: /api/pembinaan/perlengkapan
      route:
        - destination:
            host: layanan-perlengkapan.simpelv2-staging.svc.cluster.local
            port:
              number: 3020
      timeout: 30s

    # ============================================
    # Authenc REST API (direct architecture)
    # Portal WASM → authenc REST API
    # ============================================
    - match:
        - uri:
            prefix: /api/v1/auth
      route:
        - destination:
            host: authenc.simpelv2-staging.svc.cluster.local
            port:
              number: 8088
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s

    - match:
        - uri:
            prefix: /api/v1/iam
      route:
        - destination:
            host: authenc.simpelv2-staging.svc.cluster.local
            port:
              number: 8088
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s

    - match:
        - uri:
            prefix: /api/v1/oauth2
      route:
        - destination:
            host: authenc.simpelv2-staging.svc.cluster.local
            port:
              number: 8088
      timeout: 30s

    - match:
        - uri:
            prefix: /api/v1/captcha
      route:
        - destination:
            host: authenc.simpelv2-staging.svc.cluster.local
            port:
              number: 8088
      timeout: 30s

    - match:
        - uri:
            prefix: /api/v1/clients
      route:
        - destination:
            host: authenc.simpelv2-staging.svc.cluster.local
            port:
              number: 8088
      timeout: 30s

    # ============================================
    # Auth Routes → Authenc (replaces layanan-portal)
    # ============================================
    - match:
        - uri:
            prefix: /api/auth
      route:
        - destination:
            host: authenc.simpelv2-staging.svc.cluster.local
            port:
              number: 8088
      timeout: 30s
      corsPolicy:
        allowOrigins:
          - exact: "http://10.1.7.121"
        allowMethods:
          - POST
          - GET
          - OPTIONS
        allowHeaders:
          - content-type
        maxAge: "86400s"

    # ============================================
    # Secreton Secrets API
    # ============================================
    - match:
        - uri:
            prefix: /api/secrets
      rewrite:
        uri: /v1
      route:
        - destination:
            host: secreton.simpelv2-staging.svc.cluster.local
            port:
              number: 8200
      timeout: 30s

    # ============================================
    # Health Check
    # ============================================
    - match:
        - uri:
            exact: /health
      route:
        - destination:
            host: perlengkapan.simpelv2-staging.svc.cluster.local
            port:
              number: 8080

    # ============================================
    # Portal Frontend at /portal
    # Istio strips /portal prefix, nginx serves SPA
    # ============================================
    - match:
        - uri:
            prefix: /portal
      rewrite:
        uri: /
      route:
        - destination:
            host: portal.simpelv2-staging.svc.cluster.local
            port:
              number: 8080

    # ============================================
    # Legacy /daskrimti path → Portal
    # ============================================
    - match:
        - uri:
            prefix: /daskrimti
      rewrite:
        uri: /
      route:
        - destination:
            host: portal.simpelv2-staging.svc.cluster.local
            port:
              number: 8080

    # ============================================
    # Default: Redirect to /portal
    # ============================================
    - redirect:
        uri: /portal
        redirectCode: 302
