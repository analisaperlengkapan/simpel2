# Staging Istio Routing Configuration
# Routes traffic via IP 10.1.7.121 to simpelv2-staging namespace
# Apply separately: kubectl apply -f infra/k8s/overlays/staging/staging-istio.yaml

---
# VirtualService for staging traffic routing
# Routes traffic from 10.1.7.121 to simpelv2-staging namespace services
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: simpelv2-staging-routes
  namespace: istio-system
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: routing
    app.kubernetes.io/environment: staging
spec:
  hosts:
    - "10.1.7.121"
  gateways:
    - simpelv2-dev-gateway
  http:
    # ============================================
    # Legacy CAPTCHA Routes (backwards compatibility)
    # ============================================
    - match:
        - uri:
            prefix: /captcha/
      rewrite:
        uri: /api/captcha/
      route:
        - destination:
            host: layanan-portal.simpelv2-staging.svc.cluster.local
            port:
              number: 3010
      timeout: 30s

    - match:
        - uri:
            prefix: /api/auth/captcha/
      rewrite:
        uri: /api/captcha/
      route:
        - destination:
            host: layanan-portal.simpelv2-staging.svc.cluster.local
            port:
              number: 3010
      timeout: 30s

    - match:
        - uri:
            prefix: /api/captcha/
      route:
        - destination:
            host: layanan-portal.simpelv2-staging.svc.cluster.local
            port:
              number: 3010
      timeout: 30s

    # ============================================
    # Perlengkapan Frontend
    # ============================================
    - match:
        - uri:
            prefix: /perlengkapan
      rewrite:
        uri: /
      route:
        - destination:
            host: perlengkapan.simpelv2-staging.svc.cluster.local
            port:
              number: 8080

    - match:
        - uri:
            prefix: /pembinaan/perlengkapan
      route:
        - destination:
            host: perlengkapan.simpelv2-staging.svc.cluster.local
            port:
              number: 8080

    # ============================================
    # Backend API Routes
    # ============================================
    - match:
        - uri:
            prefix: /api/portal
      rewrite:
        uri: /api
      route:
        - destination:
            host: layanan-portal.simpelv2-staging.svc.cluster.local
            port:
              number: 3010
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s

    - match:
        - uri:
            prefix: /api/perlengkapan
      rewrite:
        uri: /api
      route:
        - destination:
            host: layanan-perlengkapan.simpelv2-staging.svc.cluster.local
            port:
              number: 3020
      timeout: 30s

    # ============================================
    # Authentication Routes (via layanan-portal)
    # Frontend → layanan-portal → authenc (gRPC)
    # ============================================
    - match:
        - uri:
            prefix: /api/auth
      route:
        - destination:
            host: layanan-portal.simpelv2-staging.svc.cluster.local
            port:
              number: 3010
      timeout: 30s

    - match:
        - uri:
            prefix: /api/secrets
      rewrite:
        uri: /v1
      route:
        - destination:
            host: secreton.simpelv2-staging.svc.cluster.local
            port:
              number: 8200
      timeout: 30s

    # ============================================
    # Health Check
    # ============================================
    - match:
        - uri:
            exact: /health
      route:
        - destination:
            host: perlengkapan.simpelv2-staging.svc.cluster.local
            port:
              number: 8080

    # ============================================
    # Portal (Legacy /daskrimti path)
    # ============================================
    - match:
        - uri:
            prefix: /daskrimti
      route:
        - destination:
            host: portal.simpelv2-staging.svc.cluster.local
            port:
              number: 8080

    # ============================================
    # Default: Route to Portal (Main Landing)
    # All unmatched routes go to main portal including WASM assets
    # ============================================
    - route:
        - destination:
            host: portal.simpelv2-staging.svc.cluster.local
            port:
              number: 8080
