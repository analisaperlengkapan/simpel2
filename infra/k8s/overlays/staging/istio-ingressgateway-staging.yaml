# Staging Istio Ingress Gateway Service
# This creates a service accessible via WAN IP 10.1.7.121
# The upstream router/firewall forwards WAN traffic to one of the cluster nodes.
# externalIPs tells kube-proxy to create iptables rules to accept traffic
# destined for 10.1.7.121 and forward it to the ingress gateway pods.

apiVersion: v1
kind: Service
metadata:
  name: istio-ingressgateway-staging
  namespace: istio-system
  labels:
    app: istio-ingressgateway
    istio: ingressgateway
    environment: staging
  annotations:
    description: "Staging service for SIMPelv2, accessible via WAN IP 10.1.7.121"
spec:
  type: ClusterIP
  externalIPs:
    - 10.1.7.121
  selector:
    app: istio-ingressgateway
    istio: ingressgateway
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 8080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8443
    - name: tcp
      port: 31400
      protocol: TCP
      targetPort: 31400
    - name: tls
      port: 15443
      protocol: TCP
      targetPort: 15443

