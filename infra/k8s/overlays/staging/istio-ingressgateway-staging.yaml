# Staging Istio Ingress Gateway LoadBalancer Service
# This creates a separate LoadBalancer with IP 10.1.7.121 for staging environment
# Shares the same istio-ingressgateway pods as production

apiVersion: v1
kind: Service
metadata:
  name: istio-ingressgateway-staging
  namespace: istio-system
  labels:
    app: istio-ingressgateway
    istio: ingressgateway
    environment: staging
  annotations:
    description: "Staging LoadBalancer for SIMPelv2 at 10.1.7.121"
spec:
  type: LoadBalancer
  loadBalancerIP: 10.1.7.121  # Request specific IP from MetalLB staging pool
  selector:
    app: istio-ingressgateway
    istio: ingressgateway
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 8080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8443
    - name: tcp
      port: 31400
      protocol: TCP
      targetPort: 31400
    - name: tls
      port: 15443
      protocol: TCP
      targetPort: 15443
  externalTrafficPolicy: Cluster
