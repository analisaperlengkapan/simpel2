---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: simpelv2-secreton
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: secreton
    app.kubernetes.io/component: monitoring
