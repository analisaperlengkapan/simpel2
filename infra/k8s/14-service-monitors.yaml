---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: simpelv2-authenc
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: authenc
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authenc
  namespaceSelector:
    matchNames:
    - simpelv2-infra
  endpoints:
  - port: http
    path: /metrics
