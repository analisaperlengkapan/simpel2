# SIMPelv2 ServiceMonitor Resources
# Prometheus service discovery for monitoring all services

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: simpelv2-infrastructure
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: simpelv2
  namespaceSelector:
    matchNames:
    - simpelv2-infra
  endpoints:
  - ptp
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
  - port: postgres
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
  - port: redis
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: simpelv2-backend-services
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: simpelv2
  namespaceSelector:
    matchNames:
    - simpelv2-backend
