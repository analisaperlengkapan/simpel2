---
# Kubernetes system monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubernetes-apiservers
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: kubernetes
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      component: apiserver
      provider: kubernetes
  namespaceSelector:
    matchNames:
    - default
  endpoints:
  - port: https
    interval: 30s
    scheme: https
    tlsConfig:
      caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubernetes-nodes
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: kubernetes
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  endpoints:
  - port: metrics
    interval: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubernetes-pods
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: kubernetes
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchExpressions:
    - key: prometheus.io/scrape
      operator: In
      values: ["true"]
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

---
# Monitoring stack self-monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-self
  namespace: simpelv2-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  endpoints:
  - port: web
    path: /metrics
    interval: 30s

