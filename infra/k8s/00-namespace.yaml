# SIMPelv2 Kubernetes Namespaces
# Simplified 2-namespace architecture:
# - simpelv2-infra: Critical infrastructure (authenc, secreton, postgres, redis)
# - simpelv2: All applications (frontend + backend)

apiVersion: v1
kind: Namespace
metadata:
  name: simpelv2
  labels:
    name: simpelv2
    istio-injection: enabled
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: applications
---
apiVersion: v1
kind: Namespace
metadata:
  name: simpelv2-infra
  labels:
    name: simpelv2-infra
    istio-injection: enabled
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: infrastructure
---
# Optional: Monitoring namespace (only if separate monitoring is needed)
apiVersion: v1
kind: Namespace
metadata:
  name: simpelv2-monitoring
  labels:
    name: simpelv2-monitoring
    istio-injection: enabled
    app.kubernetes.io/name: simpelv2
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: monitoring
