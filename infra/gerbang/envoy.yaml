static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: 
                            cluster: gerbang
                            timeout: 30s
                            retry_policy:
                              retry_on: connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes
                              num_retries: 3
                              per_try_timeout: 5s
                          cors:
                            allow_origin_string_match:
                              - prefix: "*"
                            allow_methods: GET, POST, PUT, DELETE, OPTIONS
                            allow_headers: "*"
                            expose_headers: "*"
                            max_age: "86400"

                        - match: { prefix: "/api/src" }
                          route: 
                            cluster: src
                            timeout: 30s
                            retry_policy:
                              retry_on: connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes
                              num_retries: 3
                              per_try_timeout: 5s

                        - match: { prefix: "/api/db" }
                          route: 
                            cluster: db
                            timeout: 30s
                            retry_policy:
                              retry_on: connect-failure,refused-stream,unavailable,cancelled,retriable-status-codes
                              num_retries: 3
                              per_try_timeout: 5s

                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        function envoy_on_response(response_handle)
                          response_handle:headers():add("Content-Security-Policy", "default-src 'self'")
                          response_handle:headers():add("Strict-Transport-Security", "max-age=63072000; includeSubDomains; preload")
                          response_handle:headers():add("X-Frame-Options", "DENY")
                          response_handle:headers():add("X-Content-Type-Options", "nosniff")
                          response_handle:headers():add("Referrer-Policy", "no-referrer")
                          response_handle:headers():add("Permissions-Policy", "geolocation=(), microphone=()")
                        end
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: gerbang
    connect_timeout: 30s
    type: strict_dns
    circuit_breakers:
      thresholds:
        - priority: DEFAULT
          max_requests: 1000
          max_retries: 3
    load_assignment:
      cluster_name: gerbang
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: gerbang, port_value: 8080 }


  - name: src
    connect_timeout: 30s
    type: strict_dns
    circuit_breakers:
      thresholds:
        - priority: DEFAULT
          max_requests: 500
          max_retries: 2
    load_assignment:
      cluster_name: src
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: src, port_value: 7000 }


  - name: db
    connect_timeout: 30s
    type: strict_dns
    circuit_breakers:
      thresholds:
        - priority: DEFAULT
          max_requests: 500
          max_retries: 2
    load_assignment:
      cluster_name: db
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: db, port_value: 8080 }

admin:
  access_log_path: "/tmp/admin_access.log"
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }