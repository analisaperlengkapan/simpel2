# Browser caching configuration for SIMPelv2
# Optimizes asset loading with appropriate cache headers

# WASM files - immutable with long cache
location ~* \.wasm$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";

    # WASM mime type
    types {
        application/wasm wasm;
    }

    # Enable gzip compression
    gzip on;
    gzip_types application/wasm;
    gzip_vary on;
}

# JavaScript files - immutable with long cache (assuming hash in filename)
location ~* \.(js|mjs)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";

    # Enable gzip compression
    gzip on;
    gzip_types application/javascript text/javascript;
    gzip_vary on;
}

# CSS files - immutable with long cache (assuming hash in filename)
location ~* \.css$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";

    # Enable gzip compression
    gzip on;
    gzip_types text/css;
    gzip_vary on;
}

# Font files - long cache
location ~* \.(woff2|woff|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*";

    # Enable gzip compression
    gzip on;
    gzip_types font/woff2 font/woff font/ttf font/otf application/vnd.ms-fontobject;
    gzip_vary on;
}

# Image files - medium cache
location ~* \.(jpg|jpeg|png|gif|svg|webp|avif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff";

    # Enable gzip compression for SVG
    gzip on;
    gzip_types image/svg+xml;
    gzip_vary on;
}

# HTML files - no cache, always revalidate
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header X-Content-Type-Options "nosniff";

    # Enable gzip compression
    gzip on;
    gzip_types text/html;
    gzip_vary on;
}

# JSON files - short cache
location ~* \.json$ {
    expires 5m;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff";

    # Enable gzip compression
    gzip on;
    gzip_types application/json;
    gzip_vary on;
}

# Service Worker - no cache
location ~* service-worker\.js$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
}

# Manifest files - short cache
location ~* manifest\.json$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
}

# API endpoints - no cache by default
location /api/ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
    add_header Pragma "no-cache";

    # Proxy to backend
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Disable buffering for real-time responses
    proxy_buffering off;
}

# Enable gzip compression globally
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/rss+xml
    application/atom+xml
    image/svg+xml
    application/wasm
    font/woff2
    font/woff;

# Brotli compression (if module available)
# brotli on;
# brotli_comp_level 6;
# brotli_types
#     text/plain
#     text/css
#     text/xml
#     text/javascript
#     application/json
#     application/javascript
#     application/xml+rss
#     application/rss+xml
#     application/atom+xml
#     image/svg+xml
#     application/wasm
#     font/woff2
#     font/woff;

# ETag support
etag on;

# Disable access log for static assets (performance)
location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|css|js|wasm|woff2|woff|ttf|otf)$ {
    access_log off;
    log_not_found off;
}
