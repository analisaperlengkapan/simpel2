# Security Headers Configuration for SIMPEL
# This file contains security headers that should be applied to all responses

# Content Security Policy (CSP)
# Restricts sources from which content can be loaded
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.simpelv2.kejaksaan.go.id https://auth.simpelv2.kejaksaan.go.id; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content;" always;

# Strict Transport Security (HSTS)
# Forces HTTPS connections for 2 years, including subdomains
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# X-Frame-Options
# Prevents clickjacking attacks by disallowing the page to be framed
add_header X-Frame-Options "DENY" always;

# X-Content-Type-Options
# Prevents MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# X-XSS-Protection
# Enables browser's XSS filter (legacy, but still useful for older browsers)
add_header X-XSS-Protection "1; mode=block" always;

# Referrer-Policy
# Controls how much referrer information is sent
add_header Referrer-Policy "no-referrer-when-downgrade" always;

# Permissions-Policy (formerly Feature-Policy)
# Controls which browser features can be used
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# X-Permitted-Cross-Domain-Policies
# Restricts Adobe Flash and PDF cross-domain requests
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Cross-Origin-Embedder-Policy
# Prevents documents from loading cross-origin resources that don't explicitly grant permission
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# Cross-Origin-Opener-Policy
# Isolates browsing context from cross-origin windows
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Cross-Origin-Resource-Policy
# Prevents other origins from reading the response
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Remove server version information
server_tokens off;

# Additional security headers for API endpoints
location /api/ {
    # CSP for API (more restrictive)
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    # CORS headers (if needed, configure based on your requirements)
    # add_header Access-Control-Allow-Origin "https://simpelv2.kejaksaan.go.id" always;
    # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    # add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-CSRF-Token" always;
    # add_header Access-Control-Allow-Credentials "true" always;
    # add_header Access-Control-Max-Age "86400" always;
}
