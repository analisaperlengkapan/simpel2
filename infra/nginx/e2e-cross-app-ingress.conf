# Single-origin reverse proxy for the cross-app SSO e2e (F-GW PR-E).
#
# In PRODUCTION the Istio VirtualService serves BOTH frontends under ONE host
# (simpel.kejaksaan.go.id): `/portal` → portal, `/perlengkapan` → perlengkapan,
# `/api/*` → the backends (see infra/helm/simpel/values.yaml virtualService.*).
# That single origin is what makes SSO work: portal writes the JWT to
# `localStorage["auth_token"]` and redirects to `/perlengkapan/…`, which reads
# the SAME-ORIGIN token (perlengkapan derives its whole session by decoding that
# JWT — see antarmuka/perlengkapan/src/features/auth.rs).
#
# The compose e2e stack otherwise exposes the two FEs as SEPARATE origins, where
# localStorage is NOT shared, so the handoff can't work. This ingress mirrors the
# prod VirtualService on ONE origin so the cross-app SSO flow is faithfully
# exercised in CI. Routing order = most specific first (matches the VS order).

pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Docker DNS resolver so upstream names re-resolve at request time (the FEs
    # / backends may still be starting) rather than failing nginx at startup.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Variable upstreams so the literal name is re-resolved per request.
    map $host $authenc_up  { default "authenc:8088"; }
    map $host $perl_api_up { default "layanan-perlengkapan:3020"; }
    map $host $portal_up   { default "portal:8080"; }
    map $host $perl_fe_up  { default "perlengkapan:8080"; }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        # ── Backends (authenc REST + perlengkapan API) ──────────────────────
        # NOTE: no URI after the variable upstream — nginx then forwards the
        # ORIGINAL request URI + query verbatim (a URI would drop the path; see
        # the FE nginx proxy_pass footgun fixed earlier). authenc serves
        # /api/v1/auth/* + /api/captcha/*; perlengkapan-BE serves
        # /api/v1/perlengkapan/*.
        location /api/captcha/ {
            set $u $authenc_up;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/auth/ {
            set $u $authenc_up;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/iam/ {
            set $u $authenc_up;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/perlengkapan/ {
            set $u $perl_api_up;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── Frontends (serve the WASM bundles) ──────────────────────────────
        # Forward the full path to each FE's own nginx, which serves its SPA +
        # hashed assets under its public-url prefix.
        location /portal/ {
            set $u $portal_up;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /perlengkapan/ {
            set $u $perl_fe_up;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Bare root → portal landing (mirrors the VS defaultRedirect /portal).
        location = / {
            return 302 /portal/;
        }

        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
