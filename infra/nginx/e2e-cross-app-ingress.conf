# Single-origin reverse proxy for the cross-app SSO e2e (F-GW PR-E).
#
# In PRODUCTION the Istio VirtualService serves BOTH frontends under ONE host
# (simpel.kejaksaan.go.id): `/portal` → portal, `/perlengkapan` → perlengkapan,
# `/api/*` → the backends (see infra/helm/simpel/values.yaml virtualService.*).
# That single origin is what makes SSO work: portal writes the JWT to
# `localStorage["auth_token"]` and redirects to `/perlengkapan/…`, which reads
# the SAME-ORIGIN token (perlengkapan derives its whole session by decoding that
# JWT — see antarmuka/perlengkapan/src/features/auth.rs).
#
# The compose e2e stack otherwise exposes the two FEs as SEPARATE origins, where
# localStorage is NOT shared, so the handoff can't work. This ingress mirrors the
# prod VirtualService on ONE origin so the cross-app SSO flow is faithfully
# exercised in CI. Routing order = most specific first (matches the VS order).

pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Docker DNS resolver so upstream names re-resolve at request time (the FEs
    # / backends may still be starting) rather than failing nginx at startup.
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Variable upstreams so the literal name is re-resolved per request.
    map $host $authenc_up  { default "authenc:8088"; }
    map $host $perl_api_up { default "layanan-perlengkapan:3020"; }
    map $host $portal_up   { default "portal:8080"; }
    map $host $perl_fe_up  { default "perlengkapan:8080"; }
    map $host $simpelv1_up { default "simpelv1:8080"; }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        # ── Backends (authenc REST + perlengkapan API) ──────────────────────
        # NOTE: no URI after the variable upstream — nginx then forwards the
        # ORIGINAL request URI + query verbatim (a URI would drop the path; see
        # the FE nginx proxy_pass footgun fixed earlier). authenc serves
        # /api/v1/auth/* + /api/captcha/*; perlengkapan-BE serves
        # /api/v1/perlengkapan/*.
        location /api/captcha/ {
            set $u $authenc_up;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/auth/ {
            set $u $authenc_up;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/iam/ {
            set $u $authenc_up;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/perlengkapan/ {
            set $u $perl_api_up;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── SIMPEL v1 (legacy Laravel) ──────────────────────────────────────
        # Mirrors the prod VirtualService `prefix: /perlengkapan/simpel/v1 →
        # rewrite: / → simpelv1:80`. The rewrite is what makes v1's own route
        # table (`/auth/oauth-callback`, `/dashboard`) line up with the public
        # prefix, and it is also what `URL::forceRootUrl` uses to regenerate
        # absolute URLs — so it must match `simpelv1.appUrl` in values*.yaml.
        # Placed before the generic `/perlengkapan/` block: nginx picks the
        # longest matching prefix, but keeping the order parallel to the VS
        # makes the two files diffable.
        location /perlengkapan/simpel/v1/ {
            set $u $simpelv1_up;
            # Strip the public prefix before PHP sees the request — v1's route
            # table is unprefixed (`/dashboard`, `/auth/oauth-callback`), so
            # forwarding the full path makes every request 404. This mirrors the
            # prod VirtualService's `rewrite: /`.
            #
            # `rewrite … break` + a variable `proxy_pass` (no URI of its own):
            # when proxy_pass contains a variable nginx forwards the URI as-is,
            # so the rewrite is what actually removes the prefix. A literal
            # `proxy_pass http://$u/;` would instead collapse the path to `/`,
            # because a URI on the proxy_pass directive REPLACES the request URI
            # rather than appending to it.
            rewrite ^/perlengkapan/simpel/v1/(.*)$ /$1 break;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            # $http_host, not $host: nginx's $host drops a non-default port, and
            # v1 rebuilds its absolute redirect URLs (URL::forceRootUrl in
            # AppServiceProvider) from the request host — dropping the port made
            # every bounce point at :80, where nothing listens.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
        # Bare prefix without the trailing slash (e.g. the apps-page link) →
        # same place, with the slash, so the SPA/route table sees a normal path.
        location = /perlengkapan/simpel/v1 {
            return 302 /perlengkapan/simpel/v1/;
        }

        # ── Frontends (serve the WASM bundles) ──────────────────────────────
        # Forward the full path to each FE's own nginx, which serves its SPA +
        # hashed assets under its public-url prefix.
        location /portal/ {
            set $u $portal_up;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /perlengkapan/ {
            set $u $perl_fe_up;
            proxy_pass http://$u;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Bare root → portal landing (mirrors the VS defaultRedirect /portal).
        location = / {
            return 302 /portal/;
        }

        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
