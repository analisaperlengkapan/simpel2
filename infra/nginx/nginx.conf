events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  text/html;

    # Performance
    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json application/wasm;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        # Files live in /usr/share/nginx/html/perlengkapan/
        # so requests to /perlengkapan/foo.wasm resolve naturally via root
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Redirect root to /perlengkapan/
        location = / {
            return 301 /perlengkapan/;
        }

        # Redirect /perlengkapan (no trailing slash) to /perlengkapan/
        location = /perlengkapan {
            return 301 /perlengkapan/;
        }

        # SPA routing for /perlengkapan/ prefix
        # Assets resolve via root: /perlengkapan/foo.wasm → /usr/share/nginx/html/perlengkapan/foo.wasm
        location /perlengkapan/ {
            try_files $uri $uri/ /perlengkapan/index.html;
        }

        # Static assets caching (works with root directive)
        location ~* \.(wasm|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # Health Check
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            return 200 "healthy\n";
        }
    }
}
