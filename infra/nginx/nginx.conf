events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    upstream badiklat {
        server badiklat:3000;
    }

    upstream datun {
        server datun:3000;
    }

    upstream intel {
        server intel:3000;
    }

    upstream pembinaan {
        server pembinaan:3000;
    }

    upstream pemulihan-aset {
        server pemulihan-aset:3000;
    }

    upstream pengawasan {
        server pengawasan:3000;
    }

    upstream pidmil {
        server pidmil:3000;
    }

    upstream pidsus {
        server pidsus:3000;
    }

    upstream layanan-pidsus {
        server layanan-pidsus:3000;
    }

    upstream pidum {
        server pidum:3000;
    }

    upstream portal {
        server portal:3000;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;

    server {
        listen 80;
        server_name _;

        # Include security headers configuration
        include /etc/nginx/conf.d/security-headers.conf;

        # Remove server version
        server_tokens off;

        # Badiklat
        location /badiklat {
            proxy_pass http://badiklat/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Datun
        location /datun {
            proxy_pass http://datun/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Intel
        location /intel {
            proxy_pass http://intel/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Pembinaan
        location /pembinaan {
            root /usr/share/nginx/html/dist;
            try_files $uri $uri/ /index.html;
        }

        # Pemulihan-Aset
        location /pemulihan-aset {
            proxy_pass http://pemulihan-aset/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Pengawasan
        location /pengawasan {
            proxy_pass http://pengawasan/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Pidmil
        location /pidmil {
            proxy_pass http://pidmil/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Pidsus
        location /pidsus {
            proxy_pass http://pidsus/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Pidsus API
        location /pidsus/api/ {
            proxy_pass http://layanan-pidsus/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Pidum
        location /pidum {
            proxy_pass http://pidum/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Portal
        location /portal {
            proxy_pass http://portal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default route - redirect to portal
        location / {
            return 301 /portal;
        }

        # Health check endpoint
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
