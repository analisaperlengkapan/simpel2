syntax = "proto3";

package secreton.v1;

import "common.proto";

// Secreton Vault Service - Secret Management
service SecretonService {
  // Secret Operations
  rpc StoreSecret(StoreSecretRequest) returns (StoreSecretResponse);
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // Transit Engine - Encryption as a Service
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse);
  rpc Encrypt(EncryptRequest) returns (EncryptResponse);
  rpc Decrypt(DecryptRequest) returns (DecryptResponse);
  rpc Sign(SignRequest) returns (SignResponse);
  rpc Verify(VerifyRequest) returns (VerifyResponse);
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse);

  // Raft Cluster Management
  rpc GetClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);
  rpc AddNode(AddNodeRequest) returns (AddNodeResponse);
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);

  // Snapshot Management
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse);

  // Namespace Management
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse);
  rpc GetNamespace(GetNamespaceRequest) returns (GetNamespaceResponse);
  rpc UpdateNamespace(UpdateNamespaceRequest) returns (UpdateNamespaceResponse);
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);
  rpc GetNamespaceStats(GetNamespaceStatsRequest) returns (GetNamespaceStatsResponse);

  // Dynamic Secrets - Database Credentials
  rpc GenerateDatabaseCredentials(GenerateDatabaseCredentialsRequest) returns (GenerateDatabaseCredentialsResponse);
  rpc CreateDatabaseRole(CreateDatabaseRoleRequest) returns (CreateDatabaseRoleResponse);
  rpc GetDatabaseRole(GetDatabaseRoleRequest) returns (GetDatabaseRoleResponse);
  rpc ListDatabaseRoles(ListDatabaseRolesRequest) returns (ListDatabaseRolesResponse);
  rpc UpdateDatabaseRole(UpdateDatabaseRoleRequest) returns (UpdateDatabaseRoleResponse);
  rpc DeleteDatabaseRole(DeleteDatabaseRoleRequest) returns (DeleteDatabaseRoleResponse);
  rpc ConfigureDatabaseConnection(ConfigureDatabaseConnectionRequest) returns (ConfigureDatabaseConnectionResponse);

  // Lease Management
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
  rpc RevokeLease(RevokeLeaseRequest) returns (RevokeLeaseResponse);
  rpc RevokeLeasePrefix(RevokeLeasePrefixRequest) returns (RevokeLeasePrefixResponse);
  rpc LookupLease(LookupLeaseRequest) returns (LookupLeaseResponse);
  rpc ListLeases(ListLeasesRequest) returns (ListLeasesResponse);
  rpc GetLeaseStats(GetLeaseStatsRequest) returns (GetLeaseStatsResponse);

  // Policy Management
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse);
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc TestPolicy(TestPolicyRequest) returns (TestPolicyResponse);

  // Response Wrapping
  rpc WrapData(WrapDataRequest) returns (WrapDataResponse);
  rpc UnwrapToken(UnwrapTokenRequest) returns (UnwrapTokenResponse);
  rpc LookupWrappingToken(LookupWrappingTokenRequest) returns (LookupWrappingTokenResponse);
  rpc RewrapToken(RewrapTokenRequest) returns (RewrapTokenResponse);

  // Health & Metrics
  rpc HealthCheck(common.v1.HealthCheckRequest) returns (common.v1.HealthCheckResponse);
  rpc GetMetrics(MetricsRequest) returns (MetricsResponse);
}

// Secret Management Messages
message StoreSecretRequest {
  string path = 1;
  map<string, string> data = 2;
  SecurityLevel security_level = 3;
  repeated string tags = 4;
  optional int64 ttl_seconds = 5;
}

message StoreSecretResponse {
  string id = 1;
  uint32 version = 2;
  int64 created_at = 3;
}

message GetSecretRequest {
  string path = 1;
  optional uint32 version = 2;
}

message GetSecretResponse {
  string id = 1;
  string path = 2;
  map<string, string> data = 3;
  uint32 version = 4;
  SecurityLevel security_level = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message DeleteSecretRequest {
  string path = 1;
}

message DeleteSecretResponse {
  bool success = 1;
}

message ListSecretsRequest {
  optional string prefix = 1;
  optional int32 limit = 2;
  optional int32 offset = 3;
}

message ListSecretsResponse {
  repeated SecretMetadata secrets = 1;
  int32 total = 2;
}

message SecretMetadata {
  string id = 1;
  string path = 2;
  uint32 version = 3;
  SecurityLevel security_level = 4;
  int64 created_at = 5;
}

// Transit Engine Messages
message CreateKeyRequest {
  string name = 1;
  KeyType key_type = 2;
}

message CreateKeyResponse {
  string name = 1;
  KeyType key_type = 2;
  int64 created_at = 3;
}

message EncryptRequest {
  string key_name = 1;
  bytes plaintext = 2;
  optional bytes context = 3;
}

message EncryptResponse {
  string ciphertext = 1;
  uint32 key_version = 2;
}

message DecryptRequest {
  string key_name = 1;
  string ciphertext = 2;
  optional bytes context = 3;
}

message DecryptResponse {
  bytes plaintext = 1;
}

message SignRequest {
  string key_name = 1;
  bytes data = 2;
  SignatureAlgorithm algorithm = 3;
}

message SignResponse {
  string signature = 1;
  uint32 key_version = 2;
}

message VerifyRequest {
  string key_name = 1;
  bytes data = 2;
  string signature = 3;
  SignatureAlgorithm algorithm = 4;
}

message VerifyResponse {
  bool valid = 1;
}

message RotateKeyRequest {
  string key_name = 1;
}

message RotateKeyResponse {
  uint32 new_version = 1;
  int64 rotated_at = 2;
}

// Raft Cluster Messages
message ClusterStatusRequest {}

message ClusterStatusResponse {
  uint64 node_id = 1;
  string state = 2;
  uint64 leader_id = 3;
  uint64 term = 4;
  uint64 commit_index = 5;
  repeated NodeInfo nodes = 6;
}

message NodeInfo {
  uint64 node_id = 1;
  string address = 2;
  string state = 3;
}

message ListPeersRequest {}

message ListPeersResponse {
  repeated PeerInfo peers = 1;
  int32 total = 2;
}

message PeerInfo {
  uint64 node_id = 1;
  string address = 2;
  string state = 3;
  string health = 4;
  optional uint64 replication_lag = 5;
  optional int64 last_heartbeat = 6;
}

message AddNodeRequest {
  uint64 node_id = 1;
  string address = 2;
}

message AddNodeResponse {
  bool success = 1;
  string message = 2;
}

message RemoveNodeRequest {
  uint64 node_id = 1;
}

message RemoveNodeResponse {
  bool success = 1;
  string message = 2;
}

// Snapshot Management Messages
message CreateSnapshotRequest {}

message CreateSnapshotResponse {
  string snapshot_id = 1;
  uint64 size_bytes = 2;
  uint64 compressed_size_bytes = 3;
  string checksum = 4;
  int64 created_at = 5;
}

message ListSnapshotsRequest {}

message ListSnapshotsResponse {
  repeated SnapshotInfo snapshots = 1;
  int32 total = 2;
}

message SnapshotInfo {
  string snapshot_id = 1;
  int64 created_at = 2;
  uint64 size_bytes = 3;
  uint64 compressed_size_bytes = 4;
  uint64 last_included_index = 5;
  uint64 last_included_term = 6;
  string checksum = 7;
  bool encrypted = 8;
  optional string signature = 9;
}

message RestoreSnapshotRequest {
  string snapshot_id = 1;
}

message RestoreSnapshotResponse {
  bool success = 1;
  string message = 2;
  SnapshotInfo snapshot = 3;
}

// Namespace Management Messages
message ListNamespacesRequest {
  optional NamespaceType namespace_type = 1;
  optional string parent = 2;
  optional bool is_active = 3;
  optional string search = 4;
  optional int32 limit = 5;
  optional int32 offset = 6;
}

message ListNamespacesResponse {
  repeated NamespaceInfo namespaces = 1;
  int64 total = 2;
}

message CreateNamespaceRequest {
  string id = 1;
  string name = 2;
  optional string parent = 3;
  NamespaceType namespace_type = 4;
  repeated string policies = 5;
  optional NamespaceQuotas quotas = 6;
  map<string, string> metadata = 7;
}

message CreateNamespaceResponse {
  NamespaceInfo namespace = 1;
}

message GetNamespaceRequest {
  string id = 1;
}

message GetNamespaceResponse {
  NamespaceInfo namespace = 1;
}

message UpdateNamespaceRequest {
  string id = 1;
  optional string name = 2;
  repeated string policies = 3;
  optional NamespaceQuotas quotas = 4;
  map<string, string> metadata = 5;
  optional bool is_active = 6;
}

message UpdateNamespaceResponse {
  NamespaceInfo namespace = 1;
}

message DeleteNamespaceRequest {
  string id = 1;
}

message DeleteNamespaceResponse {
  bool success = 1;
}

message GetNamespaceStatsRequest {
  string id = 1;
}

message GetNamespaceStatsResponse {
  string namespace_id = 1;
  QuotaUsage quota_usage = 2;
  NamespaceQuotas quota_limits = 3;
  double usage_percentage = 4;
  bool is_quota_exceeded = 5;
  int32 children_count = 6;
  int32 total_descendants = 7;
  int64 active_leases = 8;
  int32 active_policies = 9;
}

message NamespaceInfo {
  string id = 1;
  string path = 2;
  optional string parent = 3;
  string name = 4;
  NamespaceType namespace_type = 5;
  repeated string policies = 6;
  NamespaceQuotas quotas = 7;
  map<string, string> metadata = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  string created_by = 11;
  bool is_active = 12;
  int32 children_count = 13;
  repeated string ancestors = 14;
}

message NamespaceQuotas {
  optional int64 max_secrets = 1;
  optional int64 max_storage_bytes = 2;
  optional int64 max_leases = 3;
  optional int64 max_policies = 4;
  QuotaUsage current_usage = 5;
}

message QuotaUsage {
  int64 secrets_count = 1;
  int64 storage_bytes = 2;
  int64 leases_count = 3;
  int64 policies_count = 4;
}

// Metrics
message MetricsRequest {}

message MetricsResponse {
  int64 total_secrets = 1;
  int64 total_keys = 2;
  int64 operations_count = 3;
  double avg_response_time_ms = 4;
  map<string, int64> operation_counts = 5;
}

// Enums
enum SecurityLevel {
  SECURITY_LEVEL_UNSPECIFIED = 0;
  PUBLIC = 1;
  INTERNAL = 2;
  CONFIDENTIAL = 3;
  SECRET = 4;
  TOP_SECRET = 5;
}

enum KeyType {
  KEY_TYPE_UNSPECIFIED = 0;
  AES256_GCM = 1;
  CHACHA20_POLY1305 = 2;
  ED25519 = 3;
  ECDSA_P256 = 4;
  RSA_2048 = 5;
  RSA_4096 = 6;
}

enum SignatureAlgorithm {
  SIGNATURE_ALGORITHM_UNSPECIFIED = 0;
  ED25519_SIGNATURE = 1;
  ECDSA_P256_SHA256 = 2;
  RSA_PSS_SHA256 = 3;
}

enum NamespaceType {
  NAMESPACE_TYPE_UNSPECIFIED = 0;
  PUSAT = 1;
  WILAYAH = 2;
  SATKER = 3;
}

// Dynamic Secrets Messages
message GenerateDatabaseCredentialsRequest {
  string role_name = 1;
  optional uint32 ttl_seconds = 2;
}

message GenerateDatabaseCredentialsResponse {
  string lease_id = 1;
  int64 lease_duration = 2;
  bool renewable = 3;
  DatabaseCredentials credentials = 4;
}

message DatabaseCredentials {
  string username = 1;
  string password = 2;
  optional string connection_url = 3;
  string database = 4;
  string role = 5;
}

message CreateDatabaseRoleRequest {
  string role_name = 1;
  string db_name = 2;
  uint32 default_ttl = 3;
  uint32 max_ttl = 4;
  repeated string creation_statements = 5;
  repeated string revocation_statements = 6;
  repeated string rotation_statements = 7;
  repeated string renew_statements = 8;
}

message CreateDatabaseRoleResponse {
  string name = 1;
  string db_name = 2;
  uint32 default_ttl = 3;
  uint32 max_ttl = 4;
}

message GetDatabaseRoleRequest {
  string role_name = 1;
}

message GetDatabaseRoleResponse {
  DatabaseRoleInfo role = 1;
}

message ListDatabaseRolesRequest {
  optional int32 limit = 1;
  optional int32 offset = 2;
}

message ListDatabaseRolesResponse {
  repeated string role_names = 1;
  int32 total = 2;
}

message UpdateDatabaseRoleRequest {
  string role_name = 1;
  string db_name = 2;
  uint32 default_ttl = 3;
  uint32 max_ttl = 4;
  repeated string creation_statements = 5;
  repeated string revocation_statements = 6;
  repeated string rotation_statements = 7;
  repeated string renew_statements = 8;
}

message UpdateDatabaseRoleResponse {
  string name = 1;
  string db_name = 2;
  uint32 default_ttl = 3;
  uint32 max_ttl = 4;
}

message DeleteDatabaseRoleRequest {
  string role_name = 1;
}

message DeleteDatabaseRoleResponse {
  bool success = 1;
  string message = 2;
}

message ConfigureDatabaseConnectionRequest {
  string name = 1;
  DatabaseType db_type = 2;
  string connection_url = 3;
  uint32 max_open_connections = 4;
  uint32 max_idle_connections = 5;
  uint32 max_connection_lifetime = 6;
  bool verify_connection = 7;
  repeated string root_rotation_statements = 8;
}

message ConfigureDatabaseConnectionResponse {
  string name = 1;
  DatabaseType db_type = 2;
  bool verified = 3;
}

message DatabaseRoleInfo {
  string name = 1;
  string db_name = 2;
  uint32 default_ttl = 3;
  uint32 max_ttl = 4;
  repeated string creation_statements = 5;
  repeated string revocation_statements = 6;
  repeated string rotation_statements = 7;
  repeated string renew_statements = 8;
}

enum DatabaseType {
  DATABASE_TYPE_UNSPECIFIED = 0;
  POSTGRESQL = 1;
  MYSQL = 2;
  MONGODB = 3;
  REDIS = 4;
  CASSANDRA = 5;
  MSSQL = 6;
}

// Lease Management Messages
message RenewLeaseRequest {
  string lease_id = 1;
  optional int64 increment = 2;
}

message RenewLeaseResponse {
  string lease_id = 1;
  int64 expired_at = 2;
  int64 lease_duration = 3;
  bool renewable = 4;
  uint32 renew_count = 5;
  optional uint32 max_renewals = 6;
}

message RevokeLeaseRequest {
  string lease_id = 1;
}

message RevokeLeaseResponse {
  string lease_id = 1;
  repeated string revoked_ids = 2;
  int32 revoked_count = 3;
}

message RevokeLeasePrefixRequest {
  string prefix = 1;
}

message RevokeLeasePrefixResponse {
  string prefix = 1;
  repeated string revoked_ids = 2;
  int32 revoked_count = 3;
}

message LookupLeaseRequest {
  string lease_id = 1;
}

message LookupLeaseResponse {
  string lease_id = 1;
  string user = 2;
  string resource = 3;
  string resource_type = 4;
  string namespace = 5;
  int64 issued_at = 6;
  int64 expired_at = 7;
  int64 ttl = 8;
  string status = 9;
  bool renewable = 10;
  int64 max_ttl = 11;
  uint32 renew_count = 12;
  optional uint32 max_renewals = 13;
  optional int64 last_renewed_at = 14;
  optional string parent_id = 15;
  repeated string child_ids = 16;
  map<string, string> metadata = 17;
}

message ListLeasesRequest {
  optional string user_id = 1;
  optional string namespace = 2;
  optional string resource_type = 3;
  optional string status = 4;
  optional int32 limit = 5;
  optional int32 offset = 6;
}

message ListLeasesResponse {
  repeated LookupLeaseResponse leases = 1;
  int64 total = 2;
  int32 limit = 3;
  int32 offset = 4;
  bool has_next = 5;
  bool has_previous = 6;
}

message GetLeaseStatsRequest {}

message GetLeaseStatsResponse {
  int64 active_count = 1;
  int64 revoked_count = 2;
  int64 expired_count = 3;
  int64 expiring_soon_count = 4;
  int64 unique_users = 5;
  int64 unique_namespaces = 6;
  map<string, int64> by_resource_type = 7;
  map<string, int64> by_namespace = 8;
}

// Policy Management Messages
message ListPoliciesRequest {
  optional string namespace = 1;
  optional bool is_active = 2;
  optional string search = 3;
  optional int32 limit = 4;
  optional int32 offset = 5;
}

message ListPoliciesResponse {
  repeated PolicyInfo policies = 1;
  int64 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message CreatePolicyRequest {
  string name = 1;
  optional string description = 2;
  repeated PolicyRule rules = 3;
  string namespace = 4;
}

message CreatePolicyResponse {
  PolicyInfo policy = 1;
}

message GetPolicyRequest {
  string name = 1;
}

message GetPolicyResponse {
  PolicyInfo policy = 1;
}

message UpdatePolicyRequest {
  string name = 1;
  optional string description = 2;
  repeated PolicyRule rules = 3;
  optional bool is_active = 4;
}

message UpdatePolicyResponse {
  PolicyInfo policy = 1;
}

message DeletePolicyRequest {
  string name = 1;
}

message DeletePolicyResponse {
  bool success = 1;
  string message = 2;
}

message TestPolicyRequest {
  string name = 1;
  string user = 2;
  string path = 3;
  string action = 4;
  optional string context_json = 5;
}

message TestPolicyResponse {
  bool allowed = 1;
  repeated string matched_rules = 2;
  double evaluation_time_ms = 3;
}

message PolicyInfo {
  int64 id = 1;
  string name = 2;
  string namespace = 3;
  optional string description = 4;
  repeated PolicyRule rules = 5;
  int32 version = 6;
  bool is_active = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  string created_by = 10;
  optional string updated_by = 11;
  optional PolicyStats stats = 12;
}

message PolicyRule {
  string effect = 1;
  string action = 2;
  string path = 3;
  optional string condition_json = 4;
  optional ControlGroup control_group = 5;
  optional bool mfa = 6;
}

message ControlGroup {
  uint32 required_approvals = 1;
  repeated string approved_by = 2;
}

message PolicyStats {
  int64 evaluations_total = 1;
  int64 evaluations_allowed = 2;
  int64 evaluations_denied = 3;
  int64 cache_hits = 4;
  int64 cache_misses = 5;
  optional int64 last_evaluated_at = 6;
}


// Response Wrapping Messages
message WrapDataRequest {
  string data_json = 1;  // JSON-encoded data to wrap
  uint64 ttl = 2;        // Time-to-live in seconds
  string namespace = 3;  // Namespace for isolation
}

message WrapDataResponse {
  string token = 1;           // Wrapping token (one-time use)
  int64 created_at = 2;       // Creation timestamp
  int64 expires_at = 3;       // Expiration timestamp
  int64 ttl = 4;              // TTL in seconds
  string accessor = 5;        // Accessor for token lookup
}

message UnwrapTokenRequest {
  string token = 1;      // Wrapping token to unwrap
  string namespace = 2;  // Namespace for isolation
}

message UnwrapTokenResponse {
  string data_json = 1;  // Original wrapped data (JSON-encoded)
  int64 created_at = 2;  // Token creation timestamp
  int64 expired_at = 3;  // Token expiration timestamp
}

message LookupWrappingTokenRequest {
  string token = 1;      // Wrapping token to lookup
  string namespace = 2;  // Namespace for isolation
}

message LookupWrappingTokenResponse {
  string token = 1;           // Token ID
  int64 created_at = 2;       // Creation timestamp
  int64 expires_at = 3;       // Expiration timestamp
  int64 ttl_remaining = 4;    // TTL remaining in seconds
  string namespace = 5;       // Namespace
  string status = 6;          // Status (Active, Unwrapped, Expired)
  int64 data_size = 7;        // Data size in bytes
}

message RewrapTokenRequest {
  string token = 1;      // Original wrapping token
  uint64 ttl = 2;        // New TTL in seconds
  string namespace = 3;  // Namespace for isolation
}

message RewrapTokenResponse {
  string token = 1;           // New wrapping token
  int64 created_at = 2;       // Creation timestamp
  int64 expires_at = 3;       // Expiration timestamp
  int64 ttl = 4;              // TTL in seconds
  string accessor = 5;        // Accessor for token lookup
}
