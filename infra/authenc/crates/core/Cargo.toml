[package]
name = "authenc-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
# Workspace dependencies
authenc-types = { path = "../types" }
authenc-crypto = { path = "../crypto" }
authenc-storage = { path = "../storage" }

# External dependencies (from workspace)
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }

# Additional dependencies needed by core services
anyhow = { workspace = true }
deadpool-postgres = { workspace = true }
lib-common = { workspace = true }
regex = { workspace = true }
axum = { workspace = true }
config = { workspace = true }

# Crypto dependencies (versions match parent authenc/Cargo.toml)
hmac = "0.12"
sha1 = "0.10"
subtle = "2.6"
bcrypt = "0.17.1"
jsonwebtoken = { version = "10.1.0", default-features = false, features = ["aws_lc_rs"] }

# Optional dependencies (feature-gated)
redis = { workspace = true, optional = true }
rdkafka = { version = "0.38", features = ["tokio", "ssl-vendored"], optional = true }
lru = { version = "0.16.3", optional = true }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"], optional = true }
webauthn-rs-proto = { version = "0.5", optional = true }
ldap3 = { version = "0.12.1", optional = true }
aws-sdk-s3 = { version = "1.90.0", optional = true }
aws-config = { version = "1.5.15", optional = true }
aws-credential-types = { version = "1.2.1", optional = true }
openssl = { version = "0.10.74", optional = true }

[features]
default = []
redis-cache = ["redis"]
kafka = ["rdkafka"]
webauthn = ["webauthn-rs", "webauthn-rs-proto"]
ldap = ["ldap3"]
aws = ["aws-sdk-s3", "aws-config", "aws-credential-types"]
fips = ["openssl"]
cache = ["lru"]

[dev-dependencies]
tokio-test = { workspace = true }
