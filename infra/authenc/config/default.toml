# Default configuration for Authenc IAM Service
# This file contains base configuration that applies to all environments
# Override specific values in environment-specific files (e.g., production.toml)
# Secrets should NEVER be stored here - use environment variables instead

[server]
host = "0.0.0.0"
port = 8088
grpc_port = 9088
grpc_enabled = true
keep_alive = 75
client_timeout = 30
client_disconnect_timeout = 5
max_connections = 100
public_prefix = "/api/v1"
admin_prefix = "/admin"
internal_prefix = "/internal"
tls_enabled = false
cors_allowed_origins = ["*"]

[database]
host = "localhost"
port = 5432
username = "postgres"
password = "postgres"  # Override with DATABASE_URL env var in production
database = "authenc"
max_connections = 20
min_connections = 5
connection_timeout = 30
idle_timeout = 600
max_lifetime = 1800
connection_timeout_seconds = 30

[security]
# DO NOT set jwt_secret here - use JWT_SECRET environment variable
jwt_secret = "default_jwt_secret_change_in_production"
jwt_expiry = 3600  # 1 hour
password_min_length = 12
rate_limit_requests = 100
rate_limit_window = 60
brute_force_max_attempts = 5
brute_force_window_seconds = 300
rate_limit_requests_per_minute = 60
password_salt_rounds = 12

[observability]
log_level = "info"
enable_metrics = true
metrics_endpoint = "/metrics"
enable_tracing = true
structured_logging = true
metrics_port = 9090

[features]
enable_registration = true
enable_password_reset = true
enable_email_verification = false
enable_multi_factor_auth = true
enable_api_docs = true
enable_metrics = true
enable_health_checks = true
enable_rate_limiting = true
enable_caching = true
enable_compression = true
enable_cors = true
enable_input_validation = true

[rate_limit]
enabled = true
requests_per_minute = 60
burst_size = 100

[adaptive_rate_limit]
enabled = true
baseline_requests_per_minute = 60
max_requests_per_minute = 120
min_requests_per_minute = 30

[mfa_rate_limit]
enabled = true
max_attempts = 5
window_seconds = 300

[sso_cookie]
name = "AUTHENC_SSO"
domain = ""
path = "/"
max_age = 3600
secure = false  # Set to true in production with TLS
http_only = true
same_site = "Lax"

[events]
enabled = true
user_event_retention_days = 90
admin_event_retention_days = 365
max_cleanup_batch_size = 10000
cleanup_interval_hours = 24
archive_before_delete = false

[clustering]
enabled = false
cluster_name = "authenc-cluster"
session_replication_enabled = true
cache_replication_enabled = true
