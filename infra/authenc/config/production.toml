# Production configuration for Authenc IAM Service
# This file overrides default.toml for production environment
#
# CRITICAL: Set persistent signing keys via environment variables
# See docs/SIGNING_KEY_SETUP.md for detailed instructions
#
# Required environment variables:
# - DATABASE_URL: PostgreSQL connection string
# - JWT_SECRET: JWT signing secret (for legacy compatibility)
# - ED25519_PRIVATE_KEY_BASE64: Ed25519 signing key (REQUIRED for production)
#   OR ECDSA_P256_PRIVATE_KEY_BASE64, ECDSA_P384_PRIVATE_KEY_BASE64, ECDSA_P521_PRIVATE_KEY_BASE64
#
# Generate keys using: cargo run --bin generate-signing-keys

[server]
host = "0.0.0.0"
port = 8088
grpc_port = 9088
grpc_enabled = true
keep_alive = 75
client_timeout = 30
max_connections = 200
tls_enabled = true
# TLS cert/key paths provided via TLS_CERT_PATH and TLS_KEY_PATH env vars
cors_allowed_origins = [
    "https://simpel.kejaksaan.go.id",
    "https://api.simpel.kejaksaan.go.id"
]

[database]
# Use DATABASE_URL environment variable for production
# Format: postgres://user:pass@host:port/database
host = "postgres"
port = 5432
database = "authenc"
max_connections = 50
min_connections = 10
connection_timeout = 30
idle_timeout = 600
max_lifetime = 1800
connection_timeout_seconds = 30

[security]
# JWT_SECRET must be set via environment variable
jwt_expiry = 3600  # 1 hour
password_min_length = 12
rate_limit_requests = 100
rate_limit_window = 60
brute_force_max_attempts = 5
brute_force_window_seconds = 300
rate_limit_requests_per_minute = 100
password_salt_rounds = 12

[observability]
log_level = "info"
enable_metrics = true
metrics_endpoint = "/metrics"
enable_tracing = true
structured_logging = true
metrics_port = 9090

[features]
enable_registration = true
enable_password_reset = true
enable_email_verification = true
enable_multi_factor_auth = true
enable_api_docs = false  # Disable in production
enable_metrics = true
enable_health_checks = true
enable_rate_limiting = true
enable_caching = true
enable_compression = true
enable_cors = true
enable_input_validation = true

[rate_limit]
enabled = true
requests_per_minute = 100
burst_size = 150

[adaptive_rate_limit]
enabled = true
baseline_requests_per_minute = 100
max_requests_per_minute = 200
min_requests_per_minute = 50

[mfa_rate_limit]
enabled = true
max_attempts = 5
window_seconds = 300

[sso_cookie]
name = "AUTHENC_SSO"
domain = ".kejaksaan.go.id"
path = "/"
max_age = 3600
secure = true  # Enforce HTTPS
http_only = true
same_site = "Strict"

[events]
enabled = true
user_event_retention_days = 90
admin_event_retention_days = 365
max_cleanup_batch_size = 10000
cleanup_interval_hours = 24
archive_before_delete = true

[clustering]
enabled = true
cluster_name = "authenc-prod-cluster"
session_replication_enabled = true
cache_replication_enabled = true
