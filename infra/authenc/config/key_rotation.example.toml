# Key Rotation Configuration Example
# This file demonstrates how to configure automatic key rotation for Authenc

[key_rotation]
# Enable automatic key rotation
enabled = true

# Rotation interval in days (default: 30)
# Keys will be automatically rotated after this many days
rotation_interval_days = 30

# Grace period for old keys in days (default: 7)
# Old keys remain valid for this period after rotation to allow for gradual transition
grace_period_days = 7

# Enable notifications on rotation completion
# When enabled, notifications will be sent when keys are rotated
enable_notifications = true

# Example: Disable key rotation
# [key_rotation]
# enabled = false

# Example: More frequent rotation (every 14 days)
# [key_rotation]
# enabled = true
# rotation_interval_days = 14
# grace_period_days = 3
# enable_notifications = true
