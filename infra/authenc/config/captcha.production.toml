# CAPTCHA System Production Configuration
# SIMPelv2 AI-Resistant CAPTCHA Configuration

[captcha]
# Enable CAPTCHA system
enabled = true

# Default difficulty level (1-10)
default_difficulty = 3

# Maximum difficulty level
max_difficulty = 10

# Number of failed attempts before showing CAPTCHA
failed_attempts_threshold = 2

# Maximum attempts before rate limiting
max_attempts = 5

# Rate limit duration in seconds
rate_limit_duration = 300

# Challenge expiration time in seconds
challenge_expiration = 300

# Enable behavioral analysis
behavioral_analysis_enabled = true

# Enable accessibility features
accessibility_enabled = true

[captcha.challenge_types]
# Available challenge types
visual = true
audio = true
logical = true
behavioral = true
hybrid = true

[captcha.difficulty_scaling]
# Difficulty scaling parameters
base_difficulty = 3
increment_per_failure = 1
max_increment = 3
reset_after_success = true

[captcha.behavioral_analysis]
# Behavioral analysis configuration
mouse_tracking = true
keystroke_analysis = true
timing_analysis = true
browser_fingerprinting = true
session_analysis = true

# Risk scoring thresholds
low_risk_threshold = 0.3
medium_risk_threshold = 0.6
high_risk_threshold = 0.8

[captcha.accessibility]
# Accessibility configuration
audio_challenges = true
screen_reader_support = true
keyboard_navigation = true
alternative_inputs = true
high_contrast_mode = true

[captcha.security]
# Security configuration
encrypt_challenges = true
hash_answers = true
secure_random = true
anti_replay = true
csrf_protection = true

# Token configuration
token_length = 32
token_expiration = 600

[captcha.integration]
# Authenc integration
authenc_enabled = true
authenc_url = "${AUTHENC_API_URL}"
authenc_realm = "simpel"
authenc_client_id = "portal"

# Rate limiting integration
rate_limiting_enabled = true
rate_limit_key_prefix = "captcha_"

# Security monitoring integration
security_monitoring_enabled = true
audit_logging_enabled = true

# Secreton integration
secreton_enabled = true
secreton_url = "${SECRETON_API_URL}"
secreton_mount_path = "captcha"
secreton_key_rotation_interval = 86400  # 24 hours

[captcha.monitoring]
# Monitoring and metrics
metrics_enabled = true
prometheus_enabled = true
tracing_enabled = true

# Alert thresholds
high_failure_rate_threshold = 0.7
high_bot_detection_threshold = 0.5
performance_degradation_threshold = 2000  # ms

# Dashboard configuration
dashboard_enabled = true
real_time_updates = true

[captcha.performance]
# Performance configuration
cache_enabled = true
cache_ttl = 3600  # 1 hour
connection_pool_size = 10
request_timeout = 5000  # ms
max_concurrent_challenges = 1000

# Database configuration
database_enabled = true
challenge_retention_days = 7
metrics_retention_days = 30
cleanup_interval = 3600  # 1 hour

[captcha.logging]
# Logging configuration
log_level = "info"
structured_logging = true
log_challenges = false  # Don't log challenge content for security
log_answers = false     # Don't log answers for security
log_behavioral_data = true
log_security_events = true

# Log retention
log_retention_days = 30
audit_log_retention_days = 90

[captcha.development]
# Development and testing configuration
mock_mode = false
debug_mode = false
test_mode = false
bypass_rate_limiting = false
fixed_challenges = false

# Demo configuration
demo_mode = false
demo_always_pass = false
demo_always_fail = false
