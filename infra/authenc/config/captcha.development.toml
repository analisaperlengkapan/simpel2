# CAPTCHA System Development Configuration
# SIMPelv2 AI-Resistant CAPTCHA Development Configuration

[captcha]
# Enable CAPTCHA system
enabled = true

# Default difficulty level (lower for development)
default_difficulty = 2

# Maximum difficulty level
max_difficulty = 5

# Number of failed attempts before showing CAPTCHA (lower for testing)
failed_attempts_threshold = 1

# Maximum attempts before rate limiting
max_attempts = 10

# Rate limit duration in seconds (shorter for development)
rate_limit_duration = 60

# Challenge expiration time in seconds
challenge_expiration = 600

# Enable behavioral analysis
behavioral_analysis_enabled = true

# Enable accessibility features
accessibility_enabled = true

[captcha.challenge_types]
# Available challenge types
visual = true
audio = true
logical = true
behavioral = true
hybrid = true

[captcha.difficulty_scaling]
# Difficulty scaling parameters
base_difficulty = 2
increment_per_failure = 1
max_increment = 2
reset_after_success = true

[captcha.behavioral_analysis]
# Behavioral analysis configuration
mouse_tracking = true
keystroke_analysis = true
timing_analysis = true
browser_fingerprinting = false  # Disabled for development
session_analysis = true

# Risk scoring thresholds (more lenient for development)
low_risk_threshold = 0.4
medium_risk_threshold = 0.7
high_risk_threshold = 0.9

[captcha.accessibility]
# Accessibility configuration
audio_challenges = true
screen_reader_support = true
keyboard_navigation = true
alternative_inputs = true
high_contrast_mode = true

[captcha.security]
# Security configuration
encrypt_challenges = true
hash_answers = true
secure_random = true
anti_replay = true
csrf_protection = true

# Token configuration
token_length = 16  # Shorter for development
token_expiration = 1200

[captcha.integration]
# Authenc integration
authenc_enabled = true
authenc_url = "http://localhost:8088"
authenc_realm = "simpel"
authenc_client_id = "portal"

# Rate limiting integration
rate_limiting_enabled = true
rate_limit_key_prefix = "dev_captcha_"

# Security monitoring integration
security_monitoring_enabled = true
audit_logging_enabled = true

# Secreton integration
secreton_enabled = true
secreton_url = "http://localhost:8200"
secreton_mount_path = "captcha"
secreton_key_rotation_interval = 3600  # 1 hour for development

[captcha.monitoring]
# Monitoring and metrics
metrics_enabled = true
prometheus_enabled = false  # Disabled for development
tracing_enabled = true

# Alert thresholds (more lenient for development)
high_failure_rate_threshold = 0.9
high_bot_detection_threshold = 0.8
performance_degradation_threshold = 5000  # ms

# Dashboard configuration
dashboard_enabled = true
real_time_updates = true

[captcha.performance]
# Performance configuration
cache_enabled = true
cache_ttl = 1800  # 30 minutes
connection_pool_size = 5
request_timeout = 10000  # ms
max_concurrent_challenges = 100

# Database configuration
database_enabled = true
challenge_retention_days = 1
metrics_retention_days = 7
cleanup_interval = 1800  # 30 minutes

[captcha.logging]
# Logging configuration
log_level = "debug"
structured_logging = true
log_challenges = true   # Enable for development debugging
log_answers = false     # Still don't log answers for security
log_behavioral_data = true
log_security_events = true

# Log retention (shorter for development)
log_retention_days = 7
audit_log_retention_days = 14

[captcha.development]
# Development and testing configuration
mock_mode = false
debug_mode = true
test_mode = false
bypass_rate_limiting = false
fixed_challenges = false

# Demo configuration
demo_mode = true
demo_always_pass = false
demo_always_fail = false
