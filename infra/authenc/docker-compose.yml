version: '3.9'

services:
  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: authenc-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-authenc}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5433:5432"  # Use 5433 to avoid conflict with system PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - authenc-network
    restart: unless-stopped
    labels:
      - "com.simpel.service=authenc-db"

  # ============================================================================
  # Redis Cache (for rate limiting, sessions, caching)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: authenc-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - authenc-network
    restart: unless-stopped
    labels:
      - "com.simpel.service=authenc-cache"

  # ============================================================================
  # Authenc IAM Service
  # ============================================================================
  authenc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authenc-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Service Configuration
      AUTHENC_ENV: ${AUTHENC_ENV:-production}
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-1}

      # Database Configuration
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-authenc}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-authenc}

      # Security Configuration
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_with_strong_secret}
      ED25519_PRIVATE_KEY_BASE64: ${ED25519_PRIVATE_KEY_BASE64:-}
      ECDSA_P256_PRIVATE_KEY_BASE64: ${ECDSA_P256_PRIVATE_KEY_BASE64:-}
      ECDSA_P384_PRIVATE_KEY_BASE64: ${ECDSA_P384_PRIVATE_KEY_BASE64:-}
      ECDSA_P521_PRIVATE_KEY_BASE64: ${ECDSA_P521_PRIVATE_KEY_BASE64:-}

      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}

      # Server Configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8088
      GRPC_PORT: 9088
      GRPC_ENABLED: "true"
      METRICS_PORT: 9090

      # TLS Configuration (optional)
      TLS_ENABLED: ${TLS_ENABLED:-false}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-}

      # CAPTCHA Configuration
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
      CAPTCHA_DEFAULT_DIFFICULTY: ${CAPTCHA_DEFAULT_DIFFICULTY:-3}
      CAPTCHA_FAILED_ATTEMPTS_THRESHOLD: ${CAPTCHA_FAILED_ATTEMPTS_THRESHOLD:-2}

      # Secreton Integration
      SECRETON_API_URL: ${SECRETON_API_URL:-http://secreton:8200}
      SECRETON_TOKEN: ${SECRETON_TOKEN:-}

      # Email Configuration (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@simpel.kejaksaan.go.id}

      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

      # Features
      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION:-true}
      ENABLE_PASSWORD_RESET: ${ENABLE_PASSWORD_RESET:-true}
      ENABLE_EMAIL_VERIFICATION: ${ENABLE_EMAIL_VERIFICATION:-true}
      ENABLE_MULTI_FACTOR_AUTH: ${ENABLE_MULTI_FACTOR_AUTH:-true}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}

    volumes:
      - ./authenc.toml:/app/authenc.toml:ro
      - ./config:/app/config:ro
      - authenc_logs:/app/logs
    ports:
      - "8088:8088"   # HTTP API
      - "9088:9088"   # gRPC
      - "9092:9090"   # Metrics (use 9092 to avoid conflict)
    networks:
      - authenc-network
    restart: unless-stopped
    labels:
      - "com.simpel.service=authenc"
      - "com.simpel.version=${VERSION:-latest}"

  # ============================================================================
  # Prometheus (Monitoring)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: authenc-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9091:9090"
    networks:
      - authenc-network
    restart: unless-stopped
    labels:
      - "com.simpel.service=authenc-monitoring"

  # ============================================================================
  # Grafana (Visualization)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: authenc-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "redis-datasource"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - authenc-network
    restart: unless-stopped
    labels:
      - "com.simpel.service=authenc-visualization"

networks:
  authenc-network:
    driver: bridge
    name: authenc-network

volumes:
  postgres_data:
    name: authenc-postgres-data
  redis_data:
    name: authenc-redis-data
  authenc_logs:
    name: authenc-logs
  prometheus_data:
    name: authenc-prometheus-data
  grafana_data:
    name: authenc-grafana-data
