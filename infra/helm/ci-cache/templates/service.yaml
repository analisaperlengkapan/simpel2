apiVersion: v1
kind: Service
metadata:
  name: ci-cache
  labels:
    app.kubernetes.io/name: ci-cache
    app.kubernetes.io/part-of: simpel-ci
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ci-cache
  ports:
    - name: webdav
      port: 6060
      targetPort: webdav
      nodePort: {{ .Values.service.nodePort }}
