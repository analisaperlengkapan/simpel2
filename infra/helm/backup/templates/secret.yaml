{{- if .Values.secrets.bootstrap }}
{{- $m := .Values.secrets.minio -}}
{{- if not $m.rootUser }}{{ fail "secrets.bootstrap=true butuh secrets.minio.rootUser" }}{{- end }}
{{- if not $m.rootPassword }}{{ fail "secrets.bootstrap=true butuh secrets.minio.rootPassword" }}{{- end }}
{{- if lt (len $m.rootPassword) 8 }}{{ fail "secrets.minio.rootPassword minimal 8 karakter (syarat MinIO)" }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: {{ include "backup.namespace" . }}
  labels:
    app.kubernetes.io/name: minio
    {{- include "backup.labels" . | nindent 4 }}
  annotations:
    # Jangan biarkan `helm uninstall` mencabut kredensial yang masih dipakai
    # data di PVC yang justru di-`keep`.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  # Nama kunci mengikuti env MinIO supaya bisa di-envFrom apa adanya.
  MINIO_ROOT_USER: {{ $m.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ $m.rootPassword | quote }}
  # Bentuk kredensial AWS yang dibaca Velero (`credentials-velero`).
  cloud: |
    [default]
    aws_access_key_id={{ $m.rootUser }}
    aws_secret_access_key={{ $m.rootPassword }}
{{- end }}
