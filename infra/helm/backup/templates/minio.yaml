{{- $ns := include "backup.namespace" . -}}
{{- $m := .Values.minio -}}
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: minio
    {{- include "backup.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - { name: s3,      port: 9000, targetPort: 9000, protocol: TCP }
    - { name: console, port: 9001, targetPort: 9001, protocol: TCP }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: minio
    {{- include "backup.labels" . | nindent 4 }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  # Volume MinIO memegang SELURUH riwayat backup. Hapus StatefulSet ≠ hapus
  # backup: PVC-nya dipertahankan di kedua arah.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        {{- include "backup.labels" . | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: "{{ $m.image.repository }}:{{ $m.image.tag }}"
          imagePullPolicy: {{ $m.image.pullPolicy }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_REGION
              value: {{ $m.region | quote }}
            # Console web dimatikan: satu-satunya klien yang sah adalah Velero
            # lewat API S3. Permukaan login yang tak dipakai hanya menambah
            # permukaan serang.
            - name: MINIO_BROWSER
              value: "off"
          envFrom:
            - secretRef:
                name: minio-root
          ports:
            - { name: s3,      containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            # readOnlyRootFilesystem: MinIO menulis konfigurasi klien ke $HOME.
            - { name: home, mountPath: /home/minio }
            - { name: tmp,  mountPath: /tmp }
      volumes:
        - name: home
          emptyDir: { sizeLimit: 32Mi }
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ $m.storage.size }}
