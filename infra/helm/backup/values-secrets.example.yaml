# Salin ke `values-secrets.yaml` (ter-gitignore) dan isi nilainya.
# JANGAN commit file hasil salinannya.
#
#   ./infra/helm/deploy.sh <env> backup-install \
#     -f infra/helm/backup/values-secrets.yaml --set secrets.bootstrap=true
secrets:
  bootstrap: true
  minio:
    rootUser: simpel-velero
    # Minimal 8 karakter (syarat MinIO). Bangkitkan, jangan karang:
    #   openssl rand -base64 36
    rootPassword: "GANTI-DENGAN-PASSWORD-ACAK"
