# Values untuk satu runner scale set ARC (runner ephemeral untuk repo simpel2).
#
# Chart upstream (OCI, TIDAK divendor):
#   oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
#
# Tiap job CI dapat POD baru → workspace, dockerd (dind), buildx semuanya
# di dalam pod & dibuang saat job selesai. Menghapus akar "buildx /var leak"
# runner statis lama secara struktural.

githubConfigUrl: "https://github.com/analisaperlengkapan/simpel2"

# Secret berisi PAT GitHub (key: github_token). Dibuat oleh install.sh — JANGAN
# commit nilai PAT. Lihat README.md.
githubConfigSecret: arc-github-token

# Eksplisit menunjuk ServiceAccount controller (release `arc` di ns `arc-systems`).
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

# Nama scale set = LABEL utama di `runs-on:`. Hindari nama reserved.
runnerScaleSetName: arc-simpel

# Label tambahan (ARC >=0.12): runs-on yang cocok salah satu label ini juga
# dirutekan ke scale set ini (job Dependabot self-hosted & dependency-submission).
# CATATAN: menambah/ubah label butuh RECREATE scale set (helm uninstall+install),
# bukan helm upgrade — ARC daftarkan label ke GitHub hanya saat scale set dibuat.
scaleSetLabels:
  - dependabot
  - dependency-submission

# Skala — DIHITUNG ULANG 2026-07-19 (#111). Angka lama (20) berasal dari sizing
# yang menghitung container YANG SALAH: ia memakai requests container `runner`
# (2Gi/pod) sebagai pengikat, padahal `dind` — tempat SEMUA `docker build`
# sebenarnya berjalan — sama sekali tak punya blok `resources:`. Jadi scheduler
# melihat 20 × 1 CPU = 20/48 ("muat santai") sementara beban nyatanya tak
# terbatas. Hasil terukur: requests CPU 65% tapi LIMITS 369%, memory limits 387%,
# loadavg 311 di kotak 48-core, dan e2e gagal di step build setelah ~90 menit
# tanpa menjalankan satu asersi pun.
#
# Anggaran jujur simple02 (48 vCPU / ~62Gi allocatable), sisakan utk staging
# (postgres/redis/portal×2/perlengkapan×2/registry) + sistem ≈ 11 CPU / 11Gi:
#   per pod requests = dind 3 CPU + runner 1 CPU  = 4 CPU
#                      dind 3Gi  + runner 2Gi     = 5Gi
#   8 pod = 32 CPU + 40Gi  →  +baseline ≈ 43 CPU (90%) / 51Gi (82%)
# Turun dari 20 BUKAN pengurangan kapasitas: 20 tak pernah benar-benar muat.
# Paralelisme yang hilang ditebus oleh build-once e2e (6 job berhenti membangun
# stack masing-masing), bukan dgn menjual-lebih node.
minRunners: 0
maxRunners: 8

# ── Pod template MANUAL untuk dind (BUKAN containerMode shorthand) ──
# Manual diperlukan agar bisa:
#   1) pakai custom runner image dgn build toolchain (gcc/protoc/openssl/cmake/
#      clang) — image actions-runner resmi minimal → `linker cc not found`.
#   2) set registry-mirror dind ke mirror.gcr.io → hindari Docker Hub 429
#      (pod ephemeral tanpa cache image, paralel menembus rate limit anonim).
# CATATAN dind = NATIVE SIDECAR: harus di `initContainers` dgn restartPolicy:Always
# (K8s melarang restartPolicy di non-init container). JANGAN set `containerMode`.
template:
  spec:
    # Pull custom runner image dari ghcr (privat). Secret ghcr-pull disalin ke
    # ns arc-runners dari simpelv2-staging (PAT read:packages).
    imagePullSecrets:
      - name: ghcr-pull
    # DNS: dind (netns pod sama) mengganggu jalur ke CoreDNS via iptables →
    # intermittent "Could not resolve host: index.crates.io". Job CI hanya butuh
    # resolusi nama EKSTERNAL (crates.io, ghcr, github), jadi pakai resolver
    # publik langsung (bypass CoreDNS) agar resolusi stabil di bawah konkurensi.
    dnsPolicy: None
    dnsConfig:
      nameservers:
        - 1.1.1.1
        - 8.8.8.8
      options:
        - name: ndots
          value: "1"
    nodeSelector:
      kubernetes.io/hostname: simple02
    tolerations:
      - key: dedicated
        operator: Equal
        value: ci
        effect: NoSchedule
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/analisaperlengkapan/simpel2-arc-runner:v0.1.1
        command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      # dind = native sidecar (initContainer + restartPolicy:Always).
      - name: dind
        image: docker:dind
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          # Pull-through cache Docker Hub (tanpa kredensial) → hindari 429.
          - --registry-mirror=https://mirror.gcr.io
          # Samakan MTU dgn pod network Calico (vxlan 1450). Default dind 1500
          # > 1450 → transfer besar di `docker build` RUN (apk/curl) stall/gagal.
          - --mtu=1450
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        restartPolicy: Always
        # WAJIB ADA (#111). Tanpa blok ini dind = 0 request / 0 limit: tak
        # terlihat scheduler dan tak terbatas saat runtime — padahal DI SINILAH
        # `docker build` berjalan (runner cuma bicara ke socket). Ini penyebab
        # overcommit 369% + loadavg 311, bukan jumlah node.
        resources:
          requests:
            cpu: "3"
            memory: 3Gi
          limits:
            cpu: "6"
            memory: 6Gi
        startupProbe:
          exec:
            command: ["docker", "info"]
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
    containers:
      - name: runner
        image: ghcr.io/analisaperlengkapan/simpel2-arc-runner:v0.1.1
        command: ["/home/runner/run.sh"]
        securityContext:
          allowPrivilegeEscalation: false
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
          # Selaras CARGO_BUILD_JOBS di ci.yml (hindari FD exhaustion).
          - name: CARGO_BUILD_JOBS
            value: "4"
        # Runner mengorkestrasi job & menjalankan cargo/trunk langsung; build
        # image berat ada di dind (lihat blok resources-nya). Selisih
        # request↔limit sengaja dipersempit 1→6 menjadi 1→2: rasio lama membuat
        # scheduler menghitung 1 CPU/pod untuk beban yang boleh menuntut 6.
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}

# ── Cache build (OPSIONAL) ── runner ephemeral kehilangan ~/.cargo & target/
# tiap job. Opsi: buildx registry cache, sccache, atau PVC RWX (longhorn).
# Aktifkan setelah ARC stabil.
