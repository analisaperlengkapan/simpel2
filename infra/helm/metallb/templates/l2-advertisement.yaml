{{- range .Values.advertisements }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  ipAddressPools:
    {{- toYaml .pools | nindent 4 }}
  {{- with .interfaces }}
  interfaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
