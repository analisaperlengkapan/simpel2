# Production overrides untuk SIMPEL.
#
# Pakai bersama values.yaml:
#   helm upgrade --install simpel infra/helm/simpel \
#     -f infra/helm/simpel/values-production.yaml \
#     --namespace simpelv2-production --create-namespace

global:
  environment: production
  # Semver immutable (per AGENTS.md). Tag mutable 'prod' di-deprecate.
  imageTag: v0.1.0
  # ghcr.io publik registry — pull dengan ghcr-pull secret yang dipasang per namespace.
  imagePullPolicy: IfNotPresent
  domain: simpel.kejaksaan.go.id

namespace:
  # Namespace sudah ada (dengan label Istio/PSA yang benar) dan dikosongkan oleh
  # infra/helm/cutover-production.sh; Helm TIDAK boleh memilikinya, sebab `helm
  # uninstall` akan cascade-menghapus seluruh namespace beserta datanya.
  create: false
  name: simpelv2-production
  istioInjection: enabled
  podSecurityEnforce: privileged
  podSecurityAudit: baseline
  podSecurityWarn: baseline
  annotations:
    description: "SIMPEL Production Environment"
    simpelv2.kejaksaan.go.id/tier: production
    simpelv2.kejaksaan.go.id/sla: "99.9%"

mtls:
  mode: STRICT
  # authenc (di luar mesh) -> layanan-integrasi:50051: provisioning login pertama + /auth/me.
  # Tanpa ini STRICT menjawab dengan sertifikat Envoy: `invalid peer certificate: UnknownIssuer`.
  portExceptions:
    - { workload: layanan-integrasi, port: 50051 }

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "20"
    pods: "100"
    services: "30"
    secrets: "50"
    configmaps: "50"
limitRange:
  enabled: true

priorityClass:
  name: simpelv2-production-default

config:
  rustLog: info
  appEnvironment: production
  portalBaseUrl: https://simpel.kejaksaan.go.id
  jwtIssuer: https://simpel.kejaksaan.go.id/auth
  webauthn:
    rpId: simpel.kejaksaan.go.id
    rpOrigin: https://simpel.kejaksaan.go.id

backendConfig:
  mtlsMode: STRICT
  # Fail-closed. authenc, secreton and layanan-integrasi refuse to start their gRPC
  # listeners without mTLS material, and every client refuses to dial without its
  # own certificate. The chart issues the PKI itself (templates/secrets/grpc-pki.yaml,
  # backendConfig.grpcTls) — the same path staging runs, so what is proven there is
  # what runs here. Istio does not cover these hops — mtls.disableForHosts excludes
  # authenc and secreton, and both run with istioInjection: false.
  grpcAllowInsecure: "false"
  grpcTls:
    enabled: true

# ─── Workload sizing — HA ──────────────────────────────────────────────────────
postgres:
  # SATU instance — dan ini WAJIB, bukan pilihan kapasitas.
  #
  # Sebelumnya `replicas: 3`. Image-nya `postgres:16-alpine` stock: tak ada
  # replikasi, dan tiap pod StatefulSet mendapat PVC sendiri → 3 replica = 3
  # DATABASE TERPISAH. Karena `DATABASE_URL` menunjuk Service headless
  # `postgres.<ns>.svc` yang me-resolve ke semua pod, koneksi akan tersebar ke
  # ketiganya: tulis ke satu, baca dari yang lain. Tak ada yang crash — datanya
  # yang bercabang. Tak pernah ketahuan karena produksi belum pernah di-deploy.
  #
  # Sekarang dijaga keras di templates/infrastructure/postgres.yaml (`fail`).
  # HA postgres sungguhan = operator CloudNativePG, bukan menaikkan angka ini.
  replicas: 1
  storage: { size: 100Gi }
  # 1 replica: `minAvailable: 2` mustahil dipenuhi dan akan mengunci drain node.
  pdb: { enabled: false, minAvailable: 0 }
redis:
  # Single-replica cache: maxUnavailable must be >0 or a node drain is blocked
  # forever (kube-linter pdb-max-unavailable). AOF persists on the PVC, so
  # losing the pod briefly during disruption is acceptable.
  pdb: { enabled: true, maxUnavailable: 1 }
authenc:
  replicas: 3
  # Akun seed migrasi dimatikan dan administrator pertama dibuat (lihat
  # backend/authenc-bootstrap-job.yaml). WAJIB di produksi.
  bootstrapAdmin:
    enabled: true
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 6
    cpuUtilization: 70
  pdb: { enabled: true, minAvailable: 2 }
  podAntiAffinity: { type: preferred }
secreton:
  replicas: 3
  pdb: { enabled: true, minAvailable: 2 }
  podAntiAffinity: { type: preferred }
layananIntegrasi:
  replicas: 2                              # production: 2 server replicas (HA)
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  hpa: { enabled: false }
  pdb: { enabled: true, minAvailable: 1 }
  podAntiAffinity: { type: preferred }
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  # CronJob AKTIF di production (override staging suspend=true).
  # Schedule warisi dari values.yaml:
  #   SIMAN Minggu 04:00 WIB, MySIMKARI tiap 6 jam, MonSAKTI tiap hari 03:00 WIB.
  cronjobs:
    siman:      { suspend: false }
    mysimkari:  { suspend: false }
    monsakti:   { suspend: false }
layananPerlengkapan:
  replicas: 3
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    cpuUtilization: 70
  pdb: { enabled: true, minAvailable: 2 }
  podAntiAffinity: { type: preferred }
  # Dokumen resmi (konsep SK, SK tertandatangan, lampiran). Tanpa volume bersama,
  # dengan 2–8 replika hampir tiap unduhan jatuh ke replika yang tak punya
  # berkasnya (500), dan tiap deploy menghapus semuanya. RWX + `longhorn-retain`
  # (global.storageClass produksi), jadi berkas bertahan dari pod, deploy, dan
  # pencabutan klaim. Ukuran 20Gi: belum ada angka pemakaian nyata; Longhorn
  # mendukung perluasan volume, jadi bisa dinaikkan tanpa membuat ulang.
  #
  # SEBELUM PROMOSI — dua hal yang harus terbukti di staging dan DICATAT di catatan
  # rilis (staging tak lagi dipaku ke satu node, jadi keduanya bisa diuji di sana):
  # (1) node kedua harus punya `nfs-common`, bila tidak pod yang jatuh di sana macet
  # di ContainerCreating (`mount.nfs not found`); (2) `fsGroup` tak diterapkan pada
  # volume RWX (CSIDriver Longhorn memakai `ReadWriteOnceWithFSType`), jadi uid 1000
  # harus terbukti bisa menulis dari KEDUA node. Bila catatan rilis tak menyebut
  # replika benar-benar jatuh di dua node, anggap belum terbukti.
  persistence:
    enabled: true
    size: 20Gi
simpelv1:
  # AKTIF untuk go-live pertama (keputusan operator 2026-11-10): SIMPEL v1 tetap berjalan berdampingan
  # dengan v2. v2 (portal, perlengkapan, authenc, integrasi) TIDAK bergantung pada v1, jadi v1 yang
  # gagal tidak boleh menahan v2. Datanya dimuat SETELAH install langsung ke `dbsimpelv1`
  # (RUNBOOK §1.7a), bukan lewat Secret: dump produksi ±182 MB, batas Secret/ConfigMap 1 MiB.
  # Sebelum data dimuat, pod v1 berjalan di atas database kosong (aplikasi kosong) — wajar, dan
  # tak ada pengguna yang diarahkan ke sana sampai pemuatan selesai.
  enabled: true
  replicas: 3
  image:
    tag: v0.1.0                            # immutable tag di production
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: "1",  memory: 2Gi }
  appUrl: "https://simpel.kejaksaan.go.id/perlengkapan/simpel/v1"
  env:
    APP_ENV: production
    QUEUE_CONNECTION: redis
    # Production tidak pernah menimpa ini, jadi ia mewarisi default chart yang
    # rusak (`http://portal:3000/portal`) — alamat in-cluster yang dikirim ke
    # browser pengguna.
    PORTAL_URL: "https://simpel.kejaksaan.go.id/portal"
  podAntiAffinity:
    type: required
  # `none`: tak ada init container restore. `secret` TIDAK BISA dipakai — Secret maksimum 1 MiB,
  # dump produksi ±182 MB. Data dimuat lewat `kubectl exec ... psql` (RUNBOOK §1.7a).
  dbBackup:
    source: none
    name: simpelv1-db-backup
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuUtilization: 70
    memoryUtilization: 80
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - { type: Percent, value: 100, periodSeconds: 15 }
          - { type: Pods,    value: 2,   periodSeconds: 15 }
        selectPolicy: Max
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - { type: Percent, value: 50, periodSeconds: 60 }
  pdb: { enabled: true, minAvailable: 2 }
portal:
  replicas: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuUtilization: 70
    memoryUtilization: 75
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - { type: Pods, value: 2, periodSeconds: 60 }
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - { type: Percent, value: 10, periodSeconds: 60 }
  pdb: { enabled: true, minAvailable: 2 }
  podAntiAffinity: { type: preferred }
  csp:
    connectSrc:
      - "'self'"
      - "ws:"
      - "wss:"
      - "https://*.kejaksaan.go.id"
perlengkapan:
  replicas: 3
  podAntiAffinity: { type: preferred }
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    cpuUtilization: 70

# ─── Istio routing ─────────────────────────────────────────────────────────────
# Gateway dan VirtualService produksi berdiri SENDIRI, bukan memakai milik staging:
#  * `simpelv2-gateway` dimiliki rilis Helm staging (meta.helm.sh/release-namespace
#    = simpelv2-staging). Chart produksi yang merender objek bernama sama ditolak
#    helm ("invalid ownership metadata"), dan menimpanya akan merusak staging.
#  * Gateway staging melayani host "*" dengan sertifikat self-signed
#    (CN=simpelv2-staging). Domain produksi butuh sertifikat DigiCert-nya sendiri,
#    disimpan di Secret TLS `simpelv2-prod-tls` (namespace istio-system, dibuat
#    operator sebelum install — kunci privat tidak boleh lewat Helm/values).
#  * Host dipaku ke domain produksi. `hosts: ["*"]` sebelumnya membuat tabel rute
#    produksi menjawab Host apa pun yang sampai ke ingress bersama.
# Tabel rute di bawah HARUS sama dengan staging (kecuali origin CORS):
# infra/scripts/check-route-parity.py menggagalkan CI bila keduanya menyimpang.
# Dulu tabel ini salinan pra-F5 yang tak punya satu pun rute authenc, sehingga
# login mustahil di produksi — dan tak ada yang menyadarinya karena produksi
# memang belum pernah di-deploy.
istio:
  gateway:
    name: simpelv2-prod-gateway
    hosts: ["simpel.kejaksaan.go.id"]
    httpsRedirect: true
    tls:
      enabled: true
      mode: SIMPLE
      credentialName: simpelv2-prod-tls
  virtualService:
    name: simpelv2-prod-routes
    hosts: ["simpel.kejaksaan.go.id"]
    defaultRedirect: ""
    routes:
      - match: { exact: / }
        destination: { host: portal, port: 8080 }
      - match: { prefix: /api/captcha/ }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        corsPolicy: &cors
          allowOrigins:
            - { exact: "https://simpel.kejaksaan.go.id" }
          allowMethods: [POST, GET, OPTIONS]
          allowHeaders: [content-type, authorization]
          maxAge: "86400s"
      - match: { prefix: /captcha/ }
        rewrite: /api/captcha/
        destination: { host: authenc, port: 8088 }
        timeout: 30s
      - match: { prefix: /api/auth/captcha/ }
        rewrite: /api/captcha/
        destination: { host: authenc, port: 8088 }
        timeout: 30s
      - match: { exact: /perlengkapan/simpel/v1 }
        redirect: { uri: /perlengkapan/simpel/v1/, code: 308 }
      - match: { prefix: /perlengkapan/simpel/v1/ }
        rewrite: /
        destination: { host: simpelv1, port: 80 }
        timeout: 30s
        retries: { attempts: 3, perTryTimeout: 10s }
      - match: { prefix: /perlengkapan/simpel/v2 }
        destination: { host: perlengkapan, port: 8080 }
        timeout: 30s
      - match: { prefix: /perlengkapan/simpel }
        destination: { host: perlengkapan, port: 8080 }
      - match: { prefix: /perlengkapan }
        destination: { host: perlengkapan, port: 8080 }
      - match: { prefix: /pembinaan/perlengkapan }
        destination: { host: perlengkapan, port: 8080 }
      - match: { prefix: /api/v1/perlengkapan }
        destination: { host: layanan-perlengkapan, port: 3020 }
        timeout: 30s
      - match: { prefix: /api/v1/auth }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        retries: { attempts: 3, perTryTimeout: 10s }
        corsPolicy: *cors
      - match: { prefix: /api/v1/iam }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        retries: { attempts: 3, perTryTimeout: 10s }
        corsPolicy: *cors
      - match: { prefix: /api/v1/oauth2 }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        corsPolicy: *cors
      - match: { prefix: /api/v1/captcha }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
      - match: { prefix: /api/v1/clients }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
      - match: { prefix: /api/auth }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        corsPolicy: *cors
      - match: { exact: /health }
        destination: { host: perlengkapan, port: 8080 }
      - match: { exact: /portal }
        redirect: { uri: /portal/, code: 308 }
      - match: { prefix: /portal/ }
        rewrite: /
        destination: { host: portal, port: 8080 }
      - match: { exact: /daskrimti }
        redirect: { uri: /daskrimti/, code: 308 }
      - match: { prefix: /daskrimti/ }
        rewrite: /
        destination: { host: portal, port: 8080 }
  destinationRules:
    extra:
      - name: simpelv1
        host: simpelv1
        trafficPolicy:
          connectionPool:
            tcp: { maxConnections: 500 }
            http:
              http1MaxPendingRequests: 500
              http2MaxRequests: 1000
              h2UpgradePolicy: UPGRADE
              maxRequestsPerConnection: 10
          outlierDetection:
            consecutiveErrors: 5
            interval: 30s
            baseEjectionTime: 60s
            maxEjectionPercent: 50
            minRequestVolume: 10
            splitExternalLocalOriginErrors: true
          loadBalancer:
            simple: LEAST_REQUEST
      - name: layanan-perlengkapan
        host: layanan-perlengkapan
        trafficPolicy:
          connectionPool:
            tcp: { maxConnections: 500 }
            http:
              http1MaxPendingRequests: 500
              http2MaxRequests: 1000
              h2UpgradePolicy: UPGRADE
              maxRequestsPerConnection: 10
          outlierDetection:
            consecutiveErrors: 5
            interval: 30s
            baseEjectionTime: 60s
            maxEjectionPercent: 50
            minRequestVolume: 10
            splitExternalLocalOriginErrors: true
          loadBalancer:
            simple: LEAST_REQUEST

monitoring:
  serviceMonitors:
    # FALSE: CRD ServiceMonitor (prometheus-operator) TIDAK terpasang di klaster ini; merender
    # objeknya membuat `helm install` gagal ("no matches for kind ServiceMonitor"). Nyalakan setelah
    # prometheus-operator ada. Dulu `true` — tak ketahuan karena produksi tak pernah di-install.
    enabled: false
