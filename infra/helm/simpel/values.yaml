# SIMPEL umbrella chart — default values (staging-shaped).
#
# Override per env via:
#   helm upgrade --install simpel infra/helm/simpel \
#     -f infra/helm/simpel/values-staging.yaml \
#     --namespace simpelv2-staging --create-namespace
#
# Production: pakai values-production.yaml. Untuk credential, render terpisah
# via values-secrets.yaml (gitignored) atau Secreton SecretSync CRD.

global:
  # Image registry resmi: ghcr.io/analisaperlengkapan (personal account).
  # Image path: <registry>/simpelv2-<service> (no nested namespace karena
  # ghcr.io personal account hanya support 1 segment di bawah owner).
  registry: ghcr.io/analisaperlengkapan
  # WAJIB semver immutable (vMAJOR.MINOR.PATCH). Override per-env.
  # Default v0.1.0 = release pertama bertag.
  imageTag: v0.1.0
  imagePullPolicy: IfNotPresent
  imagePullSecrets: [ghcr-pull]
  environment: staging                     # staging | production
  domain: 10.1.7.121
  istioNamespace: istio-system
  # SATU-SATUNYA tempat kelas penyimpanan ditulis. Komponen stateful
  # (postgres/redis/secreton) menurunkannya dari sini; jangan tulis ulang
  # `storageClassName` per-komponen — sebelum 2026-08-18 tiap komponen
  # menulis literal `longhorn`, sehingga knob ini tampak hidup tapi tak
  # pernah menang (`default <global> <literal>` selalu memilih literal).
  #
  # `longhorn-retain` (chart `infra/helm/storage`) = `reclaimPolicy: Retain`
  # + `numberOfReplicas: 2`. Retain membuat PV bertahan saat PVC-nya ikut
  # terhapus — satu-satunya lapisan yang menahan cascade-delete namespace
  # (insiden 2026-06-17). Staging masih menimpanya ke `longhorn`; alasannya
  # ada di values-staging.yaml.
  storageClass: longhorn-retain
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Inject ke common labels & telemetri.
  # Catatan: app.kubernetes.io/managed-by sudah otomatis dirender oleh Helm
  # (= Release.Service), jadi jangan duplikasi di sini.
  labels:
    app.kubernetes.io/part-of: simpelv2

namespace:
  create: true
  name: simpelv2-staging
  istioInjection: enabled
  podSecurityEnforce: privileged           # production tetap privileged sesuai kebijakan
  podSecurityAudit: baseline
  podSecurityWarn: baseline
  annotations:
    description: "SIMPEL Staging Environment"

# Default mTLS — dipakai PeerAuthentication & DestinationRule.
mtls:
  mode: PERMISSIVE                         # production: STRICT
  destinationRules:
    enabled: true
    # Workload tanpa Istio sidecar harus DISABLE mTLS Istio agar plaintext masuk.
    disableForHosts:
      - authenc
      - secreton
      - postgres-primary

# PriorityClass cluster-scoped. Aktifkan satu kali per cluster.
priorityClass:
  enabled: true
  name: simpelv2-default
  value: 100000
  preemptionPolicy: Never
  description: "Default priority for SIMPEL workloads"

# ResourceQuota & LimitRange — aktif di production.
resourceQuota:
  enabled: false
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "20"
    pods: "100"
    services: "30"
    secrets: "50"
    configmaps: "50"
limitRange:
  enabled: false
  container:
    default: { cpu: 500m, memory: 512Mi }
    defaultRequest: { cpu: 100m, memory: 256Mi }
    max: { cpu: "4", memory: 8Gi }
    min: { cpu: 10m, memory: 32Mi }
  pvc:
    max: { storage: 200Gi }
    min: { storage: 1Gi }

# ServiceAccount untuk semua workload aplikasi.
serviceAccounts:
  create: true
  automount: false
  names:
    - authenc
    - secreton
    - layanan-integrasi
    - layanan-perlengkapan
    - portal
    - perlengkapan
    - simpelv1
    - app-2026                               # Static site APP Kejati 2026
    # Nama historis dari era rencana Patroni; postgres yang berjalan = stock
    # `postgres:16-alpine` dan TIDAK memanggil API Kubernetes sama sekali. SA ini
    # sekarang tak terikat Role apa pun (lihat postgres.patroni.enabled) dan
    # token-nya tak di-mount. Namanya dipertahankan agar tak memaksa restart
    # postgres hanya demi kosmetik.
    - postgres-patroni

networkPolicies:
  enabled: true
  defaultDenyIngress: true
  defaultDenyEgress: false                 # production override: true (zero-trust egress)
  allowDnsEgress: true
  allowIstioControlPlaneEgress: true
  # In-cluster egress to backend deps (postgres/secreton/redis/authenc/integrasi).
  # REQUIRED: allowDnsEgress/allowIstioControlPlaneEgress use podSelector:{} which
  # selects ALL pods for Egress → every pod becomes egress-restricted. Without this,
  # backend/identity/simpelv1 pods + migrate hook Jobs cannot reach postgres:5432
  # (silent TCP timeout). Ingress policies remain the per-service least-privilege gate.
  inclusterEgress: true
  allowSecretonAccess: true                # restrict Secreton :8200/:9000 ke SA service tertentu
  allowIngressGateway:
    enabled: true
    ports: [8080, 3010, 3020, 8088, 8200, 50051]
  layananIntegrasiEgress:
    enabled: true                          # akses HTTPS eksternal (SIMAN/MySIMKARI/MonSAKTI)

# Secreton Kubernetes Auth Backend — zero-trust secret architecture.
# OFF default. Aktifkan setelah bootstrap-secreton.sh selesai (Phase A.6).
# Dengan enabled=true, _workload.tpl akan project SA token & set SECRETON_AUTH_METHOD=kubernetes.
secretonAuth:
  enabled: false                           # akan di-flip true setelah bootstrap
  audience: secreton
  tokenTTL: 3600                           # 1 jam, auto-renewable hingga 24x
  # Policy per service — list path glob yang boleh di-read.
  # Map ke ConfigMap secreton-policies (templates/secreton/policies.yaml).
  # Map ke Role di Kubernetes Auth Backend (templates/secreton/auth-config.yaml).
  #
  # KOSAKATA: ini RESOURCE path, bukan URI HTTP dan bukan mount Vault.
  # Secreton mengevaluasi `secret/data/<path>` — hasil normalisasi
  # `/v1/secret/data/<path>` oleh `middleware::resource_path`. Sebelumnya blok
  # ini ditulis `kv/data/...` (penamaan mount Vault, bukan rute Secreton), yang
  # tidak akan pernah cocok dengan apa pun. Belum menggigit karena
  # `enabled: false` — lihat #129/#105.
  #
  # Satu `*` = SATU segmen (`secret/data/simpelv1/*` cocok `.../app`, tidak
  # cocok `.../db/password`). Pakai `**` bila memang ingin seluruh subtree.
  policies:
    authenc:
      - "secret/data/authenc/*"
      - "secret/data/postgres/authenc"
      - "transit/encrypt/authenc-key"
      - "transit/decrypt/authenc-key"
    layanan-integrasi:
      - "secret/data/integrasi/tokens/*"
      - "secret/data/postgres/integrasi"
    layanan-perlengkapan:
      - "secret/data/postgres/perlengkapan"
      - "secret/data/postgres/integrasi"        # read-only ke DB integrasi
      - "secret/data/perlengkapan/notifikasi/*" # SMTP/SMS/WhatsApp creds
    simpelv1:
      - "secret/data/simpelv1/*"
      - "secret/data/postgres/simpelv2"
    # Sidecar gateway simpelv1. Namanya ada di sini karena boundary gRPC kini
    # MENEGAKKAN policy (#129): common name pada sertifikat klien = nama policy,
    # jadi begitu #128 menerbitkan sertifikat untuk gateway, kaller tanpa entri
    # di sini akan ditolak setiap path — terautentikasi tapi tidak berwenang.
    #
    # Gateway bertindak ATAS NAMA simpelv1, maka daftarnya wajib tetap SUBSET
    # policy simpelv1 di atas: proxy tidak boleh menjangkau lebih jauh daripada
    # yang diproksikannya. Write/delete sengaja TIDAK diberikan — template
    # policies.yaml hanya menerbitkan read+list, dan runtime simpelv1 memang
    # hanya membaca (`SecrethonGrpcClient::getSecret`; tulis/hapus tak punya
    # pemanggil).
    gateway:
      - "secret/data/simpelv1/*"
      - "secret/data/simpelv1-app-key"          # nama datar yang dipakai bootstrap CI
      - "secret/data/postgres/simpelv2"
    secreton: []                                # secreton tidak akses dirinya via auth backend

# Bootstrap secrets — chart TIDAK render Secret object kecuali toggle on.
# Default off mengeliminasi bug "apply menimpa secret asli dengan placeholder".
secrets:
  bootstrap: false                         # set true HANYA untuk first-time apply
  postgresCredentials:
    username: simpelv2
    password: ""                           # WAJIB diisi via values-secrets.yaml saat bootstrap
    databases:
      # F5-B topology: authenc + integrasi + perlengkapan SHARE dbsimpelv2
      # (schema-per-service, cross-schema reads). secreton (vault) + simpelv1
      # (legacy) stay isolated on their own databases.
      simpelv2: dbsimpelv2
      simpelv1: dbsimpelv1                 # Laravel monolith DB (legacy simpelv1) — ISOLATED
      secreton: secreton                   # secret manager — ISOLATED
  integration: {}                          # MONSAKTI_*, MYSIMKARI_*, SIMAN_* sebagai key→value
  simpelv1: {}                             # DB_USERNAME / DB_PASSWORD / APP_KEY

# Konfigurasi simpelv2-config ConfigMap.
config:
  rustLog: debug
  appEnvironment: staging
  appName: SIMPEL
  appVersion: "0.1.0"
  postgresDb: simpelv2
  postgresPort: "5432"
  postgresHost: ""                         # default: postgres.<ns>.svc.cluster.local
  redisPort: "6379"
  redisUrl: ""                             # default: redis://redis-service.<ns>.svc.cluster.local:6379
  istioEnabled: "true"
  mtlsMode: ""                             # default: ikut .Values.mtls.mode
  sessionTimeout: "28800"
  portalBaseUrl: http://10.1.7.121
  jwtIssuer: http://10.1.7.121/auth
  webauthn:
    rpId: simpel-staging.kejaksaan.go.id
    rpOrigin: https://simpel-staging.kejaksaan.go.id
    rpName: SIMPEL Kejaksaan RI

backendConfig:
  # Staging serves gRPC without client certificates while the Secreton PKI is
  # being provisioned. values-production.yaml sets "false" → fail-closed.
  grpcAllowInsecure: "true"
  serviceMesh: istio
  mtlsMode: ""                             # default: ikut .Values.mtls.mode
  authencGrpcUrl: ""                       # default: http://authenc.<ns>.svc.cluster.local:9088
  secretonGrpcUrl: ""                      # default: http://secreton.<ns>.svc.cluster.local:9000
  secretonEndpoint: ""                     # default: http://secreton.<ns>.svc.cluster.local:8200
  integrasiGrpcUrl: ""                     # default: http://layanan-integrasi.<ns>.svc.cluster.local:50051
  schedules:
    mysimkari: "0 */15 * * * *"
    siman: "0 */15 * * * *"
    monsakti: "0 */15 * * * *"

# ─── Infrastructure ────────────────────────────────────────────────────────────
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  replicas: 1
  storage:
    size: 20Gi
    accessModes: [ReadWriteOnce]
  # Hook pre/post-backup Velero yang menulis `pg_dumpall` konsisten-logis ke
  # dalam PVC tepat sebelum salinan file-system diambil, lalu membuangnya lagi.
  # Matikan HANYA kalau backup logis sudah dijamin jalur lain — tanpa ini yang
  # ter-backup cuma direktori data crash-consistent.
  # Biaya: sesaat butuh ruang PVC sebesar dump-nya.
  veleroBackupHook:
    enabled: true
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 2Gi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile: { type: RuntimeDefault }
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: [ALL] }
    # Read-only rootfs: postgres writes only to the PGDATA PVC + the
    # postgres-run/tmp emptyDirs mounted in templates/infrastructure/postgres.yaml.
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  istioInjection: false
  init:
    enabled: true                          # render postgres-init-scripts ConfigMap
  # /docker-entrypoint-initdb.d runs ONLY on first init (empty PGDATA). Any volume
  # that already went through that — every existing environment, and every restore
  # from backup — never re-runs it, so a newly added database would silently not
  # exist. This post-install/post-upgrade hook Job creates dbsimpelv1 + secreton
  # idempotently, independent of the image's init mechanism
  # (templates/backend/db-create-job.yaml).
  dbCreateJob:
    enabled: true
  pdb: { enabled: false, minAvailable: 0 }

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  storage:
    size: 5Gi
    accessModes: [ReadWriteOnce]
  maxmemory: 256mb
  maxmemoryPolicy: allkeys-lru
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile: { type: RuntimeDefault }
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: [ALL] }
    # Read-only rootfs: redis persists to the /data PVC; the /tmp emptyDir is
    # mounted in templates/infrastructure/redis.yaml for any scratch writes.
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  istioInjection: false
  pdb: { enabled: false, maxUnavailable: 0 }

authenc:
  enabled: true
  component: identity
  image:
    name: layanan-authenc
    tag: ""                                # fallback ke global.imageTag
  replicas: 1
  # Schema migration via pre-install/pre-upgrade hook Job (out-of-band; authenc
  # never self-migrates → replicas don't race). See backend/authenc-migrate-job.yaml.
  migrationJob:
    enabled: true
  service:
    ports:
      - { name: http,    port: 8088 }
      - { name: grpc,    port: 9088, appProtocol: grpc }
      - { name: metrics, port: 9090 }
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 512Mi }
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerSecurityContext: {}             # baseline dari _security.tpl: drop ALL, no privilege escalation, RO root, runAsNonRoot, seccomp
  probes:
    startup:
      type: http
      path: /health/live
      port: 8088
      periodSeconds: 10
      failureThreshold: 30                 # 300s window untuk cold start
    liveness:
      type: http
      path: /health/live
      port: 8088
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      type: http
      path: /health/ready
      port: 8088
      initialDelaySeconds: 10
      periodSeconds: 5
  env:
    - { name: SERVER_HOST, value: "0.0.0.0" }
    - { name: SERVER_PORT, value: "8088" }
    - { name: GRPC_PORT,   value: "9088" }
    - name: RUST_LOG
      valueFrom: { configMapKeyRef: { name: simpelv2-config, key: RUST_LOG } }
    - name: APP_ENVIRONMENT
      valueFrom: { configMapKeyRef: { name: simpelv2-config, key: APP_ENVIRONMENT, optional: true } }
    - name: REDIS_URL
      valueFrom: { configMapKeyRef: { name: simpelv2-config, key: REDIS_URL, optional: true } }
    - name: WEBAUTHN_RP_ID
      valueFrom: { configMapKeyRef: { name: simpelv2-config, key: WEBAUTHN_RP_ID, optional: true } }
    - name: WEBAUTHN_RP_ORIGIN
      valueFrom: { configMapKeyRef: { name: simpelv2-config, key: WEBAUTHN_RP_ORIGIN, optional: true } }
    - name: WEBAUTHN_RP_NAME
      valueFrom: { configMapKeyRef: { name: simpelv2-config, key: WEBAUTHN_RP_NAME, optional: true } }
    - name: SECRETON_GRPC_URL
      valueFrom: { configMapKeyRef: { name: backend-config, key: SECRETON_GRPC_URL, optional: true } }
    - name: SECRETON_ENDPOINT
      valueFrom: { configMapKeyRef: { name: backend-config, key: SECRETON_ENDPOINT, optional: true } }
    - name: INTEGRASI_GRPC_URL
      valueFrom: { configMapKeyRef: { name: backend-config, key: INTEGRASI_GRPC_URL, optional: true } }
    # F5-B topology: authenc, integrasi, perlengkapan SHARE dbsimpelv2 (key: url),
    # each in its own schema, because perlengkapan reads integrasi.* / authenc.*
    # cross-schema (JOINs + an FK) which only resolves within one database.
    - name: DATABASE_URL
      valueFrom: { secretKeyRef: { name: postgres-credentials, key: url } }
  istioInjection: false                    # authenc tidak pakai sidecar; DR DISABLE
  topologySpreadConstraints:
    enabled: false                         # production override true
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    cpuUtilization: 75
    memoryUtilization: 80
    behavior: {}
  pdb: { enabled: false, minAvailable: 0 }
  priorityClassName: ""                    # default dari simpel.priorityClass
  terminationGracePeriodSeconds: 30
  tmpVolumeSizeLimit: 128Mi
  # Secreton zero-trust auth (fitur opt-in; default off untuk PR fondasi).
  # Diaktifkan setelah Phase A.6 (auth-backend bootstrap) selesai.
  secretonAuth:
    enabled: false
    role: authenc
    audience: secreton
    tokenTTL: 3600

secreton:
  enabled: true
  kind: StatefulSet
  component: secrets
  image:
    name: layanan-secreton
    tag: ""
  replicas: 1
  service:
    headlessName: secreton-headless
    ports:
      - { name: http,    port: 8200 }
      - { name: grpc,    port: 9000, appProtocol: grpc }
      - { name: metrics, port: 9090 }
  # secreton TIDAK punya blok `storage:` — PVC-nya lahir dari
  # `volumeClaimTemplates` di bawah. Blok `storage:` yang dulu di sini
  # (size/storageClassName/accessModes) tak pernah dibaca template mana pun:
  # dua deklarasi bersaing untuk satu PVC, salah satunya umpan. Dihapus 2026-08-18.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerSecurityContext:
    readOnlyRootFilesystem: false           # secreton butuh write ke /data (audit)
  probes:
    startup:
      type: http
      path: /health
      port: 8200
      periodSeconds: 10
      failureThreshold: 30
    liveness:
      type: http
      path: /live
      port: 8200
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
    readiness:
      type: http
      path: /ready
      port: 8200
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
  env:
    - name: RUST_LOG
      valueFrom: { configMapKeyRef: { name: simpelv2-config, key: RUST_LOG } }
    - name: DATABASE_URL
      valueFrom: { secretKeyRef: { name: postgres-credentials, key: secreton-url } }
    - name: POD_NAMESPACE
      valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
    # The gRPC listener refuses to start without mTLS material unless this is
    # "true". Staging says true; production says false (values-production.yaml)
    # so the pod stays down rather than serving secrets to anonymous callers.
    # To turn mTLS on, mount the Secreton PKI material and set
    # GRPC_TLS_CERT_PATH / GRPC_TLS_KEY_PATH / GRPC_TLS_CA_PATH here.
    - name: GRPC_ALLOW_INSECURE
      valueFrom: { configMapKeyRef: { name: backend-config, key: GRPC_ALLOW_INSECURE } }
  volumeMounts:
    - { name: secreton-data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: secreton-data
      spec:
        accessModes: [ReadWriteOnce]
        # storageClassName sengaja dikosongkan: diturunkan dari global.storageClass.
        resources:
          requests:
            storage: 10Gi
  istioInjection: false
  hpa: { enabled: false }
  pdb: { enabled: false, minAvailable: 0 }
  terminationGracePeriodSeconds: 30
  tmpVolumeSizeLimit: 128Mi

# ─── Backend ───────────────────────────────────────────────────────────────────
layananIntegrasi:
  enabled: true
  component: backend
  image:
    name: layanan-integrasi
    tag: ""
  # gRPC server (Deployment) — terima request dari layanan-perlengkapan + admin manual trigger.
  # Scheduler binary dipanggil per-provider via CronJob (lihat .cronjobs di bawah).
  replicas: 1
  # Schema migration via pre-install/pre-upgrade hook Job (out-of-band; integrasi
  # never self-migrates → tables exist before consumers read integrasi.* cross-schema).
  # See backend/integrasi-migrate-job.yaml. Runs before authenc-migrate (hook-weight).
  migrationJob:
    enabled: true
  service:
    ports:
      - { name: grpc, port: 50051, appProtocol: grpc }
      - { name: http, port: 8080 }
  resources:
    requests: { cpu: 50m,   memory: 128Mi }
    limits:   { cpu: 250m,  memory: 256Mi }
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerSecurityContext: {}
  probes:
    startup:                               # connect DB + bind gRPC; migrasi via Job terpisah (integrasi-migrate)
      type: tcp
      port: 50051
      periodSeconds: 10
      failureThreshold: 18                 # ~180s; kalibrasi @staging (F5-E)
    liveness:
      type: tcp
      port: 50051
      initialDelaySeconds: 15
      periodSeconds: 30
    readiness:
      type: tcp
      port: 50051
      initialDelaySeconds: 5
      periodSeconds: 10
  envFrom:
    - secretRef:    { name: integration-secrets }
    - configMapRef: { name: backend-config }
  env:
    - { name: GRPC_HOST, value: "0.0.0.0" }
    - { name: GRPC_PORT, value: "50051" }
    - { name: HTTP_HOST, value: "0.0.0.0" }
    - { name: HTTP_PORT, value: "8080" }
    - { name: STORAGE_TYPE, value: "database" }
    - name: RUST_LOG
      valueFrom: { configMapKeyRef: { name: simpelv2-config, key: RUST_LOG } }
    # Shares dbsimpelv2 (key: url) — its sync writes land where consumers read
    # integrasi.* cross-schema. See authenc note above.
    - name: DATABASE_URL
      valueFrom: { secretKeyRef: { name: postgres-credentials, key: url } }
  istioInjection: true
  istioProxyResources:
    cpu: { request: 50m, limit: 500m }
    memory: { request: 64Mi, limit: 512Mi }
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    cpuUtilization: 75
    memoryUtilization: 80
  pdb: { enabled: false, minAvailable: 0 }
  terminationGracePeriodSeconds: 30
  tmpVolumeSizeLimit: 128Mi
  # CronJob per provider — staging suspend=true, production suspend=false.
  # Schedule berbeda per provider:
  #   - SIMAN:     tiap Minggu pukul 04:00 WIB
  #   - MySIMKARI: tiap 6 jam
  #   - MonSAKTI:  tiap hari pukul 03:00 WIB
  #
  # `command` WAJIB "./scheduler" (relatif WORKDIR /usr/app), BUKAN "scheduler":
  # /usr/app tidak ada di PATH image. `args` WAJIB "--source <p>", BUKAN
  # "--provider=<p>": flag itu tak pernah ada di CLI (bin/scheduler.rs
  # mendefinisikan --source), jadi clap menolaknya dan job gagal.
  cronjobs:
    siman:
      enabled: true
      suspend: true                        # staging: suspend; production override false
      schedule: "0 4 * * 0"                # Minggu 04:00
      timeZone: "Asia/Jakarta"
      command: ["./scheduler"]
      args: ["--source", "siman"]
    mysimkari:
      enabled: true
      suspend: true
      schedule: "0 */6 * * *"              # tiap 6 jam
      timeZone: "Asia/Jakarta"
      command: ["./scheduler"]
      args: ["--source", "mysimkari"]
    monsakti:
      enabled: true
      suspend: true
      schedule: "0 3 * * *"                # setiap hari pukul 03:00 WIB
      timeZone: "Asia/Jakarta"
      command: ["./scheduler"]
      args: ["--source", "monsakti"]
    # Snapshot pemetaan satker (integrasi.mv_satker_code_map_auto) — lihat
    # migrations/004_satker_code_map_materialized.sql. Jadwalnya HARUS lebih
    # rapat dari sync tercepat (MySIMKARI 6 jam) supaya satker yang baru
    # tersinkron tidak "hilang": snapshot basi = pengguna tier satker fail-closed
    # ke NOL baris, bukan sekadar data lama. TIDAK di-suspend di staging — ini
    # tidak memanggil API eksternal mana pun, hanya me-refresh dari data lokal.
    satker-map-refresh:
      enabled: true
      suspend: false
      schedule: "30 */3 * * *"             # tiap 3 jam
      timeZone: "Asia/Jakarta"
      command: ["./integrasi-migrate"]
      args: ["--refresh-satker-map"]
      activeDeadlineSeconds: 600
  cronjobDefaults:
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 1
    concurrencyPolicy: Forbid
    restartPolicy: OnFailure
    activeDeadlineSeconds: 3600            # max 1 jam per run
    backoffLimit: 1

layananPerlengkapan:
  enabled: true
  component: backend
  image:
    name: layanan-perlengkapan
    tag: ""
  replicas: 1
  service:
    ports:
      - { name: http, port: 3020 }
  resources:
    requests: { cpu: 50m,   memory: 128Mi }
    limits:   { cpu: 250m,  memory: 256Mi }
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerSecurityContext: {}
  probes:
    # Tiga probe ini dulu semuanya menunjuk `/health` — endpoint DETAIL yang
    # mengecek DB + Redis + authenc + circuit breaker. Salah untuk dua-duanya:
    # liveness jadi me-restart pod karena DEPENDENSI mati, dan readiness ikut
    # membayar query DB tiap 5 detik. `/health/live` dan `/health/ready` sudah
    # ada di `main.rs` sejak awal, hanya tak pernah dipakai chart. authenc
    # (values.yaml:342-356) memakai pemisahan yang benar; perlengkapan satu-
    # satunya backend yang tidak.
    startup:                               # migrasi refinery jalan SEBELUM bind (main.rs:272 vs :542) → respons HTTP apa pun = migrasi selesai
      type: http
      path: /health/live
      port: 3020
      periodSeconds: 10
      failureThreshold: 30                 # ~300s cold start; kalibrasi dari boot-time nyata @staging (F5-E)
    liveness:                              # BEBAS-dependensi: hanya "proses ini masih melayani?"
      type: http
      path: /health/live
      port: 3020
      initialDelaySeconds: 20
      periodSeconds: 10
    readiness:                             # dependensi keras (DB + authenc) → 503 ⇒ pod dikeluarkan dari LB, TIDAK di-restart
      type: http
      path: /health/ready
      port: 3020
      initialDelaySeconds: 5
      periodSeconds: 5
  env:
    - { name: SERVER_HOST, value: "0.0.0.0" }
    - { name: SERVER_PORT, value: "3020" }
    - name: RUST_LOG
      valueFrom: { configMapKeyRef: { name: simpelv2-config, key: RUST_LOG } }
    - name: AUTHENC_GRPC_URL
      valueFrom: { configMapKeyRef: { name: backend-config, key: AUTHENC_GRPC_URL, optional: true } }
    - name: SECRETON_GRPC_URL
      valueFrom: { configMapKeyRef: { name: backend-config, key: SECRETON_GRPC_URL, optional: true } }
    - name: INTEGRASI_GRPC_URL
      valueFrom: { configMapKeyRef: { name: backend-config, key: INTEGRASI_GRPC_URL, optional: true } }
    # Shares dbsimpelv2 (key: url) — reads integrasi.* / authenc.* cross-schema
    # (no separate INTEGRASI_DATABASE_URL: cross-schema is same-DB). See authenc note.
    - name: DATABASE_URL
      valueFrom: { secretKeyRef: { name: postgres-credentials, key: url } }
    # Dynamic DB credentials (F2H 2H-B). When set, the service issues short-lived
    # creds from Secreton's database secrets engine and renews the lease instead
    # of using the static DATABASE_URL above. Requires Secreton-side setup
    # (ConfigureDatabaseConnection + CreateDatabaseRole) — see infra/AGENTS.md
    # "Rotasi Secret Runtime". Leave unset for the static path.
    # - { name: SECRETON_DB_ROLE, value: "perlengkapan" }
    # - { name: SECRETON_DB_TTL_SECONDS, value: "3600" }
  istioInjection: true
  istioExcludeOutboundPorts: "5432,6379"
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    cpuUtilization: 75
    memoryUtilization: 80
  pdb: { enabled: false, minAvailable: 0 }
  terminationGracePeriodSeconds: 30
  tmpVolumeSizeLimit: 128Mi

simpelv1:
  enabled: true
  image:
    name: simpelv1
    tag: ""
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  appUrl: "https://simpel.kejaksaan.go.id/perlengkapan/simpel/v1"
  env:
    APP_ENV: staging
    APP_DEBUG: "false"
    DB_CONNECTION: pgsql
    DB_HOST: ""                            # default: postgres.<ns>.svc.cluster.local
    DB_PORT: "5432"
    DB_DATABASE: dbsimpelv1
    SESSION_DRIVER: redis
    SESSION_CONNECTION: default
    CACHE_DRIVER: redis
    QUEUE_CONNECTION: sync
    REDIS_HOST: ""                         # default: redis.<ns>.svc.cluster.local
    REDIS_PORT: "6379"
    # Dikirim ke BROWSER sebagai redirect oleh `TokenToOAuthMiddleware`
    # (`return redirect("{portal_url}/login?...")`), jadi ia harus alamat yang
    # bisa dijangkau browser — bukan nama Service di dalam cluster. Nilai lama
    # `http://portal:3000/portal` salah dua kali: browser di luar cluster tak
    # bisa me-resolve `portal`, dan VirtualService pun mengarahkan portal ke
    # port 8080, bukan 3000. Tiap environment menimpanya seperti `appUrl`.
    PORTAL_URL: "http://localhost:3000/portal"
    # All three point at the single gateway sidecar (127.0.0.1:8090); the sidecar
    # fans out to the right upstream gRPC service per path. See simpelv1.gateway.
    AUTHENC_GATEWAY_URL: "http://127.0.0.1:8090"
    INTEGRASI_GATEWAY_URL: "http://127.0.0.1:8090"
    SECRETON_GATEWAY_URL: "http://127.0.0.1:8090"
  # REST→gRPC gateway sidecar (layanan/gateway). Reuses backend-config gRPC URLs.
  gateway:
    enabled: true
    image:
      # `layanan-gateway`, not `gateway`: release.yml publishes each backend as
      # simpelv2-<matrix name>, and the matrix name is the directory under
      # layanan/. Every other backend here already follows that; this one did
      # not, so the chart pulled simpelv2-gateway — an image nothing has ever
      # built. Enforced by infra/scripts/check-chart-release-images.py.
      name: layanan-gateway
      tag: ""
    logLevel: info
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits:   { cpu: 100m, memory: 128Mi }
    containerSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities: { drop: [ALL] }
      seccompProfile: { type: RuntimeDefault }
  dbBackup:
    # source: configMap | secret | none
    # Staging pakai configMap (small dump checked-in), production pakai secret (gitignored).
    source: none
    name: simpelv1-db-backup
  podAntiAffinity:
    type: preferred                        # preferred | required
  podSecurityContext:
    fsGroup: 33
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 33
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: { drop: [ALL] }
  istioInjection: false
  hpa: { enabled: false }
  pdb: { enabled: false, minAvailable: 0 }

# ─── Static Sites ──────────────────────────────────────────────────────────────
# APP-2026: Halaman statis permintaan data APP Tahun 2026 (Kejati + Kejagung).
# Image di-build oleh release.yml/ci.yml dari monolith/APP-2026/Dockerfile →
# ghcr.io/<owner>/simpelv2-app-2026, mengikuti build-once/promote-digest seperti
# service lain (BUKAN registry lokal / tag mutable).
app-2026:
  enabled: false                             # default OFF; di-enable per-env (staging→production)
  component: static-site
  image:
    name: app-2026                            # → <global.registry>/simpelv2-app-2026
    tag: ""                                   # fallback ke global.imageTag (SemVer immutable)
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    ports:
      - { name: http, port: 8080 }
  resources:
    requests: { cpu: 10m,  memory: 32Mi }
    limits:   { cpu: 100m, memory: 64Mi }
  # uid/gid NUMERIK wajib. Chart menyetel `runAsNonRoot: true`, dan kubelet
  # menolak menjalankan container kalau image mendeklarasikan user non-numerik
  # (`USER nginx`): ia tak bisa membuktikan uid-nya bukan 0, jadi pod berhenti
  # di `CreateContainerConfigError` — bukan CrashLoop, jadi tak ada log aplikasi
  # yang menjelaskannya. Terukur 2026-08-25 saat rc25 pertama kali membuat
  # workload ini. 101 = uid nginx di image resmi, sama dengan portal & FE
  # perlengkapan di bawah.
  podSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities: { drop: [ALL] }
  # nginx menulis ke /var/cache/nginx dan /var/run saat start, sementara chart
  # menyetel `readOnlyRootFilesystem: true`. Tanpa dua emptyDir ini nginx mati
  # sebelum melayani apa pun:
  #   [emerg] mkdir() "/var/cache/nginx/client_temp" failed (30: Read-only file system)
  # Sama persis dengan yang sudah dipunyai portal dan FE perlengkapan; app-2026
  # satu-satunya yang terlewat karena ia workload paling baru. Anotasi
  # pengecualian Velero DITURUNKAN dari daftar `volumes` ini oleh
  # `simpel.veleroExcludedVolumes`, jadi tak ada langkah manual menyusul.
  volumeMounts:
    - { name: nginx-cache, mountPath: /var/cache/nginx }
    - { name: nginx-run,   mountPath: /var/run }
  volumes:
    - { name: nginx-cache, emptyDir: {} }
    - { name: nginx-run,   emptyDir: {} }
  probes:
    liveness:
      type: http
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      type: http
      path: /health
      port: 8080
      initialDelaySeconds: 3
      periodSeconds: 5
  istioInjection: false                      # static site, no sidecar
  hpa: { enabled: false }
  pdb: { enabled: false, minAvailable: 0 }

# ─── Frontend ──────────────────────────────────────────────────────────────────
portal:
  enabled: true
  component: frontend
  image:
    name: antarmuka-portal
    tag: ""
  replicas: 1
  service:
    ports:
      - { name: http, port: 8080 }
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }
  podSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  containerSecurityContext: {}
  probes:
    startup:
      type: http
      path: /health
      port: 8080
      periodSeconds: 3
      failureThreshold: 10
    liveness:
      type: http
      path: /health
      port: 8080
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      type: http
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
  env:
    - name: RUST_LOG
      valueFrom: { configMapKeyRef: { name: simpelv2-config, key: RUST_LOG } }
    - { name: APP_NAME, value: "SIMPEL Portal" }
  volumeMounts:
    - { name: nginx-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
    - { name: nginx-cache,  mountPath: /var/cache/nginx }
    - { name: nginx-run,    mountPath: /var/run }
  volumes:
    - name: nginx-config
      configMap: { name: portal-nginx-config }
    - { name: nginx-cache, emptyDir: {} }
    - { name: nginx-run,   emptyDir: {} }
  istioInjection: true
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    cpuUtilization: 75
    memoryUtilization: 80
  pdb: { enabled: false, minAvailable: 0 }
  terminationGracePeriodSeconds: 30
  tmpVolumeSizeLimit: 32Mi
  # CSP `connect-src` host list — diturunkan ke nginx config map.
  csp:
    connectSrc:
      - "'self'"
      - "https://*.kejaksaan.go.id"
      - "http://localhost:*"
      - "https://localhost:*"
      - "http://10.1.7.121:*"
      - "https://10.1.7.121:*"

perlengkapan:
  enabled: true
  component: frontend
  image:
    name: antarmuka-perlengkapan
    tag: ""
  replicas: 1
  service:
    ports:
      - { name: http, port: 8080 }
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }
  podSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
  containerSecurityContext: {}
  probes:
    startup:                               # FE statik (WASM) — boot cepat, startupProbe defensif
      type: http
      path: /health
      port: 8080
      periodSeconds: 5
      failureThreshold: 12                 # ~60s
    liveness:
      type: http
      path: /health
      port: 8080
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      type: http
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
  env:
    - name: RUST_LOG
      valueFrom: { configMapKeyRef: { name: simpelv2-config, key: RUST_LOG } }
  volumeMounts:
    - { name: nginx-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
    - { name: nginx-cache,  mountPath: /var/cache/nginx }
    - { name: nginx-run,    mountPath: /var/run }
  volumes:
    - name: nginx-config
      configMap: { name: perlengkapan-nginx-config }
    - { name: nginx-cache, emptyDir: {} }
    - { name: nginx-run,   emptyDir: {} }
  istioInjection: true
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    cpuUtilization: 75
    memoryUtilization: 80
  pdb: { enabled: false, minAvailable: 0 }
  terminationGracePeriodSeconds: 30

# ─── Istio routing ─────────────────────────────────────────────────────────────
istio:
  gateway:
    enabled: true
    name: simpelv2-gateway
    selector: { istio: ingressgateway }
    hosts: ["*"]
    httpPort: 80
    httpsPort: 443
    httpsRedirect: false
    tls:
      enabled: true
      mode: SIMPLE
      credentialName: simpelv2-tls-secret
  virtualService:
    enabled: true
    name: simpelv2-routes
    hosts: ["*"]
    gatewayRef: ""                         # default: <istioNamespace>/<gateway.name>
    # Set defaultRedirect "" untuk catch-all rewrite, atau "/portal" untuk 302 redirect.
    defaultRedirect: /portal
    # Daftar route di-render in-order. Setiap entry mendukung match.uri.{exact,prefix},
    # rewrite, redirect, route[].destination.{host,port}, timeout, retries, corsPolicy.
    routes:
      - match: { prefix: /api/captcha }
        destination: { host: authenc, port: 8088 }
      - match: { prefix: /api/v1/auth }
        destination: { host: authenc, port: 8088 }
      - match: { prefix: /api/v1/iam }
        destination: { host: authenc, port: 8088 }
      - match: { prefix: /api/v1/oauth2 }
        destination: { host: authenc, port: 8088 }
      - match: { prefix: /api/auth }
        destination: { host: authenc, port: 8088 }
      - match: { prefix: /api/v1/perlengkapan }
        destination: { host: layanan-perlengkapan, port: 3020 }
      - match: { prefix: /perlengkapan/simpel/v1 }
        rewrite: /
        destination: { host: simpelv1, port: 80 }
        timeout: 30s
        retries: { attempts: 3, perTryTimeout: 10s }
      - match: { prefix: /perlengkapan/simpel/v2 }
        rewrite: /
        destination: { host: layanan-perlengkapan, port: 3020 }
        timeout: 30s
        retries: { attempts: 3, perTryTimeout: 10s }
      - match: { prefix: /perlengkapan }
        rewrite: /
        destination: { host: perlengkapan, port: 8080 }
      - match: { prefix: /portal }
        rewrite: /
        destination: { host: portal, port: 8080 }
  destinationRules:
    # Connection-pool & outlier detection per host. Default kosong — staging tidak butuh.
    extra: []

# ─── Observability ─────────────────────────────────────────────────────────────
monitoring:
  serviceMonitors:
    enabled: false                          # aktifkan saat prometheus-operator terpasang
    interval: 30s
    scrapeTimeout: 10s
