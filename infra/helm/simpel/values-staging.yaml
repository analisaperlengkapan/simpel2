# Staging overrides untuk SIMPEL.
#
# Pakai bersama values.yaml:
#   helm upgrade --install simpel infra/helm/simpel \
#     -f infra/helm/simpel/values-staging.yaml \
#     --namespace simpelv2-staging --create-namespace

global:
  environment: staging
  # Tag dipindahkan dari mutable 'stag' ke semver immutable.
  # Override saat helm install via --set global.imageTag=v0.1.0 jika beda dari default.
  imageTag: v0.1.0
  imagePullPolicy: IfNotPresent
  domain: 10.1.7.121
  # Schedule semua workload ke node 'simple02' karena master tidak punya unpigz.
  nodeSelector:
    kubernetes.io/hostname: simple02

namespace:
  name: simpelv2-staging
  istioInjection: enabled

mtls:
  mode: PERMISSIVE

priorityClass:
  name: simpelv2-staging-default
  description: "Default priority for simpelv2 staging workloads (non-preempting)."

config:
  rustLog: debug
  appEnvironment: staging
  portalBaseUrl: http://10.1.7.121
  jwtIssuer: http://10.1.7.121/auth
  webauthn:
    rpId: simpel-staging.kejaksaan.go.id
    rpOrigin: https://simpel-staging.kejaksaan.go.id

backendConfig:
  mtlsMode: PERMISSIVE

# Workload — staging sengaja minimum (1 replica, HPA 1/2, no PDB).
postgres:
  replicas: 1
  storage: { size: 20Gi }
redis: {}
authenc:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 512Mi }
  hpa: { enabled: true, minReplicas: 1, maxReplicas: 2, cpuUtilization: 75, memoryUtilization: 80 }
secreton:
  replicas: 1
layananIntegrasi:
  replicas: 1
  hpa: { enabled: true, minReplicas: 1, maxReplicas: 2, cpuUtilization: 75, memoryUtilization: 80 }
  # CronJob auto-trigger MATI di staging (cegah rate-limit token API yang dipakai bersama
  # production scheduler). Penarikan data dilakukan manual via:
  #   kubectl create job --from=cronjob/layanan-integrasi-mysimkari manual-$(date +%s)
  cronjobs:
    siman:      { suspend: true }
    mysimkari:  { suspend: true }
    monsakti:   { suspend: true }
layananPerlengkapan:
  replicas: 1
  hpa: { enabled: true, minReplicas: 1, maxReplicas: 2, cpuUtilization: 75, memoryUtilization: 80 }
simpelv1:
  enabled: true
  replicas: 2
  appUrl: "http://10.1.7.121/perlengkapan/simpel/v1"
  env:
    APP_ENV: staging
    QUEUE_CONNECTION: sync
    PORTAL_URL: "http://portal:3000/portal"
  # DB sudah ter-initialize di staging postgres-0 via postgres-init job.
  # Skip restore-from-backup init container (butuh ConfigMap simpelv1-db-backup
  # yang berisi SQL dump). Set ke "none" agar init container db-migrate
  # tidak rendered.
  dbBackup:
    source: none
    name: simpelv1-db-backup
portal:
  replicas: 1
  hpa: { enabled: true, minReplicas: 1, maxReplicas: 2, cpuUtilization: 75, memoryUtilization: 80 }
  pdb: { enabled: true, minAvailable: 0 }
perlengkapan:
  replicas: 1
  hpa: { enabled: true, minReplicas: 1, maxReplicas: 2, cpuUtilization: 75, memoryUtilization: 80 }

istio:
  gateway:
    name: simpelv2-dev-gateway          # gateway eksisting di istio-system
    hosts: ["10.1.7.121"]
    httpsRedirect: false
  virtualService:
    name: simpelv2-staging-routes
    hosts: ["10.1.7.121"]
    defaultRedirect: /portal
    routes:
      # CORS untuk auth/captcha — origin = http://10.1.7.121
      - match: { exact: / }
        rewrite: /portal
        destination: { host: portal, port: 8080 }
      - match: { prefix: /api/captcha/ }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        corsPolicy: &cors
          allowOrigins:
            - { exact: "http://10.1.7.121" }
          allowMethods: [POST, GET, OPTIONS]
          allowHeaders: [content-type, authorization]
          maxAge: "86400s"
      - match: { prefix: /captcha/ }
        rewrite: /api/captcha/
        destination: { host: authenc, port: 8088 }
        timeout: 30s
      - match: { prefix: /api/auth/captcha/ }
        rewrite: /api/captcha/
        destination: { host: authenc, port: 8088 }
        timeout: 30s
      # SIMPEL v1 = Laravel monolith. Match prefix DENGAN trailing slash
      # supaya Istio strip `/perlengkapan/simpel/v1/` lengkap (termasuk
      # slash) → remainder `login` (tanpa leading /) → rewrite=`/` produce
      # `/login` (clean, single slash). Pakai rewrite="" akan ditolak
      # Istio validator (must specify URI). Tambah exact-match no-slash
      # variant untuk redirect ke trailing-slash form.
      - match: { exact: /perlengkapan/simpel/v1 }
        redirect: { uri: /perlengkapan/simpel/v1/, code: 308 }
      - match: { prefix: /perlengkapan/simpel/v1/ }
        rewrite: /
        destination: { host: simpelv1, port: 80 }
        timeout: 30s
        retries: { attempts: 3, perTryTimeout: 10s }
      # SIMPEL v2 = antarmuka/perlengkapan (Leptos WASM frontend).
      # Sama target dengan /perlengkapan/ (frontend WASM punya base
      # href=/perlengkapan/), jadi redirect ke canonical path. User-facing URL
      # /perlengkapan/simpel/v2/* di-redirect ke /perlengkapan/* supaya SPA
      # router dengan base /perlengkapan/ tidak mismatch.
      - match: { prefix: /perlengkapan/simpel/v2 }
        redirect: { uri: /perlengkapan/, code: 302 }
      - match: { prefix: /pembinaan/perlengkapan }
        destination: { host: perlengkapan, port: 8080 }
      # Frontend WASM (Leptos). Sama pola dengan simpelv1: prefix dengan
      # trailing slash + rewrite=`/` supaya backend nginx terima clean path
      # (mis. `/dashboard`, `/tailwind.css`) tanpa double-slash.
      - match: { exact: /perlengkapan }
        redirect: { uri: /perlengkapan/, code: 308 }
      - match: { prefix: /perlengkapan/ }
        rewrite: /
        destination: { host: perlengkapan, port: 8080 }
      - match: { prefix: /api/perlengkapan/ }
        rewrite: /api/pembinaan/perlengkapan/
        destination: { host: layanan-perlengkapan, port: 3020 }
        timeout: 30s
      - match: { prefix: /api/pembinaan/perlengkapan }
        destination: { host: layanan-perlengkapan, port: 3020 }
        timeout: 30s
      - match: { prefix: /api/v1/auth }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        retries: { attempts: 3, perTryTimeout: 10s }
        corsPolicy: *cors
      - match: { prefix: /api/v1/iam }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        retries: { attempts: 3, perTryTimeout: 10s }
        corsPolicy: *cors
      - match: { prefix: /api/v1/oauth2 }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        corsPolicy: *cors
      - match: { prefix: /api/v1/captcha }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
      - match: { prefix: /api/v1/clients }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
      - match: { prefix: /api/auth }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        corsPolicy: *cors
      - match: { prefix: /api/secrets }
        rewrite: /v1
        destination: { host: secreton, port: 8200 }
        timeout: 30s
      - match: { exact: /health }
        destination: { host: perlengkapan, port: 8080 }
      # Portal frontend (Leptos WASM) — pakai pola trailing-slash prefix +
      # rewrite=/ untuk hindari `//` paths di backend nginx.
      - match: { exact: /portal }
        redirect: { uri: /portal/, code: 308 }
      - match: { prefix: /portal/ }
        rewrite: /
        destination: { host: portal, port: 8080 }
      - match: { exact: /daskrimti }
        redirect: { uri: /daskrimti/, code: 308 }
      - match: { prefix: /daskrimti/ }
        rewrite: /
        destination: { host: portal, port: 8080 }
