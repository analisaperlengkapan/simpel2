# Staging overrides untuk SIMPEL.
#
# Rilis staging yang hidup merekam 24 nilai `secrets.*` yang TIDAK ADA di
# berkas ini — kredensial Postgres, `APP_KEY`/`DB_PASSWORD` simpelv1, dan token
# MySIMKARI/SIMAN/Monsakti — dipasok saat bootstrap lewat `values-secrets.yaml`
# di luar repo. Yang benar soal itu, diperiksa bukan diduga:
#
# * `helm upgrade -f values-staging.yaml` saja AMAN hari ini. Dibuktikan dengan
#   me-render dua arah (dengan dan tanpa overlay rahasia) lalu mem-diff-nya:
#   **0 objek berbeda**. Sebabnya dua: satu-satunya template Secret ada di
#   balik gerbang `secrets.bootstrap`, yang kini `false` (rilis hidup memuat
#   **0 objek Secret** — Secret di namespace bukan milik Helm), dan nilai yang
#   dipakai DI LUAR gerbang itu kebetulan sama dengan default chart.
# * Yang dipakai di luar gerbang bukan hal sepele:
#   `secrets.postgresCredentials.username` dan `.databases` dibaca oleh
#   StatefulSet postgres, `postgres-init` ConfigMap, `db-create-job`, dan loop
#   tunggu-postgres di KEDUA hook Job migrasi. Kalau suatu hari default chart
#   dan nilai hidup berbeda, hook-nya menunggu user yang salah lalu kehabisan
#   waktu — persis mode gagal revisi 6 di bawah, tapi dengan penyebab yang
#   tak kelihatan.
# * Bahaya yang nyata tapi tertunda: upgrade tanpa overlay MENGHAPUS 24 nilai
#   itu dari rekaman rilis. Orang berikutnya yang menyalakan
#   `secrets.bootstrap=true` mengira kredensial lama masih ada, padahal yang
#   dipakai default chart — dan Secret kredensial Postgres ditulis ulang
#   dengan placeholder.
#
# Karena itu bawa overlay-nya; ia satu perintah dan DITURUNKAN, bukan ditulis
# tangan. "Default-nya kebetulan sama" bukan sesuatu yang dijaga siapa pun.
#
#   # 1. Turunkan overlay carry-forward dari rilis hidup. JANGAN commit.
#   helm get values simpel -n simpelv2-staging -o json \
#     | jq '{secrets: .secrets}' > /run/user/$UID/secrets-carry.yaml
#   # jq, bukan PyYAML: image runner ARC tak punya PyYAML, dan JSON adalah YAML
#   # yang sah — helm menerimanya sebagai `-f` apa adanya.
#
#   # 2. Upgrade: berkas ini otoritatif untuk SEMUA yang bukan rahasia.
#   helm upgrade --install simpel infra/helm/simpel \
#     -f infra/helm/simpel/values-staging.yaml \
#     -f /run/user/$UID/secrets-carry.yaml \
#     --namespace simpelv2-staging --timeout 20m
#
# Kenapa overlay, bukan `--reuse-values`: `--reuse-values` mempertahankan JUGA
# nilai yang sudah DIHAPUS dari berkas ini, jadi ia mesin drift yang sama yang
# menyembunyikan `namespace.create=false` selama delapan revisi. Overlay
# menjaga rahasianya saja dan membiarkan berkas ini jadi kebenaran untuk sisanya.
#
# Tiga hal yang dulu diketik di terminal dan sekarang ada di berkas ini,
# supaya perintah di atas mereproduksi staging apa adanya (rahasia tetap di
# luar repo — yang dicatat di sini hanya nilai non-rahasia):
#
# * `--create-namespace` DIBUANG. Namespace-nya sengaja di luar release —
#   lihat blok `namespace:` di bawah.
# * `--set namespace.create=false` dan `--set postgres.dbCreateJob.enabled=false`
#   kini tertulis di bawah (dulu flag terminal sejak revisi 8).
# * `--timeout 20m` WAJIB, bukan hiasan. Default helm 5 menit, sedangkan hook
#   Job migrasi diberi `activeDeadlineSeconds: 1800`. Revisi 6 (2026-08-25)
#   gagal persis di celah itu: "post-upgrade hooks failed: timed out waiting
#   for the condition" — helm menyerah sementara Job-nya masih berjalan sah,
#   dan release-nya berakhir `failed` lalu harus di-rollback ke revisi 5.
#   Angka helm harus >= jatah Job-nya, bukan sebaliknya.
#
# CATATAN: `--timeout` mengatur berapa lama helm MENUNGGU; ia tidak mengubah
# nilai apa pun, jadi ia bukan sumber drift repo-vs-cluster seperti `--set`.
# Ia ditulis di sini karena perintah yang salah waktunya menggagalkan upgrade
# yang sebenarnya berhasil, dan itu sama mahalnya.

global:
  environment: staging
  # Tag dipindahkan dari mutable 'stag' ke semver immutable.
  #
  # NILAI DI SINI = APA YANG STAGING JALANKAN. Bukan sekadar default: rc24
  # di-deploy dengan `--set global.imageTag=v0.1.0-rc24` sementara baris ini
  # tetap rc22, jadi selama dua bulan repo dan cluster menyebut versi berbeda
  # dan tak ada yang bisa memerahkan itu. Naikkan baris ini di commit yang SAMA
  # dengan yang di-tag, lalu deploy tanpa `--set` supaya keduanya tak bisa
  # menyimpang lagi.
  #
  # Catatan rc22: cosign pasca-build menggagalkan conclusion workflow, tapi
  # docker push seluruh image sukses (diverifikasi `docker manifest inspect`
  # dengan ghcr-pull PAT). Matrix build kini 9 image, bukan 7 — `layanan-gateway`
  # (sidecar simpelv1) dan `app-2026` masuk setelah rc24.
  #
  # rc27 membawa sembilan commit yang belum pernah ada di image mana pun:
  # tiga kolom mati SIMAN (jenis aset, NUP, gap analysis), export PDF yang
  # menyajikan HTML, cronjob sync produksi yang memanggil biner tak terbangun,
  # cache nginx app-2026, scoping monitoring pemakaian BMN per role
  # (#827-#836), dan koreksi arti tier "wilayah": kolom yang dibaca RBAC
  # berisi I/II/III (238 satker), bukan Kejati — sejak rc27 diturunkan dari
  # hierarki MySIMKARI lewat view integrasi 005.
  #
  # rc28 membawa SATU perubahan kode: verifikasi SIMAN sebelum SK mencocokkan
  # aset hanya lewat NUP, padahal NUP hanya unik dalam satu kode barang di satu
  # satker. 44.017 aset di staging ber-NUP `1`, jadi pencocokan itu memilih baris
  # yang salah sembilan kali dari sepuluh (#842). Tiga PR lain yang mendarat
  # bersamanya TIDAK butuh image baru: #840 hanya berkas values ini, #841 dan
  # #843 hanya fixture dan helper e2e.
  #
  # rc29 membawa perbaikan yang membuat rc28 TAK PERNAH terpasang. Upgrade rc28
  # mati di hook `pre-upgrade`: `integrasi-migrate` menerapkan SEMUA migrasi tiap
  # invokasi, dan 003 men-DROP `v_satker_code_map_auto` tanpa syarat sementara
  # 004 mem-materialisasi view itu — jadi runner hanya bisa sukses SEKALI seumur
  # database (#847). Staging karena itu masih menjalankan rc26, bukan rc28.
  # Kedua perbaikan tertanam via `include_str!` ke dalam biner, jadi keduanya
  # BUTUH image baru:
  #   #847  003 mencoba CREATE OR REPLACE dulu, menangkap
  #         `invalid_table_definition`, baru DROP ... CASCADE — sehingga migrasi
  #         konvergen, bukan sekadar berhasil di DB kosong.
  #   #849  hook itu dulu hanya mencetak `db error` dan menahan pesan Postgres
  #         yang SUDAH dikirim server; kini mencetak SQLSTATE + message +
  #         DETAIL/HINT dan memetakan kursor galat ke baris berkas migrasi.
  #
  # Diverifikasi sebelum tag, terhadap BENTUK staging yang sebenarnya (dump
  # schema-only `integrasi` dari postgres-0, bukan DB kosong): 003 lama gagal di
  # sana dengan `cannot drop view ... because other objects depend on it` —
  # kegagalan rc28 persis — sementara migrasi main lulus dua lintasan berturut
  # dan menghasilkan `integrasi.v_satker_wilayah`, view yang belum ada di
  # staging dan dibutuhkan scoping tier wilayah (#838).
  #
  # PR lain yang mendarat bersamanya TIDAK butuh image: #845 (urutan hook Helm)
  # dan #851 (deploy.sh) hanya infra, #846/#848/#850 hanya CI.
  # rc30 membawa sepuluh perubahan kode, delapan di antaranya menutup kebocoran
  # data lintas-satker yang DIUKUR pada rc29 yang sedang berjalan — bukan
  # diduga. Pola yang sama berulang di semuanya: mekanisme yang benar dipasang
  # di satu tempat lalu tidak di sebelahnya.
  #
  #   #869 usulan penghapusan: operator satker lain PUT + DELETE -> 200
  #   #870 pakaian dinas: roster & profil pegawai satker lain dibaca DAN ditulis
  #   #871 pakaian dinas: respons campaign per-satker + laporan nasional bocor
  #   #872 kebutuhan: #93 men-scope satu endpoint, lima saudaranya terbuka —
  #        termasuk PDF analisis satker lain (4.973 byte, terunduh)
  #   #875 pemakaian: DAFTAR ber-scope sejak #66, DETAIL di baliknya tidak;
  #        surat keputusan PDF satker lain tersaji
  #
  # Tiga sisanya memperbaiki endpoint yang tak pernah bisa jalan:
  #   #873 `search/suggestions` gagal PARSE kuerinya sendiri sejak ditulis
  #   #874 `search` panik di baris pertama yang cocok (`panic=abort` = proses
  #        mati); enam kesalahan, termasuk tiga filter menyebut kolom hantu
  #   #876 analisis kelayakan TAK PERNAH membaca SIMAN — klien-nya `Option`
  #        yang tak pernah diisi. ANGKA DI LAYAR ANALISIS AKAN BERUBAH.
  #
  # #866/#867/#868 (readiness authenc, asersi e2e, probe integrasi) sudah
  # mendarat sebelum rc29 di-deploy tetapi belum pernah ada di image mana pun.
  #
  # rc31 = 145 commit sejak rc30, dan ini rilis PERTAMA yang membawa migrasi
  # skema perlengkapan sejak rc30 (V009–V014) serta migrasi integrasi 006.
  # Yang berubah perilakunya:
  #   #1022 satu permohonan pemakaian = daftar BMN (header/detail + supersede);
  #         V014 mengisi ulang baris lama ke bentuk baru (EXPAND saja: tak satu
  #         kolom yang dibaca rc30 dihapus)
  #   #1025 permohonan pemakaian cukup NIP; server mengisi orang + satkernya
  #   #1026 usulan penghapusan: tiap aset di-resolve di SIMAN, nama/nilai dari
  #         body diabaikan, satu aset tak ketemu menolak seluruh usulan
  #   #1027 halaman + API Delegasi Workflow dihapus (tabel dibiarkan)
  #   #1010 authenc menolak token non-refresh di POST /auth/refresh (MFA bypass)
  #   #977  portal meluncurkan SIMPEL v1 dan v2 sebagai aplikasi terpisah
  #   #883/#899/#900 pilih pegawai, aset, dan kodefikasi barang — jangan ketik
  #   #901/#902/#903/#904/#905 pakaian dinas: bisa dimulai, kepala workflow,
  #         foto pegawai tampil dan masuk ke SK
  #   #878/#879/#880/#881 dasbor, satu kosakata status workflow, palet gelap
  #   #882  pencarian pegawai yang tak pernah ketemu siapa pun
  #   #884  dasbor bank aset: lima kueri berurutan atas 624.533 baris (4,2 dtk)
  #         jadi satu lintasan (1,5 dtk), nilainya diverifikasi identik
  #   #909  laporan pakaian dinas: tak lagi meminta kode satker, dan menyebut
  #         apa yang dihitungnya
  # Sisanya: bump dependensi (termasuk penutupan RUSTSEC, #1001) dan CI.
  #
  # ROLLBACK KE rc30 TIDAK AMAN setelah upgrade ini, dua alasan terukur:
  #   * rc30 memakai `abort_missing=true`: V009–V014 tak dikenalnya, perlengkapan
  #     keluar saat start (crash loop).
  #   * V010 (#885) men-DROP penghapusan_bmn.asset_id/satker_id yang MASIH dibaca
  #     kode rc30 — jadi endpoint penghapusan rc30 akan 500 walau bisa nyala.
  # Jalan keluar bila rc31 bermasalah = roll-FORWARD (rc32), atau pulihkan DB
  # dari cadangan sebelum upgrade. Berlaku juga untuk produksi.
  #
  # rc31 TIDAK BOLEH DIPROMOSI. Ia di-deploy ke staging (2026-11-03) dan
  # terbukti: layanan-perlengkapan MATI (restart berulang, exit 139) setiap kali
  # pemanggil ber-cakupan luas (validator_pusat, validator_wilayah, admin)
  # membuka filter Bank Aset. Akarnya satu panic di
  # `bank_aset/repository.rs`: kueri opsi-satker meng-join
  # `v_satker_code_map`, yang memuat 65 satker "siman_only" ber-`kode_satker`
  # NULL; grup NULL itu dibaca sebagai `String`, dan `panic = "abort"` mengubah
  # satu NULL menjadi satu proses mati. CI hijau karena fixture-nya tak punya
  # satker seperti itu — stub `v_satker_code_map` membuang arm-nya.
  #
  # rc32 = rc31 + perbaikan itu saja: satker tanpa identitas MySIMKARI tak lagi
  # menjadi opsi di dropdown kode (tetap tampil di dropdown nama, wilayah, dan
  # total), stub harness kini meniru arm `siman_only`, dan tes baru
  # mereproduksi bentuk data staging (merah di kode lama, hijau di perbaikan).
  # Diverifikasi juga dengan menyapu SEMUA 99 rute GET terhadap salinan data
  # staging sebagai empat peran: rc31 jatuh tepat di tiga panggilan itu dan
  # tidak di tempat lain; rc32 0 dari 420 panggilan 5xx.
  #
  # rc32 di-deploy ke staging dan lulus 188 dari 195 spec dengan akun super asli
  # (baseline rc30: 154/41), Bank Aset terbuka untuk pusat/wilayah/admin, nol
  # restart backend. Tetapi ia TIDAK BOLEH DIPROMOSI JUGA, karena pengujiannya
  # menyingkap satu cacat lagi: `GET /auth/me` macet 10 detik lalu 504 (5 dari 6
  # percobaan, semua akun, tiap halaman portal). authenc memanggil integrasi
  # dua kali berurutan (nama satker, lalu foto pegawai) dan keduanya di-DROP
  # NetworkPolicy: authenc berlabel `component: identity`, simpelv1 hanya
  # `app: simpelv1`, sedangkan `allow-backend-to-integrasi` hanya mengizinkan
  # backend/frontend. Cacat jaringannya lebih tua (dibuat #865), tetapi foto
  # pegawai (#903/#904, di rc31) menggandakan tunggunya melewati batas gateway.
  #
  # rc33 = rc32 + dua perbaikan:
  #   #1031 permohonan pemakaian yang mulai SETELAH izin aktif berakhir boleh
  #         diajukan (layar bilang boleh, server menolak — sejak rc30); form
  #         menanyakan ulang saat periode berubah dan punya keadaan "berurutan"
  #   #1032 authenc dan simpelv1 diizinkan ke integrasi (dan simpelv1 ke authenc);
  #         penjaga NetworkPolicy kini memeriksa per KONSUMEN, bukan "port terbuka
  #         untuk pod mana pun"
  #   (sama PR) dokumen (konsep SK PDF, lampiran) kini di VOLUME, bukan di /tmp pod:
  #         terukur di rc32, unduhan konsep SK menjawab 500 karena berkasnya ada di
  #         pod lain / pod yang sudah diganti (HPA menjalankan 2 replika). Harganya:
  #         HPA backend dimatikan dan strategi Recreate — lihat blok
  #         `layananPerlengkapan` di bawah. Produksi BELUM disentuh.
  #
  # Yang DIKETAHUI dan BELUM diperbaiki (ada sebelum rilis ini, ditemukan saat
  # menguji rc32): dbsimpelv1 kosong (0 tabel), jadi SIMPEL v1 tak melayani halaman
  # apa pun di staging. Inbox notifikasi hanya menampilkan 50 terbaru tanpa halaman
  # berikutnya. Label status `DRAFT`/`CANCELLED` masih mentah di dashboard dan
  # daftar penghapusan.
  imageTag: v0.1.0-rc33
  imagePullPolicy: IfNotPresent
  domain: 10.1.7.121
  # PENGECUALIAN BERTANGGAL (2026-08-18): staging tetap di `longhorn`
  # (reclaimPolicy=Delete), bukan `longhorn-retain` seperti default chart.
  #
  # Bukan karena Delete lebih baik, tapi karena `volumeClaimTemplates` sebuah
  # StatefulSet IMMUTABLE: mengganti kelasnya pada environment yang sudah punya
  # PVC akan membuat `helm upgrade` berikutnya DITOLAK API server, bukan
  # memigrasikan volume. Peralihan dilakukan saat staging di-bootstrap ulang di
  # F5-E (datanya mock/sintetis dan memang di-seed ulang), lalu baris ini dihapus.
  # Production tak punya masalah ini: PVC lamanya `Lost` dan namespace-nya
  # dibangun dari nol di F6-A, jadi lahir langsung di `longhorn-retain`.
  storageClass: longhorn
  # Staging TIDAK dipaku ke satu node (dulu: semua workload ke `simple02` karena
  # "master tidak punya unpigz", warisan migrasi Kustomize→Helm). Dipaku berarti
  # staging tak pernah menguji apa pun yang baru terjadi saat pod jatuh di node
  # kedua: pemasangan volume RWX lewat NFS, jaringan Calico/Istio/NetworkPolicy
  # lintas-node, penarikan image di node itu. Produksi tak dipaku (`nodeSelector:
  # {}`) dan berjalan di dua node yang sama, jadi staging harus sama.
  #
  # Node kedua `simpel.kejaksaan.go.id` (control plane, 48 CPU / 64 GB, ±7%
  # terpakai) sudah menarik image ghcr besar (simpel2-arc-runner, postgres-operator),
  # jadi alasan unpigz tidak terbukti menghalangi. Buktinya baru ada pada rilis
  # pertama sesudah baris ini dihapus: bila penarikan image gagal di node itu, pod
  # macet ImagePullBackOff dan rollout tertahan — kembalikan `nodeSelector` di sini
  # (lewat Helm) lalu selidiki. Efek samping yang diketahui: template pod berubah,
  # jadi postgres/redis/secreton ikut di-restart pada upgrade pertama.

namespace:
  # `create: false` — the namespace object predates this release lineage and stays
  # OUTSIDE the release on purpose. Two incidents argue for it: (a) 2026-06-17,
  # `helm uninstall` cascade-deleted the whole namespace and every PVC in it; (b)
  # adopting a pre-existing object into Helm makes a rollback to an older revision
  # able to rewrite or delete it (that is how staging egress was cut once). The
  # object already carries `helm.sh/resource-policy: keep` from when the chart did
  # template it, so nothing is lost by leaving it out.
  #
  # This line is not new behaviour: staging has run with `--set namespace.create=false`
  # since revision 8. It was only ever a flag typed at the terminal, so the repo said
  # `true` (chart default) while the cluster ran `false` — the same repo-vs-cluster
  # drift that made the chart pull an image nothing built (#837). Written down here so
  # `helm upgrade -f values-staging.yaml`, with no `--set`, reproduces staging exactly.
  create: false
  name: simpelv2-staging
  istioInjection: enabled

mtls:
  mode: PERMISSIVE

priorityClass:
  name: simpelv2-staging-default
  description: "Default priority for simpelv2 staging workloads (non-preempting)."

config:
  rustLog: debug
  appEnvironment: staging
  portalBaseUrl: http://10.1.7.121
  jwtIssuer: http://10.1.7.121/auth
  webauthn:
    rpId: simpel-staging.kejaksaan.go.id
    rpOrigin: https://simpel-staging.kejaksaan.go.id

backendConfig:
  mtlsMode: PERMISSIVE

# Workload — staging sengaja minimum (1 replica, HPA 1/2, no PDB).
postgres:
  replicas: 1
  storage: { size: 20Gi }
  # Off since revision 8, for the same reason as `namespace.create`: it was a
  # `--set` flag the repo never recorded. dbsimpelv2 / dbsimpelv1 / secreton already
  # exist on this instance, so the create hook has nothing left to do.
  dbCreateJob: { enabled: false }
redis: {}
authenc:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 512Mi }
  hpa: { enabled: true, minReplicas: 1, maxReplicas: 2, cpuUtilization: 75, memoryUtilization: 80 }
secreton:
  replicas: 1
layananIntegrasi:
  replicas: 1
  hpa: { enabled: true, minReplicas: 1, maxReplicas: 2, cpuUtilization: 75, memoryUtilization: 80 }
  # CronJob auto-trigger MATI di staging (cegah rate-limit token API yang dipakai bersama
  # production scheduler). Penarikan data dilakukan manual via:
  #   kubectl create job --from=cronjob/layanan-integrasi-mysimkari manual-$(date +%s)
  cronjobs:
    siman:      { suspend: true }
    mysimkari:  { suspend: true }
    monsakti:   { suspend: true }
layananPerlengkapan:
  replicas: 2
  # Dokumen unggahan dan konsep SK disimpan di VOLUME, bukan di /tmp pod, dan
  # volumenya RWX supaya SEMUA replika membaca berkas yang sama.
  #
  # Terukur di staging (rc32): konsep SK PDF ditulis ke /tmp/perlengkapan/docs
  # milik SATU pod; database mencatatnya "sudah dibuat", lalu unduhannya dilayani
  # pod LAIN (HPA menjalankan 2 replika di bawah beban) atau pod yang sudah diganti,
  # dan menjawab 500 `read ...konsep-sk.pdf: No such file or directory`.
  #
  # Versi sebelumnya (rc33) memakai RWO dan MENGUNCI backend ke satu replika tanpa
  # HPA dan dengan strategi Recreate — itu hanya menyembunyikan masalahnya untuk
  # satu replika, dan produksi (HPA 2–8, 3 replika) tak bisa memakainya. Staging kini
  # berjalan seperti produksi: minimal 2 replika dan RollingUpdate.
  #
  # BUKTI: staging tak lagi dipaku ke satu node (lihat `global` di atas) dan
  # `podAntiAffinity: preferred` mendorong kedua replika ke node berbeda, jadi
  # tulis-di-pod-A / baca-di-pod-B ikut melewati pemasangan NFS di node kedua.
  # `preferred`, bukan `required`: dengan 2 node, `required` + surge RollingUpdate
  # = pod ke-3 tak punya tempat dan rollout macet. Scheduler tidak MENJANJIKAN
  # sebaran — periksa node tiap replika setelah deploy, jangan mengandaikan.
  hpa: { enabled: true, minReplicas: 2, maxReplicas: 3, cpuUtilization: 75, memoryUtilization: 80 }
  podAntiAffinity: { type: preferred }
  persistence:
    enabled: true
simpelv1:
  enabled: true
  replicas: 2
  appUrl: "http://10.1.7.121/perlengkapan/simpel/v1"
  env:
    APP_ENV: staging
    QUEUE_CONNECTION: sync
    PORTAL_URL: "http://10.1.7.121/portal"
  # DB sudah ter-initialize di staging postgres-0 via postgres-init job.
  # Skip restore-from-backup init container (butuh ConfigMap simpelv1-db-backup
  # yang berisi SQL dump). Set ke "none" agar init container db-migrate
  # tidak rendered.
  dbBackup:
    source: none
    name: simpelv1-db-backup
portal:
  replicas: 1
  hpa: { enabled: true, minReplicas: 1, maxReplicas: 2, cpuUtilization: 75, memoryUtilization: 80 }
  pdb: { enabled: true, minAvailable: 0 }
perlengkapan:
  replicas: 1
  hpa: { enabled: true, minReplicas: 1, maxReplicas: 2, cpuUtilization: 75, memoryUtilization: 80 }

# ─── Static Sites ──────────────────────────────────────────────────────────────
# Enable di staging dulu (WAJIB staging → promote → production); image = digest
# yang sama dengan production (build-once). Route /APP-2026 ada di bawah.
app-2026:
  enabled: true

istio:
  gateway:
    name: simpelv2-gateway              # shared gateway untuk staging & production (per AGENTS.md)
    # hosts: ["*"] untuk catch-all SNI matching. Per RFC 6066, browser
    # tidak kirim SNI untuk IP-only URL (https://10.1.7.121) — Istio dengan
    # hosts: [10.1.7.121] reject handshake dengan filter_chain_not_found.
    # Pakai wildcard supaya semua SNI (kosong, IP, atau hostname) match.
    hosts: ["*"]
    httpsRedirect: false
  virtualService:
    name: simpelv2-staging-routes
    hosts: ["10.1.7.121"]
    # Hapus defaultRedirect: Istio TIDAK lagi handle redirect dari path
    # tidak match. Per spec user: redirect dilakukan di frontend HTML/JS,
    # bukan di Istio. Path tidak match → 404 (jujur ke user, bukan
    # dialihkan diam-diam).
    defaultRedirect: ""
    routes:
      # Root path / di-route ke portal frontend TANPA rewrite. nginx serve
      # /usr/share/nginx/html/index.html (portal HTML dengan <base href="/portal/">
      # dan JS redirect to /portal). Per spec user: Istio hanya routing, tidak
      # rewrite/redirect — redirect dari / ke /portal dilakukan di portal JS.
      - match: { exact: / }
        destination: { host: portal, port: 8080 }
      - match: { prefix: /api/captcha/ }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        corsPolicy: &cors
          allowOrigins:
            - { exact: "http://10.1.7.121" }
          allowMethods: [POST, GET, OPTIONS]
          allowHeaders: [content-type, authorization]
          maxAge: "86400s"
      - match: { prefix: /captcha/ }
        rewrite: /api/captcha/
        destination: { host: authenc, port: 8088 }
        timeout: 30s
      - match: { prefix: /api/auth/captcha/ }
        rewrite: /api/captcha/
        destination: { host: authenc, port: 8088 }
        timeout: 30s
      # SIMPEL v1 = Laravel monolith. Istio strip prefix → Laravel sees
      # `/login`. Laravel `AppServiceProvider::boot()` panggil
      # `URL::forceRootUrl(APP_URL)` (APP_URL=http://host/perlengkapan/simpel/v1)
      # → helper `redirect('/auth/login')` produce Location header dengan
      # prefix lengkap: `http://host/perlengkapan/simpel/v1/auth/login`. User
      # tetap stay di prefix v1 sesuai routing spec.
      - match: { exact: /perlengkapan/simpel/v1 }
        redirect: { uri: /perlengkapan/simpel/v1/, code: 308 }
      - match: { prefix: /perlengkapan/simpel/v1/ }
        rewrite: /
        destination: { host: simpelv1, port: 80 }
        timeout: 30s
        retries: { attempts: 3, perTryTimeout: 10s }
      # SIMPEL v2 = antarmuka/perlengkapan (Leptos WASM frontend) di
      # canonical path /perlengkapan/simpel/v2/. Frontend WASM di-build
      # dengan `<base href="/perlengkapan/simpel/v2/" />` dan nginx serve
      # dari `/usr/share/nginx/html/perlengkapan/simpel/v2/`. NO rewrite —
      # backend terima path apa adanya.
      - match: { prefix: /perlengkapan/simpel/v2 }
        destination: { host: perlengkapan, port: 8080 }
        timeout: 30s
      # Parent path /perlengkapan/ dan /perlengkapan/simpel/ — frontend
      # nginx serve static index.html dengan meta-refresh ke canonical
      # /perlengkapan/simpel/v2/. Redirect dilakukan di FRONTEND HTML
      # (bukan di Istio) supaya tidak konflik dengan Istio rewrite logic.
      - match: { prefix: /perlengkapan/simpel }
        destination: { host: perlengkapan, port: 8080 }
      - match: { prefix: /perlengkapan }
        destination: { host: perlengkapan, port: 8080 }
      - match: { prefix: /pembinaan/perlengkapan }
        destination: { host: perlengkapan, port: 8080 }
      - match: { prefix: /api/v1/perlengkapan }
        destination: { host: layanan-perlengkapan, port: 3020 }
        timeout: 30s
      - match: { prefix: /api/v1/auth }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        retries: { attempts: 3, perTryTimeout: 10s }
        corsPolicy: *cors
      - match: { prefix: /api/v1/iam }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        retries: { attempts: 3, perTryTimeout: 10s }
        corsPolicy: *cors
      - match: { prefix: /api/v1/oauth2 }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        corsPolicy: *cors
      - match: { prefix: /api/v1/captcha }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
      - match: { prefix: /api/v1/clients }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
      - match: { prefix: /api/auth }
        destination: { host: authenc, port: 8088 }
        timeout: 30s
        corsPolicy: *cors
      - match: { prefix: /api/secrets }
        rewrite: /v1
        destination: { host: secreton, port: 8200 }
        timeout: 30s
      - match: { exact: /health }
        destination: { host: perlengkapan, port: 8080 }
      # Portal frontend (Leptos WASM) — pakai pola trailing-slash prefix +
      # rewrite=/ untuk hindari `//` paths di backend nginx.
      - match: { exact: /portal }
        redirect: { uri: /portal/, code: 308 }
      - match: { prefix: /portal/ }
        rewrite: /
        destination: { host: portal, port: 8080 }
      - match: { exact: /daskrimti }
        redirect: { uri: /daskrimti/, code: 308 }
      - match: { prefix: /daskrimti/ }
        rewrite: /
        destination: { host: portal, port: 8080 }
      # Static site APP-2026 (Kejati + Kejagung). Mirror production route.
      - match: { prefix: /APP-2026 }
        rewrite: /
        destination: { host: app-2026, port: 8080 }
