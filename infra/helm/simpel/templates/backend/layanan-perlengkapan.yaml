{{- if .Values.layananPerlengkapan.enabled }}
{{- $cfg := .Values.layananPerlengkapan -}}
apiVersion: v1
kind: Service
metadata:
  name: layanan-perlengkapan
  namespace: {{ include "simpel.namespace" . }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "layanan-perlengkapan" "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 3020, targetPort: 3020 }
  selector:
    app.kubernetes.io/name: layanan-perlengkapan
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: layanan-perlengkapan
  namespace: {{ include "simpel.namespace" . }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "layanan-perlengkapan" "component" "backend") | nindent 4 }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: layanan-perlengkapan
  template:
    metadata:
      labels:
        {{- include "simpel.componentLabels" (dict "top" . "name" "layanan-perlengkapan" "component" "backend") | nindent 8 }}
      annotations:
        {{- include "simpel.istioPodAnnotations" $cfg | nindent 8 }}
    spec:
      serviceAccountName: layanan-perlengkapan
      {{- if .Values.priorityClass.enabled }}
      priorityClassName: {{ .Values.priorityClass.name }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $cfg.terminationGracePeriodSeconds }}
      {{- include "simpel.imagePullSecrets" . | nindent 6 }}
      {{- include "simpel.nodeSelector" . | nindent 6 }}
      {{- include "simpel.tolerations" . | nindent 6 }}
      securityContext:
        {{- toYaml $cfg.podSecurityContext | nindent 8 }}
      containers:
        - name: perlengkapan-backend
          image: {{ include "simpel.image" (dict "top" . "spec" $cfg.image) }}
          imagePullPolicy: {{ default (include "simpel.imagePullPolicy" .) $cfg.image.pullPolicy }}
          securityContext:
            {{- toYaml $cfg.containerSecurityContext | nindent 12 }}
          ports:
            - { name: http, containerPort: 3020 }
          env:
            - { name: SERVER_HOST, value: "0.0.0.0" }
            - { name: SERVER_PORT, value: "3020" }
            - name: RUST_LOG
              valueFrom: { configMapKeyRef: { name: simpelv2-config, key: RUST_LOG } }
            - name: AUTHENC_GRPC_URL
              valueFrom: { configMapKeyRef: { name: backend-config, key: AUTHENC_GRPC_URL, optional: true } }
            - name: SECRETON_GRPC_URL
              valueFrom: { configMapKeyRef: { name: backend-config, key: SECRETON_GRPC_URL, optional: true } }
            - name: INTEGRASI_GRPC_URL
              valueFrom: { configMapKeyRef: { name: backend-config, key: INTEGRASI_GRPC_URL, optional: true } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: perlengkapan-url } }
            - name: INTEGRASI_DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: integrasi-url } }
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          livenessProbe:
            {{- include "simpel.httpProbe" (dict "path" "/health" "port" 3020 "initialDelay" 20 "period" 10) | nindent 12 }}
          readinessProbe:
            {{- include "simpel.httpProbe" (dict "path" "/health" "port" 3020 "initialDelay" 5 "period" 5) | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ $cfg.tmpVolumeSizeLimit }}
{{- end }}
