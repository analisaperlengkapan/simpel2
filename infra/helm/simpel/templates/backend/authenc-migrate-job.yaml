{{- /*
  authenc schema migration — Helm pre-install/pre-upgrade hook Job.

  authenc does NOT migrate on app startup; schema is applied out-of-band so
  replicas never race. This hook runs the `authenc-migrate` binary (same image
  as the authenc Deployment) BEFORE the Deployment rolls. If it fails, the
  install/upgrade fails (verify-before-bless). Mirrors the docker-compose
  `authenc-migrate` service used locally / in e2e.

  Gate: .Values.authenc.enabled and .Values.authenc.migrationJob.enabled
  (default true when authenc is enabled).
*/ -}}
{{- /* dig: nil-safe on --reuse-values (absent migrationJob block) + honors an
   explicit `enabled: false`, which sprig `default` would treat as empty. */ -}}
{{- if and .Values.authenc.enabled (ne (dig "migrationJob" "enabled" true .Values.authenc) false) }}
{{- $ctx := . -}}
{{- $values := .Values.authenc -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "simpel.fullname" . }}-authenc-migrate
  namespace: {{ include "simpel.namespace" . }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" $ctx "name" "authenc-migrate" "component" "identity") | nindent 4 }}
  annotations:
    # post-install + pre-upgrade — deliberately different phases per lifecycle.
    #
    # FRESH INSTALL must be post-*: postgres and postgres-credentials are normal
    # resources, created BEFORE post-install hooks but AFTER pre-install ones, so
    # a pre-install hook would deadlock waiting for a database that Helm has not
    # created yet.
    #
    # UPGRADE must be pre-*: on an upgrade postgres is already running, and the
    # schema has to land BEFORE the new pods roll out. This used to say
    # post-upgrade, justified as "safe under the expand/contract migration
    # discipline" — but that reverses the guarantee. Expand/contract makes the
    # OLD code tolerate the NEW schema, which is what lets `helm rollback` work
    # without a DB restore (infra/AGENTS.md "Migrasi WAJIB expand/contract").
    # It promises nothing about NEW code meeting OLD schema, and post-upgrade
    # produces exactly that: pods carrying the new image serve traffic during the
    # window before the migration Job runs.
    #
    # A pre-upgrade failure now aborts the upgrade with nothing rolled out, which
    # is the outcome we want: better than shipping code onto a schema that failed
    # to migrate.
    # Weight -5 → After db-create (-20) and integrasi-migrate (-6).
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  # Migrations can take a while on a cold/large DB; give the Job room.
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "simpel.componentLabels" (dict "top" $ctx "name" "authenc-migrate" "component" "identity") | nindent 8 }}
      annotations:
        # No Istio sidecar — a sidecar would never exit and the Job would hang.
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      {{- include "simpel.imagePullSecrets" $ctx | nindent 6 }}
      {{- with (include "simpel.nodeSelector" $ctx) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "simpel.tolerations" $ctx) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- include "simpel.podSecurityContext" $values | nindent 6 }}
      initContainers:
        # Wait for postgres to accept connections (post-install ordering — the
        # postgres pod may not be Ready yet when this hook fires).
        - name: wait-for-postgres
          image: {{ include "simpel.postgresClientImage" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70            # postgres uid in the alpine image
            capabilities:
              drop: [ALL]
          command:
            - /bin/sh
            - -c
            - until pg_isready -h postgres -U {{ .Values.secrets.postgresCredentials.username | quote }} >/dev/null 2>&1; do echo "waiting for postgres"; sleep 2; done
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
      containers:
        - name: authenc-migrate
          image: {{ include "simpel.image" (dict "top" $ctx "spec" $values.image) }}
          imagePullPolicy: {{ default (include "simpel.imagePullPolicy" $ctx) $values.image.pullPolicy }}
          command: ["./authenc-migrate"]
          {{- include "simpel.containerSecurityContext" $values | nindent 10 }}
          env:
            - name: RUST_LOG
              value: "info"
            # Same source as the authenc Deployment (values.yaml authenc.env):
            # shared dbsimpelv2 (F5-B topology), authenc tables in their schema.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 512Mi }
{{- end }}
