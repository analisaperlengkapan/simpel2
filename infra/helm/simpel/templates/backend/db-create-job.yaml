{{- /*
  Database bootstrap — Helm post-install/post-upgrade hook Job.

  WHY (fresh-bootstrap gap #4, 2026-06-17; alasan diperbaiki 2026-08-14):

  `/docker-entrypoint-initdb.d` — tempat ConfigMap `postgres-init-scripts` yang
  meng-CREATE dbsimpelv1 + secreton di samping POSTGRES_DB dbsimpelv2 — hanya
  dijalankan image postgres saat inisialisasi PERTAMA, yaitu ketika PGDATA masih
  kosong. Volume yang sudah pernah melewati itu tidak pernah menjalankannya lagi:
  setiap environment yang sudah hidup, dan setiap restore dari backup. Database
  yang baru ditambahkan ke ConfigMap karena itu diam-diam tak akan pernah ada →
  simpelv1 + secreton gagal connect.

  Job ini membuat database tambahan secara idempotent, lepas dari mekanisme init
  image.

  CATATAN: alasan yang tertulis di sini sebelumnya SALAH — ia menyebut "image
  postgres berbasis Patroni, dan Patroni melewati /docker-entrypoint-initdb.d".
  Image-nya stock `postgres:16-alpine` dan initdb.d memang dijalankan (pada init
  pertama). Job-nya tetap benar dibutuhkan, hanya sebabnya yang keliru — dan
  premis keliru begitulah yang membuat orang berikutnya "membersihkan" hal yang
  masih dipakai.

  Runs as a post-install/post-upgrade hook (NOT pre-install): on a fresh `helm
  install` the postgres StatefulSet + postgres-credentials Secret are normal
  resources created BEFORE post-* hooks, so they exist here; a pre-install hook
  would deadlock (postgres/secret not created yet). The init wait-loop tolerates
  postgres not being Ready yet. Weight -20 → before the migrate hooks (-6/-5).
*/ -}}
{{- /*
  Nil-safe, absent-vs-false-aware gate. `and` does NOT short-circuit in Go
  templates, so this test runs even when postgres is disabled. On a
  `helm upgrade --reuse-values` from a chart revision whose coalesced values
  predate `postgres.dbCreateJob`, that key is absent → a direct
  `.dbCreateJob.enabled` would panic (nil pointer). `dig` traverses safely and
  returns the `true` default ONLY when a key in the path is MISSING — unlike
  sprig `default`, which treats an explicit `enabled: false` as empty and would
  wrongly re-enable the job. So: absent → enabled; `false` → disabled.
*/ -}}
{{- if and .Values.postgres.enabled (ne (dig "dbCreateJob" "enabled" true .Values.postgres) false) }}
{{- $ctx := . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "simpel.fullname" . }}-db-create
  namespace: {{ include "simpel.namespace" . }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" $ctx "name" "db-create" "component" "backend") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "simpel.componentLabels" (dict "top" $ctx "name" "db-create" "component" "database") | nindent 8 }}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      {{- include "simpel.imagePullSecrets" $ctx | nindent 6 }}
      {{- with (include "simpel.nodeSelector" $ctx) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "simpel.tolerations" $ctx) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: db-create
          image: postgres:15-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70            # postgres uid in the alpine image
            capabilities:
              drop: [ALL]
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: {{ .Values.secrets.postgresCredentials.username | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "waiting for postgres..."
              until pg_isready -h "$PGHOST" -U "$PGUSER" >/dev/null 2>&1; do sleep 2; done
              echo "postgres ready; ensuring databases exist"
              {{- range $key, $db := .Values.secrets.postgresCredentials.databases }}
              psql -v ON_ERROR_STOP=1 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ $db }}'" | grep -q 1 \
                || psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE "{{ $db }}";'
              {{- end }}
              echo "db-create complete"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
{{- end }}
