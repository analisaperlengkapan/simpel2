{{- if .Values.authenc.enabled }}
{{- $cfg := .Values.authenc -}}
apiVersion: v1
kind: Service
metadata:
  name: authenc
  namespace: {{ include "simpel.namespace" . }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "authenc" "component" "identity") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: http,    port: 8088, targetPort: 8088 }
    - { name: grpc,    port: 9088, targetPort: 9088 }
    - { name: metrics, port: 9090, targetPort: 9090 }
  selector:
    app.kubernetes.io/name: authenc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authenc
  namespace: {{ include "simpel.namespace" . }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "authenc" "component" "identity") | nindent 4 }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: authenc
  template:
    metadata:
      labels:
        {{- include "simpel.componentLabels" (dict "top" . "name" "authenc" "component" "identity") | nindent 8 }}
      annotations:
        {{- include "simpel.istioPodAnnotations" $cfg | nindent 8 }}
    spec:
      serviceAccountName: authenc
      {{- if .Values.priorityClass.enabled }}
      priorityClassName: {{ .Values.priorityClass.name }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $cfg.terminationGracePeriodSeconds }}
      {{- include "simpel.imagePullSecrets" . | nindent 6 }}
      {{- include "simpel.nodeSelector" . | nindent 6 }}
      {{- include "simpel.tolerations" . | nindent 6 }}
      securityContext:
        {{- toYaml $cfg.podSecurityContext | nindent 8 }}
      containers:
        - name: authenc
          image: {{ include "simpel.image" (dict "top" . "spec" $cfg.image) }}
          imagePullPolicy: {{ default (include "simpel.imagePullPolicy" .) $cfg.image.pullPolicy }}
          securityContext:
            {{- toYaml $cfg.containerSecurityContext | nindent 12 }}
          ports:
            - { containerPort: 8088, name: http }
            - { containerPort: 9088, name: grpc }
            - { containerPort: 9090, name: metrics }
          env:
            - { name: SERVER_HOST, value: "0.0.0.0" }
            - { name: SERVER_PORT, value: "8088" }
            - { name: GRPC_PORT,   value: "9088" }
            - name: RUST_LOG
              valueFrom: { configMapKeyRef: { name: simpelv2-config, key: RUST_LOG } }
            - name: APP_ENVIRONMENT
              valueFrom: { configMapKeyRef: { name: simpelv2-config, key: APP_ENVIRONMENT, optional: true } }
            - name: REDIS_URL
              valueFrom: { configMapKeyRef: { name: simpelv2-config, key: REDIS_URL, optional: true } }
            - name: WEBAUTHN_RP_ID
              valueFrom: { configMapKeyRef: { name: simpelv2-config, key: WEBAUTHN_RP_ID, optional: true } }
            - name: WEBAUTHN_RP_ORIGIN
              valueFrom: { configMapKeyRef: { name: simpelv2-config, key: WEBAUTHN_RP_ORIGIN, optional: true } }
            - name: WEBAUTHN_RP_NAME
              valueFrom: { configMapKeyRef: { name: simpelv2-config, key: WEBAUTHN_RP_NAME, optional: true } }
            - name: SECRETON_GRPC_URL
              valueFrom: { configMapKeyRef: { name: backend-config, key: SECRETON_GRPC_URL, optional: true } }
            - name: SECRETON_ENDPOINT
              valueFrom: { configMapKeyRef: { name: backend-config, key: SECRETON_ENDPOINT, optional: true } }
            - name: INTEGRASI_GRPC_URL
              valueFrom: { configMapKeyRef: { name: backend-config, key: INTEGRASI_GRPC_URL, optional: true } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: authenc-url } }
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          livenessProbe:
            {{- include "simpel.httpProbe" (dict "path" "/health" "port" 8088 "initialDelay" 30 "period" 10) | nindent 12 }}
          readinessProbe:
            {{- include "simpel.httpProbe" (dict "path" "/health" "port" 8088 "initialDelay" 10 "period" 5) | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ $cfg.tmpVolumeSizeLimit }}
{{- end }}
