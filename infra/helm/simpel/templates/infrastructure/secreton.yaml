{{- if .Values.secreton.enabled }}
{{- $cfg := .Values.secreton -}}
apiVersion: v1
kind: Service
metadata:
  name: secreton
  namespace: {{ include "simpel.namespace" . }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "secreton" "component" "secrets") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: http,    port: 8200, targetPort: 8200 }
    - { name: grpc,    port: 9000, targetPort: 9000 }
    - { name: metrics, port: 9090, targetPort: 9090 }
  selector:
    app.kubernetes.io/name: secreton
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: secreton
  namespace: {{ include "simpel.namespace" . }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "secreton" "component" "secrets") | nindent 4 }}
spec:
  serviceName: secreton
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: secreton
  template:
    metadata:
      labels:
        app: secreton
        {{- include "simpel.componentLabels" (dict "top" . "name" "secreton" "component" "secrets") | nindent 8 }}
      annotations:
        {{- include "simpel.istioPodAnnotations" $cfg | nindent 8 }}
    spec:
      serviceAccountName: secreton
      {{- if .Values.priorityClass.enabled }}
      priorityClassName: {{ .Values.priorityClass.name }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $cfg.terminationGracePeriodSeconds }}
      {{- include "simpel.imagePullSecrets" . | nindent 6 }}
      {{- include "simpel.nodeSelector" . | nindent 6 }}
      {{- include "simpel.tolerations" . | nindent 6 }}
      securityContext:
        {{- toYaml $cfg.podSecurityContext | nindent 8 }}
      containers:
        - name: secreton
          image: {{ include "simpel.image" (dict "top" . "spec" $cfg.image) }}
          imagePullPolicy: {{ default (include "simpel.imagePullPolicy" .) $cfg.image.pullPolicy }}
          securityContext:
            {{- toYaml $cfg.containerSecurityContext | nindent 12 }}
          ports:
            - { containerPort: 8200, name: http }
            - { containerPort: 9000, name: grpc }
            - { containerPort: 9090, name: metrics }
          env:
            - name: RUST_LOG
              valueFrom: { configMapKeyRef: { name: simpelv2-config, key: RUST_LOG } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: secreton-url } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          startupProbe:
            {{- include "simpel.httpProbe" (dict "path" "/health" "port" 8200 "initialDelay" 10 "period" 10 "timeout" 3 "successThreshold" 1 "failureThreshold" 30) | nindent 12 }}
          livenessProbe:
            {{- include "simpel.httpProbe" (dict "path" "/live" "port" 8200 "initialDelay" 30 "period" 10 "timeout" 3 "successThreshold" 1 "failureThreshold" 3) | nindent 12 }}
          readinessProbe:
            {{- include "simpel.httpProbe" (dict "path" "/ready" "port" 8200 "initialDelay" 10 "period" 5 "timeout" 3 "successThreshold" 1 "failureThreshold" 3) | nindent 12 }}
          volumeMounts:
            - { name: secreton-data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: secreton-data
      spec:
        accessModes: {{ toYaml $cfg.storage.accessModes | nindent 10 }}
        storageClassName: {{ default .Values.global.storageClass $cfg.storage.storageClassName }}
        resources:
          requests:
            storage: {{ $cfg.storage.size }}
{{- end }}
