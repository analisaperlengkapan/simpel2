{{- if .Values.postgres.enabled }}
{{- $cfg := .Values.postgres -}}
{{- /*
  PENJAGA KERAS — jangan longgarkan tanpa mengganti mesin databasenya.

  Image di sini adalah `postgres:16-alpine` STOCK. Ia tidak punya replikasi,
  tidak punya pemilihan leader, dan StatefulSet ini memberi setiap pod PVC-nya
  SENDIRI lewat volumeClaimTemplate. Jadi `replicas: 3` TIDAK menghasilkan satu
  database ber-HA — ia menghasilkan TIGA database independen yang masing-masing
  menjalankan initdb-nya sendiri.

  Yang membuatnya merusak diam-diam: `DATABASE_URL` semua service menunjuk
  `postgres.<ns>.svc` (Service HEADLESS — lihat simpel.postgresHost), yang
  me-resolve ke SELURUH pod. Koneksi tersebar ke tiga database berbeda: tulis
  mendarat di satu, baca berikutnya di yang lain dan tidak melihatnya; hook
  migrasi memigrasi salah satu saja. Tak ada yang crash — datanya saja yang
  bercabang.

  values-production.yaml sempat menyetel `replicas: 3` (tak pernah ketahuan
  karena produksi belum pernah di-deploy). Digagalkan di sini, bukan sekadar
  dikomentari, karena kesalahannya senyap: pertama kali terasa saat data sudah
  bercabang di produksi.

  Butuh HA postgres sungguhan → pakai operator (CloudNativePG): replikasi
  streaming, failover, dan backup dikelola operatornya, bukan oleh jumlah
  replica di StatefulSet ini.
*/ -}}
{{- if gt (int $cfg.replicas) 1 }}
{{- fail (printf "postgres.replicas=%v: image `postgres` stock tidak mereplikasi — >1 replica = %v database TERPISAH di balik satu Service headless (data bercabang senyap). Setel 1; untuk HA pakai operator CloudNativePG." $cfg.replicas $cfg.replicas) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ include "simpel.namespace" . }}
  labels:
    app: postgres
    {{- include "simpel.componentLabels" (dict "top" . "name" "postgres" "component" "database") | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
  selector:
    app: postgres
    app.kubernetes.io/name: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  namespace: {{ include "simpel.namespace" . }}
  labels:
    app: postgres
    {{- include "simpel.componentLabels" (dict "top" . "name" "postgres" "component" "database") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
  selector:
    app: postgres
    app.kubernetes.io/name: postgres
{{- /*
  Service `postgres-replicas` dibuang 2026-08-14. Ia menyeleksi `role: replica`,
  label yang menurut komentarnya "diberikan saat runtime oleh HA controller" —
  controller yang tak pernah ada. Nol endpoint selamanya, dan nol konsumen di
  seluruh repo.

  Yang perlu diingat: kube-linter MENANGKAPNYA (`dangling-service`), lalu temuan
  itu dibungkam dengan `ignore-check` yang beralasan persis premis palsu tadi.
  Suppression bertarget tetap butuh premis yang benar — kalau tidak, ia hanya
  memindahkan fiksi ke tempat yang tak diperiksa siapa pun.
*/ -}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ include "simpel.namespace" . }}
  labels:
    app: postgres
    {{- include "simpel.componentLabels" (dict "top" . "name" "postgres" "component" "database") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: {{ $cfg.replicas }}
  # SAFETY: never auto-delete the data PVC when the StatefulSet is deleted or
  # scaled down — data outlives the workload object (defense-in-depth alongside
  # the namespace `resource-policy: keep`). Recreate the STS → it re-binds the
  # existing postgres-data-* PVC.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: postgres
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app: postgres
        {{- include "simpel.componentLabels" (dict "top" . "name" "postgres" "component" "database") | nindent 8 }}
      annotations:
        {{- include "simpel.istioPodAnnotations" $cfg | nindent 8 }}
        # postgres-data (PVC) WAJIB ikut; sisanya scratch. Ditulis di sini, bukan
        # diturunkan, karena volume-nya juga ditulis literal di berkas ini —
        # daftarnya duduk di sebelah yang dinamainya.
        backup.velero.io/backup-volumes-excludes: "postgres-run,tmp,{{ include "simpel.veleroIstioVolumes" . }}"
        {{- if (dig "veleroBackupHook" "enabled" true $cfg) }}
        {{- /*
          Backup file-system Velero (kopia) menyalin isi PVC sebagaimana adanya —
          untuk Postgres yang sedang melayani, itu setara mencabut listrik lalu
          menyalin disknya: crash-consistent, biasanya bisa di-recover, tapi tak
          pernah dijanjikan bisa. Hook pre-backup menuliskan `pg_dumpall` yang
          konsisten secara logis KE DALAM PVC (di luar PGDATA) tepat sebelum
          salinan diambil, jadi snapshot yang sama memuat dua jalur pemulihan:
          direktori data mentah, dan dump yang bisa di-restore ke Postgres versi
          mana pun. Hook post-backup membuangnya lagi supaya PVC hidup tidak
          menyimpan salinan kedua selamanya.

          `onError: Fail` disengaja: backup yang diam-diam kehilangan dump-nya
          terlihat persis seperti backup yang sehat, dan itu baru ketahuan saat
          restore — waktu paling buruk untuk menemukannya.
        */}}
        pre.hook.backup.velero.io/container: postgres
        pre.hook.backup.velero.io/timeout: 30m
        pre.hook.backup.velero.io/onError: Fail
        pre.hook.backup.velero.io/command: >-
          ["/bin/sh","-c","set -eu; d=/var/lib/postgresql/data/backup; mkdir -p \"$d\";
          PGPASSWORD=\"${POSTGRES_PASSWORD:-}\" pg_dumpall -U \"$POSTGRES_USER\"
          -h /var/run/postgresql > \"$d/dumpall.sql.tmp\";
          mv \"$d/dumpall.sql.tmp\" \"$d/dumpall.sql\""]
        post.hook.backup.velero.io/container: postgres
        post.hook.backup.velero.io/timeout: 5m
        post.hook.backup.velero.io/onError: Continue
        post.hook.backup.velero.io/command: >-
          ["/bin/sh","-c","rm -f /var/lib/postgresql/data/backup/dumpall.sql
          /var/lib/postgresql/data/backup/dumpall.sql.tmp"]
        {{- end }}
    spec:
      serviceAccountName: postgres-patroni
      # Postgres tidak memanggil API Kubernetes sama sekali, jadi token SA-nya
      # tak perlu ada di dalam pod. Menyamakan dengan authenc/integrasi/
      # perlengkapan/portal/secreton yang semuanya sudah `false`; postgres
      # tertinggal dan justru ia yang paling tak butuh.
      automountServiceAccountToken: false
      {{- if .Values.priorityClass.enabled }}
      priorityClassName: {{ .Values.priorityClass.name }}
      {{- end }}
      {{- include "simpel.imagePullSecrets" . | nindent 6 }}
      {{- include "simpel.nodeSelector" . | nindent 6 }}
      {{- include "simpel.tolerations" . | nindent 6 }}
      securityContext:
        {{- toYaml $cfg.podSecurityContext | nindent 8 }}
      {{- with $cfg.podAntiAffinity }}
      affinity:
        {{- include "simpel.podAntiAffinity" (dict "name" "postgres" "type" .type) | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ include "simpel.image" (dict "top" . "spec" $cfg.image) }}
          imagePullPolicy: {{ default (include "simpel.imagePullPolicy" .) $cfg.image.pullPolicy }}
          securityContext:
            {{- toYaml $cfg.containerSecurityContext | nindent 12 }}
          ports:
            # 5432 saja. Port 8008 (`patroni`) pernah dideklarasikan di sini dan
            # tak pernah ada yang mendengarkannya — image ini stock postgres.
            - { containerPort: 5432, name: postgres }
          env:
            - { name: POSTGRES_USER, value: {{ .Values.secrets.postgresCredentials.username | quote }} }
            - { name: POSTGRES_DB,   value: {{ index .Values.secrets.postgresCredentials.databases "simpelv2" | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
                  optional: true
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            {{- if $cfg.init.enabled }}
            # Only secreton keeps a dedicated DB role (F5-B topology); the
            # dbsimpelv2 trio connects as the POSTGRES_USER superuser.
            - name: SECRETON_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password, optional: true } }
            {{- end }}
          volumeMounts:
            - { name: postgres-data, mountPath: /var/lib/postgresql/data }
            # Writable scratch for readOnlyRootFilesystem: the unix socket dir
            # and /tmp (temp/sort files). PGDATA lives on the PVC above.
            - { name: postgres-run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
            {{- if $cfg.init.enabled }}
            - { name: init-scripts, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            {{- end }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: [/bin/sh, -c, pg_isready -U "$POSTGRES_USER"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: [/bin/sh, -c, pg_isready -U "$POSTGRES_USER"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if $cfg.init.enabled }}
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
            defaultMode: 0755
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: {{ toYaml $cfg.storage.accessModes | nindent 10 }}
        storageClassName: {{ default .Values.global.storageClass $cfg.storage.storageClassName }}
        resources:
          requests:
            storage: {{ $cfg.storage.size }}
{{- end }}
