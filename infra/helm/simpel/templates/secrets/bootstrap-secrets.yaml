{{- if .Values.secrets.bootstrap }}
{{- /*
  Bootstrap-only Secret rendering. Defaultnya OFF.
  Aktifkan saat first-install:
    helm install ... -f values-secrets.yaml --set secrets.bootstrap=true
  Setelah Secreton SecretSync ber-jalan, matikan kembali agar helm tidak menimpa
  secret rotasi yang dikelola operator.
*/}}
{{- $pg := .Values.secrets.postgresCredentials -}}
{{- if not $pg.password }}
{{- fail "secrets.bootstrap=true butuh secrets.postgresCredentials.password (gunakan values-secrets.yaml)" }}
{{- end }}
{{- $ns := include "simpel.namespace" . -}}
{{- $host := include "simpel.postgresHost" . -}}
{{- $user := $pg.username -}}
{{- $pass := $pg.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "simpelv2" "component" "database") | nindent 4 }}
type: Opaque
stringData:
  username: {{ $user | quote }}
  password: {{ $pass | quote }}
  # F5-B topology: authenc + integrasi + perlengkapan share dbsimpelv2 (url),
  # each in its own schema (cross-schema reads/FK). secreton stays isolated.
  url: {{ printf "postgres://%s:%s@%s:5432/%s" $user $pass $host $pg.databases.simpelv2 | quote }}
  secreton-url: {{ printf "postgres://%s:%s@%s:5432/%s" $user $pass $host $pg.databases.secreton | quote }}
{{- with .Values.secrets.integration }}
---
apiVersion: v1
kind: Secret
metadata:
  name: integration-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" $ "name" "layanan-integrasi" "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if .Values.simpelv1.enabled }}
{{- with .Values.secrets.simpelv1 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: simpelv1-secrets
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: simpelv1
    {{- include "simpel.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
