{{- /*
  Kunci penanda-tangan JWT authenc (Secret `authenc-jwt`, key `JWT_SECRET`).

  KENAPA ADA: authenc menandatangani dan memverifikasi token dengan SATU kunci
  Ed25519. Tanpa JWT_SECRET tiap proses mengundi kuncinya sendiri, sehingga token
  yang diterbitkan replika A ditolak replika B ("Token validation failed" — gagal
  atau lolos bergantung pod mana yang menjawab) dan setiap restart/rollout membuat
  semua sesi tak berlaku. rc40 di staging memperlihatkannya: HPA authenc naik ke
  dua replika di tengah e2e dan token yang baru diterbitkan ditolak. Chart tak
  pernah menyuplai variabel itu; authenc hanya mencatat "not for production".

  SUMBER NILAI, urutan prioritas:
    1. `secrets.authencJwtSecret` (64 karakter hex) — operator yang memegang kunci
       (produksi: berkas values-secrets di luar repo). Mengubahnya = rotasi.
    2. Secret yang SUDAH ADA di klaster (`lookup`) dipakai apa adanya, jadi
       `helm upgrade` biasa tidak merotasi kunci dan tidak memutus sesi.
    3. Bila keduanya tak ada (instalasi pertama): diundi di sini, 256-bit.
  (`helm template`/`--dry-run` tak punya klaster, jadi di sana selalu undian baru.)

  `helm.sh/resource-policy: keep`: Secret ini tak boleh ikut terhapus oleh
  rollback ke revisi sebelum Secret ini ada, atau oleh uninstall — itu akan
  mencabut semua sesi dan membuat pod berikutnya mengundi kunci baru.

  ROTASI: hapus Secret `authenc-jwt` (atau isi `secrets.authencJwtSecret` baru),
  `helm upgrade`, lalu restart authenc. Semua sesi aktif berakhir — pengguna login
  ulang.
*/ -}}
{{- $ns := include "simpel.namespace" . -}}
{{- $existing := lookup "v1" "Secret" $ns "authenc-jwt" -}}
{{- $key := "" -}}
{{- if .Values.secrets.authencJwtSecret -}}
  {{- $key = .Values.secrets.authencJwtSecret -}}
{{- else if and $existing $existing.data (hasKey $existing.data "JWT_SECRET") -}}
  {{- $key = index $existing.data "JWT_SECRET" | b64dec -}}
{{- else -}}
  {{- /* sha256sum = 64 karakter hex dari 380 bit undian; authenc menuntut 32 byte hex */ -}}
  {{- $key = sha256sum (randAlphaNum 64) -}}
{{- end -}}
{{- if not (regexMatch "^[0-9a-f]{64}$" $key) -}}
  {{- fail "secrets.authencJwtSecret harus 64 karakter hex huruf kecil (32 byte): `openssl rand -hex 32`" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: authenc-jwt
  namespace: {{ $ns }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "authenc" "component" "backend") | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ $key | b64enc }}
