{{- /*
  Kunci penanda-tangan JWT secreton (Secret `secreton-jwt`, key `JWT_SECRET`).

  KENAPA ADA: `ApiConfig::from_bootstrap_and_application` dulu hanya memetakan
  listener + storage; `auth.jwt.secret` tetap nilai `Default` —
  literal `change-this-secret-in-production` yang tercetak di source tree.
  Karena `validate_token` menerima `token_type:"root"` tanpa memeriksa policy
  store, siapa pun yang bisa menjangkau port HTTP dapat menempa token root dan
  membaca/menimpa SEMUA secret. `SECRETON_JWT_SECRET` didokumentasikan tetapi
  tidak pernah dibaca kode; kini dibaca (`apply_env_overrides`) dan
  diwajibkan di staging/produksi (`ApiConfig::validate_secrets`).

  SUMBER NILAI, urutan prioritas (sama dengan authenc-jwt.yaml):
    1. `secrets.secretonJwtSecret` — operator yang memegang kunci (produksi:
       berkas values-secrets di luar repo). Mengubahnya = rotasi.
    2. Secret yang SUDAH ADA di klaster (`lookup`) dipakai apa adanya, jadi
       `helm upgrade` biasa tidak merotasi kunci.
    3. Bila keduanya tak ada (instalasi pertama): diundi di sini, 256-bit.

  `helm.sh/resource-policy: keep`: Secret ini tak boleh ikut terhapus oleh
  rollback/uninstall — itu akan mencabut semua sesi dan membuat pod berikutnya
  mengundi kunci baru.

  ROTASI: ganti `secrets.secretonJwtSecret`, `helm upgrade`, lalu restart
  secreton. Semua token aktif (termasuk root) berakhir.
*/ -}}
{{- if .Values.secrets.bootstrap -}}
{{- $ns := include "simpel.namespace" . -}}
{{- $existing := lookup "v1" "Secret" $ns "secreton-jwt" -}}
{{- $key := .Values.secrets.secretonJwtSecret -}}
{{- if not $key -}}
  {{- if and $existing $existing.data (hasKey $existing.data "JWT_SECRET") -}}
    {{- $key = index $existing.data "JWT_SECRET" | b64dec -}}
  {{- else -}}
    {{- fail "secrets.bootstrap=true butuh secrets.secretonJwtSecret (64 karakter hex, `openssl rand -hex 32`). Chart tidak mengundi kunci root sendiri: kunci ini menandatangani token root, jadi tidak boleh berasal dari rilis Helm." -}}
  {{- end -}}
{{- end -}}
{{- if not (regexMatch "^[0-9a-f]{64}$" $key) -}}
  {{- fail "secrets.secretonJwtSecret harus 64 karakter hex huruf kecil (32 byte): `openssl rand -hex 32`" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: secreton-jwt
  namespace: {{ $ns }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "secreton" "component" "secrets") | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ $key | b64enc }}
{{- end }}
