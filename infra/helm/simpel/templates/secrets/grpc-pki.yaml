{{- /*
  PKI untuk mTLS gRPC — hanya bila backendConfig.grpcTls.enabled.

  Menerbitkan satu CA (Secret `grpc-pki-ca`) dan satu Secret per identitas
  (`grpc-tls-<nama>`: tls.crt, tls.key, ca.crt). Kunci privat sebuah workload hanya
  dipasang ke workload itu.

  STABIL ANTAR UPGRADE: tiap render lebih dulu mencari Secret yang sudah ada
  (`lookup`) dan memakainya apa adanya; sertifikat baru hanya diterbitkan untuk yang
  belum ada. Tanpa ini setiap `helm upgrade` menerbitkan ulang semuanya dan memutus
  koneksi sampai semua pod restart. (`helm template`/`--dry-run` tidak punya klaster,
  jadi di sana selalu terbit baru — wajar.)

  ROTASI: hapus Secret `grpc-pki-ca` dan `grpc-tls-*`, `helm upgrade`, lalu
  `kubectl rollout restart` workload yang memasangnya (berkas dibaca saat start).
  Masa berlaku: CA caValidityDays, daun certValidityDays — catat tanggalnya;
  sertifikat yang kedaluwarsa memutus hop ini tanpa pesan yang jelas.

  Identitas yang `serves` mendapat SAN: <svc>, <svc>.<ns>, <svc>.<ns>.svc,
  <svc>.<ns>.svc.cluster.local — klien memverifikasi nama pada URL-nya. Sertifikat
  dipakai dua arah (sprig genSignedCert menaruh serverAuth + clientAuth).
*/ -}}
{{- if dig "grpcTls" "enabled" false .Values.backendConfig }}
{{- $g := .Values.backendConfig.grpcTls -}}
{{- $ns := include "simpel.namespace" . -}}
{{- $caSecret := lookup "v1" "Secret" $ns "grpc-pki-ca" -}}
{{- $ca := dict -}}
{{- if and $caSecret $caSecret.data (hasKey $caSecret.data "ca.crt") (hasKey $caSecret.data "ca.key") -}}
  {{- $ca = buildCustomCert (index $caSecret.data "ca.crt") (index $caSecret.data "ca.key") -}}
{{- else -}}
  {{- $ca = genCA "simpelv2-grpc-ca" (int $g.caValidityDays) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: grpc-pki-ca
  namespace: {{ $ns }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "grpc-pki" "component" "pki") | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  ca.key: {{ $ca.Key | b64enc }}
{{- range $name, $id := $g.identities }}
{{- $existing := lookup "v1" "Secret" $ns (printf "grpc-tls-%s" $name) -}}
{{- $crt := "" -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "tls.crt") (hasKey $existing.data "tls.key") -}}
  {{- $crt = index $existing.data "tls.crt" -}}
  {{- $key = index $existing.data "tls.key" -}}
{{- else -}}
  {{- $sans := list $name -}}
  {{- with $id.serves }}
    {{- $sans = concat $sans (list . (printf "%s.%s" . $ns) (printf "%s.%s.svc" . $ns) (printf "%s.%s.svc.cluster.local" . $ns)) -}}
  {{- end -}}
  {{- $leaf := genSignedCert $name nil (uniq $sans) (int $g.certValidityDays) $ca -}}
  {{- $crt = $leaf.Cert | b64enc -}}
  {{- $key = $leaf.Key | b64enc -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "grpc-tls-%s" $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" $ "name" "grpc-pki" "component" "pki") | nindent 4 }}
type: Opaque
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
{{- end }}
