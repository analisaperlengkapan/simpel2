{{/*
  ServiceAccounts per komponen.
  - Anotasi `secreton.simpel.io/role` dipakai oleh bootstrap-secreton.sh untuk
    membuat role di Kubernetes Auth Backend (lihat templates/secreton/auth-config.yaml).
  - automountServiceAccountToken default false (token di-project explicit via _workload.tpl
    saat `secretonAuth.enabled=true`).
*/}}

{{- $secretonRoles := default (dict) (default (dict) .Values.secretonAuth).policies -}}

{{- if .Values.serviceAccounts.create }}
{{- range .Values.serviceAccounts.names }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  namespace: {{ include "simpel.namespace" $ }}
  labels:
    app.kubernetes.io/name: {{ . }}
    {{- include "simpel.labels" $ | nindent 4 }}
  annotations:
    {{- if hasKey $secretonRoles . }}
    secreton.simpel.io/role: {{ . | quote }}
    secreton.simpel.io/audience: {{ default "secreton" $.Values.secretonAuth.audience | quote }}
    {{- end }}
automountServiceAccountToken: {{ $.Values.serviceAccounts.automount }}
{{- end }}
{{- end }}

{{- /*
  Postgres-patroni Role/RoleBinding — diperlukan agar Patroni bisa patch endpoints.
*/}}
{{- if and .Values.postgres.enabled .Values.serviceAccounts.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-patroni
  namespace: {{ include "simpel.namespace" . }}
  labels:
    app.kubernetes.io/name: postgres
    {{- include "simpel.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods"]
    verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-patroni
  namespace: {{ include "simpel.namespace" . }}
  labels:
    app.kubernetes.io/name: postgres
    {{- include "simpel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-patroni
subjects:
  - kind: ServiceAccount
    name: postgres-patroni
    namespace: {{ include "simpel.namespace" . }}
{{- end }}

{{- /*
  ClusterRoleBinding untuk Secreton SA agar bisa call TokenReview API.
  Required untuk Kubernetes Auth Backend di Secreton (verify SA token client).
*/}}
{{- if and .Values.secreton.enabled (default (dict) .Values.secretonAuth).enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "simpel.namespace" . }}-secreton-tokenreview
  labels:
    app.kubernetes.io/name: secreton
    {{- include "simpel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: secreton
    namespace: {{ include "simpel.namespace" . }}
{{- end }}
