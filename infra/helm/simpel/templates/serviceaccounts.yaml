{{/*
  ServiceAccounts per komponen.
  - Anotasi `secreton.simpel.io/role` dipakai oleh bootstrap-secreton.sh untuk
    membuat role di Kubernetes Auth Backend (lihat templates/secreton/auth-config.yaml).
  - automountServiceAccountToken default false (token di-project explicit via _workload.tpl
    saat `secretonAuth.enabled=true`).
*/}}

{{- $secretonRoles := default (dict) (default (dict) .Values.secretonAuth).policies -}}

{{- if .Values.serviceAccounts.create }}
{{- range .Values.serviceAccounts.names }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  namespace: {{ include "simpel.namespace" $ }}
  labels:
    app.kubernetes.io/name: {{ . }}
    {{- include "simpel.labels" $ | nindent 4 }}
  annotations:
    {{- if hasKey $secretonRoles . }}
    secreton.simpel.io/role: {{ . | quote }}
    secreton.simpel.io/audience: {{ default "secreton" $.Values.secretonAuth.audience | quote }}
    {{- end }}
automountServiceAccountToken: {{ $.Values.serviceAccounts.automount }}
{{- end }}
{{- end }}

{{- /*
  TIDAK ADA Role/RoleBinding untuk postgres — DISENGAJA.

  Sampai 2026-08-14 di sini ada Role `postgres-patroni` yang memberi
  endpoints + pods dengan verb LENGKAP (termasuk delete), beralasan "agar
  Patroni bisa patch endpoints". Patroni tidak pernah ada: image-nya stock
  `postgres:16-alpine` (values.yaml), dan diverifikasi di staging — tak ada
  biner patroni, tak ada konfigurasinya, kontainer hanya mendengarkan 5432.

  Yang tersisa hanyalah privilege-nya. Menulis ulang `endpoints` = mengarahkan
  ulang lalu lintas Service mana pun di namespace ini (mis. mengarahkan endpoint
  authenc ke pod penyerang), dan `delete pods` = mematikan beban apa pun. Itu
  dipegang oleh kontainer basis data, yang tak pernah memanggil API Kubernetes.

  Hari ini cluster berjalan `--authorization-mode=AlwaysAllow` (#124) sehingga
  Role ini tak menambah apa pun — tapi begitu RBAC dinyalakan, ia langsung jadi
  pemberian paling berbahaya di namespace, melindungi kemampuan yang tak ada.

  Bila kelak benar-benar butuh HA postgres, jalurnya BUKAN menghidupkan kembali
  blok ini melainkan operator (CloudNativePG) yang membawa RBAC-nya sendiri.
*/}}

{{- /*
  ClusterRoleBinding untuk Secreton SA agar bisa call TokenReview API.
  Required untuk Kubernetes Auth Backend di Secreton (verify SA token client).
*/}}
{{- if and .Values.secreton.enabled (default (dict) .Values.secretonAuth).enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "simpel.namespace" . }}-secreton-tokenreview
  labels:
    app.kubernetes.io/name: secreton
    {{- include "simpel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: secreton
    namespace: {{ include "simpel.namespace" . }}
{{- end }}
