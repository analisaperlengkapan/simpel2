{{- /*
  ConfigMap berisi script fetch-secrets.sh untuk init container simpelv1.
  Script asli ada di monolith/simpelv1/fetch-secrets.sh — disinkronkan via tpl.
  Script ini dipanggil saat pod start untuk fetch secret dari Secreton & generate .env.

  Hanya dirender saat .Values.secretonAuth.enabled = true.
*/ -}}
{{- if (default (dict) .Values.secretonAuth).enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: simpelv1-fetch-secrets
  namespace: {{ include "simpel.namespace" . }}
  labels:
    app.kubernetes.io/name: simpelv1
    app.kubernetes.io/component: init-fetch-secrets
    {{- include "simpel.labels" . | nindent 4 }}
data:
  fetch-secrets.sh: |
{{ .Files.Get "files/fetch-secrets.sh" | indent 4 }}
{{- end }}
