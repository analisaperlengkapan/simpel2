{{- if .Values.portal.enabled }}
{{- $cspConnect := join " " .Values.portal.csp.connectSrc -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-nginx-config
  namespace: {{ include "simpel.namespace" . }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "portal" "component" "frontend") | nindent 4 }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        sendfile        on;
        keepalive_timeout  65;
        # Fix double-slash paths (Istio strips /portal prefix leaving // in requests)
        merge_slashes on;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json application/wasm;

        # Common security headers reused per location (add_header tidak diwarisi).
        map $sent_http_content_type $simpel_csp {
            default "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src {{ $cspConnect }}; font-src 'self'; frame-ancestors 'self'";
        }

        # Sama dengan perlengkapan: cegah nginx leak port internal 8080 ke
        # Location header saat directory auto-redirect.
        port_in_redirect off;
        absolute_redirect off;

        server {
            listen 8080;
            listen [::]:8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "0" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy $simpel_csp always;

            location / {
                try_files $uri $uri/ /index.html;
            }

            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                expires 0;
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-XSS-Protection "0" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
                add_header Content-Security-Policy $simpel_csp always;
            }

            location ~* \.(wasm|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-XSS-Protection "0" always;
                add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
                add_header Content-Security-Policy $simpel_csp always;
            }

            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
{{- end }}
{{- if .Values.perlengkapan.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: perlengkapan-nginx-config
  namespace: {{ include "simpel.namespace" . }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "perlengkapan" "component" "frontend") | nindent 4 }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        sendfile        on;
        keepalive_timeout  65;
        # Penting: matikan merge_slashes supaya path `/perlengkapan//x`
        # tetap mismatch (browser yang request `//` dapat 404 jelas) dan
        # tidak silently di-normalize ke single-slash. Path normalization
        # diserahkan ke Istio rewrite + base href client-side.
        merge_slashes on;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json application/wasm;

        # Penting: matikan port_in_redirect + absolute_redirect supaya nginx
        # tidak leak port internal 8080 ke Location header saat directory
        # auto-redirect (mis. /perlengkapan -> /perlengkapan/). Tanpa ini,
        # browser dapat 301 ke http://host:8080/... yang ERR_CONNECTION_REFUSED
        # karena port 8080 tidak exposed di Istio gateway.
        port_in_redirect off;
        absolute_redirect off;

        server {
            listen 8080;
            listen [::]:8080;
            server_name _;
            # Root level — file struct di image:
            #   /usr/share/nginx/html/perlengkapan/index.html         (redirect HTML)
            #   /usr/share/nginx/html/perlengkapan/simpel/index.html  (redirect HTML)
            #   /usr/share/nginx/html/perlengkapan/simpel/v2/index.html (WASM canonical)
            #   /usr/share/nginx/html/perlengkapan/simpel/v2/*.wasm,*.js,...
            root /usr/share/nginx/html;
            index index.html;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;

            # Canonical microfrontend mount point. SPA fallback ke index
            # canonical untuk client-side route Leptos (dashboard, login, dst).
            location /perlengkapan/simpel/v2/ {
                try_files $uri $uri/ /perlengkapan/simpel/v2/index.html;
            }

            # Parent paths -> meta-refresh HTML redirect ke canonical v2.
            location = /perlengkapan/ {
                try_files /perlengkapan/index.html =404;
            }
            location = /perlengkapan/simpel/ {
                try_files /perlengkapan/simpel/index.html =404;
            }

            # No-cache untuk semua index.html (canonical + redirect pages).
            location ~ ^/perlengkapan(/simpel(/v2)?)?/index\.html$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Pragma "no-cache" always;
                expires 0;
            }

            location ~* \.(wasm|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }
    }
{{- end }}
