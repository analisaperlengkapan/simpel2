{{- if and .Values.postgres.enabled .Values.postgres.init.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: {{ include "simpel.namespace" . }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "postgres" "component" "infrastructure") | nindent 4 }}
data:
  init-databases.sh: |
    #!/bin/bash
    # Idempotent: aman dijalankan ulang. Tidak hardcode password — secreton user
    # password diberikan via env $SECRETON_DB_PASSWORD.
    set -euo pipefail

    echo "=== Creating SIMPEL databases ==="
    {{- range $key, $db := .Values.secrets.postgresCredentials.databases }}
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -tAc \
      "SELECT 1 FROM pg_database WHERE datname='{{ $db }}'" | grep -q 1 \
      || psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE \"{{ $db }}\";"
    {{- end }}

    # F5-B topology: authenc + integrasi + perlengkapan share dbsimpelv2 and
    # connect as the $POSTGRES_USER (= postgresCredentials.username) superuser,
    # so they need no dedicated DB/user. Only secreton keeps its own isolated DB
    # + role. (Least-privilege per-schema roles for the dbsimpelv2 trio are a
    # documented future hardening — see F5-B plan guardrails.)
    echo "=== Ensuring per-service users ==="
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      DO \$\$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'secreton') THEN
          EXECUTE format('CREATE USER secreton WITH PASSWORD %L', '${SECRETON_DB_PASSWORD}');
        END IF;
      END
      \$\$;

      GRANT ALL PRIVILEGES ON DATABASE secreton TO secreton, "$POSTGRES_USER";
    EOSQL

    echo "=== Database initialization complete ==="
{{- end }}
