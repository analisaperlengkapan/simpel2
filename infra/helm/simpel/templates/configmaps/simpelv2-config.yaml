apiVersion: v1
kind: ConfigMap
metadata:
  name: simpelv2-config
  namespace: {{ include "simpel.namespace" . }}
  labels:
    {{- include "simpel.componentLabels" (dict "top" . "name" "simpelv2" "component" "config") | nindent 4 }}
data:
  RUST_LOG: {{ .Values.config.rustLog | quote }}
  APP_ENVIRONMENT: {{ .Values.config.appEnvironment | quote }}
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_VERSION: {{ .Values.config.appVersion | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  POSTGRES_HOST: {{ include "simpel.postgresHost" . | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  REDIS_URL: {{ include "simpel.redisUrl" . | quote }}
  ISTIO_ENABLED: {{ .Values.config.istioEnabled | quote }}
  MTLS_MODE: {{ include "simpel.mtlsMode" . | quote }}
  SESSION_TIMEOUT: {{ .Values.config.sessionTimeout | quote }}
  PORTAL_BASE_URL: {{ .Values.config.portalBaseUrl | quote }}
  JWT_ISSUER: {{ .Values.config.jwtIssuer | quote }}
  WEBAUTHN_RP_ID: {{ .Values.config.webauthn.rpId | quote }}
  WEBAUTHN_RP_ORIGIN: {{ .Values.config.webauthn.rpOrigin | quote }}
  WEBAUTHN_RP_NAME: {{ .Values.config.webauthn.rpName | quote }}
