# ⚠️  Template — JANGAN COMMIT versi terisi.
#     Salin ke values-secrets.yaml (gitignored), isi nilai asli, lalu apply
#     bersama values-<env>.yaml.
#
# Contoh:
#   cp infra/helm/simpel/values-secrets.example.yaml /tmp/values-secrets.yaml
#   $EDITOR /tmp/values-secrets.yaml
#   helm upgrade --install simpel infra/helm/simpel \
#     -f infra/helm/simpel/values-staging.yaml \
#     -f /tmp/values-secrets.yaml \
#     --set secrets.bootstrap=true \
#     --namespace simpelv2-staging --create-namespace
#
# Setelah Secreton SecretSync aktif, matikan bootstrap kembali:
#   helm upgrade simpel infra/helm/simpel ... --set secrets.bootstrap=false

secrets:
  bootstrap: true
  postgresCredentials:
    username: simpelv2
    password: REPLACE_ME
    databases:
      # F5-B topology: authenc + integrasi + perlengkapan share dbsimpelv2
      # (schema-per-service). secreton + simpelv1 isolated on their own DBs.
      simpelv2: dbsimpelv2
      simpelv1: dbsimpelv1
      secreton: secreton
  integration:
    SIMAN_BASE_URL: "https://apigateway.kemenkeu.go.id"
    SIMAN_TOKEN_URL: "https://sso.kemenkeu.go.id/connect/token"
    SIMAN_CLIENT_ID: REPLACE_ME
    SIMAN_CLIENT_SECRET: REPLACE_ME
    SIMAN_BA_KEY: REPLACE_ME
    MONSAKTI_BASE_URL: "https://monsakti.kemenkeu.go.id/sitp-monsakti-omspan/webservice"
    MONSAKTI_TOKEN_ADM: REPLACE_ME
    MONSAKTI_TOKEN_ANG: REPLACE_ME
    MONSAKTI_TOKEN_AST: REPLACE_ME
    MONSAKTI_TOKEN_BEN: REPLACE_ME
    MONSAKTI_TOKEN_GLP: REPLACE_ME
    MONSAKTI_TOKEN_KOM: REPLACE_ME
    MONSAKTI_TOKEN_PEM: REPLACE_ME
    MONSAKTI_TOKEN_PER: REPLACE_ME
    MYSIMKARI_BASE_URL: "https://mysimkari.kejaksaan.go.id/api/anbut"
    MYSIMKARI_TOKEN: REPLACE_ME
    MYSIMKARI_TOKEN_PEGAWAI: REPLACE_ME
  simpelv1:
    DB_USERNAME: REPLACE_ME
    DB_PASSWORD: REPLACE_ME
    APP_KEY: REPLACE_ME
    # WAJIB: kunci penanda-tangan guard `api` (driver jwt, config/auth.php).
    # config/jwt.php kini TIDAK punya default, jadi bila ini kosong simpelv1
    # gagal boot dengan pesan jelas — bukan diam-diam memakai secret publik.
    # Bangkitkan: `php artisan jwt:secret --show` (atau 32+ byte acak).
    JWT_SECRET: REPLACE_ME
