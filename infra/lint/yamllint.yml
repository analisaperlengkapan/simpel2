# yamllint config — minimal/permissive rules
# https://yamllint.readthedocs.io/

extends: default

rules:
  line-length:
    max: 200
    level: warning
  document-start: disable
  truthy:
    allowed-values: ['true', 'false', 'on', 'off']
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1

ignore: |
  node_modules/
  vendor/
  target/
  dist/
  .git/
  monolith/simpelv1/vendor/
  monolith/simpelv1/node_modules/
  monolith/simpelv1/public/assets/
  infra/helm/*/charts/
