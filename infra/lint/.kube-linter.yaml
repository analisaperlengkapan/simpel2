# kube-linter configuration — SIMPEL Helm chart (rendered-manifest lint).
#
# Used by the `helm-lint` job in .github/workflows/security.yml, which runs
# kube-linter against `helm template` OUTPUT (real K8s objects) — not raw
# templates — so checks see actual probes, resource limits, securityContext,
# image tags, etc.
#
# Status: BLOCKING — `helm-lint` is in the BLOCKING set of the Security Summary
# (#46, after the inventory was cleared to 0 in #540). Any finding fails the
# build, so chart regressions (missing probes, latest tags, no resource limits,
# dropped securityContext) cannot merge. Per-object false positives are
# suppressed in-template via `ignore-check.kube-linter.io/<check>` annotations
# (with a rationale), not here; this `exclude` list stays empty unless a whole
# check is intentionally retired chart-wide.
checks:
  # Run kube-linter's default recommended check set.
  doNotAutoAddDefaults: false
  # Chart-wide retired checks go here with a one-line rationale. Prefer
  # per-object annotation suppression over a blanket exclude.
  exclude: []
