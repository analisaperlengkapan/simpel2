# Logrotate configuration for SIMPEL
# Requirements: NFR-M002

# Global options
compress
delaycompress
notifempty
missingok
dateext
dateformat -%Y%m%d-%s

# Application logs
/var/log/simpelv2/*.log {
    daily
    rotate 30
    maxage 30
    size 100M
    create 0644 simpelv2 simpelv2
    sharedscripts
    postrotate
        # Send SIGHUP to application to reopen log files
        systemctl reload simpelv2-api || true
        systemctl reload simpelv2-integrasi || true
    endscript
}

# Nginx access logs
/var/log/nginx/simpelv2-access.log {
    daily
    rotate 14
    maxage 14
    size 500M
    create 0644 nginx nginx
    sharedscripts
    postrotate
        nginx -s reopen
    endscript
}

# Nginx error logs
/var/log/nginx/simpelv2-error.log {
    daily
    rotate 30
    maxage 30
    size 100M
    create 0644 nginx nginx
    sharedscripts
    postrotate
        nginx -s reopen
    endscript
}

# PostgreSQL logs
/var/log/postgresql/postgresql-*.log {
    daily
    rotate 30
    maxage 30
    size 100M
    create 0640 postgres postgres
    sharedscripts
    postrotate
        systemctl reload postgresql || true
    endscript
}

# Redis logs
/var/log/redis/redis-server.log {
    daily
    rotate 14
    maxage 14
    size 50M
    create 0640 redis redis
    sharedscripts
    postrotate
        systemctl reload redis || true
    endscript
}

# Fluentd logs
/var/log/td-agent/td-agent.log {
    daily
    rotate 14
    maxage 14
    size 100M
    create 0644 td-agent td-agent
    sharedscripts
    postrotate
        systemctl reload td-agent || true
    endscript
}
