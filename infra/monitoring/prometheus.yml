# Prometheus configuration for SIMPEL monitoring
# Requirements: NFR-M004

global:
  scrape_interval: 15s # Scrape targets every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'simpelv2'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Perlengkapan API service
  - job_name: 'perlengkapan-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['layanan-perlengkapan:8093']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'perlengkapan-api'

  # Integration service
  - job_name: 'integrasi'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['layanan-perlengkapan-integrasi:8094']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'integrasi'

  # Authenc service
  - job_name: 'authenc'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['authenc:9090']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'authenc'

  # Secreton service
  - job_name: 'secreton'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['secreton:9090']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'secreton'

  # PostgreSQL exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres'

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis'

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'node'

  # Kubernetes service discovery (if running in K8s)
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      # Only scrape pods with prometheus.io/scrape annotation
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      # Use custom metrics path if specified
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      # Use custom port if specified
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # Add pod metadata as labels
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
