# Fluentd configuration for log aggregation
# Requirements: NFR-M002

# Input from Docker containers
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Input from application log files
<source>
  @type tail
  path /var/log/simpelv2/*.log
  pos_file /var/log/td-agent/simpelv2.log.pos
  tag simpelv2.*
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

# Filter to add common fields
<filter simpelv2.**>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    environment "#{ENV['ENVIRONMENT'] || 'production'}"
    cluster "simpelv2"
  </record>
</filter>

# Filter to parse structured logs
<filter simpelv2.**>
  @type parser
  key_name message
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

# Output to Elasticsearch
<match simpelv2.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix simpelv2
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  type_name _doc
  tag_key @log_name
  flush_interval 10s

  # Retry configuration
  <buffer>
    @type file
    path /var/log/td-agent/buffer/simpelv2
    flush_mode interval
    retry_type exponential_backoff
    flush_thread_count 2
    flush_interval 5s
    retry_forever false
    retry_max_interval 30
    chunk_limit_size 2M
    queue_limit_length 8
    overflow_action block
  </buffer>
</match>

# Output to file for backup
<match simpelv2.**>
  @type file
  path /var/log/simpelv2/backup/${tag}/%Y%m%d
  compress gzip
  <buffer tag,time>
    @type file
    path /var/log/td-agent/buffer/backup
    timekey 86400
    timekey_wait 10m
    flush_mode interval
    flush_interval 10s
  </buffer>
</match>

# Monitoring metrics
<source>
  @type monitor_agent
  bind 0.0.0.0
  port 24220
</source>
