# Alertmanager configuration for SIMPelv2
# Requirements: NFR-M004

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@simpelv2.kejaksaan.go.id'
  smtp_auth_username: 'alerts@simpelv2.kejaksaan.go.id'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alert routing
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'

  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m

    # Warning alerts - grouped notification
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 1h

    # Integration alerts
    - match:
        alertname: IntegrationSyncFailures
      receiver: 'integration-team'
      repeat_interval: 30m

    # Workflow alerts
    - match:
        alertname: WorkflowSLABreaches
      receiver: 'workflow-team'
      repeat_interval: 15m

# Receivers for different alert types
receivers:
  - name: 'default'
    email_configs:
      - to: 'ops@simpelv2.kejaksaan.go.id'
        headers:
          Subject: '[SIMPelv2] {{ .GroupLabels.alertname }}'
        html: |
          <h2>Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
          <p><strong>Time:</strong> {{ .StartsAt }}</p>

  - name: 'critical-alerts'
    email_configs:
      - to: 'ops@simpelv2.kejaksaan.go.id,admin@simpelv2.kejaksaan.go.id'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        html: |
          <h2 style="color: red;">CRITICAL ALERT: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
          <p><strong>Time:</strong> {{ .StartsAt }}</p>
          <p><strong>Action Required:</strong> Immediate investigation needed</p>

  - name: 'warning-alerts'
    email_configs:
      - to: 'ops@simpelv2.kejaksaan.go.id'
        headers:
          Subject: '[WARNING] {{ .GroupLabels.alertname }}'

  - name: 'integration-team'
    email_configs:
      - to: 'integration-team@simpelv2.kejaksaan.go.id'
        headers:
          Subject: '[Integration] {{ .GroupLabels.alertname }}'

  - name: 'workflow-team'
    email_configs:
      - to: 'workflow-team@simpelv2.kejaksaan.go.id'
        headers:
          Subject: '[Workflow] {{ .GroupLabels.alertname }}'

# Inhibition rules to prevent alert spam
inhibit_rules:
  # Inhibit warning if critical is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # Inhibit specific alerts if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '(HighHTTPErrorRate|SlowHTTPRequests|HighMemoryUsage)'
    equal: ['instance']
