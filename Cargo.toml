[workspace]
resolver = "2"

# All Rust crates (microfrontends, microservices, secreton, libs) are part of
# this single workspace, sharing one Cargo.lock for unified dependency
# resolution and cache.

members = [
  # Shared Libraries
  "lib/ui",
  "lib/core",
  "lib/backend",
  "lib/crypto",
  "lib/perlengkapan",

  # Production Microfrontends (Leptos WASM)
  "antarmuka/portal",
  "antarmuka/perlengkapan",

  # Perlengkapan Backend (unified crate)
  "layanan/perlengkapan",
  "layanan/integrasi",

  # Infrastructure Services
  # "layanan/authenc",  # Legacy - migrated to crates/
  "layanan/secreton",

  # Authenc sub-crates (10 crates)
  "layanan/authenc/crates/types",
  "layanan/authenc/crates/core",
  "layanan/authenc/crates/crypto",
  "layanan/authenc/crates/storage",
  "layanan/authenc/crates/api",
  "layanan/authenc/crates/iam-api",
  "layanan/authenc/crates/grpc",
  "layanan/authenc/crates/mfa",
  "layanan/authenc/crates/federation",
  "layanan/authenc/crates/webauthn",

  # Secreton sub-crates
  "layanan/secreton/crates/core",
  "layanan/secreton/crates/api",
  "layanan/secreton/crates/storage",
  "layanan/secreton/crates/crypto",
  "layanan/secreton/crates/types",
  "layanan/secreton/crates/agent",
  "layanan/secreton/crates/cli",
  "layanan/secreton/crates/grpc",
  "layanan/secreton/crates/hsm",
  "layanan/secreton/crates/k8s-operator",
  "layanan/secreton/crates/auto-unseal",
  "layanan/secreton/crates/health",
  "layanan/secreton/crates/backup",
  "layanan/secreton/crates/replication",
]

default-members = [
  "antarmuka/portal",
  "antarmuka/perlengkapan",
  "layanan/perlengkapan",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["SIMPEL Team"]
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# Axum Backend Dependencies - Latest Stable
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.6.11", features = [
  "cors",
  "trace",
  "limit",
  "auth",
  "fs",
  "compression-gzip",
  "timeout",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "fmt",
  "std",
  "tracing-log",
  "ansi",
] }
# Backend-only features for `tracing-subscriber`. Member crates that need
# env-filter / JSON output (i.e. non-WASM services) MUST opt in explicitly
# via `features = ["env-filter", "json"]` in their own Cargo.toml.
# Rationale: Cargo unions features from `[workspace.dependencies]` with
# member-level features; a member crate cannot *remove* a feature set at
# the workspace level. Keeping the workspace entry minimal lets WASM crates
# (`antarmuka/portal`, `antarmuka/perlengkapan`) avoid pulling `regex`
# (from `env-filter`) and `tracing-serde` (from `json`) into the bundle.
uuid = { version = "1.23.2", features = ["v4", "serde", "js"] }
time = { version = "0.3.47", features = ["serde", "macros"] }
chrono = { version = "0.4.44", features = ["serde"] }
tokio-cron-scheduler = "0.15.1"
anyhow = "1.0.102"
thiserror = "2.0.18"
dotenvy = "0.15.7"                                              # Maintained fork of dotenv

# PostgreSQL Database Dependencies (Optimized for security & performance)
tokio-postgres = { version = "0.7.17", features = [
  "with-uuid-1",
  "with-chrono-0_4",
  "with-serde_json-1",
  "with-time-0_3",
] }
deadpool-postgres = { version = "0.14.1", features = ["serde"] }
postgres-types = { version = "0.2.13", features = [
  "derive",
  "with-uuid-1",
  "with-chrono-0_4",
  "with-serde_json-1",
  "with-time-0_3",
] }
refinery = { version = "0.9.1", features = ["tokio-postgres"] }
sea-query = { version = "0.32.7", features = [
  "postgres-array",
  "with-chrono",
  "with-uuid",
] }

# Security & Authentication (Updated for latest security)
# Ed25519 preferred over RSA for better security and performance
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", default-features = false, features = [
  "aws_lc_rs",
  "use_pem",
] } # Updated to v10 with aws_lc_rs backend
oauth2 = "5.0.0"
rand = { version = "0.8.5", features = [
  "std",
  "std_rng",
] } # Pinned to 0.8.5 for crypto ecosystem compatibility (rand_core 0.6)
ed25519-dalek = { version = "2.2.0", features = [
  "rand_core",
  "serde",
] } # Primary signing algorithm (preferred over RSA)
x25519-dalek = { version = "2.0.1", features = [
  "serde",
  "static_secrets",
] } # Key exchange

# WebAuthn/Passkeys (MANDATORY - PRIMARY authentication method)
webauthn-rs = { version = "0.5.4", features = [
  "danger-allow-state-serialisation",
] }
webauthn-rs-proto = "0.5.4"

# Note: No external vault dependencies (using internal Secreton system)
# vaultrs removed - we use our own Secreton implementation

# Note: Removed paste/pastey - using inline macros instead (paste is unmaintained)

# Frontend Shared Dependencies
lib-ui = { path = "lib/ui" }
lib-core = { path = "lib/core" }
lib-backend = { path = "lib/backend" }
lib-crypto = { path = "lib/crypto" }
lib-perlengkapan = { path = "lib/perlengkapan" }
regex = "1.12.3"
urlencoding = "2.1.3"

# Database & Caching (Updated)
redis = { version = "0.32.7", features = [
  "tokio-comp",
  "connection-manager",
  "aio",
] }
mongodb = "3.6.0"

# Message Queue & Event Streaming
amqprs = { version = "2.1.5", features = ["tls"] }
tokio-stream = "0.1.18"

# Configuration & Templates (Updated)
config = { version = "0.15.23", default-features = false, features = [
  "toml",
  "json",
  "yaml",
  "ini",
  "ron",
  "convert-case",
  "async",
] } # Drop json5 feature to avoid unmaintained dependency

# HTTP Client - Unified version
reqwest = { version = "0.13.2", features = [
  "json",
  "multipart",
  "stream",
  "rustls",
  "form",
  "cookies",
  "query",
], default-features = false }
# NOTE: ureq removed - using async-only reqwest per PR #211 optimization

# Validation & Serialization - Updated for security (removes idna vulnerability)
garde = { version = "0.22.1", features = [
  "derive",
  "serde",
] } # Modern validator replacement (no idna dependency)
validator = { version = "0.20.0", features = [
  "derive",
] } # Legacy validator (kept for datun compatibility)

# Monitoring & Observability (Updated to latest)
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.1", features = ["tonic", "tls"] }
prometheus = "0.14.0"
sentry = { version = "0.47.0", features = ["tracing"] }
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
tracing-opentelemetry = "0.32.1"

# Email and Notifications
lettre = { version = "0.11.22", default-features = false, features = [
  "tokio1-rustls-tls",
  "smtp-transport",
  "builder",
  "hostname",
