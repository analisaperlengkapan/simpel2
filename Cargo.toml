[workspace]
resolver = "2"
members = [
    # Frontend Shared Library
    "antarmuka/shared",

    # Frontend Microfrontends (Leptos)
    "antarmuka/badiklat",
    "antarmuka/datun",
    "antarmuka/intel",
    "antarmuka/pemulihan_aset",
    "antarmuka/pengawasan",
    "antarmuka/pidmil",
    "antarmuka/pidsus",
    "antarmuka/pidum",
    "antarmuka/portal",

    # Pembinaan Microfrontends
    "antarmuka/pembinaan/keuangan",
    "antarmuka/pembinaan/perencanaan",
    "antarmuka/pembinaan/perlengkapan",

    # Backend Layanan Utama
    "layanan/badiklat",
    "layanan/datun",
    "layanan/intel",
    "layanan/pemulihan_aset",
    "layanan/pengawasan",
    "layanan/pidmil",
    "layanan/pidsus",
    "layanan/pidum",

    # Backend Layanan Pembinaan
    "layanan/pembinaan/perlengkapan",

    # Backend Shared Layanan
    # "layanan/shared/ai",      # Temporarily disabled - migrating from SQLx
    "layanan/shared/bantuan",
    "layanan/shared/dasbor",
    # "layanan/shared/dokumen", # Temporarily disabled - migrating from SQLx
    "layanan/shared/integrasi",
    "layanan/shared/keamanan",
    "layanan/shared/konfigurasi",
    "layanan/shared/laporan",
    "layanan/shared/notifikasi",
]

[workspace.dependencies]
# Axum Backend Dependencies - Latest Stable
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "auth", "fs", "compression-gzip", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.10", features = ["v4", "serde", "js"] }
time = { version = "0.3", features = ["serde", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"

# PostgreSQL Database Dependencies (Optimized for security & performance)
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1", "with-time-0_3"] }
deadpool-postgres = { version = "0.14", features = ["serde"] }
postgres-types = { version = "0.2", features = ["derive", "with-uuid-1", "with-chrono-0_4", "with-serde_json-1", "with-time-0_3"] }
refinery = { version = "0.8", features = ["tokio-postgres"] }

# Additional PostgreSQL utilities (optional)
# sea-query = { version = "0.31", features = ["postgres-array", "with-chrono", "with-uuid"] }  # Query builder if needed

# Security & Authentication
argon2 = "0.5"
jsonwebtoken = "9.3"
oauth2 = "4.4"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

# Vault Integration
vaultrs = "0.7"

# Proc Macro Dependencies (secure alternatives)
syn = { version = "2.0", features = ["full", "parsing", "printing", "proc-macro"] }
quote = "1.0"
proc-macro2 = "1.0"
pastey = "0.1"  # Maintained fork of paste crate (replaces unmaintained paste)

# Frontend Shared Dependencies
shared-microfrontend = { path = "antarmuka/shared" }
regex = "1.10"
urlencoding = "2.1"

# Database & Caching
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
mongodb = "2.8"

# Message Queue & Event Streaming
amqprs = { version = "2.0", features = ["tls"] }
tokio-stream = "0.1"

# Configuration & Templates
config = "0.14"
tera = "1.20"

# HTTP Client - Unified version
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"], default-features = false }

# Validation & Serialization - Updated for security
garde = { version = "0.22", features = ["derive", "serde"] }  # Modern validator replacement

# Monitoring & Observability
opentelemetry = "0.21"
opentelemetry-otlp = { version = "0.14", features = ["tonic", "tls"] }
prometheus = "0.14"
sentry = { version = "0.32", features = ["tracing"] }
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

# Email and Notifications
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

# Template Engine and Utilities
base64 = "0.22"
hex = "0.4"

# Cryptography
aes-gcm = { version = "0.10", features = ["aes"] }
sha2 = "0.10"
hmac = "0.12"

# TOTP for MFA
totp-lite = "2.0"

# QR Code generation
qrcode = { version = "0.14", features = ["svg"] }

# Base32 encoding
base32 = "0.5"

# Leptos Frontend Dependencies - Latest Available Stable
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_dom = { version = "0.8" }
leptos_macro = { version = "0.8" }
server_fn = { version = "0.8" }

# WASM specific - Latest Stable Versions
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
gloo-net = { version = "0.6", features = ["http"] }
gloo-utils = "0.2"
web-sys = { version = "0.3", features = [
    "HtmlInputElement",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "Navigator",
    "Location",
    "History",
    "Storage",
    "console",
    "Blob",
    "BlobPropertyBag",
    "Url"
] }
gloo-console = "0.3"
gloo-storage = "0.3"

# Utilities
futures = "0.3"
async-trait = "0.1"

# Additional dependencies
axum-server = { version = "0.7", features = ["tls-rustls"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
bytes = "1.7"

# AI and ML Dependencies
qdrant-client = "1.11"
tiktoken-rs = "0.5"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }

# Development Dependencies
tokio-test = "0.4"

[workspace.metadata.leptos]
# Leptos configuration for all frontend projects
output-name = "main"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
style-file = "style/main.scss"
tailwind-input-file = "style/tailwind.css"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Performance optimization profiles
[profile.dev]
# Faster compile times for development
opt-level = 1            # Light optimization for better dev experience
debug = true
incremental = true
codegen-units = 256      # Parallel compilation
lto = "thin"            # Thin LTO for faster incremental builds

[profile.release]
# Maximum optimization for production
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false   # Disable overflow checks in release

# Optimized profile for WASM builds
[profile.release-wasm]
inherits = "release"
opt-level = "z"          # Maximum size optimization
debug = false            # Reduce WASM debug size
lto = "fat"              # Full LTO for maximum optimization
panic = "abort"
strip = true
codegen-units = 1

# Fast development builds for WASM
[profile.dev-wasm]
inherits = "dev"
opt-level = 1           # Light optimization for dev
debug = false           # Reduce debug size in dev
lto = "thin"           # Thin LTO for balance

# Note: Security optimizations applied
# - SQLx configured for PostgreSQL only (no MySQL/RSA dependencies)
# - Most dependencies updated to secure versions
# - idna 0.5.0 vulnerability persists via validator 0.18.1 (waiting for upstream fix)
